<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 420">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4B8BDA"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="300" y="38" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="18" font-weight="600" fill="#1E3A5F">Git Worktree 并行隔离</text>
  <text x="300" y="60" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#3D4F65">共享 .git 元数据，独立工作目录</text>

  <!-- Shared .git core -->
  <circle cx="300" cy="230" r="55" fill="#FFF1E0" stroke="#E0A060" stroke-width="2"/>
  <text x="300" y="226" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#1E3A5F">.git shared</text>
  <text x="300" y="244" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#3D4F65">(metadata)</text>

  <!-- top-left -->
  <rect x="60" y="100" width="140" height="70" rx="8" fill="#EFF6FF" stroke="#4B8BDA" stroke-width="1.8"/>
  <text x="130" y="132" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#1E3A5F">Agent 1 · worktree A</text>
  <text x="130" y="152" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#3D4F65">独立目录，跑评测</text>

  <!-- top-right -->
  <rect x="400" y="100" width="140" height="70" rx="8" fill="#EFF6FF" stroke="#4B8BDA" stroke-width="1.8"/>
  <text x="470" y="132" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#1E3A5F">Agent 2 · worktree B</text>
  <text x="470" y="152" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#3D4F65">独立目录，跑评测</text>

  <!-- bottom-left -->
  <rect x="60" y="290" width="140" height="70" rx="8" fill="#EFF6FF" stroke="#4B8BDA" stroke-width="1.8"/>
  <text x="130" y="322" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#1E3A5F">Agent 3 · worktree C</text>
  <text x="130" y="342" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#3D4F65">独立目录，跑评测</text>

  <!-- bottom-right -->
  <rect x="400" y="290" width="140" height="70" rx="8" fill="#EFF6FF" stroke="#4B8BDA" stroke-width="1.8"/>
  <text x="470" y="322" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#1E3A5F">Agent 4 · worktree D</text>
  <text x="470" y="342" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#3D4F65">独立目录，跑评测</text>

  <!-- Arrows from .git to worktrees -->
  <line x1="258" y1="205" x2="205" y2="165" stroke="#4B8BDA" stroke-width="1.8" marker-end="url(#a)"/>
  <line x1="342" y1="205" x2="395" y2="165" stroke="#4B8BDA" stroke-width="1.8" marker-end="url(#a)"/>
  <line x1="258" y1="255" x2="205" y2="295" stroke="#4B8BDA" stroke-width="1.8" marker-end="url(#a)"/>
  <line x1="342" y1="255" x2="395" y2="295" stroke="#4B8BDA" stroke-width="1.8" marker-end="url(#a)"/>

  <!-- Speedup callout -->
  <text x="300" y="395" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#C8602C">70h → 20h  (≈ 3.5× 加速，4 并行)</text>
</svg>