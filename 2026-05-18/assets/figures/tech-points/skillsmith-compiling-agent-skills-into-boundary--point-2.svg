<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 460" font-family="-apple-system, Helvetica, Arial, sans-serif">
  <text x="360" y="38" font-size="18" font-weight="600" fill="#1E3A5F" text-anchor="middle">Skill 形态各异 → 因形而译</text>
  <text x="360" y="60" font-size="12" fill="#3D4F65" text-anchor="middle">不强塞同一种 IR</text>

  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4B8BDA"/>
    </marker>
  </defs>

  <!-- Source skill -->
  <g>
    <rect x="40" y="190" width="160" height="100" rx="10" fill="#EFF6FF" stroke="#4B8BDA" stroke-width="1.5"/>
    <text x="120" y="220" font-size="13" font-weight="600" fill="#1E3A5F" text-anchor="middle">SKILL.md</text>
    <text x="120" y="242" font-size="11" fill="#3D4F65" text-anchor="middle">源形分类</text>
    <text x="120" y="262" font-size="10" fill="#7A8A9F" text-anchor="middle">structure + LLM</text>
  </g>

  <!-- Workflow -->
  <g>
    <rect x="280" y="90" width="220" height="80" rx="10" fill="#FEF3E7" stroke="#E89B4C" stroke-width="1.5"/>
    <text x="320" y="118" font-size="13" font-weight="600" fill="#1E3A5F" text-anchor="middle">Workflow</text>
    <circle cx="305" cy="145" r="6" fill="#E89B4C"/>
    <line x1="311" y1="145" x2="329" y2="145" stroke="#E89B4C" stroke-width="2"/>
    <circle cx="335" cy="145" r="6" fill="#E89B4C"/>
    <line x1="341" y1="145" x2="359" y2="145" stroke="#E89B4C" stroke-width="2"/>
    <circle cx="365" cy="145" r="6" fill="#E89B4C"/>
    <text x="440" y="135" font-size="11" fill="#3D4F65" text-anchor="middle">步骤图</text>
    <text x="440" y="155" font-size="10" fill="#7A8A9F" text-anchor="middle">顺序流程</text>
  </g>

  <!-- Dispatcher -->
  <g>
    <rect x="280" y="200" width="220" height="80" rx="10" fill="#EAF4EC" stroke="#5BA877" stroke-width="1.5"/>
    <text x="320" y="228" font-size="13" font-weight="600" fill="#1E3A5F" text-anchor="middle">Dispatcher</text>
    <rect x="295" y="245" width="18" height="18" rx="3" fill="#5BA877"/>
    <rect x="320" y="245" width="18" height="18" rx="3" fill="#5BA877"/>
    <rect x="345" y="245" width="18" height="18" rx="3" fill="#5BA877"/>
    <text x="440" y="245" font-size="11" fill="#3D4F65" text-anchor="middle">算子注册表</text>
    <text x="440" y="265" font-size="10" fill="#7A8A9F" text-anchor="middle">独立工具集</text>
  </g>

  <!-- Reference -->
  <g>
    <rect x="280" y="310" width="220" height="80" rx="10" fill="#F0EAF6" stroke="#8B6FB5" stroke-width="1.5"/>
    <text x="320" y="338" font-size="13" font-weight="600" fill="#1E3A5F" text-anchor="middle">Reference</text>
    <line x1="295" y1="358" x2="365" y2="358" stroke="#8B6FB5" stroke-width="1.5"/>
    <line x1="295" y1="368" x2="355" y2="368" stroke="#8B6FB5" stroke-width="1.5"/>
    <line x1="295" y1="378" x2="365" y2="378" stroke="#8B6FB5" stroke-width="1.5"/>
    <text x="440" y="355" font-size="11" fill="#3D4F65" text-anchor="middle">检索索引</text>
    <text x="440" y="375" font-size="10" fill="#7A8A9F" text-anchor="middle">参考散文</text>
  </g>

  <!-- Arrows -->
  <path d="M200,215 Q240,180 278,135" stroke="#4B8BDA" stroke-width="1.8" fill="none" marker-end="url(#arr)"/>
  <path d="M200,240 L278,240" stroke="#4B8BDA" stroke-width="1.8" fill="none" marker-end="url(#arr)"/>
  <path d="M200,265 Q240,310 278,345" stroke="#4B8BDA" stroke-width="1.8" fill="none" marker-end="url(#arr)"/>

  <!-- Right side compiled artifact label -->
  <g>
    <rect x="540" y="210" width="150" height="60" rx="8" fill="#F7F9FC" stroke="#B5C2D4" stroke-width="1.2" stroke-dasharray="4 3"/>
    <text x="615" y="234" font-size="11" font-weight="600" fill="#1E3A5F" text-anchor="middle">编译产物</text>
    <text x="615" y="252" font-size="10" fill="#7A8A9F" text-anchor="middle">thin compiled artifact</text>
  </g>
  <path d="M500,240 L538,240" stroke="#B5C2D4" stroke-width="1.5" fill="none" marker-end="url(#arr)"/>

  <text x="360" y="430" font-size="11" fill="#7A8A9F" text-anchor="middle" font-style="italic">一种 skill 一种 lowering，避免信息丢失</text>
</svg>