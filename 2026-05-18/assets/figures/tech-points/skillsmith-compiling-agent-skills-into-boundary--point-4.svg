<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4B8BDA"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="300" y="38" text-anchor="middle" font-family="Helvetica,Arial" font-size="17" font-weight="600" fill="#1E3A5F">强模型编译 · 弱模型复用</text>

  <!-- Strong model -->
  <circle cx="110" cy="190" r="55" fill="#FFE8D6" stroke="#D98B5F" stroke-width="2"/>
  <text x="110" y="185" text-anchor="middle" font-family="Helvetica,Arial" font-size="14" font-weight="600" fill="#1E3A5F">Opus</text>
  <text x="110" y="205" text-anchor="middle" font-family="Helvetica,Arial" font-size="11" fill="#3D4F65">编译期</text>
  <text x="110" y="270" text-anchor="middle" font-family="Helvetica,Arial" font-size="11" fill="#3D4F65">理解 SKILL.md</text>

  <!-- Compiled artifact -->
  <rect x="240" y="155" width="120" height="70" rx="6" fill="#EFF6FF" stroke="#4B8BDA" stroke-width="2"/>
  <text x="300" y="182" text-anchor="middle" font-family="Helvetica,Arial" font-size="13" font-weight="600" fill="#1E3A5F">Boundary Artifact</text>
  <text x="300" y="205" text-anchor="middle" font-family="Helvetica,Arial" font-size="10" fill="#3D4F65">凝固的接口</text>

  <!-- Small models -->
  <circle cx="490" cy="130" r="28" fill="#E8F1FB" stroke="#4B8BDA" stroke-width="1.5"/>
  <text x="490" y="134" text-anchor="middle" font-family="Helvetica,Arial" font-size="10" fill="#1E3A5F">GPT-5.5</text>

  <circle cx="510" cy="200" r="28" fill="#E8F1FB" stroke="#4B8BDA" stroke-width="1.5"/>
  <text x="510" y="204" text-anchor="middle" font-family="Helvetica,Arial" font-size="10" fill="#1E3A5F">DeepSeek</text>

  <circle cx="490" cy="270" r="28" fill="#E8F1FB" stroke="#4B8BDA" stroke-width="1.5"/>
  <text x="490" y="274" text-anchor="middle" font-family="Helvetica,Arial" font-size="10" fill="#1E3A5F">Qwen3.6</text>

  <text x="495" y="325" text-anchor="middle" font-family="Helvetica,Arial" font-size="11" fill="#3D4F65">运行时 · 直接调用</text>

  <!-- Arrows: compile -->
  <line x1="168" y1="190" x2="237" y2="190" stroke="#4B8BDA" stroke-width="2" marker-end="url(#a)"/>
  <text x="202" y="180" text-anchor="middle" font-family="Helvetica,Arial" font-size="10" fill="#3D4F65">编译</text>

  <!-- Arrows: artifact to small models -->
  <line x1="362" y1="170" x2="461" y2="138" stroke="#4B8BDA" stroke-width="1.8" marker-end="url(#a)"/>
  <line x1="362" y1="190" x2="481" y2="198" stroke="#4B8BDA" stroke-width="1.8" marker-end="url(#a)"/>
  <line x1="362" y1="210" x2="461" y2="262" stroke="#4B8BDA" stroke-width="1.8" marker-end="url(#a)"/>

  <!-- Bottom note -->
  <text x="300" y="370" text-anchor="middle" font-family="Helvetica,Arial" font-size="11" fill="#1E3A5F" font-style="italic">弱模型站在强模型肩膀上 — raw 失败 → 编译后通过</text>
</svg>