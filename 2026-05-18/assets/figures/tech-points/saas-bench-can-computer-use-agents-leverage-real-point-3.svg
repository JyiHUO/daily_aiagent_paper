<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 420" font-family="-apple-system,Helvetica,Arial,sans-serif">
  <rect width="600" height="420" fill="#FAF7F2"/>
  
  <text x="300" y="38" text-anchor="middle" font-size="16" font-weight="600" fill="#1E3A5F">长程任务 · 加权 Checkpoint</text>

  <!-- Checkpoint chain -->
  <g>
    <circle cx="80" cy="140" r="20" fill="#D4E8C9" stroke="#6BA368" stroke-width="2"/>
    <text x="80" y="145" text-anchor="middle" font-size="14" fill="#1E3A5F">✓</text>
    <text x="80" y="178" text-anchor="middle" font-size="10" fill="#3D4F65">State</text>

    <circle cx="170" cy="140" r="20" fill="#D4E8C9" stroke="#6BA368" stroke-width="2"/>
    <text x="170" y="145" text-anchor="middle" font-size="14" fill="#1E3A5F">✓</text>
    <text x="170" y="178" text-anchor="middle" font-size="10" fill="#3D4F65">Content</text>

    <circle cx="260" cy="140" r="20" fill="#D4E8C9" stroke="#6BA368" stroke-width="2"/>
    <text x="260" y="145" text-anchor="middle" font-size="14" fill="#1E3A5F">✓</text>
    <text x="260" y="178" text-anchor="middle" font-size="10" fill="#3D4F65">LLM-Judge</text>

    <circle cx="350" cy="140" r="22" fill="#FCE4DE" stroke="#D9645A" stroke-width="2.5"/>
    <text x="350" y="146" text-anchor="middle" font-size="16" fill="#D9645A" font-weight="700">✗</text>
    <text x="350" y="180" text-anchor="middle" font-size="10" fill="#D9645A">日期错1天</text>

    <circle cx="440" cy="140" r="20" fill="#D4E8C9" stroke="#6BA368" stroke-width="2"/>
    <text x="440" y="145" text-anchor="middle" font-size="14" fill="#1E3A5F">✓</text>

    <circle cx="520" cy="140" r="20" fill="#D4E8C9" stroke="#6BA368" stroke-width="2"/>
    <text x="520" y="145" text-anchor="middle" font-size="14" fill="#1E3A5F">✓</text>

    <!-- chain line -->
    <line x1="100" y1="140" x2="150" y2="140" stroke="#4B8BDA" stroke-width="2"/>
    <line x1="190" y1="140" x2="240" y2="140" stroke="#4B8BDA" stroke-width="2"/>
    <line x1="280" y1="140" x2="328" y2="140" stroke="#4B8BDA" stroke-width="2"/>
    <line x1="372" y1="140" x2="420" y2="140" stroke="#4B8BDA" stroke-width="2"/>
    <line x1="460" y1="140" x2="500" y2="140" stroke="#4B8BDA" stroke-width="2"/>
  </g>

  <text x="300" y="232" text-anchor="middle" font-size="11" fill="#3D4F65" font-style="italic">同一次执行 · 双视角评分</text>

  <!-- arrows down -->
  <line x1="200" y1="162" x2="180" y2="262" stroke="#4B8BDA" stroke-width="1.5" stroke-dasharray="3,3"/>
  <polygon points="180,268 175,258 185,258" fill="#4B8BDA"/>

  <line x1="350" y1="165" x2="420" y2="262" stroke="#D9645A" stroke-width="1.5" stroke-dasharray="3,3"/>
  <polygon points="420,268 414,260 423,255" fill="#D9645A"/>

  <!-- Two metrics -->
  <g>
    <rect x="60" y="270" width="220" height="110" rx="10" fill="#EFF6FF" stroke="#4B8BDA" stroke-width="1.5"/>
    <text x="170" y="296" text-anchor="middle" font-size="13" font-weight="600" fill="#1E3A5F">Checkpoint Score</text>
    <text x="170" y="338" text-anchor="middle" font-size="32" font-weight="700" fill="#4B8BDA">0.80</text>
    <text x="170" y="362" text-anchor="middle" font-size="10" fill="#3D4F65">按权重 · 走到哪一步</text>

    <rect x="320" y="270" width="220" height="110" rx="10" fill="#FCE4DE" stroke="#D9645A" stroke-width="1.5"/>
    <text x="430" y="296" text-anchor="middle" font-size="13" font-weight="600" fill="#1E3A5F">Resolved Score</text>
    <text x="430" y="338" text-anchor="middle" font-size="32" font-weight="700" fill="#D9645A">0</text>
    <text x="430" y="362" text-anchor="middle" font-size="10" fill="#3D4F65">全过才得分 · 一票否决</text>
  </g>
</svg>