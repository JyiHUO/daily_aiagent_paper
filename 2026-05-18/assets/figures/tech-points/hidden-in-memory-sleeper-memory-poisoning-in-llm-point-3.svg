<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 420" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4B8BDA"/>
    </marker>
  </defs>

  <text x="300" y="38" text-anchor="middle" font-size="18" font-weight="700" fill="#1E3A5F">Three Stages — All Survive</text>
  <text x="300" y="58" text-anchor="middle" font-size="12" fill="#3D4F65">poison doesn't decay across the pipeline</text>

  <!-- Stage 1: Inject -->
  <g>
    <rect x="40" y="110" width="150" height="180" rx="10" fill="#EFF6FF" stroke="#4B8BDA" stroke-width="1.5"/>
    <text x="115" y="138" text-anchor="middle" font-size="13" font-weight="700" fill="#1E3A5F">Inject (IR)</text>
    <text x="115" y="158" text-anchor="middle" font-size="10" fill="#3D4F65">written to memory</text>
    <rect x="65" y="195" width="100" height="22" fill="#DCE7F2"/>
    <rect x="65" y="195" width="74" height="22" fill="#4B8BDA"/>
    <text x="115" y="212" text-anchor="middle" font-size="12" font-weight="700" fill="#FFFFFF">~74%</text>
    <text x="115" y="245" text-anchor="middle" font-size="10" fill="#3D4F65">from a single document</text>
  </g>

  <!-- Stage 2: Retrieve -->
  <g>
    <rect x="225" y="110" width="150" height="180" rx="10" fill="#FFF4E6" stroke="#E89B4B" stroke-width="1.5"/>
    <text x="300" y="138" text-anchor="middle" font-size="13" font-weight="700" fill="#1E3A5F">Retrieve (RR)</text>
    <text x="300" y="158" text-anchor="middle" font-size="10" fill="#3D4F65">recalled in new chat</text>
    <rect x="250" y="195" width="100" height="22" fill="#F4E2CC"/>
    <rect x="250" y="195" width="96" height="22" fill="#E89B4B"/>
    <text x="300" y="212" text-anchor="middle" font-size="12" font-weight="700" fill="#FFFFFF">90–98%</text>
    <text x="300" y="245" text-anchor="middle" font-size="10" fill="#3D4F65">on goal-adjacent query</text>
  </g>

  <!-- Stage 3: Act -->
  <g>
    <rect x="410" y="110" width="150" height="180" rx="10" fill="#FCE8E6" stroke="#C0504D" stroke-width="1.5"/>
    <text x="485" y="138" text-anchor="middle" font-size="13" font-weight="700" fill="#1E3A5F">Act (AUR)</text>
    <text x="485" y="158" text-anchor="middle" font-size="10" fill="#3D4F65">agent acts on memory</text>
    <rect x="435" y="195" width="100" height="22" fill="#F2D5D3"/>
    <rect x="435" y="195" width="89" height="22" fill="#C0504D"/>
    <text x="485" y="212" text-anchor="middle" font-size="12" font-weight="700" fill="#FFFFFF">60–89%</text>
    <text x="485" y="245" text-anchor="middle" font-size="10" fill="#3D4F65">tool calls hijacked</text>
  </g>

  <!-- arrows -->
  <line x1="190" y1="200" x2="222" y2="200" stroke="#4B8BDA" stroke-width="2" marker-end="url(#ar)"/>
  <line x1="375" y1="200" x2="407" y2="200" stroke="#4B8BDA" stroke-width="2" marker-end="url(#ar)"/>

  <!-- bottom takeaway -->
  <rect x="90" y="330" width="420" height="60" rx="8" fill="#F4F1EA" stroke="#1E3A5F" stroke-width="1"/>
  <text x="300" y="355" text-anchor="middle" font-size="13" font-weight="700" fill="#1E3A5F">End-to-end success up to 73.9%</text>
  <text x="300" y="376" text-anchor="middle" font-size="11" fill="#3D4F65">one document leads to persistent agent compromise</text>
</svg>