<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4B8BDA"/>
    </marker>
  </defs>

  <text x="400" y="40" text-anchor="middle" font-size="20" font-weight="600" fill="#1E3A5F">Utility-bearing Canary</text>
  <text x="400" y="62" text-anchor="middle" font-size="13" fill="#3D4F65">remove the canary — and the agent breaks</text>

  <!-- Left: the trap -->
  <g>
    <rect x="70" y="110" width="280" height="280" rx="14" fill="#EFF6FF" stroke="#4B8BDA" stroke-width="1.5"/>
    <text x="210" y="138" text-anchor="middle" font-size="14" font-weight="600" fill="#1E3A5F">Task environment</text>

    <!-- folder / files -->
    <rect x="110" y="165" width="200" height="135" rx="6" fill="#ffffff" stroke="#9FB8D6"/>
    <text x="130" y="190" font-size="12" fill="#3D4F65">readme.md</text>
    <text x="130" y="212" font-size="12" fill="#3D4F65">config.json</text>

    <!-- canary file highlighted -->
    <rect x="118" y="222" width="184" height="22" rx="3" fill="#FFE7B3" stroke="#E0A23A"/>
    <text x="126" y="238" font-size="12" fill="#1E3A5F" font-weight="600">db-7Hf3Pmt57.js  (canary)</text>

    <text x="130" y="262" font-size="12" fill="#3D4F65">utils.py</text>
    <text x="130" y="284" font-size="12" fill="#3D4F65">data.csv</text>

    <text x="210" y="335" text-anchor="middle" font-size="12" fill="#3D4F65">looks like a normal file — agent must list it</text>
  </g>

  <!-- Right top: agent succeeds -->
  <g>
    <rect x="450" y="110" width="280" height="120" rx="14" fill="#E8F4EC" stroke="#4FA37A" stroke-width="1.5"/>
    <text x="590" y="138" text-anchor="middle" font-size="14" font-weight="600" fill="#1E3A5F">Keep canary</text>
    <text x="590" y="172" text-anchor="middle" font-size="13" fill="#3D4F65">agent works, vendor sees match</text>
    <text x="590" y="208" text-anchor="middle" font-size="13" fill="#4FA37A" font-style="italic">→ owner traced</text>
  </g>

  <!-- Right bottom: filter breaks agent -->
  <g>
    <rect x="450" y="270" width="280" height="120" rx="14" fill="#FBECEC" stroke="#C56B6B" stroke-width="1.5"/>
    <text x="590" y="298" text-anchor="middle" font-size="14" font-weight="600" fill="#1E3A5F">Filter canary out</text>
    <text x="590" y="332" text-anchor="middle" font-size="13" fill="#3D4F65">no filenames left, can't enumerate</text>
    <text x="590" y="368" text-anchor="middle" font-size="13" fill="#C56B6B" font-style="italic">→ agent becomes useless</text>
  </g>

  <!-- arrows -->
  <path d="M 350 200 Q 400 170 450 170" stroke="#4B8BDA" stroke-width="2" fill="none" marker-end="url(#ah)"/>
  <path d="M 350 300 Q 400 330 450 330" stroke="#4B8BDA" stroke-width="2" fill="none" marker-end="url(#ah)"/>

  <text x="400" y="465" text-anchor="middle" font-size="13" fill="#1E3A5F" font-weight="600">Asymmetry: defender wins either way</text>
</svg>