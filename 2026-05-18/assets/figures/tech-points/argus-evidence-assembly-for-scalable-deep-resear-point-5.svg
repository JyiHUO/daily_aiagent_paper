<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 420" font-family="Helvetica, Arial, sans-serif">
  <!-- Title -->
  <text x="300" y="34" text-anchor="middle" font-size="17" font-weight="bold" fill="#1E3A5F">Searcher 即插即用</text>
  <text x="300" y="54" text-anchor="middle" font-size="12" fill="#3D4F65">Navigator 只看证据图，不认 Searcher 身份</text>

  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4B8BDA"/>
    </marker>
    <marker id="ah2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#C97A3D"/>
    </marker>
  </defs>

  <!-- Universal socket ring -->
  <circle cx="300" cy="225" r="82" fill="none" stroke="#4B8BDA" stroke-width="1.2" stroke-dasharray="3 3"/>

  <!-- Central Navigator (hub) -->
  <circle cx="300" cy="225" r="62" fill="#EFF6FF" stroke="#1E3A5F" stroke-width="2"/>
  <text x="300" y="220" text-anchor="middle" font-size="14" font-weight="bold" fill="#1E3A5F">Navigator</text>
  <text x="300" y="240" text-anchor="middle" font-size="11" fill="#3D4F65">证据图</text>

  <!-- Left Searcher -->
  <rect x="40" y="175" width="130" height="60" rx="8" fill="#FFF4E6" stroke="#C97A3D" stroke-width="1.6"/>
  <text x="105" y="200" text-anchor="middle" font-size="13" font-weight="bold" fill="#1E3A5F">35B-A3B</text>
  <text x="105" y="220" text-anchor="middle" font-size="11" fill="#C97A3D">+12.3</text>

  <!-- Top Searcher -->
  <rect x="235" y="85" width="130" height="60" rx="8" fill="#FFF4E6" stroke="#C97A3D" stroke-width="1.6"/>
  <text x="300" y="110" text-anchor="middle" font-size="13" font-weight="bold" fill="#1E3A5F">DeepSeek-V4</text>
  <text x="300" y="130" text-anchor="middle" font-size="11" fill="#C97A3D">+9.5</text>

  <!-- Right Searcher -->
  <rect x="430" y="175" width="130" height="60" rx="8" fill="#FFF4E6" stroke="#C97A3D" stroke-width="1.6"/>
  <text x="495" y="200" text-anchor="middle" font-size="13" font-weight="bold" fill="#1E3A5F">Seed-2.0-Pro</text>
  <text x="495" y="220" text-anchor="middle" font-size="11" fill="#C97A3D">82.4 分</text>

  <!-- Arrows from searchers into Navigator ring -->
  <line x1="170" y1="210" x2="222" y2="218" stroke="#4B8BDA" stroke-width="2" marker-end="url(#ah)"/>
  <line x1="300" y1="145" x2="300" y2="160" stroke="#4B8BDA" stroke-width="2" marker-end="url(#ah)"/>
  <line x1="430" y1="210" x2="378" y2="218" stroke="#4B8BDA" stroke-width="2" marker-end="url(#ah)"/>

  <!-- Bottom note: linear scaling -->
  <text x="300" y="340" text-anchor="middle" font-size="12" fill="#3D4F65">Searcher 越强 → 系统能力线性抬升</text>

  <!-- Scaling arrow -->
  <line x1="220" y1="375" x2="380" y2="375" stroke="#4B8BDA" stroke-width="1.2" stroke-dasharray="2 3"/>
  <line x1="220" y1="385" x2="380" y2="362" stroke="#C97A3D" stroke-width="2.2" marker-end="url(#ah2)"/>
  <text x="212" y="388" text-anchor="end" font-size="10" fill="#3D4F65">弱</text>
  <text x="388" y="365" font-size="10" fill="#3D4F65">强</text>
</svg>