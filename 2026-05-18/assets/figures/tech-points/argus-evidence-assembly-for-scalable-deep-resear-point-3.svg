<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 420">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4B8BDA"/>
    </marker>
  </defs>

  <text x="300" y="34" text-anchor="middle" font-family="Helvetica,Arial" font-size="18" font-weight="600" fill="#1E3A5F">对比奖励：只奖励追问带来的增量</text>

  <!-- Left: pre-verify -->
  <g>
    <rect x="50" y="90" width="180" height="120" rx="10" fill="#F5F0E8" stroke="#C9A96E" stroke-width="1.5"/>
    <text x="140" y="120" text-anchor="middle" font-family="Helvetica,Arial" font-size="13" fill="#1E3A5F" font-weight="600">verify 之前 (y* w/o v)</text>
    <text x="140" y="170" text-anchor="middle" font-family="Helvetica,Arial" font-size="24" fill="#C9A96E" font-weight="700">R₀</text>
    <text x="140" y="195" text-anchor="middle" font-family="Helvetica,Arial" font-size="11" fill="#7A8A9C">无梯度基线</text>
  </g>

  <!-- Right: post-verify -->
  <g>
    <rect x="370" y="90" width="180" height="120" rx="10" fill="#EFF6FF" stroke="#4B8BDA" stroke-width="1.5"/>
    <text x="460" y="120" text-anchor="middle" font-family="Helvetica,Arial" font-size="13" fill="#1E3A5F" font-weight="600">verify 之后 (y* w/v)</text>
    <text x="460" y="170" text-anchor="middle" font-family="Helvetica,Arial" font-size="24" fill="#4B8BDA" font-weight="700">R₁</text>
    <text x="460" y="195" text-anchor="middle" font-family="Helvetica,Arial" font-size="11" fill="#7A8A9C">有梯度更新</text>
  </g>

  <!-- Delta arrow -->
  <line x1="232" y1="150" x2="368" y2="150" stroke="#4B8BDA" stroke-width="2" marker-end="url(#ar)"/>
  <text x="300" y="142" text-anchor="middle" font-family="Helvetica,Arial" font-size="13" fill="#1E3A5F" font-weight="600">Δ 增量</text>

  <!-- Reward formula -->
  <g>
    <rect x="140" y="260" width="320" height="80" rx="10" fill="#FFFFFF" stroke="#1E3A5F" stroke-width="1.5"/>
    <text x="300" y="288" text-anchor="middle" font-family="Helvetica,Arial" font-size="13" fill="#1E3A5F" font-weight="600">对比奖励 (clip 到 [0,1])</text>
    <text x="300" y="318" text-anchor="middle" font-family="Helvetica,Arial" font-size="14" fill="#3D4F65">R = R₁ + 0.5 · (R₁ − R₀)</text>
  </g>

  <line x1="200" y1="210" x2="240" y2="258" stroke="#4B8BDA" stroke-width="1.5" marker-end="url(#ar)"/>
  <line x1="400" y1="210" x2="360" y2="258" stroke="#4B8BDA" stroke-width="1.5" marker-end="url(#ar)"/>

  <text x="300" y="372" text-anchor="middle" font-family="Helvetica,Arial" font-size="12" fill="#3D4F65" font-style="italic">蒙对不算分，追问补缺才算分</text>
  <text x="300" y="395" text-anchor="middle" font-family="Helvetica,Arial" font-size="11" fill="#7A8A9C">GRPO：组内相对优势 + KL 正则</text>
</svg>