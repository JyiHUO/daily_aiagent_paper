<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4B8BDA"/>
    </marker>
  </defs>

  <text x="300" y="38" text-anchor="middle" font-size="18" font-weight="bold" fill="#1E3A5F">固定 Token 预算下的取舍</text>

  <!-- Token budget bar -->
  <rect x="80" y="60" width="440" height="24" rx="4" fill="#EFF6FF" stroke="#1E3A5F" stroke-width="1.2"/>
  <text x="300" y="77" text-anchor="middle" font-size="12" fill="#1E3A5F">Token Budget (40M)</text>

  <!-- Left: with DB -->
  <g>
    <text x="170" y="120" text-anchor="middle" font-size="14" font-weight="bold" fill="#1E3A5F">开启 DB 观察</text>

    <!-- Books / history -->
    <rect x="105" y="145" width="50" height="60" fill="#FCE8C8" stroke="#C77F3A" stroke-width="1.5"/>
    <line x1="117" y1="145" x2="117" y2="205" stroke="#C77F3A" stroke-width="1"/>
    <line x1="130" y1="145" x2="130" y2="205" stroke="#C77F3A" stroke-width="1"/>
    <line x1="143" y1="145" x2="143" y2="205" stroke="#C77F3A" stroke-width="1"/>
    <text x="130" y="222" text-anchor="middle" font-size="11" fill="#3D4F65">查历史</text>

    <!-- Code small -->
    <rect x="175" y="160" width="60" height="45" rx="3" fill="#EFF6FF" stroke="#4B8BDA" stroke-width="1.5"/>
    <text x="205" y="187" text-anchor="middle" font-size="11" fill="#3D4F65">改代码</text>
    <text x="205" y="222" text-anchor="middle" font-size="11" fill="#3D4F65">(变少)</text>

    <text x="170" y="270" text-anchor="middle" font-size="13" fill="#3D4F65">87 个算法</text>
    <text x="170" y="292" text-anchor="middle" font-size="13" font-weight="bold" fill="#C0504D">score 2.631</text>
  </g>

  <!-- divider -->
  <line x1="300" y1="110" x2="300" y2="310" stroke="#B8C4D6" stroke-width="1" stroke-dasharray="4 4"/>

  <!-- Right: without DB -->
  <g>
    <text x="430" y="120" text-anchor="middle" font-size="14" font-weight="bold" fill="#1E3A5F">关闭 DB 观察</text>

    <!-- Bigger code -->
    <rect x="360" y="145" width="140" height="75" rx="3" fill="#EFF6FF" stroke="#4B8BDA" stroke-width="1.8"/>
    <text x="430" y="188" text-anchor="middle" font-size="13" fill="#1E3A5F">全部 token 用于改代码</text>

    <text x="430" y="270" text-anchor="middle" font-size="13" fill="#3D4F65">101 个算法</text>
    <text x="430" y="292" text-anchor="middle" font-size="13" font-weight="bold" fill="#2E7D5B">score 2.636</text>
  </g>

  <!-- arrows from budget bar -->
  <line x1="200" y1="84" x2="170" y2="108" stroke="#4B8BDA" stroke-width="1.5" marker-end="url(#ar)"/>
  <line x1="400" y1="84" x2="430" y2="108" stroke="#4B8BDA" stroke-width="1.5" marker-end="url(#ar)"/>

  <!-- Bottom takeaway -->
  <text x="300" y="350" text-anchor="middle" font-size="13" fill="#1E3A5F">查询历史 ≠ 更聪明：迭代次数才是关键</text>
</svg>