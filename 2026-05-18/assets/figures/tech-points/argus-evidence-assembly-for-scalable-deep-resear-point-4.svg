<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" font-family="-apple-system, sans-serif">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4B8BDA"/>
    </marker>
  </defs>

  <text x="400" y="40" text-anchor="middle" font-size="20" font-weight="700" fill="#1E3A5F">Evidence Graph: 1200:1 Context Compression</text>

  <!-- LEFT: Raw rollouts (massive) -->
  <g>
    <rect x="60" y="100" width="260" height="320" rx="8" fill="#FFF4E6" stroke="#E8A857" stroke-width="1.5"/>
    <text x="190" y="128" text-anchor="middle" font-size="14" font-weight="700" fill="#1E3A5F">64 × Raw Rollouts</text>
    
    <g stroke="#E8A857" stroke-width="1.2" opacity="0.55">
      <line x1="80" y1="155" x2="300" y2="155"/>
      <line x1="80" y1="170" x2="290" y2="170"/>
      <line x1="80" y1="185" x2="305" y2="185"/>
      <line x1="80" y1="200" x2="280" y2="200"/>
      <line x1="80" y1="215" x2="300" y2="215"/>
      <line x1="80" y1="230" x2="295" y2="230"/>
      <line x1="80" y1="245" x2="285" y2="245"/>
      <line x1="80" y1="260" x2="300" y2="260"/>
      <line x1="80" y1="275" x2="290" y2="275"/>
      <line x1="80" y1="290" x2="305" y2="290"/>
      <line x1="80" y1="305" x2="280" y2="305"/>
      <line x1="80" y1="320" x2="295" y2="320"/>
      <line x1="80" y1="335" x2="285" y2="335"/>
      <line x1="80" y1="350" x2="300" y2="350"/>
      <line x1="80" y1="365" x2="290" y2="365"/>
      <line x1="80" y1="380" x2="305" y2="380"/>
    </g>
    <text x="190" y="408" text-anchor="middle" font-size="15" font-weight="700" fill="#B8651A">25.6M tokens</text>
  </g>

  <!-- arrow: compression -->
  <g>
    <text x="400" y="245" text-anchor="middle" font-size="13" font-weight="600" fill="#1E3A5F">cluster &amp; verify</text>
    <line x1="330" y1="260" x2="487" y2="260" stroke="#4B8BDA" stroke-width="2.5" marker-end="url(#ar)"/>
    <text x="400" y="282" text-anchor="middle" font-size="12" fill="#3D4F65">into shared graph</text>
  </g>

  <!-- RIGHT: Compact graph -->
  <g>
    <rect x="490" y="180" width="260" height="160" rx="8" fill="#EFF6FF" stroke="#4B8BDA" stroke-width="1.5"/>
    <text x="620" y="205" text-anchor="middle" font-size="14" font-weight="700" fill="#1E3A5F">Evidence Graph</text>

    <line x1="554" y1="260" x2="606" y2="240" stroke="#4B8BDA" stroke-width="1.5"/>
    <line x1="634" y1="240" x2="686" y2="265" stroke="#4B8BDA" stroke-width="1.5"/>
    <line x1="595" y1="295" x2="612" y2="252" stroke="#4B8BDA" stroke-width="1.5"/>
    <line x1="678" y1="305" x2="700" y2="278" stroke="#4B8BDA" stroke-width="1.5"/>
    <line x1="599" y1="305" x2="651" y2="310" stroke="#4B8BDA" stroke-width="1.5"/>

    <circle cx="540" cy="260" r="14" fill="#fff" stroke="#4B8BDA" stroke-width="2"/>
    <circle cx="620" cy="240" r="14" fill="#fff" stroke="#4B8BDA" stroke-width="2"/>
    <circle cx="700" cy="265" r="14" fill="#fff" stroke="#4B8BDA" stroke-width="2"/>
    <circle cx="585" cy="305" r="14" fill="#fff" stroke="#4B8BDA" stroke-width="2"/>
    <circle cx="665" cy="310" r="14" fill="#fff" stroke="#4B8BDA" stroke-width="2"/>

    <text x="620" y="370" text-anchor="middle" font-size="15" font-weight="700" fill="#1E3A5F">21.5K tokens</text>
  </g>

  <!-- bottom note -->
  <text x="400" y="465" text-anchor="middle" font-size="13" fill="#3D4F65">Navigator reasons on the graph — cost grows with evidence, not with K</text>
</svg>