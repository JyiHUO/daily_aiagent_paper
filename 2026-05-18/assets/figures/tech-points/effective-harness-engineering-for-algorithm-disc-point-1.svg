<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4B8BDA"/>
    </marker>
  </defs>

  <text x="400" y="40" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="bold" fill="#1E3A5F">Token 预算固定：少而精 &gt; 多而浅</text>

  <!-- LEFT: many shallow -->
  <g>
    <rect x="60" y="90" width="300" height="340" rx="14" fill="#FFF4E6" stroke="#E8A857" stroke-width="1.5"/>
    <text x="210" y="120" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="bold" fill="#1E3A5F">一发即走 · 多候选</text>
    <text x="210" y="142" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#3D4F65">24K tok / 算法  ·  1671 候选</text>

    <!-- many small dots -->
    <g fill="#E8A857" opacity="0.75">
      <circle cx="100" cy="195" r="6"/><circle cx="135" cy="180" r="6"/><circle cx="170" cy="200" r="6"/>
      <circle cx="205" cy="185" r="6"/><circle cx="240" cy="205" r="6"/><circle cx="275" cy="190" r="6"/><circle cx="310" cy="200" r="6"/>
      <circle cx="115" cy="230" r="6"/><circle cx="150" cy="220" r="6"/><circle cx="185" cy="240" r="6"/>
      <circle cx="220" cy="225" r="6"/><circle cx="255" cy="240" r="6"/><circle cx="290" cy="225" r="6"/>
      <circle cx="100" cy="265" r="6"/><circle cx="135" cy="275" r="6"/><circle cx="170" cy="260" r="6"/>
      <circle cx="205" cy="275" r="6"/><circle cx="240" cy="265" r="6"/><circle cx="275" cy="280" r="6"/><circle cx="310" cy="265" r="6"/>
      <circle cx="120" cy="305" r="6"/><circle cx="160" cy="310" r="6"/><circle cx="200" cy="305" r="6"/>
      <circle cx="240" cy="310" r="6"/><circle cx="280" cy="305" r="6"/>
    </g>

    <text x="210" y="395" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="22" font-weight="bold" fill="#B8651A">best 2.42</text>
  </g>

  <!-- RIGHT: few deep -->
  <g>
    <rect x="440" y="90" width="300" height="340" rx="14" fill="#EFF6FF" stroke="#4B8BDA" stroke-width="1.5"/>
    <text x="590" y="120" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="bold" fill="#1E3A5F">Agent 深度迭代 · 少候选</text>
    <text x="590" y="142" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#3D4F65">90K tok / 算法  ·  452 候选</text>

    <!-- few large dots, one starred -->
    <g>
      <circle cx="510" cy="220" r="14" fill="#4B8BDA" opacity="0.8"/>
      <circle cx="580" cy="200" r="14" fill="#4B8BDA" opacity="0.8"/>
      <circle cx="660" cy="225" r="14" fill="#4B8BDA" opacity="0.8"/>
      <circle cx="520" cy="295" r="14" fill="#4B8BDA" opacity="0.8"/>
      <circle cx="670" cy="305" r="14" fill="#4B8BDA" opacity="0.8"/>
      <!-- the gold winner -->
      <circle cx="595" cy="280" r="20" fill="#F5C56B" stroke="#1E3A5F" stroke-width="2"/>
      <text x="595" y="287" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="bold" fill="#1E3A5F">★</text>
    </g>

    <text x="590" y="395" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="22" font-weight="bold" fill="#1E3A5F">best 2.636</text>
  </g>

  <!-- arrow comparison -->
  <line x1="365" y1="255" x2="435" y2="255" stroke="#4B8BDA" stroke-width="2.5" marker-end="url(#ar)"/>
  <text x="400" y="245" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#1E3A5F" font-weight="bold">同等 token</text>

  <text x="400" y="475" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#3D4F65" font-style="italic">每个孩子的质量 &gt; 孩子的数量</text>
</svg>