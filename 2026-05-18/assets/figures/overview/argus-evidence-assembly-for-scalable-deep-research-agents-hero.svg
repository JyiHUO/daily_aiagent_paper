<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 620" font-family="'PingFang SC','Helvetica Neue',sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4B8BDA"/>
    </marker>
    <marker id="arrOrange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#E8924A"/>
    </marker>
  </defs>

  <rect width="900" height="620" fill="#FAFBFD"/>

  <!-- Title -->
  <text x="450" y="42" text-anchor="middle" font-size="22" font-weight="700" fill="#1E3A5F">Argus：把深度研究当作拼图，而不是并行蛮干</text>
  <text x="450" y="66" text-anchor="middle" font-size="13" fill="#3D4F65">Searcher 跑腿取证 · Navigator 拼图调度 · 共享证据图驱动闭环</text>

  <!-- LEFT: parallel rollouts (problem) -->
  <g>
    <text x="160" y="108" text-anchor="middle" font-size="13" font-weight="700" fill="#B5562A">以往：K 路并行 → 重复采样</text>
    <g stroke="#D9A689" stroke-width="1.5" fill="none">
      <path d="M70,150 L270,170"/>
      <path d="M70,180 L270,200"/>
      <path d="M70,210 L270,225"/>
      <path d="M70,240 L270,250"/>
    </g>
    <g fill="#E8924A">
      <circle cx="270" cy="170" r="5"/>
      <circle cx="270" cy="200" r="5"/>
      <circle cx="270" cy="225" r="5"/>
      <circle cx="270" cy="250" r="5"/>
    </g>
    <text x="160" y="285" text-anchor="middle" font-size="11" fill="#3D4F65">证据高度重叠 · 聚合上下文爆炸</text>
    <text x="160" y="302" text-anchor="middle" font-size="11" fill="#3D4F65">边际收益迅速饱和</text>
  </g>

  <!-- VS divider -->
  <text x="335" y="215" text-anchor="middle" font-size="26" font-weight="700" fill="#1E3A5F" opacity="0.5">→</text>

  <!-- CENTER: Argus jigsaw -->
  <g transform="translate(380,100)">
    <rect x="0" y="0" width="490" height="240" rx="14" fill="#EFF6FF" stroke="#4B8BDA" stroke-width="1.5"/>
    <text x="245" y="24" text-anchor="middle" font-size="13" font-weight="700" fill="#1E3A5F">共享证据图（拼图看板）</text>

    <!-- jigsaw pieces -->
    <g>
      <path d="M40,55 h60 v15 a10,10 0 0 1 0,20 v15 h-30 a10,10 0 0 0 -20,0 h-30 v-15 a10,10 0 0 1 0,-20 v-15 z" fill="#C7E0F4" stroke="#4B8BDA" stroke-width="1.3"/>
      <text x="60" y="85" text-anchor="middle" font-size="10" fill="#1E3A5F">已佐证 +1</text>

      <path d="M120,55 h60 v15 a10,10 0 0 1 0,20 v15 h-30 a10,10 0 0 0 -20,0 h-30 v-15 a10,10 0 0 1 0,-20 v-15 z" fill="#FCE2D0" stroke="#E8924A" stroke-width="1.3"/>
      <text x="140" y="85" text-anchor="middle" font-size="10" fill="#B5562A">冲突 ±1</text>

      <path d="M200,55 h60 v15 a10,10 0 0 1 0,20 v15 h-30 a10,10 0 0 0 -20,0 h-30 v-15 a10,10 0 0 1 0,-20 v-15 z" fill="#FFFFFF" stroke="#9AAEC2" stroke-width="1.3" stroke-dasharray="3,3"/>
      <text x="220" y="85" text-anchor="middle" font-size="10" fill="#3D4F65">未验证 ?</text>

      <path d="M280,55 h60 v15 a10,10 0 0 1 0,20 v15 h-30 a10,10 0 0 0 -20,0 h-30 v-15 a10,10 0 0 1 0,-20 v-15 z" fill="#FAFBFD" stroke="#E8924A" stroke-width="1.5" stroke-dasharray="4,3"/>
      <text x="300" y="86" text-anchor="middle" font-size="11" font-weight="700" fill="#E8924A">缺口</text>

      <path d="M360,55 h60 v15 a10,10 0 0 1 0,20 v15 h-30 a10,10 0 0 0 -20,0 h-30 v-15 a10,10 0 0 1 0,-20 v-15 z" fill="#C7E0F4" stroke="#4B8BDA" stroke-width="1.3"/>
      <text x="380" y="85" text-anchor="middle" font-size="10" fill="#1E3A5F">已佐证 +1</text>
    </g>

    <!-- Navigator -->
    <g>
      <ellipse cx="245" cy="170" rx="78" ry="28" fill="#1E3A5F"/>
      <text x="245" y="167" text-anchor="middle" font-size="13" font-weight="700" fill="#FFFFFF">Navigator</text>
      <text x="245" y="183" text-anchor="middle" font-size="10" fill="#C7E0F4">验证 · 调度 · 合成</text>
    </g>

    <!-- arrow Nav -> missing piece (dispatch targeted) -->
    <path d="M260,142 L298,108" stroke="#E8924A" stroke-width="1.8" fill="none" marker-end="url(#arrOrange)"/>
    <text x="270" y="135" font-size="10" fill="#B5562A">定向补缺</text>

    <!-- bottom: searchers -->
    <g>
      <rect x="35" y="208" width="80" height="22" rx="11" fill="#FFFFFF" stroke="#4B8BDA"/>
      <text x="75" y="224" text-anchor="middle" font-size="11" fill="#1E3A5F">Searcher₁</text>
      <rect x="135" y="208" width="80" height="22" rx="11" fill="#FFFFFF" stroke="#4B8BDA"/>
      <text x="175" y="224" text-anchor="middle" font-size="11" fill="#1E3A5F">Searcher₂</text>
      <text x="245" y="224" text-anchor="middle" font-size="14" fill="#3D4F65">···</text>
      <rect x="275" y="208" width="80" height="22" rx="11" fill="#FFFFFF" stroke="#4B8BDA"/>
      <text x="315" y="224" text-anchor="middle" font-size="11" fill="#1E3A5F">Searcher_K</text>
      <rect x="375" y="208" width="80" height="22" rx="11" fill="#EFF6FF" stroke="#4B8BDA" stroke-dasharray="3,2"/>
      <text x="415" y="224" text-anchor="middle" font-size="10" fill="#1E3A5F">ReAct (SFT)</text>
    </g>
    <!-- arrows searchers -> nav -->
    <path d="M115,210 L195,196" stroke="#4B8BDA" stroke-width="1.3" fill="none" marker-end="url(#arr)"/>
    <path d="M275,210 L295,196" stroke="#4B8BDA" stroke-width="1.3" fill="none" marker-end="url(#arr)"/>
  </g>

  <!-- BOTTOM: closed loop -->
  <g transform="translate(0,380)">
    <text x="450" y="20" text-anchor="middle" font-size="13" font-weight="700" fill="#1E3A5F">Verify-and-Dispatch 闭环（GRPO 对比奖励训练）</text>

    <!-- 4 stages -->
    <g font-size="11" fill="#1E3A5F">
      <rect x="80" y="40" width="150" height="56" rx="10" fill="#EFF6FF" stroke="#4B8BDA"/>
      <text x="155" y="62" text-anchor="middle" font-weight="700">观察证据图 G</text>
      <text x="155" y="82" text-anchor="middle" font-size="10" fill="#3D4F65">标已佐证/冲突/缺口</text>

      <rect x="260" y="40" width="150" height="56" rx="10" fill="#EFF6FF" stroke="#4B8BDA"/>
      <text x="335" y="62" text-anchor="middle" font-weight="700">批量验证查询 V</text>
      <text x="335" y="82" text-anchor="middle" font-size="10" fill="#3D4F65">追佐证·裁冲突·补盲</text>

      <rect x="440" y="40" width="150" height="56" rx="10" fill="#EFF6FF" stroke="#4B8BDA"/>
      <text x="515" y="62" text-anchor="middle" font-weight="700">回写图 → 学停</text>
      <text x="515" y="82" text-anchor="middle" font-size="10" fill="#3D4F65">end-of-loop 由策略自决</text>

      <rect x="620" y="40" width="190" height="56" rx="10" fill="#FCE2D0" stroke="#E8924A"/>
      <text x="715" y="62" text-anchor="middle" font-weight="700" fill="#B5562A">合成（仅看 q + G）</text>
      <text x="715" y="82" text-anchor="middle" font-size="10" fill="#3D4F65">25.6M → 21.5K，≈1200:1</text>
    </g>

    <!-- arrows -->
    <path d="M230,68 L258,68" stroke="#4B8BDA" stroke-width="1.6" fill="none" marker-end="url(#arr)"/>
    <path d="M410,68 L438,68" stroke="#4B8BDA" stroke-width="1.6" fill="none" marker-end="url(#arr)"/>
    <path d="M590,68 L618,68" stroke="#4B8BDA" stroke-width="1.6" fill="none" marker-end="url(#arr)"/>

    <!-- loop back -->
    <path d="M515,96 L515,135 L155,135 L155,100" stroke="#4B8BDA" stroke-width="1.5" stroke-dasharray="5,3" fill="none" marker-end="url(#arr)"/>
    <text x="335" y="130" text-anchor="middle" font-size="10" fill="#4B8BDA">未结束 → 继续下一轮验证</text>

    <!-- result tag -->
    <g transform="translate(290,170)">
      <rect x="0" y="0" width="320" height="32" rx="16" fill="#1E3A5F"/>
      <text x="160" y="21" text-anchor="middle" font-size="12" font-weight="700" fill="#FFFFFF">BrowseComp 86.2 · K=64 · 超过所有闭源 Agent</text>
    </g>
  </g>
</svg>