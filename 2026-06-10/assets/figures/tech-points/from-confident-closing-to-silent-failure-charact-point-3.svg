<svg xmlns="http://www.w3.org/2000/svg" width="720" height="480" viewBox="0 0 720 480">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4B8BDA"/>
    </marker>
  </defs>

  <text x="360" y="40" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC','Hiragino Sans GB',sans-serif" font-size="20" font-weight="700" fill="#1E3A5F">检测假成功：小模型 vs 大模型</text>

  <!-- LEFT: LLM Judge -->
  <g>
    <rect x="60" y="80" width="260" height="310" rx="14" fill="#FBEFEA" stroke="#D98B6B" stroke-width="2"/>
    <text x="190" y="115" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC','Hiragino Sans GB',sans-serif" font-size="17" font-weight="700" fill="#1E3A5F">LLM Judge（看措辞）</text>

    <circle cx="190" cy="180" r="38" fill="#F4D4C5" stroke="#D98B6B" stroke-width="2"/>
    <text x="190" y="190" text-anchor="middle" font-size="32">🤖</text>

    <text x="190" y="255" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC','Hiragino Sans GB',sans-serif" font-size="13" fill="#3D4F65">读取生成式轨迹文本</text>

    <text x="190" y="305" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC','Hiragino Sans GB',sans-serif" font-size="24" font-weight="700" fill="#B85C3C">AUROC ≈ 0.65</text>
    <text x="190" y="335" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC','Hiragino Sans GB',sans-serif" font-size="14" fill="#3D4F65">延迟 ~4000 ms</text>
    <text x="190" y="365" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC','Hiragino Sans GB',sans-serif" font-size="13" fill="#3D4F65">10% 标记预算 recall 13%</text>
  </g>

  <!-- VS -->
  <text x="360" y="225" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC','Hiragino Sans GB',sans-serif" font-size="22" font-weight="700" fill="#1E3A5F">VS</text>

  <!-- RIGHT: TF-IDF -->
  <g>
    <rect x="400" y="80" width="260" height="310" rx="14" fill="#EFF6FF" stroke="#4B8BDA" stroke-width="2"/>
    <text x="530" y="115" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC','Hiragino Sans GB',sans-serif" font-size="17" font-weight="700" fill="#1E3A5F">TF-IDF + LR（看动作）</text>

    <rect x="475" y="148" width="110" height="74" rx="4" fill="#FFFFFF" stroke="#4B8BDA" stroke-width="1.5"/>
    <text x="530" y="168" text-anchor="middle" font-family="monospace" font-size="11" fill="#3D4F65">GET ×3</text>
    <text x="530" y="185" text-anchor="middle" font-family="monospace" font-size="11" fill="#B85C3C" font-weight="700">no POST!</text>
    <text x="530" y="208" text-anchor="middle" font-family="monospace" font-size="11" fill="#3D4F65">success=true</text>
    <circle cx="600" cy="215" r="14" fill="none" stroke="#1E3A5F" stroke-width="2.5"/>
    <line x1="610" y1="225" x2="622" y2="237" stroke="#1E3A5F" stroke-width="3" stroke-linecap="round"/>

    <text x="530" y="255" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC','Hiragino Sans GB',sans-serif" font-size="13" fill="#3D4F65">bigram 特征 + 逻辑回归</text>

    <text x="530" y="305" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC','Hiragino Sans GB',sans-serif" font-size="24" font-weight="700" fill="#2D7A4B">AUROC ≈ 0.92</text>
    <text x="530" y="335" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC','Hiragino Sans GB',sans-serif" font-size="14" fill="#3D4F65">延迟 1.2 ms</text>
    <text x="530" y="365" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC','Hiragino Sans GB',sans-serif" font-size="13" fill="#3D4F65">10% 标记预算 recall 72%</text>
  </g>

  <!-- bottom takeaway -->
  <rect x="120" y="415" width="480" height="46" rx="10" fill="#FFF8E8" stroke="#D9A441" stroke-width="1.5"/>
  <text x="360" y="445" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC','Hiragino Sans GB',sans-serif" font-size="14" font-weight="700" fill="#1E3A5F">判别式直接学"有没有真干活" — 3364× 更快，准确率反超</text>
</svg>