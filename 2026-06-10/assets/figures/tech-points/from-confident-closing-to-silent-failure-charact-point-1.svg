<svg xmlns="http://www.w3.org/2000/svg" width="720" height="480" viewBox="0 0 720 480">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4B8BDA"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#D9603B"/>
    </marker>
  </defs>
  <style>
    .title { font-family: 'PingFang SC','Microsoft YaHei','Noto Sans CJK SC','Hiragino Sans GB',sans-serif; font-size: 18px; fill: #1E3A5F; font-weight: 600; }
    .label { font-family: 'PingFang SC','Microsoft YaHei','Noto Sans CJK SC','Hiragino Sans GB',sans-serif; font-size: 14px; fill: #1E3A5F; font-weight: 600; }
    .small { font-family: 'PingFang SC','Microsoft YaHei','Noto Sans CJK SC','Hiragino Sans GB',sans-serif; font-size: 12px; fill: #3D4F65; }
    .num { font-family: 'PingFang SC','Microsoft YaHei','Noto Sans CJK SC','Hiragino Sans GB',sans-serif; font-size: 32px; font-weight: 700; }
  </style>

  <text x="360" y="40" text-anchor="middle" class="title">环境能否独立校验 决定假成功率</text>

  <!-- Left: Single-control -->
  <rect x="60" y="70" width="270" height="370" rx="12" fill="#FEF3EC" stroke="#E89B6C" stroke-width="2"/>
  <text x="195" y="100" text-anchor="middle" class="label">单方控制环境</text>
  <text x="195" y="122" text-anchor="middle" class="small">只有 Agent 能写状态，无人复核</text>

  <circle cx="130" cy="210" r="32" fill="#4B8BDA" opacity="0.85"/>
  <text x="130" y="216" text-anchor="middle" fill="#FFFFFF" class="label">Agent</text>

  <rect x="220" y="178" width="64" height="64" rx="4" fill="#FFFFFF" stroke="#E89B6C" stroke-width="2"/>
  <line x1="228" y1="186" x2="276" y2="234" stroke="#FCE3D0" stroke-width="2"/>
  <text x="252" y="262" text-anchor="middle" class="small">镜子</text>

  <path d="M 165 210 L 215 210" stroke="#4B8BDA" stroke-width="2" fill="none" marker-end="url(#arr)"/>

  <text x="195" y="340" text-anchor="middle" class="num" fill="#D9603B">45–48%</text>
  <text x="195" y="370" text-anchor="middle" class="small">失败中假成功比例</text>
  <text x="195" y="405" text-anchor="middle" class="small">retail · airline</text>

  <!-- Right: Dual-control -->
  <rect x="390" y="70" width="270" height="370" rx="12" fill="#EFF6FF" stroke="#4B8BDA" stroke-width="2"/>
  <text x="525" y="100" text-anchor="middle" class="label">双方校验环境</text>
  <text x="525" y="122" text-anchor="middle" class="small">用户模拟器 / 独立 DB 复核</text>

  <circle cx="455" cy="210" r="32" fill="#4B8BDA" opacity="0.85"/>
  <text x="455" y="216" text-anchor="middle" fill="#FFFFFF" class="label">Agent</text>

  <circle cx="595" cy="210" r="32" fill="#1E3A5F"/>
  <text x="595" y="216" text-anchor="middle" fill="#FFFFFF" class="label">校验者</text>

  <path d="M 490 200 L 560 200" stroke="#4B8BDA" stroke-width="2" fill="none" marker-end="url(#arr)"/>
  <path d="M 560 222 L 490 222" stroke="#D9603B" stroke-width="2" fill="none" marker-end="url(#arrR)"/>

  <text x="525" y="340" text-anchor="middle" class="num" fill="#2D7A4D">3%</text>
  <text x="525" y="370" text-anchor="middle" class="small">失败中假成功比例</text>
  <text x="525" y="405" text-anchor="middle" class="small">telecom</text>
</svg>