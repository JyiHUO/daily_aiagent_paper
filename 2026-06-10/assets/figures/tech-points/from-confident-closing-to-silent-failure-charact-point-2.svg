<svg xmlns="http://www.w3.org/2000/svg" width="720" height="480" viewBox="0 0 720 480">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4B8BDA"/>
    </marker>
  </defs>

  <style>
    .t { font-family: 'PingFang SC','Microsoft YaHei','Noto Sans CJK SC','Hiragino Sans GB',sans-serif; }
  </style>

  <text x="360" y="42" text-anchor="middle" class="t" font-size="20" font-weight="700" fill="#1E3A5F">LLM Judge 看错了线索</text>
  <text x="360" y="66" text-anchor="middle" class="t" font-size="13" fill="#3D4F65">AUROC ≤ 0.64 ≈ 接近瞎猜</text>

  <!-- Left: confident wording -->
  <rect x="60" y="110" width="240" height="120" rx="10" fill="#EFF6FF" stroke="#4B8BDA" stroke-width="1.5"/>
  <text x="180" y="138" text-anchor="middle" class="t" font-size="14" font-weight="700" fill="#1E3A5F">自信收尾</text>
  <text x="180" y="172" text-anchor="middle" class="t" font-size="13" fill="#3D4F65">"refund processed"</text>
  <text x="180" y="204" text-anchor="middle" class="t" font-size="12" fill="#3D4F65">实际未执行</text>

  <!-- Judge eye -->
  <ellipse cx="360" cy="170" rx="56" ry="36" fill="#FFF4E6" stroke="#E89B4A" stroke-width="1.8"/>
  <circle cx="360" cy="170" r="14" fill="#1E3A5F"/>
  <circle cx="364" cy="166" r="4" fill="#FFFFFF"/>
  <text x="360" y="240" text-anchor="middle" class="t" font-size="13" font-weight="700" fill="#1E3A5F">Judge</text>

  <!-- Right: honest failure -->
  <rect x="420" y="110" width="240" height="120" rx="10" fill="#EFF6FF" stroke="#4B8BDA" stroke-width="1.5"/>
  <text x="540" y="138" text-anchor="middle" class="t" font-size="14" font-weight="700" fill="#1E3A5F">诚实失败</text>
  <text x="540" y="172" text-anchor="middle" class="t" font-size="13" fill="#3D4F65">"transfer to human"</text>
  <text x="540" y="204" text-anchor="middle" class="t" font-size="12" fill="#3D4F65">承认未完成</text>

  <!-- Arrows from judge to verdicts -->
  <line x1="325" y1="200" x2="240" y2="295" stroke="#4B8BDA" stroke-width="2" marker-end="url(#ar)"/>
  <line x1="395" y1="200" x2="480" y2="295" stroke="#4B8BDA" stroke-width="2" marker-end="url(#ar)"/>

  <!-- Verdicts -->
  <rect x="100" y="300" width="240" height="70" rx="8" fill="#E8F5E9" stroke="#5CA25C" stroke-width="1.5"/>
  <text x="220" y="332" text-anchor="middle" class="t" font-size="15" font-weight="700" fill="#2E6B3F">✓ 判为成功</text>
  <text x="220" y="354" text-anchor="middle" class="t" font-size="12" fill="#3D4F65">假成功悄悄通过</text>

  <rect x="380" y="300" width="240" height="70" rx="8" fill="#FBE9E9" stroke="#C76B6B" stroke-width="1.5"/>
  <text x="500" y="332" text-anchor="middle" class="t" font-size="15" font-weight="700" fill="#8E3030">✗ 判为失败</text>
  <text x="500" y="354" text-anchor="middle" class="t" font-size="12" fill="#3D4F65">诚实反被惩罚</text>

  <!-- Bottom insight -->
  <text x="360" y="420" text-anchor="middle" class="t" font-size="13" font-weight="700" fill="#1E3A5F">Judge 锚定表面词汇，而非真实操作</text>
  <text x="360" y="442" text-anchor="middle" class="t" font-size="11" fill="#3D4F65">+checklist · +tool log · +ground truth 均无效</text>
</svg>