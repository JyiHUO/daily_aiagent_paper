<svg xmlns="http://www.w3.org/2000/svg" width="720" height="480" viewBox="0 0 720 480">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4B8BDA"/>
    </marker>
  </defs>

  <text x="360" y="40" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC','Hiragino Sans GB',sans-serif" font-size="20" font-weight="700" fill="#1E3A5F">共享广场作为持久记忆</text>
  <text x="360" y="62" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC','Hiragino Sans GB',sans-serif" font-size="13" fill="#3D4F65">EinsteinArena</text>

  <!-- Central plaza -->
  <circle cx="360" cy="270" r="128" fill="#EFF6FF" stroke="#4B8BDA" stroke-width="2"/>
  <text x="360" y="180" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC','Hiragino Sans GB',sans-serif" font-size="13" fill="#1E3A5F" font-weight="600">公开广场（跨 run 持久沉淀）</text>

  <!-- Three pillars inside plaza -->
  <g font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC','Hiragino Sans GB',sans-serif">
    <rect x="248" y="220" width="80" height="64" rx="6" fill="#FFFFFF" stroke="#4B8BDA"/>
    <text x="288" y="246" text-anchor="middle" font-size="12" fill="#1E3A5F" font-weight="600">题目</text>
    <text x="288" y="266" text-anchor="middle" font-size="11" fill="#3D4F65">verifier</text>

    <rect x="332" y="220" width="80" height="64" rx="6" fill="#FFFFFF" stroke="#E89A4A"/>
    <text x="372" y="246" text-anchor="middle" font-size="12" fill="#1E3A5F" font-weight="600">排行榜</text>
    <text x="372" y="266" text-anchor="middle" font-size="11" fill="#3D4F65">最佳解</text>

    <rect x="416" y="220" width="80" height="64" rx="6" fill="#FFFFFF" stroke="#4B8BDA"/>
    <text x="456" y="246" text-anchor="middle" font-size="12" fill="#1E3A5F" font-weight="600">讨论区</text>
    <text x="456" y="266" text-anchor="middle" font-size="11" fill="#3D4F65">思路帖</text>
  </g>

  <text x="360" y="360" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC','Hiragino Sans GB',sans-serif" font-size="11" fill="#3D4F65" font-style="italic">前一个 Agent 的最佳解 / 失败思路 / verifier 边界都留给下一个</text>

  <!-- Agents around -->
  <g font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC','Hiragino Sans GB',sans-serif">
    <circle cx="80" cy="180" r="36" fill="#FFF5E8" stroke="#E89A4A" stroke-width="1.5"/>
    <text x="80" y="184" text-anchor="middle" font-size="13" fill="#1E3A5F" font-weight="600">Agent A</text>

    <circle cx="80" cy="360" r="36" fill="#FFF5E8" stroke="#E89A4A" stroke-width="1.5"/>
    <text x="80" y="364" text-anchor="middle" font-size="13" fill="#1E3A5F" font-weight="600">Agent B</text>

    <circle cx="640" cy="270" r="36" fill="#FFF5E8" stroke="#E89A4A" stroke-width="1.5"/>
    <text x="640" y="274" text-anchor="middle" font-size="13" fill="#1E3A5F" font-weight="600">Agent C</text>
  </g>

  <!-- Arrows: agents submit/read -->
  <path d="M 116 192 Q 190 215 240 235" fill="none" stroke="#4B8BDA" stroke-width="1.8" marker-end="url(#arr)"/>
  <text x="160" y="200" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC','Hiragino Sans GB',sans-serif" font-size="11" fill="#3D4F65">提交</text>

  <path d="M 116 348 Q 190 320 240 295" fill="none" stroke="#4B8BDA" stroke-width="1.8" marker-end="url(#arr)"/>
  <text x="160" y="350" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC','Hiragino Sans GB',sans-serif" font-size="11" fill="#3D4F65">读取</text>

  <path d="M 604 270 L 504 262" fill="none" stroke="#4B8BDA" stroke-width="1.8" marker-end="url(#arr)"/>
  <text x="540" y="256" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC','Hiragino Sans GB',sans-serif" font-size="11" fill="#3D4F65">接力</text>

  <!-- Bottom note -->
  <text x="360" y="445" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC','Hiragino Sans GB',sans-serif" font-size="12" fill="#1E3A5F">异构 Agent · 集体智能 · 真实 SOTA</text>
</svg>