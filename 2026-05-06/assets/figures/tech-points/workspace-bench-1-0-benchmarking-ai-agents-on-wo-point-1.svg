<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 620" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4B8BDA"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="450" y="38" text-anchor="middle" font-size="22" font-weight="bold" fill="#1E3A5F">像真实员工电脑一样的工作空间</text>
  <text x="450" y="62" text-anchor="middle" font-size="13" fill="#3D4F65">不给干净文件，让 Agent 自己在混乱目录里挖证据</text>

  <!-- Left: Clean sandbox -->
  <g>
    <rect x="40" y="100" width="240" height="200" rx="10" fill="#FFF4E6" stroke="#D99A4E" stroke-width="2"/>
    <text x="160" y="126" text-anchor="middle" font-size="14" font-weight="bold" fill="#1E3A5F">以往 Benchmark</text>
    <text x="160" y="146" text-anchor="middle" font-size="11" fill="#3D4F65">几份孤立文件 · 干净 sandbox</text>
    <g font-size="12" fill="#1E3A5F">
      <rect x="70" y="170" width="180" height="26" rx="3" fill="#FFFFFF" stroke="#D99A4E"/>
      <text x="82" y="188">report.pdf</text>
      <rect x="70" y="205" width="180" height="26" rx="3" fill="#FFFFFF" stroke="#D99A4E"/>
      <text x="82" y="223">data.csv</text>
      <rect x="70" y="240" width="180" height="26" rx="3" fill="#FFFFFF" stroke="#D99A4E"/>
      <text x="82" y="258">notes.txt</text>
    </g>
  </g>

  <!-- VS -->
  <text x="320" y="210" text-anchor="middle" font-size="28" font-weight="bold" fill="#4B8BDA">VS</text>

  <!-- Right: Messy workspace -->
  <g>
    <rect x="360" y="90" width="510" height="340" rx="10" fill="#EFF6FF" stroke="#4B8BDA" stroke-width="2"/>
    <text x="615" y="115" text-anchor="middle" font-size="14" font-weight="bold" fill="#1E3A5F">Workspace-Bench 真实工作空间</text>
    <text x="615" y="133" text-anchor="middle" font-size="11" fill="#3D4F65">20,476 文件 · 74 种格式 · 深度最多 8 层</text>

    <!-- tree -->
    <g font-size="12" fill="#1E3A5F" font-family="monospace">
      <text x="385" y="160">researcher/</text>
      <text x="410" y="180">literature/</text>
      <text x="435" y="198">paper_old.pdf</text>
      <text x="435" y="216">paper_v2.pdf</text>
      <text x="410" y="236">experiments/</text>
      <text x="435" y="254">report-v1.docx</text>
      <text x="435" y="272">report-reviewed.docx</text>
      <text x="435" y="290" font-weight="bold" fill="#B8691F">report-FINAL.docx  ★</text>
      <text x="410" y="310">tmp_backup/   (冗余)</text>
      <text x="410" y="330">misc_stuff/   (模糊命名)</text>
      <text x="385" y="356">src/   tests/   docs/ ...</text>
    </g>

    <!-- noise tags -->
    <g font-size="11">
      <rect x="695" y="150" width="155" height="26" rx="13" fill="#FFFFFF" stroke="#D99A4E"/>
      <text x="772" y="168" text-anchor="middle" fill="#B8691F">历史版本链</text>

      <rect x="695" y="188" width="155" height="26" rx="13" fill="#FFFFFF" stroke="#D99A4E"/>
      <text x="772" y="206" text-anchor="middle" fill="#B8691F">冗余文件夹</text>

      <rect x="695" y="226" width="155" height="26" rx="13" fill="#FFFFFF" stroke="#D99A4E"/>
      <text x="772" y="244" text-anchor="middle" fill="#B8691F">模糊命名</text>

      <rect x="695" y="264" width="155" height="26" rx="13" fill="#FFFFFF" stroke="#D99A4E"/>
      <text x="772" y="282" text-anchor="middle" fill="#B8691F">隐式引用</text>
    </g>

    <rect x="695" y="310" width="155" height="60" rx="8" fill="#FFFFFF" stroke="#4B8BDA"/>
    <text x="772" y="332" text-anchor="middle" font-size="11" font-weight="bold" fill="#1E3A5F">两阶段生成</text>
    <text x="772" y="350" text-anchor="middle" font-size="10" fill="#3D4F65">目录树 → 爬取</text>
    <text x="772" y="364" text-anchor="middle" font-size="10" fill="#3D4F65">+ LLM 合成内容</text>
  </g>

  <!-- Agent box -->
  <g>
    <rect x="80" y="470" width="200" height="80" rx="10" fill="#1E3A5F"/>
    <text x="180" y="500" text-anchor="middle" font-size="15" font-weight="bold" fill="#FFFFFF">Agent</text>
    <text x="180" y="522" text-anchor="middle" font-size="11" fill="#CFE0F5">任务："写周报"</text>
    <text x="180" y="540" text-anchor="middle" font-size="10" fill="#CFE0F5">自己翻目录 · 辨认最新版</text>
  </g>

  <!-- Personas -->
  <g>
    <rect x="340" y="460" width="530" height="100" rx="10" fill="#FFFFFF" stroke="#4B8BDA" stroke-width="1.5"/>
    <text x="605" y="482" text-anchor="middle" font-size="13" font-weight="bold" fill="#1E3A5F">5 种职业画像 · 规模差异巨大</text>
    <text x="360" y="505" font-size="11" fill="#3D4F65">Researcher: 11,020 文件 (最大)</text>
    <text x="600" y="505" font-size="11" fill="#3D4F65">Backend Developer</text>
    <text x="360" y="525" font-size="11" fill="#3D4F65">Operations Manager</text>
    <text x="600" y="525" font-size="11" fill="#3D4F65">Logistics Manager</text>
    <text x="360" y="545" font-size="11" fill="#3D4F65">AI Product Manager: 仅 1,379 文件</text>
    <text x="600" y="545" font-size="11" fill="#3D4F65">共 3,299 目录 · 平均深度 3.7</text>
  </g>

  <!-- Arrow: agent digs into workspace -->
  <path d="M 280 490 C 340 460, 360 440, 430 420" stroke="#4B8BDA" stroke-width="2.5" fill="none" marker-end="url(#ar)"/>
</svg>