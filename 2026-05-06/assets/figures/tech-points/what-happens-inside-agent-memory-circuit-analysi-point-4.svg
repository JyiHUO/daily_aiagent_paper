<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" font-family="'Helvetica Neue',Arial,sans-serif">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4B8BDA"/>
    </marker>
    <marker id="arR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#E07B5B"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="450" y="38" text-anchor="middle" font-size="22" font-weight="700" fill="#1E3A5F">无监督按阶段定位沉默失败</text>
  <text x="450" y="62" text-anchor="middle" font-size="13" fill="#3D4F65">挨个关掉三组特征，看谁扰动最大 → 就是出错的阶段</text>

  <!-- Failed sample -->
  <rect x="40" y="155" width="180" height="90" rx="10" fill="#FFF2EC" stroke="#E07B5B" stroke-width="2"/>
  <text x="130" y="183" text-anchor="middle" font-size="14" font-weight="700" fill="#1E3A5F">失败样本</text>
  <text x="130" y="205" text-anchor="middle" font-size="12" fill="#3D4F65">答案错了</text>
  <text x="130" y="223" text-anchor="middle" font-size="12" fill="#3D4F65">但不知错在哪</text>

  <!-- Arrow to probes -->
  <line x1="220" y1="200" x2="295" y2="200" stroke="#4B8BDA" stroke-width="2.5" marker-end="url(#ar)"/>

  <!-- Three probes -->
  <g>
    <rect x="300" y="100" width="180" height="60" rx="8" fill="#EFF6FF" stroke="#4B8BDA" stroke-width="2"/>
    <text x="390" y="125" text-anchor="middle" font-size="14" font-weight="700" fill="#1E3A5F">消融 Write 特征</text>
    <text x="390" y="146" text-anchor="middle" font-size="13" fill="#3D4F65">扰动 = 小</text>
  </g>

  <g>
    <rect x="300" y="170" width="180" height="60" rx="8" fill="#EFF6FF" stroke="#4B8BDA" stroke-width="2"/>
    <text x="390" y="195" text-anchor="middle" font-size="14" font-weight="700" fill="#1E3A5F">消融 Manage 特征</text>
    <text x="390" y="216" text-anchor="middle" font-size="13" fill="#3D4F65">扰动 = 小</text>
  </g>

  <g>
    <rect x="300" y="240" width="180" height="60" rx="8" fill="#FFE8DC" stroke="#E07B5B" stroke-width="3"/>
    <text x="390" y="265" text-anchor="middle" font-size="14" font-weight="700" fill="#1E3A5F">消融 Read 特征</text>
    <text x="390" y="286" text-anchor="middle" font-size="13" font-weight="700" fill="#C14A28">扰动 = 大 ★</text>
  </g>

  <!-- Arrow to verdict -->
  <line x1="480" y1="270" x2="560" y2="270" stroke="#E07B5B" stroke-width="3" marker-end="url(#arR)"/>

  <!-- Verdict -->
  <rect x="565" y="225" width="290" height="90" rx="10" fill="#FFF2EC" stroke="#E07B5B" stroke-width="2"/>
  <text x="710" y="253" text-anchor="middle" font-size="15" font-weight="700" fill="#1E3A5F">定位：Read 阶段出错</text>
  <text x="710" y="276" text-anchor="middle" font-size="12" fill="#3D4F65">检索到了事实，却没看</text>
  <text x="710" y="296" text-anchor="middle" font-size="12" fill="#3D4F65">（grounding failure）</text>

  <!-- Arrow down to fix -->
  <line x1="710" y1="315" x2="710" y2="358" stroke="#4B8BDA" stroke-width="2.5" marker-end="url(#ar)"/>

  <!-- Conditional fix -->
  <rect x="540" y="365" width="340" height="80" rx="10" fill="#E8F4E8" stroke="#5BA85B" stroke-width="2"/>
  <text x="710" y="393" text-anchor="middle" font-size="14" font-weight="700" fill="#1E3A5F">按阶段对症修复</text>
  <text x="710" y="415" text-anchor="middle" font-size="12" fill="#3D4F65">Read 错 → 放大 hub grounding 方向</text>
  <text x="710" y="433" text-anchor="middle" font-size="12" fill="#3D4F65">让模型重新关注记忆条目</text>

  <!-- Bottom stats -->
  <rect x="40" y="400" width="470" height="160" rx="10" fill="#F4F7FB" stroke="#4B8BDA" stroke-width="1.5"/>
  <text x="275" y="428" text-anchor="middle" font-size="14" font-weight="700" fill="#1E3A5F">诊断准确率 (Qwen-3 8B)</text>

  <g font-size="12" fill="#3D4F65">
    <text x="60" y="460">本方法</text>
    <rect x="140" y="448" width="290" height="16" fill="#4B8BDA"/>
    <text x="440" y="461" fill="#1E3A5F" font-weight="700">76.2%</text>

    <text x="60" y="490">监督 LR</text>
    <rect x="140" y="478" width="240" height="16" fill="#9BB8D9"/>
    <text x="390" y="491">63%</text>

    <text x="60" y="520">无训练基线</text>
    <rect x="140" y="508" width="198" height="16" fill="#C9D6E5"/>
    <text x="348" y="521">52%</text>
  </g>
  <text x="275" y="550" text-anchor="middle" font-size="11" fill="#3D4F65" font-style="italic">跨数据集 (LoCoMo, MemoryAgentBench) 无需重训 &gt;65%</text>
</svg>