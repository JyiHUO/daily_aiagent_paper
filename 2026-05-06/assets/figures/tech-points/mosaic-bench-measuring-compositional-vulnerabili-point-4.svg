<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4B8BDA"/>
    </marker>
  </defs>

  <rect width="900" height="560" fill="#F7F9FC"/>

  <text x="450" y="38" text-anchor="middle" font-size="22" font-weight="bold" fill="#1E3A5F">真漏洞 = 能在容器里被 PoC 打穿</text>
  <text x="450" y="62" text-anchor="middle" font-size="13" fill="#3D4F65">Oracle 是唯一有资格判真值的闸门</text>

  <!-- LEFT: other benchmarks -->
  <g>
    <rect x="40" y="110" width="340" height="180" rx="10" fill="#FDECEC" stroke="#D98A8A" stroke-width="1.5"/>
    <text x="210" y="138" text-anchor="middle" font-size="15" font-weight="bold" fill="#1E3A5F">以往基准</text>

    <rect x="70" y="160" width="280" height="44" rx="6" fill="#FFFFFF" stroke="#D98A8A"/>
    <text x="210" y="187" text-anchor="middle" font-size="13" fill="#3D4F65">LLM judge 说“看起来不安全”</text>

    <rect x="70" y="220" width="280" height="44" rx="6" fill="#FFFFFF" stroke="#D98A8A"/>
    <text x="210" y="247" text-anchor="middle" font-size="13" fill="#3D4F65">只看单轮代码字面特征</text>

    <text x="210" y="283" text-anchor="middle" font-size="12" fill="#B04A4A" font-style="italic">✗ 容易被糊弄</text>
  </g>

  <!-- RIGHT: MOSAIC oracle -->
  <g>
    <rect x="520" y="110" width="340" height="180" rx="10" fill="#EFF6FF" stroke="#4B8BDA" stroke-width="1.5"/>
    <text x="690" y="138" text-anchor="middle" font-size="15" font-weight="bold" fill="#1E3A5F">MOSAIC Oracle</text>

    <rect x="550" y="160" width="280" height="44" rx="6" fill="#FFFFFF" stroke="#4B8BDA"/>
    <text x="690" y="187" text-anchor="middle" font-size="13" fill="#3D4F65">真实 Docker 容器 + Python PoC</text>

    <rect x="550" y="220" width="280" height="44" rx="6" fill="#FFFFFF" stroke="#4B8BDA"/>
    <text x="690" y="247" text-anchor="middle" font-size="13" fill="#3D4F65">返回 VULNERABLE / SECURE</text>

    <text x="690" y="283" text-anchor="middle" font-size="12" fill="#1E6E3E" font-style="italic">✓ 100条复核 · FP = 0</text>
  </g>

  <!-- pipeline demo -->
  <text x="450" y="335" text-anchor="middle" font-size="14" font-weight="bold" fill="#1E3A5F">一条 CWE-915 攻击链如何被判真</text>

  <g font-size="12" fill="#1E3A5F">
    <rect x="40"  y="360" width="150" height="70" rx="8" fill="#EFF6FF" stroke="#4B8BDA"/>
    <text x="115" y="385" text-anchor="middle" font-weight="bold">① 部署</text>
    <text x="115" y="407" text-anchor="middle" fill="#3D4F65">三阶段 diff 合成进容器</text>

    <rect x="215" y="360" width="150" height="70" rx="8" fill="#EFF6FF" stroke="#4B8BDA"/>
    <text x="290" y="385" text-anchor="middle" font-weight="bold">② 健康检查</text>
    <text x="290" y="407" text-anchor="middle" fill="#3D4F65">等服务就绪</text>

    <rect x="390" y="360" width="150" height="70" rx="8" fill="#EFF6FF" stroke="#4B8BDA"/>
    <text x="465" y="385" text-anchor="middle" font-weight="bold">③ 发 PoC</text>
    <text x="465" y="407" text-anchor="middle" fill="#3D4F65">恶意 PATCH 注入字段</text>

    <rect x="565" y="360" width="150" height="70" rx="8" fill="#EFF6FF" stroke="#4B8BDA"/>
    <text x="640" y="385" text-anchor="middle" font-weight="bold">④ 验证</text>
    <text x="640" y="407" text-anchor="middle" fill="#3D4F65">字段是否持久化并读出</text>

    <rect x="740" y="360" width="120" height="70" rx="8" fill="#1E3A5F"/>
    <text x="800" y="390" text-anchor="middle" font-weight="bold" fill="#FFFFFF">判决</text>
    <text x="800" y="414" text-anchor="middle" fill="#FFD27A" font-weight="bold">VULNERABLE</text>
  </g>

  <line x1="190" y1="395" x2="213" y2="395" stroke="#4B8BDA" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="365" y1="395" x2="388" y2="395" stroke="#4B8BDA" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="540" y1="395" x2="563" y2="395" stroke="#4B8BDA" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="715" y1="395" x2="738" y2="395" stroke="#4B8BDA" stroke-width="2" marker-end="url(#arr)"/>

  <!-- bottom note -->
  <rect x="80" y="470" width="740" height="62" rx="8" fill="#FFF7E6" stroke="#E0A94B"/>
  <text x="450" y="495" text-anchor="middle" font-size="13" font-weight="bold" fill="#1E3A5F">覆盖: 10 Web 底座 · 31 CWE 类 · 5 种语言</text>
  <text x="450" y="516" text-anchor="middle" font-size="12" fill="#3D4F65">ASR 与 reviewer evasion 都对齐到此固定真值 → reviewer 协议可作自变量</text>
</svg>