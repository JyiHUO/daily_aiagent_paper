<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#C0504D"/>
    </marker>
    <marker id="arG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#2E8B57"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="450" y="38" text-anchor="middle" font-size="22" font-weight="bold" fill="#1E3A5F">只换 System Prompt：把 Reviewer 变成渗透测试员</text>
  <text x="450" y="62" text-anchor="middle" font-size="13" fill="#3D4F65">同样的 diff、同样的模型 — 提问姿势不同，检测率翻倍</text>

  <!-- Center diff block -->
  <rect x="380" y="100" width="140" height="80" rx="8" fill="#FEF7E6" stroke="#D4A017" stroke-width="1.5"/>
  <text x="450" y="130" text-anchor="middle" font-size="13" font-weight="bold" fill="#1E3A5F">同一份 PR diff</text>
  <text x="450" y="156" text-anchor="middle" font-size="11" fill="#3D4F65">恶意工单拆分后的代码改动</text>

  <!-- Left: engineer framing -->
  <rect x="60" y="230" width="320" height="180" rx="10" fill="#FDECEA" stroke="#C0504D" stroke-width="1.8"/>
  <text x="220" y="258" text-anchor="middle" font-size="15" font-weight="bold" fill="#8B2E26">❌ 资深工程师做 PR Review</text>
  <text x="220" y="282" text-anchor="middle" font-size="11" fill="#3D4F65" font-style="italic">"看看这段代码风格、逻辑是否 OK"</text>

  <rect x="85" y="300" width="120" height="90" rx="6" fill="#ffffff" stroke="#C0504D"/>
  <text x="145" y="322" text-anchor="middle" font-size="11" fill="#3D4F65">Sonnet 4.6</text>
  <text x="145" y="355" text-anchor="middle" font-size="22" font-weight="bold" fill="#C0504D">21.6%</text>
  <text x="145" y="375" text-anchor="middle" font-size="10" fill="#3D4F65">漏放行</text>

  <rect x="235" y="300" width="120" height="90" rx="6" fill="#ffffff" stroke="#C0504D"/>
  <text x="295" y="322" text-anchor="middle" font-size="11" fill="#3D4F65">Gemma-4 E4B</text>
  <text x="295" y="355" text-anchor="middle" font-size="22" font-weight="bold" fill="#C0504D">59.8%</text>
  <text x="295" y="375" text-anchor="middle" font-size="10" fill="#3D4F65">漏放行</text>

  <!-- Right: pentester framing -->
  <rect x="520" y="230" width="320" height="180" rx="10" fill="#E8F5EC" stroke="#2E8B57" stroke-width="1.8"/>
  <text x="680" y="258" text-anchor="middle" font-size="15" font-weight="bold" fill="#1F5F3A">✓ 渗透测试员视角</text>
  <text x="680" y="282" text-anchor="middle" font-size="11" fill="#3D4F65" font-style="italic">"先列 CWE，想想怎么 exploit，再决定"</text>

  <rect x="545" y="300" width="120" height="90" rx="6" fill="#ffffff" stroke="#2E8B57"/>
  <text x="605" y="322" text-anchor="middle" font-size="11" fill="#3D4F65">Sonnet 4.6</text>
  <text x="605" y="355" text-anchor="middle" font-size="22" font-weight="bold" fill="#2E8B57">3.0%</text>
  <text x="605" y="375" text-anchor="middle" font-size="10" fill="#3D4F65">漏放行</text>

  <rect x="695" y="300" width="120" height="90" rx="6" fill="#ffffff" stroke="#2E8B57"/>
  <text x="755" y="322" text-anchor="middle" font-size="11" fill="#3D4F65">Gemma-4 E4B</text>
  <text x="755" y="355" text-anchor="middle" font-size="22" font-weight="bold" fill="#2E8B57">11.6%</text>
  <text x="755" y="375" text-anchor="middle" font-size="10" fill="#3D4F65">漏放行</text>

  <!-- Arrows from diff to both sides -->
  <path d="M 400 180 Q 320 210 270 230" fill="none" stroke="#C0504D" stroke-width="2" marker-end="url(#arR)"/>
  <path d="M 500 180 Q 580 210 630 230" fill="none" stroke="#2E8B57" stroke-width="2" marker-end="url(#arG)"/>

  <!-- Bottom highlight -->
  <rect x="140" y="445" width="620" height="85" rx="10" fill="#EFF6FF" stroke="#4B8BDA" stroke-width="1.5"/>
  <text x="450" y="471" text-anchor="middle" font-size="14" font-weight="bold" fill="#1E3A5F">零训练 · 只改一段 system prompt</text>
  <text x="450" y="494" text-anchor="middle" font-size="12" fill="#3D4F65">开源小模型 Gemma-4 达到 88.4% 检测率，真实 PR 上 FP 仅 4.6%</text>
  <text x="450" y="514" text-anchor="middle" font-size="12" fill="#3D4F65">单次成本约 $0.001 — 比 Sonnet 便宜两三个数量级</text>
</svg>