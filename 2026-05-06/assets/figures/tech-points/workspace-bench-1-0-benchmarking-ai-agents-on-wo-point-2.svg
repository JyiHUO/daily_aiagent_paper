<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" font-family="'Helvetica Neue',Arial,sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4B8BDA"/>
    </marker>
  </defs>

  <rect width="900" height="600" fill="#FAF7F2"/>

  <text x="450" y="42" text-anchor="middle" font-size="22" font-weight="700" fill="#1E3A5F">依赖图驱动的任务标注：让 Agent 没法"蒙对"</text>
  <text x="450" y="68" text-anchor="middle" font-size="13" fill="#3D4F65">一个任务 = 指令 + 文件依赖图 + 三类 rubric</text>

  <!-- Task card -->
  <rect x="40" y="110" width="240" height="180" rx="10" fill="#EFF6FF" stroke="#4B8BDA" stroke-width="1.5"/>
  <text x="160" y="138" text-anchor="middle" font-size="14" font-weight="700" fill="#1E3A5F">真实工作空间任务</text>
  <text x="160" y="162" text-anchor="middle" font-size="12" fill="#3D4F65">"生成全球市场产品策略"</text>
  <text x="60" y="198" font-size="11.5" fill="#3D4F65">• 5 区域订单/物流数据</text>
  <text x="60" y="221" font-size="11.5" fill="#3D4F65">• 9 个核心文件</text>
  <text x="60" y="244" font-size="11.5" fill="#3D4F65">• 平均 5.1 条依赖边</text>
  <text x="60" y="267" font-size="11.5" fill="#3D4F65">• 25 名真实角色标注员</text>

  <!-- Dependency graph mini -->
  <rect x="330" y="110" width="240" height="180" rx="10" fill="#FFF3E6" stroke="#E08A3C" stroke-width="1.5"/>
  <text x="450" y="138" text-anchor="middle" font-size="14" font-weight="700" fill="#1E3A5F">文件依赖图</text>

  <line x1="378" y1="220" x2="440" y2="182" stroke="#B9762F" stroke-width="1.3"/>
  <line x1="418" y1="247" x2="448" y2="190" stroke="#B9762F" stroke-width="1.3"/>
  <line x1="465" y1="248" x2="453" y2="190" stroke="#B9762F" stroke-width="1.3"/>
  <line x1="508" y1="242" x2="460" y2="186" stroke="#B9762F" stroke-width="1.3"/>
  <line x1="520" y1="205" x2="463" y2="178" stroke="#B9762F" stroke-width="1.3"/>

  <circle cx="450" cy="175" r="16" fill="#E08A3C"/>
  <text x="450" y="179" text-anchor="middle" font-size="10" fill="#fff" font-weight="700">报告</text>

  <circle cx="370" cy="230" r="13" fill="#F4B678"/>
  <text x="370" y="234" text-anchor="middle" font-size="9" fill="#fff">欧洲</text>
  <circle cx="415" cy="258" r="13" fill="#F4B678"/>
  <text x="415" y="262" text-anchor="middle" font-size="9" fill="#fff">北美</text>
  <circle cx="465" cy="260" r="13" fill="#F4B678"/>
  <text x="465" y="264" text-anchor="middle" font-size="9" fill="#fff">亚太</text>
  <circle cx="515" cy="250" r="13" fill="#F4B678"/>
  <text x="515" y="254" text-anchor="middle" font-size="9" fill="#fff">物流</text>
  <circle cx="528" cy="212" r="13" fill="#F4B678"/>
  <text x="528" y="216" text-anchor="middle" font-size="9" fill="#fff">客户</text>

  <!-- Rubric block -->
  <rect x="620" y="110" width="240" height="180" rx="10" fill="#EEF5EE" stroke="#5C9A6E" stroke-width="1.5"/>
  <text x="740" y="138" text-anchor="middle" font-size="14" font-weight="700" fill="#1E3A5F">可验证 Rubric × 19.1</text>

  <rect x="635" y="155" width="210" height="34" rx="5" fill="#D7E8DA"/>
  <text x="645" y="170" font-size="11.5" font-weight="700" fill="#1E3A5F">Foundation 25%</text>
  <text x="645" y="184" font-size="10.5" fill="#3D4F65">文件找对了没</text>

  <rect x="635" y="195" width="210" height="34" rx="5" fill="#C9E0CE"/>
  <text x="645" y="210" font-size="11.5" font-weight="700" fill="#1E3A5F">Process 20%</text>
  <text x="645" y="224" font-size="10.5" fill="#3D4F65">过程步骤是否正确</text>

  <rect x="635" y="235" width="210" height="44" rx="5" fill="#B5D5BC"/>
  <text x="645" y="253" font-size="11.5" font-weight="700" fill="#1E3A5F">Result 55%</text>
  <text x="645" y="270" font-size="10.5" fill="#3D4F65">欧洲销售额 = 503,568.21 ?</text>

  <!-- Arrows -->
  <line x1="282" y1="200" x2="326" y2="200" stroke="#4B8BDA" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="572" y1="200" x2="616" y2="200" stroke="#4B8BDA" stroke-width="2" marker-end="url(#arr)"/>

  <!-- Bottom comparison -->
  <rect x="60" y="360" width="360" height="180" rx="10" fill="#F5E9E9" stroke="#C47878" stroke-width="1.3"/>
  <text x="240" y="390" text-anchor="middle" font-size="14" font-weight="700" fill="#8A3A3A">✗ 旧评测：只看最终答案</text>
  <text x="240" y="428" text-anchor="middle" font-size="12" fill="#3D4F65">Agent 用过时版本文件也能"蒙出"合理报告</text>
  <text x="240" y="478" text-anchor="middle" font-size="12" font-style="italic" fill="#8A3A3A">→ 不知道哪一步错了</text>

  <rect x="480" y="360" width="360" height="180" rx="10" fill="#E6F0E8" stroke="#5C9A6E" stroke-width="1.3"/>
  <text x="660" y="390" text-anchor="middle" font-size="14" font-weight="700" fill="#2F6B46">✓ 本文：分层可定位</text>
  <text x="660" y="424" text-anchor="middle" font-size="12" fill="#3D4F65">依赖图约束"必须读哪些文件"</text>
  <text x="660" y="448" text-anchor="middle" font-size="12" fill="#3D4F65">模糊标准 → 可执行断言</text>
  <text x="660" y="482" text-anchor="middle" font-size="12" font-style="italic" fill="#2F6B46">→ 定位到具体失败环节</text>

  <text x="450" y="575" text-anchor="middle" font-size="12" fill="#3D4F65">388 任务 · 154 真实工作流 · 7399 条 rubric</text>
</svg>