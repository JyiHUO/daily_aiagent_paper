<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" font-family="'Helvetica Neue',Arial,sans-serif">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4B8BDA"/>
    </marker>
  </defs>

  <rect width="900" height="600" fill="#FAF7F2"/>

  <text x="450" y="40" text-anchor="middle" font-size="22" font-weight="700" fill="#1E3A5F">4 Harness × 7 模型 = 28 组 Agent 系统评测</text>
  <text x="450" y="64" text-anchor="middle" font-size="13" fill="#3D4F65">模型是天花板，Harness 是补丁</text>

  <!-- Left: Harness -->
  <rect x="50" y="100" width="180" height="210" rx="10" fill="#EFF6FF" stroke="#4B8BDA" stroke-width="1.5"/>
  <text x="140" y="128" text-anchor="middle" font-size="15" font-weight="700" fill="#1E3A5F">4 Harness</text>
  <text x="140" y="165" text-anchor="middle" font-size="13" fill="#3D4F65">ClaudeCode</text>
  <text x="140" y="195" text-anchor="middle" font-size="13" fill="#3D4F65">DeepAgent</text>
  <text x="140" y="225" text-anchor="middle" font-size="13" fill="#3D4F65">Hermes</text>
  <text x="140" y="255" text-anchor="middle" font-size="13" fill="#3D4F65">OpenClaw</text>

  <!-- Right: Models -->
  <rect x="670" y="100" width="180" height="210" rx="10" fill="#FFF1E6" stroke="#E8A063" stroke-width="1.5"/>
  <text x="760" y="128" text-anchor="middle" font-size="15" font-weight="700" fill="#1E3A5F">7 底座模型</text>
  <text x="760" y="160" text-anchor="middle" font-size="12" fill="#3D4F65">Opus-4.7 · GPT-5.4</text>
  <text x="760" y="185" text-anchor="middle" font-size="12" fill="#3D4F65">Gemini-3.1-Pro · Kimi-2.5</text>
  <text x="760" y="210" text-anchor="middle" font-size="12" fill="#3D4F65">Seed-2.0-Code · GLM-5.1</text>
  <text x="760" y="235" text-anchor="middle" font-size="12" fill="#3D4F65">MiniMax-M2.7</text>

  <!-- Center combine -->
  <circle cx="450" cy="205" r="62" fill="#1E3A5F"/>
  <text x="450" y="200" text-anchor="middle" font-size="28" font-weight="700" fill="#FFFFFF">28</text>
  <text x="450" y="224" text-anchor="middle" font-size="12" fill="#EFF6FF">组合评测</text>

  <line x1="230" y1="205" x2="385" y2="205" stroke="#4B8BDA" stroke-width="2" marker-end="url(#ar)"/>
  <line x1="670" y1="205" x2="515" y2="205" stroke="#4B8BDA" stroke-width="2" marker-end="url(#ar)"/>

  <!-- Results Section -->
  <rect x="50" y="360" width="800" height="210" rx="10" fill="#FFFFFF" stroke="#C9D4E2" stroke-width="1"/>
  <text x="450" y="388" text-anchor="middle" font-size="15" font-weight="700" fill="#1E3A5F">关键结果：离人类还差一大截</text>

  <!-- Bars -->
  <g font-size="12" fill="#3D4F65">
    <text x="200" y="432" text-anchor="end">人类 + 工具</text>
    <rect x="210" y="418" width="485" height="20" fill="#6FA86F" rx="3"/>
    <text x="705" y="433" fill="#1E3A5F" font-weight="700">80.7%</text>

    <text x="200" y="467" text-anchor="end">最佳：OpenClaw + Opus-4.7</text>
    <rect x="210" y="453" width="413" height="20" fill="#4B8BDA" rx="3"/>
    <text x="633" y="468" fill="#1E3A5F" font-weight="700">68.7%</text>

    <text x="200" y="502" text-anchor="end">28 组平均</text>
    <rect x="210" y="488" width="285" height="20" fill="#A8C4E0" rx="3"/>
    <text x="505" y="503" fill="#1E3A5F" font-weight="700">47.4%</text>
  </g>

  <!-- Warning callout -->
  <rect x="110" y="525" width="680" height="34" rx="6" fill="#FCEBE3" stroke="#E8A063" stroke-width="1"/>
  <text x="450" y="547" text-anchor="middle" font-size="12.5" fill="#1E3A5F">成本爆炸：DeepAgent + MiniMax 单任务 58 轮 / 61 万 token，得分仅 45%</text>
</svg>