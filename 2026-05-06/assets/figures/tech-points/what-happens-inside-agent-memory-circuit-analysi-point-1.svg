<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" font-family="'Helvetica Neue',Arial,sans-serif">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4B8BDA"/>
    </marker>
    <marker id="arR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#C44A4A"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="450" y="38" text-anchor="middle" font-size="22" font-weight="700" fill="#1E3A5F">控制电路先上岗，内容电路后出生</text>
  <text x="450" y="62" text-anchor="middle" font-size="13" fill="#3D4F65">Manage 路由在 0.6B 就能用，Write / Read 要等到 4B</text>

  <!-- Manage bar (early) -->
  <rect x="90" y="95" width="680" height="58" rx="8" fill="#EFF6FF" stroke="#4B8BDA" stroke-width="2"/>
  <circle cx="110" cy="124" r="6" fill="#4B8BDA"/>
  <text x="125" y="120" font-size="15" font-weight="700" fill="#1E3A5F">Manage (路由 add / update / delete)</text>
  <text x="125" y="140" font-size="12" fill="#3D4F65">0.6B 已出现显著 causal gap = 0.259（bootstrap CI 不含零）</text>

  <!-- Write/Read bar (late) -->
  <rect x="490" y="225" width="280" height="58" rx="8" fill="#FFF3E6" stroke="#E89547" stroke-width="2"/>
  <circle cx="510" cy="254" r="6" fill="#E89547"/>
  <text x="525" y="250" font-size="15" font-weight="700" fill="#1E3A5F">Write / Read (内容提取)</text>
  <text x="525" y="270" font-size="12" fill="#3D4F65">≥ 4B 才出现可检测的内容电路</text>

  <!-- Left hint near Write/Read start -->
  <text x="100" y="258" font-size="12" fill="#A0AEC0" font-style="italic">小模型里还不存在</text>
  <line x1="220" y1="254" x2="485" y2="254" stroke="#CBD5E0" stroke-width="1" stroke-dasharray="3,3"/>

  <!-- Axis: model scale -->
  <line x1="90" y1="310" x2="820" y2="310" stroke="#B8C4D6" stroke-width="2"/>
  <polygon points="820,310 810,305 810,315" fill="#B8C4D6"/>
  <text x="830" y="314" font-size="12" fill="#3D4F65">模型规模</text>

  <!-- Scale ticks -->
  <g font-size="12" fill="#3D4F65" text-anchor="middle">
    <line x1="170" y1="305" x2="170" y2="315" stroke="#8AA0BD"/>
    <text x="170" y="330">0.6B</text>
    <line x1="330" y1="305" x2="330" y2="315" stroke="#8AA0BD"/>
    <text x="330" y="330">1.7B</text>
    <line x1="490" y1="305" x2="490" y2="315" stroke="#8AA0BD"/>
    <text x="490" y="330">4B</text>
    <line x1="720" y1="305" x2="720" y2="315" stroke="#8AA0BD"/>
    <text x="720" y="330">8B+</text>
  </g>

  <!-- Bottom: concrete example -->
  <rect x="60" y="355" width="780" height="190" rx="10" fill="#F7FAFC" stroke="#CBD5E0" stroke-width="1.5"/>
  <text x="450" y="382" text-anchor="middle" font-size="15" font-weight="700" fill="#1E3A5F">后果：调度员按了键，秘书还没读懂</text>

  <!-- Input -->
  <rect x="85" y="410" width="200" height="110" rx="8" fill="#FFFFFF" stroke="#8AA0BD"/>
  <text x="185" y="432" text-anchor="middle" font-size="12" font-weight="700" fill="#1E3A5F">输入（两条无关记忆）</text>
  <text x="185" y="458" text-anchor="middle" font-size="11" fill="#3D4F65">旧: 用户开普锐斯</text>
  <text x="185" y="478" text-anchor="middle" font-size="11" fill="#3D4F65">新: 用户喜欢远足</text>

  <!-- 0.6B wrong -->
  <rect x="335" y="410" width="235" height="110" rx="8" fill="#FDECEC" stroke="#C44A4A" stroke-width="2"/>
  <text x="452" y="432" text-anchor="middle" font-size="12" font-weight="700" fill="#8B2E2E">0.6B  ✗ 沉默失败</text>
  <text x="452" y="460" text-anchor="middle" font-size="13" font-family="monospace" fill="#8B2E2E">{"event": "UPDATE"}</text>
  <text x="452" y="485" text-anchor="middle" font-size="11" fill="#3D4F65">路由合法 / JSON 合法</text>
  <text x="452" y="502" text-anchor="middle" font-size="11" fill="#3D4F65">但把旧记忆覆盖掉</text>

  <!-- 8B right -->
  <rect x="620" y="410" width="200" height="110" rx="8" fill="#E8F5E8" stroke="#4A9D5A" stroke-width="2"/>
  <text x="720" y="432" text-anchor="middle" font-size="12" font-weight="700" fill="#2E6B3A">8B  ✓ 正确</text>
  <text x="720" y="460" text-anchor="middle" font-size="13" font-family="monospace" fill="#2E6B3A">{"event": "NONE"}</text>
  <text x="720" y="488" text-anchor="middle" font-size="11" fill="#3D4F65">真的读懂 = 无关</text>

  <!-- Arrows in example -->
  <line x1="285" y1="465" x2="330" y2="465" stroke="#C44A4A" stroke-width="2" marker-end="url(#arR)"/>
  <line x1="570" y1="465" x2="615" y2="465" stroke="#4B8BDA" stroke-width="2" marker-end="url(#ar)"/>
</svg>