<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#333"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="450" y="38" text-anchor="middle" font-size="22" font-weight="bold" fill="#1a1a1a">SAGA 的取舍：延迟↓，但吞吐也↓</text>
  <text x="450" y="62" text-anchor="middle" font-size="14" fill="#666">不是免费午餐 — 选对场景才划算</text>

  <!-- Left: Interactive scenario -->
  <rect x="50" y="100" width="370" height="240" rx="12" fill="#e8f5ee" stroke="#2e8b57" stroke-width="2"/>
  <text x="235" y="130" text-anchor="middle" font-size="17" font-weight="bold" fill="#1f6b3f">✅ 交互式 Agent 服务</text>
  <text x="235" y="152" text-anchor="middle" font-size="13" fill="#444">用户在等 → 延迟优先</text>

  <!-- vLLM bar -->
  <text x="70" y="188" font-size="12" fill="#555">vLLM+APC</text>
  <rect x="150" y="175" width="200" height="18" fill="#c0c0c0"/>
  <text x="358" y="189" font-size="12" fill="#333">~330s</text>

  <!-- SAGA bar -->
  <text x="70" y="222" font-size="12" fill="#2e8b57" font-weight="bold">SAGA</text>
  <rect x="150" y="209" width="123" height="18" fill="#2e8b57"/>
  <text x="281" y="223" font-size="12" fill="#2e8b57" font-weight="bold">~203s (1.64×)</text>

  <text x="235" y="268" text-anchor="middle" font-size="13" fill="#1f6b3f">KV 重算: 38% → 8%</text>
  <text x="235" y="290" text-anchor="middle" font-size="13" fill="#1f6b3f">显存利用率: 42% → 71%</text>
  <text x="235" y="312" text-anchor="middle" font-size="13" fill="#1f6b3f">SLO 达成率: 99.2%</text>

  <!-- Right: Batch scenario -->
  <rect x="480" y="100" width="370" height="240" rx="12" fill="#fdecec" stroke="#c0392b" stroke-width="2"/>
  <text x="665" y="130" text-anchor="middle" font-size="17" font-weight="bold" fill="#a02a1f">❌ 离线批量评测</text>
  <text x="665" y="152" text-anchor="middle" font-size="13" fill="#444">整夜跑分 → 吞吐优先</text>

  <text x="500" y="188" font-size="12" fill="#555">大 batch vLLM</text>
  <rect x="590" y="175" width="200" height="18" fill="#c0392b"/>
  <text x="798" y="189" font-size="12" fill="#333">100%</text>

  <text x="500" y="222" font-size="12" fill="#c0392b" font-weight="bold">SAGA</text>
  <rect x="590" y="209" width="140" height="18" fill="#e88a80"/>
  <text x="738" y="223" font-size="12" fill="#c0392b" font-weight="bold">~70% (慢 30%)</text>

  <text x="665" y="268" text-anchor="middle" font-size="13" fill="#a02a1f">为保 workflow 亲和</text>
  <text x="665" y="290" text-anchor="middle" font-size="13" fill="#a02a1f">牺牲了批合并机会</text>
  <text x="665" y="312" text-anchor="middle" font-size="13" fill="#a02a1f">AutoGen 动态辩论: -12~18%</text>

  <!-- Bottom insight -->
  <rect x="90" y="370" width="720" height="200" rx="12" fill="#fff8e1" stroke="#d4a017" stroke-width="2"/>
  <text x="450" y="400" text-anchor="middle" font-size="16" font-weight="bold" fill="#8a6d10">核心取舍</text>

  <!-- Two labeled arrows showing tradeoff -->
  <g transform="translate(120,438)">
    <text x="0" y="0" font-size="13" fill="#2e8b57" font-weight="bold">workflow 级 cache 亲和</text>
    <line x1="190" y1="-5" x2="370" y2="-5" stroke="#333" stroke-width="2" marker-end="url(#ar)"/>
    <text x="470" y="0" text-anchor="middle" font-size="13" fill="#1f6b3f" font-weight="bold">单任务延迟 ↓↓</text>
  </g>

  <g transform="translate(120,483)">
    <text x="0" y="0" font-size="13" fill="#c0392b" font-weight="bold">session 绑定 worker</text>
    <line x1="190" y1="-5" x2="370" y2="-5" stroke="#333" stroke-width="2" marker-end="url(#ar)"/>
    <text x="470" y="0" text-anchor="middle" font-size="13" fill="#a02a1f" font-weight="bold">集群峰值吞吐 ↓ 30%</text>
  </g>

  <text x="450" y="545" text-anchor="middle" font-size="13" fill="#555" font-style="italic">适用：延迟敏感的在线 Agent · 不适用：离线大 batch 评测</text>
</svg>