<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#333"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1e7e34"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="450" y="34" text-anchor="middle" font-size="22" font-weight="bold" fill="#222">预算感知排序调用：先排序，再花钱</text>
  <text x="450" y="58" text-anchor="middle" font-size="13" fill="#666">500 条查询，预算 K=100 次工具调用</text>

  <!-- Input pile -->
  <rect x="40" y="110" width="150" height="340" rx="8" fill="#eef3f8" stroke="#6b8caf"/>
  <text x="115" y="135" text-anchor="middle" font-size="14" font-weight="bold" fill="#2c3e50">500 条待办</text>
  <g font-size="11" fill="#333">
    <rect x="55" y="150" width="120" height="22" fill="#fff" stroke="#9bb"/><text x="115" y="166" text-anchor="middle">query #1</text>
    <rect x="55" y="178" width="120" height="22" fill="#fff" stroke="#9bb"/><text x="115" y="194" text-anchor="middle">query #2</text>
    <rect x="55" y="206" width="120" height="22" fill="#fff" stroke="#9bb"/><text x="115" y="222" text-anchor="middle">query #3</text>
    <text x="115" y="250" text-anchor="middle" fill="#999">...</text>
    <rect x="55" y="262" width="120" height="22" fill="#fff" stroke="#9bb"/><text x="115" y="278" text-anchor="middle">query #k</text>
    <text x="115" y="310" text-anchor="middle" fill="#999">...</text>
    <rect x="55" y="410" width="120" height="22" fill="#fff" stroke="#9bb"/><text x="115" y="426" text-anchor="middle">query #500</text>
  </g>

  <!-- Arrow to LUE -->
  <line x1="190" y1="280" x2="248" y2="280" stroke="#333" stroke-width="2" marker-end="url(#arr)"/>

  <!-- LUE scorer -->
  <rect x="250" y="220" width="170" height="120" rx="10" fill="#fff4d6" stroke="#c8952a" stroke-width="2"/>
  <text x="335" y="252" text-anchor="middle" font-size="15" font-weight="bold" fill="#8a5a00">LUE 置信度</text>
  <text x="335" y="278" text-anchor="middle" font-size="12" fill="#6a4500">隐状态探针打分</text>
  <text x="335" y="308" text-anchor="middle" font-size="13" fill="#6a4500" font-weight="bold">P(调用有用)</text>

  <!-- Arrow to sorted -->
  <line x1="420" y1="280" x2="478" y2="280" stroke="#333" stroke-width="2" marker-end="url(#arr)"/>

  <!-- Sorted list with top-K -->
  <rect x="480" y="110" width="200" height="340" rx="8" fill="#f4f8f4" stroke="#4a7a4a"/>
  <text x="580" y="135" text-anchor="middle" font-size="14" font-weight="bold" fill="#254b25">按分数降序排序</text>

  <!-- Top K block (green) -->
  <rect x="495" y="150" width="170" height="150" rx="6" fill="#d6f0d6" stroke="#2f8f2f" stroke-width="2"/>
  <text x="580" y="170" text-anchor="middle" font-size="12" font-weight="bold" fill="#1e5a1e">Top-K = 100 → 调工具</text>
  <g font-size="11" fill="#1e5a1e">
    <text x="515" y="195">0.97</text>
    <text x="515" y="217">0.93</text>
    <text x="515" y="239">0.88</text>
    <text x="515" y="263" fill="#2f8f2f">...（前 100 条）</text>
    <text x="515" y="287">0.61</text>
  </g>

  <!-- Rest (gray) -->
  <rect x="495" y="310" width="170" height="130" rx="6" fill="#eeeeee" stroke="#999"/>
  <text x="580" y="330" text-anchor="middle" font-size="12" font-weight="bold" fill="#555">其余 400 条 → 参数回答</text>
  <g font-size="11" fill="#555">
    <text x="515" y="355">0.42</text>
    <text x="515" y="377">0.30</text>
    <text x="515" y="399">...</text>
    <text x="515" y="421">0.05</text>
  </g>

  <!-- Outputs -->
  <line x1="680" y1="225" x2="748" y2="200" stroke="#1e7e34" stroke-width="2" marker-end="url(#arrG)"/>
  <rect x="750" y="170" width="120" height="60" rx="8" fill="#eaffea" stroke="#1e7e34" stroke-width="2"/>
  <text x="810" y="195" text-anchor="middle" font-size="13" font-weight="bold" fill="#1e7e34">Web 搜索</text>
  <text x="810" y="215" text-anchor="middle" font-size="12" fill="#1e7e34">花光预算</text>

  <line x1="680" y1="375" x2="748" y2="400" stroke="#666" stroke-width="2" marker-end="url(#arr)"/>
  <rect x="750" y="370" width="120" height="60" rx="8" fill="#f5f5f5" stroke="#666" stroke-width="2"/>
  <text x="810" y="395" text-anchor="middle" font-size="13" font-weight="bold" fill="#444">参数知识</text>
  <text x="810" y="413" text-anchor="middle" font-size="12" fill="#444">零成本回答</text>

  <!-- Bottom comparison -->
  <rect x="40" y="480" width="400" height="60" rx="8" fill="#fdecea" stroke="#c0392b"/>
  <text x="60" y="503" font-size="13" font-weight="bold" fill="#c0392b">✗ 让模型自己看预算</text>
  <text x="60" y="524" font-size="12" fill="#7a2a22">逐条独立判断 → 超预算、浪费调用</text>

  <rect x="460" y="480" width="400" height="60" rx="8" fill="#eaf7ea" stroke="#1e7e34"/>
  <text x="480" y="503" font-size="13" font-weight="bold" fill="#1e7e34">✓ 全局排序 + Top-K</text>
  <text x="480" y="524" font-size="12" fill="#1a5a1a">高价值优先，更高 Utility Gain</text>
</svg>