<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" font-family="'Helvetica Neue',Arial,sans-serif">
  <rect width="900" height="600" fill="#f7f8fb"/>

  <!-- Title -->
  <text x="450" y="42" text-anchor="middle" font-size="22" font-weight="700" fill="#1a2238">模型的"自我感知" ≠ 真实需要</text>
  <text x="450" y="66" text-anchor="middle" font-size="13" fill="#5a6274">自信但不准：内心自洽，却与真实需求错位</text>

  <!-- LEFT: Ideal nesting -->
  <g transform="translate(60,110)">
    <text x="170" y="0" text-anchor="middle" font-size="15" font-weight="700" fill="#2b7a3d">理想情况（嵌套）</text>

    <circle cx="170" cy="170" r="130" fill="#d9f0df" stroke="#2b7a3d" stroke-width="2"/>
    <circle cx="170" cy="185" r="88" fill="#a6dfb5" stroke="#2b7a3d" stroke-width="2"/>
    <circle cx="170" cy="210" r="48" fill="#6ec587" stroke="#1f5a2c" stroke-width="2"/>

    <text x="170" y="65" text-anchor="middle" font-size="12" font-weight="700" fill="#1f5a2c">真实有用</text>
    <text x="170" y="135" text-anchor="middle" font-size="12" font-weight="700" fill="#1f5a2c">自觉需要</text>
    <text x="170" y="214" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">实际调用</text>

    <text x="170" y="340" text-anchor="middle" font-size="12" fill="#555">调用 ⊆ 自觉需要 ⊆ 真实有用</text>
  </g>

  <!-- VS -->
  <text x="450" y="270" text-anchor="middle" font-size="22" font-weight="700" fill="#c0392b">VS</text>

  <!-- RIGHT: Real misalignment -->
  <g transform="translate(500,110)">
    <text x="170" y="0" text-anchor="middle" font-size="15" font-weight="700" fill="#b23a3a">真实情况（错位）</text>

    <circle cx="120" cy="155" r="80" fill="#fce3e3" stroke="#b23a3a" stroke-width="2" opacity="0.8"/>
    <circle cx="220" cy="155" r="80" fill="#ffe7c2" stroke="#d97b1f" stroke-width="2" opacity="0.8"/>
    <circle cx="170" cy="235" r="75" fill="#dbe6ff" stroke="#2e5bbf" stroke-width="2" opacity="0.8"/>

    <text x="90" y="130" text-anchor="middle" font-size="12" font-weight="700" fill="#b23a3a">真实有用</text>
    <text x="250" y="130" text-anchor="middle" font-size="12" font-weight="700" fill="#a55a10">自觉需要</text>
    <text x="170" y="265" text-anchor="middle" font-size="12" font-weight="700" fill="#2e5bbf">实际调用</text>

    <line x1="60" y1="185" x2="20" y2="330" stroke="#b23a3a" stroke-width="1.5"/>
    <text x="30" y="345" text-anchor="middle" font-size="11" fill="#b23a3a">该调没调</text>

    <line x1="280" y1="185" x2="320" y2="330" stroke="#d97b1f" stroke-width="1.5"/>
    <text x="320" y="345" text-anchor="middle" font-size="11" fill="#a55a10">调了反而错</text>
  </g>

  <!-- Bottom insight box -->
  <g transform="translate(90,470)">
    <rect x="0" y="0" width="720" height="100" rx="12" fill="#ffffff" stroke="#1a2238" stroke-width="1.5"/>
    <text x="360" y="32" text-anchor="middle" font-size="14" font-weight="700" fill="#1a2238">观察：模型内心自洽，但与真实偏离</text>
    <text x="180" y="62" text-anchor="middle" font-size="12" fill="#b23a3a">Mistral：系统性高估</text>
    <text x="360" y="62" text-anchor="middle" font-size="12" fill="#555">"觉得要调 ⇔ 真的调"</text>
    <text x="560" y="62" text-anchor="middle" font-size="12" fill="#2e5bbf">Llama3.2-3B：系统性低估</text>
    <text x="360" y="86" text-anchor="middle" font-size="12" fill="#333">→ 需要外部信号来校准，而非依赖模型自我判断</text>
  </g>
</svg>