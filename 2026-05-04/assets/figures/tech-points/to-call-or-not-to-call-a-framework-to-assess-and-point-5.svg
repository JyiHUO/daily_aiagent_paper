<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#444"/>
    </marker>
    <linearGradient id="gEasy" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#d8f3dc"/>
      <stop offset="1" stop-color="#a7e4b6"/>
    </linearGradient>
    <linearGradient id="gHard" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#ffe0e0"/>
      <stop offset="1" stop-color="#ffb3b3"/>
    </linearGradient>
  </defs>

  <text x="450" y="40" text-anchor="middle" font-size="24" font-weight="700" fill="#1a1a1a">Need 好学，Utility 难学</text>
  <text x="450" y="66" text-anchor="middle" font-size="14" fill="#666">判断"我会不会" vs 判断"工具会返回什么"</text>

  <!-- LEFT: Need -->
  <rect x="60" y="100" width="340" height="380" rx="14" fill="url(#gEasy)" stroke="#2d8a5a" stroke-width="2"/>
  <text x="230" y="136" text-anchor="middle" font-size="20" font-weight="700" fill="#1a4a2e">Need (LNE) · 我自己能答吗？</text>

  <rect x="100" y="170" width="260" height="130" rx="10" fill="#ffffff" stroke="#2d8a5a"/>
  <text x="230" y="195" text-anchor="middle" font-size="14" font-weight="700" fill="#1a4a2e">LLM 隐状态</text>
  <circle cx="150" cy="240" r="10" fill="#52b788"/>
  <circle cx="185" cy="230" r="14" fill="#40916c"/>
  <circle cx="225" cy="245" r="11" fill="#52b788"/>
  <circle cx="265" cy="233" r="13" fill="#40916c"/>
  <circle cx="305" cy="243" r="9" fill="#52b788"/>
  <text x="230" y="283" text-anchor="middle" font-size="12" fill="#2d6a4a">信号已经在模型里</text>

  <rect x="100" y="325" width="260" height="50" rx="8" fill="#1b4332"/>
  <text x="230" y="357" text-anchor="middle" font-size="18" font-weight="700" fill="#fff">score ≈ 0.58–0.65</text>

  <text x="230" y="415" text-anchor="middle" font-size="13" fill="#1a4a2e">✓ 小模型上提升尤其明显</text>
  <text x="230" y="440" text-anchor="middle" font-size="13" fill="#1a4a2e">✓ 只依赖模型 + 题目</text>

  <!-- RIGHT: Utility -->
  <rect x="500" y="100" width="340" height="380" rx="14" fill="url(#gHard)" stroke="#c9302c" stroke-width="2"/>
  <text x="670" y="136" text-anchor="middle" font-size="20" font-weight="700" fill="#7a1f1f">Utility (LUE) · 工具会返回啥？</text>

  <rect x="540" y="170" width="260" height="130" rx="10" fill="#ffffff" stroke="#c9302c"/>
  <text x="670" y="195" text-anchor="middle" font-size="14" font-weight="700" fill="#7a1f1f">外部工具 (黑盒)</text>
  <text x="670" y="215" text-anchor="middle" font-size="11" fill="#9a2e2e">行为嘈杂 · 文字描述不够</text>
  <text x="560" y="250" font-size="12" fill="#7a1f1f">search(q)</text>
  <text x="560" y="272" font-size="12" font-style="italic" fill="#b03a3a">→ ??? 不可预测</text>
  <text x="780" y="255" text-anchor="middle" font-size="24" font-weight="700" fill="#c9302c">?</text>
  <text x="755" y="285" text-anchor="middle" font-size="24" font-weight="700" fill="#c9302c">?</text>

  <rect x="540" y="325" width="260" height="50" rx="8" fill="#7a1f1f"/>
  <text x="670" y="357" text-anchor="middle" font-size="18" font-weight="700" fill="#fff">score 可跌至 0.07–0.16</text>

  <text x="670" y="415" text-anchor="middle" font-size="13" fill="#7a1f1f">✗ 加入工具描述反而更差</text>
  <text x="670" y="440" text-anchor="middle" font-size="13" fill="#7a1f1f">✗ 需建模外部系统</text>

  <!-- arrow from Need to Utility (upper bound) -->
  <path d="M400 235 Q450 210 500 235" stroke="#444" stroke-width="2" fill="none" marker-end="url(#ar)"/>
  <text x="450" y="205" text-anchor="middle" font-size="12" font-weight="600" fill="#444">Utility ≤ Need (上界)</text>

  <!-- bottom insight -->
  <rect x="140" y="500" width="620" height="44" rx="8" fill="#1a1a1a"/>
  <text x="450" y="528" text-anchor="middle" font-size="14" font-weight="600" fill="#fff">想更好决策，必须更好地建模工具，而不仅是加描述</text>
</svg>