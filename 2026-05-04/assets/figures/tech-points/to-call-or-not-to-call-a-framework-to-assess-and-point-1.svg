<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" font-family="-apple-system,Helvetica,Arial,sans-serif">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
  </defs>

  <rect width="900" height="560" fill="#f8fafc"/>

  <!-- Title -->
  <text x="450" y="42" text-anchor="middle" font-size="24" font-weight="700" fill="#0f172a">要不要调用工具？拆成三个问题</text>
  <text x="450" y="68" text-anchor="middle" font-size="14" fill="#64748b">Necessity · Utility · Affordability</text>

  <!-- Question box -->
  <rect x="310" y="95" width="280" height="52" rx="10" fill="#1e293b"/>
  <text x="450" y="120" text-anchor="middle" font-size="14" fill="#fbbf24">问题：2024 超级碗中场秀是谁?</text>
  <text x="450" y="138" text-anchor="middle" font-size="12" fill="#cbd5e1">是否调用 Web Search ?</text>

  <!-- Necessity -->
  <g>
    <rect x="60" y="190" width="230" height="230" rx="14" fill="#fff" stroke="#3b82f6" stroke-width="2.5"/>
    <circle cx="95" cy="225" r="18" fill="#3b82f6"/>
    <text x="95" y="231" text-anchor="middle" font-size="18" font-weight="700" fill="#fff">1</text>
    <text x="125" y="222" font-size="17" font-weight="700" fill="#1e40af">Necessity</text>
    <text x="125" y="240" font-size="12" fill="#64748b">我自己会吗？</text>

    <line x1="80" y1="260" x2="270" y2="260" stroke="#e2e8f0"/>

    <text x="75" y="285" font-size="12" font-weight="600" fill="#0f172a">NO TOOL 测试：直接作答 → 错 ✗</text>
    <rect x="75" y="300" width="200" height="28" rx="5" fill="#dbeafe"/>
    <text x="175" y="319" text-anchor="middle" font-size="13" font-weight="700" fill="#1e40af">True Need = 1</text>

    <text x="75" y="360" font-size="12" fill="#475569">→ 模型知识不够，</text>
    <text x="75" y="380" font-size="12" fill="#475569">   必须调工具</text>
  </g>

  <!-- Utility -->
  <g>
    <rect x="335" y="190" width="230" height="230" rx="14" fill="#fff" stroke="#10b981" stroke-width="2.5"/>
    <circle cx="370" cy="225" r="18" fill="#10b981"/>
    <text x="370" y="231" text-anchor="middle" font-size="18" font-weight="700" fill="#fff">2</text>
    <text x="400" y="222" font-size="17" font-weight="700" fill="#047857">Utility</text>
    <text x="400" y="240" font-size="12" fill="#64748b">工具帮得上吗？</text>

    <line x1="355" y1="260" x2="545" y2="260" stroke="#e2e8f0"/>

    <text x="350" y="285" font-size="12" font-weight="600" fill="#0f172a">ALWAYS TOOL：搜索后 → 对 ✓</text>
    <rect x="350" y="300" width="200" height="28" rx="5" fill="#d1fae5"/>
    <text x="450" y="319" text-anchor="middle" font-size="13" font-weight="700" fill="#047857">True Utility = +1</text>

    <text x="350" y="360" font-size="12" fill="#475569">→ 调用真能提分，</text>
    <text x="350" y="380" font-size="12" fill="#475569">   非冗余也非有害</text>
  </g>

  <!-- Affordability -->
  <g>
    <rect x="610" y="190" width="230" height="230" rx="14" fill="#fff" stroke="#f59e0b" stroke-width="2.5"/>
    <circle cx="645" cy="225" r="18" fill="#f59e0b"/>
    <text x="645" y="231" text-anchor="middle" font-size="18" font-weight="700" fill="#fff">3</text>
    <text x="675" y="222" font-size="17" font-weight="700" fill="#b45309">Affordability</text>
    <text x="675" y="240" font-size="12" fill="#64748b">值这个成本吗？</text>

    <line x1="630" y1="260" x2="820" y2="260" stroke="#e2e8f0"/>

    <text x="625" y="285" font-size="12" font-weight="600" fill="#0f172a">预算 100 次：按收益挑 top-K</text>
    <rect x="625" y="300" width="200" height="28" rx="5" fill="#fef3c7"/>
    <text x="725" y="319" text-anchor="middle" font-size="13" font-weight="700" fill="#b45309">高收益 → 入选 ✓</text>

    <text x="625" y="360" font-size="12" fill="#475569">→ 别浪费在本来就</text>
    <text x="625" y="380" font-size="12" fill="#475569">   会的简单题上</text>
  </g>

  <!-- Arrows from question -->
  <path d="M380,147 L185,188" stroke="#334155" stroke-width="1.8" fill="none" marker-end="url(#ar)"/>
  <path d="M450,150 L450,186" stroke="#334155" stroke-width="1.8" fill="none" marker-end="url(#ar)"/>
  <path d="M520,147 L715,188" stroke="#334155" stroke-width="1.8" fill="none" marker-end="url(#ar)"/>

  <!-- Bottom conclusion -->
  <rect x="120" y="455" width="660" height="70" rx="12" fill="#0f172a"/>
  <text x="450" y="483" text-anchor="middle" font-size="15" font-weight="700" fill="#fbbf24">三维全过 = 真正值得调</text>
  <text x="450" y="507" text-anchor="middle" font-size="12" fill="#cbd5e1">可定位错误：是误判自己？误判工具？还是不会算账？</text>
</svg>