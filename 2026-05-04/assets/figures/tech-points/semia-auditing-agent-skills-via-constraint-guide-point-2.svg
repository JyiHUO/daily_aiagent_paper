<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 560" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#333"/>
    </marker>
    <marker id="ared" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#c0392b"/>
    </marker>
    <marker id="agreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1e8449"/>
    </marker>
    <marker id="apurple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#7d3c98"/>
    </marker>
  </defs>

  <text x="430" y="34" text-anchor="middle" font-size="20" font-weight="700" fill="#1a1a1a">CGRS: propose → verify → evaluate 循环</text>
  <text x="430" y="56" text-anchor="middle" font-size="13" fill="#666">把英文 skill 策略编译成可推理 IR，带反馈地修</text>

  <!-- Propose -->
  <rect x="40" y="210" width="170" height="100" rx="10" fill="#eaf2fb" stroke="#2c6fb8" stroke-width="2"/>
  <text x="125" y="240" text-anchor="middle" font-size="15" font-weight="700" fill="#1a3a66">Propose</text>
  <text x="125" y="264" text-anchor="middle" font-size="12" fill="#333">LLM 生成候选 SDL</text>
  <text x="125" y="286" text-anchor="middle" font-size="11" fill="#666">(可能漏 safeguard)</text>

  <!-- Validate -->
  <rect x="290" y="170" width="200" height="180" rx="10" fill="#fff7e6" stroke="#d49320" stroke-width="2"/>
  <text x="390" y="198" text-anchor="middle" font-size="15" font-weight="700" fill="#7a5510">Validate (结构 + 语义)</text>
  <text x="390" y="224" text-anchor="middle" font-size="12" fill="#333">I-ref 引用有效</text>
  <text x="390" y="246" text-anchor="middle" font-size="12" fill="#333">I-flow 数据流连通</text>
  <text x="390" y="268" text-anchor="middle" font-size="12" fill="#333">I-auth 注解可解析</text>
  <line x1="310" y1="284" x2="470" y2="284" stroke="#d49320" stroke-dasharray="3,3"/>
  <text x="390" y="308" text-anchor="middle" font-size="11" fill="#555">Verbalize: SDL→英文</text>
  <text x="390" y="328" text-anchor="middle" font-size="11" fill="#555">与原 skill 算语义距离 d</text>

  <!-- Evaluate outcomes -->
  <rect x="590" y="90" width="230" height="90" rx="10" fill="#eaf7ee" stroke="#1e8449" stroke-width="2"/>
  <text x="705" y="118" text-anchor="middle" font-size="15" font-weight="700" fill="#14532d">✓ 通过</text>
  <text x="705" y="142" text-anchor="middle" font-size="12" fill="#333">结构合法 且 d ≤ 阈值</text>
  <text x="705" y="162" text-anchor="middle" font-size="12" fill="#333">→ 得到可推理 IR</text>

  <rect x="590" y="215" width="230" height="80" rx="10" fill="#fdecea" stroke="#c0392b" stroke-width="2"/>
  <text x="705" y="240" text-anchor="middle" font-size="14" font-weight="700" fill="#7a1f13">结构失败 → Diagnose</text>
  <text x="705" y="262" text-anchor="middle" font-size="11" fill="#333">精确 hint，如 "v 无 producer"</text>
  <text x="705" y="282" text-anchor="middle" font-size="11" fill="#666">下轮定点修补</text>

  <rect x="590" y="325" width="230" height="80" rx="10" fill="#f4eaf7" stroke="#7d3c98" stroke-width="2"/>
  <text x="705" y="350" text-anchor="middle" font-size="14" font-weight="700" fill="#4a1e63">语义跑偏 → Rewrite</text>
  <text x="705" y="372" text-anchor="middle" font-size="11" fill="#333">不给 hint，整段重写</text>
  <text x="705" y="392" text-anchor="middle" font-size="11" fill="#666">(避免照抄错误)</text>

  <!-- Forward arrows -->
  <line x1="210" y1="260" x2="286" y2="260" stroke="#333" stroke-width="2" marker-end="url(#a)"/>
  <line x1="490" y1="215" x2="586" y2="140" stroke="#1e8449" stroke-width="2" marker-end="url(#agreen)"/>
  <line x1="490" y1="255" x2="586" y2="250" stroke="#c0392b" stroke-width="2" marker-end="url(#ared)"/>
  <line x1="490" y1="305" x2="586" y2="360" stroke="#7d3c98" stroke-width="2" marker-end="url(#apurple)"/>

  <!-- Feedback loops back to Propose -->
  <path d="M 590 255 Q 400 440 212 300" fill="none" stroke="#c0392b" stroke-width="2" stroke-dasharray="5,4" marker-end="url(#ared)"/>
  <path d="M 590 365 Q 380 480 210 308" fill="none" stroke="#7d3c98" stroke-width="2" stroke-dasharray="5,4" marker-end="url(#apurple)"/>
  <text x="415" y="470" text-anchor="middle" font-size="12" fill="#555" font-style="italic">带反馈地重跑，直到两项都通过或预算耗尽</text>

  <!-- Bottom note -->
  <rect x="40" y="495" width="780" height="46" rx="8" fill="#f5f5f7" stroke="#bbb"/>
  <text x="430" y="516" text-anchor="middle" font-size="12" fill="#333">一次性生成 IR 常漏 safeguard；refinement 循环让 F1 再涨 ~4 点</text>
  <text x="430" y="533" text-anchor="middle" font-size="11" fill="#777">结构错给精准 hint 局部修；语义偏则强制整段重写</text>
</svg>