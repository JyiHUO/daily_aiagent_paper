<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 620" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#333"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#c0392b"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="450" y="36" text-anchor="middle" font-size="22" font-weight="bold" fill="#222">AFS: 按"剩余工作量 / 剩余时间"算紧迫度</text>
  <text x="450" y="60" text-anchor="middle" font-size="14" fill="#666">越快撞 deadline，越先分 GPU</text>

  <!-- Formula box -->
  <rect x="210" y="85" width="480" height="54" rx="8" fill="#fff8e1" stroke="#e0a800" stroke-width="2"/>
  <text x="450" y="118" text-anchor="middle" font-size="17" fill="#333" font-family="Georgia, serif">AFS_i  =  Σ  work_remain(t) / (deadline − now)</text>

  <!-- Heavy tenant -->
  <g>
    <rect x="60" y="175" width="340" height="180" rx="10" fill="#eaf4ff" stroke="#3b82f6" stroke-width="2"/>
    <text x="230" y="200" text-anchor="middle" font-size="16" font-weight="bold" fill="#1e3a8a">重租户：100 步 Agent</text>

    <circle cx="95" cy="240" r="8" fill="#3b82f6"/>
    <circle cx="125" cy="240" r="8" fill="#3b82f6"/>
    <circle cx="155" cy="240" r="8" fill="#3b82f6"/>
    <circle cx="185" cy="240" r="8" fill="#93c5fd"/>
    <circle cx="215" cy="240" r="8" fill="#93c5fd"/>
    <circle cx="245" cy="240" r="8" fill="#93c5fd"/>
    <circle cx="275" cy="240" r="8" fill="#93c5fd"/>
    <circle cx="305" cy="240" r="8" fill="#93c5fd"/>
    <circle cx="335" cy="240" r="8" fill="#93c5fd"/>
    <circle cx="365" cy="240" r="8" fill="#93c5fd"/>
    <text x="230" y="268" text-anchor="middle" font-size="12" fill="#555">剩余工作量大、deadline 也远</text>

    <rect x="100" y="290" width="260" height="50" rx="6" fill="#fff" stroke="#3b82f6"/>
    <text x="230" y="310" text-anchor="middle" font-size="13" fill="#1e3a8a">AFS 较低 → 本 epoch 分到较少容量</text>
    <text x="230" y="328" text-anchor="middle" font-size="11" fill="#888">(深色=已完成, 浅色=待执行)</text>
  </g>

  <!-- Light tenant -->
  <g>
    <rect x="500" y="175" width="340" height="180" rx="10" fill="#fff1f0" stroke="#e11d48" stroke-width="2"/>
    <text x="670" y="200" text-anchor="middle" font-size="16" font-weight="bold" fill="#9f1239">轻租户：10 步 Agent（落后了）</text>

    <circle cx="560" cy="240" r="8" fill="#e11d48"/>
    <circle cx="600" cy="240" r="8" fill="#e11d48"/>
    <circle cx="640" cy="240" r="8" fill="#fecdd3"/>
    <circle cx="680" cy="240" r="8" fill="#fecdd3"/>
    <text x="670" y="268" text-anchor="middle" font-size="12" fill="#555">工作量小但 deadline 逼近</text>

    <rect x="540" y="290" width="260" height="50" rx="6" fill="#fff" stroke="#e11d48"/>
    <text x="670" y="310" text-anchor="middle" font-size="13" font-weight="bold" fill="#9f1239">AFS 飙升 → 优先抢更多 worker</text>
    <text x="670" y="328" text-anchor="middle" font-size="11" fill="#888">紧迫度主导调度</text>
  </g>

  <!-- Scheduler -->
  <rect x="270" y="395" width="360" height="70" rx="10" fill="#111827"/>
  <text x="450" y="422" text-anchor="middle" font-size="16" font-weight="bold" fill="#fff">Global Scheduler · 每 100ms 重算 AFS</text>
  <text x="450" y="447" text-anchor="middle" font-size="12" fill="#d1d5db">按 AFS 比例分配 worker 容量</text>

  <!-- Arrows from tenants to scheduler -->
  <path d="M270,355 L360,395" stroke="#3b82f6" stroke-width="2" fill="none" marker-end="url(#arr)"/>
  <path d="M630,355 L540,395" stroke="#e11d48" stroke-width="2.5" fill="none" marker-end="url(#arr)"/>

  <!-- Preemption / migration -->
  <rect x="90" y="505" width="330" height="80" rx="10" fill="#fff" stroke="#c0392b" stroke-width="2"/>
  <text x="255" y="530" text-anchor="middle" font-size="14" font-weight="bold" fill="#c0392b">阻塞 &gt; 500ms → 抢占迁移</text>
  <text x="255" y="552" text-anchor="middle" font-size="12" fill="#444">KV cache 随任务搬到低优 worker</text>
  <text x="255" y="572" text-anchor="middle" font-size="12" fill="#444">不丢弃、不重算</text>

  <rect x="480" y="505" width="330" height="80" rx="10" fill="#fff" stroke="#16a34a" stroke-width="2"/>
  <text x="645" y="530" text-anchor="middle" font-size="14" font-weight="bold" fill="#16a34a">Lyapunov 证明自纠偏</text>
  <text x="645" y="552" text-anchor="middle" font-size="12" fill="#444">谁掉队谁紧迫度涨 → 下轮多拿</text>
  <text x="645" y="572" text-anchor="middle" font-size="13" font-weight="bold" fill="#15803d">SLO 达成率 99.2%</text>

  <path d="M360,465 L260,505" stroke="#c0392b" stroke-width="2" fill="none" marker-end="url(#arrR)"/>
  <path d="M540,465 L640,505" stroke="#16a34a" stroke-width="2" fill="none" marker-end="url(#arrG)"/>
</svg>