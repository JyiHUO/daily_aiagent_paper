<svg xmlns="http://www.w3.org/2000/svg" width="720" height="480" viewBox="0 0 720 480">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4B8BDA"/>
    </marker>
  </defs>

  <text x="360" y="44" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC','Hiragino Sans GB',sans-serif" font-size="20" font-weight="700" fill="#1E3A5F">三元联合评测</text>
  <text x="360" y="68" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC','Hiragino Sans GB',sans-serif" font-size="13" fill="#3D4F65">单一指标会被退化策略欺骗</text>

  <!-- SR -->
  <g>
    <rect x="70" y="110" width="170" height="200" rx="10" fill="#EFF6FF" stroke="#4B8BDA" stroke-width="2"/>
    <text x="155" y="148" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="22" font-weight="700" fill="#1E3A5F">SR</text>
    <text x="155" y="172" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="13" fill="#3D4F65">该停时停</text>
    <line x1="100" y1="190" x2="210" y2="190" stroke="#C8D4E0"/>
    <text x="155" y="218" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="11" fill="#3D4F65">危险场景中阻断比例</text>
    <text x="155" y="265" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="11" fill="#A66B3D">单看 → 全拒也满分</text>
    <text x="155" y="290" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="11" fill="#A66B3D">无法识别懒惰策略</text>
  </g>

  <!-- UR -->
  <g>
    <rect x="275" y="110" width="170" height="200" rx="10" fill="#FFF4E6" stroke="#E8A85C" stroke-width="2"/>
    <text x="360" y="148" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="22" font-weight="700" fill="#1E3A5F">UR</text>
    <text x="360" y="172" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="13" fill="#3D4F65">该走时走</text>
    <line x1="305" y1="190" x2="415" y2="190" stroke="#E8C8A0"/>
    <text x="360" y="218" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="11" fill="#3D4F65">安全配对中执行比例</text>
    <text x="360" y="265" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="11" fill="#A66B3D">单看 → 全执行也满分</text>
    <text x="360" y="290" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="11" fill="#A66B3D">奖励 compliance bias</text>
  </g>

  <!-- IRR -->
  <g>
    <rect x="480" y="110" width="170" height="200" rx="10" fill="#F0F4EF" stroke="#7BA05B" stroke-width="2"/>
    <text x="565" y="148" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="22" font-weight="700" fill="#1E3A5F">IRR</text>
    <text x="565" y="172" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="13" fill="#3D4F65">说出原因</text>
    <line x1="510" y1="190" x2="620" y2="190" stroke="#C8D4C0"/>
    <text x="565" y="218" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="11" fill="#3D4F65">拒绝中指出缺失条件</text>
    <text x="565" y="265" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="11" fill="#A66B3D">单看 → 区分敷衍拒绝</text>
    <text x="565" y="290" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="11" fill="#A66B3D">与有理由的拒绝</text>
  </g>

  <!-- Joint arrows -->
  <line x1="155" y1="310" x2="320" y2="395" stroke="#4B8BDA" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="360" y1="310" x2="360" y2="395" stroke="#4B8BDA" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="565" y1="310" x2="400" y2="395" stroke="#4B8BDA" stroke-width="2" marker-end="url(#arr)"/>

  <rect x="240" y="400" width="240" height="55" rx="27" fill="#1E3A5F"/>
  <text x="360" y="425" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="15" font-weight="700" fill="#FFFFFF">三元联合报告</text>
  <text x="360" y="444" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="11" fill="#C8D4E0">SR + UR + IRR 缺一不可</text>
</svg>