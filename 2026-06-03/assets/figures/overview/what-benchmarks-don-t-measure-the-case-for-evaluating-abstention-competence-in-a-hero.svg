<svg xmlns="http://www.w3.org/2000/svg" width="900" height="600" viewBox="0 0 900 600">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4B8BDA"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#3FA66A"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#D9534F"/>
    </marker>
  </defs>

  <style>
    .t {font-family:'PingFang SC','Microsoft YaHei','Noto Sans CJK SC','Hiragino Sans GB',sans-serif;}
  </style>

  <!-- Title -->
  <text class="t" x="450" y="42" text-anchor="middle" font-size="22" font-weight="700" fill="#1E3A5F">该不该执行：Agent 的弃权能力评测</text>
  <text class="t" x="450" y="64" text-anchor="middle" font-size="13" fill="#3D4F65">Compliance Bias · 三类 Gap · SR / UR / IRR</text>

  <!-- Left: incoming task -->
  <g>
    <rect x="40" y="135" width="170" height="70" rx="10" fill="#FFF4E6" stroke="#E6A65D" stroke-width="1.5"/>
    <text class="t" x="125" y="163" text-anchor="middle" font-size="14" font-weight="600" fill="#1E3A5F">用户请求</text>
    <text class="t" x="125" y="186" text-anchor="middle" font-size="11" fill="#3D4F65">"给 Sarah 转 5000"</text>
  </g>

  <!-- Central shield (abstention gate) -->
  <g transform="translate(450,300)">
    <path d="M0,-150 L120,-115 L120,40 Q120,130 0,170 Q-120,130 -120,40 L-120,-115 Z"
          fill="#EFF6FF" stroke="#1E3A5F" stroke-width="2.2"/>
    <text class="t" x="0" y="-118" text-anchor="middle" font-size="14" font-weight="700" fill="#1E3A5F">Abstention Gate</text>
    <text class="t" x="0" y="-99" text-anchor="middle" font-size="11" fill="#3D4F65">运行时弃权关卡</text>

    <!-- three checkpoints -->
    <g transform="translate(0,-75)">
      <rect x="-95" y="0" width="190" height="42" rx="6" fill="#FFFFFF" stroke="#4B8BDA" stroke-width="1.3"/>
      <text class="t" x="-82" y="18" font-size="12" font-weight="600" fill="#1E3A5F">① Specification</text>
      <text class="t" x="-82" y="34" font-size="10.5" fill="#3D4F65">规约缺口 → 缺字段</text>
    </g>
    <g transform="translate(0,-20)">
      <rect x="-95" y="0" width="190" height="42" rx="6" fill="#FFFFFF" stroke="#4B8BDA" stroke-width="1.3"/>
      <text class="t" x="-82" y="18" font-size="12" font-weight="600" fill="#1E3A5F">② Verification</text>
      <text class="t" x="-82" y="34" font-size="10.5" fill="#3D4F65">验证缺口 → 状态未确认</text>
    </g>
    <g transform="translate(0,35)">
      <rect x="-95" y="0" width="190" height="42" rx="6" fill="#FFFFFF" stroke="#4B8BDA" stroke-width="1.3"/>
      <text class="t" x="-82" y="18" font-size="12" font-weight="600" fill="#1E3A5F">③ Authority</text>
      <text class="t" x="-82" y="34" font-size="10.5" fill="#3D4F65">授权缺口 → 无显式批准</text>
    </g>

    <text class="t" x="0" y="148" text-anchor="middle" font-size="11" fill="#3D4F65">独立 Guard 模型 · 工具边界拦截</text>
  </g>

  <!-- arrow request -> shield -->
  <path d="M 210,170 Q 280,180 332,210" stroke="#4B8BDA" stroke-width="2" fill="none" marker-end="url(#arr)"/>

  <!-- Right top: safe execute -->
  <g>
    <rect x="695" y="150" width="170" height="86" rx="10" fill="#E8F4EC" stroke="#3FA66A" stroke-width="1.5"/>
    <text class="t" x="780" y="178" text-anchor="middle" font-size="14" font-weight="700" fill="#1E3A5F">✓ 执行</text>
    <text class="t" x="780" y="200" text-anchor="middle" font-size="11" fill="#3D4F65">前置条件齐全</text>
    <text class="t" x="780" y="220" text-anchor="middle" font-size="11.5" fill="#3FA66A" font-weight="600">Usability Rate (UR)</text>
  </g>

  <!-- Right bottom: pause -->
  <g>
    <rect x="695" y="370" width="170" height="106" rx="10" fill="#FCEBEA" stroke="#D9534F" stroke-width="1.5"/>
    <text class="t" x="780" y="398" text-anchor="middle" font-size="14" font-weight="700" fill="#1E3A5F">⏸ 暂停 / 弃权</text>
    <text class="t" x="780" y="420" text-anchor="middle" font-size="11" fill="#3D4F65">阻断危险动作</text>
    <text class="t" x="780" y="440" text-anchor="middle" font-size="11.5" fill="#D9534F" font-weight="600">Safety Rate (SR)</text>
    <text class="t" x="780" y="460" text-anchor="middle" font-size="10.5" fill="#3D4F65">+ 说明缺什么 → IRR</text>
  </g>

  <!-- arrows from shield outward -->
  <path d="M 568,250 Q 640,210 690,195" stroke="#3FA66A" stroke-width="2" fill="none" marker-end="url(#arrG)"/>
  <path d="M 568,350 Q 640,400 690,415" stroke="#D9534F" stroke-width="2" fill="none" marker-end="url(#arrR)"/>

  <!-- Bottom: compliance bias contrast -->
  <g transform="translate(40,500)">
    <rect x="0" y="0" width="820" height="80" rx="8" fill="#F4F1EA" stroke="#C9B98A" stroke-width="1"/>
    <text class="t" x="20" y="25" font-size="13" font-weight="700" fill="#1E3A5F">Compliance Bias：benchmark 默认"继续执行就是对的"</text>
    <text class="t" x="20" y="48" font-size="11.5" fill="#3D4F65">RLHF 偏好自信完成 + 评分只看 final state → Agent 缺信息也硬执行</text>
    <text class="t" x="20" y="68" font-size="11.5" fill="#3D4F65">本文主张：SR / UR / IRR 三元联合上报，单一指标会被退化策略骗过</text>
  </g>
</svg>