<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" font-family="-apple-system,Segoe UI,Arial,sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#333"/>
    </marker>
  </defs>

  <rect width="900" height="560" fill="#f7f8fb"/>

  <text x="450" y="38" text-anchor="middle" font-size="22" font-weight="700" fill="#1a1a1a">Loop Breaker · 三级熔断器</text>
  <text x="450" y="62" text-anchor="middle" font-size="13" fill="#666">同一动作点不动？整屏幕在原地转圈？—— 分级强制换招</text>

  <!-- Agent stuck panel -->
  <g>
    <rect x="30" y="110" width="180" height="340" rx="12" fill="#fff" stroke="#bbb" stroke-width="1.5"/>
    <text x="120" y="140" text-anchor="middle" font-size="15" font-weight="600" fill="#222">Agent 卡住了</text>
    <circle cx="120" cy="215" r="46" fill="#ffe3e3" stroke="#e24a4a" stroke-width="2"/>
    <text x="120" y="210" text-anchor="middle" font-size="12" fill="#9b1c1c">同一按钮</text>
    <text x="120" y="228" text-anchor="middle" font-size="12" fill="#9b1c1c">点 N 次</text>
    <rect x="48" y="290" width="144" height="70" rx="6" fill="#f0f4ff" stroke="#99b"/>
    <text x="120" y="312" text-anchor="middle" font-size="11" fill="#334">每步检查计数器</text>
    <text x="120" y="332" text-anchor="middle" font-size="11" fill="#334">n_a: 动作无变化</text>
    <text x="120" y="350" text-anchor="middle" font-size="11" fill="#334">n_o: 画面重复</text>
    <text x="120" y="395" text-anchor="middle" font-size="11" fill="#666">可插拔 · 每步都跑</text>
  </g>

  <!-- arrow to tiers -->
  <line x1="215" y1="280" x2="245" y2="280" stroke="#333" stroke-width="2" marker-end="url(#a)"/>

  <!-- Tier 1 -->
  <g>
    <rect x="250" y="110" width="290" height="100" rx="10" fill="#e8f5e9" stroke="#43a047" stroke-width="2"/>
    <circle cx="278" cy="140" r="16" fill="#43a047"/>
    <text x="278" y="146" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">1</text>
    <text x="305" y="145" font-size="15" font-weight="700" fill="#1b5e20">换交互模态</text>
    <text x="305" y="172" font-size="12" fill="#333">n_a 超阈值 → 小改动</text>
    <text x="305" y="192" font-size="12" fill="#555">快捷键 → 菜单 → 命令行</text>
  </g>

  <!-- Tier 2 -->
  <g>
    <rect x="250" y="230" width="290" height="100" rx="10" fill="#fff3e0" stroke="#fb8c00" stroke-width="2"/>
    <circle cx="278" cy="260" r="16" fill="#fb8c00"/>
    <text x="278" y="266" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">2</text>
    <text x="305" y="265" font-size="15" font-weight="700" fill="#e65100">换整体策略</text>
    <text x="305" y="292" font-size="12" fill="#333">n_o 超阈值 → 换路</text>
    <text x="305" y="312" font-size="12" fill="#555">菜单导航 → 程序化编辑</text>
  </g>

  <!-- Tier 3 -->
  <g>
    <rect x="250" y="350" width="290" height="100" rx="10" fill="#fce4ec" stroke="#d81b60" stroke-width="2"/>
    <circle cx="278" cy="380" r="16" fill="#d81b60"/>
    <text x="278" y="386" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">3</text>
    <text x="305" y="385" font-size="15" font-weight="700" fill="#880e4f">外部 Judge 拉黑</text>
    <text x="305" y="412" font-size="12" fill="#333">看轨迹判 keep / switch</text>
    <text x="305" y="432" font-size="12" fill="#555">重复动作禁用 + 强制注入</text>
  </g>

  <!-- arrows tiers -> result panel -->
  <line x1="545" y1="160" x2="655" y2="230" stroke="#666" stroke-width="1.8" marker-end="url(#a)"/>
  <line x1="545" y1="280" x2="655" y2="280" stroke="#666" stroke-width="1.8" marker-end="url(#a)"/>
  <line x1="545" y1="400" x2="655" y2="330" stroke="#666" stroke-width="1.8" marker-end="url(#a)"/>

  <!-- Result panel -->
  <g>
    <rect x="660" y="170" width="215" height="220" rx="12" fill="#0f172a"/>
    <text x="767" y="200" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">效果 (Gemini 3 Flash)</text>

    <text x="675" y="240" font-size="12" fill="#94a3b8">循环率</text>
    <text x="860" y="240" text-anchor="end" font-size="16" font-weight="700" fill="#fca5a5">10.6% → 7.2%</text>

    <text x="675" y="280" font-size="12" fill="#94a3b8">浪费步数</text>
    <text x="860" y="280" text-anchor="end" font-size="16" font-weight="700" fill="#86efac">4.9% → 2.8%</text>

    <line x1="675" y1="305" x2="860" y2="305" stroke="#334155"/>
    <text x="767" y="335" text-anchor="middle" font-size="12" fill="#e2e8f0">浪费预算几乎砍半</text>
    <text x="767" y="360" text-anchor="middle" font-size="12" fill="#e2e8f0">挤给真正的探索</text>
  </g>

  <text x="450" y="500" text-anchor="middle" font-size="13" fill="#555">分级熔断：小调 → 换路 → 旁观者拍板禁用</text>
</svg>