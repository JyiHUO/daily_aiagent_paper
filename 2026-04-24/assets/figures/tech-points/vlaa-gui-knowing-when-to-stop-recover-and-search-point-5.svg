<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" font-family="Helvetica, Arial, sans-serif">
  <!-- Title -->
  <text x="450" y="38" text-anchor="middle" font-size="23" font-weight="700" fill="#1a1a2e">工具不是免费午餐：每次调用都在“花步数”</text>
  <text x="450" y="62" text-anchor="middle" font-size="14" fill="#666">同一个 Verifier，在强模型身上是助推器，在弱模型身上是负担</text>

  <!-- Left: Strong model -->
  <g>
    <rect x="60" y="100" width="350" height="210" rx="12" fill="#e8f5ee" stroke="#2e8b57" stroke-width="2"/>
    <text x="235" y="132" text-anchor="middle" font-size="17" font-weight="700" fill="#1b5e3f">🚀 强模型 · Sonnet 4.6</text>
    <text x="235" y="156" text-anchor="middle" font-size="12" fill="#2e8b57">每步效率高，调工具的成本 &lt; 省下的弯路</text>

    <rect x="90" y="180" width="90" height="56" rx="6" fill="#fff" stroke="#2e8b57"/>
    <text x="135" y="202" text-anchor="middle" font-size="12" fill="#1b5e3f">15 步</text>
    <text x="135" y="224" text-anchor="middle" font-size="15" font-weight="700" fill="#2e8b57">+2.5%</text>

    <rect x="190" y="180" width="90" height="56" rx="6" fill="#fff" stroke="#2e8b57"/>
    <text x="235" y="202" text-anchor="middle" font-size="12" fill="#1b5e3f">50 步</text>
    <text x="235" y="224" text-anchor="middle" font-size="15" font-weight="700" fill="#2e8b57">+3.1%</text>

    <rect x="290" y="180" width="90" height="56" rx="6" fill="#fff" stroke="#2e8b57"/>
    <text x="335" y="202" text-anchor="middle" font-size="12" fill="#1b5e3f">100 步</text>
    <text x="335" y="224" text-anchor="middle" font-size="15" font-weight="700" fill="#2e8b57">+2.8%</text>

    <text x="235" y="285" text-anchor="middle" font-size="13" fill="#1b5e3f" font-weight="600">任何预算都吃红利 ✓</text>
  </g>

  <!-- Right: Weak model -->
  <g>
    <rect x="490" y="100" width="350" height="210" rx="12" fill="#fdecea" stroke="#c0392b" stroke-width="2"/>
    <text x="665" y="132" text-anchor="middle" font-size="17" font-weight="700" fill="#8b1e1e">🐢 弱模型 · Gemini 3 Flash</text>
    <text x="665" y="156" text-anchor="middle" font-size="12" fill="#c0392b">每步效率低，工具调用把动作预算吃光</text>

    <rect x="520" y="180" width="90" height="56" rx="6" fill="#fff" stroke="#c0392b"/>
    <text x="565" y="202" text-anchor="middle" font-size="12" fill="#8b1e1e">15 步</text>
    <text x="565" y="224" text-anchor="middle" font-size="15" font-weight="700" fill="#c0392b">−11.3%</text>

    <rect x="620" y="180" width="90" height="56" rx="6" fill="#fff" stroke="#c0392b"/>
    <text x="665" y="202" text-anchor="middle" font-size="12" fill="#8b1e1e">50 步</text>
    <text x="665" y="224" text-anchor="middle" font-size="15" font-weight="700" fill="#999">≈ 0</text>

    <rect x="720" y="180" width="90" height="56" rx="6" fill="#fff" stroke="#2e8b57"/>
    <text x="765" y="202" text-anchor="middle" font-size="12" fill="#1b5e3f">100 步</text>
    <text x="765" y="224" text-anchor="middle" font-size="15" font-weight="700" fill="#2e8b57">+3.0%</text>

    <text x="665" y="285" text-anchor="middle" font-size="13" fill="#8b1e1e" font-weight="600">预算紧 → 反被工具拖垮 ✗</text>
  </g>

  <!-- Bottom insight -->
  <g>
    <rect x="120" y="355" width="660" height="200" rx="14" fill="#fffbe6" stroke="#b8860b" stroke-width="2"/>
    <text x="450" y="388" text-anchor="middle" font-size="17" font-weight="700" fill="#5c4a00">💡 核心洞察</text>

    <text x="450" y="416" text-anchor="middle" font-size="14" fill="#333">工具调用的“步数开销”是固定的，红利却取决于模型的单步价值</text>

    <g transform="translate(150, 440)">
      <rect width="260" height="64" rx="8" fill="#fff" stroke="#b8860b"/>
      <text x="130" y="28" text-anchor="middle" font-size="13" font-weight="700" fill="#5c4a00">强模型</text>
      <text x="130" y="50" text-anchor="middle" font-size="12" fill="#444">省下的弯路 &gt; 调用成本</text>
    </g>

    <g transform="translate(490, 440)">
      <rect width="260" height="64" rx="8" fill="#fff" stroke="#b8860b"/>
      <text x="130" y="28" text-anchor="middle" font-size="13" font-weight="700" fill="#5c4a00">弱模型</text>
      <text x="130" y="50" text-anchor="middle" font-size="12" fill="#444">要么加预算，要么别开工具</text>
    </g>

    <text x="450" y="538" text-anchor="middle" font-size="12" fill="#8a6d00" font-style="italic">工具设计要与模型能力 × step budget 一起调，而非默认全开</text>
  </g>
</svg>