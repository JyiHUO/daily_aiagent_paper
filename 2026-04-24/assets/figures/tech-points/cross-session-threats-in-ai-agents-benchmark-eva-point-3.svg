<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 620" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#333"/>
    </marker>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#c0392b"/>
    </marker>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1e8449"/>
    </marker>
  </defs>

  <text x="480" y="34" text-anchor="middle" font-size="21" font-weight="bold" fill="#222">Coreset Memory Reader: 只留 50 条最高信号片段</text>
  <text x="480" y="58" text-anchor="middle" font-size="13" fill="#666">固定前缀布局 → KV-cache 命中率 = CSR-prefix</text>

  <!-- Left: incoming messages -->
  <g>
    <rect x="30" y="110" width="190" height="260" rx="10" fill="#ecf3fb" stroke="#5b8def" stroke-width="2"/>
    <text x="125" y="134" text-anchor="middle" font-size="14" font-weight="bold" fill="#2c3e7a">跨会话消息流</text>
    <text x="125" y="152" text-anchor="middle" font-size="11" fill="#666">上百会话 · 慢渗透</text>
    <g font-size="11" fill="#333">
      <rect x="45" y="170" width="160" height="22" fill="#fff" stroke="#bbb"/><text x="52" y="185">session#7: 查公钥</text>
      <rect x="45" y="197" width="160" height="22" fill="#fff" stroke="#bbb"/><text x="52" y="212">session#12: 闲聊</text>
      <rect x="45" y="224" width="160" height="22" fill="#ffe9e4" stroke="#e06b52"/><text x="52" y="239" fill="#a8361e">session#23: 洗白指令</text>
      <rect x="45" y="251" width="160" height="22" fill="#fff" stroke="#bbb"/><text x="52" y="266">session#31: 问天气</text>
      <rect x="45" y="278" width="160" height="22" fill="#ffe9e4" stroke="#e06b52"/><text x="52" y="293" fill="#a8361e">session#44: 拼片段</text>
      <rect x="45" y="305" width="160" height="22" fill="#fff" stroke="#bbb"/><text x="52" y="320">session#57: 新消息</text>
      <text x="125" y="352" text-anchor="middle" fill="#888">...</text>
    </g>
  </g>

  <!-- Ranker -->
  <g>
    <rect x="260" y="200" width="140" height="80" rx="10" fill="#fff4d6" stroke="#d4a017" stroke-width="2"/>
    <text x="330" y="228" text-anchor="middle" font-size="14" font-weight="bold" fill="#6b4e00">Ranker</text>
    <text x="330" y="248" text-anchor="middle" font-size="11" fill="#6b4e00">打分 · 入/出</text>
    <text x="330" y="264" text-anchor="middle" font-size="11" fill="#6b4e00">容量 K=50</text>
  </g>

  <line x1="220" y1="240" x2="258" y2="240" stroke="#333" stroke-width="2" marker-end="url(#a)"/>

  <!-- Coreset buffer -->
  <g>
    <rect x="440" y="120" width="260" height="320" rx="10" fill="#e8f7ec" stroke="#1e8449" stroke-width="2"/>
    <text x="570" y="144" text-anchor="middle" font-size="14" font-weight="bold" fill="#145a32">Coreset 缓冲区 (Top-50)</text>
    <text x="570" y="162" text-anchor="middle" font-size="11" fill="#145a32">有序前缀固定 · 放 prompt 末尾</text>

    <g font-size="11">
      <rect x="455" y="175" width="230" height="22" fill="#c8e6c9" stroke="#1e8449"/><text x="462" y="190" fill="#145a32">#1  系统prompt / 锚点</text>
      <rect x="455" y="200" width="230" height="22" fill="#c8e6c9" stroke="#1e8449"/><text x="462" y="215" fill="#145a32">#2  旧 Top 片段 A</text>
      <rect x="455" y="225" width="230" height="22" fill="#c8e6c9" stroke="#1e8449"/><text x="462" y="240" fill="#145a32">#3  旧 Top 片段 B</text>
      <rect x="455" y="250" width="230" height="22" fill="#c8e6c9" stroke="#1e8449"/><text x="462" y="265" fill="#145a32">... 前缀命中 KV-cache</text>
      <rect x="455" y="275" width="230" height="22" fill="#c8e6c9" stroke="#1e8449"/><text x="462" y="290" fill="#145a32">#20 旧 Top 片段 T</text>

      <rect x="455" y="305" width="230" height="22" fill="#fff2b3" stroke="#d4a017"/><text x="462" y="320" fill="#6b4e00">#21 新入片段 (需重算)</text>
      <rect x="455" y="330" width="230" height="22" fill="#fff2b3" stroke="#d4a017"/><text x="462" y="345" fill="#6b4e00">...</text>
      <rect x="455" y="355" width="230" height="22" fill="#fff2b3" stroke="#d4a017"/><text x="462" y="370" fill="#6b4e00">#50 最末位 (新消息)</text>
    </g>

    <text x="570" y="400" text-anchor="middle" font-size="12" fill="#145a32">绿色 = KV 可复用前缀</text>
    <text x="570" y="420" text-anchor="middle" font-size="12" fill="#6b4e00">黄色 = 仅此段需重算</text>
  </g>

  <line x1="400" y1="240" x2="438" y2="240" stroke="#333" stroke-width="2" marker-end="url(#a)"/>

  <!-- Correlator / LLM -->
  <g>
    <rect x="730" y="200" width="200" height="100" rx="10" fill="#fdecea" stroke="#c0392b" stroke-width="2"/>
    <text x="830" y="228" text-anchor="middle" font-size="14" font-weight="bold" fill="#7b1e10">Correlator (LLM)</text>
    <text x="830" y="250" text-anchor="middle" font-size="11" fill="#7b1e10">action-on-objective 前报警</text>
    <text x="830" y="270" text-anchor="middle" font-size="11" fill="#7b1e10">跨会话召回保持 ✓</text>
  </g>

  <line x1="700" y1="250" x2="728" y2="250" stroke="#c0392b" stroke-width="2" marker-end="url(#ar)"/>

  <!-- Bottom metric -->
  <g>
    <rect x="180" y="485" width="600" height="95" rx="10" fill="#f4f4f4" stroke="#555" stroke-width="1.5"/>
    <text x="480" y="512" text-anchor="middle" font-size="14" font-weight="bold" fill="#222">CSR-prefix: 缓冲区稳定前缀比例</text>
    <text x="480" y="535" text-anchor="middle" font-size="12" fill="#444">无需 LLM、无需标签 → 生产环境持续监控可缓存度</text>
    <text x="480" y="560" text-anchor="middle" font-size="13" fill="#1e8449" font-weight="bold">CSTM = 0.7 · F1(CSDA@action) + 0.3 · CSR-prefix</text>
  </g>

  <line x1="570" y1="440" x2="480" y2="483" stroke="#1e8449" stroke-width="2" stroke-dasharray="5,4" marker-end="url(#ag)"/>
</svg>