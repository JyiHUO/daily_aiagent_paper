<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" font-family="system-ui, -apple-system, sans-serif">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#333"/>
    </marker>
    <marker id="arRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#c0392b"/>
    </marker>
    <marker id="arGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#2a8a3e"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="450" y="34" text-anchor="middle" font-size="22" font-weight="700" fill="#1a1a1a">长上下文 ≠ 跨会话检测</text>
  <text x="450" y="58" text-anchor="middle" font-size="14" fill="#666">把所有会话塞进 1M token 窗口，并不能抓到稀释攻击</text>

  <!-- Input stream -->
  <g>
    <rect x="40" y="110" width="170" height="330" rx="10" fill="#f4f6fa" stroke="#8aa0c0" stroke-width="1.5"/>
    <text x="125" y="135" text-anchor="middle" font-size="14" font-weight="600" fill="#334">多会话日志流</text>

    <rect x="58" y="150" width="134" height="30" rx="4" fill="#e6eef7" stroke="#9ab"/>
    <text x="125" y="170" text-anchor="middle" font-size="12" fill="#345">session #1 良性</text>

    <rect x="58" y="188" width="134" height="30" rx="4" fill="#e6eef7" stroke="#9ab"/>
    <text x="125" y="208" text-anchor="middle" font-size="12" fill="#345">session #2 良性</text>

    <rect x="58" y="226" width="134" height="30" rx="4" fill="#fde2e2" stroke="#c0392b"/>
    <text x="125" y="246" text-anchor="middle" font-size="12" fill="#8a1f1f">#3 藏 URL 碎片</text>

    <rect x="58" y="264" width="134" height="30" rx="4" fill="#e6eef7" stroke="#9ab"/>
    <text x="125" y="284" text-anchor="middle" font-size="12" fill="#345">session #4 良性</text>

    <rect x="58" y="302" width="134" height="30" rx="4" fill="#fde2e2" stroke="#c0392b"/>
    <text x="125" y="322" text-anchor="middle" font-size="12" fill="#8a1f1f">#5 藏文件路径</text>

    <rect x="58" y="340" width="134" height="30" rx="4" fill="#e6eef7" stroke="#9ab"/>
    <text x="125" y="360" text-anchor="middle" font-size="12" fill="#345">session #6 良性</text>

    <text x="125" y="392" text-anchor="middle" font-size="12" fill="#667">... 共 ~97K token</text>
    <text x="125" y="412" text-anchor="middle" font-size="11" fill="#888">(远小于 1M 窗口)</text>
  </g>

  <!-- Arrow to correlator -->
  <line x1="215" y1="275" x2="355" y2="275" stroke="#333" stroke-width="2" marker-end="url(#ar)"/>
  <text x="285" y="265" text-anchor="middle" font-size="12" fill="#555">按时间拼接</text>

  <!-- Full-Log Correlator -->
  <rect x="360" y="180" width="270" height="190" rx="14" fill="#fff6e0" stroke="#e0a020" stroke-width="2"/>
  <text x="495" y="208" text-anchor="middle" font-size="15" font-weight="700" fill="#6b4500">Full-Log Correlator</text>
  <text x="495" y="230" text-anchor="middle" font-size="12" fill="#7a5500">(LLM 审计整段历史)</text>

  <!-- dilution illustration -->
  <g transform="translate(385,248)">
    <circle cx="20" cy="20" r="6" fill="#c0392b" opacity="0.9"/>
    <circle cx="60" cy="18" r="5" fill="#bfc9d1"/>
    <circle cx="95" cy="28" r="5" fill="#bfc9d1"/>
    <circle cx="130" cy="15" r="5" fill="#bfc9d1"/>
    <circle cx="165" cy="30" r="5" fill="#bfc9d1"/>
    <circle cx="200" cy="20" r="5" fill="#bfc9d1"/>
    <circle cx="40" cy="55" r="5" fill="#bfc9d1"/>
    <circle cx="80" cy="60" r="5" fill="#bfc9d1"/>
    <circle cx="115" cy="50" r="6" fill="#c0392b" opacity="0.9"/>
    <circle cx="155" cy="62" r="5" fill="#bfc9d1"/>
    <circle cx="195" cy="55" r="5" fill="#bfc9d1"/>
    <circle cx="30" cy="90" r="5" fill="#bfc9d1"/>
    <circle cx="70" cy="95" r="5" fill="#bfc9d1"/>
    <circle cx="110" cy="88" r="5" fill="#bfc9d1"/>
    <circle cx="150" cy="95" r="5" fill="#bfc9d1"/>
    <circle cx="190" cy="92" r="5" fill="#bfc9d1"/>
  </g>
  <text x="495" y="358" text-anchor="middle" font-size="11" fill="#8a5b00">红点=攻击碎片，被良性内容淹没</text>

  <!-- Dilution split output -->
  <line x1="630" y1="235" x2="730" y2="185" stroke="#2a8a3e" stroke-width="2" marker-end="url(#arGreen)"/>
  <rect x="735" y="150" width="140" height="75" rx="10" fill="#e6f5ea" stroke="#2a8a3e" stroke-width="2"/>
  <text x="805" y="175" text-anchor="middle" font-size="13" font-weight="700" fill="#1e6b30">dilution split</text>
  <text x="805" y="198" text-anchor="middle" font-size="12" fill="#1e6b30">召回率 高 ✓</text>

  <!-- Cross-session split output -->
  <line x1="630" y1="315" x2="730" y2="365" stroke="#c0392b" stroke-width="2" marker-end="url(#arRed)"/>
  <rect x="735" y="340" width="140" height="90" rx="10" fill="#fdecec" stroke="#c0392b" stroke-width="2"/>
  <text x="805" y="365" text-anchor="middle" font-size="13" font-weight="700" fill="#8a1f1f">cross-session split</text>
  <text x="805" y="388" text-anchor="middle" font-size="12" fill="#8a1f1f">召回率 腰斩 ✗</text>
  <text x="805" y="410" text-anchor="middle" font-size="11" fill="#a94444">非截断，是注意力稀释</text>

  <!-- Key insight bottom -->
  <rect x="60" y="475" width="780" height="60" rx="10" fill="#1f2d3d"/>
  <text x="450" y="500" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">关键发现：瓶颈不在上下文长度，而在 correlator LLM 自身</text>
  <text x="450" y="521" text-anchor="middle" font-size="12" fill="#b8c7d9">→ 需要专门的有界内存跨会话检测算法，而不是更大的窗口</text>
</svg>