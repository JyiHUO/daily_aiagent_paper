<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#c0392b"/>
    </marker>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1e8449"/>
    </marker>
  </defs>

  <text x="450" y="36" text-anchor="middle" font-size="22" font-weight="700" fill="#1a1a1a">按需文本搜索代理：一句话查文档，别自己开浏览器</text>
  <text x="450" y="60" text-anchor="middle" font-size="13" fill="#666">Search(query) 和 click / type 并列，Manager 遇到陌生工作流才调用</text>

  <!-- 左：旧做法 -->
  <g>
    <text x="210" y="100" text-anchor="middle" font-size="15" font-weight="700" fill="#c0392b">✗ 视觉浏览器搜索</text>
    <rect x="60" y="115" width="300" height="330" rx="10" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>

    <rect x="85" y="140" width="250" height="44" rx="6" fill="#fff" stroke="#c0392b"/>
    <text x="210" y="167" text-anchor="middle" font-size="13" fill="#333">打开浏览器</text>

    <rect x="85" y="198" width="250" height="44" rx="6" fill="#fff" stroke="#c0392b"/>
    <text x="210" y="225" text-anchor="middle" font-size="13" fill="#333">定位搜索框 → 输入</text>

    <rect x="85" y="256" width="250" height="44" rx="6" fill="#fff" stroke="#c0392b"/>
    <text x="210" y="283" text-anchor="middle" font-size="13" fill="#333">滚动网页 → 识别结果</text>

    <rect x="85" y="314" width="250" height="44" rx="6" fill="#fff" stroke="#c0392b"/>
    <text x="210" y="341" text-anchor="middle" font-size="13" fill="#333">点错一下 → 重来</text>

    <line x1="210" y1="184" x2="210" y2="198" stroke="#c0392b" stroke-width="2" marker-end="url(#ar)"/>
    <line x1="210" y1="242" x2="210" y2="256" stroke="#c0392b" stroke-width="2" marker-end="url(#ar)"/>
    <line x1="210" y1="300" x2="210" y2="314" stroke="#c0392b" stroke-width="2" marker-end="url(#ar)"/>

    <text x="210" y="397" text-anchor="middle" font-size="13" fill="#c0392b" font-weight="700">烧掉 10+ GUI 步数，还得靠 grounding 识图</text>
  </g>

  <!-- 右：新做法 -->
  <g>
    <text x="690" y="100" text-anchor="middle" font-size="15" font-weight="700" fill="#1e8449">✓ 文本 Search Agent</text>
    <rect x="540" y="115" width="300" height="330" rx="10" fill="#eafaf1" stroke="#1e8449" stroke-width="1.5"/>

    <rect x="565" y="145" width="250" height="60" rx="6" fill="#fff" stroke="#1e8449"/>
    <text x="690" y="170" text-anchor="middle" font-size="13" fill="#333">Manager 问一句话：</text>
    <text x="690" y="190" text-anchor="middle" font-size="12" fill="#1e8449" font-style="italic">"如何在 Impress 改页码颜色？"</text>

    <line x1="690" y1="205" x2="690" y2="240" stroke="#1e8449" stroke-width="2" marker-end="url(#ag)"/>

    <rect x="565" y="245" width="250" height="60" rx="6" fill="#fff" stroke="#1e8449"/>
    <text x="690" y="272" text-anchor="middle" font-size="13" fill="#333">带搜索的 LLM (Gemini 3 Pro)</text>
    <text x="690" y="292" text-anchor="middle" font-size="12" fill="#666">返回结构化 How-to 教程</text>

    <line x1="690" y1="305" x2="690" y2="340" stroke="#1e8449" stroke-width="2" marker-end="url(#ag)"/>

    <rect x="565" y="345" width="250" height="70" rx="6" fill="#fff" stroke="#1e8449"/>
    <text x="690" y="372" text-anchor="middle" font-size="13" fill="#333">纯文本直接注入 belief state</text>
    <text x="690" y="397" text-anchor="middle" font-size="12" fill="#1e8449">0 GUI 步数 · 0 截图识别</text>
  </g>

  <!-- 底部 takeaway -->
  <rect x="120" y="470" width="660" height="70" rx="10" fill="#fff8e1" stroke="#f39c12" stroke-width="1.5"/>
  <text x="450" y="497" text-anchor="middle" font-size="14" font-weight="700" fill="#b9770e">关键收益：截图看不到的知识，也能拿到</text>
  <text x="450" y="522" text-anchor="middle" font-size="12.5" fill="#7d6608">例：教程提示"每个母版都要改一遍" → agent 才发现漏掉的第二个 OBJECT 母版</text>
</svg>