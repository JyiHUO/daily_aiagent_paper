<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#334"/>
    </marker>
    <marker id="arGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1e8449"/>
    </marker>
  </defs>

  <text x="450" y="34" text-anchor="middle" font-size="22" font-weight="bold" fill="#1a2540">HARBOR：把 harness 调参变成带安全门的贝叶斯优化</text>
  <text x="450" y="56" text-anchor="middle" font-size="13" fill="#667">几十个 flag → 分块 GP 代理 → 多目标采集 → 安全约束过滤</text>

  <!-- Block 1: flags grouped -->
  <g>
    <rect x="40" y="90" width="230" height="420" rx="12" fill="#eef3fb" stroke="#4a6fa5" stroke-width="1.5"/>
    <text x="155" y="115" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a2540">① 分块 flag 空间</text>
    <text x="155" y="134" text-anchor="middle" font-size="11" fill="#667">块加性 SAAS-GP 代理</text>

    <g font-size="12" fill="#1a2540">
      <rect x="60" y="150" width="190" height="46" rx="6" fill="#fff" stroke="#4a6fa5"/>
      <text x="155" y="170" text-anchor="middle" font-weight="bold">Cache</text>
      <text x="155" y="186" text-anchor="middle" font-size="10" fill="#667">工具缓存旋钮</text>

      <rect x="60" y="204" width="190" height="46" rx="6" fill="#fff" stroke="#4a6fa5"/>
      <text x="155" y="224" text-anchor="middle" font-weight="bold">Memory</text>
      <text x="155" y="240" text-anchor="middle" font-size="10" fill="#667">语义记忆</text>

      <rect x="60" y="258" width="190" height="46" rx="6" fill="#fff" stroke="#4a6fa5"/>
      <text x="155" y="278" text-anchor="middle" font-weight="bold">Compression</text>
      <text x="155" y="294" text-anchor="middle" font-size="10" fill="#667">上下文压缩</text>

      <rect x="60" y="312" width="190" height="46" rx="6" fill="#fff" stroke="#4a6fa5"/>
      <text x="155" y="332" text-anchor="middle" font-weight="bold">Prediction</text>
      <text x="155" y="348" text-anchor="middle" font-size="10" fill="#667">推测性工具调用</text>

      <rect x="60" y="366" width="190" height="46" rx="6" fill="#fff" stroke="#4a6fa5"/>
      <text x="155" y="386" text-anchor="middle" font-weight="bold">Eval</text>
      <text x="155" y="402" text-anchor="middle" font-size="10" fill="#667">评估相关</text>
    </g>
    <text x="155" y="445" text-anchor="middle" font-size="11" fill="#c0392b">SAAS 先验：多数旋钮自动归零</text>
    <text x="155" y="475" text-anchor="middle" font-size="11" fill="#1e8449">+ 跨块乘积项：捕获交互</text>
  </g>

  <!-- arrow to acquisition -->
  <line x1="270" y1="300" x2="343" y2="300" stroke="#334" stroke-width="2" marker-end="url(#ar)"/>

  <!-- Block 2: Acquisition -->
  <g>
    <rect x="345" y="150" width="230" height="300" rx="12" fill="#fef6e4" stroke="#d4a017" stroke-width="1.5"/>
    <text x="460" y="175" text-anchor="middle" font-size="15" font-weight="bold" fill="#5a3e00">② 多目标采集</text>

    <rect x="365" y="195" width="190" height="60" rx="6" fill="#fff" stroke="#d4a017"/>
    <text x="460" y="217" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a2540">qNEHVI / cost</text>
    <text x="460" y="236" text-anchor="middle" font-size="11" fill="#667">每美元信息增益</text>

    <rect x="365" y="270" width="190" height="60" rx="6" fill="#fff" stroke="#d4a017"/>
    <text x="460" y="292" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a2540">TuRBO 信赖域</text>
    <text x="460" y="311" text-anchor="middle" font-size="11" fill="#667">高维局部搜索</text>

    <text x="460" y="360" text-anchor="middle" font-size="12" fill="#5a3e00">目标：pass率 ↑ &amp; 成本 ↓</text>

    <g>
      <circle cx="395" cy="400" r="5" fill="#1e8449"/>
      <circle cx="420" cy="390" r="5" fill="#1e8449"/>
      <circle cx="450" cy="410" r="5" fill="#1e8449"/>
      <circle cx="480" cy="395" r="5" fill="#1e8449"/>
      <circle cx="515" cy="405" r="5" fill="#1e8449"/>
      <text x="460" y="432" text-anchor="middle" font-size="11" fill="#667">批量候选配置</text>
    </g>
  </g>

  <!-- arrow to safety gate -->
  <line x1="575" y1="300" x2="638" y2="300" stroke="#334" stroke-width="2" marker-end="url(#ar)"/>

  <!-- Block 3: Safety gate -->
  <g>
    <rect x="640" y="150" width="230" height="300" rx="12" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
    <text x="755" y="175" text-anchor="middle" font-size="15" font-weight="bold" fill="#6e1b11">③ 安全约束门</text>
    <text x="755" y="195" text-anchor="middle" font-size="11" fill="#667">Pr(µ ≥ R₀−δ) ≥ 1−η</text>

    <rect x="660" y="210" width="190" height="80" rx="8" fill="#fff" stroke="#c0392b"/>
    <text x="755" y="233" text-anchor="middle" font-size="12" fill="#1a2540">候选后验下界</text>
    <text x="755" y="255" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a2540">µ − Φ⁻¹(1−η)·σ</text>
    <text x="755" y="277" text-anchor="middle" font-size="11" fill="#667">低于 baseline 即淘汰</text>

    <rect x="660" y="305" width="85" height="50" rx="6" fill="#d4edda" stroke="#1e8449"/>
    <text x="702" y="327" text-anchor="middle" font-size="12" font-weight="bold" fill="#1e8449">通过 ✓</text>
    <text x="702" y="345" text-anchor="middle" font-size="10" fill="#1e8449">小集实跑</text>

    <rect x="765" y="305" width="85" height="50" rx="6" fill="#f8d7da" stroke="#c0392b"/>
    <text x="807" y="327" text-anchor="middle" font-size="12" font-weight="bold" fill="#c0392b">否决 ✗</text>
    <text x="807" y="345" text-anchor="middle" font-size="10" fill="#c0392b">防止回退</text>

    <text x="755" y="395" text-anchor="middle" font-size="11" fill="#6e1b11">多保真：8 → 22 → 44 → 89</text>
    <text x="755" y="420" text-anchor="middle" font-size="11" fill="#6e1b11">任务子集逐级升级</text>
  </g>

  <!-- feedback loop -->
  <path d="M 755 450 Q 755 545 450 545 Q 155 545 155 512" fill="none" stroke="#1e8449" stroke-width="2" stroke-dasharray="6,4" marker-end="url(#arGreen)"/>
  <text x="450" y="580" text-anchor="middle" font-size="12" fill="#1e8449">回填结果 → refit GP，直到周预算耗尽</text>
</svg>