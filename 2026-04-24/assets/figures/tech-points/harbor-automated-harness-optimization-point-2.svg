<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" font-family="Helvetica, Arial, sans-serif">
  <rect width="960" height="600" fill="#f7f8fb"/>
  
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#888"/>
    </marker>
    <marker id="arRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#c0392b"/>
    </marker>
  </defs>

  <text x="480" y="38" text-anchor="middle" font-size="22" font-weight="bold" fill="#1a1a2e">手工调 harness：越调越糟的四轮</text>
  <text x="480" y="62" text-anchor="middle" font-size="13" fill="#555">每轮加 2–4 个论文里 work 的 feature，pass 率却一路下滑</text>

  <!-- Baseline -->
  <g>
    <rect x="40" y="110" width="160" height="150" rx="10" fill="#e8eef7" stroke="#6b7a99" stroke-width="1.5"/>
    <text x="120" y="138" text-anchor="middle" font-size="15" font-weight="bold" fill="#2c3e50">Baseline</text>
    <text x="120" y="200" text-anchor="middle" font-size="32" font-weight="bold" fill="#2c3e50">15</text>
    <text x="120" y="222" text-anchor="middle" font-size="12" fill="#555">/ 89</text>
    <text x="120" y="250" text-anchor="middle" font-size="11" fill="#777">裸 agent</text>
  </g>

  <!-- B -->
  <g>
    <rect x="220" y="110" width="160" height="150" rx="10" fill="#d8f0dc" stroke="#2e8b57" stroke-width="2"/>
    <text x="300" y="138" text-anchor="middle" font-size="15" font-weight="bold" fill="#1e5631">B  ✓ 净胜</text>
    <text x="300" y="200" text-anchor="middle" font-size="32" font-weight="bold" fill="#1e5631">17</text>
    <text x="300" y="222" text-anchor="middle" font-size="12" fill="#1e5631">/ 89</text>
    <text x="300" y="250" text-anchor="middle" font-size="11" fill="#2e8b57">唯一真正赢的一轮</text>
  </g>

  <!-- C -->
  <g>
    <rect x="400" y="110" width="160" height="150" rx="10" fill="#fde8d4" stroke="#d97706" stroke-width="2"/>
    <text x="480" y="138" text-anchor="middle" font-size="15" font-weight="bold" fill="#8a4b00">C  ↓</text>
    <text x="480" y="200" text-anchor="middle" font-size="32" font-weight="bold" fill="#8a4b00">13</text>
    <text x="480" y="222" text-anchor="middle" font-size="12" fill="#8a4b00">/ 89</text>
    <text x="480" y="250" text-anchor="middle" font-size="11" fill="#a15c00">自评 gate 把对的改错</text>
  </g>

  <!-- D -->
  <g>
    <rect x="580" y="110" width="160" height="150" rx="10" fill="#fcdcdc" stroke="#c0392b" stroke-width="2"/>
    <text x="660" y="138" text-anchor="middle" font-size="15" font-weight="bold" fill="#7a1d13">D  ↓↓</text>
    <text x="660" y="200" text-anchor="middle" font-size="32" font-weight="bold" fill="#7a1d13">12</text>
    <text x="660" y="222" text-anchor="middle" font-size="12" fill="#7a1d13">/ 89</text>
    <text x="660" y="250" text-anchor="middle" font-size="11" fill="#a0291b">特性互相腐蚀 + 静默 bug</text>
  </g>

  <!-- Arrows between rounds -->
  <g fill="none" stroke="#888" stroke-width="2">
    <path d="M200 185 L216 185" marker-end="url(#ar)"/>
    <path d="M380 185 L396 185" marker-end="url(#ar)"/>
    <path d="M560 185 L576 185" marker-end="url(#ar)"/>
  </g>

  <!-- Bottom: what's hidden inside D -->
  <rect x="40" y="290" width="880" height="260" rx="12" fill="#fff" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="5,4"/>
  <text x="60" y="316" font-size="15" font-weight="bold" fill="#7a1d13">D 轮内部：手工看 pass 率根本看不见的三个坑</text>

  <!-- Bug 1: compression into cache -->
  <g>
    <rect x="60" y="332" width="270" height="200" rx="8" fill="#fdf2f2" stroke="#c0392b"/>
    <text x="195" y="356" text-anchor="middle" font-size="13" font-weight="bold" fill="#7a1d13">① 压缩被接到缓存上游</text>
    <rect x="75" y="378" width="70" height="36" rx="4" fill="#fff" stroke="#888"/>
    <text x="110" y="401" text-anchor="middle" font-size="10" fill="#333">原始输出</text>
    <rect x="160" y="378" width="55" height="36" rx="4" fill="#ffd9a8" stroke="#d97706"/>
    <text x="187" y="401" text-anchor="middle" font-size="11" fill="#6e3d00">压缩</text>
    <rect x="230" y="378" width="85" height="36" rx="4" fill="#ffd0d0" stroke="#c0392b"/>
    <text x="272" y="401" text-anchor="middle" font-size="11" fill="#7a1d13">缓存(摘要)</text>
    <line x1="145" y1="396" x2="158" y2="396" stroke="#555" stroke-width="1.5" marker-end="url(#ar)"/>
    <line x1="215" y1="396" x2="228" y2="396" stroke="#555" stroke-width="1.5" marker-end="url(#ar)"/>
    <text x="195" y="450" text-anchor="middle" font-size="11" fill="#555">省 501KB / 触发 171 次</text>
    <text x="195" y="484" text-anchor="middle" font-size="11" fill="#7a1d13">grep 读到摘要，丢了行号</text>
    <text x="195" y="502" text-anchor="middle" font-size="11" fill="#7a1d13">→ 任务失败</text>
  </g>

  <!-- Bug 2: Reflexion counter 0 -->
  <g>
    <rect x="345" y="332" width="270" height="200" rx="8" fill="#fdf2f2" stroke="#c0392b"/>
    <text x="480" y="356" text-anchor="middle" font-size="13" font-weight="bold" fill="#7a1d13">② Reflexion 记忆跨容器没传</text>
    <rect x="370" y="388" width="100" height="40" rx="4" fill="#fff" stroke="#888"/>
    <text x="420" y="412" text-anchor="middle" font-size="11" fill="#333">容器 A</text>
    <rect x="490" y="388" width="100" height="40" rx="4" fill="#fff" stroke="#888"/>
    <text x="540" y="412" text-anchor="middle" font-size="11" fill="#333">容器 B</text>
    <line x1="470" y1="408" x2="490" y2="408" stroke="#c0392b" stroke-width="2" stroke-dasharray="4,3"/>
    <text x="480" y="402" text-anchor="middle" font-size="16" fill="#c0392b" font-weight="bold">✕</text>
    <text x="480" y="470" text-anchor="middle" font-size="12" fill="#7a1d13" font-weight="bold">retrieval counter = 0</text>
    <text x="480" y="498" text-anchor="middle" font-size="11" fill="#555">特性开着，其实一次都没跑</text>
  </g>

  <!-- Bug 3: PASTE never called -->
  <g>
    <rect x="630" y="332" width="270" height="200" rx="8" fill="#fdf2f2" stroke="#c0392b"/>
    <text x="765" y="356" text-anchor="middle" font-size="13" font-weight="bold" fill="#7a1d13">③ PASTE 预测器没接进 runner</text>
    <rect x="655" y="388" width="100" height="40" rx="4" fill="#fff" stroke="#888"/>
    <text x="705" y="412" text-anchor="middle" font-size="11" fill="#333">Runner 主路径</text>
    <rect x="775" y="388" width="100" height="40" rx="4" fill="#f0f0f0" stroke="#aaa" stroke-dasharray="3,3"/>
    <text x="825" y="406" text-anchor="middle" font-size="11" fill="#777">PASTE 预测</text>
    <text x="825" y="422" text-anchor="middle" font-size="10" fill="#c0392b">(未调用)</text>
    <line x1="755" y1="408" x2="773" y2="408" stroke="#c0392b" stroke-width="2" stroke-dasharray="4,3"/>
    <text x="765" y="470" text-anchor="middle" font-size="12" fill="#7a1d13" font-weight="bold">prediction counter = 0</text>
    <text x="765" y="498" text-anchor="middle" font-size="11" fill="#555">pass 率表里看不出死代码</text>
  </g>

  <text x="480" y="580" text-anchor="middle" font-size="13" fill="#333" font-style="italic">结论：harness 调优不是加 feature，而是带约束的搜索 → 该交给机器做</text>
</svg>