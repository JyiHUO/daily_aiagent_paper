<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 820" font-family="'PingFang SC','Microsoft YaHei',sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0f1629"/>
      <stop offset="1" stop-color="#1a2340"/>
    </linearGradient>
    <linearGradient id="audit" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5b8def"/>
      <stop offset="1" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="artifact" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a3555"/>
      <stop offset="1" stop-color="#1e2742"/>
    </linearGradient>
    <radialGradient id="core" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#6d28d9"/>
    </radialGradient>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#9ca8d4"/>
    </marker>
    <marker id="arW" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#fbbf24"/>
    </marker>
    <marker id="arR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#f87171"/>
    </marker>
  </defs>

  <rect width="1280" height="820" fill="url(#bg)"/>

  <!-- Title -->
  <text x="640" y="54" text-anchor="middle" fill="#ffffff" font-size="28" font-weight="700">BenchGuard：谁来审计 Agent 基准？</text>
  <text x="640" y="82" text-anchor="middle" fill="#9ca8d4" font-size="15">把 Benchmark 当软件来审，让前沿 LLM 从"被评测者"变成"评测基础设施的审计员"</text>

  <!-- Left: The 4 coupled artifacts -->
  <g>
    <text x="210" y="128" text-anchor="middle" fill="#e5e7eb" font-size="15" font-weight="600">执行式基准 = 四件套耦合</text>
    <text x="210" y="148" text-anchor="middle" fill="#9ca8d4" font-size="11">任何两两错位，都可能是 bug</text>

    <g>
      <rect x="130" y="180" width="160" height="56" rx="10" fill="url(#artifact)" stroke="#5b8def" stroke-width="1.3"/>
      <text x="210" y="205" text-anchor="middle" fill="#cbd5ff" font-size="13" font-weight="600">Instruction</text>
      <text x="210" y="224" text-anchor="middle" fill="#9ca8d4" font-size="11">任务指令</text>
    </g>
    <g>
      <rect x="40" y="290" width="160" height="56" rx="10" fill="url(#artifact)" stroke="#5b8def" stroke-width="1.3"/>
      <text x="120" y="315" text-anchor="middle" fill="#cbd5ff" font-size="13" font-weight="600">Gold Program</text>
      <text x="120" y="334" text-anchor="middle" fill="#9ca8d4" font-size="11">参考程序</text>
    </g>
    <g>
      <rect x="220" y="290" width="160" height="56" rx="10" fill="url(#artifact)" stroke="#5b8def" stroke-width="1.3"/>
      <text x="300" y="315" text-anchor="middle" fill="#cbd5ff" font-size="13" font-weight="600">Eval Script</text>
      <text x="300" y="334" text-anchor="middle" fill="#9ca8d4" font-size="11">评测脚本</text>
    </g>
    <g>
      <rect x="130" y="400" width="160" height="56" rx="10" fill="url(#artifact)" stroke="#5b8def" stroke-width="1.3"/>
      <text x="210" y="425" text-anchor="middle" fill="#cbd5ff" font-size="13" font-weight="600">Environment</text>
      <text x="210" y="444" text-anchor="middle" fill="#9ca8d4" font-size="11">数据与环境</text>
    </g>

    <!-- cross-inconsistency lines -->
    <g stroke="#f87171" stroke-width="1" stroke-dasharray="3,3" opacity="0.55">
      <line x1="160" y1="236" x2="130" y2="290"/>
      <line x1="260" y1="236" x2="290" y2="290"/>
      <line x1="180" y1="346" x2="180" y2="400"/>
      <line x1="240" y1="346" x2="240" y2="400"/>
      <line x1="200" y1="236" x2="200" y2="400"/>
      <line x1="200" y1="346" x2="280" y2="346"/>
    </g>
    <text x="210" y="488" text-anchor="middle" fill="#f87171" font-size="11" font-style="italic">指令说 A · gold 做 B · 脚本查 C</text>
  </g>

  <!-- Center: BenchGuard auditor -->
  <g>
    <circle cx="640" cy="340" r="150" fill="url(#core)" opacity="0.18"/>
    <circle cx="640" cy="340" r="110" fill="url(#audit)" opacity="0.92"/>
    <text x="640" y="318" text-anchor="middle" fill="#ffffff" font-size="20" font-weight="700">BenchGuard</text>
    <text x="640" y="342" text-anchor="middle" fill="#e0e7ff" font-size="12">六阶段结构化审计</text>
    <text x="640" y="364" text-anchor="middle" fill="#ffffff" font-size="10.5">① 任务 ② gold ③ 评测</text>
    <text x="640" y="380" text-anchor="middle" fill="#ffffff" font-size="10.5">④ 指令 ⑤ 环境 ⑥ 去重</text>

    <!-- 5 model ensemble badges -->
    <g font-size="10" fill="#0f1629" font-weight="600">
      <g><circle cx="530" cy="250" r="22" fill="#fbbf24"/><text x="530" y="254" text-anchor="middle">Gemini</text></g>
      <g><circle cx="640" cy="210" r="22" fill="#fbbf24"/><text x="640" y="214" text-anchor="middle">GPT-5</text></g>
      <g><circle cx="750" cy="250" r="22" fill="#fbbf24"/><text x="750" y="254" text-anchor="middle">Claude</text></g>
      <g><circle cx="560" cy="440" r="20" fill="#fbbf24" opacity="0.85"/><text x="560" y="444" text-anchor="middle">Opus</text></g>
      <g><circle cx="720" cy="440" r="20" fill="#fbbf24" opacity="0.85"/><text x="720" y="444" text-anchor="middle">Sonnet</text></g>
    </g>
    <text x="640" y="510" text-anchor="middle" fill="#fde68a" font-size="11.5">五模型并行审计 · 结果取并集</text>
  </g>

  <!-- Arrow: artifacts -> auditor -->
  <path d="M 395 340 Q 460 340 525 340" stroke="#9ca8d4" stroke-width="2" fill="none" marker-end="url(#ar)"/>
  <text x="460" y="332" text-anchor="middle" fill="#cbd5ff" font-size="11">四产物对照</text>

  <!-- Optional execution evidence from bottom -->
  <path d="M 640 620 L 640 495" stroke="#fbbf24" stroke-width="2" fill="none" marker-end="url(#arW)" stroke-dasharray="5,4"/>
  <g>
    <rect x="500" y="620" width="280" height="60" rx="10" fill="#1e2742" stroke="#fbbf24" stroke-width="1.3"/>
    <text x="640" y="644" text-anchor="middle" fill="#fde68a" font-size="13" font-weight="600">可选：Agent 执行证据</text>
    <text x="640" y="664" text-anchor="middle" fill="#9ca8d4" font-size="11">程序 + 评测日志 → 暴露容差 / 等价解问题</text>
  </g>

  <!-- Right: Findings and results -->
  <g>
    <text x="1070" y="128" text-anchor="middle" fill="#e5e7eb" font-size="15" font-weight="600">结构化缺陷报告</text>
    <text x="1070" y="148" text-anchor="middle" fill="#9ca8d4" font-size="11">4 大类 / 14 子类 · 含证据与置信度</text>

    <g font-size="11.5" font-weight="600">
      <rect x="915" y="175" width="95" height="32" rx="16" fill="#1e2742" stroke="#f87171"/>
      <text x="962" y="196" text-anchor="middle" fill="#fca5a5">GT 错误</text>
      <rect x="1020" y="175" width="105" height="32" rx="16" fill="#1e2742" stroke="#fbbf24"/>
      <text x="1072" y="196" text-anchor="middle" fill="#fde68a">EVAL 偏差</text>
      <rect x="1135" y="175" width="105" height="32" rx="16" fill="#1e2742" stroke="#5b8def"/>
      <text x="1187" y="196" text-anchor="middle" fill="#bfdbfe">INST 不全</text>
      <rect x="990" y="215" width="160" height="32" rx="16" fill="#1e2742" stroke="#a78bfa"/>
      <text x="1070" y="236" text-anchor="middle" fill="#ddd6fe">ENV 环境不一致</text>
    </g>

    <!-- Results panel -->
    <rect x="900" y="275" width="340" height="210" rx="14" fill="#1a2340" stroke="#8b5cf6" stroke-width="1.5"/>
    <text x="1070" y="302" text-anchor="middle" fill="#ffffff" font-size="14" font-weight="700">审计结果</text>

    <g font-size="12">
      <circle cx="920" cy="332" r="5" fill="#34d399"/>
      <text x="934" y="336" fill="#d1fae5">ScienceAgentBench：12 个作者确认缺陷</text>
      <text x="934" y="352" fill="#9ca8d4" font-size="10.5">含致命错误，使原任务根本无解</text>

      <circle cx="920" cy="376" r="5" fill="#34d399"/>
      <text x="934" y="380" fill="#d1fae5">BIXBench Verified-50：对齐专家 83.3%</text>
      <text x="934" y="396" fill="#9ca8d4" font-size="10.5">部分匹配 95.8%，超最佳单模型 54.2%</text>

      <circle cx="920" cy="420" r="5" fill="#fbbf24"/>
      <text x="934" y="424" fill="#fde68a">Ensemble + 执行证据：召回 → 100%</text>

      <circle cx="920" cy="446" r="5" fill="#60a5fa"/>
      <text x="934" y="450" fill="#bfdbfe">50 任务全量审计 &lt; 15 美元 · 12 分钟</text>

      <circle cx="920" cy="472" r="5" fill="#f87171"/>
      <text x="934" y="476" fill="#fecaca">发现专家因熟悉盲区漏标的结构缺陷</text>
    </g>
  </g>

  <!-- Arrow: auditor -> results -->
  <path d="M 755 340 Q 825 340 895 340" stroke="#9ca8d4" stroke-width="2" fill="none" marker-end="url(#ar)"/>
  <text x="825" y="332" text-anchor="middle" fill="#cbd5ff" font-size="11">JSON 报告</text>

  <!-- Feedback loop bottom -->
  <path d="M 900 500 Q 640 750 380 500" stroke="#f87171" stroke-width="1.8" fill="none" stroke-dasharray="6,5" marker-end="url(#arR)"/>
  <text x="640" y="762" text-anchor="middle" fill="#fca5a5" font-size="12" font-weight="600">人机互补闭环：候选缺陷 → 专家裁决 → 修订 Benchmark</text>

  <!-- Bottom tagline -->
  <text x="640" y="798" text-anchor="middle" fill="#6b7aa8" font-size="11">前沿 LLM 不再只是评测对象，而是评测基础设施的共同维护者</text>
</svg>