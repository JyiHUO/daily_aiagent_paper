<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 580" font-family="'Helvetica Neue',Arial,sans-serif">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
    <linearGradient id="gTask" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#fef3c7"/>
      <stop offset="1" stop-color="#fde68a"/>
    </linearGradient>
  </defs>

  <rect width="900" height="580" fill="#f8fafc"/>

  <text x="450" y="36" text-anchor="middle" font-size="21" font-weight="700" fill="#0f172a">从真人浏览历史 → 长程 Agent 任务</text>
  <text x="450" y="58" text-anchor="middle" font-size="13" fill="#64748b">不是研究者臆想模板，而是真实用户干过的事</text>

  <!-- Step 1 -->
  <g>
    <rect x="40" y="90" width="200" height="180" rx="10" fill="#ffffff" stroke="#3b82f6" stroke-width="2"/>
    <text x="140" y="118" text-anchor="middle" font-size="15" font-weight="700" fill="#1e3a8a">① 248 名真人</text>
    <text x="140" y="140" text-anchor="middle" font-size="12" fill="#334155">读取 Chrome 历史</text>

    <rect x="60" y="158" width="160" height="96" rx="6" fill="#f1f5f9" stroke="#94a3b8"/>
    <circle cx="72" cy="170" r="3" fill="#ef4444"/>
    <circle cx="82" cy="170" r="3" fill="#f59e0b"/>
    <circle cx="92" cy="170" r="3" fill="#10b981"/>
    <line x1="60" y1="180" x2="220" y2="180" stroke="#cbd5e1"/>
    <rect x="70" y="190" width="140" height="10" fill="#dbeafe"/>
    <rect x="70" y="208" width="110" height="10" fill="#dbeafe"/>
    <rect x="70" y="226" width="130" height="10" fill="#dbeafe"/>
    <rect x="70" y="244" width="100" height="6" fill="#cbd5e1"/>
  </g>

  <!-- Step 2 -->
  <g>
    <rect x="290" y="90" width="200" height="180" rx="10" fill="#ffffff" stroke="#8b5cf6" stroke-width="2"/>
    <text x="390" y="118" text-anchor="middle" font-size="15" font-weight="700" fill="#5b21b6">② 切分 + 标注</text>
    <text x="390" y="140" text-anchor="middle" font-size="12" fill="#334155">Chrome Journey 算法</text>

    <rect x="310" y="160" width="160" height="28" rx="4" fill="#ede9fe" stroke="#a78bfa"/>
    <text x="390" y="179" text-anchor="middle" font-size="11" fill="#4c1d95">搜机票 PIT → LAX</text>
    <rect x="310" y="194" width="160" height="28" rx="4" fill="#ede9fe" stroke="#a78bfa"/>
    <text x="390" y="213" text-anchor="middle" font-size="11" fill="#4c1d95">查地图开车路线</text>
    <rect x="310" y="228" width="160" height="28" rx="4" fill="#ede9fe" stroke="#a78bfa"/>
    <text x="390" y="247" text-anchor="middle" font-size="11" fill="#4c1d95">看餐厅评价</text>
  </g>

  <!-- Step 3 -->
  <g>
    <rect x="540" y="90" width="320" height="180" rx="10" fill="url(#gTask)" stroke="#d97706" stroke-width="2"/>
    <text x="700" y="118" text-anchor="middle" font-size="15" font-weight="700" fill="#78350f">③ 聚类 + LLM 组合</text>
    <text x="700" y="140" text-anchor="middle" font-size="12" fill="#713f12">多条 journey → 一个长程任务</text>

    <rect x="560" y="158" width="280" height="98" rx="6" fill="#fffbeb" stroke="#f59e0b"/>
    <text x="700" y="182" text-anchor="middle" font-size="13" font-weight="700" fill="#78350f">"计划去棕榈泉参加婚礼"</text>
    <text x="700" y="205" text-anchor="middle" font-size="11" fill="#78350f">Google Flights · Maps</text>
    <text x="700" y="224" text-anchor="middle" font-size="11" fill="#78350f">餐厅评估 · CryptPad 写行程</text>
    <text x="700" y="246" text-anchor="middle" font-size="11" font-weight="700" fill="#b45309">跨 8 步 · 多网站</text>
  </g>

  <!-- arrows between steps -->
  <line x1="242" y1="180" x2="288" y2="180" stroke="#334155" stroke-width="2" marker-end="url(#ar)"/>
  <line x1="492" y1="180" x2="538" y2="180" stroke="#334155" stroke-width="2" marker-end="url(#ar)"/>

  <!-- Funnel stats -->
  <g transform="translate(40,320)">
    <text x="0" y="0" font-size="14" font-weight="700" fill="#0f172a">漏斗式筛选</text>

    <rect x="0" y="14" width="260" height="36" rx="6" fill="#e0f2fe" stroke="#0284c7"/>
    <text x="130" y="37" text-anchor="middle" font-size="13" fill="#075985">2380 条原始 journeys</text>

    <line x1="130" y1="52" x2="130" y2="70" stroke="#334155" stroke-width="2" marker-end="url(#ar)"/>

    <rect x="30" y="74" width="200" height="36" rx="6" fill="#dbeafe" stroke="#2563eb"/>
    <text x="130" y="97" text-anchor="middle" font-size="12" fill="#1e3a8a">LLM + 人工筛选 → 696</text>

    <line x1="130" y1="112" x2="130" y2="130" stroke="#334155" stroke-width="2" marker-end="url(#ar)"/>

    <rect x="60" y="134" width="140" height="38" rx="6" fill="#fee2e2" stroke="#dc2626"/>
    <text x="130" y="158" text-anchor="middle" font-size="13" font-weight="700" fill="#7f1d1d">200 个长程任务</text>
  </g>

  <!-- Each task carries -->
  <g transform="translate(340,330)">
    <text x="0" y="0" font-size="14" font-weight="700" fill="#0f172a">每个任务都带：</text>
    <rect x="0" y="14" width="220" height="28" rx="4" fill="#ecfdf5" stroke="#10b981"/>
    <text x="12" y="33" font-size="12" fill="#065f46">自然语言指令</text>
    <rect x="0" y="52" width="220" height="28" rx="4" fill="#ecfdf5" stroke="#10b981"/>
    <text x="12" y="71" font-size="12" fill="#065f46">步骤计划</text>
    <rect x="0" y="90" width="220" height="28" rx="4" fill="#ecfdf5" stroke="#10b981"/>
    <text x="12" y="109" font-size="12" fill="#065f46">细粒度 rubric</text>
  </g>

  <!-- Difficulty bar chart -->
  <g transform="translate(620,330)">
    <text x="110" y="0" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a">200 个任务难度分布</text>

    <!-- baseline -->
    <line x1="10" y1="190" x2="230" y2="190" stroke="#94a3b8" stroke-width="1"/>

    <!-- easy 45 -->
    <rect x="25" y="132" width="50" height="58" fill="#86efac" stroke="#16a34a"/>
    <text x="50" y="124" text-anchor="middle" font-size="13" font-weight="700" fill="#14532d">45</text>
    <text x="50" y="208" text-anchor="middle" font-size="12" fill="#334155">易</text>

    <!-- mid 46 -->
    <rect x="95" y="131" width="50" height="59" fill="#fbbf24" stroke="#d97706"/>
    <text x="120" y="123" text-anchor="middle" font-size="13" font-weight="700" fill="#78350f">46</text>
    <text x="120" y="208" text-anchor="middle" font-size="12" fill="#334155">中</text>

    <!-- hard 109 -->
    <rect x="165" y="50" width="50" height="140" fill="#f87171" stroke="#dc2626"/>
    <text x="190" y="42" text-anchor="middle" font-size="13" font-weight="700" fill="#7f1d1d">109</text>
    <text x="190" y="208" text-anchor="middle" font-size="12" fill="#334155">难</text>
  </g>
</svg>