<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" font-family="'Helvetica Neue',Arial,sans-serif">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#c0392b"/>
    </marker>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#2c3e50"/>
    </marker>
  </defs>

  <rect width="900" height="600" fill="#f7f8fb"/>

  <!-- Title -->
  <text x="450" y="38" text-anchor="middle" font-size="22" font-weight="700" fill="#1a2233">把基准当软件来审计：找"四件套"之间的错位</text>
  <text x="450" y="62" text-anchor="middle" font-size="13" fill="#5a6377">单看每份都对，合起来才发现 bug</text>

  <!-- Instruction -->
  <g>
    <rect x="80" y="130" width="210" height="86" rx="10" fill="#e8f1ff" stroke="#3b7dd8" stroke-width="2"/>
    <text x="185" y="158" text-anchor="middle" font-size="15" font-weight="700" fill="#1f4e8c">Instruction · 任务说明</text>
    <text x="185" y="182" text-anchor="middle" font-size="12" fill="#334">"分析 ecg-1000hz.csv"</text>
    <text x="185" y="202" text-anchor="middle" font-size="11" fill="#667">INST 类缺陷：含糊 / 不完整</text>
  </g>

  <!-- Gold Program -->
  <g>
    <rect x="610" y="130" width="210" height="86" rx="10" fill="#eaf7ee" stroke="#2ea25f" stroke-width="2"/>
    <text x="715" y="158" text-anchor="middle" font-size="15" font-weight="700" fill="#1d6b3e">Gold Program · 参考答案</text>
    <text x="715" y="182" text-anchor="middle" font-size="12" fill="#334">读 bio-eventrelated-100hz.csv</text>
    <text x="715" y="202" text-anchor="middle" font-size="11" fill="#667">GT 类缺陷：逻辑 / 隐含假设</text>
  </g>

  <!-- Eval Script -->
  <g>
    <rect x="80" y="400" width="210" height="86" rx="10" fill="#fff1e6" stroke="#e07a2a" stroke-width="2"/>
    <text x="185" y="428" text-anchor="middle" font-size="15" font-weight="700" fill="#8a4410">Eval Script · 评测脚本</text>
    <text x="185" y="452" text-anchor="middle" font-size="12" fill="#334">检查的指标 / 字段</text>
    <text x="185" y="472" text-anchor="middle" font-size="11" fill="#667">EVAL 类缺陷：判分偏差</text>
  </g>

  <!-- Environment -->
  <g>
    <rect x="610" y="400" width="210" height="86" rx="10" fill="#f3e8fb" stroke="#7a47b8" stroke-width="2"/>
    <text x="715" y="428" text-anchor="middle" font-size="15" font-weight="700" fill="#4a2480">Environment · 运行环境</text>
    <text x="715" y="452" text-anchor="middle" font-size="12" fill="#334">数据文件 / 依赖</text>
    <text x="715" y="472" text-anchor="middle" font-size="11" fill="#667">ENV 类缺陷：缺文件 / 版本</text>
  </g>

  <!-- Center auditor -->
  <g>
    <circle cx="450" cy="310" r="80" fill="#1a2233"/>
    <circle cx="450" cy="310" r="80" fill="none" stroke="#c0392b" stroke-width="2" stroke-dasharray="4 3"/>
    <text x="450" y="300" text-anchor="middle" font-size="16" font-weight="700" fill="#fff">BenchGuard</text>
    <text x="450" y="320" text-anchor="middle" font-size="12" fill="#f1c40f">跨产物比对</text>
    <text x="450" y="338" text-anchor="middle" font-size="11" fill="#cfd6e0">LLM 审计员</text>
  </g>

  <!-- Lines from auditor to each artifact edge -->
  <line x1="388" y1="262" x2="295" y2="210" stroke="#2c3e50" stroke-width="1.6" marker-end="url(#ag)"/>
  <line x1="512" y1="262" x2="605" y2="210" stroke="#2c3e50" stroke-width="1.6" marker-end="url(#ag)"/>
  <line x1="388" y1="358" x2="295" y2="405" stroke="#2c3e50" stroke-width="1.6" marker-end="url(#ag)"/>
  <line x1="512" y1="358" x2="605" y2="405" stroke="#2c3e50" stroke-width="1.6" marker-end="url(#ag)"/>

  <!-- Mismatch highlight: instruction <-> gold -->
  <path d="M290 150 Q 450 80 610 150" stroke="#c0392b" stroke-width="2.5" fill="none" stroke-dasharray="6 4" marker-end="url(#ar)"/>
  <rect x="380" y="86" width="140" height="26" rx="6" fill="#c0392b"/>
  <text x="450" y="104" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">对不上：输入文件不一致</text>

  <!-- Defect categories bar -->
  <g>
    <rect x="120" y="530" width="660" height="46" rx="8" fill="#ffffff" stroke="#c9cfda"/>
    <text x="450" y="515" text-anchor="middle" font-size="12" fill="#5a6377">缺陷分类体系</text>
    <text x="190" y="558" text-anchor="middle" font-size="13" font-weight="700" fill="#1f4e8c">INST</text>
    <text x="330" y="558" text-anchor="middle" font-size="13" font-weight="700" fill="#1d6b3e">GT</text>
    <text x="470" y="558" text-anchor="middle" font-size="13" font-weight="700" fill="#8a4410">EVAL</text>
    <text x="610" y="558" text-anchor="middle" font-size="13" font-weight="700" fill="#4a2480">ENV</text>
    <text x="720" y="558" text-anchor="middle" font-size="12" fill="#555">4 类 · 14 子类</text>
    <line x1="260" y1="538" x2="260" y2="568" stroke="#c9cfda"/>
    <line x1="400" y1="538" x2="400" y2="568" stroke="#c9cfda"/>
    <line x1="540" y1="538" x2="540" y2="568" stroke="#c9cfda"/>
    <line x1="680" y1="538" x2="680" y2="568" stroke="#c9cfda"/>
  </g>
</svg>