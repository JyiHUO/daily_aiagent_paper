<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 620" font-family="'Helvetica Neue',Arial,sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#3b5bdb"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#b5421b"/>
    </marker>
  </defs>

  <rect width="900" height="620" fill="#f7f8fb"/>

  <!-- Title -->
  <text x="450" y="38" text-anchor="middle" font-size="22" font-weight="700" fill="#1a2340">决策可观测：每次修改都是一张可被打脸的赌注</text>
  <text x="450" y="62" text-anchor="middle" font-size="13" fill="#6b7390">Evolve Agent 先立 flag，下一轮自动对账，赌输就回滚</text>

  <!-- Left: Change Manifest -->
  <rect x="40" y="95" width="300" height="320" rx="12" fill="#ffffff" stroke="#3b5bdb" stroke-width="2"/>
  <rect x="40" y="95" width="300" height="38" rx="12" fill="#3b5bdb"/>
  <text x="190" y="120" text-anchor="middle" font-size="16" font-weight="700" fill="#fff">① Change Manifest（赌约）</text>

  <text x="60" y="162" font-size="13" font-weight="600" fill="#1a2340">失败证据</text>
  <text x="60" y="182" font-size="12" fill="#6b7390">task A、B 因状态校验缺失报错</text>

  <text x="60" y="212" font-size="13" font-weight="600" fill="#1a2340">具体改法</text>
  <text x="60" y="232" font-size="12" fill="#6b7390">加一条"发布状态保护"规则</text>

  <text x="60" y="262" font-size="13" font-weight="600" fill="#16794c">预测修好：A, B</text>
  <text x="60" y="286" font-size="13" font-weight="600" fill="#b5421b">可能回归：C</text>

  <line x1="60" y1="310" x2="320" y2="310" stroke="#e1e4ec"/>
  <text x="60" y="334" font-size="12" font-weight="600" fill="#1a2340">沙箱约束</text>
  <text x="60" y="354" font-size="12" fill="#6b7390">只能写 harness/ 目录</text>
  <text x="60" y="374" font-size="12" fill="#6b7390">不能动 verifier / 模型配置</text>
  <text x="60" y="394" font-size="12" fill="#6b7390">不能改种子 system prompt</text>

  <!-- Arrow to evaluation -->
  <path d="M 345 245 L 405 245" stroke="#3b5bdb" stroke-width="2.5" fill="none" marker-end="url(#arr)"/>
  <text x="375" y="236" text-anchor="middle" font-size="11" fill="#3b5bdb">下一轮</text>

  <!-- Right: actual results vs predicted -->
  <rect x="410" y="95" width="450" height="320" rx="12" fill="#ffffff" stroke="#8a94a6" stroke-width="2"/>
  <rect x="410" y="95" width="450" height="38" rx="12" fill="#1a2340"/>
  <text x="635" y="120" text-anchor="middle" font-size="16" font-weight="700" fill="#fff">② 实际评测 ∩ 预测 → Verdict</text>

  <!-- Task rows -->
  <g font-size="13">
    <rect x="430" y="155" width="70" height="32" rx="6" fill="#d9f2e4" stroke="#16794c"/>
    <text x="465" y="176" text-anchor="middle" font-weight="700" fill="#16794c">A ✓</text>
    <text x="510" y="176" fill="#1a2340">预测修好 · 实际修好</text>
    <text x="760" y="176" font-weight="700" fill="#16794c">命中</text>

    <rect x="430" y="197" width="70" height="32" rx="6" fill="#fde8e8" stroke="#b5421b"/>
    <text x="465" y="218" text-anchor="middle" font-weight="700" fill="#b5421b">B ✗</text>
    <text x="510" y="218" fill="#1a2340">预测修好 · 仍失败</text>
    <text x="760" y="218" font-weight="700" fill="#b5421b">证伪</text>

    <rect x="430" y="239" width="70" height="32" rx="6" fill="#fde8e8" stroke="#b5421b"/>
    <text x="465" y="260" text-anchor="middle" font-weight="700" fill="#b5421b">D ✗</text>
    <text x="510" y="260" fill="#1a2340">没预告 · 却回归了</text>
    <text x="760" y="260" font-weight="700" fill="#b5421b">漏报</text>
  </g>

  <line x1="430" y1="292" x2="840" y2="292" stroke="#e1e4ec"/>

  <text x="430" y="318" font-size="13" font-weight="700" fill="#1a2340">论文数据</text>
  <text x="430" y="340" font-size="12" fill="#6b7390">fix 预测精度 33.7%（优于随机 5×）</text>
  <text x="430" y="360" font-size="12" fill="#6b7390">regression 预测仅优于随机 2× → 已知弱点</text>
  <text x="430" y="390" font-size="12.5" fill="#b5421b" font-weight="700">判定部分证伪 → 文件级 rollback</text>

  <!-- Bottom loopback arrow -->
  <path d="M 635 415 L 635 450 L 190 450 L 190 415" stroke="#b5421b" stroke-width="2.5" fill="none" stroke-dasharray="6,4" marker-end="url(#arrR)"/>
  <rect x="340" y="432" width="220" height="36" rx="8" fill="#fff3ec" stroke="#b5421b" stroke-width="1.5"/>
  <text x="450" y="456" text-anchor="middle" font-size="13" font-weight="700" fill="#b5421b">被证伪的修改自动回滚</text>

  <!-- Bottom takeaway -->
  <rect x="100" y="505" width="700" height="80" rx="10" fill="#1a2340"/>
  <text x="450" y="535" text-anchor="middle" font-size="14" font-weight="700" fill="#ffd866">把"漂亮的自我解释"变成"下一轮能对账的赌注"</text>
  <text x="450" y="562" text-anchor="middle" font-size="12" fill="#d9dcec">防止自进化退化为盲目试错，也堵死"把 verifier 关了"的捷径</text>
</svg>