<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#2e7d32"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="450" y="38" text-anchor="middle" font-size="22" font-weight="bold" fill="#1a1a1a">审计成本便宜到可以天天跑</text>
  <text x="450" y="62" text-anchor="middle" font-size="13" fill="#666">把基准质量做成 CI 级别的持续检查</text>

  <!-- LEFT: Old way -->
  <g>
    <rect x="60" y="90" width="340" height="220" rx="10" fill="#fdecec" stroke="#c0392b" stroke-width="2"/>
    <text x="230" y="120" text-anchor="middle" font-size="17" font-weight="bold" fill="#c0392b">过去：人工专家复核</text>

    <text x="90" y="180" font-size="38">👨‍🔬</text>
    <text x="250" y="165" text-anchor="middle" font-size="13" fill="#333">每题 $$$ · 耗时数周</text>
    <text x="250" y="190" text-anchor="middle" font-size="13" fill="#333">只能一次性复核</text>
    <text x="250" y="215" text-anchor="middle" font-size="13" fill="#333">更新一次就过期</text>

    <rect x="85" y="250" width="290" height="40" rx="5" fill="#c0392b"/>
    <text x="230" y="275" text-anchor="middle" font-size="13" fill="white" font-weight="bold">代价：带 bug 基准被社区误用</text>
  </g>

  <!-- RIGHT: BenchGuard -->
  <g>
    <rect x="500" y="90" width="340" height="220" rx="10" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2"/>
    <text x="670" y="120" text-anchor="middle" font-size="17" font-weight="bold" fill="#2e7d32">BenchGuard：LLM 自动审计</text>

    <text x="525" y="178" font-size="34">🤖</text>
    <text x="695" y="155" text-anchor="middle" font-size="13" fill="#333">50 任务 · 5 模型并集</text>
    <text x="695" y="182" text-anchor="middle" font-size="22" font-weight="bold" fill="#2e7d32">&lt; $15</text>
    <text x="695" y="205" text-anchor="middle" font-size="12" fill="#555">Gemini 3.0 Flash 单跑 $0.53</text>
    <text x="695" y="224" text-anchor="middle" font-size="12" fill="#555">83.3% 对齐专家修订</text>

    <rect x="525" y="250" width="290" height="40" rx="5" fill="#2e7d32"/>
    <text x="670" y="275" text-anchor="middle" font-size="13" fill="white" font-weight="bold">每次加题都顺手跑一轮</text>
  </g>

  <!-- VS -->
  <circle cx="450" cy="200" r="26" fill="#fff" stroke="#333" stroke-width="2"/>
  <text x="450" y="207" text-anchor="middle" font-size="16" font-weight="bold" fill="#333">VS</text>

  <!-- Bottom panel -->
  <rect x="100" y="360" width="700" height="170" rx="10" fill="#eef3fb" stroke="#2c5aa0" stroke-width="2"/>
  <text x="450" y="390" text-anchor="middle" font-size="16" font-weight="bold" fill="#2c5aa0">审计便宜 → 变成基准建设的质量闸门</text>

  <g font-size="13" fill="#1a1a1a">
    <rect x="135" y="415" width="190" height="85" rx="8" fill="white" stroke="#2c5aa0"/>
    <text x="230" y="450" text-anchor="middle" font-weight="bold" font-size="14">发布前门禁</text>
    <text x="230" y="478" text-anchor="middle" fill="#555">CI 里自动跑审计</text>

    <rect x="355" y="415" width="190" height="85" rx="8" fill="white" stroke="#2c5aa0"/>
    <text x="450" y="450" text-anchor="middle" font-weight="bold" font-size="14">每次更新复审</text>
    <text x="450" y="478" text-anchor="middle" fill="#555">加题即审计</text>

    <rect x="575" y="415" width="190" height="85" rx="8" fill="white" stroke="#2c5aa0"/>
    <text x="670" y="450" text-anchor="middle" font-weight="bold" font-size="14">文献自动造题</text>
    <text x="670" y="478" text-anchor="middle" fill="#555">带完整性保证</text>
  </g>

  <!-- arrow from right box down to bottom panel -->
  <path d="M 670 310 L 670 340 L 450 340 L 450 358" stroke="#2e7d32" stroke-width="2.5" fill="none" marker-end="url(#arr)"/>
</svg>