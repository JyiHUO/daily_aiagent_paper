<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 620" font-family="'Helvetica Neue',Arial,sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#2b6cb0"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#2f855a"/>
    </marker>
  </defs>

  <rect width="900" height="620" fill="#f7fafc"/>

  <text x="450" y="38" text-anchor="middle" font-size="22" font-weight="700" fill="#1a202c">进化出的 harness：换任务换模型依然能打</text>
  <text x="450" y="62" text-anchor="middle" font-size="13" fill="#4a5568">behavior 藏在工具 / 中间件 / 记忆里，比藏在 prompt 里更耐用</text>

  <!-- Source harness -->
  <g>
    <rect x="40" y="110" width="240" height="180" rx="12" fill="#ebf8ff" stroke="#2b6cb0" stroke-width="2"/>
    <text x="160" y="138" text-anchor="middle" font-size="15" font-weight="700" fill="#2b6cb0">在 Terminal-Bench 2 上进化</text>
    <text x="160" y="160" text-anchor="middle" font-size="12" fill="#2d3748">10 轮自动迭代  69.7% → 77.0%</text>

    <rect x="60" y="180" width="200" height="28" rx="6" fill="#fff" stroke="#90cdf4"/>
    <text x="160" y="199" text-anchor="middle" font-size="12" fill="#2c5282">工具 Tools</text>
    <rect x="60" y="214" width="200" height="28" rx="6" fill="#fff" stroke="#90cdf4"/>
    <text x="160" y="233" text-anchor="middle" font-size="12" fill="#2c5282">中间件 Middleware</text>
    <rect x="60" y="248" width="200" height="28" rx="6" fill="#fff" stroke="#90cdf4"/>
    <text x="160" y="267" text-anchor="middle" font-size="12" fill="#2c5282">长期记忆 Memory</text>
  </g>

  <!-- Arrow to task -->
  <path d="M282,170 L410,170" stroke="#2b6cb0" stroke-width="3" fill="none" marker-end="url(#arr)"/>
  <text x="346" y="160" text-anchor="middle" font-size="12" fill="#2b6cb0" font-weight="600">原样搬运</text>

  <!-- Arrow to model -->
  <path d="M282,230 L640,230" stroke="#2b6cb0" stroke-width="3" fill="none" marker-end="url(#arr)"/>
  <text x="460" y="222" text-anchor="middle" font-size="12" fill="#2b6cb0" font-weight="600">原样搬运</text>

  <!-- Target 1: new task -->
  <g>
    <rect x="420" y="110" width="210" height="110" rx="12" fill="#f0fff4" stroke="#2f855a" stroke-width="2"/>
    <text x="525" y="135" text-anchor="middle" font-size="14" font-weight="700" fill="#2f855a">换任务</text>
    <text x="525" y="154" text-anchor="middle" font-size="12" fill="#2d3748">SWE-bench Verified</text>
    <text x="525" y="178" text-anchor="middle" font-size="12" fill="#22543d">成功率最高 · token 省 12%</text>
    <text x="525" y="200" text-anchor="middle" font-size="11" fill="#4a5568">django: 527k → 484k tokens</text>
  </g>

  <!-- Target 2: new model -->
  <g>
    <rect x="640" y="180" width="220" height="120" rx="12" fill="#fff5f5" stroke="#c05621" stroke-width="2"/>
    <text x="750" y="206" text-anchor="middle" font-size="14" font-weight="700" fill="#c05621">换模型家族</text>
    <text x="750" y="226" text-anchor="middle" font-size="11" fill="#2d3748">Qwen3.6 / Gemini / DeepSeek</text>
    <text x="750" y="252" text-anchor="middle" font-size="13" fill="#7b341e" font-weight="600">+5.1 ~ +10.1 pp</text>
    <text x="750" y="278" text-anchor="middle" font-size="12" fill="#c05621">DeepSeek-v4 on TB2: 51.7% → 61.8%</text>
  </g>

  <!-- Ablation: why -->
  <g>
    <rect x="40" y="330" width="820" height="260" rx="12" fill="#fffaf0" stroke="#d69e2e" stroke-width="2"/>
    <text x="450" y="360" text-anchor="middle" font-size="16" font-weight="700" fill="#975a16">消融：到底是哪部分在迁移？</text>

    <!-- Bars -->
    <g transform="translate(80,385)">
      <line x1="140" y1="-5" x2="140" y2="140" stroke="#cbd5e0" stroke-width="1"/>

      <text x="0" y="20" font-size="12" fill="#2d3748">工具 Tools</text>
      <rect x="140" y="7" width="150" height="18" fill="#2f855a"/>
      <text x="298" y="21" font-size="12" fill="#2f855a" font-weight="700">＋ 正收益</text>

      <text x="0" y="55" font-size="12" fill="#2d3748">中间件 Middleware</text>
      <rect x="140" y="42" width="170" height="18" fill="#2f855a"/>
      <text x="318" y="56" font-size="12" fill="#2f855a" font-weight="700">＋ 正收益</text>

      <text x="0" y="90" font-size="12" fill="#2d3748">长期记忆 Memory</text>
      <rect x="140" y="77" width="135" height="18" fill="#2f855a"/>
      <text x="283" y="91" font-size="12" fill="#2f855a" font-weight="700">＋ 正收益</text>

      <text x="0" y="125" font-size="12" fill="#2d3748">系统提示 Prompt</text>
      <rect x="100" y="112" width="40" height="18" fill="#c53030"/>
      <text x="92" y="126" text-anchor="end" font-size="12" fill="#c53030" font-weight="700">−2.3 pp</text>
    </g>

    <!-- Insight box -->
    <rect x="510" y="385" width="330" height="175" rx="10" fill="#fff" stroke="#d69e2e"/>
    <text x="675" y="412" text-anchor="middle" font-size="13" font-weight="700" fill="#975a16">关键洞察</text>
    <text x="530" y="440" font-size="12" fill="#2d3748">工具 / 中间件是每次调用都真实</text>
    <text x="530" y="460" font-size="12" fill="#2d3748">生效的代码，跨任务跨模型仍然</text>
    <text x="530" y="480" font-size="12" fill="#2d3748">约束 agent 行为。</text>
    <text x="530" y="510" font-size="12" fill="#c53030">Prompt 换个场景就失效。</text>
    <text x="530" y="540" font-size="11" fill="#4a5568">越弱的模型越依赖这些外部脚手架，</text>
    <text x="530" y="556" font-size="11" fill="#4a5568">因此进化收益越大。</text>
  </g>
</svg>