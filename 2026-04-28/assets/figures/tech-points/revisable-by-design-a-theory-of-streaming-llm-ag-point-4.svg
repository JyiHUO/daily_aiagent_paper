<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" font-family="'Helvetica Neue',Arial,sans-serif">
  <rect width="900" height="560" fill="#f7f8fb"/>

  <!-- Title -->
  <text x="450" y="38" text-anchor="middle" font-size="22" font-weight="700" fill="#1a2740">中途改需求：质量相当，浪费差 14.6×</text>
  <text x="450" y="62" text-anchor="middle" font-size="13" fill="#5a6478">StreamBench · DeepSeek-V3 · 1,008 次实验</text>

  <!-- Scenario bar -->
  <g transform="translate(80,90)">
    <rect width="740" height="40" rx="8" fill="#e8edf7" stroke="#c9d2e8"/>
    <text x="370" y="25" text-anchor="middle" font-size="13" fill="#2a3556">已跑 9 步 ... 用户中途改规格 ✎</text>
  </g>

  <!-- Absorber (winner) -->
  <g transform="translate(70,170)">
    <rect width="360" height="200" rx="14" fill="#e6f4ea" stroke="#2e8b57" stroke-width="2"/>
    <text x="180" y="34" text-anchor="middle" font-size="17" font-weight="700" fill="#1f5d3a">Absorber（回滚+补偿）</text>

    <g transform="translate(24,58)">
      <rect width="200" height="22" rx="4" fill="#2e8b57"/>
      <text x="100" y="16" text-anchor="middle" font-size="11" fill="#fff">保留 8 步已完成工作</text>
      <rect x="204" y="0" width="30" height="22" rx="4" fill="#f5a623"/>
      <text x="219" y="16" text-anchor="middle" font-size="11" fill="#fff">补1</text>
      <rect x="238" y="0" width="70" height="22" rx="4" fill="#7ab8e6"/>
      <text x="273" y="16" text-anchor="middle" font-size="11" fill="#fff">再规划</text>
    </g>

    <text x="24" y="118" font-size="13" fill="#1f5d3a">质量 <tspan font-weight="700">3.07</tspan>　浪费 <tspan font-weight="700">0.78 步</tspan></text>
    <text x="24" y="158" font-size="12" fill="#2a3556">✓ 只撤销受影响的部分</text>
  </g>

  <!-- Full-Restart (loser) -->
  <g transform="translate(470,170)">
    <rect width="360" height="200" rx="14" fill="#fdecea" stroke="#c0392b" stroke-width="2"/>
    <text x="180" y="34" text-anchor="middle" font-size="17" font-weight="700" fill="#922b21">Full-Restart（推倒重来）</text>

    <g transform="translate(24,58)">
      <rect width="308" height="22" rx="4" fill="#c0392b"/>
      <text x="154" y="16" text-anchor="middle" font-size="11" fill="#fff">丢弃全部 9 步 · 从零重跑</text>
    </g>

    <text x="24" y="118" font-size="13" fill="#922b21">质量 <tspan font-weight="700">3.17</tspan>　浪费 <tspan font-weight="700">11.41 步</tspan></text>
    <text x="24" y="140" font-size="11" fill="#5a6478">（质量与左侧无显著差异，|d|&lt;0.2）</text>
    <text x="24" y="170" font-size="12" fill="#2a3556">✗ 预算内常常跑不完</text>
  </g>

  <!-- VS -->
  <circle cx="450" cy="270" r="22" fill="#1a2740"/>
  <text x="450" y="276" text-anchor="middle" font-size="15" font-weight="700" fill="#fff">VS</text>

  <!-- Bottom conclusion -->
  <g transform="translate(70,410)">
    <rect width="760" height="110" rx="12" fill="#fff" stroke="#c9d2e8"/>
    <text x="380" y="30" text-anchor="middle" font-size="15" font-weight="700" fill="#1a2740">结论：质量打平，浪费差一个数量级</text>

    <!-- bar compare -->
    <text x="60" y="65" font-size="12" fill="#2e8b57">Absorber</text>
    <rect x="130" y="54" width="20" height="14" fill="#2e8b57"/>
    <text x="158" y="65" font-size="12" fill="#2a3556">0.78</text>

    <text x="60" y="92" font-size="12" fill="#c0392b">Full-Restart</text>
    <rect x="130" y="81" width="293" height="14" fill="#c0392b"/>
    <text x="430" y="92" font-size="12" fill="#2a3556">11.41</text>

    <text x="580" y="78" text-anchor="middle" font-size="12" fill="#5a6478">Claude / GPT-4o-mini 上</text>
    <text x="580" y="95" text-anchor="middle" font-size="12" fill="#5a6478">结构性浪费同样稳定</text>

    <text x="720" y="78" text-anchor="middle" font-size="22" font-weight="700" fill="#1a2740">14.6×</text>
    <text x="720" y="95" text-anchor="middle" font-size="11" fill="#5a6478">节省工作量</text>
  </g>
</svg>