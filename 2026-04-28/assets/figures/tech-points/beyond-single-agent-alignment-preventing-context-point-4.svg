<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 560" font-family="'Helvetica Neue',Arial,sans-serif">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#2c5fa8"/>
    </marker>
    <marker id="arR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#c0392b"/>
    </marker>
    <marker id="arG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#27864f"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="430" y="34" text-anchor="middle" font-size="21" font-weight="700" fill="#1a1a1a">PhantomEcosystem：看起来一样，差别在上下文</text>
  <text x="430" y="56" text-anchor="middle" font-size="13" fill="#666">200 场景 · 160 攻击 + 40 合规对照 · 无显式敏感标签</text>

  <!-- Left: twin scenarios -->
  <g>
    <rect x="40" y="90" width="340" height="155" rx="10" fill="#fdecea" stroke="#c0392b" stroke-width="2"/>
    <text x="60" y="115" font-size="13" font-weight="700" fill="#c0392b">场景 A · 违规</text>
    <text x="60" y="143" font-size="14" fill="#222">"在客户邮件里提 Titan 项目"</text>
    <text x="60" y="173" font-size="12" fill="#666">接收方：外部客户  ← 关键差异</text>
    <text x="60" y="193" font-size="12" fill="#666">数据：内部项目代号</text>
    <text x="60" y="225" font-size="13" fill="#c0392b" font-weight="700">❌ 跨域越权</text>

    <rect x="40" y="275" width="340" height="155" rx="10" fill="#e8f5ec" stroke="#27864f" stroke-width="2"/>
    <text x="60" y="300" font-size="13" font-weight="700" fill="#27864f">场景 B · 合规</text>
    <text x="60" y="328" font-size="14" fill="#222">"和同事内部讨论 Titan 项目"</text>
    <text x="60" y="358" font-size="12" fill="#666">接收方：内部同事</text>
    <text x="60" y="378" font-size="12" fill="#666">数据：内部项目代号</text>
    <text x="60" y="410" font-size="13" fill="#27864f" font-weight="700">✅ 允许</text>
  </g>

  <!-- Middle connector -->
  <text x="210" y="263" text-anchor="middle" font-size="12" fill="#888" font-style="italic">用词几乎一致，唯一差别是接收方</text>

  <!-- Right: keyword filter fails -->
  <g>
    <rect x="470" y="90" width="350" height="145" rx="10" fill="#f4f4f4" stroke="#999" stroke-width="1.5" stroke-dasharray="5,4"/>
    <text x="645" y="118" text-anchor="middle" font-size="14" font-weight="700" fill="#555">传统关键词过滤</text>
    <text x="645" y="145" text-anchor="middle" font-size="12" fill="#666">扫 "Confidential / Secret"</text>
    <text x="645" y="175" text-anchor="middle" font-size="13" fill="#c0392b">两条字面看不出区别</text>
    <text x="645" y="198" text-anchor="middle" font-size="13" fill="#c0392b">→ 全放行 或 全误杀</text>
    <text x="645" y="222" text-anchor="middle" font-size="12" fill="#888" font-style="italic">只看字面，不看接收方</text>
  </g>

  <!-- Right: PolicyChecker -->
  <g>
    <rect x="470" y="270" width="350" height="185" rx="10" fill="#eaf1fb" stroke="#2c5fa8" stroke-width="2"/>
    <text x="645" y="296" text-anchor="middle" font-size="15" font-weight="700" fill="#2c5fa8">PolicyChecker：基于状态推理</text>
    
    <rect x="490" y="312" width="145" height="48" rx="6" fill="#fff" stroke="#2c5fa8"/>
    <text x="562" y="333" text-anchor="middle" font-size="12" fill="#222" font-weight="600">82 类数据登记</text>
    <text x="562" y="350" text-anchor="middle" font-size="11" fill="#666">data type registry</text>

    <rect x="655" y="312" width="145" height="48" rx="6" fill="#fff" stroke="#2c5fa8"/>
    <text x="727" y="333" text-anchor="middle" font-size="12" fill="#222" font-weight="600">跨域授权矩阵</text>
    <text x="727" y="350" text-anchor="middle" font-size="11" fill="#666">cross-domain ACL</text>

    <text x="645" y="390" text-anchor="middle" font-size="13" fill="#2c5fa8">判 (数据, 发送方, 接收方域)</text>
    <text x="645" y="415" text-anchor="middle" font-size="12" fill="#333">与模板标签一致率</text>
    <text x="645" y="442" text-anchor="middle" font-size="20" font-weight="700" fill="#2c5fa8">98.5%</text>
  </g>

  <!-- Arrows: scenarios fail at keyword filter -->
  <line x1="380" y1="165" x2="468" y2="160" stroke="#c0392b" stroke-width="1.8" marker-end="url(#arR)"/>
  <line x1="380" y1="350" x2="468" y2="180" stroke="#27864f" stroke-width="1.8" marker-end="url(#arG)"/>

  <!-- Arrows: scenarios correctly handled by PolicyChecker -->
  <line x1="380" y1="210" x2="468" y2="335" stroke="#2c5fa8" stroke-width="1.6" marker-end="url(#ar)"/>
  <line x1="380" y1="395" x2="468" y2="360" stroke="#2c5fa8" stroke-width="1.6" marker-end="url(#ar)"/>

  <!-- Bottom tagline -->
  <text x="430" y="495" text-anchor="middle" font-size="13" fill="#444">覆盖 9 类攻击 · 17 种 Agent · 7 个组织域 · 38 种数据类型</text>
  <text x="430" y="520" text-anchor="middle" font-size="13" font-weight="700" fill="#1a1a1a">强迫系统理解"谁把什么发给了谁"，而不是关键词匹配</text>
</svg>