<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" font-family="'Helvetica Neue',Arial,sans-serif">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#2b6cb0"/>
    </marker>
    <marker id="arR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#38a169"/>
    </marker>
  </defs>

  <rect width="900" height="560" fill="#f7fafc"/>

  <text x="450" y="38" text-anchor="middle" font-size="22" font-weight="700" fill="#1a202c">跨域布尔谓词查询：只问 Yes/No，不泄露图</text>
  <text x="450" y="62" text-anchor="middle" font-size="13" fill="#4a5568">单次查询信息泄露上限 = 1 bit</text>

  <!-- Left: Marketing -->
  <rect x="50" y="110" width="280" height="330" rx="14" fill="#ebf8ff" stroke="#2b6cb0" stroke-width="2"/>
  <text x="190" y="138" text-anchor="middle" font-size="16" font-weight="700" fill="#2b6cb0">市场部 Sidecar</text>

  <rect x="75" y="160" width="230" height="60" rx="8" fill="#ffffff" stroke="#90cdf4"/>
  <text x="190" y="183" text-anchor="middle" font-size="13" fill="#2d3748">拦截动作</text>
  <text x="190" y="203" text-anchor="middle" font-size="12" fill="#4a5568">send-email(audience=External)</text>

  <rect x="75" y="355" width="230" height="65" rx="8" fill="#fff5f5" stroke="#c53030"/>
  <text x="190" y="380" text-anchor="middle" font-size="14" font-weight="700" fill="#c53030">✕ Block + 审计日志</text>
  <text x="190" y="402" text-anchor="middle" font-size="11" fill="#742a2a">不知原因、不知 Titan 是什么</text>

  <!-- Right: R&amp;D -->
  <rect x="570" y="110" width="280" height="330" rx="14" fill="#f0fff4" stroke="#38a169" stroke-width="2"/>
  <text x="710" y="138" text-anchor="middle" font-size="16" font-weight="700" fill="#38a169">研发部 Sidecar</text>

  <rect x="595" y="160" width="230" height="90" rx="8" fill="#ffffff" stroke="#9ae6b4"/>
  <text x="710" y="183" text-anchor="middle" font-size="13" font-weight="600" fill="#2d3748">私有策略图（不出域）</text>
  <text x="710" y="206" text-anchor="middle" font-size="12" fill="#4a5568">node-42 = Titan 项目, scope=Internal</text>
  <text x="710" y="226" text-anchor="middle" font-size="11" fill="#718096">增强：ZK-SNARK / Paillier / TEE</text>

  <rect x="595" y="355" width="230" height="65" rx="8" fill="#ffffff" stroke="#38a169"/>
  <text x="710" y="380" text-anchor="middle" font-size="13" fill="#2d3748">本地判定 → 返回</text>
  <text x="710" y="404" text-anchor="middle" font-size="16" font-weight="700" fill="#c53030">False</text>

  <!-- Query arrow -->
  <line x1="330" y1="265" x2="570" y2="265" stroke="#2b6cb0" stroke-width="2.5" marker-end="url(#ar)"/>
  <rect x="355" y="246" width="190" height="24" rx="12" fill="#2b6cb0"/>
  <text x="450" y="263" text-anchor="middle" font-size="12" fill="#fff" font-weight="600">node-42 允许 External?</text>

  <!-- Reply arrow -->
  <line x1="570" y1="315" x2="330" y2="315" stroke="#38a169" stroke-width="2.5" marker-end="url(#arR)"/>
  <rect x="380" y="296" width="140" height="24" rx="12" fill="#38a169"/>
  <text x="450" y="313" text-anchor="middle" font-size="12" fill="#fff" font-weight="700">False （1 bit）</text>

  <!-- Bottom note -->
  <rect x="120" y="475" width="660" height="60" rx="10" fill="#fffaf0" stroke="#dd6b20" stroke-width="1.5"/>
  <text x="450" y="498" text-anchor="middle" font-size="13" font-weight="700" fill="#7b341e">核心巧思：源域不共享策略图，只回答一个 Yes/No</text>
  <text x="450" y="520" text-anchor="middle" font-size="12" fill="#7b341e">数据主权保留 ✓   跨域策略一致 ✓   先 copy-on-write 反事实仿真再提交</text>
</svg>