<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 420">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4B8BDA"/>
    </marker>
    <marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#D97757"/>
    </marker>
  </defs>

  <text x="300" y="34" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="18" font-weight="bold" fill="#1E3A5F">Look before you act</text>
  <text x="300" y="54" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#3D4F65">verify screen → replay action; on mismatch, hand off to CUA</text>

  <!-- Eye (verify) -->
  <g>
    <ellipse cx="150" cy="180" rx="78" ry="48" fill="#EFF6FF" stroke="#4B8BDA" stroke-width="2"/>
    <circle cx="150" cy="180" r="22" fill="#fff" stroke="#1E3A5F" stroke-width="2"/>
    <circle cx="150" cy="180" r="9" fill="#1E3A5F"/>
    <text x="150" y="256" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#1E3A5F" font-weight="bold">verify screen</text>
  </g>

  <!-- Hand (act) -->
  <g>
    <rect x="380" y="138" width="150" height="84" rx="10" fill="#EFF6FF" stroke="#4B8BDA" stroke-width="2"/>
    <text x="455" y="188" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="26">👆</text>
    <text x="455" y="256" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#1E3A5F" font-weight="bold">replay action</text>
  </g>

  <!-- pass arrow -->
  <path d="M232,178 L378,178" stroke="#4B8BDA" stroke-width="2.5" fill="none" marker-end="url(#a)"/>
  <text x="305" y="170" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#3D4F65">predicate pass</text>

  <!-- fail branch down to CUA -->
  <path d="M150,228 L150,330 L298,330" stroke="#D97757" stroke-width="2.5" fill="none" stroke-dasharray="6,4" marker-end="url(#r)"/>
  <text x="160" y="290" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#D97757">predicate fail</text>

  <!-- CUA fallback -->
  <g>
    <rect x="300" y="310" width="200" height="60" rx="10" fill="#FDF2EC" stroke="#D97757" stroke-width="2"/>
    <text x="400" y="336" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#1E3A5F" font-weight="bold">CUA fallback</text>
    <text x="400" y="356" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#3D4F65">grow new branch</text>
  </g>

  <!-- loop back: recompile new branch into replay action -->
  <path d="M500,340 C560,340 575,200 532,188" stroke="#D97757" stroke-width="1.8" fill="none" stroke-dasharray="4,4" marker-end="url(#r)"/>
  <text x="565" y="260" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#D97757">recompile</text>
</svg>