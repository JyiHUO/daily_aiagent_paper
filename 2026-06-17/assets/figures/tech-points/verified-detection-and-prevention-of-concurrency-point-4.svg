<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 460" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4B8BDA"/>
    </marker>
  </defs>

  <text x="300" y="30" text-anchor="middle" font-size="17" font-weight="700" fill="#1E3A5F">
    Auditing Real Agent Frameworks
  </text>
  <text x="300" y="50" text-anchor="middle" font-size="11" fill="#3D4F65">
    bugs found in the wild, fixed by climbing the hierarchy
  </text>

  <!-- Left: deer-flow case -->
  <g>
    <rect x="30" y="80" width="220" height="130" rx="10" fill="#EFF6FF" stroke="#4B8BDA" stroke-width="1.5"/>
    <text x="140" y="105" text-anchor="middle" font-size="13" font-weight="700" fill="#1E3A5F">ByteDance deer-flow</text>
    <text x="140" y="135" text-anchor="middle" font-size="11" fill="#B4451F" font-weight="600">silent lost update (L0)</text>
    <text x="140" y="165" text-anchor="middle" font-size="11" fill="#1E3A5F" font-weight="600">refined to verified L1</text>
    <text x="140" y="190" text-anchor="middle" font-size="10" fill="#3D4F65">atomic-write runtime</text>
  </g>

  <!-- Right: LangGraph case -->
  <g>
    <rect x="350" y="80" width="220" height="130" rx="10" fill="#EFF6FF" stroke="#4B8BDA" stroke-width="1.5"/>
    <text x="460" y="105" text-anchor="middle" font-size="13" font-weight="700" fill="#1E3A5F">LangGraph ToolNode</text>
    <text x="460" y="135" text-anchor="middle" font-size="11" fill="#B4451F" font-weight="600">tool-effect reorder (A6)</text>
    <text x="460" y="165" text-anchor="middle" font-size="11" fill="#1E3A5F" font-weight="600">fixed by L3 sequencer</text>
    <text x="460" y="190" text-anchor="middle" font-size="10" fill="#3D4F65">commit-order on io</text>
  </g>

  <!-- Ladder of consistency levels -->
  <g transform="translate(230,260)">
    <text x="70" y="0" text-anchor="middle" font-size="12" font-weight="700" fill="#1E3A5F">Consistency Hierarchy</text>

    <!-- ladder rails -->
    <line x1="35" y1="20" x2="35" y2="150" stroke="#1E3A5F" stroke-width="2"/>
    <line x1="105" y1="20" x2="105" y2="150" stroke="#1E3A5F" stroke-width="2"/>

    <!-- rungs with labels -->
    <line x1="35" y1="140" x2="105" y2="140" stroke="#3D4F65" stroke-width="1.5"/>
    <text x="115" y="144" font-size="10" fill="#3D4F65">L0  raw shared state</text>

    <line x1="35" y1="110" x2="105" y2="110" stroke="#3D4F65" stroke-width="1.5"/>
    <text x="115" y="114" font-size="10" fill="#1E3A5F" font-weight="700">L1  atomic write</text>

    <line x1="35" y1="80" x2="105" y2="80" stroke="#3D4F65" stroke-width="1.5"/>
    <text x="115" y="84" font-size="10" fill="#3D4F65">L2  read snapshot</text>

    <line x1="35" y1="50" x2="105" y2="50" stroke="#3D4F65" stroke-width="1.5"/>
    <text x="115" y="54" font-size="10" fill="#1E3A5F" font-weight="700">L3  commit order</text>

    <line x1="35" y1="25" x2="105" y2="25" stroke="#3D4F65" stroke-width="1.5"/>
    <text x="115" y="29" font-size="10" fill="#3D4F65">L4  serializable</text>

    <!-- climbing arrow -->
    <path d="M 20 140 Q 5 85 20 25" stroke="#4B8BDA" stroke-width="2" fill="none" marker-end="url(#ah)"/>
    <text x="-15" y="88" font-size="10" fill="#4B8BDA" font-weight="600">climb</text>
  </g>

  <!-- arrows from cases to ladder rungs -->
  <path d="M 180 210 Q 220 240 258 367" stroke="#4B8BDA" stroke-width="1.8" fill="none" marker-end="url(#ah)"/>
  <path d="M 430 210 Q 380 240 340 307" stroke="#4B8BDA" stroke-width="1.8" fill="none" marker-end="url(#ah)"/>
</svg>