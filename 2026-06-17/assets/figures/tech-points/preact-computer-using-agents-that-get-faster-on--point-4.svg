<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4B8BDA"/>
    </marker>
    <marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#C97B5E"/>
    </marker>
  </defs>

  <text x="300" y="36" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="18" font-weight="600" fill="#1E3A5F">Cache Miss → Fallback to Full Agent</text>

  <!-- Query -->
  <circle cx="70" cy="200" r="34" fill="#EFF6FF" stroke="#4B8BDA" stroke-width="2"/>
  <text x="70" y="205" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#1E3A5F">task</text>

  <!-- Cache shelf (empty) -->
  <rect x="200" y="140" width="200" height="120" rx="8" fill="#EFF6FF" stroke="#4B8BDA" stroke-width="2"/>
  <text x="300" y="130" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#3D4F65">program cache (empty)</text>
  <line x1="215" y1="180" x2="385" y2="180" stroke="#B8CDE5" stroke-width="1.5" stroke-dasharray="4 4"/>
  <line x1="215" y1="215" x2="385" y2="215" stroke="#B8CDE5" stroke-width="1.5" stroke-dasharray="4 4"/>
  <line x1="215" y1="245" x2="385" y2="245" stroke="#B8CDE5" stroke-width="1.5" stroke-dasharray="4 4"/>

  <!-- Fresh CUA fallback -->
  <rect x="440" y="265" width="140" height="80" rx="8" fill="#FBE9DD" stroke="#C97B5E" stroke-width="2"/>
  <text x="510" y="298" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#1E3A5F">fresh CUA</text>
  <text x="510" y="320" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#3D4F65">solve from scratch</text>

  <!-- arrow query -> cache -->
  <line x1="105" y1="195" x2="197" y2="180" stroke="#4B8BDA" stroke-width="2" marker-end="url(#a)"/>
  <text x="150" y="170" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#3D4F65">lookup</text>

  <!-- arrow cache -> fallback (miss) -->
  <path d="M 390 255 Q 430 285 438 295" fill="none" stroke="#C97B5E" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#r)"/>
  <text x="408" y="248" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#C97B5E" font-weight="600">miss</text>

  <!-- bottom note -->
  <text x="300" y="385" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#3D4F65">no program? do it the slow way — never worse than baseline</text>
</svg>