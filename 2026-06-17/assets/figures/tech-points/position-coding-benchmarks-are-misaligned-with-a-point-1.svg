<svg xmlns="http://www.w3.org/2000/svg" width="720" height="480" viewBox="0 0 720 480">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4B8BDA"/>
    </marker>
  </defs>

  <text x="360" y="40" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC','Hiragino Sans GB',sans-serif" font-size="20" font-weight="700" fill="#1E3A5F">同款模型，不同分数</text>
  <text x="360" y="64" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC','Hiragino Sans GB',sans-serif" font-size="13" fill="#3D4F65">Claude Opus 4.6 on TerminalBench</text>

  <!-- Left: same model -->
  <g>
    <circle cx="130" cy="245" r="64" fill="#EFF6FF" stroke="#4B8BDA" stroke-width="2"/>
    <text x="130" y="238" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC','Hiragino Sans GB',sans-serif" font-size="14" fill="#1E3A5F" font-weight="600">同一模型</text>
    <text x="130" y="260" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC','Hiragino Sans GB',sans-serif" font-size="12" fill="#3D4F65">Opus 4.6</text>
  </g>

  <!-- Top branch -->
  <path d="M188,215 C240,175 300,160 372,160" stroke="#4B8BDA" stroke-width="2" fill="none" marker-end="url(#ar)"/>
  <text x="270" y="150" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC','Hiragino Sans GB',sans-serif" font-size="12" fill="#3D4F65">脚手架 A</text>

  <!-- Bottom branch -->
  <path d="M188,275 C240,315 300,330 372,330" stroke="#4B8BDA" stroke-width="2" fill="none" marker-end="url(#ar)"/>
  <text x="270" y="348" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC','Hiragino Sans GB',sans-serif" font-size="12" fill="#3D4F65">脚手架 B</text>

  <!-- Top result -->
  <rect x="380" y="120" width="200" height="80" rx="8" fill="#FEF3E7" stroke="#E89B4C" stroke-width="2"/>
  <text x="480" y="148" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC','Hiragino Sans GB',sans-serif" font-size="13" fill="#1E3A5F">ForgeCode</text>
  <text x="480" y="182" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC','Hiragino Sans GB',sans-serif" font-size="26" font-weight="700" fill="#1E3A5F">79.8%</text>

  <!-- Bottom result -->
  <rect x="380" y="290" width="200" height="80" rx="8" fill="#EFF6FF" stroke="#4B8BDA" stroke-width="2"/>
  <text x="480" y="318" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC','Hiragino Sans GB',sans-serif" font-size="13" fill="#1E3A5F">Claude Code</text>
  <text x="480" y="352" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC','Hiragino Sans GB',sans-serif" font-size="26" font-weight="700" fill="#1E3A5F">58.0%</text>

  <!-- Gap bracket -->
  <path d="M610,160 L630,160 L630,330 L610,330" stroke="#C04848" stroke-width="2" fill="none"/>
  <text x="668" y="242" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC','Hiragino Sans GB',sans-serif" font-size="20" font-weight="700" fill="#C04848">Δ22%</text>

  <text x="360" y="438" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC','Hiragino Sans GB',sans-serif" font-size="13" fill="#3D4F65" font-style="italic">分数测的是脚手架，不是模型</text>
</svg>