<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 420" font-family="-apple-system,Segoe UI,sans-serif">
  <rect width="600" height="420" fill="#FAF7F2"/>
  
  <text x="300" y="38" text-anchor="middle" font-size="17" font-weight="600" fill="#1E3A5F">从纸上证明 → 机器可执行证明</text>
  
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4B8BDA"/>
    </marker>
    <marker id="arG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4F7A4A"/>
    </marker>
  </defs>
  
  <!-- Left: TLA+ spec -->
  <g>
    <rect x="50" y="100" width="160" height="180" rx="6" fill="#EFF6FF" stroke="#4B8BDA" stroke-width="1.5"/>
    <text x="130" y="130" text-anchor="middle" font-size="13" fill="#3D4F65">抽象规约</text>
    <text x="130" y="154" text-anchor="middle" font-size="15" font-weight="600" fill="#1E3A5F">TLA+ Spec</text>
    <line x1="75" y1="180" x2="185" y2="180" stroke="#4B8BDA" stroke-width="1" opacity="0.4"/>
    <line x1="75" y1="200" x2="170" y2="200" stroke="#4B8BDA" stroke-width="1" opacity="0.4"/>
    <line x1="75" y1="220" x2="185" y2="220" stroke="#4B8BDA" stroke-width="1" opacity="0.4"/>
    <text x="130" y="258" text-anchor="middle" font-size="11" fill="#3D4F65">A1–A4 异常谓词</text>
  </g>
  
  <!-- Verus engine middle -->
  <g>
    <circle cx="300" cy="190" r="50" fill="#FEF3E2" stroke="#D97706" stroke-width="2"/>
    <text x="300" y="186" text-anchor="middle" font-size="14" font-weight="600" fill="#1E3A5F">Verus</text>
    <text x="300" y="206" text-anchor="middle" font-size="11" fill="#3D4F65">refinement</text>
  </g>
  <text x="300" y="262" text-anchor="middle" font-size="11" fill="#D97706">274 条证明 · 0 assume / 0 admit</text>
  
  <!-- Right: Rust runtime -->
  <g>
    <rect x="390" y="100" width="160" height="180" rx="6" fill="#EFF6FF" stroke="#4B8BDA" stroke-width="1.5"/>
    <text x="470" y="130" text-anchor="middle" font-size="13" fill="#3D4F65">可运行实现</text>
    <text x="470" y="154" text-anchor="middle" font-size="15" font-weight="600" fill="#1E3A5F">Rust Runtime</text>
    <line x1="415" y1="180" x2="525" y2="180" stroke="#4B8BDA" stroke-width="1" opacity="0.4"/>
    <line x1="415" y1="200" x2="510" y2="200" stroke="#4B8BDA" stroke-width="1" opacity="0.4"/>
    <line x1="415" y1="220" x2="525" y2="220" stroke="#4B8BDA" stroke-width="1" opacity="0.4"/>
    <text x="470" y="258" text-anchor="middle" font-size="11" fill="#3D4F65">L0–L4 detector / runtime</text>
  </g>
  
  <!-- Arrows between three blocks -->
  <line x1="210" y1="190" x2="247" y2="190" stroke="#4B8BDA" stroke-width="2" marker-end="url(#ar)"/>
  <line x1="390" y1="190" x2="353" y2="190" stroke="#4B8BDA" stroke-width="2" marker-end="url(#ar)"/>
  
  <!-- Bottom result -->
  <g>
    <rect x="120" y="330" width="360" height="64" rx="6" fill="#E8F0E5" stroke="#4F7A4A" stroke-width="1.5"/>
    <text x="300" y="356" text-anchor="middle" font-size="13" font-weight="600" fill="#1E3A5F">机器验证：代码 ≡ 规约</text>
    <text x="300" y="378" text-anchor="middle" font-size="11" fill="#3D4F65">不漏报 · 不误报 · 所有可达状态无 A1–A4</text>
  </g>
  
  <line x1="300" y1="278" x2="300" y2="328" stroke="#4F7A4A" stroke-width="2" marker-end="url(#arG)"/>
</svg>