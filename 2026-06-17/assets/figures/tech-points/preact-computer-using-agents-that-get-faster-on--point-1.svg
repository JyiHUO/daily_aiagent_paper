<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 440">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4B8BDA"/>
    </marker>
  </defs>

  <text x="360" y="32" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="18" font-weight="700" fill="#1E3A5F">成功轨迹 → 状态机程序</text>

  <!-- Left: messy trajectory -->
  <g>
    <text x="130" y="68" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#3D4F65">首次执行：LLM 推理</text>
    <circle cx="60"  cy="130" r="13" fill="#FEF3E6" stroke="#D89B5B" stroke-width="1.5"/>
    <circle cx="130" cy="175" r="13" fill="#FEF3E6" stroke="#D89B5B" stroke-width="1.5"/>
    <circle cx="80"  cy="225" r="13" fill="#FEF3E6" stroke="#D89B5B" stroke-width="1.5"/>
    <circle cx="170" cy="275" r="13" fill="#FEF3E6" stroke="#D89B5B" stroke-width="1.5"/>
    <circle cx="100" cy="335" r="13" fill="#FEF3E6" stroke="#D89B5B" stroke-width="1.5"/>
    <path d="M60,130 Q100,150 130,175 Q105,200 80,225 Q140,250 170,275 Q120,305 100,335"
          fill="none" stroke="#D89B5B" stroke-width="1.5" stroke-dasharray="4 3"/>
    <text x="130" y="385" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#3D4F65" font-style="italic">看屏幕 · 思考 · 点击</text>
  </g>

  <!-- Compile arrow -->
  <line x1="225" y1="225" x2="345" y2="225" stroke="#4B8BDA" stroke-width="2.5" marker-end="url(#ar)"/>
  <text x="285" y="215" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#1E3A5F" font-weight="600">编译</text>

  <!-- Right: clean state machine -->
  <g>
    <text x="510" y="68" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#3D4F65">重放：可验证状态机</text>

    <!-- States -->
    <rect x="360" y="95" width="90" height="50" rx="6" fill="#EFF6FF" stroke="#4B8BDA" stroke-width="1.8"/>
    <text x="405" y="118" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#1E3A5F" font-weight="600">S1</text>
    <text x="405" y="135" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#3D4F65">✓ 屏幕校验</text>

    <rect x="570" y="95" width="90" height="50" rx="6" fill="#EFF6FF" stroke="#4B8BDA" stroke-width="1.8"/>
    <text x="615" y="118" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#1E3A5F" font-weight="600">S2</text>
    <text x="615" y="135" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#3D4F65">✓ 屏幕校验</text>

    <rect x="465" y="195" width="90" height="50" rx="6" fill="#EFF6FF" stroke="#4B8BDA" stroke-width="1.8"/>
    <text x="510" y="218" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#1E3A5F" font-weight="600">S3</text>
    <text x="510" y="235" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#3D4F65">✓ 屏幕校验</text>

    <!-- Transitions -->
    <line x1="450" y1="120" x2="568" y2="120" stroke="#4B8BDA" stroke-width="2" marker-end="url(#ar)"/>
    <text x="510" y="113" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#1E3A5F">click</text>

    <line x1="600" y1="148" x2="540" y2="195" stroke="#4B8BDA" stroke-width="2" marker-end="url(#ar)"/>
    <text x="600" y="180" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#1E3A5F">type {name}</text>

    <!-- Param slot -->
    <line x1="510" y1="245" x2="510" y2="283" stroke="#4B8BDA" stroke-width="1.8" stroke-dasharray="3 3" marker-end="url(#ar)"/>
    <rect x="360" y="290" width="300" height="64" rx="6" fill="#FFF8EC" stroke="#D89B5B" stroke-width="1.5" stroke-dasharray="5 3"/>
    <text x="510" y="312" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#1E3A5F" font-weight="600">参数槽 {name} · {phone}</text>
    <text x="510" y="335" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#3D4F65">下次绑新值即可复用同一程序</text>
  </g>

  <text x="360" y="420" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#3D4F65" font-style="italic">绕开 LLM 决策 · 每步先核对屏幕</text>
</svg>