<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 420" font-family="-apple-system,Segoe UI,sans-serif">
  <rect width="600" height="420" fill="#FAF7F2"/>

  <text x="300" y="38" text-anchor="middle" font-size="17" font-weight="600" fill="#1E3A5F">什么真正重要？</text>

  <defs>
    <marker id="ar" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M0,0 L9,5 L0,10 z" fill="#4B8BDA"/>
    </marker>
  </defs>

  <!-- Left: small tweaks pile (faded) -->
  <g opacity="0.55">
    <rect x="50" y="90" width="190" height="40" rx="6" fill="#EFF0F2" stroke="#B5BAC2"/>
    <text x="145" y="115" text-anchor="middle" font-size="12" fill="#6B7280">花式 Selector (LLM)</text>

    <rect x="50" y="142" width="190" height="40" rx="6" fill="#EFF0F2" stroke="#B5BAC2"/>
    <text x="145" y="167" text-anchor="middle" font-size="12" fill="#6B7280">PreAct 特调 prompt</text>

    <rect x="50" y="194" width="190" height="40" rx="6" fill="#EFF0F2" stroke="#B5BAC2"/>
    <text x="145" y="219" text-anchor="middle" font-size="12" fill="#6B7280">手写 runtime guardrail</text>
  </g>
  <text x="145" y="258" text-anchor="middle" font-size="11" fill="#8A8377" font-style="italic">这些其实都差不多</text>

  <!-- Arrow from faded to core -->
  <line x1="245" y1="162" x2="335" y2="178" stroke="#4B8BDA" stroke-width="2" marker-end="url(#ar)"/>
  <text x="290" y="150" text-anchor="middle" font-size="11" fill="#4B8BDA">关键在此</text>

  <!-- Right: the core, highlighted -->
  <rect x="340" y="95" width="220" height="180" rx="12" fill="#FFF4E0" stroke="#E8A33D" stroke-width="2.2"/>
  <text x="450" y="125" text-anchor="middle" font-size="13" font-weight="600" fill="#1E3A5F">真正起作用</text>

  <rect x="360" y="145" width="180" height="46" rx="6" fill="#FFFFFF" stroke="#E8A33D" stroke-width="1.5"/>
  <text x="450" y="173" text-anchor="middle" font-size="13" fill="#3D4F65">可验证状态机</text>

  <rect x="360" y="205" width="180" height="46" rx="6" fill="#FFFFFF" stroke="#E8A33D" stroke-width="1.5"/>
  <text x="450" y="233" text-anchor="middle" font-size="13" fill="#3D4F65">存前先验证</text>

  <!-- Bottom message -->
  <text x="300" y="340" text-anchor="middle" font-size="13" fill="#1E3A5F">与其调 prompt 措辞</text>
  <text x="300" y="362" text-anchor="middle" font-size="13" font-weight="600" fill="#C0651A">不如把校验与存储机制做对</text>
</svg>