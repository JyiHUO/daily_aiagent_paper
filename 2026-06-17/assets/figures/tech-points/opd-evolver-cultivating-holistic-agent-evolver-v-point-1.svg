<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 480">
  <defs>
    <marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#4B8BDA"/>
    </marker>
  </defs>

  <text x="300" y="38" text-anchor="middle" font-family="Helvetica" font-size="18" font-weight="bold" fill="#1E3A5F">Agent's Layered Notebook</text>

  <!-- Notebook: 4 stacked layers -->
  <g>
    <rect x="180" y="80" width="240" height="42" rx="4" fill="#EFF6FF" stroke="#4B8BDA" stroke-width="1.5"/>
    <text x="200" y="106" font-family="Helvetica" font-size="13" fill="#1E3A5F" font-weight="bold">Tool</text>
    <text x="410" y="106" text-anchor="end" font-family="Helvetica" font-size="11" fill="#3D4F65">executable templates</text>

    <rect x="180" y="128" width="240" height="42" rx="4" fill="#E0ECFB" stroke="#4B8BDA" stroke-width="1.5"/>
    <text x="200" y="154" font-family="Helvetica" font-size="13" fill="#1E3A5F" font-weight="bold">Skill</text>
    <text x="410" y="154" text-anchor="end" font-family="Helvetica" font-size="11" fill="#3D4F65">reusable procedures</text>

    <rect x="180" y="176" width="240" height="42" rx="4" fill="#D0E2F7" stroke="#4B8BDA" stroke-width="1.5"/>
    <text x="200" y="202" font-family="Helvetica" font-size="13" fill="#1E3A5F" font-weight="bold">Tip</text>
    <text x="410" y="202" text-anchor="end" font-family="Helvetica" font-size="11" fill="#3D4F65">small lessons</text>

    <rect x="180" y="224" width="240" height="42" rx="4" fill="#BFD4F0" stroke="#4B8BDA" stroke-width="1.5"/>
    <text x="200" y="250" font-family="Helvetica" font-size="13" fill="#1E3A5F" font-weight="bold">Trajectory</text>
    <text x="410" y="250" text-anchor="end" font-family="Helvetica" font-size="11" fill="#3D4F65">raw episodes</text>

    <text x="172" y="100" text-anchor="end" font-family="Helvetica" font-size="10" fill="#7A8AA0">abstract</text>
    <text x="172" y="252" text-anchor="end" font-family="Helvetica" font-size="10" fill="#7A8AA0">concrete</text>
  </g>

  <!-- Select (left top) -->
  <g>
    <circle cx="80" cy="120" r="38" fill="#FFF1E6" stroke="#E89B5C" stroke-width="1.8"/>
    <text x="80" y="118" text-anchor="middle" font-family="Helvetica" font-size="12" font-weight="bold" fill="#1E3A5F">Select</text>
    <text x="80" y="134" text-anchor="middle" font-family="Helvetica" font-size="10" fill="#3D4F65">pick note</text>
  </g>
  <path d="M118,128 L178,140" stroke="#4B8BDA" stroke-width="1.8" fill="none" marker-end="url(#a)"/>

  <!-- Execute (right top) -->
  <g>
    <circle cx="520" cy="120" r="38" fill="#FFF1E6" stroke="#E89B5C" stroke-width="1.8"/>
    <text x="520" y="118" text-anchor="middle" font-family="Helvetica" font-size="12" font-weight="bold" fill="#1E3A5F">Execute</text>
    <text x="520" y="134" text-anchor="middle" font-family="Helvetica" font-size="10" fill="#3D4F65">act on note</text>
  </g>
  <path d="M482,128 L422,140" stroke="#4B8BDA" stroke-width="1.8" fill="none" marker-end="url(#a)"/>

  <!-- Write (right bottom) -->
  <g>
    <circle cx="520" cy="240" r="38" fill="#FFF1E6" stroke="#E89B5C" stroke-width="1.8"/>
    <text x="520" y="238" text-anchor="middle" font-family="Helvetica" font-size="12" font-weight="bold" fill="#1E3A5F">Write</text>
    <text x="520" y="254" text-anchor="middle" font-family="Helvetica" font-size="10" fill="#3D4F65">add note</text>
  </g>
  <path d="M482,232 L422,220" stroke="#4B8BDA" stroke-width="1.8" fill="none" marker-end="url(#a)"/>

  <!-- Manage (left bottom) -->
  <g>
    <circle cx="80" cy="240" r="38" fill="#FFF1E6" stroke="#E89B5C" stroke-width="1.8"/>
    <text x="80" y="238" text-anchor="middle" font-family="Helvetica" font-size="12" font-weight="bold" fill="#1E3A5F">Manage</text>
    <text x="80" y="254" text-anchor="middle" font-family="Helvetica" font-size="10" fill="#3D4F65">tidy notes</text>
  </g>
  <path d="M118,232 L178,220" stroke="#4B8BDA" stroke-width="1.8" fill="none" marker-end="url(#a)"/>

  <!-- Loop arrows around the four capabilities to show one closed cycle -->
  <path d="M80,158 Q80,200 80,202" stroke="#E89B5C" stroke-width="1.4" fill="none" stroke-dasharray="3 3" marker-end="url(#a)"/>
  <path d="M520,202 Q520,200 520,200" stroke="#E89B5C" stroke-width="1.4" fill="none" stroke-dasharray="3 3"/>

  <!-- Bottom message -->
  <g>
    <rect x="100" y="340" width="400" height="90" rx="8" fill="#F5F8FC" stroke="#1E3A5F" stroke-width="1.2" stroke-dasharray="4 3"/>
    <text x="300" y="370" text-anchor="middle" font-family="Helvetica" font-size="13" font-weight="bold" fill="#1E3A5F">Four capabilities, one loop</text>
    <text x="300" y="400" text-anchor="middle" font-family="Helvetica" font-size="11" fill="#3D4F65">weakness in any one pollutes the whole memory life-cycle</text>
  </g>
</svg>