<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 460" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrUp" markerWidth="10" markerHeight="10" refX="5" refY="2" orient="auto">
      <path d="M0,8 L5,0 L10,8 Z" fill="#C97B5C"/>
    </marker>
    <marker id="arrUp2" markerWidth="10" markerHeight="10" refX="5" refY="2" orient="auto">
      <path d="M0,8 L5,0 L10,8 Z" fill="#4B8BDA"/>
    </marker>
  </defs>

  <rect width="800" height="460" fill="#FAF7F2"/>

  <text x="400" y="36" text-anchor="middle" font-size="19" font-weight="bold" fill="#1E3A5F">一致性层级：阶梯式权衡</text>
  <text x="400" y="58" text-anchor="middle" font-size="12" fill="#3D4F65">每登一级 → 多挡一种异常，多付一份代价</text>

  <!-- L0 -->
  <rect x="80" y="360" width="120" height="40" fill="#EFF6FF" stroke="#4B8BDA" stroke-width="1.5"/>
  <text x="140" y="380" text-anchor="middle" font-size="14" font-weight="bold" fill="#1E3A5F">L0 · 无保护</text>
  <text x="140" y="420" text-anchor="middle" font-size="11" fill="#3D4F65">基线</text>

  <!-- L1 -->
  <rect x="200" y="310" width="120" height="90" fill="#E0EDFB" stroke="#4B8BDA" stroke-width="1.5"/>
  <text x="260" y="335" text-anchor="middle" font-size="14" font-weight="bold" fill="#1E3A5F">L1 · +A1</text>
  <text x="260" y="355" text-anchor="middle" font-size="10" fill="#3D4F65">挡 stale-gen</text>
  <text x="260" y="420" text-anchor="middle" font-size="11" fill="#3D4F65">SSI / 悲观锁</text>

  <!-- L2 -->
  <rect x="320" y="250" width="120" height="150" fill="#C9DEF5" stroke="#4B8BDA" stroke-width="1.5"/>
  <text x="380" y="275" text-anchor="middle" font-size="14" font-weight="bold" fill="#1E3A5F">L2 · +A3</text>
  <text x="380" y="295" text-anchor="middle" font-size="10" fill="#3D4F65">挡级联污染</text>
  <text x="380" y="420" text-anchor="middle" font-size="11" fill="#3D4F65">因果追踪</text>

  <!-- L3 -->
  <rect x="440" y="190" width="120" height="210" fill="#A8C9EC" stroke="#4B8BDA" stroke-width="1.5"/>
  <text x="500" y="215" text-anchor="middle" font-size="14" font-weight="bold" fill="#1E3A5F">L3 · +A6</text>
  <text x="500" y="235" text-anchor="middle" font-size="10" fill="#3D4F65">+幻读防护</text>
  <text x="500" y="420" text-anchor="middle" font-size="11" fill="#3D4F65">谓词/范围保护</text>

  <!-- L4 -->
  <rect x="560" y="120" width="160" height="280" fill="#E8B89A" stroke="#C97B5C" stroke-width="1.5"/>
  <text x="640" y="145" text-anchor="middle" font-size="14" font-weight="bold" fill="#1E3A5F">L4 · 全部</text>
  <text x="640" y="165" text-anchor="middle" font-size="10" fill="#3D4F65">阻止 4 种异常</text>
  <text x="640" y="420" text-anchor="middle" font-size="11" fill="#3D4F65">最强 / 最贵</text>

  <!-- Cost arrow -->
  <line x1="755" y1="395" x2="755" y2="135" stroke="#C97B5C" stroke-width="2" marker-end="url(#arrUp)"/>
  <text x="772" y="265" font-size="11" fill="#C97B5C" transform="rotate(90 772 265)" text-anchor="middle">代价 ↑</text>

  <!-- Safety arrow -->
  <line x1="50" y1="395" x2="50" y2="135" stroke="#4B8BDA" stroke-width="2" marker-end="url(#arrUp2)"/>
  <text x="32" y="265" font-size="11" fill="#4B8BDA" transform="rotate(-90 32 265)" text-anchor="middle">安全 ↑</text>

  <text x="400" y="450" text-anchor="middle" font-size="11" fill="#3D4F65" font-style="italic">每一级都配套可运行 Rust runtime + 机器证明</text>
</svg>