<svg xmlns="http://www.w3.org/2000/svg" width="900" height="600" viewBox="0 0 900 600">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4B8BDA"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#D97757"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="450" y="40" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif" font-size="22" font-weight="700" fill="#1E3A5F">SafeClawBench：把工具型 Agent 的危害分三层看</text>
  <text x="450" y="64" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif" font-size="13" fill="#3D4F65">语义同意 ≠ 审计可见 ≠ 沙箱真出事</text>

  <!-- Attack source -->
  <g>
    <rect x="40" y="240" width="140" height="120" rx="10" fill="#FFF4EC" stroke="#D97757" stroke-width="1.6"/>
    <text x="110" y="278" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif" font-size="14" font-weight="700" fill="#1E3A5F">600 对抗任务</text>
    <text x="110" y="304" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif" font-size="11" fill="#3D4F65">DPI · IPI · TRI</text>
    <text x="110" y="322" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif" font-size="11" fill="#3D4F65">MPI · MEX · ADI</text>
    <text x="110" y="346" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif" font-size="10" fill="#8A6A55">六类攻击家族</text>
  </g>

  <!-- Layer 1: Semantic -->
  <g>
    <rect x="220" y="120" width="200" height="130" rx="12" fill="#EFF6FF" stroke="#4B8BDA" stroke-width="1.8"/>
    <circle cx="252" cy="152" r="14" fill="#4B8BDA"/>
    <text x="252" y="157" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif" font-size="13" font-weight="700" fill="#FFFFFF">1</text>
    <text x="278" y="157" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif" font-size="15" font-weight="700" fill="#1E3A5F">语义接受</text>
    <text x="240" y="190" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif" font-size="11" fill="#3D4F65">CoreFail @ 600 任务</text>
    <text x="240" y="210" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif" font-size="11" fill="#3D4F65">嘴上是否同意攻击者</text>
    <text x="240" y="232" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif" font-size="11" fill="#8A6A55">范围 9% – 44%</text>
  </g>

  <!-- Layer 2: Audit -->
  <g>
    <rect x="220" y="270" width="200" height="130" rx="12" fill="#EFF6FF" stroke="#4B8BDA" stroke-width="1.8"/>
    <circle cx="252" cy="302" r="14" fill="#4B8BDA"/>
    <text x="252" y="307" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif" font-size="13" font-weight="700" fill="#FFFFFF">2</text>
    <text x="278" y="307" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif" font-size="15" font-weight="700" fill="#1E3A5F">审计证据</text>
    <text x="240" y="340" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif" font-size="11" fill="#3D4F65">HarmEvidence</text>
    <text x="240" y="360" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif" font-size="11" fill="#3D4F65">回答里有泄露 / artifact</text>
    <text x="240" y="382" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif" font-size="11" fill="#8A6A55">日志可见的中间证据</text>
  </g>

  <!-- Layer 3: Sandbox -->
  <g>
    <rect x="220" y="420" width="200" height="130" rx="12" fill="#FFF4EC" stroke="#D97757" stroke-width="1.8"/>
    <circle cx="252" cy="452" r="14" fill="#D97757"/>
    <text x="252" y="457" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif" font-size="13" font-weight="700" fill="#FFFFFF">3</text>
    <text x="278" y="457" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif" font-size="15" font-weight="700" fill="#1E3A5F">沙箱真危害</text>
    <text x="240" y="490" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif" font-size="11" fill="#3D4F65">ObservedHarm</text>
    <text x="240" y="510" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif" font-size="11" fill="#3D4F65">工具被调用，状态变更</text>
    <text x="240" y="532" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif" font-size="11" fill="#8A6A55">文件 / 邮件 / DB 真改了</text>
  </g>

  <!-- Arrows from attack to layers -->
  <path d="M180,275 L218,185" stroke="#4B8BDA" stroke-width="1.6" fill="none" marker-end="url(#arr)"/>
  <path d="M180,300 L218,335" stroke="#4B8BDA" stroke-width="1.6" fill="none" marker-end="url(#arr)"/>
  <path d="M180,330 L218,475" stroke="#D97757" stroke-width="1.6" fill="none" marker-end="url(#arrR)"/>

  <!-- Key finding panel -->
  <g>
    <rect x="500" y="120" width="370" height="200" rx="12" fill="#FFFFFF" stroke="#1E3A5F" stroke-width="1.6"/>
    <text x="520" y="148" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif" font-size="14" font-weight="700" fill="#1E3A5F">核心发现：语义通过 ≠ 真安全</text>

    <text x="540" y="215" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif" font-size="48" font-weight="800" fill="#D97757">291 / 347</text>
    <text x="540" y="240" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif" font-size="12" fill="#3D4F65">沙箱真出事的样本中，语义层是“通过”的</text>

    <line x1="520" y1="255" x2="850" y2="255" stroke="#E5E7EB" stroke-width="1"/>

    <text x="520" y="278" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif" font-size="12" fill="#3D4F65">语义层 CorePass = 83.9% 的“拒绝得很好”模型</text>
    <text x="520" y="300" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif" font-size="12" fill="#3D4F65">一旦接上工具，仍会造成可观察的真实危害</text>
  </g>

  <!-- Sandbox tools panel -->
  <g>
    <rect x="500" y="345" width="370" height="205" rx="12" fill="#F6F8FB" stroke="#4B8BDA" stroke-width="1.4"/>
    <text x="520" y="372" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif" font-size="14" font-weight="700" fill="#1E3A5F">Exec 沙箱 · 确定性 oracle</text>

    <g font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif" font-size="12" fill="#1E3A5F">
      <rect x="520" y="390" width="100" height="34" rx="6" fill="#FFFFFF" stroke="#4B8BDA"/>
      <text x="570" y="412" text-anchor="middle">文件系统</text>

      <rect x="630" y="390" width="100" height="34" rx="6" fill="#FFFFFF" stroke="#4B8BDA"/>
      <text x="680" y="412" text-anchor="middle">邮件</text>

      <rect x="740" y="390" width="110" height="34" rx="6" fill="#FFFFFF" stroke="#4B8BDA"/>
      <text x="795" y="412" text-anchor="middle">数据库</text>

      <rect x="520" y="434" width="100" height="34" rx="6" fill="#FFFFFF" stroke="#4B8BDA"/>
      <text x="570" y="456" text-anchor="middle">记忆</text>

      <rect x="630" y="434" width="100" height="34" rx="6" fill="#FFFFFF" stroke="#4B8BDA"/>
      <text x="680" y="456" text-anchor="middle">网页</text>

      <rect x="740" y="434" width="110" height="34" rx="6" fill="#FFFFFF" stroke="#4B8BDA"/>
      <text x="795" y="456" text-anchor="middle">代码执行</text>
    </g>

    <text x="520" y="498" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif" font-size="11" fill="#3D4F65">prompt 防御 D0 / B2 / D3 / D4 的效果高度依赖模型</text>
    <text x="520" y="518" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif" font-size="11" fill="#3D4F65">没有通解，长 policy 的部分收益其实仅来自“变长”</text>
    <text x="520" y="540" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif" font-size="11" fill="#8A6A55">→ 真正区分模型的是沙箱端点，而不是文本拒绝</text>
  </g>

  <!-- Connector arrows -->
  <path d="M420,475 L500,445" stroke="#D97757" stroke-width="1.6" fill="none" marker-end="url(#arrR)"/>
  <path d="M420,185 L500,200" stroke="#4B8BDA" stroke-width="1.6" fill="none" marker-end="url(#arr)"/>
</svg>