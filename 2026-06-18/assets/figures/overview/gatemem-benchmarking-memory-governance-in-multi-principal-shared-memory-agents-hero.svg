<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" font-family="-apple-system, 'Helvetica Neue', 'PingFang SC', sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4B8BDA"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#D97757"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="400" y="42" text-anchor="middle" font-size="22" font-weight="700" fill="#1E3A5F">GateMem：多人共享记忆的治理闸门</text>
  <text x="400" y="64" text-anchor="middle" font-size="13" fill="#3D4F65">从「记得对不对」升级到「该不该说 · 该不该忘」</text>

  <!-- Left: principals -->
  <g>
    <text x="105" y="115" text-anchor="middle" font-size="13" font-weight="600" fill="#1E3A5F">多方读写者</text>
    <circle cx="55" cy="165" r="20" fill="#EFF6FF" stroke="#4B8BDA" stroke-width="1.5"/>
    <text x="55" y="169" text-anchor="middle" font-size="11" fill="#1E3A5F">医生</text>
    <circle cx="125" cy="210" r="20" fill="#EFF6FF" stroke="#4B8BDA" stroke-width="1.5"/>
    <text x="125" y="214" text-anchor="middle" font-size="11" fill="#1E3A5F">病人</text>
    <circle cx="55" cy="260" r="20" fill="#FBE9E0" stroke="#D97757" stroke-width="1.5"/>
    <text x="55" y="264" text-anchor="middle" font-size="11" fill="#8C3A1A">陌生人</text>
    <circle cx="125" cy="305" r="20" fill="#FBE9E0" stroke="#D97757" stroke-width="1.5"/>
    <text x="125" y="309" text-anchor="middle" font-size="11" fill="#8C3A1A">攻击者</text>

    <path d="M148,200 Q220,220 308,265" fill="none" stroke="#4B8BDA" stroke-width="1.8" marker-end="url(#arr)"/>
    <path d="M148,295 Q220,300 308,310" fill="none" stroke="#D97757" stroke-width="1.8" stroke-dasharray="4,3" marker-end="url(#arrR)"/>
  </g>

  <!-- Center: Gate (shield shape) -->
  <g transform="translate(400,310)">
    <path d="M0,-110 L90,-80 L90,30 Q90,90 0,120 Q-90,90 -90,30 L-90,-80 Z"
          fill="#EFF6FF" stroke="#1E3A5F" stroke-width="2"/>
    <text x="0" y="-78" text-anchor="middle" font-size="15" font-weight="700" fill="#1E3A5F">GateMem</text>
    <text x="0" y="-58" text-anchor="middle" font-size="11" fill="#3D4F65">共享记忆治理闸门</text>

    <!-- three pillars -->
    <rect x="-78" y="-38" width="50" height="62" rx="6" fill="#FFFFFF" stroke="#4B8BDA" stroke-width="1.3"/>
    <text x="-53" y="-20" text-anchor="middle" font-size="11" font-weight="600" fill="#1E3A5F">效用 U</text>
    <text x="-53" y="-2" text-anchor="middle" font-size="9" fill="#3D4F65">应答对</text>
    <text x="-53" y="14" text-anchor="middle" font-size="9" fill="#3D4F65">的比例</text>

    <rect x="-25" y="-38" width="50" height="62" rx="6" fill="#FFFFFF" stroke="#4B8BDA" stroke-width="1.3"/>
    <text x="0" y="-20" text-anchor="middle" font-size="11" font-weight="600" fill="#1E3A5F">访问 A</text>
    <text x="0" y="-2" text-anchor="middle" font-size="9" fill="#3D4F65">该拒</text>
    <text x="0" y="14" text-anchor="middle" font-size="9" fill="#3D4F65">没拒</text>

    <rect x="28" y="-38" width="50" height="62" rx="6" fill="#FFFFFF" stroke="#4B8BDA" stroke-width="1.3"/>
    <text x="53" y="-20" text-anchor="middle" font-size="11" font-weight="600" fill="#1E3A5F">遗忘 F</text>
    <text x="53" y="-2" text-anchor="middle" font-size="9" fill="#3D4F65">删了</text>
    <text x="53" y="14" text-anchor="middle" font-size="9" fill="#3D4F65">还说</text>

    <!-- formula -->
    <rect x="-90" y="48" width="180" height="36" rx="6" fill="#1E3A5F"/>
    <text x="0" y="71" text-anchor="middle" font-size="13" font-weight="600" fill="#FFFFFF">MGS = U · (1−A) · (1−F)</text>
  </g>

  <!-- Right: outcomes -->
  <g>
    <text x="695" y="115" text-anchor="middle" font-size="13" font-weight="600" fill="#1E3A5F">隐藏 checkpoint 判定</text>

    <rect x="555" y="135" width="220" height="48" rx="8" fill="#E8F1FB" stroke="#4B8BDA" stroke-width="1.3"/>
    <text x="566" y="155" font-size="11" font-weight="600" fill="#1E3A5F">✓ 授权问诊 → 应答</text>
    <text x="566" y="172" font-size="10" fill="#3D4F65">医生查用药列表</text>

    <rect x="555" y="200" width="220" height="48" rx="8" fill="#FBE9E0" stroke="#D97757" stroke-width="1.3"/>
    <text x="566" y="220" font-size="11" font-weight="600" fill="#8C3A1A">✗ 越权套问 → 应拒答</text>
    <text x="566" y="237" font-size="10" fill="#3D4F65">同名病人 / 是非题</text>

    <rect x="555" y="265" width="220" height="48" rx="8" fill="#FBE9E0" stroke="#D97757" stroke-width="1.3"/>
    <text x="566" y="285" font-size="11" font-weight="600" fill="#8C3A1A">✗ 删除后追问 → 应无记忆</text>
    <text x="566" y="302" font-size="10" fill="#3D4F65">侧面拼接 / 撤销冲突</text>

    <!-- arrows from gate to right boxes -->
    <path d="M492,275 Q525,200 555,159" fill="none" stroke="#4B8BDA" stroke-width="1.8" marker-end="url(#arr)"/>
    <path d="M492,310 Q525,260 555,224" fill="none" stroke="#D97757" stroke-width="1.8" marker-end="url(#arrR)"/>
    <path d="M492,345 Q525,320 555,289" fill="none" stroke="#D97757" stroke-width="1.8" marker-end="url(#arrR)"/>
  </g>

  <!-- Domain tag line -->
  <g>
    <text x="400" y="468" text-anchor="middle" font-size="11" fill="#3D4F65">医疗 · 办公 · 教育 · 家庭   |   91 episode · 平均 223 turn · 2218 checkpoint</text>
  </g>

  <!-- Bottom finding -->
  <g>
    <rect x="100" y="490" width="600" height="76" rx="10" fill="#FFFFFF" stroke="#1E3A5F" stroke-width="1.3"/>
    <text x="400" y="514" text-anchor="middle" font-size="12" font-weight="600" fill="#1E3A5F">长上下文最准但泄密 · 策略化 RAG 过度拒答 · 现有记忆系统未自动获得治理能力</text>
    <text x="400" y="538" text-anchor="middle" font-size="11" fill="#3D4F65">三维任一崩盘，总分即低</text>
    <text x="400" y="555" text-anchor="middle" font-size="11" fill="#3D4F65">治理能力不是组织好记忆，而是取出时判断该不该说</text>
  </g>
</svg>