<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4B8BDA"/>
    </marker>
  </defs>

  <text x="300" y="36" text-anchor="middle" font-family="Helvetica,Arial" font-size="17" font-weight="bold" fill="#1E3A5F">记忆治理：跷跷板困境</text>

  <!-- fulcrum -->
  <polygon points="300,300 270,340 330,340" fill="#C9B89A"/>
  <line x1="240" y1="340" x2="360" y2="340" stroke="#1E3A5F" stroke-width="2"/>

  <!-- seesaw bar tilted: left down (utility high), right up -->
  <line x1="100" y1="240" x2="500" y2="160" stroke="#1E3A5F" stroke-width="4" stroke-linecap="round"/>

  <!-- Left: Long-Context (heavy, leaks) -->
  <circle cx="120" cy="220" r="50" fill="#FCE4D6" stroke="#D97757" stroke-width="2"/>
  <text x="120" y="214" text-anchor="middle" font-family="Helvetica,Arial" font-size="12" font-weight="bold" fill="#1E3A5F">Long-Context</text>
  <text x="120" y="232" text-anchor="middle" font-family="Helvetica,Arial" font-size="11" fill="#D97757">高效用 / 泄密 20%+</text>

  <!-- Right: RAG-Policy (light, over-refuses) -->
  <circle cx="500" cy="170" r="48" fill="#EFF6FF" stroke="#4B8BDA" stroke-width="2"/>
  <text x="500" y="164" text-anchor="middle" font-family="Helvetica,Arial" font-size="12" font-weight="bold" fill="#1E3A5F">RAG-Policy</text>
  <text x="500" y="182" text-anchor="middle" font-family="Helvetica,Arial" font-size="11" fill="#4B8BDA">安全 / 过度拒答</text>

  <!-- Middle floating: specialized memory -->
  <rect x="230" y="86" width="140" height="48" rx="8" fill="#F5F0E6" stroke="#8B7355" stroke-width="1.5"/>
  <text x="300" y="106" text-anchor="middle" font-family="Helvetica,Arial" font-size="12" font-weight="bold" fill="#1E3A5F">Mem0 / A-Mem / ReMeM</text>
  <text x="300" y="123" text-anchor="middle" font-family="Helvetica,Arial" font-size="11" fill="#3D4F65">两头都不占</text>

  <!-- arrow pointing down to seesaw bar -->
  <line x1="300" y1="134" x2="300" y2="196" stroke="#4B8BDA" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#a)"/>

  <!-- bottom conclusion -->
  <text x="300" y="380" text-anchor="middle" font-family="Helvetica,Arial" font-size="12" font-style="italic" fill="#1E3A5F">没有方案同时通过 MGS 三项考核（效用 / 访问控制 / 删除遗忘）</text>
</svg>