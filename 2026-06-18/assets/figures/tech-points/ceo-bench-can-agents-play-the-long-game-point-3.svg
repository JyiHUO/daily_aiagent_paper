<svg width="720" height="480" viewBox="0 0 720 480" xmlns="http://www.w3.org/2000/svg">
  <rect width="720" height="480" fill="#FAFBFC"/>
  
  <text x="360" y="42" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC','Hiragino Sans GB',sans-serif" font-size="20" font-weight="bold" fill="#1E3A5F">代码即动作空间</text>
  <text x="360" y="66" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC','Hiragino Sans GB',sans-serif" font-size="13" fill="#3D4F65">Python 脚本 vs 预定义工具调用</text>

  <!-- 左侧：弱模型 -->
  <g>
    <rect x="60" y="110" width="240" height="300" rx="10" fill="#FFF4E6" stroke="#E8A87C" stroke-width="1.5"/>
    <text x="180" y="140" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC','Hiragino Sans GB',sans-serif" font-size="15" font-weight="bold" fill="#1E3A5F">固定工具调用</text>
    
    <circle cx="105" cy="200" r="14" fill="#E8A87C" opacity="0.6"/>
    <circle cx="155" cy="200" r="14" fill="#E8A87C" opacity="0.6"/>
    <circle cx="205" cy="200" r="14" fill="#E8A87C" opacity="0.6"/>
    <circle cx="255" cy="200" r="14" fill="#E8A87C" opacity="0.6"/>
    <text x="180" y="240" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC','Hiragino Sans GB',sans-serif" font-size="12" fill="#3D4F65">单点重复调用</text>
    
    <line x1="90" y1="280" x2="270" y2="280" stroke="#E8A87C" stroke-width="1" stroke-dasharray="4,3"/>
    
    <text x="180" y="320" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC','Hiragino Sans GB',sans-serif" font-size="13" fill="#3D4F65">弱模型：无编排能力</text>
    <text x="180" y="385" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC','Hiragino Sans GB',sans-serif" font-size="22">😐</text>
  </g>

  <!-- 中间 vs -->
  <text x="360" y="265" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC','Hiragino Sans GB',sans-serif" font-size="18" font-weight="bold" fill="#4B8BDA">vs</text>

  <!-- 右侧：强模型 -->
  <g>
    <rect x="420" y="110" width="240" height="300" rx="10" fill="#EFF6FF" stroke="#4B8BDA" stroke-width="1.5"/>
    <text x="540" y="140" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC','Hiragino Sans GB',sans-serif" font-size="15" font-weight="bold" fill="#1E3A5F">脚本编排工作流</text>
    
    <rect x="445" y="165" width="190" height="105" rx="6" fill="#FFFFFF" stroke="#4B8BDA" stroke-width="1"/>
    <text x="455" y="186" font-family="'Courier New',monospace" font-size="11" fill="#4B8BDA">SQL -&gt; 聚合</text>
    <text x="455" y="206" font-family="'Courier New',monospace" font-size="11" fill="#4B8BDA">for c in groups:</text>
    <text x="455" y="226" font-family="'Courier New',monospace" font-size="11" fill="#4B8BDA">  simulate(c)</text>
    <text x="455" y="246" font-family="'Courier New',monospace" font-size="11" fill="#4B8BDA">price[c]=infer()</text>
    <text x="455" y="262" font-family="'Courier New',monospace" font-size="10" fill="#88A0BC">(SQL + 模拟 + 推断)</text>
    
    <text x="540" y="320" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC','Hiragino Sans GB',sans-serif" font-size="13" fill="#3D4F65">分析与执行串联，推断隐藏信息</text>
    <text x="540" y="385" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC','Hiragino Sans GB',sans-serif" font-size="22">🧠</text>
  </g>

  <text x="360" y="450" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC','Hiragino Sans GB',sans-serif" font-size="12" fill="#3D4F65">34 工具 · 19 业务表 · 自由组合</text>
</svg>