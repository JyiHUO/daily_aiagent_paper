<svg xmlns="http://www.w3.org/2000/svg" width="720" height="480" viewBox="0 0 720 480">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4B8BDA"/>
    </marker>
    <marker id="arO" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#C97A5C"/>
    </marker>
  </defs>

  <text x="360" y="38" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC','Hiragino Sans GB',sans-serif" font-size="20" font-weight="700" fill="#1E3A5F">机制化的难世界</text>
  <text x="360" y="60" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC','Hiragino Sans GB',sans-serif" font-size="12" fill="#3D4F65">话术哄不动，必须懂因果</text>

  <!-- LEFT: Agent -->
  <circle cx="100" cy="260" r="50" fill="#EFF6FF" stroke="#4B8BDA" stroke-width="2"/>
  <text x="100" y="255" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC','Hiragino Sans GB',sans-serif" font-size="15" font-weight="600" fill="#1E3A5F">Agent</text>
  <text x="100" y="275" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC','Hiragino Sans GB',sans-serif" font-size="11" fill="#3D4F65">决策</text>

  <!-- CENTER: Black Box World -->
  <rect x="220" y="120" width="280" height="280" rx="8" fill="#FFF4EC" stroke="#C97A5C" stroke-width="2"/>
  <text x="360" y="148" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC','Hiragino Sans GB',sans-serif" font-size="14" font-weight="700" fill="#1E3A5F">隐藏机制世界</text>

  <!-- inside: customer dots -->
  <g fill="#C97A5C" opacity="0.7">
    <circle cx="260" cy="185" r="5"/><circle cx="288" cy="180" r="5"/><circle cx="316" cy="190" r="5"/>
    <circle cx="344" cy="178" r="5"/><circle cx="372" cy="188" r="5"/><circle cx="400" cy="182" r="5"/>
    <circle cx="428" cy="190" r="5"/><circle cx="456" cy="185" r="5"/>
    <circle cx="270" cy="215" r="5"/><circle cx="298" cy="210" r="5"/><circle cx="328" cy="218" r="5"/>
    <circle cx="358" cy="212" r="5"/><circle cx="388" cy="220" r="5"/><circle cx="418" cy="215" r="5"/>
    <circle cx="446" cy="218" r="5"/>
  </g>
  <text x="360" y="252" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC','Hiragino Sans GB',sans-serif" font-size="11" fill="#3D4F65">26 客户群 · 群间相互影响</text>

  <!-- divider -->
  <line x1="250" y1="275" x2="470" y2="275" stroke="#C97A5C" stroke-width="1" stroke-dasharray="3,3"/>

  <text x="360" y="300" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC','Hiragino Sans GB',sans-serif" font-size="12" fill="#1E3A5F">微观经济公式 + 随机分布</text>
  <text x="360" y="322" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC','Hiragino Sans GB',sans-serif" font-size="12" fill="#1E3A5F">非平稳演化 · 延迟反馈</text>
  <text x="360" y="356" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC','Hiragino Sans GB',sans-serif" font-size="11" fill="#3D4F65">满意度 / 支付意愿对 Agent 隐藏</text>

  <!-- RIGHT: Indirect signals -->
  <rect x="560" y="160" width="120" height="36" rx="6" fill="#EFF6FF" stroke="#4B8BDA" stroke-width="1.5"/>
  <text x="620" y="183" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC','Hiragino Sans GB',sans-serif" font-size="12" fill="#1E3A5F">数据库</text>

  <rect x="560" y="240" width="120" height="36" rx="6" fill="#EFF6FF" stroke="#4B8BDA" stroke-width="1.5"/>
  <text x="620" y="263" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC','Hiragino Sans GB',sans-serif" font-size="12" fill="#1E3A5F">社媒口碑</text>

  <rect x="560" y="320" width="120" height="36" rx="6" fill="#EFF6FF" stroke="#4B8BDA" stroke-width="1.5"/>
  <text x="620" y="343" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC','Hiragino Sans GB',sans-serif" font-size="12" fill="#1E3A5F">谈判记录</text>

  <!-- arrow: Agent -> world (action) -->
  <path d="M 150 245 L 218 215" stroke="#4B8BDA" stroke-width="2" fill="none" marker-end="url(#ar)"/>
  <text x="158" y="232" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC','Hiragino Sans GB',sans-serif" font-size="11" fill="#1E3A5F">动作</text>

  <!-- arrows: world -> signals (leak) -->
  <path d="M 502 178 L 558 178" stroke="#C97A5C" stroke-width="2" fill="none" marker-end="url(#arO)"/>
  <path d="M 502 258 L 558 258" stroke="#C97A5C" stroke-width="2" fill="none" marker-end="url(#arO)"/>
  <path d="M 502 338 L 558 338" stroke="#C97A5C" stroke-width="2" fill="none" marker-end="url(#arO)"/>

  <!-- signals back to agent (closed loop) -->
  <path d="M 560 338 Q 330 450 100 315" stroke="#4B8BDA" stroke-width="2" fill="none" stroke-dasharray="5,4" marker-end="url(#ar)"/>
  <text x="340" y="445" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC','Hiragino Sans GB',sans-serif" font-size="11" fill="#3D4F65">只能从间接信号反推真相</text>
</svg>