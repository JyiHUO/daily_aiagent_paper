<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 420" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4B8BDA"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="300" y="36" text-anchor="middle" font-size="18" font-weight="bold" fill="#1E3A5F">Memory Governance Score</text>
  <text x="300" y="58" text-anchor="middle" font-size="12" fill="#3D4F65">三维联合评测 · 任何一维崩了，总分即崩</text>

  <!-- Utility -->
  <g>
    <rect x="55" y="90" width="140" height="130" rx="10" fill="#EFF6FF" stroke="#4B8BDA" stroke-width="2"/>
    <text x="125" y="118" text-anchor="middle" font-size="14" font-weight="bold" fill="#1E3A5F">Utility</text>
    <text x="125" y="138" text-anchor="middle" font-size="11" fill="#3D4F65">该说的 · 授权可答</text>
    <path d="M95 158 h60 a6 6 0 0 1 6 6 v20 a6 6 0 0 1 -6 6 h-40 l-10 10 v-10 h-10 a6 6 0 0 1 -6 -6 v-20 a6 6 0 0 1 6 -6 z" fill="#ffffff" stroke="#4B8BDA" stroke-width="1.8"/>
    <text x="125" y="184" text-anchor="middle" font-size="11" fill="#1E3A5F">✓ answer</text>
  </g>

  <!-- Access Control -->
  <g>
    <rect x="230" y="90" width="140" height="130" rx="10" fill="#FFF4EC" stroke="#E68A4E" stroke-width="2"/>
    <text x="300" y="118" text-anchor="middle" font-size="14" font-weight="bold" fill="#1E3A5F">Access Control</text>
    <text x="300" y="138" text-anchor="middle" font-size="11" fill="#3D4F65">不该给的 · 拒绝/脱敏</text>
    <path d="M300 158 l-22 8 v18 c0 14 10 22 22 28 c12 -6 22 -14 22 -28 v-18 z" fill="#ffffff" stroke="#E68A4E" stroke-width="1.8"/>
    <text x="300" y="190" text-anchor="middle" font-size="11" fill="#1E3A5F">✗ refuse</text>
  </g>

  <!-- Active Forgetting -->
  <g>
    <rect x="405" y="90" width="140" height="130" rx="10" fill="#F4EEFB" stroke="#8A6BBF" stroke-width="2"/>
    <text x="475" y="118" text-anchor="middle" font-size="14" font-weight="bold" fill="#1E3A5F">Forgetting</text>
    <text x="475" y="138" text-anchor="middle" font-size="11" fill="#3D4F65">该忘的 · 删后不复现</text>
    <path d="M457 160 h36 l-3 32 h-30 z" fill="#ffffff" stroke="#8A6BBF" stroke-width="1.8"/>
    <line x1="452" y1="160" x2="498" y2="160" stroke="#8A6BBF" stroke-width="1.8"/>
    <text x="475" y="184" text-anchor="middle" font-size="11" fill="#1E3A5F">∅ no-memory</text>
  </g>

  <!-- Multiplication -->
  <text x="212" y="160" text-anchor="middle" font-size="22" font-weight="bold" fill="#4B8BDA">×</text>
  <text x="387" y="160" text-anchor="middle" font-size="22" font-weight="bold" fill="#4B8BDA">×</text>

  <!-- Arrows down to MGS -->
  <line x1="125" y1="220" x2="240" y2="316" stroke="#4B8BDA" stroke-width="1.8" stroke-dasharray="4,3" marker-end="url(#arr)"/>
  <line x1="300" y1="220" x2="300" y2="316" stroke="#4B8BDA" stroke-width="1.8" stroke-dasharray="4,3" marker-end="url(#arr)"/>
  <line x1="475" y1="220" x2="360" y2="316" stroke="#4B8BDA" stroke-width="1.8" stroke-dasharray="4,3" marker-end="url(#arr)"/>

  <!-- MGS formula box -->
  <rect x="170" y="320" width="260" height="68" rx="34" fill="#1E3A5F"/>
  <text x="300" y="348" text-anchor="middle" font-size="15" font-weight="bold" fill="#EFF6FF">MGS = U · (1−A) · (1−F)</text>
  <text x="300" y="370" text-anchor="middle" font-size="11" fill="#A8C4E6">乘法门控 · 一维归零则全归零</text>
</svg>