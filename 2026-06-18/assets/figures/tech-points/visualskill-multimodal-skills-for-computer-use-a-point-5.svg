<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 420">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4B8BDA"/>
    </marker>
  </defs>

  <text x="300" y="38" text-anchor="middle" font-family="Helvetica,Arial" font-size="18" font-weight="bold" fill="#1E3A5F">同源技能 · 双版本对照</text>
  <text x="300" y="60" text-anchor="middle" font-family="Helvetica,Arial" font-size="12" fill="#3D4F65">同一次 LLM 生成，仅差一张截图</text>

  <!-- Text-only skill card -->
  <rect x="70" y="100" width="190" height="200" rx="8" fill="#FEF3E8" stroke="#D9A066" stroke-width="1.5"/>
  <text x="165" y="125" text-anchor="middle" font-family="Helvetica,Arial" font-size="13" font-weight="bold" fill="#1E3A5F">纯文本技能 S_txt</text>
  <line x1="90" y1="150" x2="240" y2="150" stroke="#3D4F65" stroke-width="1"/>
  <line x1="90" y1="165" x2="240" y2="165" stroke="#3D4F65" stroke-width="1"/>
  <line x1="90" y1="180" x2="220" y2="180" stroke="#3D4F65" stroke-width="1"/>
  <line x1="90" y1="205" x2="240" y2="205" stroke="#3D4F65" stroke-width="1"/>
  <line x1="90" y1="220" x2="240" y2="220" stroke="#3D4F65" stroke-width="1"/>
  <line x1="90" y1="235" x2="210" y2="235" stroke="#3D4F65" stroke-width="1"/>
  <text x="165" y="278" text-anchor="middle" font-family="Helvetica,Arial" font-size="22" font-weight="bold" fill="#B8732E">37.3</text>

  <!-- Multimodal skill card -->
  <rect x="340" y="100" width="190" height="200" rx="8" fill="#EFF6FF" stroke="#4B8BDA" stroke-width="1.5"/>
  <text x="435" y="125" text-anchor="middle" font-family="Helvetica,Arial" font-size="13" font-weight="bold" fill="#1E3A5F">多模态技能 S_mm</text>
  <line x1="360" y1="150" x2="510" y2="150" stroke="#3D4F65" stroke-width="1"/>
  <line x1="360" y1="165" x2="490" y2="165" stroke="#3D4F65" stroke-width="1"/>
  <!-- screenshot icon -->
  <rect x="370" y="180" width="130" height="55" rx="3" fill="#FFFFFF" stroke="#4B8BDA" stroke-width="1.5"/>
  <circle cx="388" cy="195" r="4" fill="#D9A066"/>
  <path d="M375 230 L400 210 L420 220 L445 200 L495 230 Z" fill="#A8C7E8"/>
  <line x1="360" y1="252" x2="510" y2="252" stroke="#3D4F65" stroke-width="1"/>
  <text x="435" y="278" text-anchor="middle" font-family="Helvetica,Arial" font-size="22" font-weight="bold" fill="#1E5FAA">45.6</text>

  <!-- Delta arrow -->
  <line x1="265" y1="200" x2="335" y2="200" stroke="#4B8BDA" stroke-width="2.5" marker-end="url(#arr)"/>
  <text x="300" y="190" text-anchor="middle" font-family="Helvetica,Arial" font-size="14" font-weight="bold" fill="#1E5FAA">+8.3</text>
  <text x="300" y="220" text-anchor="middle" font-family="Helvetica,Arial" font-size="10" fill="#3D4F65">仅加入截图</text>

  <!-- Conclusion -->
  <text x="300" y="358" text-anchor="middle" font-family="Helvetica,Arial" font-size="13" fill="#1E3A5F">内容等价，差距来自图像本身的视觉信息</text>
</svg>