<svg xmlns="http://www.w3.org/2000/svg" width="720" height="480" viewBox="0 0 720 480">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4B8BDA"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#D97757"/>
    </marker>
  </defs>

  <text x="360" y="40" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC','Hiragino Sans GB',sans-serif" font-size="20" font-weight="700" fill="#1E3A5F">合谋成败 = 谁能爬起来</text>
  <text x="360" y="64" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC','Hiragino Sans GB',sans-serif" font-size="13" fill="#3D4F65">recovery rate decides sabotage</text>

  <!-- Left: Gemini lane -->
  <g>
    <rect x="50" y="110" width="280" height="320" rx="14" fill="#EFF6FF" stroke="#4B8BDA" stroke-width="1.5"/>
    <text x="190" y="140" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC','Hiragino Sans GB',sans-serif" font-size="16" font-weight="700" fill="#1E3A5F">Gemini 3.1 · 恢复率 73%</text>

    <!-- plan -->
    <circle cx="120" cy="230" r="34" fill="#FFFFFF" stroke="#4B8BDA" stroke-width="2"/>
    <text x="120" y="234" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC','Hiragino Sans GB',sans-serif" font-size="13" fill="#1E3A5F">计划</text>

    <!-- detect -->
    <circle cx="260" cy="230" r="34" fill="#FFFFFF" stroke="#4B8BDA" stroke-width="2"/>
    <text x="260" y="226" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC','Hiragino Sans GB',sans-serif" font-size="13" fill="#1E3A5F">察觉偏差</text>
    <text x="260" y="244" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC','Hiragino Sans GB',sans-serif" font-size="13" fill="#1E3A5F">→ 修正</text>

    <path d="M154 230 L 224 230" stroke="#4B8BDA" stroke-width="2" marker-end="url(#arr)"/>

    <!-- loop back -->
    <path d="M260 264 Q 260 330 190 330 Q 120 330 120 264" fill="none" stroke="#4B8BDA" stroke-width="2" marker-end="url(#arr)"/>
    <text x="190" y="356" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC','Hiragino Sans GB',sans-serif" font-size="12" fill="#3D4F65">回头对齐 · 闭环反馈</text>

    <text x="190" y="404" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC','Hiragino Sans GB',sans-serif" font-size="15" font-weight="700" fill="#1E3A5F">联合通过 84%</text>
  </g>

  <!-- Right: Codex lane -->
  <g>
    <rect x="390" y="110" width="280" height="320" rx="14" fill="#FDF2EC" stroke="#D97757" stroke-width="1.5"/>
    <text x="530" y="140" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC','Hiragino Sans GB',sans-serif" font-size="16" font-weight="700" fill="#1E3A5F">GPT 5.1 Codex · 恢复率 56%</text>

    <circle cx="450" cy="230" r="34" fill="#FFFFFF" stroke="#D97757" stroke-width="2"/>
    <text x="450" y="234" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC','Hiragino Sans GB',sans-serif" font-size="13" fill="#1E3A5F">计划</text>

    <circle cx="590" cy="230" r="34" fill="#FFFFFF" stroke="#D97757" stroke-width="2"/>
    <text x="590" y="226" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC','Hiragino Sans GB',sans-serif" font-size="13" fill="#1E3A5F">察觉偏差</text>
    <text x="590" y="244" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC','Hiragino Sans GB',sans-serif" font-size="13" fill="#1E3A5F">× 不修</text>

    <path d="M484 230 L 554 230" stroke="#D97757" stroke-width="2" marker-end="url(#arrR)"/>

    <!-- straight ahead, crash -->
    <path d="M624 230 L 638 230" stroke="#D97757" stroke-width="2"/>
    <line x1="635" y1="218" x2="655" y2="242" stroke="#D97757" stroke-width="2.5"/>
    <line x1="655" y1="218" x2="635" y2="242" stroke="#D97757" stroke-width="2.5"/>

    <text x="530" y="356" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC','Hiragino Sans GB',sans-serif" font-size="12" fill="#3D4F65">一条道走到黑 · 主任务 fail</text>

    <text x="530" y="404" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC','Hiragino Sans GB',sans-serif" font-size="15" font-weight="700" fill="#1E3A5F">联合通过 46%</text>
  </g>

  <text x="360" y="458" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC','Hiragino Sans GB',sans-serif" font-size="12" fill="#3D4F65">差距来自自我验证 + 回环反馈，而非初始 planning</text>
</svg>