<svg xmlns="http://www.w3.org/2000/svg" width="720" height="480" viewBox="0 0 720 480">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4B8BDA"/>
    </marker>
    <marker id="arRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#C97064"/>
    </marker>
  </defs>

  <text x="360" y="40" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC','Hiragino Sans GB',sans-serif" font-size="20" font-weight="600" fill="#1E3A5F">证据驱动的两阶段过滤</text>

  <!-- Stage 1: raw extraction -->
  <rect x="50" y="170" width="160" height="120" rx="10" fill="#EFF6FF" stroke="#4B8BDA" stroke-width="1.8"/>
  <text x="130" y="200" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC','Hiragino Sans GB',sans-serif" font-size="14" fill="#3D4F65">LLM 初抽</text>
  <text x="130" y="240" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC','Hiragino Sans GB',sans-serif" font-size="22" font-weight="700" fill="#1E3A5F">29,896</text>
  <text x="130" y="270" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC','Hiragino Sans GB',sans-serif" font-size="11" fill="#3D4F65">候选 episodes（主观判断）</text>

  <!-- Filter -->
  <rect x="280" y="160" width="160" height="130" rx="10" fill="#FFF4E6" stroke="#E5A04C" stroke-width="1.8"/>
  <text x="360" y="190" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC','Hiragino Sans GB',sans-serif" font-size="14" font-weight="600" fill="#1E3A5F">证据校验</text>
  <text x="360" y="212" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC','Hiragino Sans GB',sans-serif" font-size="11" fill="#3D4F65">必须引用用户原话</text>
  <line x1="298" y1="240" x2="422" y2="240" stroke="#E5A04C" stroke-width="1.4" stroke-dasharray="4,3"/>
  <text x="360" y="265" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC','Hiragino Sans GB',sans-serif" font-size="11" fill="#8B6A3E">pushback 证据筛网</text>

  <!-- Stage 2: kept -->
  <rect x="510" y="170" width="160" height="120" rx="10" fill="#E8F1E8" stroke="#5B9367" stroke-width="1.8"/>
  <text x="590" y="200" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC','Hiragino Sans GB',sans-serif" font-size="14" fill="#3D4F65">保留（证据支撑）</text>
  <text x="590" y="240" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC','Hiragino Sans GB',sans-serif" font-size="22" font-weight="700" fill="#1E3A5F">16,118</text>
  <text x="590" y="270" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC','Hiragino Sans GB',sans-serif" font-size="11" fill="#3D4F65">precision 0.93</text>

  <!-- arrows main flow -->
  <line x1="212" y1="225" x2="276" y2="225" stroke="#4B8BDA" stroke-width="2" marker-end="url(#ar)"/>
  <line x1="442" y1="225" x2="506" y2="225" stroke="#4B8BDA" stroke-width="2" marker-end="url(#ar)"/>

  <!-- discarded -->
  <line x1="360" y1="292" x2="360" y2="368" stroke="#C97064" stroke-width="1.8" marker-end="url(#arRed)"/>
  <rect x="220" y="375" width="280" height="75" rx="8" fill="#FBEDEA" stroke="#C97064" stroke-width="1.5"/>
  <text x="360" y="400" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC','Hiragino Sans GB',sans-serif" font-size="13" font-weight="600" fill="#8C3F35">剔除两类误报</text>
  <text x="360" y="422" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC','Hiragino Sans GB',sans-serif" font-size="11" fill="#3D4F65">规范偏见 · 盲点归因</text>
  <text x="360" y="440" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC','Hiragino Sans GB',sans-serif" font-size="10" fill="#8C3F35">(用户其实没抱怨)</text>
</svg>