<svg xmlns="http://www.w3.org/2000/svg" width="720" height="480" viewBox="0 0 720 480">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4B8BDA"/>
    </marker>
  </defs>

  <text x="360" y="40" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC','Hiragino Sans GB',sans-serif" font-size="20" font-weight="bold" fill="#1E3A5F">三类记忆范式</text>

  <!-- Long context -->
  <rect x="50" y="90" width="180" height="220" rx="10" fill="#EFF6FF" stroke="#4B8BDA" stroke-width="1.5"/>
  <text x="140" y="125" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC','Hiragino Sans GB',sans-serif" font-size="15" font-weight="bold" fill="#1E3A5F">长上下文</text>
  <rect x="95" y="160" width="90" height="14" fill="#BFD7F2" stroke="#4B8BDA"/>
  <rect x="95" y="178" width="90" height="14" fill="#BFD7F2" stroke="#4B8BDA"/>
  <rect x="95" y="196" width="90" height="14" fill="#BFD7F2" stroke="#4B8BDA"/>
  <rect x="95" y="214" width="90" height="14" fill="#BFD7F2" stroke="#4B8BDA"/>
  <rect x="95" y="232" width="90" height="14" fill="#BFD7F2" stroke="#4B8BDA"/>
  <text x="140" y="282" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC','Hiragino Sans GB',sans-serif" font-size="12" fill="#3D4F65">全部塞入 prompt</text>

  <!-- Designed memory -->
  <rect x="270" y="90" width="180" height="220" rx="10" fill="#FEF3E7" stroke="#E8985A" stroke-width="1.5"/>
  <text x="360" y="125" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC','Hiragino Sans GB',sans-serif" font-size="15" font-weight="bold" fill="#1E3A5F">人工记忆</text>
  <rect x="305" y="155" width="110" height="100" fill="#FAE0BF" stroke="#E8985A"/>
  <line x1="305" y1="180" x2="415" y2="180" stroke="#E8985A"/>
  <line x1="305" y1="205" x2="415" y2="205" stroke="#E8985A"/>
  <line x1="305" y1="230" x2="415" y2="230" stroke="#E8985A"/>
  <circle cx="395" cy="167" r="2.5" fill="#1E3A5F"/>
  <circle cx="395" cy="192" r="2.5" fill="#1E3A5F"/>
  <circle cx="395" cy="217" r="2.5" fill="#1E3A5F"/>
  <circle cx="395" cy="242" r="2.5" fill="#1E3A5F"/>
  <text x="360" y="282" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC','Hiragino Sans GB',sans-serif" font-size="12" fill="#3D4F65">RAG / Mem0 固定流程</text>

  <!-- Harness self-managed -->
  <rect x="490" y="90" width="180" height="220" rx="10" fill="#F0EAFB" stroke="#8B6FBF" stroke-width="1.5"/>
  <text x="580" y="125" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC','Hiragino Sans GB',sans-serif" font-size="15" font-weight="bold" fill="#1E3A5F">Harness 自管</text>
  <rect x="520" y="165" width="90" height="80" fill="#DCD0F0" stroke="#8B6FBF"/>
  <line x1="535" y1="185" x2="595" y2="185" stroke="#8B6FBF"/>
  <line x1="535" y1="205" x2="595" y2="205" stroke="#8B6FBF"/>
  <line x1="535" y1="225" x2="580" y2="225" stroke="#8B6FBF"/>
  <path d="M615 155 L640 180 L630 195 L605 170 Z" fill="#8B6FBF"/>
  <text x="580" y="282" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC','Hiragino Sans GB',sans-serif" font-size="12" fill="#3D4F65">Agent 自写自取</text>

  <!-- Arrows to unified arena -->
  <line x1="180" y1="310" x2="280" y2="378" stroke="#4B8BDA" stroke-width="1.8" marker-end="url(#ar)"/>
  <line x1="360" y1="310" x2="360" y2="378" stroke="#4B8BDA" stroke-width="1.8" marker-end="url(#ar)"/>
  <line x1="540" y1="310" x2="440" y2="378" stroke="#4B8BDA" stroke-width="1.8" marker-end="url(#ar)"/>

  <rect x="200" y="380" width="320" height="70" rx="10" fill="#1E3A5F"/>
  <text x="360" y="408" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC','Hiragino Sans GB',sans-serif" font-size="15" font-weight="bold" fill="#FFFFFF">写入 / 维护 / 检索 / 使用</text>
  <text x="360" y="432" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC','Hiragino Sans GB',sans-serif" font-size="12" fill="#BFD7F2">四阶段统一评测</text>
</svg>