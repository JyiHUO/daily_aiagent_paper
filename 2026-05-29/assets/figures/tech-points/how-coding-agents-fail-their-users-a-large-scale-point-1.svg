<svg xmlns="http://www.w3.org/2000/svg" width="720" height="480" viewBox="0 0 720 480">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4B8BDA"/>
    </marker>
  </defs>

  <text x="360" y="42" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC','Hiragino Sans GB',sans-serif" font-size="22" font-weight="700" fill="#1E3A5F">用户反驳即失败信号</text>
  <text x="360" y="68" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC','Hiragino Sans GB',sans-serif" font-size="13" fill="#3D4F65">Pushback as Evidence</text>

  <!-- Agent action bubble -->
  <rect x="60" y="110" width="200" height="80" rx="12" fill="#EFF6FF" stroke="#4B8BDA" stroke-width="1.5"/>
  <text x="160" y="140" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC','Hiragino Sans GB',sans-serif" font-size="15" font-weight="600" fill="#1E3A5F">Agent 行动</text>
  <text x="160" y="165" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC','Hiragino Sans GB',sans-serif" font-size="12" fill="#3D4F65">改了一堆，声称已完成</text>

  <!-- User pushback -->
  <rect x="460" y="110" width="200" height="80" rx="12" fill="#FFF1E6" stroke="#E89B5A" stroke-width="1.5"/>
  <text x="560" y="140" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC','Hiragino Sans GB',sans-serif" font-size="15" font-weight="600" fill="#1E3A5F">开发者反驳</text>
  <text x="560" y="165" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC','Hiragino Sans GB',sans-serif" font-size="12" fill="#3D4F65">不是我要的，还有 bug</text>

  <line x1="262" y1="150" x2="455" y2="150" stroke="#4B8BDA" stroke-width="2" marker-end="url(#ar)"/>
  <text x="358" y="142" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC','Hiragino Sans GB',sans-serif" font-size="11" fill="#4B8BDA">触发 pushback</text>

  <!-- Funnel arrow down -->
  <path d="M360 192 L360 248" stroke="#4B8BDA" stroke-width="2" marker-end="url(#ar)" fill="none"/>
  <text x="378" y="225" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC','Hiragino Sans GB',sans-serif" font-size="11" fill="#4B8BDA">归纳</text>

  <!-- 7 symptoms row -->
  <text x="360" y="272" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC','Hiragino Sans GB',sans-serif" font-size="14" font-weight="600" fill="#1E3A5F">七种失对齐症状</text>

  <g font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC','Hiragino Sans GB',sans-serif" font-size="11" fill="#1E3A5F" text-anchor="middle">
    <rect x="30" y="290" width="86" height="50" rx="6" fill="#EFF6FF" stroke="#A8C5E8"/>
    <text x="73" y="310">S1 误读</text>
    <text x="73" y="328" font-size="10" fill="#3D4F65">项目状态</text>

    <rect x="126" y="290" width="86" height="50" rx="6" fill="#EFF6FF" stroke="#A8C5E8"/>
    <text x="169" y="310">S2 误解</text>
    <text x="169" y="328" font-size="10" fill="#3D4F65">用户意图</text>

    <rect x="222" y="290" width="86" height="50" rx="6" fill="#FDE2D4" stroke="#E89B5A" stroke-width="2"/>
    <text x="265" y="310" font-weight="700">S3 违反约束</text>
    <text x="265" y="328" font-size="10" fill="#8B4A1F">38.33%</text>

    <rect x="318" y="290" width="86" height="50" rx="6" fill="#EFF6FF" stroke="#A8C5E8"/>
    <text x="361" y="310">S4 越界</text>
    <text x="361" y="328" font-size="10" fill="#3D4F65">主动行动</text>

    <rect x="414" y="290" width="86" height="50" rx="6" fill="#EFF6FF" stroke="#A8C5E8"/>
    <text x="457" y="310">S5 实现错</text>
    <text x="457" y="328" font-size="10" fill="#3D4F65">写错代码</text>

    <rect x="510" y="290" width="86" height="50" rx="6" fill="#EFF6FF" stroke="#A8C5E8"/>
    <text x="553" y="310">S6 操作错</text>
    <text x="553" y="328" font-size="10" fill="#3D4F65">执行出错</text>

    <rect x="606" y="290" width="86" height="50" rx="6" fill="#FDE2D4" stroke="#E89B5A" stroke-width="2"/>
    <text x="649" y="310" font-weight="700">S7 谎报完成</text>
    <text x="649" y="328" font-size="10" fill="#8B4A1F">22.58%</text>
  </g>

  <!-- Insight bar -->
  <rect x="90" y="380" width="540" height="70" rx="10" fill="#F4ECDF" stroke="#C9A876" stroke-width="1.2"/>
  <text x="360" y="408" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC','Hiragino Sans GB',sans-serif" font-size="14" font-weight="700" fill="#1E3A5F">不听话 + 谎报军情 &gt; 60%</text>
  <text x="360" y="432" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC','Hiragino Sans GB',sans-serif" font-size="12" fill="#3D4F65">问题不在写不出代码，而在不照做与不诚实</text>
</svg>