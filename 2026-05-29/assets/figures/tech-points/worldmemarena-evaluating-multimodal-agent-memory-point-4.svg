<svg xmlns="http://www.w3.org/2000/svg" width="720" height="480" viewBox="0 0 720 480">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4B8BDA"/>
    </marker>
  </defs>

  <text x="360" y="42" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC','Hiragino Sans GB',sans-serif" font-size="20" font-weight="700" fill="#1E3A5F">Append-only 病</text>
  <text x="360" y="66" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC','Hiragino Sans GB',sans-serif" font-size="13" fill="#3D4F65">记忆只增不改，旧信息污染检索</text>

  <!-- Left: Diary (current systems) -->
  <g>
    <rect x="60" y="110" width="240" height="310" rx="6" fill="#EFF6FF" stroke="#4B8BDA" stroke-width="1.5"/>
    <text x="180" y="138" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC','Hiragino Sans GB',sans-serif" font-size="15" font-weight="700" fill="#1E3A5F">日记本式</text>

    <g font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC','Hiragino Sans GB',sans-serif" font-size="12" fill="#3D4F65">
      <rect x="85" y="160" width="190" height="32" rx="3" fill="#FFFFFF" stroke="#B8CFE8"/>
      <text x="95" y="180">① 我吃素</text>
      <text x="265" y="180" text-anchor="end" fill="#C97064">旧</text>

      <rect x="85" y="200" width="190" height="32" rx="3" fill="#FFFFFF" stroke="#B8CFE8"/>
      <text x="95" y="220">② 开始吃鱼</text>
      <text x="265" y="220" text-anchor="end" fill="#3D8B5A">新</text>

      <rect x="85" y="240" width="190" height="32" rx="3" fill="#FFFFFF" stroke="#B8CFE8"/>
      <text x="95" y="260">③ 喜欢辣</text>

      <rect x="85" y="280" width="190" height="32" rx="3" fill="#FFFFFF" stroke="#B8CFE8"/>
      <text x="95" y="300">④ ...</text>
    </g>

    <text x="180" y="350" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC','Hiragino Sans GB',sans-serif" font-size="13" fill="#1E3A5F">Append ≫ Revise / Delete</text>
    <text x="180" y="395" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC','Hiragino Sans GB',sans-serif" font-size="12" fill="#C97064">Update &lt; 60%，IntRej 极低</text>
  </g>

  <!-- Arrow middle -->
  <g>
    <line x1="310" y1="265" x2="410" y2="265" stroke="#4B8BDA" stroke-width="2.5" marker-end="url(#arr)"/>
    <text x="360" y="255" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC','Hiragino Sans GB',sans-serif" font-size="12" fill="#1E3A5F">应当</text>
  </g>

  <!-- Right: Whiteboard (mutable state) -->
  <g>
    <rect x="420" y="110" width="240" height="310" rx="6" fill="#FFF4E6" stroke="#E8A55C" stroke-width="1.5"/>
    <text x="540" y="138" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC','Hiragino Sans GB',sans-serif" font-size="15" font-weight="700" fill="#1E3A5F">白板式</text>

    <g font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC','Hiragino Sans GB',sans-serif" font-size="12">
      <rect x="445" y="170" width="190" height="32" rx="3" fill="#FFFFFF" stroke="#D8C0A0"/>
      <text x="455" y="190" fill="#B8B8B8" text-decoration="line-through">我吃素</text>
      <text x="625" y="190" text-anchor="end" fill="#C97064">删</text>

      <rect x="445" y="220" width="190" height="40" rx="3" fill="#FFFFFF" stroke="#3D8B5A" stroke-width="1.8"/>
      <text x="455" y="245" fill="#1E3A5F" font-weight="600">饮食：吃鱼</text>
      <text x="625" y="245" text-anchor="end" fill="#3D8B5A">留</text>
    </g>

    <text x="540" y="320" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC','Hiragino Sans GB',sans-serif" font-size="13" fill="#1E3A5F">记忆 = 可变状态，奖励一致性</text>
    <text x="540" y="395" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC','Hiragino Sans GB',sans-serif" font-size="12" fill="#3D8B5A">Revise · Delete · Merge</text>
  </g>

  <!-- bottom note -->
  <text x="360" y="455" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC','Hiragino Sans GB',sans-serif" font-size="11" fill="#3D4F65">用 Update Handling &amp; Interference Rejection 量化</text>
</svg>