<svg xmlns="http://www.w3.org/2000/svg" width="720" height="480" viewBox="0 0 720 480">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4B8BDA"/>
    </marker>
  </defs>
  <rect width="720" height="480" fill="#FAFBFC"/>

  <text x="360" y="42" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC','Hiragino Sans GB',sans-serif" font-size="20" font-weight="600" fill="#1E3A5F">两种记忆压力测试 / Two Memory Regimes</text>

  <!-- Left: Lifelong Evolution -->
  <rect x="55" y="90" width="280" height="340" rx="14" fill="#EFF6FF" stroke="#4B8BDA" stroke-width="1.5"/>
  <text x="195" y="125" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC','Hiragino Sans GB',sans-serif" font-size="15" font-weight="600" fill="#1E3A5F">长期演化 Lifelong</text>

  <!-- Evolving world: three growing circles -->
  <circle cx="115" cy="225" r="22" fill="#FFFFFF" stroke="#4B8BDA" stroke-width="1.5"/>
  <text x="115" y="229" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC','Hiragino Sans GB',sans-serif" font-size="11" fill="#1E3A5F">S1</text>

  <circle cx="195" cy="225" r="30" fill="#FFFFFF" stroke="#4B8BDA" stroke-width="1.5"/>
  <text x="195" y="229" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC','Hiragino Sans GB',sans-serif" font-size="11" fill="#1E3A5F">S2</text>

  <circle cx="287" cy="225" r="38" fill="#FFFFFF" stroke="#4B8BDA" stroke-width="1.5"/>
  <text x="287" y="229" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC','Hiragino Sans GB',sans-serif" font-size="11" fill="#1E3A5F">S3</text>

  <line x1="137" y1="225" x2="161" y2="225" stroke="#4B8BDA" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="225" y1="225" x2="245" y2="225" stroke="#4B8BDA" stroke-width="1.5" marker-end="url(#arr)"/>

  <text x="195" y="320" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC','Hiragino Sans GB',sans-serif" font-size="12" fill="#3D4F65">世界跨 session 演化</text>
  <text x="195" y="342" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC','Hiragino Sans GB',sans-serif" font-size="12" fill="#3D4F65">笔记需持续更新</text>
  <text x="195" y="395" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC','Hiragino Sans GB',sans-serif" font-size="11" font-style="italic" fill="#7A8A9C">考察：状态追踪</text>

  <!-- Right: Agentic Execution -->
  <rect x="385" y="90" width="280" height="340" rx="14" fill="#FFF4EC" stroke="#E8945A" stroke-width="1.5"/>
  <text x="525" y="125" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC','Hiragino Sans GB',sans-serif" font-size="15" font-weight="600" fill="#1E3A5F">动作执行 Agentic</text>

  <!-- Scattered traces -->
  <rect x="420" y="190" width="44" height="26" rx="4" fill="#FFFFFF" stroke="#E8945A" stroke-width="1.4"/>
  <text x="442" y="208" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC','Hiragino Sans GB',sans-serif" font-size="10" fill="#3D4F65">截图</text>

  <rect x="498" y="190" width="44" height="26" rx="4" fill="#FFFFFF" stroke="#E8945A" stroke-width="1.4"/>
  <text x="520" y="208" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC','Hiragino Sans GB',sans-serif" font-size="10" fill="#3D4F65">点击</text>

  <rect x="576" y="190" width="44" height="26" rx="4" fill="#FFFFFF" stroke="#E8945A" stroke-width="1.4"/>
  <text x="598" y="208" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC','Hiragino Sans GB',sans-serif" font-size="10" fill="#3D4F65">反馈</text>

  <rect x="459" y="232" width="44" height="26" rx="4" fill="#FFFFFF" stroke="#E8945A" stroke-width="1.4"/>
  <text x="481" y="250" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC','Hiragino Sans GB',sans-serif" font-size="10" fill="#3D4F65">动作</text>

  <rect x="537" y="232" width="44" height="26" rx="4" fill="#FFFFFF" stroke="#E8945A" stroke-width="1.4"/>
  <text x="559" y="250" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC','Hiragino Sans GB',sans-serif" font-size="10" fill="#3D4F65">失败</text>

  <!-- Magnifier hinting "extract evidence" -->
  <circle cx="520" cy="310" r="18" fill="none" stroke="#E8945A" stroke-width="2"/>
  <line x1="533" y1="323" x2="547" y2="337" stroke="#E8945A" stroke-width="3" stroke-linecap="round"/>

  <text x="525" y="370" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC','Hiragino Sans GB',sans-serif" font-size="12" fill="#3D4F65">线索散落于动作轨迹</text>
  <text x="525" y="395" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC','Hiragino Sans GB',sans-serif" font-size="11" font-style="italic" fill="#7A8A9C">考察：经验提炼</text>
