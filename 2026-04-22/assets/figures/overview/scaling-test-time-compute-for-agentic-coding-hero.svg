<svg xmlns="http://www.w3.org/2000/svg" width="1460" height="880" viewBox="0 0 1460 880"><defs><linearGradient id="overviewBg" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#FFFFFF"/><stop offset="100%" stop-color="#F8FAFC"/></linearGradient><linearGradient id="heroBand" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" stop-color="#E0EAFF"/><stop offset="100%" stop-color="#ECFDF5"/></linearGradient><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#64748B"/></marker></defs><rect x="0" y="0" width="1460" height="880" fill="url(#overviewBg)"/><rect x="34" y="32" width="1392" height="816" rx="34" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.4"/><rect x="52" y="50" width="1356" height="164" rx="28" fill="url(#heroBand)" stroke="#D8E6F5" stroke-width="1.2"/><text x="72" y="92" font-size="30" font-weight="800" fill="#0F172A">Scaling Test-Time Compute for Agentic Coding</text><text x="72" y="126" font-size="15" font-weight="700" fill="#475569">论文核心机制总览</text><rect x="72" y="146" width="920" height="44" rx="22" fill="#FFFFFF" stroke="#C7D2FE" stroke-width="1.2"/><text x="92" y="174" font-size="16" font-weight="700" fill="#3730A3">一句话理解：这篇论文直接针对长程编码Agent的test-time scaling瓶颈，提出以紧凑轨迹摘要为核心表示，结合递归锦标赛投票(RTV)和并行蒸馏精炼(PDR)两种推理时扩展机制，在SWE-Bench </text><rect x="80.0" y="226.0" width="320.0" height="78.0" rx="28" fill="#0F172A" opacity="0.05"/><rect x="72.0" y="216.0" width="320.0" height="78.0" rx="28" fill="#FFF7ED" stroke="#FDBA74" stroke-width="1.6"/><text x="94" y="244.0" font-size="14" font-weight="700" fill="#7C2D12">Test-time scaling（推理时扩展计</text><text x="94" y="262.0" font-size="14" font-weight="700" fill="#7C2D12">算）在数学推理和单轮代码生成中效果显著，但长程编</text><text x="94" y="280.0" font-size="14" font-weight="700" fill="#7C2D12">码Agent每次尝试会产生冗长、嘈杂的交互轨迹…</text><rect x="1076.0" y="226.0" width="320.0" height="78.0" rx="28" fill="#0F172A" opacity="0.05"/><rect x="1068.0" y="216.0" width="320.0" height="78.0" rx="28" fill="#EEF2FF" stroke="#A5B4FC" stroke-width="1.6"/><text x="1090" y="244.0" font-size="14" font-weight="700" fill="#3730A3">这篇论文直接针对长程编码Agent的test-t</text><text x="1090" y="262.0" font-size="14" font-weight="700" fill="#3730A3">ime scaling瓶颈，提出以紧凑轨迹摘要为</text><text x="1090" y="280.0" font-size="14" font-weight="700" fill="#3730A3">核心表示，结合递归锦标赛投票(RTV)和并行蒸…</text><path d="M 468.0 427.0 C 502.0 427.0, 532.0 427.0, 566.0 427.0" fill="none" stroke="#64748B" stroke-width="4" marker-end="url(#arrow)"/><path d="M 890.0 427.0 C 924.0 427.0, 954.0 427.0, 988.0 427.0" fill="none" stroke="#64748B" stroke-width="4" marker-end="url(#arrow)"/><rect x="176.0" y="328.0" width="300.0" height="218.0" rx="28" fill="#0F172A" opacity="0.05"/><rect x="168.0" y="318.0" width="300.0" height="218.0" rx="28" fill="#FFFFFF" stroke="#60A5FA" stroke-width="1.6"/><rect x="188.0" y="336.0" width="86" height="30" rx="15" fill="#DBEAFE"/><text x="231.0" y="356.0" text-anchor="middle" font-size="12" font-weight="800" fill="#60A5FA">核心模块</text><text x="318.0" y="406.0" text-anchor="middle" font-size="26" font-weight="800" fill="#0F172A">紧凑轨迹摘要作为核心表示</text><text x="194.0" y="458.0" font-size="14" font-weight="600" fill="#334155">想象一个程序员连续调试了两小时，</text><text x="194.0" y="476.0" font-size="14" font-weight="600" fill="#334155">完整记录有上千行操作日志。要让别</text><text x="194.0" y="494.0" font-size="14" font-weight="600" fill="#334155">人帮你判断哪个方案更好，与其给他</text><text x="194.0" y="512.0" font-size="14" font-weight="600" fill="#334155">看全部日志，不如写一份结构化总…</text><rect x="598.0" y="328.0" width="300.0" height="218.0" rx="28" fill="#0F172A" opacity="0.05"/><rect x="590.0" y="318.0" width="300.0" height="218.0" rx="28" fill="#F0FDF4" stroke="#10B981" stroke-width="1.6"/><rect x="610.0" y="336.0" width="86" height="30" rx="15" fill="#BBF7D0"/><text x="653.0" y="356.0" text-anchor="middle" font-size="12" font-weight="800" fill="#10B981">核心模块</text><text x="740.0" y="406.0" text-anchor="middle" font-size="26" font-weight="800" fill="#0F172A">递归锦标赛投票(RTV)</text><text x="616.0" y="458.0" font-size="14" font-weight="600" fill="#334155">这就像一场淘汰赛而不是让裁判同时</text><text x="616.0" y="476.0" font-size="14" font-weight="600" fill="#334155">看16个选手表演然后挑最好的。把</text><text x="616.0" y="494.0" font-size="14" font-weight="600" fill="#334155">16个方案两两配对比较，每对选出</text><text x="616.0" y="512.0" font-size="14" font-weight="600" fill="#334155">更好的一个，8个胜者再两两比，…</text><rect x="1020.0" y="328.0" width="300.0" height="218.0" rx="28" fill="#0F172A" opacity="0.05"/><rect x="1012.0" y="318.0" width="300.0" height="218.0" rx="28" fill="#FFF7ED" stroke="#F59E0B" stroke-width="1.6"/><rect x="1032.0" y="336.0" width="86" height="30" rx="15" fill="#FDE68A"/><text x="1075.0" y="356.0" text-anchor="middle" font-size="12" font-weight="800" fill="#F59E0B">核心模块</text><text x="1162.0" y="406.0" text-anchor="middle" font-size="26" font-weight="800" fill="#0F172A">顺序精炼PDR与上下文质量</text><text x="1038.0" y="458.0" font-size="14" font-weight="600" fill="#334155">第一轮让16个Agent各自独立</text><text x="1038.0" y="476.0" font-size="14" font-weight="600" fill="#334155">尝试，总结经验后挑出最好的4份经</text><text x="1038.0" y="494.0" font-size="14" font-weight="600" fill="#334155">验报告。第二轮让16个新Agen</text><text x="1038.0" y="512.0" font-size="14" font-weight="600" fill="#334155">t在干净环境中重新开始，但出发…</text><rect x="72" y="614" width="1316" height="190" rx="28" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.3"/><text x="94" y="650" font-size="18" font-weight="800" fill="#0F172A">为什么这篇论文值得放主图</text><text x="94" y="684.0" font-size="15" font-weight="600" fill="#334155">Test-time scaling（推理时扩展计算）在数学推理和单轮代码生成中效果显著，但长程编码Agent每次尝试</text><text x="94" y="706.0" font-size="15" font-weight="600" fill="#334155">会产生冗长、嘈杂的交互轨迹（包含文件读写、命令执行、错误恢复等），传统方法无法直接对这些长轨迹进行比较、排序或复用。</text><text x="94" y="728.0" font-size="15" font-weight="600" fill="#334155">原有方法如majority voting或简单的best-of-N选择在面对长horizon</text><text x="94" y="750.0" font-size="15" font-weight="600" fill="#334155">Agent轨迹时效果有限，因为原始轨迹中有用信号被大量低价值细节淹没。本文认为，长程Agent的推理时扩展本质上是一</text><text x="94" y="772.0" font-size="15" font-weight="600" fill="#334155">个表示(representation)、选择(selection)和复用(reuse)问题，值得关注是因为它为所有…</text><text x="72" y="836" font-size="14" font-weight="600" fill="#64748B">图示：候选主图不可靠时，自动回退为论文机制总览 SVG。</text></svg>