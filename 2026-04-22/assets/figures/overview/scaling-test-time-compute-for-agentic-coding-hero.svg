<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 760" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0f1629"/>
      <stop offset="1" stop-color="#1a1f3a"/>
    </linearGradient>
    <linearGradient id="traj" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3a4668" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#5968a0" stop-opacity="0.4"/>
    </linearGradient>
    <linearGradient id="sum" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3dd6c4"/>
      <stop offset="1" stop-color="#2a9d8f"/>
    </linearGradient>
    <linearGradient id="champ" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffd166"/>
      <stop offset="1" stop-color="#f4a261"/>
    </linearGradient>
    <linearGradient id="refine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#9b5de5"/>
      <stop offset="1" stop-color="#f15bb5"/>
    </linearGradient>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#cdd6f4"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#3dd6c4"/>
    </marker>
    <marker id="arrP" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#f15bb5"/>
    </marker>
  </defs>

  <rect width="1280" height="760" fill="url(#bg)"/>

  <!-- Title -->
  <text x="640" y="48" text-anchor="middle" fill="#e8ecff" font-size="26" font-weight="700">Test-Time Scaling for Agentic Coding</text>
  <text x="640" y="74" text-anchor="middle" fill="#9aa5c7" font-size="15">长轨迹 → 结构化摘要 → 锦标赛选择 → 精炼复用</text>

  <!-- Column headers -->
  <text x="155" y="110" text-anchor="middle" fill="#7e8ab5" font-size="12" letter-spacing="2">① ROLLOUTS</text>
  <text x="432" y="110" text-anchor="middle" fill="#7e8ab5" font-size="12" letter-spacing="2">② SUMMARIZE</text>
  <text x="750" y="110" text-anchor="middle" fill="#7e8ab5" font-size="12" letter-spacing="2">③ RTV (tournament)</text>
  <text x="1135" y="110" text-anchor="middle" fill="#7e8ab5" font-size="12" letter-spacing="2">④ PDR refine</text>

  <!-- Column 1: long noisy trajectories -->
  <g font-size="10" fill="#c7cff0">
    <g transform="translate(60,135)">
      <rect width="190" height="86" rx="8" fill="url(#traj)" opacity="0.9"/>
      <text x="10" y="18" fill="#eef2ff" font-weight="600">rollout #1</text>
      <text x="10" y="34" fill="#aab4d8">ls / grep / edit …</text>
      <text x="10" y="48" fill="#aab4d8">pytest → FAIL</text>
      <text x="10" y="62" fill="#aab4d8">revert, retry (40+ steps)</text>
      <text x="10" y="78" fill="#8792b8" font-style="italic">long · noisy · low-signal</text>
    </g>
    <g transform="translate(60,232)">
      <rect width="190" height="70" rx="8" fill="url(#traj)" opacity="0.75"/>
      <text x="10" y="18" fill="#eef2ff" font-weight="600">rollout #2</text>
      <text x="10" y="34" fill="#aab4d8">hypothesis → dead end</text>
      <text x="10" y="50" fill="#aab4d8">partial progress</text>
    </g>
    <g transform="translate(60,314)">
      <rect width="190" height="70" rx="8" fill="url(#traj)" opacity="0.6"/>
      <text x="10" y="18" fill="#eef2ff" font-weight="600">rollout #3</text>
      <text x="10" y="34" fill="#aab4d8">locate db/models/query.py</text>
      <text x="10" y="50" fill="#aab4d8">tests pass ✓</text>
    </g>
    <g transform="translate(60,396)">
      <rect width="190" height="50" rx="8" fill="url(#traj)" opacity="0.45"/>
      <text x="10" y="20" fill="#eef2ff" font-weight="600">rollout #4</text>
      <text x="10" y="38" fill="#aab4d8">regression introduced</text>
    </g>
    <text x="155" y="478" text-anchor="middle" fill="#6e78a0" font-size="13" font-style="italic">… N = 16 parallel (iter-0)</text>
  </g>

  <!-- Arrows 1->2 -->
  <g stroke="#5a6795" stroke-width="1.5" fill="none" marker-end="url(#arr)">
    <line x1="255" y1="178" x2="340" y2="195"/>
    <line x1="255" y1="267" x2="340" y2="260"/>
    <line x1="255" y1="349" x2="340" y2="320"/>
    <line x1="255" y1="421" x2="340" y2="380"/>
  </g>

  <!-- Column 2: structured summaries -->
  <g>
    <g transform="translate(345,160)">
      <rect width="175" height="72" rx="10" fill="url(#sum)" opacity="0.95"/>
      <text x="12" y="18" fill="#0b2027" font-size="11" font-weight="700">SUMMARY S₁</text>
      <line x1="12" y1="24" x2="163" y2="24" stroke="#0b2027" opacity="0.25"/>
      <text x="12" y="38" fill="#0b2027" font-size="10">hypothesis · progress</text>
      <text x="12" y="52" fill="#0b2027" font-size="10">failure modes · final state</text>
      <text x="12" y="66" fill="#0b2027" font-size="10" font-style="italic" opacity="0.7">salient signal only</text>
    </g>
    <g transform="translate(345,242)" opacity="0.9">
      <rect width="175" height="56" rx="10" fill="url(#sum)"/>
      <text x="12" y="18" fill="#0b2027" font-size="11" font-weight="700">SUMMARY S₂</text>
      <text x="12" y="36" fill="#0b2027" font-size="10">dead end at parser.py</text>
      <text x="12" y="50" fill="#0b2027" font-size="10">no passing tests</text>
    </g>
    <g transform="translate(345,308)" opacity="0.9">
      <rect width="175" height="56" rx="10" fill="url(#sum)"/>
      <text x="12" y="18" fill="#0b2027" font-size="11" font-weight="700">SUMMARY S₃</text>
      <text x="12" y="36" fill="#0b2027" font-size="10">fix @ query.py:234 ✓</text>
      <text x="12" y="50" fill="#0b2027" font-size="10">full suite passes</text>
    </g>
    <g transform="translate(345,374)" opacity="0.85">
      <rect width="175" height="50" rx="10" fill="url(#sum)"/>
      <text x="12" y="18" fill="#0b2027" font-size="11" font-weight="700">SUMMARY S₄</text>
      <text x="12" y="36" fill="#0b2027" font-size="10">regression on filter()</text>
    </g>
    <text x="432" y="452" text-anchor="middle" fill="#3dd6c4" font-size="12" font-weight="600">compact · comparable · reusable</text>
  </g>

  <!-- Arrows 2->3 tournament bracket -->
  <g stroke="#3dd6c4" stroke-width="1.6" fill="none" marker-end="url(#arrG)" opacity="0.9">
    <path d="M520,196 L585,225"/>
    <path d="M520,270 L585,240"/>
    <path d="M520,336 L585,315"/>
    <path d="M520,399 L585,330"/>
  </g>

  <!-- Column 3: RTV bracket -->
  <g font-size="10">
    <!-- pair nodes round 1 -->
    <g transform="translate(588,212)">
      <rect width="110" height="38" rx="6" fill="#243055" stroke="#3dd6c4" stroke-width="1"/>
      <text x="55" y="16" text-anchor="middle" fill="#e8ecff" font-size="10" font-weight="600">pair vote</text>
      <text x="55" y="30" text-anchor="middle" fill="#9aa5c7" font-size="9">G=2, V=8</text>
    </g>
    <g transform="translate(588,304)">
      <rect width="110" height="38" rx="6" fill="#243055" stroke="#3dd6c4" stroke-width="1"/>
      <text x="55" y="16" text-anchor="middle" fill="#e8ecff" font-size="10" font-weight="600">pair vote</text>
      <text x="55" y="30" text-anchor="middle" fill="#9aa5c7" font-size="9">G=2, V=8</text>
    </g>

    <!-- round 2 arrows -->
    <g stroke="#3dd6c4" stroke-width="1.4" fill="none" marker-end="url(#arrG)">
      <path d="M698,231 L770,255"/>
      <path d="M698,323 L770,275"/>
    </g>
    <g transform="translate(772,250)">
      <rect width="100" height="38" rx="6" fill="#2d3a63" stroke="#3dd6c4" stroke-width="1.3"/>
      <text x="50" y="16" text-anchor="middle" fill="#e8ecff" font-size="10" font-weight="600">round 2</text>
      <text x="50" y="30" text-anchor="middle" fill="#9aa5c7" font-size="9">recursive</text>
    </g>

    <!-- champion -->
    <g stroke="#ffd166" stroke-width="1.8" fill="none" marker-end="url(#arr)">
      <line x1="872" y1="269" x2="905" y2="269"/>
    </g>
    <g transform="translate(907,245)">
      <rect width="120" height="50" rx="10" fill="url(#champ)"/>
      <text x="60" y="20" text-anchor="middle" fill="#2b1800" font-size="11" font-weight="700">TOP-K = 4</text>
      <text x="60" y="38" text-anchor="middle" fill="#2b1800" font-size="10">best summaries</text>
    </g>
    <text x="760" y="400" text-anchor="middle" fill="#3dd6c4" font-size="11" font-style="italic">many small local votes &gt; one global rank</text>
  </g>

  <!-- Arrow Top-K -> PDR box -->
  <g stroke="#f15bb5" stroke-width="2" fill="none" marker-end="url(#arrP)">
    <path d="M1027,260 L1055,215"/>
  </g>

  <!-- Column 4: PDR refine -->
  <g>
    <g transform="translate(1040,130)">
      <rect width="220" height="180" rx="14" fill="#1e1330" stroke="url(#refine)" stroke-width="2"/>
      <text x="110" y="26" text-anchor="middle" fill="#f8c7e8" font-size="13" font-weight="700">Parallel-Distill-Refine</text>
      <line x1="16" y1="38" x2="204" y2="38" stroke="#9b5de5" opacity="0.4"/>
      <text x="16" y="58" fill="#e8d5f4" font-size="11">fresh env + K=4 summaries</text>
      <text x="16" y="74" fill="#c8a8dc" font-size="10">as distilled context</text>
      <g font-size="10" fill="#e8d5f4">
        <rect x="16" y="86" width="42" height="22" rx="4" fill="#3a1f52"/>
        <text x="37" y="101" text-anchor="middle">r₁′</text>
        <rect x="64" y="86" width="42" height="22" rx="4" fill="#3a1f52"/>
        <text x="85" y="101" text-anchor="middle">r₂′</text>
        <rect x="112" y="86" width="42" height="22" rx="4" fill="#3a1f52"/>
        <text x="133" y="101" text-anchor="middle">r₃′</text>
        <rect x="160" y="86" width="44" height="22" rx="4" fill="#3a1f52"/>
        <text x="182" y="101" text-anchor="middle">…×16</text>
      </g>
      <text x="16" y="132" fill="#ffd166" font-size="11" font-weight="600">→ shorter, sharper</text>
      <text x="16" y="148" fill="#c8a8dc" font-size="10">Opus: 41 → 14 steps</text>
      <text x="16" y="166" fill="#c8a8dc" font-size="10">avoids known dead ends</text>
    </g>

    <!-- final RTV → answer -->
    <g transform="translate(1040,330)">
      <rect width="220" height="60" rx="10" fill="#2d3a63" stroke="#ffd166" stroke-width="1.3"/>
      <text x="110" y="24" text-anchor="middle" fill="#ffd166" font-size="12" font-weight="700">final RTV → top-1</text>
      <text x="110" y="44" text-anchor="middle" fill="#cdd6f4" font-size="10">selected patch / solution</text>
    </g>
    <g stroke="#ffd166" stroke-width="1.5" fill="none" marker-end="url(#arr)" opacity="0.8">
      <line x1="1150" y1="310" x2="1150" y2="328"/>
    </g>
  </g>

  <!-- Closing loop: refined rollouts -> re-summarize (iteration-1) -->
  <g stroke="#f15bb5" stroke-width="1.8" fill="none" stroke-dasharray="6 4" marker-end="url(#arrP)" opacity="0.9">
    <path d="M1040,390 L 700,470 L 432,470"/>
  </g>
  <text x="780" y="492" text-anchor="middle" fill="#f15bb5" font-size="11" font-style="italic">iteration-1: refined rollouts are re-summarized and re-selected</text>

  <!-- Bottom results strip -->
  <g transform="translate(60,540)">
    <rect width="1160" height="180" rx="14" fill="#141a30" stroke="#2a3558"/>
    <text x="24" y="32" fill="#e8ecff" font-size="14" font-weight="700">Why representation matters</text>
    <text x="24" y="54" fill="#9aa5c7" font-size="11">Long-horizon scaling is not “more tries” — it is selecting and reusing what each try learned.</text>

    <g transform="translate(30,78)">
      <rect width="260" height="80" rx="10" fill="#1b2542"/>
      <text x="16" y="24" fill="#3dd6c4" font-size="11" font-weight="700">SWE-Bench Verified</text>
      <text x="16" y="50" fill="#e8ecff" font-size="16" font-weight="700">70.9% → 77.6%</text>
      <text x="16" y="68" fill="#9aa5c7" font-size="10">Claude-4.5-Opus (mini-SWE-agent)</text>
    </g>
    <g transform="translate(310,78)">
      <rect width="260" height="80" rx="10" fill="#1b2542"/>
      <text x="16" y="24" fill="#ffd166" font-size="11" font-weight="700">Terminal-Bench v2.0</text>
      <text x="16" y="50" fill="#e8ecff" font-size="16" font-weight="700">46.9% → 59.1%</text>
      <text x="16" y="68" fill="#9aa5c7" font-size="10">Claude-4.5-Opus (Terminus 1)</text>
    </g>
    <g transform="translate(590,78)">
      <rect width="260" height="80" rx="10" fill="#1b2542"/>
      <text x="16" y="24" fill="#f15bb5" font-size="11" font-weight="700">Context quality ↔ success</text>
      <text x="16" y="50" fill="#e8ecff" font-size="14" font-weight="700">0/4 → 0.1%   ·   4/4 → 99.2%</text>
      <text x="16" y="68" fill="#9aa5c7" font-size="10">passing summaries in refine context</text>
    </g>
    <g transform="translate(870,78)">
      <rect width="260" height="80" rx="10" fill="#1b2542"/>
      <text x="16" y="24" fill="#9b5de5" font-size="11" font-weight="700">Breakthroughs</text>
      <text x="16" y="50" fill="#e8ecff" font-size="16" font-weight="700">pass@16 = 0 → solved</text>
      <text x="16" y="68" fill="#9aa5c7" font-size="10">new solutions emerge from distilled hints</text>
    </g>
  </g>
</svg>