<svg xmlns="http://www.w3.org/2000/svg" width="1460" height="880" viewBox="0 0 1460 880"><defs><linearGradient id="overviewBg" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#FFFFFF"/><stop offset="100%" stop-color="#F8FAFC"/></linearGradient><linearGradient id="heroBand" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" stop-color="#E0EAFF"/><stop offset="100%" stop-color="#ECFDF5"/></linearGradient><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#64748B"/></marker></defs><rect x="0" y="0" width="1460" height="880" fill="url(#overviewBg)"/><rect x="34" y="32" width="1392" height="816" rx="34" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.4"/><rect x="52" y="50" width="1356" height="164" rx="28" fill="url(#heroBand)" stroke="#D8E6F5" stroke-width="1.2"/><text x="72" y="92" font-size="30" font-weight="800" fill="#0F172A">From Craft to Kernel: A Governance-First Execution Architecture and Semantic ISA for Agentic Computers</text><text x="72" y="126" font-size="15" font-weight="700" fill="#475569">论文核心机制总览</text><rect x="72" y="146" width="920" height="44" rx="22" fill="#FFFFFF" stroke="#C7D2FE" stroke-width="1.2"/><text x="92" y="174" font-size="16" font-weight="700" fill="#3730A3">一句话理解：Arbiter-K 提出了一种将 LLM 视为&#x27;概率处理单元&#x27;并用确定性符号内核封装的治理优先架构，定义了语义指令集架构（Semantic ISA）、安全上下文注册表、指令依赖图和运行时污点传播机制，</text><rect x="80.0" y="226.0" width="320.0" height="78.0" rx="28" fill="#0F172A" opacity="0.05"/><rect x="72.0" y="216.0" width="320.0" height="78.0" rx="28" fill="#FFF7ED" stroke="#FDBA74" stroke-width="1.6"/><text x="94" y="244.0" font-size="14" font-weight="700" fill="#7C2D12">当前主流 Agent 框架把 LLM</text><text x="94" y="262.0" font-size="14" font-weight="700" fill="#7C2D12">当作系统控制环的核心，安全仅靠文本级</text><text x="94" y="280.0" font-size="14" font-weight="700" fill="#7C2D12">guardrail 做事后过滤，实验显示原生防…</text><rect x="1076.0" y="226.0" width="320.0" height="78.0" rx="28" fill="#0F172A" opacity="0.05"/><rect x="1068.0" y="216.0" width="320.0" height="78.0" rx="28" fill="#EEF2FF" stroke="#A5B4FC" stroke-width="1.6"/><text x="1090" y="244.0" font-size="14" font-weight="700" fill="#3730A3">Arbiter-K 提出了一种将 LLM</text><text x="1090" y="262.0" font-size="14" font-weight="700" fill="#3730A3">视为&#x27;概率处理单元&#x27;并用确定性符号内核封装的治理</text><text x="1090" y="280.0" font-size="14" font-weight="700" fill="#3730A3">优先架构，定义了语义指令集架构（Semanti…</text><path d="M 468.0 427.0 C 502.0 427.0, 532.0 427.0, 566.0 427.0" fill="none" stroke="#64748B" stroke-width="4" marker-end="url(#arrow)"/><path d="M 890.0 427.0 C 924.0 427.0, 954.0 427.0, 988.0 427.0" fill="none" stroke="#64748B" stroke-width="4" marker-end="url(#arrow)"/><rect x="176.0" y="328.0" width="300.0" height="218.0" rx="28" fill="#0F172A" opacity="0.05"/><rect x="168.0" y="318.0" width="300.0" height="218.0" rx="28" fill="#FFFFFF" stroke="#60A5FA" stroke-width="1.6"/><rect x="188.0" y="336.0" width="86" height="30" rx="15" fill="#DBEAFE"/><text x="231.0" y="356.0" text-anchor="middle" font-size="12" font-weight="800" fill="#60A5FA">核心模块</text><text x="318.0" y="406.0" text-anchor="middle" font-size="26" font-weight="800" fill="#0F172A">语义指令集架构(Seman</text><text x="318.0" y="434.0" text-anchor="middle" font-size="26" font-weight="800" fill="#0F172A">tic ISA)</text><text x="194.0" y="458.0" font-size="14" font-weight="600" fill="#334155">类比 CPU 的指令集，LLM</text><text x="194.0" y="476.0" font-size="14" font-weight="600" fill="#334155">的每次输出不再是一段模糊的文本，</text><text x="194.0" y="494.0" font-size="14" font-weight="600" fill="#334155">而被&#x27;翻译&#x27;成一条有明确类型和安</text><text x="194.0" y="512.0" font-size="14" font-weight="600" fill="#334155">全标签的离散指令。内核看到的是…</text><rect x="598.0" y="328.0" width="300.0" height="218.0" rx="28" fill="#0F172A" opacity="0.05"/><rect x="590.0" y="318.0" width="300.0" height="218.0" rx="28" fill="#F0FDF4" stroke="#10B981" stroke-width="1.6"/><rect x="610.0" y="336.0" width="86" height="30" rx="15" fill="#BBF7D0"/><text x="653.0" y="356.0" text-anchor="middle" font-size="12" font-weight="800" fill="#10B981">核心模块</text><text x="740.0" y="406.0" text-anchor="middle" font-size="26" font-weight="800" fill="#0F172A">运行时污点传播与依赖图</text><text x="616.0" y="458.0" font-size="14" font-weight="600" fill="#334155">想象每条数据都带着一个&#x27;来源标签</text><text x="616.0" y="476.0" font-size="14" font-weight="600" fill="#334155">&#x27;。从网页抓取的内容标记为&#x27;低信</text><text x="616.0" y="494.0" font-size="14" font-weight="600" fill="#334155">任&#x27;，本地 API key</text><text x="616.0" y="512.0" font-size="14" font-weight="600" fill="#334155">标记为&#x27;中风险&#x27;。当 Agen…</text><rect x="1020.0" y="328.0" width="300.0" height="218.0" rx="28" fill="#0F172A" opacity="0.05"/><rect x="1012.0" y="318.0" width="300.0" height="218.0" rx="28" fill="#FFF7ED" stroke="#F59E0B" stroke-width="1.6"/><rect x="1032.0" y="336.0" width="86" height="30" rx="15" fill="#FDE68A"/><text x="1075.0" y="356.0" text-anchor="middle" font-size="12" font-weight="800" fill="#F59E0B">核心模块</text><text x="1162.0" y="406.0" text-anchor="middle" font-size="26" font-weight="800" fill="#0F172A">策略反馈与上下文复用</text><text x="1038.0" y="458.0" font-size="14" font-weight="600" fill="#334155">不是一出错就把整段对话扔掉重来，</text><text x="1038.0" y="476.0" font-size="14" font-weight="600" fill="#334155">而是在出错的那一步精确&#x27;刹车&#x27;，</text><text x="1038.0" y="494.0" font-size="14" font-weight="600" fill="#334155">告诉 Agent&#x27;你第3步违反了</text><text x="1038.0" y="512.0" font-size="14" font-weight="600" fill="#334155">XX策略，请换个方式&#x27;，前面已…</text><rect x="72" y="614" width="1316" height="190" rx="28" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.3"/><text x="94" y="650" font-size="18" font-weight="800" fill="#0F172A">为什么这篇论文值得放主图</text><text x="94" y="684.0" font-size="15" font-weight="600" fill="#334155">当前主流 Agent 框架把 LLM 当作系统控制环的核心，安全仅靠文本级 guardrail</text><text x="94" y="706.0" font-size="15" font-weight="600" fill="#334155">做事后过滤，实验显示原生防护对间接语义注入的拦截率不到 9%。问题根源在于概率推理与确定性执行之间缺少正式接口：模型</text><text x="94" y="728.0" font-size="15" font-weight="600" fill="#334155">输出是不透明的 token 流，系统无法做细粒度的权限校验和数据流审计。论文借鉴经典操作系统 ISA 的思路，提出在</text><text x="94" y="750.0" font-size="15" font-weight="600" fill="#334155">Agent 运行时建立一层确定性符号内核来封装不可信的 LLM，把安全从&#x27;涌现行为&#x27;变成&#x27;架构属性&#x27;。</text><text x="72" y="836" font-size="14" font-weight="600" fill="#64748B">图示：候选主图不可靠时，自动回退为论文机制总览 SVG。</text></svg>