<svg xmlns="http://www.w3.org/2000/svg" width="1460" height="880" viewBox="0 0 1460 880"><defs><linearGradient id="overviewBg" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#FFFFFF"/><stop offset="100%" stop-color="#F8FAFC"/></linearGradient><linearGradient id="heroBand" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" stop-color="#E0EAFF"/><stop offset="100%" stop-color="#ECFDF5"/></linearGradient><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#64748B"/></marker></defs><rect x="0" y="0" width="1460" height="880" fill="url(#overviewBg)"/><rect x="34" y="32" width="1392" height="816" rx="34" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.4"/><rect x="52" y="50" width="1356" height="164" rx="28" fill="url(#heroBand)" stroke="#D8E6F5" stroke-width="1.2"/><text x="72" y="92" font-size="30" font-weight="800" fill="#0F172A">AutomationBench</text><text x="72" y="126" font-size="15" font-weight="700" fill="#475569">论文核心机制总览</text><rect x="72" y="146" width="920" height="44" rx="22" fill="#FFFFFF" stroke="#C7D2FE" stroke-width="1.2"/><text x="92" y="174" font-size="16" font-weight="700" fill="#3730A3">一句话理解：这是首个同时要求跨应用协调、自主 API 发现和业务策略遵循的 Agent 基准，来自 Zapier 真实工作流模式，前沿模型得分低于 10%，直接暴露当前 Agent 在企业级自动化中的能力瓶颈。</text><rect x="80.0" y="226.0" width="320.0" height="78.0" rx="28" fill="#0F172A" opacity="0.05"/><rect x="72.0" y="216.0" width="320.0" height="78.0" rx="28" fill="#FFF7ED" stroke="#FDBA74" stroke-width="1.6"/><text x="94" y="244.0" font-size="14" font-weight="700" fill="#7C2D12">企业日常工作流常横跨 CRM、邮箱、日历、消息平</text><text x="94" y="262.0" font-size="14" font-weight="700" fill="#7C2D12">台等多个应用，要求 Agent 自行找到正确的</text><text x="94" y="280.0" font-size="14" font-weight="700" fill="#7C2D12">API、遵守组织策略、在干扰数据中定位关键信息…</text><rect x="1076.0" y="226.0" width="320.0" height="78.0" rx="28" fill="#0F172A" opacity="0.05"/><rect x="1068.0" y="216.0" width="320.0" height="78.0" rx="28" fill="#EEF2FF" stroke="#A5B4FC" stroke-width="1.6"/><text x="1090" y="244.0" font-size="14" font-weight="700" fill="#3730A3">这是首个同时要求跨应用协调、自主 API</text><text x="1090" y="262.0" font-size="14" font-weight="700" fill="#3730A3">发现和业务策略遵循的 Agent 基准，来自</text><text x="1090" y="280.0" font-size="14" font-weight="700" fill="#3730A3">Zapier 真实工作流模式，前沿模型得分低于…</text><path d="M 468.0 427.0 C 502.0 427.0, 532.0 427.0, 566.0 427.0" fill="none" stroke="#64748B" stroke-width="4" marker-end="url(#arrow)"/><path d="M 890.0 427.0 C 924.0 427.0, 954.0 427.0, 988.0 427.0" fill="none" stroke="#64748B" stroke-width="4" marker-end="url(#arrow)"/><rect x="176.0" y="328.0" width="300.0" height="218.0" rx="28" fill="#0F172A" opacity="0.05"/><rect x="168.0" y="318.0" width="300.0" height="218.0" rx="28" fill="#FFFFFF" stroke="#60A5FA" stroke-width="1.6"/><rect x="188.0" y="336.0" width="86" height="30" rx="15" fill="#DBEAFE"/><text x="231.0" y="356.0" text-anchor="middle" font-size="12" font-weight="800" fill="#60A5FA">核心模块</text><text x="318.0" y="406.0" text-anchor="middle" font-size="26" font-weight="800" fill="#0F172A">跨应用+API发现+策略遵</text><text x="318.0" y="434.0" text-anchor="middle" font-size="26" font-weight="800" fill="#0F172A">守</text><text x="194.0" y="458.0" font-size="14" font-weight="600" fill="#334155">想象你是一个新入职员工，公司只给</text><text x="194.0" y="476.0" font-size="14" font-weight="600" fill="#334155">你一句话任务描述和一个 API</text><text x="194.0" y="494.0" font-size="14" font-weight="600" fill="#334155">搜索框。你得自己搜出哪些系统有哪</text><text x="194.0" y="512.0" font-size="14" font-weight="600" fill="#334155">些接口，读公司内部政策文档决定…</text><rect x="598.0" y="328.0" width="300.0" height="218.0" rx="28" fill="#0F172A" opacity="0.05"/><rect x="590.0" y="318.0" width="300.0" height="218.0" rx="28" fill="#F0FDF4" stroke="#10B981" stroke-width="1.6"/><rect x="610.0" y="336.0" width="86" height="30" rx="15" fill="#BBF7D0"/><text x="653.0" y="356.0" text-anchor="middle" font-size="12" font-weight="800" fill="#10B981">核心模块</text><text x="740.0" y="406.0" text-anchor="middle" font-size="26" font-weight="800" fill="#0F172A">纯终态评分机制</text><text x="616.0" y="458.0" font-size="14" font-weight="600" fill="#334155">就像企业评估自动化一样——不管你</text><text x="616.0" y="476.0" font-size="14" font-weight="600" fill="#334155">中间怎么折腾，最后邮件发对了没？</text><text x="616.0" y="494.0" font-size="14" font-weight="600" fill="#334155">CRM 里数据对了没？日历改了没</text><text x="616.0" y="512.0" font-size="14" font-weight="600" fill="#334155">？全对才算通过。而且如果你多发…</text><rect x="1020.0" y="328.0" width="300.0" height="218.0" rx="28" fill="#0F172A" opacity="0.05"/><rect x="1012.0" y="318.0" width="300.0" height="218.0" rx="28" fill="#FFF7ED" stroke="#F59E0B" stroke-width="1.6"/><rect x="1032.0" y="336.0" width="86" height="30" rx="15" fill="#FDE68A"/><text x="1075.0" y="356.0" text-anchor="middle" font-size="12" font-weight="800" fill="#F59E0B">核心模块</text><text x="1162.0" y="406.0" text-anchor="middle" font-size="26" font-weight="800" fill="#0F172A">前沿模型均低于10%</text><text x="1038.0" y="458.0" font-size="14" font-weight="600" fill="#334155">最强模型十道题只能做对一道，而且</text><text x="1038.0" y="476.0" font-size="14" font-weight="600" fill="#334155">不同模型擅长完全不同的题目，说明</text><text x="1038.0" y="494.0" font-size="14" font-weight="600" fill="#334155">没有哪个模型有统一的跨应用编排能</text><text x="1038.0" y="512.0" font-size="14" font-weight="600" fill="#334155">力。最让人担忧的是模型常常&#x27;觉…</text><rect x="72" y="614" width="1316" height="190" rx="28" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.3"/><text x="94" y="650" font-size="18" font-weight="800" fill="#0F172A">为什么这篇论文值得放主图</text><text x="94" y="684.0" font-size="15" font-weight="600" fill="#334155">企业日常工作流常横跨 CRM、邮箱、日历、消息平台等多个应用，要求 Agent 自行找到正确的</text><text x="94" y="706.0" font-size="15" font-weight="600" fill="#334155">API、遵守组织策略、在干扰数据中定位关键信息。现有 benchmark（WebArena、AppWorld、τ-b</text><text x="94" y="728.0" font-size="15" font-weight="600" fill="#334155">ench 等）要么局限于单应用，要么不要求自主发现 API，要么缺少业务规则遵循维度。AutomationBench</text><text x="94" y="750.0" font-size="15" font-weight="600" fill="#334155">由 Zapier 团队基于其平台真实客户工作流模式构建，覆盖 6 大业务领域、47 款应用、约 500 个 API</text><text x="94" y="772.0" font-size="15" font-weight="600" fill="#334155">端点，是目前最接近企业真实自动化需求的 Agent 评测基准。</text><text x="72" y="836" font-size="14" font-weight="600" fill="#64748B">图示：候选主图不可靠时，自动回退为论文机制总览 SVG。</text></svg>