<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" font-family="-apple-system,Segoe UI,Arial,sans-serif">
  <rect width="900" height="600" fill="#f7f9fc"/>

  <!-- Title -->
  <text x="450" y="42" text-anchor="middle" font-size="24" font-weight="700" fill="#1a2a44">前沿模型在 AutomationBench 上全部 &lt; 10%</text>
  <text x="450" y="68" text-anchor="middle" font-size="14" fill="#5b6b85">10 道企业自动化任务，最多做对 1 道</text>

  <!-- Bar chart area -->
  <g transform="translate(60,110)">
    <text x="0" y="0" font-size="15" font-weight="600" fill="#1a2a44">通过率对比</text>

    <!-- axis -->
    <line x1="120" y1="30" x2="120" y2="210" stroke="#c9d2e0" stroke-width="1"/>
    <line x1="120" y1="210" x2="430" y2="210" stroke="#c9d2e0" stroke-width="1"/>

    <!-- Opus -->
    <text x="115" y="60" text-anchor="end" font-size="13" fill="#1a2a44">Opus 4.7</text>
    <rect x="120" y="48" width="99" height="20" fill="#4a90e2"/>
    <text x="228" y="63" font-size="13" font-weight="700" fill="#1a2a44">9.9%</text>

    <!-- Gemini -->
    <text x="115" y="110" text-anchor="end" font-size="13" fill="#1a2a44">Gemini 3.1 Pro</text>
    <rect x="120" y="98" width="96" height="20" fill="#50c2a4"/>
    <text x="225" y="113" font-size="13" font-weight="700" fill="#1a2a44">9.6%</text>

    <!-- GPT -->
    <text x="115" y="160" text-anchor="end" font-size="13" fill="#1a2a44">GPT 5.4</text>
    <rect x="120" y="148" width="76" height="20" fill="#f5a623"/>
    <text x="205" y="163" font-size="13" font-weight="700" fill="#1a2a44">7.6%</text>

    <text x="120" y="228" font-size="11" fill="#8a97ad">0%</text>
    <text x="220" y="228" font-size="11" fill="#8a97ad">10%</text>
    <text x="320" y="228" font-size="11" fill="#8a97ad">20%</text>
    <text x="420" y="228" font-size="11" fill="#8a97ad">30%</text>
  </g>

  <!-- Jaccard Venn -->
  <g transform="translate(560,150)">
    <text x="110" y="-10" text-anchor="middle" font-size="15" font-weight="600" fill="#1a2a44">会做的题几乎不重叠</text>
    <circle cx="75" cy="70" r="58" fill="#4a90e2" fill-opacity="0.35" stroke="#4a90e2" stroke-width="2"/>
    <circle cx="145" cy="70" r="58" fill="#50c2a4" fill-opacity="0.35" stroke="#50c2a4" stroke-width="2"/>
    <text x="50" y="75" text-anchor="middle" font-size="13" font-weight="700" fill="#1a2a44">Opus</text>
    <text x="170" y="75" text-anchor="middle" font-size="13" font-weight="700" fill="#1a2a44">Gemini</text>
    <text x="110" y="160" text-anchor="middle" font-size="14" font-weight="700" fill="#d9534f">Jaccard = 0.17</text>
    <text x="110" y="180" text-anchor="middle" font-size="12" fill="#5b6b85">没有通用的跨应用编排能力</text>
  </g>

  <!-- False confidence warning -->
  <g transform="translate(60,380)">
    <rect x="0" y="0" width="370" height="170" rx="10" fill="#fff4e6" stroke="#f5a623" stroke-width="2"/>
    <text x="20" y="32" font-size="16" font-weight="700" fill="#b8650f">⚠ 假自信：最危险的失败</text>
    <text x="20" y="62" font-size="14" fill="#1a2a44">72% 的 Opus 失败任务中，模型宣称"已完成"</text>
    <text x="20" y="88" font-size="14" font-weight="700" fill="#d9534f">→ 实际并未完成</text>
    <text x="20" y="124" font-size="12" fill="#5b6b85">搜索不持久 · 漏处理列表项 ·</text>
    <text x="20" y="144" font-size="12" fill="#5b6b85">指令内容要求被忽略</text>
  </g>

  <!-- API discovery bottleneck -->
  <g transform="translate(460,380)">
    <rect x="0" y="0" width="380" height="170" rx="10" fill="#eaf3ff" stroke="#4a90e2" stroke-width="2"/>
    <text x="20" y="32" font-size="16" font-weight="700" fill="#1a3a6b">API 发现即是瓶颈 (Gemini)</text>

    <!-- step bars -->
    <g transform="translate(20,55)">
      <text x="0" y="12" font-size="12" fill="#1a2a44">默认工具集</text>
      <rect x="140" y="0" width="77" height="16" fill="#a9c4ea"/>
      <text x="225" y="13" font-size="12" font-weight="700" fill="#1a2a44">9.6%</text>

      <text x="0" y="42" font-size="12" fill="#1a2a44">Zapier schema</text>
      <rect x="140" y="30" width="102" height="16" fill="#6ea5e0"/>
      <text x="250" y="43" font-size="12" font-weight="700" fill="#1a2a44">12.8%</text>

      <text x="0" y="72" font-size="12" fill="#1a2a44">精确子集</text>
      <rect x="140" y="60" width="114" height="16" fill="#2f6fbf"/>
      <text x="262" y="73" font-size="12" font-weight="700" fill="#1a2a44">14.3%</text>
    </g>
    <text x="20" y="156" font-size="12" fill="#5b6b85">即便给出对的工具，通过率仍 &lt; 20%</text>
  </g>
</svg>