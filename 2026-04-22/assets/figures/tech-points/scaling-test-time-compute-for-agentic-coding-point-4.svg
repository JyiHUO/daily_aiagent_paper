<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#333"/>
    </marker>
    <linearGradient id="gA" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#e8f1ff"/><stop offset="1" stop-color="#c7dcff"/>
    </linearGradient>
    <linearGradient id="gB" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#fff4d9"/><stop offset="1" stop-color="#ffd98a"/>
    </linearGradient>
    <linearGradient id="gC" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#e4f8e4"/><stop offset="1" stop-color="#a8e6a3"/>
    </linearGradient>
  </defs>

  <text x="480" y="38" text-anchor="middle" font-size="22" font-weight="bold" fill="#1a1a1a">选 → 炼 → 选：Agent 推理时扩展的通用外挂</text>
  <text x="480" y="62" text-anchor="middle" font-size="13" fill="#666">跨 5 大模型一致提升，Terminal-Bench 上最高 +16.2pp</text>

  <!-- Stage 1 -->
  <rect x="40" y="95" width="260" height="315" rx="14" fill="url(#gA)" stroke="#4a7fd6" stroke-width="2"/>
  <text x="170" y="122" text-anchor="middle" font-size="16" font-weight="bold" fill="#1a3c7a">① 并行探索 + 选优</text>
  <text x="170" y="142" text-anchor="middle" font-size="12" fill="#1a3c7a">iteration-0</text>

  <g transform="translate(70,165)">
    <rect width="24" height="32" fill="#6c9bea" rx="3"/>
    <rect x="32" width="24" height="32" fill="#6c9bea" rx="3"/>
    <rect x="64" width="24" height="32" fill="#6c9bea" rx="3"/>
    <rect x="96" width="24" height="32" fill="#6c9bea" rx="3"/>
    <rect x="128" width="24" height="32" fill="#6c9bea" rx="3"/>
    <rect x="160" width="24" height="32" fill="#bfd2f0" rx="3"/>
    <text x="200" y="22" font-size="13" fill="#1a3c7a">…</text>
  </g>
  <text x="170" y="225" text-anchor="middle" font-size="12" fill="#1a3c7a">N=16 条长轨迹</text>

  <rect x="80" y="245" width="180" height="34" rx="6" fill="#fff" stroke="#4a7fd6"/>
  <text x="170" y="267" text-anchor="middle" font-size="13" fill="#1a3c7a">轨迹摘要（压缩噪声）</text>

  <rect x="80" y="295" width="180" height="34" rx="6" fill="#fff" stroke="#4a7fd6"/>
  <text x="170" y="317" text-anchor="middle" font-size="13" fill="#1a3c7a">RTV 锦标赛投票</text>

  <rect x="80" y="355" width="180" height="38" rx="6" fill="#4a7fd6"/>
  <text x="170" y="379" text-anchor="middle" font-size="13" font-weight="bold" fill="#fff">Top-K = 4 优质经验</text>

  <!-- arrow 1->2 -->
  <line x1="305" y1="252" x2="365" y2="252" stroke="#333" stroke-width="2.5" marker-end="url(#ar)"/>

  <!-- Stage 2 -->
  <rect x="370" y="95" width="220" height="315" rx="14" fill="url(#gB)" stroke="#d69a1a" stroke-width="2"/>
  <text x="480" y="122" text-anchor="middle" font-size="16" font-weight="bold" fill="#7a4d0d">② 蒸馏精炼</text>
  <text x="480" y="142" text-anchor="middle" font-size="12" fill="#7a4d0d">PDR as context</text>

  <g transform="translate(395,170)">
    <circle cx="20" cy="20" r="18" fill="#f0b94a"/>
    <circle cx="70" cy="20" r="18" fill="#f0b94a"/>
    <circle cx="120" cy="20" r="18" fill="#f0b94a"/>
    <circle cx="170" cy="20" r="18" fill="#f0b94a"/>
    <text x="20" y="24" text-anchor="middle" font-size="11" fill="#fff">洞察</text>
    <text x="70" y="24" text-anchor="middle" font-size="11" fill="#fff">策略</text>
    <text x="120" y="24" text-anchor="middle" font-size="11" fill="#fff">错因</text>
    <text x="170" y="24" text-anchor="middle" font-size="11" fill="#fff">技巧</text>
  </g>

  <rect x="390" y="240" width="180" height="155" rx="8" fill="#fff" stroke="#d69a1a"/>
  <text x="480" y="266" text-anchor="middle" font-size="13" font-weight="bold" fill="#7a4d0d">融合失败中的碎片</text>
  <text x="480" y="290" text-anchor="middle" font-size="12" fill="#7a4d0d">pass@16 = 0 的任务</text>
  <text x="480" y="310" text-anchor="middle" font-size="12" fill="#7a4d0d">也能拼出新解法</text>
  <line x1="410" y1="330" x2="550" y2="330" stroke="#e0c080" stroke-dasharray="3,3"/>
  <text x="480" y="352" text-anchor="middle" font-size="11" fill="#a66a00">例：gpt2-codegolf</text>
  <text x="480" y="372" text-anchor="middle" font-size="11" fill="#a66a00">16 次全败 → 成功</text>

  <!-- arrow 2->3 -->
  <line x1="595" y1="252" x2="655" y2="252" stroke="#333" stroke-width="2.5" marker-end="url(#ar)"/>

  <!-- Stage 3 -->
  <rect x="660" y="95" width="260" height="315" rx="14" fill="url(#gC)" stroke="#3c8f3c" stroke-width="2"/>
  <text x="790" y="122" text-anchor="middle" font-size="16" font-weight="bold" fill="#1f5c1f">③ 再探索 + 终选</text>
  <text x="790" y="142" text-anchor="middle" font-size="12" fill="#1f5c1f">iteration-1</text>

  <g transform="translate(690,165)">
    <rect width="24" height="32" fill="#5cc55c" rx="3"/>
    <rect x="32" width="24" height="32" fill="#5cc55c" rx="3"/>
    <rect x="64" width="24" height="32" fill="#5cc55c" rx="3"/>
    <rect x="96" width="24" height="32" fill="#5cc55c" rx="3"/>
    <rect x="128" width="24" height="32" fill="#5cc55c" rx="3"/>
    <rect x="160" width="24" height="32" fill="#b7e6b7" rx="3"/>
    <text x="200" y="22" font-size="13" fill="#1f5c1f">…</text>
  </g>
  <text x="790" y="225" text-anchor="middle" font-size="12" fill="#1f5c1f">N=16 新 rollout（带经验）</text>

  <rect x="700" y="245" width="180" height="34" rx="6" fill="#fff" stroke="#3c8f3c"/>
  <text x="790" y="267" text-anchor="middle" font-size="13" fill="#1f5c1f">摘要 + RTV 终选</text>

  <rect x="700" y="340" width="180" height="54" rx="8" fill="#3c8f3c"/>
  <text x="790" y="362" text-anchor="middle" font-size="14" font-weight="bold" fill="#fff">Top-1 最终解</text>
  <text x="790" y="382" text-anchor="middle" font-size="12" fill="#e8ffe8">模型无关的通用层</text>

  <!-- bottom note -->
  <rect x="120" y="440" width="720" height="90" rx="10" fill="#f5f5f5" stroke="#bbb"/>
  <text x="480" y="468" text-anchor="middle" font-size="14" font-weight="bold" fill="#222">核心洞见：长程 Agent 的 test-time scaling = 表示 + 选择 + 复用</text>
  <text x="480" y="493" text-anchor="middle" font-size="12" fill="#444">用摘要压缩嘈杂轨迹，用锦标赛挑优质经验，用经验指导下一轮探索</text>
  <text x="480" y="514" text-anchor="middle" font-size="12" fill="#444">Claude / Gemini / GPT-5 全部受益；任务越长，增益越大</text>
</svg>