<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 620" font-family="'Segoe UI', Arial, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#555"/>
    </marker>
    <marker id="arrowRed" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#d32f2f"/>
    </marker>
    <marker id="arrowGreen" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#2e7d32"/>
    </marker>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f5f7fa"/>
      <stop offset="100%" stop-color="#e8edf2"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="115%" height="115%">
      <feDropShadow dx="2" dy="3" stdDeviation="4" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="900" height="620" rx="16" fill="url(#bgGrad)"/>

  <!-- Title -->
  <text x="450" y="42" text-anchor="middle" font-size="22" font-weight="bold" fill="#1a237e">运行时污点传播与依赖图</text>
  <text x="450" y="66" text-anchor="middle" font-size="13" fill="#666">Taint Propagation &amp; Instruction Dependency Graph</text>

  <!-- ===== SOURCE 1: SEARCH-WEB ===== -->
  <g filter="url(#shadow)">
    <rect x="40" y="110" width="180" height="90" rx="14" fill="#fff3e0" stroke="#ef6c00" stroke-width="2"/>
    <text x="130" y="143" text-anchor="middle" font-size="15" font-weight="bold" fill="#e65100">🌐 SEARCH-WEB</text>
    <rect x="60" y="158" width="140" height="28" rx="6" fill="#ef6c00" opacity="0.15"/>
    <text x="130" y="177" text-anchor="middle" font-size="12" font-weight="600" fill="#bf360c">taint: trust = LOW</text>
  </g>

  <!-- ===== SOURCE 2: READ-FILE ===== -->
  <g filter="url(#shadow)">
    <rect x="40" y="240" width="180" height="90" rx="14" fill="#e8eaf6" stroke="#5c6bc0" stroke-width="2"/>
    <text x="130" y="273" text-anchor="middle" font-size="15" font-weight="bold" fill="#283593">🔑 READ-FILE</text>
    <rect x="60" y="288" width="140" height="28" rx="6" fill="#5c6bc0" opacity="0.15"/>
    <text x="130" y="307" text-anchor="middle" font-size="12" font-weight="600" fill="#1a237e">taint: risk = MED</text>
  </g>

  <!-- ===== IDG (Dependency Graph) center ===== -->
  <g filter="url(#shadow)">
    <rect x="310" y="140" width="240" height="170" rx="18" fill="#ffffff" stroke="#78909c" stroke-width="2" stroke-dasharray="6,3"/>
    <text x="430" y="168" text-anchor="middle" font-size="14" font-weight="bold" fill="#37474f">指令依赖图 (IDG)</text>

    <!-- nodes inside IDG -->
    <circle cx="360" cy="215" r="20" fill="#fff3e0" stroke="#ef6c00" stroke-width="2"/>
    <text x="360" y="220" text-anchor="middle" font-size="11" font-weight="bold" fill="#e65100">S1</text>

    <circle cx="500" cy="215" r="20" fill="#e8eaf6" stroke="#5c6bc0" stroke-width="2"/>
    <text x="500" y="220" text-anchor="middle" font-size="11" font-weight="bold" fill="#283593">S2</text>

    <circle cx="430" cy="280" r="22" fill="#ffebee" stroke="#d32f2f" stroke-width="2.5"/>
    <text x="430" y="285" text-anchor="middle" font-size="11" font-weight="bold" fill="#c62828">合并</text>

    <!-- IDG internal arrows -->
    <line x1="375" y1="230" x2="415" y2="265" stroke="#ef6c00" stroke-width="2" marker-end="url(#arrow)"/>
    <line x1="485" y1="230" x2="445" y2="265" stroke="#5c6bc0" stroke-width="2" marker-end="url(#arrow)"/>
  </g>

  <!-- Arrows from sources to IDG -->
  <path d="M220,155 Q265,155 310,200" fill="none" stroke="#ef6c00" stroke-width="2.5" marker-end="url(#arrow)"/>
  <path d="M220,285 Q265,285 310,260" fill="none" stroke="#5c6bc0" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- ===== SINK: SEND-EMAIL ===== -->
  <g filter="url(#shadow)">
    <rect x="640" y="170" width="210" height="110" rx="16" fill="#ffebee" stroke="#d32f2f" stroke-width="2.5"/>
    <text x="745" y="203" text-anchor="middle" font-size="16" font-weight="bold" fill="#b71c1c">📧 SEND-EMAIL</text>
    <rect x="662" y="215" width="166" height="26" rx="6" fill="#d32f2f" opacity="0.12"/>
    <text x="745" y="233" text-anchor="middle" font-size="12" font-weight="700" fill="#d32f2f">⚠ 高危 Sink</text>
    <text x="745" y="264" text-anchor="middle" font-size="11" fill="#c62828">需污点清洗才可执行</text>
  </g>

  <!-- Arrow from IDG merge to Sink -->
  <path d="M550,280 L620,245" fill="none" stroke="#d32f2f" stroke-width="3" marker-end="url(#arrowRed)" stroke-dasharray="8,4"/>

  <!-- ===== BLOCK / VERIFY Gate ===== -->
  <g filter="url(#shadow)">
    <rect x="560" y="370" width="290" height="130" rx="18" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2.5"/>
    <!-- Shield icon -->
    <text x="590" y="410" font-size="32">🛡️</text>
    <text x="630" y="408" font-size="16" font-weight="bold" fill="#1b5e20">VERIFY 指令 (规范核)</text>
    <text x="705" y="435" text-anchor="middle" font-size="12" fill="#2e7d32">检测到: trust=LOW → Sink</text>
    <rect x="580" y="450" width="250" height="34" rx="8" fill="#c8e6c9"/>
    <text x="705" y="472" text-anchor="middle" font-size="13" font-weight="bold" fill="#1b5e20">❌ 拒绝执行 · 生成策略反馈</text>
  </g>

  <!-- Arrow: Sink blocked down to Verify -->
  <path d="M745,280 L705,370" fill="none" stroke="#2e7d32" stroke-width="3" marker-end="url(#arrowGreen)"/>
  <text x="748" y="330" font-size="12" font-weight="bold" fill="#d32f2f" transform="rotate(-25,748,330)">拦截!</text>

  <!-- ===== Feedback arrow back ===== -->
  <path d="M560,460 C400,500 250,460 130,340" fill="none" stroke="#2e7d32" stroke-width="2" stroke-dasharray="5,4" marker-end="url(#arrowGreen)"/>
  <text x="310" y="478" font-size="12" fill="#2e7d32" font-weight="600">策略反馈 → Agent 重新规划</text>

  <!-- ===== Legend / Key Idea ===== -->
  <g>
    <rect x="40" y="530" width="820" height="68" rx="12" fill="#fff" stroke="#b0bec5" stroke-width="1.5" opacity="0.9"/>
    <text x="60" y="556" font-size="14" font-weight="bold" fill="#1a237e">核心思想：</text>
    <text x="170" y="556" font-size="13" fill="#333">每条数据携带三维污点标签 (trust / confidence / risk)，流经依赖图自动继承；</text>
    <text x="170" y="578" font-size="13" fill="#333">高危 Sink 执行前，内核强制 VERIFY 清洗 —— 安全变成架构属性，而非事后补丁。</text>
  </g>

  <!-- Taint tag illustrations floating -->
  <g opacity="0.7">
    <rect x="52" y="380" width="100" height="22" rx="5" fill="#ef6c00" opacity="0.2"/>
    <text x="102" y="396" text-anchor="middle" font-size="10" fill="#e65100">🏷 trust=LOW</text>
    <rect x="52" y="408" width="100" height="22" rx="5" fill="#5c6bc0" opacity="0.2"/>
    <text x="102" y="424" text-anchor="middle" font-size="10" fill="#283593">🏷 risk=MED</text>
  </g>
</svg>