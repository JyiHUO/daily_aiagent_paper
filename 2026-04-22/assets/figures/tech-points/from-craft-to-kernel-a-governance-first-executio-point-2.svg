<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" font-family="'Helvetica Neue',Arial,sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#444"/>
    </marker>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#c0392b"/>
    </marker>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1e8449"/>
    </marker>
  </defs>

  <rect width="900" height="600" fill="#f7f8fb"/>

  <text x="450" y="38" text-anchor="middle" font-size="22" font-weight="700" fill="#1f2a44">污点传播 + Sink 拦截</text>
  <text x="450" y="62" text-anchor="middle" font-size="13" fill="#666">每条数据带标签，到高危出口前必须过 VERIFY</text>

  <!-- Source 1: Web -->
  <g>
    <rect x="50" y="110" width="200" height="90" rx="10" fill="#fff" stroke="#4a7bd1" stroke-width="2"/>
    <text x="150" y="140" text-anchor="middle" font-size="15" font-weight="700" fill="#1f2a44">SEARCH-WEB</text>
    <text x="150" y="160" text-anchor="middle" font-size="12" fill="#555">外部网页结果</text>
    <rect x="70" y="172" width="160" height="20" rx="10" fill="#fde2e2" stroke="#c0392b"/>
    <text x="150" y="187" text-anchor="middle" font-size="11" fill="#a93226">taint: trust=low</text>
  </g>

  <!-- Source 2: File -->
  <g>
    <rect x="50" y="240" width="200" height="90" rx="10" fill="#fff" stroke="#4a7bd1" stroke-width="2"/>
    <text x="150" y="270" text-anchor="middle" font-size="15" font-weight="700" fill="#1f2a44">READ-FILE</text>
    <text x="150" y="290" text-anchor="middle" font-size="12" fill="#555">本地 API key</text>
    <rect x="70" y="302" width="160" height="20" rx="10" fill="#fff3cd" stroke="#d4912b"/>
    <text x="150" y="317" text-anchor="middle" font-size="11" fill="#8a5a00">taint: risk=medium</text>
  </g>

  <!-- Merge / IDG node -->
  <g>
    <rect x="340" y="175" width="180" height="90" rx="10" fill="#eaf1fb" stroke="#4a7bd1" stroke-width="2"/>
    <text x="430" y="205" text-anchor="middle" font-size="15" font-weight="700" fill="#1f2a44">指令依赖图 IDG</text>
    <text x="430" y="227" text-anchor="middle" font-size="12" fill="#555">污点自动继承</text>
    <text x="430" y="250" text-anchor="middle" font-size="12" fill="#a93226">low + medium</text>
  </g>

  <!-- Arrows sources -> IDG -->
  <path d="M250,170 C295,180 310,195 340,205" stroke="#c0392b" stroke-width="2" fill="none" marker-end="url(#ar)"/>
  <path d="M250,280 C295,265 310,250 340,235" stroke="#d4912b" stroke-width="2" fill="none" marker-end="url(#a)"/>

  <!-- Kernel gate -->
  <g>
    <rect x="575" y="140" width="130" height="160" rx="10" fill="#fffbe6" stroke="#b58900" stroke-width="2" stroke-dasharray="6,4"/>
    <text x="640" y="172" text-anchor="middle" font-size="14" font-weight="700" fill="#8a6d00">符号内核</text>
    <text x="640" y="192" text-anchor="middle" font-size="13" fill="#8a6d00">VERIFY 关卡</text>
    <text x="640" y="238" text-anchor="middle" font-size="30">🛡</text>
    <text x="640" y="275" text-anchor="middle" font-size="11" fill="#555">策略检查 / 清洗 / 审批</text>
  </g>

  <path d="M520,220 L575,220" stroke="#444" stroke-width="2" fill="none" marker-end="url(#a)"/>

  <!-- Sink -->
  <g>
    <rect x="740" y="155" width="130" height="130" rx="10" fill="#fdecea" stroke="#c0392b" stroke-width="2.5"/>
    <text x="805" y="185" text-anchor="middle" font-size="14" font-weight="700" fill="#a93226">SEND-EMAIL</text>
    <text x="805" y="205" text-anchor="middle" font-size="11" fill="#a93226">高危 Sink</text>
    <text x="805" y="255" text-anchor="middle" font-size="26">✉</text>
  </g>

  <!-- Blocked arrow -->
  <path d="M705,220 L740,220" stroke="#c0392b" stroke-width="2.5" fill="none"/>
  <g transform="translate(722,220)">
    <circle r="14" fill="#c0392b"/>
    <line x1="-7" y1="-7" x2="7" y2="7" stroke="#fff" stroke-width="3"/>
    <line x1="-7" y1="7" x2="7" y2="-7" stroke="#fff" stroke-width="3"/>
  </g>
  <text x="722" y="258" text-anchor="middle" font-size="12" font-weight="700" fill="#c0392b">拦截</text>

  <!-- Feedback loop: Kernel -> back to IDG -->
  <path d="M640,300 C640,400 430,410 430,275" stroke="#1e8449" stroke-width="2" fill="none" stroke-dasharray="6,4" marker-end="url(#ag)"/>
  <text x="535" y="400" text-anchor="middle" font-size="12" fill="#1e8449" font-weight="600">策略反馈 → Agent 重新规划（剔除密钥）</text>

  <!-- Bottom summary -->
  <g>
    <rect x="80" y="475" width="740" height="90" rx="10" fill="#ffffff" stroke="#d0d7e2"/>
    <text x="110" y="500" font-size="13" font-weight="700" fill="#1f2a44">三维污点标签</text>
    <rect x="110" y="515" width="70" height="22" rx="11" fill="#fde2e2" stroke="#c0392b"/>
    <text x="145" y="531" text-anchor="middle" font-size="11" fill="#a93226">trust</text>
    <rect x="190" y="515" width="90" height="22" rx="11" fill="#fff3cd" stroke="#d4912b"/>
    <text x="235" y="531" text-anchor="middle" font-size="11" fill="#8a5a00">confidence</text>
    <rect x="290" y="515" width="60" height="22" rx="11" fill="#e8f4ea" stroke="#1e8449"/>
    <text x="320" y="531" text-anchor="middle" font-size="11" fill="#1e8449">risk</text>

    <line x1="400" y1="490" x2="400" y2="555" stroke="#d0d7e2"/>

    <text x="430" y="500" font-size="13" font-weight="700" fill="#1f2a44">安全从涌现变成架构属性</text>
    <text x="430" y="522" font-size="12" fill="#555">• 污点随数据流自动传播</text>
    <text x="430" y="542" font-size="12" fill="#555">• Sink 前强制 VERIFY，否则拒绝执行</text>
  </g>
</svg>