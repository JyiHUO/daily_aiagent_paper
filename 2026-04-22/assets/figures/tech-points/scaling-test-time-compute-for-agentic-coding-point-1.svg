<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#2b6cb0"/>
    </marker>
    <marker id="arrP" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#6b46c1"/>
    </marker>
  </defs>

  <rect width="900" height="560" fill="#f7fafc"/>

  <text x="450" y="40" text-anchor="middle" font-size="22" font-weight="bold" fill="#1a202c">把冗长 Agent 轨迹 → 压缩成结构化摘要</text>
  <text x="450" y="64" text-anchor="middle" font-size="13" fill="#4a5568">统一接口，服务于选择与精炼</text>

  <!-- Left: raw trajectory -->
  <rect x="40" y="110" width="260" height="380" rx="8" fill="#fff5f5" stroke="#c53030" stroke-width="2"/>
  <text x="170" y="138" text-anchor="middle" font-size="15" font-weight="bold" fill="#9b2c2c">原始轨迹 R（40+ 步）</text>

  <g font-size="11.5" fill="#742a2a" font-family="Menlo, monospace">
    <text x="58" y="172">$ ls django/db/models/</text>
    <text x="58" y="194">$ grep filter query.py</text>
    <text x="58" y="216">$ vim query.py   # edit</text>
    <text x="58" y="238">$ pytest tests/queries</text>
    <text x="58" y="260" fill="#c53030">FAIL: test_regression_17</text>
    <text x="58" y="282">$ vim query.py   # redo</text>
    <text x="58" y="304">$ pytest -k filter</text>
    <text x="58" y="326" fill="#2f855a">PASS (target)</text>
    <text x="58" y="358" fill="#a0aec0">... 数百行重复输出</text>
    <text x="58" y="380" fill="#a0aec0">... 无效探索与回退</text>
  </g>
  <text x="170" y="460" text-anchor="middle" font-size="11" fill="#9b2c2c" font-style="italic">冗长、嘈杂、难以直接比较</text>

  <!-- Arrow + prompt -->
  <line x1="305" y1="300" x2="405" y2="300" stroke="#2b6cb0" stroke-width="3" marker-end="url(#arr)"/>
  <rect x="312" y="262" width="86" height="28" rx="6" fill="#2b6cb0"/>
  <text x="355" y="281" text-anchor="middle" font-size="13" fill="#fff" font-weight="bold">P_sum</text>

  <!-- Right: summary -->
  <rect x="410" y="110" width="320" height="380" rx="8" fill="#f0fff4" stroke="#2f855a" stroke-width="2"/>
  <text x="570" y="138" text-anchor="middle" font-size="15" font-weight="bold" fill="#22543d">紧凑摘要 S</text>

  <g font-size="12.5" fill="#1a202c">
    <text x="430" y="176" font-weight="bold" fill="#2b6cb0">假设</text>
    <text x="430" y="196">问题出在 QuerySet.filter</text>

    <text x="430" y="232" font-weight="bold" fill="#2b6cb0">进展</text>
    <text x="430" y="252">定位 query.py:234</text>

    <text x="430" y="288" font-weight="bold" fill="#c05621">失败模式</text>
    <text x="430" y="308">首次修改 → 回归测试失败</text>

    <text x="430" y="344" font-weight="bold" fill="#2f855a">最终状态</text>
    <text x="430" y="364">目标测试通过，完整套件未验证</text>
  </g>
  <text x="570" y="460" text-anchor="middle" font-size="11" fill="#22543d" font-style="italic">保留关键信号，丢弃低价值细节</text>

  <!-- Downstream uses -->
  <rect x="760" y="160" width="110" height="90" rx="8" fill="#ebf8ff" stroke="#2b6cb0" stroke-width="2"/>
  <text x="815" y="192" text-anchor="middle" font-size="14" font-weight="bold" fill="#2c5282">RTV</text>
  <text x="815" y="212" text-anchor="middle" font-size="11" fill="#2c5282">并行选择</text>
  <text x="815" y="229" text-anchor="middle" font-size="11" fill="#2c5282">锦标赛投票</text>

  <rect x="760" y="350" width="110" height="90" rx="8" fill="#faf5ff" stroke="#6b46c1" stroke-width="2"/>
  <text x="815" y="382" text-anchor="middle" font-size="14" font-weight="bold" fill="#44337a">PDR</text>
  <text x="815" y="402" text-anchor="middle" font-size="11" fill="#44337a">顺序精炼</text>
  <text x="815" y="419" text-anchor="middle" font-size="11" fill="#44337a">蒸馏复用</text>

  <line x1="732" y1="240" x2="758" y2="210" stroke="#2b6cb0" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="732" y1="360" x2="758" y2="390" stroke="#6b46c1" stroke-width="2" marker-end="url(#arrP)"/>

  <text x="450" y="525" text-anchor="middle" font-size="12" fill="#4a5568" font-style="italic">在摘要上比较 rollout，优于在原始轨迹上比较（所有模型 &amp; benchmark）</text>
</svg>