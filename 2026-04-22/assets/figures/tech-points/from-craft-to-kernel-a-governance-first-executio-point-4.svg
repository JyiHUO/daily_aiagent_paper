<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#333"/>
    </marker>
    <linearGradient id="budget" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0%" stop-color="#5fb878"/>
      <stop offset="50%" stop-color="#f5c542"/>
      <stop offset="100%" stop-color="#e4572e"/>
    </linearGradient>
  </defs>

  <!-- Title -->
  <text x="450" y="40" text-anchor="middle" font-size="24" font-weight="bold" fill="#1a1a1a">治理税：按风险付费的安全检查</text>
  <text x="450" y="65" text-anchor="middle" font-size="13" fill="#666">低危操作轻检查，高危操作重审查 — 共享同一个可靠性预算</text>

  <!-- Budget bar -->
  <text x="80" y="108" font-size="13" fill="#333" font-weight="bold">可靠性预算（成本 / 延迟）</text>
  <rect x="80" y="118" width="740" height="18" rx="4" fill="url(#budget)" opacity="0.85"/>
  <text x="95" y="132" font-size="12" fill="#fff" font-weight="bold">低成本</text>
  <text x="760" y="132" font-size="12" fill="#fff" font-weight="bold">高成本</text>

  <!-- Scenario 1: search -->
  <g>
    <rect x="60" y="185" width="240" height="175" rx="10" fill="#eaf6ee" stroke="#5fb878" stroke-width="2"/>
    <text x="180" y="212" text-anchor="middle" font-size="14" font-weight="bold" fill="#2d7a43">SEARCH-WEB 查股价</text>
    <circle cx="110" cy="258" r="24" fill="#5fb878"/>
    <text x="110" y="264" text-anchor="middle" font-size="16" font-weight="bold" fill="#fff">L1</text>
    <text x="150" y="252" font-size="12" fill="#333">正则 / 类型检查</text>
    <text x="150" y="270" font-size="11" fill="#888">≈ 微秒级</text>
    <text x="180" y="330" text-anchor="middle" font-size="12" fill="#2d7a43">低危 · 几乎零开销</text>
  </g>

  <!-- Scenario 2: generate -->
  <g>
    <rect x="330" y="185" width="240" height="175" rx="10" fill="#fff8e1" stroke="#f5c542" stroke-width="2"/>
    <text x="450" y="212" text-anchor="middle" font-size="14" font-weight="bold" fill="#8a6a00">GENERATE 分析趋势</text>
    <circle cx="380" cy="258" r="24" fill="#c9c9c9"/>
    <text x="380" y="264" text-anchor="middle" font-size="16" font-weight="bold" fill="#fff">L0</text>
    <text x="420" y="252" font-size="12" fill="#333">直通</text>
    <text x="420" y="270" font-size="11" fill="#888">无额外检查</text>
    <text x="450" y="330" text-anchor="middle" font-size="12" fill="#8a6a00">纯推理 · 无副作用</text>
  </g>

  <!-- Scenario 3: execute trade -->
  <g>
    <rect x="600" y="185" width="240" height="175" rx="10" fill="#fdecea" stroke="#e4572e" stroke-width="2"/>
    <text x="720" y="212" text-anchor="middle" font-size="14" font-weight="bold" fill="#a8321a">TOOL-CALL 执行交易</text>
    <circle cx="650" cy="258" r="24" fill="#e4572e"/>
    <text x="650" y="264" text-anchor="middle" font-size="16" font-weight="bold" fill="#fff">L3</text>
    <text x="690" y="252" font-size="12" fill="#333">前沿模型判官</text>
    <text x="690" y="270" font-size="11" fill="#888">可升级 L4 人审</text>
    <text x="720" y="330" text-anchor="middle" font-size="12" fill="#a8321a">高危 Sink · 付费审查</text>
  </g>

  <!-- Budget consumption arrows -->
  <path d="M180,185 L180,142" stroke="#5fb878" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <path d="M450,185 L450,142" stroke="#b0b0b0" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <path d="M720,185 L720,142" stroke="#e4572e" stroke-width="3" fill="none" marker-end="url(#arrow)"/>

  <!-- Bottom: kernel decision -->
  <rect x="160" y="425" width="580" height="110" rx="12" fill="#1f2b3a" stroke="#0d1520" stroke-width="2"/>
  <text x="450" y="458" text-anchor="middle" font-size="16" font-weight="bold" fill="#fff">Arbiter-K 内核：动态选择治理等级</text>
  <text x="450" y="484" text-anchor="middle" font-size="12" fill="#9ecbff">危险等级 + 剩余预算 → 自动匹配 L0 ~ L4</text>
  <text x="450" y="508" text-anchor="middle" font-size="12" fill="#ffd08a">把有限的安全资源，花在真正危险的那一步</text>

  <!-- arrows from scenarios to kernel -->
  <path d="M180,360 L310,425" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <path d="M450,360 L450,425" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <path d="M720,360 L590,425" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
</svg>