<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" font-family="'Helvetica Neue',Arial,sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#333"/>
    </marker>
    <linearGradient id="gRed" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#ffe3e3"/><stop offset="1" stop-color="#ffb4b4"/>
    </linearGradient>
    <linearGradient id="gGreen" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#d9f5e1"/><stop offset="1" stop-color="#8fd8a4"/>
    </linearGradient>
  </defs>

  <!-- Title -->
  <text x="450" y="36" text-anchor="middle" font-size="22" font-weight="700" fill="#1a1a1a">
    Arbiter-K: 一套策略, 跨框架跨模型都能挡住攻击
  </text>
  <text x="450" y="60" text-anchor="middle" font-size="13" fill="#666">
    2 个框架 · 4 个 LLM · 1914 条攻击用例
  </text>

  <!-- Left: Native -->
  <g>
    <rect x="60" y="100" width="340" height="200" rx="12" fill="url(#gRed)" stroke="#d94848" stroke-width="2"/>
    <text x="230" y="132" text-anchor="middle" font-size="17" font-weight="700" fill="#8a1d1d">原生防护 (Native)</text>
    <text x="230" y="154" text-anchor="middle" font-size="12" fill="#8a1d1d">文本级 guardrail, 事后过滤</text>

    <!-- Bar chart -->
    <rect x="100" y="200" width="260" height="28" fill="#fff" stroke="#d94848"/>
    <rect x="100" y="200" width="24" height="28" fill="#d94848"/>
    <text x="110" y="220" font-size="13" font-weight="700" fill="#d94848">攻击拦截率</text>
    <text x="370" y="220" text-anchor="end" font-size="13" font-weight="700" fill="#8a1d1d">9%</text>

    <text x="230" y="275" text-anchor="middle" font-size="13" fill="#8a1d1d">⚠ 几乎挡不住语义注入攻击 (0%–9%)</text>
  </g>

  <!-- Arrow -->
  <line x1="410" y1="200" x2="490" y2="200" stroke="#333" stroke-width="3" marker-end="url(#arr)"/>
  <text x="450" y="190" text-anchor="middle" font-size="13" font-weight="700" fill="#333">+Arbiter-K</text>

  <!-- Right: Arbiter-K -->
  <g>
    <rect x="500" y="100" width="340" height="200" rx="12" fill="url(#gGreen)" stroke="#2a8a4a" stroke-width="2"/>
    <text x="670" y="132" text-anchor="middle" font-size="17" font-weight="700" fill="#1d5a30">Arbiter-K 符号内核</text>
    <text x="670" y="154" text-anchor="middle" font-size="12" fill="#1d5a30">语义 ISA + 污点传播 + 策略检查</text>

    <rect x="540" y="200" width="260" height="28" fill="#fff" stroke="#2a8a4a"/>
    <rect x="540" y="200" width="247" height="28" fill="#2a8a4a"/>
    <text x="550" y="220" font-size="13" font-weight="700" fill="#fff">攻击拦截率</text>
    <text x="795" y="220" text-anchor="end" font-size="13" font-weight="700" fill="#fff">95%</text>

    <text x="670" y="268" text-anchor="middle" font-size="13" fill="#1d5a30">✓ 攻击拦截率 76% – 95%</text>
    <text x="670" y="288" text-anchor="middle" font-size="13" fill="#1d5a30">✓ 良性操作通过 89% – 99%</text>
  </g>

  <!-- Bottom: transferability -->
  <g>
    <rect x="60" y="350" width="780" height="170" rx="12" fill="#f3f6fb" stroke="#3366aa" stroke-width="1.5"/>
    <text x="450" y="380" text-anchor="middle" font-size="16" font-weight="700" fill="#1a3b6e">
      同一套语义策略 → 直接迁移到新框架
    </text>

    <!-- OpenClaw box -->
    <rect x="110" y="410" width="220" height="80" rx="8" fill="#fff" stroke="#3366aa"/>
    <text x="220" y="435" text-anchor="middle" font-size="14" font-weight="700" fill="#1a3b6e">OpenClaw</text>
    <text x="220" y="458" text-anchor="middle" font-size="12" fill="#333">拦截 4.6% → 93%</text>
    <text x="220" y="476" text-anchor="middle" font-size="12" fill="#333">(Claude 3.5 Sonnet)</text>

    <!-- Arrow -->
    <line x1="340" y1="450" x2="560" y2="450" stroke="#1a3b6e" stroke-width="2.5" marker-end="url(#arr)" stroke-dasharray="6 4"/>
    <text x="450" y="442" text-anchor="middle" font-size="12" font-weight="700" fill="#1a3b6e">策略零改动迁移</text>

    <!-- NanoBot box -->
    <rect x="570" y="410" width="220" height="80" rx="8" fill="#fff" stroke="#3366aa"/>
    <text x="680" y="435" text-anchor="middle" font-size="14" font-weight="700" fill="#1a3b6e">NanoBot</text>
    <text x="680" y="458" text-anchor="middle" font-size="12" fill="#333">拦截 1.4% → 93%</text>
    <text x="680" y="476" text-anchor="middle" font-size="12" fill="#333">良性通过率 99%</text>
  </g>
</svg>