<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" font-family="'Segoe UI', Arial, sans-serif">
  <defs>
    <marker id="arr" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#555"/>
    </marker>
    <marker id="arrRed" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#e74c3c"/>
    </marker>
    <marker id="arrGreen" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#27ae60"/>
    </marker>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f8f9fb"/>
      <stop offset="100%" stop-color="#e8ecf1"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="900" height="520" fill="url(#bgGrad)" rx="12"/>

  <!-- Title -->
  <text x="450" y="38" text-anchor="middle" font-size="22" font-weight="bold" fill="#2c3e50">策略反馈与上下文复用：精确刹车，而非全量重跑</text>

  <!-- ===== LEFT: Traditional (Bad) ===== -->
  <text x="220" y="72" text-anchor="middle" font-size="16" font-weight="bold" fill="#c0392b">❌ 传统方式</text>

  <!-- Steps 1-3 block -->
  <rect x="50" y="88" width="340" height="180" rx="10" fill="#fff" stroke="#ddd" stroke-width="1.5"/>

  <!-- Step 1 -->
  <rect x="75" y="102" width="120" height="36" rx="6" fill="#d5f5e3" stroke="#27ae60" stroke-width="1.5"/>
  <text x="135" y="125" text-anchor="middle" font-size="13" fill="#1e8449" font-weight="bold">Step 1 ✓</text>

  <!-- Step 2 -->
  <rect x="210" y="102" width="120" height="36" rx="6" fill="#d5f5e3" stroke="#27ae60" stroke-width="1.5"/>
  <text x="270" y="125" text-anchor="middle" font-size="13" fill="#1e8449" font-weight="bold">Step 2 ✓</text>

  <!-- Step 3 violation -->
  <rect x="140" y="155" width="150" height="40" rx="6" fill="#fadbd8" stroke="#e74c3c" stroke-width="2"/>
  <text x="215" y="172" text-anchor="middle" font-size="13" fill="#c0392b" font-weight="bold">Step 3 ⛔ 违规</text>
  <text x="215" y="187" text-anchor="middle" font-size="10" fill="#c0392b">delete-file</text>

  <!-- Big red X over everything -->
  <line x1="60" y1="205" x2="380" y2="205" stroke="#e74c3c" stroke-width="2" stroke-dasharray="6,4"/>

  <!-- Trash icon / discard -->
  <text x="220" y="232" text-anchor="middle" font-size="28">🗑️</text>
  <text x="220" y="260" text-anchor="middle" font-size="13" fill="#e74c3c" font-weight="bold">全部丢弃，从头重跑</text>

  <!-- Token waste label -->
  <rect x="120" y="268" width="200" height="28" rx="5" fill="#e74c3c" opacity="0.12"/>
  <text x="220" y="287" text-anchor="middle" font-size="12" fill="#c0392b">浪费 ~1500+ tokens</text>

  <!-- ===== RIGHT: Arbiter-K (Good) ===== -->
  <text x="670" y="72" text-anchor="middle" font-size="16" font-weight="bold" fill="#27ae60">✅ Arbiter-K 方式</text>

  <rect x="500" y="88" width="370" height="295" rx="10" fill="#fff" stroke="#ddd" stroke-width="1.5"/>

  <!-- Step 1 preserved -->
  <rect x="525" y="102" width="120" height="36" rx="6" fill="#d5f5e3" stroke="#27ae60" stroke-width="1.5"/>
  <text x="585" y="125" text-anchor="middle" font-size="13" fill="#1e8449" font-weight="bold">Step 1 ✓</text>

  <!-- Step 2 preserved -->
  <rect x="660" y="102" width="120" height="36" rx="6" fill="#d5f5e3" stroke="#27ae60" stroke-width="1.5"/>
  <text x="720" y="125" text-anchor="middle" font-size="13" fill="#1e8449" font-weight="bold">Step 2 ✓</text>

  <!-- Preserved bracket -->
  <rect x="518" y="95" width="268" height="50" rx="8" fill="none" stroke="#27ae60" stroke-width="2" stroke-dasharray="5,3"/>
  <text x="652" y="160" text-anchor="middle" font-size="11" fill="#27ae60" font-weight="bold">✅ 保留（~90% 前缀 token）</text>

  <!-- Step 3 intercepted -->
  <rect x="580" y="175" width="150" height="40" rx="6" fill="#fadbd8" stroke="#e74c3c" stroke-width="2"/>
  <text x="655" y="192" text-anchor="middle" font-size="13" fill="#c0392b" font-weight="bold">Step 3 ⛔ 拦截</text>
  <text x="655" y="207" text-anchor="middle" font-size="10" fill="#c0392b">delete-file</text>

  <!-- Arrow down to policy feedback -->
  <line x1="655" y1="215" x2="655" y2="238" stroke="#e74c3c" stroke-width="2" marker-end="url(#arrRed)"/>

  <!-- Policy feedback bubble -->
  <rect x="535" y="242" width="300" height="58" rx="10" fill="#fef9e7" stroke="#f39c12" stroke-width="2"/>
  <text x="685" y="262" text-anchor="middle" font-size="12" fill="#7d6608" font-weight="bold">📋 策略反馈注入（~250-303 tokens）</text>
  <text x="685" y="280" text-anchor="middle" font-size="11" fill="#7d6608">"delete-file 违反文件保护策略，</text>
  <text x="685" y="294" text-anchor="middle" font-size="11" fill="#7d6608">请仅执行 summarize"</text>

  <!-- Arrow to resumed step -->
  <line x1="655" y1="300" x2="655" y2="328" stroke="#27ae60" stroke-width="2" marker-end="url(#arrGreen)"/>

  <!-- Resumed execution -->
  <rect x="570" y="332" width="170" height="38" rx="8" fill="#d4efdf" stroke="#27ae60" stroke-width="2"/>
  <text x="655" y="350" text-anchor="middle" font-size="13" fill="#1e8449" font-weight="bold">Step 3' ▶ 继续执行</text>
  <text x="655" y="365" text-anchor="middle" font-size="10" fill="#1e8449">summarize（纠正后）</text>

  <!-- ===== Bottom comparison bar ===== -->
  <rect x="50" y="410" width="800" height="95" rx="12" fill="#2c3e50" opacity="0.06"/>

  <!-- Left stat -->
  <rect x="80" y="425" width="160" height="60" rx="8" fill="#fadbd8" stroke="#e74c3c" stroke-width="1.5"/>
  <text x="160" y="450" text-anchor="middle" font-size="13" fill="#c0392b" font-weight="bold">传统</text>
  <text x="160" y="472" text-anchor="middle" font-size="12" fill="#c0392b">0% 上下文复用</text>

  <!-- Middle arrow -->
  <text x="300" y="460" text-anchor="middle" font-size="28" fill="#555">→</text>

  <!-- Right stat -->
  <rect x="350" y="425" width="230" height="60" rx="8" fill="#d5f5e3" stroke="#27ae60" stroke-width="1.5"/>
  <text x="465" y="450" text-anchor="middle" font-size="13" fill="#1e8449" font-weight="bold">Arbiter-K</text>
  <text x="465" y="472" text-anchor="middle" font-size="12" fill="#1e8449">58-74% 上下文可复用</text>

  <!-- Analogy -->
  <rect x="620" y="425" width="210" height="60" rx="8" fill="#eaf2f8" stroke="#5b9bd5" stroke-width="1.5"/>
  <text x="725" y="448" text-anchor="middle" font-size="12" fill="#2471a3" font-weight="bold">💡 类比</text>
  <text x="725" y="466" text-anchor="middle" font-size="11" fill="#2471a3">像编译器报错只回退到出错行</text>
  <text x="725" y="480" text-anchor="middle" font-size="11" fill="#2471a3">不删整个源文件</text>
</svg>