<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 620" font-family="-apple-system,Helvetica,Arial,sans-serif">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#333"/>
    </marker>
    <marker id="arRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#d94c4c"/>
    </marker>
    <marker id="arGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#2a8a4a"/>
    </marker>
  </defs>

  <text x="450" y="34" text-anchor="middle" font-size="22" font-weight="700" fill="#1a1a1a">拦截即"架构异常"：只回退违规那一步</text>
  <text x="450" y="58" text-anchor="middle" font-size="13" fill="#666">像编译器报错只回退出错行，不是删掉整个源文件重写</text>

  <!-- Top: Traditional -->
  <g>
    <text x="60" y="100" font-size="14" font-weight="700" fill="#b23232">❌ 传统做法：检测违规 → 整段重跑</text>
    <g font-size="12">
      <rect x="60"  y="115" width="80" height="36" rx="5" fill="#f3d6d6" stroke="#b23232"/>
      <text x="100" y="138" text-anchor="middle" fill="#333">Step 1 ✓</text>
      <rect x="150" y="115" width="80" height="36" rx="5" fill="#f3d6d6" stroke="#b23232"/>
      <text x="190" y="138" text-anchor="middle" fill="#333">Step 2 ✓</text>
      <rect x="240" y="115" width="80" height="36" rx="5" fill="#f3d6d6" stroke="#b23232"/>
      <text x="280" y="138" text-anchor="middle" fill="#333">Step 3 ✗</text>
      <rect x="330" y="115" width="160" height="36" rx="5" fill="#fff" stroke="#b23232" stroke-dasharray="4 3"/>
      <text x="410" y="138" text-anchor="middle" fill="#888">... Step 18 丢弃</text>
    </g>
    <path d="M500 133 L560 133" stroke="#b23232" stroke-width="2" marker-end="url(#arRed)"/>
    <g>
      <rect x="565" y="108" width="270" height="50" rx="6" fill="#fff1f1" stroke="#b23232" stroke-width="1.5"/>
      <text x="700" y="128" text-anchor="middle" font-size="13" fill="#b23232" font-weight="700">从头重跑，token 全部浪费</text>
      <text x="700" y="146" text-anchor="middle" font-size="11" fill="#888">1561 tokens 扔掉</text>
    </g>
  </g>

  <!-- Divider -->
  <line x1="60" y1="195" x2="840" y2="195" stroke="#ddd" stroke-dasharray="5 4"/>

  <!-- Bottom: Arbiter-K -->
  <text x="60" y="228" font-size="14" font-weight="700" fill="#2a8a4a">✅ Arbiter-K：精确刹车 + 策略反馈注入</text>

  <!-- Retained prefix -->
  <g font-size="12">
    <rect x="60"  y="250" width="80" height="40" rx="5" fill="#d6ecd9" stroke="#2a8a4a"/>
    <text x="100" y="275" text-anchor="middle" fill="#1a1a1a">Step 1 ✓</text>
    <rect x="150" y="250" width="80" height="40" rx="5" fill="#d6ecd9" stroke="#2a8a4a"/>
    <text x="190" y="275" text-anchor="middle" fill="#1a1a1a">Step 2 ✓</text>
  </g>
  <text x="145" y="308" text-anchor="middle" font-size="11" fill="#2a8a4a">前缀保留（89–90% tokens）</text>

  <!-- Violation step -->
  <g>
    <rect x="255" y="245" width="110" height="50" rx="6" fill="#ffe2c2" stroke="#d98a2a" stroke-width="2"/>
    <text x="310" y="268" text-anchor="middle" font-size="13" font-weight="700" fill="#a35a0a">Step 3 ✗</text>
    <text x="310" y="285" text-anchor="middle" font-size="11" fill="#a35a0a">delete-file 拦截</text>
  </g>

  <!-- Kernel -->
  <path d="M365 270 L398 270" stroke="#333" stroke-width="1.6" marker-end="url(#ar)"/>
  <g>
    <rect x="400" y="235" width="180" height="70" rx="8" fill="#eef2ff" stroke="#3a4fb8" stroke-width="2"/>
    <text x="490" y="258" text-anchor="middle" font-size="13" font-weight="700" fill="#1a2a7a">Arbiter-K 符号内核</text>
    <text x="490" y="278" text-anchor="middle" font-size="11" fill="#333">提取失败签名</text>
    <text x="490" y="294" text-anchor="middle" font-size="11" fill="#333">生成策略反馈（~250–303 tok）</text>
  </g>

  <!-- Feedback message -->
  <path d="M580 270 L618 270" stroke="#333" stroke-width="1.6" marker-end="url(#ar)"/>
  <g>
    <rect x="620" y="235" width="220" height="70" rx="8" fill="#fff9d6" stroke="#b39a1a" stroke-width="1.6"/>
    <text x="730" y="258" text-anchor="middle" font-size="12" font-weight="700" fill="#6a5a0a">📨 策略反馈消息</text>
    <text x="730" y="278" text-anchor="middle" font-size="11" fill="#333">"第3步违反文件保护策略，</text>
    <text x="730" y="293" text-anchor="middle" font-size="11" fill="#333">请仅执行 summarize"</text>
  </g>

  <!-- Loop back arrow: feedback -> resumed Step 3' -->
  <path d="M730 305 Q 730 355 520 355 Q 310 355 310 378" fill="none" stroke="#2a8a4a" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arGreen)"/>
  <text x="520" y="348" text-anchor="middle" font-size="12" fill="#2a8a4a" font-weight="600">注入对话，Agent 换方式继续</text>

  <!-- Resumed step -->
  <g>
    <rect x="255" y="380" width="110" height="44" rx="6" fill="#d6ecd9" stroke="#2a8a4a" stroke-width="2"/>
    <text x="310" y="400" text-anchor="middle" font-size="12" font-weight="700" fill="#1a5a2a">Step 3′</text>
    <text x="310" y="416" text-anchor="middle" font-size="11" fill="#1a5a2a">summarize ✓</text>
  </g>
  <path d="M365 402 L408 402" stroke="#2a8a4a" stroke-width="1.6" marker-end="url(#arGreen)"/>
  <rect x="410" y="382" width="80" height="40" rx="5" fill="#d6ecd9" stroke="#2a8a4a"/>
  <text x="450" y="407" text-anchor="middle" font-size="12">Step 4 ✓</text>
  <text x="540" y="407" font-size="13" fill="#333">… 继续执行</text>

  <!-- Bottom stats -->
  <g>
    <rect x="60" y="470" width="780" height="120" rx="10" fill="#f7f9fc" stroke="#c9d3e4"/>
    <text x="450" y="498" text-anchor="middle" font-size="14" font-weight="700" fill="#1a2a7a">上下文复用效果</text>

    <g transform="translate(90,515)">
      <rect x="0" y="0" width="220" height="60" rx="6" fill="#fff" stroke="#3a4fb8"/>
      <text x="110" y="22" text-anchor="middle" font-size="12" fill="#666">Agent-SafetyBench 复用</text>
      <text x="110" y="50" text-anchor="middle" font-size="24" font-weight="700" fill="#2a8a4a">73.8%</text>
    </g>

    <g transform="translate(340,515)">
      <rect x="0" y="0" width="220" height="60" rx="6" fill="#fff" stroke="#3a4fb8"/>
      <text x="110" y="22" text-anchor="middle" font-size="12" fill="#666">AgentDojo 复用</text>
      <text x="110" y="50" text-anchor="middle" font-size="24" font-weight="700" fill="#2a8a4a">58.3%</text>
    </g>

    <g transform="translate(590,515)">
      <rect x="0" y="0" width="220" height="60" rx="6" fill="#fff" stroke="#3a4fb8"/>
      <text x="110" y="22" text-anchor="middle" font-size="12" fill="#666">拦截通常发生在</text>
      <text x="110" y="50" text-anchor="middle" font-size="24" font-weight="700" fill="#d98a2a">Step 2–3</text>
    </g>
  </g>
</svg>