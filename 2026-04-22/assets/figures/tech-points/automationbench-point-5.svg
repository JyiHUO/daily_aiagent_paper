<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#333"/>
    </marker>
    <marker id="arG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#2e7d32"/>
    </marker>
    <marker id="arR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#c62828"/>
    </marker>
  </defs>

  <text x="450" y="38" text-anchor="middle" font-size="22" font-weight="700" fill="#111">开卷验证：题目本身是否可解？</text>
  <text x="450" y="62" text-anchor="middle" font-size="13" fill="#666">给小模型一张 hint sheet，若能做对 → 证明任务无 bug，失败只因 Agent 能力不足</text>

  <!-- Task -->
  <rect x="40" y="230" width="160" height="110" rx="10" fill="#eef3ff" stroke="#3b5bdb" stroke-width="2"/>
  <text x="120" y="260" text-anchor="middle" font-size="15" font-weight="700" fill="#1e3a8a">Task</text>
  <text x="120" y="285" text-anchor="middle" font-size="11" fill="#333">跨应用业务流</text>
  <text x="120" y="305" text-anchor="middle" font-size="11" fill="#333">~500 个 API 端点</text>
  <text x="120" y="325" text-anchor="middle" font-size="11" fill="#333">Zoom / Calendar / ...</text>

  <!-- Branch A: no hint -->
  <rect x="290" y="100" width="280" height="150" rx="10" fill="#fff4f4" stroke="#c62828" stroke-width="2"/>
  <text x="430" y="128" text-anchor="middle" font-size="15" font-weight="700" fill="#b71c1c">闭卷：正常评测</text>
  <text x="430" y="154" text-anchor="middle" font-size="12" fill="#333">Agent 自己发现 API + 推参数</text>
  <text x="430" y="174" text-anchor="middle" font-size="12" fill="#333">前沿模型通过率</text>
  <text x="430" y="210" text-anchor="middle" font-size="32" font-weight="800" fill="#c62828">&lt; 10%</text>
  <text x="430" y="232" text-anchor="middle" font-size="11" fill="#666">是题太难？还是 Agent 太弱？</text>

  <!-- Branch B: with hint -->
  <rect x="290" y="330" width="280" height="170" rx="10" fill="#f1f8e9" stroke="#2e7d32" stroke-width="2"/>
  <text x="430" y="358" text-anchor="middle" font-size="15" font-weight="700" fill="#1b5e20">开卷：给 Hint Sheet</text>
  <text x="430" y="380" text-anchor="middle" font-size="11" fill="#333">✓ 告知调用顺序</text>
  <text x="430" y="398" text-anchor="middle" font-size="11" fill="#333">✓ 提示参数来源</text>
  <text x="430" y="416" text-anchor="middle" font-size="11" fill="#c62828">✗ 不给参数值</text>
  <text x="430" y="455" text-anchor="middle" font-size="28" font-weight="800" fill="#2e7d32">Haiku 97%</text>
  <text x="430" y="478" text-anchor="middle" font-size="11" fill="#444">小模型也能做对 → 任务可解</text>

  <!-- Arrows from Task -->
  <path d="M200 260 L 290 190" fill="none" stroke="#c62828" stroke-width="2" marker-end="url(#arR)"/>
  <path d="M200 310 L 290 400" fill="none" stroke="#2e7d32" stroke-width="2" marker-end="url(#arG)"/>

  <!-- Conclusion -->
  <rect x="620" y="210" width="240" height="190" rx="10" fill="#fffde7" stroke="#f9a825" stroke-width="2"/>
  <text x="740" y="240" text-anchor="middle" font-size="15" font-weight="700" fill="#795548">结论</text>
  <text x="740" y="268" text-anchor="middle" font-size="12" fill="#333">基准无 bug，</text>
  <text x="740" y="286" text-anchor="middle" font-size="12" fill="#333">差距来自 Agent 的</text>
  <text x="740" y="310" text-anchor="middle" font-size="13" font-weight="700" fill="#b71c1c">工具发现 + 参数推理</text>
  <text x="740" y="345" text-anchor="middle" font-size="11" fill="#555">评分方式：</text>
  <text x="740" y="365" text-anchor="middle" font-size="12" font-weight="600" fill="#1e3a8a">状态变更断言</text>
  <text x="740" y="383" text-anchor="middle" font-size="11" fill="#666">（改字段 / 打标签）</text>

  <path d="M570 175 L 620 240" fill="none" stroke="#333" stroke-width="1.8" marker-end="url(#ar)"/>
  <path d="M570 415 L 620 370" fill="none" stroke="#333" stroke-width="1.8" marker-end="url(#ar)"/>
</svg>