<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 620" font-family="-apple-system, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#555"/>
    </marker>
  </defs>

  <rect width="900" height="620" fill="#fafaf7"/>

  <text x="450" y="38" text-anchor="middle" font-size="22" font-weight="700" fill="#222">递归锦标赛投票 (RTV)：把全局排序拆成两两 PK</text>
  <text x="450" y="62" text-anchor="middle" font-size="13" fill="#777">每对比较用 8 票投出胜者，层层晋级</text>

  <!-- Left: Bad approach -->
  <g>
    <rect x="40" y="95" width="310" height="140" rx="10" fill="#fdecec" stroke="#d9534f" stroke-width="1.5"/>
    <text x="195" y="120" text-anchor="middle" font-size="14" font-weight="700" fill="#b8322a">✗ 一次性全局挑选 (G=16)</text>
    <g font-size="11" fill="#b8322a">
      <rect x="60"  y="140" width="38" height="30" rx="4" fill="#fff" stroke="#d9534f"/>
      <rect x="104" y="140" width="38" height="30" rx="4" fill="#fff" stroke="#d9534f"/>
      <rect x="148" y="140" width="38" height="30" rx="4" fill="#fff" stroke="#d9534f"/>
      <rect x="192" y="140" width="38" height="30" rx="4" fill="#fff" stroke="#d9534f"/>
      <rect x="236" y="140" width="38" height="30" rx="4" fill="#fff" stroke="#d9534f"/>
      <rect x="280" y="140" width="38" height="30" rx="4" fill="#fff" stroke="#d9534f"/>
      <text x="79"  y="159" text-anchor="middle">r1</text>
      <text x="123" y="159" text-anchor="middle">r2</text>
      <text x="167" y="159" text-anchor="middle">r3</text>
      <text x="211" y="159" text-anchor="middle">…</text>
      <text x="255" y="159" text-anchor="middle">r15</text>
      <text x="299" y="159" text-anchor="middle">r16</text>
    </g>
    <text x="195" y="200" text-anchor="middle" font-size="12" fill="#555">LLM 同时看 16 份摘要</text>
    <text x="195" y="218" text-anchor="middle" font-size="12" fill="#b8322a" font-weight="600">信息过载，判断不稳</text>
  </g>

  <!-- Right: Good approach -->
  <g>
    <rect x="550" y="95" width="310" height="140" rx="10" fill="#e8f5ec" stroke="#3a9d5a" stroke-width="1.5"/>
    <text x="705" y="120" text-anchor="middle" font-size="14" font-weight="700" fill="#2d7a46">✓ 两两 PK 逐轮晋级 (G=2)</text>
    <g font-size="11">
      <rect x="585" y="150" width="46" height="28" rx="4" fill="#fff" stroke="#3a9d5a"/>
      <text x="608" y="168" text-anchor="middle" fill="#2d7a46">A</text>
      <text x="645" y="168" text-anchor="middle" font-size="16" font-weight="700" fill="#2d7a46">vs</text>
      <rect x="660" y="150" width="46" height="28" rx="4" fill="#fff" stroke="#3a9d5a"/>
      <text x="683" y="168" text-anchor="middle" fill="#2d7a46">B</text>
      <text x="740" y="170" font-size="22" fill="#3a9d5a">→</text>
      <rect x="775" y="146" width="60" height="36" rx="4" fill="#3a9d5a"/>
      <text x="805" y="169" text-anchor="middle" fill="#fff" font-weight="700">胜者</text>
    </g>
    <text x="705" y="210" text-anchor="middle" font-size="12" fill="#2d7a46" font-weight="600">简单局部决策，可靠得多</text>
  </g>

  <!-- Tournament bracket -->
  <text x="450" y="278" text-anchor="middle" font-size="15" font-weight="700" fill="#333">锦标赛结构</text>

  <!-- Round 1: 8 pairs of boxes, show 4 for clarity -->
  <g font-size="11" fill="#333">
    <!-- Round 1 -->
    <g>
      <rect x="70"  y="305" width="38" height="28" rx="4" fill="#fff" stroke="#888"/><text x="89"  y="324" text-anchor="middle">r1</text>
      <rect x="112" y="305" width="38" height="28" rx="4" fill="#fff" stroke="#888"/><text x="131" y="324" text-anchor="middle">r2</text>

      <rect x="190" y="305" width="38" height="28" rx="4" fill="#fff" stroke="#888"/><text x="209" y="324" text-anchor="middle">r3</text>
      <rect x="232" y="305" width="38" height="28" rx="4" fill="#fff" stroke="#888"/><text x="251" y="324" text-anchor="middle">r4</text>

      <text x="340" y="324" text-anchor="middle" font-size="18" fill="#aaa">· · ·</text>

      <rect x="430" y="305" width="38" height="28" rx="4" fill="#fff" stroke="#888"/><text x="449" y="324" text-anchor="middle">r13</text>
      <rect x="472" y="305" width="38" height="28" rx="4" fill="#fff" stroke="#888"/><text x="491" y="324" text-anchor="middle">r14</text>

      <rect x="550" y="305" width="38" height="28" rx="4" fill="#fff" stroke="#888"/><text x="569" y="324" text-anchor="middle">r15</text>
      <rect x="592" y="305" width="38" height="28" rx="4" fill="#fff" stroke="#888"/><text x="611" y="324" text-anchor="middle">r16</text>
    </g>
    <text x="645" y="324" font-size="11" fill="#777">16 份摘要</text>

    <!-- Round 2 winners -->
    <g>
      <rect x="90"  y="370" width="42" height="28" rx="4" fill="#eaf3fb" stroke="#3a7abf"/><text x="111" y="389" text-anchor="middle" fill="#2a5a95">W1</text>
      <rect x="210" y="370" width="42" height="28" rx="4" fill="#eaf3fb" stroke="#3a7abf"/><text x="231" y="389" text-anchor="middle" fill="#2a5a95">W2</text>
      <text x="340" y="389" text-anchor="middle" font-size="18" fill="#aaa">· · ·</text>
      <rect x="450" y="370" width="42" height="28" rx="4" fill="#eaf3fb" stroke="#3a7abf"/><text x="471" y="389" text-anchor="middle" fill="#2a5a95">W7</text>
      <rect x="570" y="370" width="42" height="28" rx="4" fill="#eaf3fb" stroke="#3a7abf"/><text x="591" y="389" text-anchor="middle" fill="#2a5a95">W8</text>
    </g>
    <text x="645" y="389" font-size="11" fill="#777">→ 8 胜者</text>

    <!-- Round 3 -->
    <g>
      <rect x="150" y="430" width="42" height="28" rx="4" fill="#d9e9f7" stroke="#3a7abf"/><text x="171" y="449" text-anchor="middle" fill="#2a5a95">S1</text>
      <rect x="270" y="430" width="42" height="28" rx="4" fill="#d9e9f7" stroke="#3a7abf"/><text x="291" y="449" text-anchor="middle" fill="#2a5a95">S2</text>
      <rect x="390" y="430" width="42" height="28" rx="4" fill="#d9e9f7" stroke="#3a7abf"/><text x="411" y="449" text-anchor="middle" fill="#2a5a95">S3</text>
      <rect x="510" y="430" width="42" height="28" rx="4" fill="#d9e9f7" stroke="#3a7abf"/><text x="531" y="449" text-anchor="middle" fill="#2a5a95">S4</text>
    </g>
    <text x="645" y="449" font-size="11" fill="#777">→ 4 → 2</text>

    <!-- Final winner -->
    <rect x="390" y="495" width="120" height="40" rx="6" fill="#3a9d5a" stroke="#2d7a46"/>
    <text x="450" y="521" text-anchor="middle" fill="#fff" font-weight="700" font-size="15">最终胜出 ★</text>

    <!-- Arrows bracket-style -->
    <g stroke="#888" stroke-width="1.3" fill="none" marker-end="url(#arr)">
      <!-- Round1 pairs -> Round2 winners (merge two into one) -->
      <path d="M111,333 L111,368"/>
      <path d="M131,333 L131,360 L111,360"/>

      <path d="M231,333 L231,368"/>
      <path d="M251,333 L251,360 L231,360"/>

      <path d="M471,333 L471,368"/>
      <path d="M491,333 L491,360 L471,360"/>

      <path d="M591,333 L591,368"/>
      <path d="M611,333 L611,360 L591,360"/>

      <!-- Round2 -> Round3 -->
      <path d="M111,398 L111,420 L171,420 L171,428"/>
      <path d="M231,398 L231,420 L171,420"/>

      <path d="M471,398 L471,420 L411,420 L411,428"/>
      <path d="M591,398 L591,420 L411,420"/>

      <!-- Round3 -> Final (merge 4 into 1) -->
      <path d="M171,458 L171,485 L450,485 L450,493"/>
      <path d="M291,458 L291,485"/>
      <path d="M411,458 L411,485"/>
      <path d="M531,458 L531,485"/>
    </g>
  </g>

  <!-- Vote annotation -->
  <g>
    <rect x="700" y="425" width="175" height="70" rx="8" fill="#fff6df" stroke="#d4a62a"/>
    <text x="787" y="447" text-anchor="middle" font-size="12" font-weight="700" fill="#8a6a10">每场 PK</text>
    <text x="787" y="467" text-anchor="middle" font-size="12" fill="#8a6a10">V=8 票投多数</text>
    <text x="787" y="485" text-anchor="middle" font-size="11" fill="#a88a2a">抵抗单次误判</text>
  </g>

  <!-- Result -->
  <g>
    <rect x="40" y="560" width="820" height="42" rx="8" fill="#eef4ff" stroke="#3a5a95"/>
    <text x="450" y="587" text-anchor="middle" font-size="13" fill="#223" font-weight="600">Terminal-Bench · Claude-4.5-Sonnet：<tspan fill="#b8322a">40.6%</tspan><tspan fill="#333"> → 仅用 RTV 选择 → </tspan><tspan fill="#2d7a46" font-weight="700">54.6%</tspan><tspan fill="#555">（+14 pts，无需重新生成）</tspan></text>
  </g>
</svg>