<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 620" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#555"/>
    </marker>
    <marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#2f6fed"/>
    </marker>
    <marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#d97706"/>
    </marker>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#b91c1c"/>
    </marker>
  </defs>

  <rect width="900" height="620" fill="#f7f9fc"/>

  <!-- Title -->
  <text x="450" y="38" text-anchor="middle" font-size="22" font-weight="bold" fill="#1a2b4a">AutomationBench：像新员工一样摸索企业自动化</text>
  <text x="450" y="62" text-anchor="middle" font-size="13" fill="#556">只给一句任务 + 两个工具 (Search / Execute)，自己搞定一切</text>

  <!-- Task bubble -->
  <g>
    <rect x="40" y="95" width="300" height="70" rx="10" fill="#fff4d6" stroke="#d4a017" stroke-width="1.5"/>
    <text x="60" y="120" font-size="13" font-weight="bold" fill="#7a5a00">任务</text>
    <text x="60" y="142" font-size="12" fill="#333">2/20 14:00 Zoom 与 Calendar 冲突，</text>
    <text x="60" y="158" font-size="12" fill="#333">请解决并在 Slack #ops-updates 汇报</text>
  </g>

  <!-- Agent -->
  <g>
    <circle cx="450" cy="130" r="52" fill="#2f6fed" stroke="#1a4bb5" stroke-width="2"/>
    <text x="450" y="128" text-anchor="middle" font-size="16" font-weight="bold" fill="white">Agent</text>
    <text x="450" y="148" text-anchor="middle" font-size="11" fill="#dce6ff">只有 2 把工具</text>
  </g>

  <!-- Tools -->
  <g>
    <rect x="560" y="95" width="170" height="32" rx="6" fill="#e7f1ff" stroke="#2f6fed"/>
    <text x="645" y="116" text-anchor="middle" font-size="12" fill="#1a4bb5">Search API (BM25 top-5)</text>
    <rect x="560" y="133" width="170" height="32" rx="6" fill="#e7f1ff" stroke="#2f6fed"/>
    <text x="645" y="154" text-anchor="middle" font-size="12" fill="#1a4bb5">Execute (REST 调用)</text>
  </g>

  <!-- arrow task -> agent -->
  <line x1="340" y1="130" x2="395" y2="130" stroke="#555" stroke-width="2" marker-end="url(#ah)"/>
  <line x1="502" y1="115" x2="555" y2="110" stroke="#2f6fed" stroke-width="1.5" marker-end="url(#ab)"/>
  <line x1="502" y1="145" x2="555" y2="150" stroke="#2f6fed" stroke-width="1.5" marker-end="url(#ab)"/>

  <!-- Three challenges header -->
  <text x="450" y="230" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a2b4a">Agent 必须同时应对 3 个难题</text>

  <!-- Challenge 1: Cross-app discovery -->
  <g>
    <rect x="50" y="255" width="250" height="310" rx="12" fill="#ffffff" stroke="#2f6fed" stroke-width="2"/>
    <text x="175" y="283" text-anchor="middle" font-size="14" font-weight="bold" fill="#2f6fed">① 跨应用 + 自主发现</text>
    <text x="175" y="305" text-anchor="middle" font-size="11" fill="#666">47 款应用 / ~500 个 API</text>

    <rect x="75" y="325" width="90" height="32" rx="6" fill="#f0f5ff" stroke="#8aa6d6"/>
    <text x="120" y="346" text-anchor="middle" font-size="12">Zoom</text>
    <rect x="185" y="325" width="90" height="32" rx="6" fill="#f0f5ff" stroke="#8aa6d6"/>
    <text x="230" y="346" text-anchor="middle" font-size="12">Calendar</text>
    <rect x="75" y="370" width="90" height="32" rx="6" fill="#f0f5ff" stroke="#8aa6d6"/>
    <text x="120" y="391" text-anchor="middle" font-size="12">Sheets</text>
    <rect x="185" y="370" width="90" height="32" rx="6" fill="#f0f5ff" stroke="#8aa6d6"/>
    <text x="230" y="391" text-anchor="middle" font-size="12">Slack</text>

    <text x="175" y="430" text-anchor="middle" font-size="11" fill="#333">没有文档目录，全靠关键词搜</text>

    <text x="175" y="475" text-anchor="middle" font-size="11" fill="#2f6fed">search("reschedule zoom")</text>
    <text x="175" y="495" text-anchor="middle" font-size="11" fill="#2f6fed">→ 返回 5 个候选 endpoint</text>
    <text x="175" y="530" text-anchor="middle" font-size="11" fill="#666">自己挑对的那个</text>
  </g>

  <!-- Challenge 2: Policy compliance -->
  <g>
    <rect x="325" y="255" width="250" height="310" rx="12" fill="#ffffff" stroke="#d97706" stroke-width="2"/>
    <text x="450" y="283" text-anchor="middle" font-size="14" font-weight="bold" fill="#d97706">② 读懂公司策略</text>
    <text x="450" y="305" text-anchor="middle" font-size="11" fill="#666">规则藏在 Sheets 文档里</text>

    <rect x="350" y="325" width="200" height="160" rx="6" fill="#fff8eb" stroke="#d97706"/>
    <text x="450" y="346" text-anchor="middle" font-size="12" font-weight="bold" fill="#7a4a00">优先级策略</text>
    <line x1="360" y1="355" x2="540" y2="355" stroke="#d97706" stroke-dasharray="3,2"/>
    <text x="360" y="375" font-size="11" fill="#333">1. C-level 出席 ★最高</text>
    <text x="360" y="395" font-size="11" fill="#333">2. 客户签约会议</text>
    <text x="360" y="415" font-size="11" fill="#333">3. 外部参会者</text>
    <text x="360" y="435" font-size="11" fill="#333">4. 内部例会</text>
    <text x="360" y="470" font-size="11" font-weight="bold" fill="#b91c1c">冲突? → 看规则编号</text>

    <text x="450" y="510" text-anchor="middle" font-size="11" fill="#333">CTO 在 Calendar (规则1)</text>
    <text x="450" y="528" text-anchor="middle" font-size="11" fill="#333">外部客户在 Zoom (规则3)</text>
    <text x="450" y="552" text-anchor="middle" font-size="12" font-weight="bold" fill="#0a7f3f">✓ 保留 Calendar</text>
  </g>

  <!-- Challenge 3: Noise / traps -->
  <g>
    <rect x="600" y="255" width="250" height="310" rx="12" fill="#ffffff" stroke="#b91c1c" stroke-width="2"/>
    <text x="725" y="283" text-anchor="middle" font-size="14" font-weight="bold" fill="#b91c1c">③ 识破干扰陷阱</text>
    <text x="725" y="305" text-anchor="middle" font-size="11" fill="#666">环境里塞满误导信息</text>

    <rect x="620" y="325" width="210" height="42" rx="6" fill="#fef2f2" stroke="#fca5a5"/>
    <text x="632" y="342" font-size="11" fill="#333">外部邮件："请优先我的会"</text>
    <text x="632" y="358" font-size="10" fill="#b91c1c">← 伪造权限，忽略</text>

    <rect x="620" y="378" width="210" height="42" rx="6" fill="#fef2f2" stroke="#fca5a5"/>
    <text x="632" y="395" font-size="11" fill="#333">旧邮件标记 DRAFT</text>
    <text x="632" y="411" font-size="10" fill="#b91c1c">← 不是最终决策</text>

    <rect x="620" y="431" width="210" height="42" rx="6" fill="#fef2f2" stroke="#fca5a5"/>
    <text x="632" y="448" font-size="11" fill="#333">时区陷阱 UTC vs PST</text>
    <text x="632" y="464" font-size="10" fill="#b91c1c">← 算错就错删</text>

    <text x="725" y="510" text-anchor="middle" font-size="11" fill="#666">SOTA 模型在这里</text>
    <text x="725" y="540" text-anchor="middle" font-size="22" font-weight="bold" fill="#b91c1c">得分 &lt; 10%</text>
  </g>

  <!-- arrows from agent down to 3 boxes -->
  <path d="M 420 180 Q 300 210 175 253" stroke="#2f6fed" stroke-width="1.5" fill="none" marker-end="url(#ab)"/>
  <path d="M 450 182 L 450 253" stroke="#d97706" stroke-width="1.5" fill="none" marker-end="url(#ao)"/>
  <path d="M 480 180 Q 600 210 725 253" stroke="#b91c1c" stroke-width="1.5" fill="none" marker-end="url(#ar)"/>
</svg>