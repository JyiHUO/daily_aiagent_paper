<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 620" font-family="'Segoe UI',Arial,sans-serif">
  <defs>
    <marker id="ah" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#555"/>
    </marker>
    <marker id="ah2" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#e74c3c"/>
    </marker>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f0f4ff"/>
      <stop offset="100%" stop-color="#e8ecf8"/>
    </linearGradient>
    <filter id="shadow" x="-3%" y="-3%" width="106%" height="106%">
      <feDropShadow dx="2" dy="3" stdDeviation="4" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="900" height="620" rx="18" fill="url(#bg)"/>

  <!-- Title -->
  <text x="450" y="42" text-anchor="middle" font-size="24" font-weight="bold" fill="#1a1a2e">AutomationBench 核心挑战</text>
  <text x="450" y="68" text-anchor="middle" font-size="14" fill="#666">Agent 只有 Search + Execute 两个工具，需同时完成三件事</text>

  <!-- ===== LEFT: Task Input ===== -->
  <rect x="30" y="100" width="170" height="80" rx="14" fill="#fff" stroke="#bbb" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="115" y="132" text-anchor="middle" font-size="13" font-weight="bold" fill="#333">📝 任务指令</text>
  <text x="115" y="154" text-anchor="middle" font-size="11" fill="#777">"解决2/20 14:00</text>
  <text x="115" y="168" text-anchor="middle" font-size="11" fill="#777">会议冲突"</text>

  <!-- Arrow from task to center agent -->
  <line x1="200" y1="140" x2="268" y2="220" stroke="#555" stroke-width="2" marker-end="url(#ah)"/>

  <!-- ===== CENTER: Agent Core ===== -->
  <rect x="270" y="170" width="360" height="100" rx="20" fill="#2c3e6b" filter="url(#shadow)"/>
  <text x="450" y="210" text-anchor="middle" font-size="20" font-weight="bold" fill="#fff">🤖 AI Agent</text>
  <text x="450" y="238" text-anchor="middle" font-size="13" fill="#a8c0ff">仅有 Search（BM25 top-5）+ Execute</text>
  <text x="450" y="256" text-anchor="middle" font-size="12" fill="#8899bb">自主搜索 → 阅读策略 → 过滤干扰 → 执行</text>

  <!-- ===== THREE PILLARS ===== -->
  <!-- Pillar 1: Cross-App API Discovery -->
  <rect x="50" y="340" width="240" height="230" rx="16" fill="#fff" stroke="#3498db" stroke-width="2.5" filter="url(#shadow)"/>
  <rect x="50" y="340" width="240" height="44" rx="16" fill="#3498db"/>
  <rect x="50" y="364" width="240" height="20" fill="#3498db"/>
  <text x="170" y="370" text-anchor="middle" font-size="15" font-weight="bold" fill="#fff">① 跨应用 API 发现</text>

  <!-- App icons as circles -->
  <circle cx="105" cy="420" r="22" fill="#e8f4fd" stroke="#3498db" stroke-width="1.5"/>
  <text x="105" y="425" text-anchor="middle" font-size="11" font-weight="bold" fill="#2980b9">Zoom</text>
  <circle cx="170" cy="420" r="22" fill="#e8f4fd" stroke="#3498db" stroke-width="1.5"/>
  <text x="170" y="425" text-anchor="middle" font-size="10" font-weight="bold" fill="#2980b9">GCal</text>
  <circle cx="235" cy="420" r="22" fill="#e8f4fd" stroke="#3498db" stroke-width="1.5"/>
  <text x="235" y="425" text-anchor="middle" font-size="10" font-weight="bold" fill="#2980b9">Sheets</text>

  <!-- Search illustration -->
  <rect x="75" y="460" width="190" height="36" rx="8" fill="#f0f7ff" stroke="#3498db" stroke-width="1"/>
  <text x="105" y="483" font-size="12" fill="#555">🔍 "zoom meetings list"</text>
  <text x="170" y="518" text-anchor="middle" font-size="11" fill="#888">47 应用 · ~500 端点</text>
  <text x="170" y="538" text-anchor="middle" font-size="11" fill="#888">自主搜索、自主发现</text>

  <!-- Arrow down from agent -->
  <line x1="350" y1="270" x2="170" y2="335" stroke="#3498db" stroke-width="2.5" marker-end="url(#ah)"/>

  <!-- Pillar 2: Policy Compliance -->
  <rect x="330" y="340" width="240" height="230" rx="16" fill="#fff" stroke="#27ae60" stroke-width="2.5" filter="url(#shadow)"/>
  <rect x="330" y="340" width="240" height="44" rx="16" fill="#27ae60"/>
  <rect x="330" y="364" width="240" height="20" fill="#27ae60"/>
  <text x="450" y="370" text-anchor="middle" font-size="15" font-weight="bold" fill="#fff">② 策略文档遵守</text>

  <!-- Policy doc -->
  <rect x="360" y="400" width="180" height="90" rx="8" fill="#f0faf3" stroke="#27ae60" stroke-width="1.5"/>
  <text x="375" y="422" font-size="12" font-weight="bold" fill="#1e8449">优先级规则：</text>
  <text x="375" y="442" font-size="11" fill="#555">规则1: C-level出席 → 最高</text>
  <text x="375" y="460" font-size="11" fill="#555">规则2: 内部全员 → 次高</text>
  <text x="375" y="478" font-size="11" fill="#999">规则3: 外部参会 → 较低</text>

  <text x="450" y="520" text-anchor="middle" font-size="13" fill="#27ae60" font-weight="bold">CTO出席 ＞ 外部会议</text>
  <text x="450" y="542" text-anchor="middle" font-size="11" fill="#888">读取 Sheets 中的业务规则</text>

  <!-- Arrow down from agent -->
  <line x1="450" y1="270" x2="450" y2="335" stroke="#27ae60" stroke-width="2.5" marker-end="url(#ah)"/>

  <!-- Pillar 3: Distractor Filtering -->
  <rect x="610" y="340" width="240" height="230" rx="16" fill="#fff" stroke="#e74c3c" stroke-width="2.5" filter="url(#shadow)"/>
  <rect x="610" y="340" width="240" height="44" rx="16" fill="#e74c3c"/>
  <rect x="610" y="364" width="240" height="20" fill="#e74c3c"/>
  <text x="730" y="370" text-anchor="middle" font-size="15" font-weight="bold" fill="#fff">③ 干扰信息过滤</text>

  <!-- Distractor items -->
  <g opacity="0.5">
    <rect x="635" y="400" width="190" height="28" rx="6" fill="#fde8e8" stroke="#e74c3c" stroke-width="1"/>
    <text x="645" y="419" font-size="11" fill="#c0392b">❌ DRAFT 邮件</text>
    <line x1="635" y1="414" x2="825" y2="414" stroke="#e74c3c" stroke-width="1.5" opacity="0.5"/>
  </g>
  <g opacity="0.5">
    <rect x="635" y="436" width="190" height="28" rx="6" fill="#fde8e8" stroke="#e74c3c" stroke-width="1"/>
    <text x="645" y="455" font-size="11" fill="#c0392b">❌ 时区陷阱数据</text>
    <line x1="635" y1="450" x2="825" y2="450" stroke="#e74c3c" stroke-width="1.5" opacity="0.5"/>
  </g>
  <g opacity="0.5">
    <rect x="635" y="472" width="190" height="28" rx="6" fill="#fde8e8" stroke="#e74c3c" stroke-width="1"/>
    <text x="645" y="491" font-size="11" fill="#c0392b">❌ 外部伪覆盖请求</text>
    <line x1="635" y1="486" x2="825" y2="486" stroke="#e74c3c" stroke-width="1.5" opacity="0.5"/>
  </g>

  <rect x="635" y="514" width="190" height="28" rx="6" fill="#e8f8e8" stroke="#27ae60" stroke-width="1.5"/>
  <text x="645" y="533" font-size="11" fill="#1e8449" font-weight="bold">✅ 真正需要处理的记录</text>

  <text x="730" y="560" text-anchor="middle" font-size="11" fill="#888">在噪声中精准定位目标</text>

  <!-- Arrow down from agent -->
  <line x1="550" y1="270" x2="730" y2="335" stroke="#e74c3c" stroke-width="2.5" marker-end="url(#ah)"/>

  <!-- Bottom result badge -->
  <rect x="300" y="585" width="300" height="30" rx="15" fill="#1a1a2e" opacity="0.85"/>
  <text x="450" y="606" text-anchor="middle" font-size="13" font-weight="bold" fill="#ffd93d">🏆 前沿模型得分 &lt; 10%  —— 极难！</text>
</svg>