<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#333"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#c0392b"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#27ae60"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="450" y="40" text-anchor="middle" font-size="24" font-weight="bold" fill="#222">只看终态：最终世界状态对了才得分</text>
  <text x="450" y="65" text-anchor="middle" font-size="13" fill="#666">不给部分分 · 不用 LLM 当裁判 · 过程随便折腾</text>

  <!-- Agent box -->
  <rect x="40" y="230" width="180" height="120" rx="10" fill="#eaf3ff" stroke="#2d6cdf" stroke-width="2"/>
  <text x="130" y="268" text-anchor="middle" font-size="16" font-weight="bold" fill="#2d6cdf">Agent</text>
  <text x="130" y="294" text-anchor="middle" font-size="12" fill="#333">尝试 · 试错 · 调用 API</text>
  <text x="130" y="318" text-anchor="middle" font-size="11" fill="#888">(中间过程不打分)</text>

  <!-- arrow to state -->
  <line x1="220" y1="290" x2="335" y2="290" stroke="#333" stroke-width="2" marker-end="url(#arr)"/>

  <!-- Final World State -->
  <rect x="340" y="95" width="230" height="410" rx="12" fill="#fff8e1" stroke="#e0a800" stroke-width="2"/>
  <text x="455" y="125" text-anchor="middle" font-size="16" font-weight="bold" fill="#8a6d00">最终世界状态</text>
  <text x="455" y="145" text-anchor="middle" font-size="11" fill="#8a6d00">(Pydantic DB snapshot)</text>

  <!-- app states -->
  <rect x="360" y="165" width="190" height="55" rx="6" fill="#fff" stroke="#d4b250"/>
  <text x="370" y="187" font-size="13" font-weight="bold" fill="#333">Asana 任务</text>
  <text x="370" y="207" font-size="11" fill="#555">"Monthly Fire Drill..."</text>

  <rect x="360" y="235" width="190" height="55" rx="6" fill="#fff" stroke="#d4b250"/>
  <text x="370" y="257" font-size="13" font-weight="bold" fill="#333">Slack 消息</text>
  <text x="370" y="277" font-size="11" fill="#555">包含任务名 + 日期</text>

  <rect x="360" y="305" width="190" height="55" rx="6" fill="#fff" stroke="#d4b250"/>
  <text x="370" y="327" font-size="13" font-weight="bold" fill="#333">邮箱 / CRM</text>
  <text x="370" y="347" font-size="11" fill="#555">记录是否正确写入</text>

  <rect x="360" y="380" width="190" height="105" rx="6" fill="#fff" stroke="#d4b250"/>
  <text x="370" y="402" font-size="13" font-weight="bold" fill="#333">元数据</text>
  <text x="370" y="422" font-size="11" fill="#555">截止: 2026-02-18</text>
  <text x="370" y="440" font-size="11" fill="#555">分区: February</text>
  <text x="370" y="458" font-size="11" fill="#555">标签: Compliance</text>

  <!-- Positive Assertions -->
  <rect x="640" y="110" width="220" height="160" rx="10" fill="#e8f7ec" stroke="#27ae60" stroke-width="2"/>
  <text x="750" y="138" text-anchor="middle" font-size="15" font-weight="bold" fill="#1e8449">✓ 正向断言</text>
  <text x="655" y="165" font-size="12" fill="#1e5f3a">精确字符串匹配</text>
  <text x="655" y="185" font-size="12" fill="#1e5f3a">结构字段检查</text>
  <text x="655" y="205" font-size="12" fill="#1e5f3a">跨应用一致性</text>
  <text x="655" y="238" font-size="12" font-weight="bold" fill="#1e8449">例: 11 条全通过</text>
  <text x="655" y="256" font-size="11" fill="#555">才算任务成功</text>

  <!-- Negative Assertions -->
  <rect x="640" y="300" width="220" height="170" rx="10" fill="#fdecea" stroke="#c0392b" stroke-width="2"/>
  <text x="750" y="328" text-anchor="middle" font-size="15" font-weight="bold" fill="#a93226">✗ 负向断言</text>
  <text x="655" y="353" font-size="12" fill="#7b241c">防"散弹枪式"作弊</text>
  <text x="655" y="377" font-size="11" fill="#555">✗ 不可群发所有人</text>
  <text x="655" y="397" font-size="11" fill="#555">✗ 不可发 #general</text>
  <text x="655" y="417" font-size="11" fill="#555">✗ 不可动 DRAFT 邮件</text>
  <text x="655" y="450" font-size="11" font-weight="bold" fill="#a93226">触发一条 = 扣分</text>

  <!-- arrows from state to assertions -->
  <line x1="570" y1="200" x2="635" y2="190" stroke="#27ae60" stroke-width="2" marker-end="url(#arrG)"/>
  <line x1="570" y1="380" x2="635" y2="380" stroke="#c0392b" stroke-width="2" marker-end="url(#arrR)"/>

  <!-- bottom slogan -->
  <text x="450" y="555" text-anchor="middle" font-size="13" fill="#444">像企业 UAT 验收一样：<tspan font-weight="bold" fill="#222">只认结果，不看过程</tspan></text>
  <text x="450" y="578" text-anchor="middle" font-size="11" fill="#888">效率指标 = 每任务平均 token 花费 (USD)</text>
</svg>