<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 620" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
    <marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
  </defs>

  <rect width="960" height="620" fill="#f8fafc"/>

  <text x="480" y="38" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">Semantic ISA: 把 LLM 的文本翻译成"带类型的指令"</text>
  <text x="480" y="62" text-anchor="middle" font-size="13" fill="#475569">像 CPU 指令集一样，让内核能对每一步做权限校验</text>

  <!-- LLM -->
  <rect x="40" y="120" width="180" height="170" rx="14" fill="#fde68a" stroke="#b45309" stroke-width="2"/>
  <text x="130" y="150" text-anchor="middle" font-size="15" font-weight="700" fill="#78350f">LLM (概率单元)</text>
  <text x="130" y="180" text-anchor="middle" font-size="12" fill="#78350f" font-style="italic">"整理文件并发邮件"</text>
  <rect x="58" y="198" width="144" height="24" rx="5" fill="#fff7ed" stroke="#b45309"/>
  <text x="130" y="215" text-anchor="middle" font-size="11" fill="#78350f">不透明 token 流</text>
  <text x="130" y="248" text-anchor="middle" font-size="11" fill="#7f1d1d">⚠ 不可信 · guardrail &lt; 9%</text>

  <!-- Arrow LLM -> ISA -->
  <line x1="220" y1="205" x2="303" y2="205" stroke="#334155" stroke-width="2" marker-end="url(#a)"/>
  <text x="261" y="196" text-anchor="middle" font-size="11" fill="#334155">decode</text>

  <!-- ISA Box -->
  <rect x="305" y="105" width="380" height="410" rx="14" fill="#e0f2fe" stroke="#0369a1" stroke-width="2"/>
  <text x="495" y="132" text-anchor="middle" font-size="15" font-weight="700" fill="#0c4a6e">Semantic ISA · 5 逻辑核</text>

  <!-- Cognitive -->
  <rect x="325" y="150" width="155" height="60" rx="8" fill="#ffffff" stroke="#0369a1"/>
  <text x="402" y="172" text-anchor="middle" font-size="12" font-weight="700" fill="#0c4a6e">Cognitive</text>
  <text x="402" y="192" text-anchor="middle" font-size="11" fill="#334155">GENERATE / DECOMPOSE</text>

  <!-- Memory -->
  <rect x="510" y="150" width="155" height="60" rx="8" fill="#ffffff" stroke="#0369a1"/>
  <text x="587" y="172" text-anchor="middle" font-size="12" font-weight="700" fill="#0c4a6e">Memory</text>
  <text x="587" y="192" text-anchor="middle" font-size="11" fill="#334155">LOAD / STORE / FILTER</text>

  <!-- Execution -->
  <rect x="325" y="225" width="155" height="60" rx="8" fill="#ffffff" stroke="#0369a1"/>
  <text x="402" y="247" text-anchor="middle" font-size="12" font-weight="700" fill="#0c4a6e">Execution</text>
  <text x="402" y="267" text-anchor="middle" font-size="11" fill="#334155">TOOL-CALL / DELEGATE</text>

  <!-- Normative -->
  <rect x="510" y="225" width="155" height="60" rx="8" fill="#ffffff" stroke="#0369a1"/>
  <text x="587" y="247" text-anchor="middle" font-size="12" font-weight="700" fill="#0c4a6e">Normative</text>
  <text x="587" y="267" text-anchor="middle" font-size="11" fill="#334155">VERIFY / FALLBACK</text>

  <!-- Meta -->
  <rect x="418" y="300" width="155" height="55" rx="8" fill="#ffffff" stroke="#0369a1"/>
  <text x="495" y="322" text-anchor="middle" font-size="12" font-weight="700" fill="#0c4a6e">Meta-cognitive</text>
  <text x="495" y="340" text-anchor="middle" font-size="11" fill="#334155">PREDICT / MONITOR</text>

  <!-- Example instruction -->
  <rect x="325" y="380" width="340" height="115" rx="10" fill="#fef9c3" stroke="#ca8a04" stroke-width="1.5"/>
  <text x="495" y="402" text-anchor="middle" font-size="12" font-weight="700" fill="#713f12">结构化指令示例</text>
  <text x="340" y="426" font-size="12" font-family="monospace" fill="#1e293b">TOOL-CALL(</text>
  <text x="360" y="444" font-size="12" font-family="monospace" fill="#1e293b">op = send_email,</text>
  <text x="360" y="462" font-size="12" font-family="monospace" fill="#1e293b">body = <tspan fill="#dc2626" font-weight="700">tainted</tspan>(web_fetch),</text>
  <text x="360" y="480" font-size="12" font-family="monospace" fill="#1e293b">schema = {to, body} )</text>

  <!-- Arrow ISA -> Kernel -->
  <line x1="685" y1="300" x2="758" y2="300" stroke="#334155" stroke-width="2" marker-end="url(#a)"/>
  <text x="722" y="291" text-anchor="middle" font-size="11" fill="#334155">check</text>

  <!-- Kernel -->
  <rect x="760" y="170" width="165" height="260" rx="14" fill="#dcfce7" stroke="#166534" stroke-width="2"/>
  <text x="842" y="198" text-anchor="middle" font-size="14" font-weight="700" fill="#14532d">Symbolic Kernel</text>
  <text x="842" y="218" text-anchor="middle" font-size="11" fill="#14532d">(确定性)</text>

  <rect x="778" y="235" width="130" height="32" rx="6" fill="#ffffff" stroke="#166534"/>
  <text x="842" y="256" text-anchor="middle" font-size="11" fill="#14532d">权限校验</text>

  <rect x="778" y="277" width="130" height="32" rx="6" fill="#ffffff" stroke="#166534"/>
  <text x="842" y="298" text-anchor="middle" font-size="11" fill="#14532d">污点传播</text>

  <rect x="778" y="319" width="130" height="32" rx="6" fill="#ffffff" stroke="#166534"/>
  <text x="842" y="340" text-anchor="middle" font-size="11" fill="#14532d">Schema 绑定</text>

  <rect x="778" y="361" width="130" height="50" rx="6" fill="#fee2e2" stroke="#dc2626"/>
  <text x="842" y="381" text-anchor="middle" font-size="11" font-weight="700" fill="#991b1b">检测到污点</text>
  <text x="842" y="399" text-anchor="middle" font-size="11" fill="#991b1b">→ FALLBACK</text>

  <!-- Reject arrow back to ISA example -->
  <path d="M 778 395 Q 720 500 670 490" fill="none" stroke="#dc2626" stroke-width="2" stroke-dasharray="5,4" marker-end="url(#r)"/>
  <text x="760" y="530" text-anchor="middle" font-size="11" fill="#991b1b" font-weight="700">拒绝执行 · 触发 FALLBACK</text>

  <!-- Bottom caption -->
  <text x="480" y="595" text-anchor="middle" font-size="12" fill="#475569">文本 → 带类型的离散指令，让安全从"事后过滤"变成"架构属性"</text>
</svg>