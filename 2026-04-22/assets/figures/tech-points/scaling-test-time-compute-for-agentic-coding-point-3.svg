<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 620" font-family="'Helvetica Neue',Arial,sans-serif">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
    <marker id="arG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/>
    </marker>
  </defs>

  <rect width="960" height="620" fill="#f8fafc"/>

  <!-- Title -->
  <text x="480" y="38" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">PDR: 经验报告的质量 = 第二轮的成功率</text>
  <text x="480" y="62" text-anchor="middle" font-size="13" fill="#64748b">Parallel-Distill-Refine：先并行试错，再精选经验，重启再跑</text>

  <!-- Iteration 0 box -->
  <rect x="40" y="95" width="250" height="200" rx="12" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/>
  <text x="165" y="120" text-anchor="middle" font-size="15" font-weight="700" fill="#0c4a6e">Iteration-0</text>
  <text x="165" y="140" text-anchor="middle" font-size="12" fill="#0c4a6e">16 个 Agent 独立尝试 → 摘要</text>

  <!-- 16 small dots -->
  <g fill="#38bdf8">
    <circle cx="85" cy="175" r="9"/><circle cx="125" cy="175" r="9"/><circle cx="165" cy="175" r="9"/><circle cx="205" cy="175" r="9"/>
    <circle cx="85" cy="205" r="9"/><circle cx="125" cy="205" r="9"/><circle cx="165" cy="205" r="9"/><circle cx="205" cy="205" r="9"/>
    <circle cx="85" cy="235" r="9"/><circle cx="125" cy="235" r="9"/><circle cx="165" cy="235" r="9"/><circle cx="205" cy="235" r="9"/>
    <circle cx="85" cy="265" r="9"/><circle cx="125" cy="265" r="9"/><circle cx="165" cy="265" r="9"/><circle cx="205" cy="265" r="9"/>
  </g>

  <!-- RTV box -->
  <rect x="355" y="150" width="170" height="90" rx="12" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <text x="440" y="180" text-anchor="middle" font-size="14" font-weight="700" fill="#7c2d12">RTV 锦标赛</text>
  <text x="440" y="202" text-anchor="middle" font-size="12" fill="#7c2d12">精选 K=4 份摘要</text>
  <text x="440" y="222" text-anchor="middle" font-size="11" fill="#7c2d12">(作为经验报告)</text>

  <!-- arrow 0 -> RTV -->
  <line x1="290" y1="195" x2="353" y2="195" stroke="#334155" stroke-width="2" marker-end="url(#ar)"/>

  <!-- Iteration 1 box -->
  <rect x="590" y="95" width="330" height="200" rx="12" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="755" y="120" text-anchor="middle" font-size="15" font-weight="700" fill="#14532d">Iteration-1（干净环境重跑）</text>
  <text x="755" y="140" text-anchor="middle" font-size="12" fill="#14532d">原题 + 4 份经验摘要 → 16 个新 Agent</text>

  <g fill="#22c55e">
    <circle cx="625" cy="175" r="9"/><circle cx="665" cy="175" r="9"/><circle cx="705" cy="175" r="9"/><circle cx="745" cy="175" r="9"/><circle cx="785" cy="175" r="9"/><circle cx="825" cy="175" r="9"/><circle cx="865" cy="175" r="9"/><circle cx="905" cy="175" r="9"/>
    <circle cx="625" cy="205" r="9"/><circle cx="665" cy="205" r="9"/><circle cx="705" cy="205" r="9"/><circle cx="745" cy="205" r="9"/><circle cx="785" cy="205" r="9"/><circle cx="825" cy="205" r="9"/><circle cx="865" cy="205" r="9"/><circle cx="905" cy="205" r="9"/>
  </g>

  <text x="755" y="255" text-anchor="middle" font-size="13" font-weight="600" fill="#14532d">步数: 41 → 14   成功率 ↑</text>
  <text x="755" y="278" text-anchor="middle" font-size="12" fill="#166534">不再重走踩坑弯路，直接复用成功路径</text>

  <!-- arrow RTV -> iter1 -->
  <line x1="525" y1="195" x2="588" y2="195" stroke="#16a34a" stroke-width="2.5" marker-end="url(#arG)"/>

  <!-- Bottom: key insight - correlation -->
  <rect x="40" y="335" width="880" height="250" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="480" y="365" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">关键发现：摘要中「通过的数量」几乎决定了下一轮成败</text>

  <!-- bars -->
  <g font-size="12" fill="#0f172a">
    <line x1="120" y1="540" x2="860" y2="540" stroke="#94a3b8" stroke-width="1.5"/>

    <rect x="170" y="538" width="80" height="2" fill="#ef4444"/>
    <text x="210" y="560" text-anchor="middle">0 / 4 通过</text>
    <text x="210" y="528" text-anchor="middle" font-weight="700" fill="#ef4444">0.1%</text>

    <rect x="310" y="470" width="80" height="70" fill="#f97316"/>
    <text x="350" y="560" text-anchor="middle">1 / 4 通过</text>
    <text x="350" y="460" text-anchor="middle" font-weight="700" fill="#f97316">33.4%</text>

    <rect x="450" y="430" width="80" height="110" fill="#eab308"/>
    <text x="490" y="560" text-anchor="middle">2 / 4 通过</text>
    <text x="490" y="420" text-anchor="middle" font-weight="700" fill="#ca8a04">~70%</text>

    <rect x="590" y="410" width="80" height="130" fill="#84cc16"/>
    <text x="630" y="560" text-anchor="middle">3 / 4 通过</text>
    <text x="630" y="400" text-anchor="middle" font-weight="700" fill="#65a30d">~90%</text>

    <rect x="730" y="395" width="80" height="145" fill="#16a34a"/>
    <text x="770" y="560" text-anchor="middle">4 / 4 通过</text>
    <text x="770" y="385" text-anchor="middle" font-weight="700" fill="#15803d">99.2%</text>
  </g>

  <text x="480" y="582" text-anchor="middle" font-size="12" fill="#475569" font-style="italic">→ 所以用 RTV 精选摘要，比随机抽样有效得多</text>
</svg>