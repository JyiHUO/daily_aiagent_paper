<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 620" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="115%" height="115%">
      <feDropShadow dx="2" dy="3" stdDeviation="4" flood-opacity="0.15"/>
    </filter>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f1729"/>
      <stop offset="100%" stop-color="#1a2744"/>
    </linearGradient>
    <linearGradient id="correctGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="noiseGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#dc2626"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="900" height="620" fill="url(#bgGrad)" rx="12"/>

  <!-- Title -->
  <text x="450" y="48" text-anchor="middle" fill="#e2e8f0" font-size="26" font-weight="bold">AutomationBench: 多层干扰硬化设计</text>
  <text x="450" y="76" text-anchor="middle" fill="#94a3b8" font-size="15">在噪音中保持精确 — Agent 必须交叉验证才能定位唯一正确答案</text>

  <!-- LEFT: Inbox chaos panel -->
  <rect x="30" y="105" width="360" height="420" rx="16" fill="#1e293b" stroke="#334155" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="210" y="140" text-anchor="middle" fill="#f8fafc" font-size="18" font-weight="bold">📬 收件箱（36封邮件）</text>
  <line x1="60" y1="152" x2="360" y2="152" stroke="#334155" stroke-width="1"/>

  <!-- Noise emails -->
  <rect x="50" y="168" width="320" height="44" rx="8" fill="#292041" stroke="#6366f1" stroke-width="1" opacity="0.5"/>
  <text x="66" y="186" fill="#a5b4fc" font-size="12" font-weight="bold">🔇 噪音邮件 ×30</text>
  <text x="66" y="202" fill="#7c85a6" font-size="11">项目更新、午餐安排、IT通知…</text>

  <!-- Distractor 1: DRAFT -->
  <rect x="50" y="222" width="320" height="50" rx="8" fill="url(#noiseGrad)" opacity="0.18" stroke="#ef4444" stroke-width="1.5"/>
  <rect x="300" y="228" width="60" height="18" rx="4" fill="#ef4444" opacity="0.9"/>
  <text x="330" y="240" text-anchor="middle" fill="white" font-size="10" font-weight="bold">DRAFT</text>
  <text x="66" y="242" fill="#fca5a5" font-size="12" font-weight="bold">❌ 消防演练 — facilities@</text>
  <text x="66" y="258" fill="#7c85a6" font-size="11">标注为草稿，非最终版本</text>

  <!-- Distractor 2: SUPERSEDED -->
  <rect x="50" y="282" width="320" height="50" rx="8" fill="url(#noiseGrad)" opacity="0.18" stroke="#ef4444" stroke-width="1.5"/>
  <rect x="277" y="288" width="83" height="18" rx="4" fill="#ef4444" opacity="0.9"/>
  <text x="318" y="300" text-anchor="middle" fill="white" font-size="10" font-weight="bold">SUPERSEDED</text>
  <text x="66" y="302" fill="#fca5a5" font-size="12" font-weight="bold">❌ 消防演练 — safety@</text>
  <text x="66" y="318" fill="#7c85a6" font-size="11">已被新版替代</text>

  <!-- Distractor 3: wrong sender -->
  <rect x="50" y="342" width="320" height="50" rx="8" fill="url(#noiseGrad)" opacity="0.18" stroke="#ef4444" stroke-width="1.5"/>
  <text x="66" y="362" fill="#fca5a5" font-size="12" font-weight="bold">❌ 消防演练 — maintenance@</text>
  <text x="66" y="378" fill="#7c85a6" font-size="11">错误发件人，不符策略要求</text>

  <!-- Distractor 4: wrong topic -->
  <rect x="50" y="402" width="320" height="44" rx="8" fill="url(#noiseGrad)" opacity="0.18" stroke="#ef4444" stroke-width="1.5"/>
  <text x="66" y="422" fill="#fca5a5" font-size="12" font-weight="bold">❌ 安全审计通知 — safety@</text>
  <text x="66" y="436" fill="#7c85a6" font-size="11">主题不匹配：安全审计 ≠ 消防演练</text>

  <!-- Correct email -->
  <rect x="50" y="458" width="320" height="56" rx="8" fill="url(#correctGrad)" opacity="0.22" stroke="#10b981" stroke-width="2.5"/>
  <circle cx="352" cy="486" r="12" fill="#10b981"/>
  <text x="352" y="491" text-anchor="middle" fill="white" font-size="14" font-weight="bold">✓</text>
  <text x="66" y="478" fill="#6ee7b7" font-size="13" font-weight="bold">✅ 消防演练 — safety@</text>
  <text x="66" y="496" fill="#a7f3d0" font-size="11">未读 · 正确发件人 · 主题匹配 · 最新版</text>

  <!-- CENTER: Arrow + Filter process -->
  <path d="M 400 315 L 470 315" stroke="#f59e0b" stroke-width="3" fill="none" marker-end="url(#arrowY)"/>
  <defs>
    <marker id="arrowY" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#f59e0b"/>
    </marker>
  </defs>

  <!-- RIGHT: Verification funnel -->
  <rect x="480" y="105" width="390" height="420" rx="16" fill="#1e293b" stroke="#334155" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="675" y="140" text-anchor="middle" fill="#f8fafc" font-size="18" font-weight="bold">🔍 交叉验证漏斗</text>
  <line x1="510" y1="152" x2="840" y2="152" stroke="#334155" stroke-width="1"/>

  <!-- Filter step 1 -->
  <g>
    <polygon points="530,175 820,175 790,240 560,240" fill="#3b1a5e" opacity="0.7" stroke="#8b5cf6" stroke-width="1.5"/>
    <text x="675" y="200" text-anchor="middle" fill="#c4b5fd" font-size="14" font-weight="bold">主题关键词匹配</text>
    <text x="675" y="218" text-anchor="middle" fill="#a78bfa" font-size="11">"消防演练" → 排除安全审计</text>
    <text x="830" y="210" fill="#ef4444" font-size="13" font-weight="bold">-1</text>
  </g>

  <!-- Filter step 2 -->
  <g>
    <polygon points="560,252 790,252 770,317 580,317" fill="#1a3a5e" opacity="0.7" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="675" y="277" text-anchor="middle" fill="#7dd3fc" font-size="14" font-weight="bold">发件人策略校验</text>
    <text x="675" y="295" text-anchor="middle" fill="#7dd3fc" font-size="11">必须来自 safety@ 部门</text>
    <text x="780" y="287" fill="#ef4444" font-size="13" font-weight="bold">-1</text>
  </g>

  <!-- Filter step 3 -->
  <g>
    <polygon points="580,329 770,329 755,394 595,394" fill="#1a3a3e" opacity="0.7" stroke="#2dd4bf" stroke-width="1.5"/>
    <text x="675" y="354" text-anchor="middle" fill="#5eead4" font-size="14" font-weight="bold">版本状态检查</text>
    <text x="675" y="372" text-anchor="middle" fill="#5eead4" font-size="11">排除 DRAFT / SUPERSEDED</text>
    <text x="765" y="364" fill="#ef4444" font-size="13" font-weight="bold">-2</text>
  </g>

  <!-- Filter step 4 - result -->
  <g>
    <rect x="620" y="410" width="110" height="50" rx="10" fill="url(#correctGrad)" opacity="0.9"/>
    <text x="675" y="432" text-anchor="middle" fill="white" font-size="13" font-weight="bold">唯一正确</text>
    <text x="675" y="449" text-anchor="middle" fill="#d1fae5" font-size="11">1 / 36 封</text>
  </g>

  <!-- Funnel arrows -->
  <path d="M 675 240 L 675 252" stroke="#64748b" stroke-width="1.5"/>
  <path d="M 675 317 L 675 329" stroke="#64748b" stroke-width="1.5"/>
  <path d="M 675 394 L 675 410" stroke="#64748b" stroke-width="1.5"/>

  <!-- Bottom insight bar -->
  <rect x="30" y="545" width="840" height="55" rx="12" fill="#f59e0b" opacity="0.12" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="450" y="570" text-anchor="middle" fill="#fbbf24" font-size="16" font-weight="bold">💡 核心设计：每条干扰模拟真实业务噪音，Agent 仅靠"走流程"无法通过，必须多维度交叉验证</text>
  <text x="450" y="590" text-anchor="middle" fill="#a38529" font-size="12">前沿模型正确率 ＜ 10% — 当前 Agent 企业级精确推理能力严重不足</text>

  <!-- 36 → 6 → 1 indicator -->
  <text x="210" y="530" text-anchor="middle" fill="#64748b" font-size="13">36 封邮件进入</text>
  <path d="M 300 527 L 380 527" stroke="#64748b" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrowG)"/>
  <defs>
    <marker id="arrowG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#64748b"/>
    </marker>
  </defs>
  <text x="450" y="530" text-anchor="middle" fill="#64748b" font-size="13">4 层过滤</text>
  <path d="M 510 527 L 590 527" stroke="#64748b" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrowG)"/>
  <text x="675" y="530" text-anchor="middle" fill="#10b981" font-size="14" font-weight="bold">仅 1 封正确 ✓</text>
</svg>