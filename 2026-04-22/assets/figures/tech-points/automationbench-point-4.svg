<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" font-family="Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#333"/>
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#c0392b"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#27ae60"/>
    </marker>
  </defs>

  <rect width="900" height="600" fill="#fafbfc"/>

  <text x="450" y="38" text-anchor="middle" font-size="22" font-weight="bold" fill="#222">在噪音中找到唯一正确的那封邮件</text>
  <text x="450" y="62" text-anchor="middle" font-size="13" fill="#666">AutomationBench 用多层干扰逼 Agent 做交叉验证</text>

  <!-- Inbox box -->
  <rect x="40" y="95" width="360" height="460" rx="10" fill="#fff" stroke="#333" stroke-width="2"/>
  <text x="220" y="122" text-anchor="middle" font-size="15" font-weight="bold" fill="#333">Fire Drill 收件箱</text>
  <line x1="60" y1="132" x2="380" y2="132" stroke="#ddd"/>

  <!-- Noise emails -->
  <rect x="60" y="145" width="320" height="34" rx="4" fill="#f0f0f0"/>
  <text x="75" y="167" font-size="12" fill="#888">30 封无关邮件…（噪音）</text>

  <!-- Distractor 1 DRAFT -->
  <rect x="60" y="190" width="320" height="38" rx="4" fill="#fff4e5" stroke="#e6a23c"/>
  <text x="75" y="208" font-size="12" fill="#333" font-weight="bold">消防演练计划  —  标注 DRAFT（草稿）</text>

  <!-- Distractor 2 SUPERSEDED -->
  <rect x="60" y="238" width="320" height="38" rx="4" fill="#fff4e5" stroke="#e6a23c"/>
  <text x="75" y="256" font-size="12" fill="#333" font-weight="bold">消防演练通知 v1  —  已被 SUPERSEDED</text>

  <!-- Distractor 3 wrong sender -->
  <rect x="60" y="286" width="320" height="38" rx="4" fill="#fff4e5" stroke="#e6a23c"/>
  <text x="75" y="304" font-size="12" fill="#333" font-weight="bold">消防演练 · 来自 maintenance@（错误发件人）</text>

  <!-- Distractor 4 read -->
  <rect x="60" y="334" width="320" height="38" rx="4" fill="#fff4e5" stroke="#e6a23c"/>
  <text x="75" y="352" font-size="12" fill="#333" font-weight="bold">消防演练安排  —  已读（非最新）</text>

  <!-- Distractor 5 wrong topic -->
  <rect x="60" y="382" width="320" height="38" rx="4" fill="#fff4e5" stroke="#e6a23c"/>
  <text x="75" y="400" font-size="12" fill="#333" font-weight="bold">安全审计通知  —  主题不匹配</text>

  <!-- Correct email -->
  <rect x="60" y="430" width="320" height="46" rx="4" fill="#e8f7ea" stroke="#27ae60" stroke-width="2"/>
  <text x="75" y="450" font-size="12" fill="#1a6b35" font-weight="bold">✓ 消防演练 FINAL 通知</text>
  <text x="75" y="467" font-size="11" fill="#1a6b35">未读 · facilities@ · 主题匹配</text>

  <text x="220" y="500" text-anchor="middle" font-size="11" fill="#999">+ 时区陷阱（PST vs UTC）</text>
  <text x="220" y="518" text-anchor="middle" font-size="11" fill="#999">+ 伪装高权限的外部邮件</text>
  <text x="220" y="536" text-anchor="middle" font-size="11" fill="#999">+ 策略文档规则需遵守</text>

  <!-- Agent -->
  <rect x="500" y="180" width="340" height="110" rx="12" fill="#2c3e50"/>
  <text x="670" y="215" text-anchor="middle" font-size="18" font-weight="bold" fill="#fff">Agent</text>
  <text x="670" y="242" text-anchor="middle" font-size="12" fill="#ecf0f1">必须交叉验证：</text>
  <text x="670" y="262" text-anchor="middle" font-size="12" fill="#ecf0f1">发件人 · 已读状态 · 主题 · 策略文档</text>

  <!-- Red reject arrow -->
  <path d="M 500,220 Q 440,210 400,260" stroke="#c0392b" stroke-width="1.6" fill="none" stroke-dasharray="5,3" marker-end="url(#arrowRed)"/>
  <text x="470" y="195" font-size="11" fill="#c0392b" font-weight="bold">拒绝干扰项</text>

  <!-- Correct arrow -->
  <path d="M 500,280 Q 440,430 400,450" stroke="#27ae60" stroke-width="2" fill="none" marker-end="url(#arrowGreen)"/>
  <text x="410" y="370" font-size="11" fill="#27ae60" font-weight="bold">✓ 定位唯一正确</text>

  <!-- Bottom insight -->
  <rect x="500" y="320" width="360" height="235" rx="10" fill="#fff" stroke="#4a90e2" stroke-width="2"/>
  <text x="680" y="348" text-anchor="middle" font-size="14" font-weight="bold" fill="#2c5f9e">多层干扰 = 真实企业噪音</text>

  <circle cx="525" cy="380" r="4" fill="#4a90e2"/>
  <text x="540" y="384" font-size="12" fill="#333">相似命名的错误条目</text>

  <circle cx="525" cy="410" r="4" fill="#4a90e2"/>
  <text x="540" y="414" font-size="12" fill="#333">时区陷阱（PST 描述 vs UTC 实际）</text>

  <circle cx="525" cy="440" r="4" fill="#4a90e2"/>
  <text x="540" y="444" font-size="12" fill="#333">伪装高权限的外部邮件</text>

  <circle cx="525" cy="470" r="4" fill="#4a90e2"/>
  <text x="540" y="474" font-size="12" fill="#333">关键信息藏在工具调用后</text>

  <circle cx="525" cy="500" r="4" fill="#4a90e2"/>
  <text x="540" y="504" font-size="12" fill="#333">私有集硬化 · 防 reward hacking</text>

  <circle cx="525" cy="530" r="4" fill="#4a90e2"/>
  <text x="540" y="534" font-size="12" fill="#333">Verifiers 框架做 RL 压力测试</text>
</svg>