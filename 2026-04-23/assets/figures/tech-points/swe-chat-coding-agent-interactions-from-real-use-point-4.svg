<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" font-family="'Helvetica Neue',Arial,sans-serif">
  <rect width="900" height="560" fill="#f7f9fc"/>
  
  <!-- Title -->
  <text x="450" y="42" text-anchor="middle" font-size="24" font-weight="700" fill="#1a2332">Vibe Coding 的安全代价</text>
  <text x="450" y="68" text-anchor="middle" font-size="14" fill="#5a6a7e">每 1000 行新代码引入的漏洞数 (Semgrep 检测)</text>

  <!-- Baseline -->
  <line x1="120" y1="440" x2="820" y2="440" stroke="#2c3e50" stroke-width="2"/>
  <text x="110" y="445" text-anchor="end" font-size="12" fill="#5a6a7e">0</text>

  <!-- Bar 1: Human only -->
  <rect x="170" y="420" width="120" height="20" fill="#27ae60" rx="3"/>
  <text x="230" y="412" text-anchor="middle" font-size="14" font-weight="600" fill="#1a2332">0.08</text>
  <text x="230" y="470" text-anchor="middle" font-size="13" font-weight="600" fill="#1a2332">Human only</text>
  <text x="230" y="488" text-anchor="middle" font-size="11" fill="#7a8a9e">人工编写</text>

  <!-- Bar 2: Collaborative -->
  <rect x="370" y="405" width="120" height="35" fill="#f39c12" rx="3"/>
  <text x="430" y="397" text-anchor="middle" font-size="14" font-weight="600" fill="#1a2332">0.14</text>
  <text x="430" y="470" text-anchor="middle" font-size="13" font-weight="600" fill="#1a2332">Collaborative</text>
  <text x="430" y="488" text-anchor="middle" font-size="11" fill="#7a8a9e">人机协作</text>

  <!-- Bar 3: Vibe -->
  <rect x="570" y="250" width="120" height="190" fill="#e74c3c" rx="3"/>
  <text x="630" y="240" text-anchor="middle" font-size="20" font-weight="700" fill="#c0392b">0.76</text>
  <text x="630" y="470" text-anchor="middle" font-size="13" font-weight="700" fill="#c0392b">Vibe coding</text>
  <text x="630" y="488" text-anchor="middle" font-size="11" fill="#7a8a9e">Agent 自主写</text>

  <!-- 9x callout -->
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#c0392b"/>
    </marker>
  </defs>
  <g>
    <path d="M 440 205 Q 530 230 600 252" stroke="#c0392b" stroke-width="2" fill="none" stroke-dasharray="5,4" marker-end="url(#arr)"/>
    <rect x="340" y="150" width="200" height="56" fill="#fff" stroke="#c0392b" stroke-width="2" rx="6"/>
    <text x="440" y="178" text-anchor="middle" font-size="20" font-weight="700" fill="#c0392b">9× 更危险</text>
    <text x="440" y="196" text-anchor="middle" font-size="11" fill="#7a8a9e">vs. 人工编写</text>
  </g>

  <!-- Vulnerability types box -->
  <rect x="60" y="510" width="780" height="38" fill="#fff" stroke="#d0d8e0" rx="4"/>
  <text x="75" y="534" font-size="12" fill="#2c3e50"><tspan font-weight="700" fill="#c0392b">典型漏洞：</tspan><tspan dx="8">Path Traversal  ·  Command Injection  ·  SQL Injection  ·  Unsafe Format String</tspan></text>

  <!-- Side note -->
  <g transform="translate(60, 100)">
    <rect width="240" height="66" fill="#fff4e6" stroke="#f39c12" stroke-width="1.5" rx="5"/>
    <text x="12" y="24" font-size="13" font-weight="700" fill="#8a5a00">为什么差距这么大？</text>
    <text x="12" y="44" font-size="11" fill="#5a4a2a">Agent 走最短路径，忽视输入校验</text>
    <text x="12" y="60" font-size="11" fill="#5a4a2a">Vibe 模式下用户也很少逐行审查</text>
  </g>
</svg>