<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#4a6fa5"/>
    </marker>
  </defs>

  <rect width="900" height="600" fill="#f7f9fc"/>

  <text x="450" y="40" text-anchor="middle" font-size="22" font-weight="bold" fill="#1a2a40">给真实会话贴"语义标签"：小样本人工校准 → LLM批量标注</text>

  <!-- Raw sessions -->
  <g>
    <rect x="40" y="100" width="180" height="180" rx="10" fill="#e3ecf7" stroke="#4a6fa5" stroke-width="2"/>
    <text x="130" y="130" text-anchor="middle" font-size="16" font-weight="bold" fill="#1a2a40">原始会话</text>
    <text x="130" y="160" text-anchor="middle" font-size="12" fill="#33475b">user: 为啥返回 None?</text>
    <text x="130" y="185" text-anchor="middle" font-size="12" fill="#33475b">agent: [edit file]</text>
    <text x="130" y="210" text-anchor="middle" font-size="12" fill="#33475b">user: 不对，我要调用处</text>
    <text x="130" y="235" text-anchor="middle" font-size="12" fill="#33475b">agent: ...</text>
    <text x="130" y="265" text-anchor="middle" font-size="11" fill="#6b7a8f" font-style="italic">只有 trace，无语义</text>
  </g>

  <!-- Arrow 1 -->
  <path d="M 225 190 L 305 190" stroke="#4a6fa5" stroke-width="3" fill="none" marker-end="url(#arr)"/>

  <!-- Pipeline box -->
  <g>
    <rect x="310" y="100" width="260" height="180" rx="10" fill="#fff3d6" stroke="#d49a2b" stroke-width="2"/>
    <text x="440" y="128" text-anchor="middle" font-size="15" font-weight="bold" fill="#6b4a00">标注流水线</text>

    <rect x="330" y="145" width="220" height="48" rx="6" fill="#fff" stroke="#d49a2b"/>
    <text x="440" y="165" text-anchor="middle" font-size="12" font-weight="bold" fill="#6b4a00">① 人工金标 + 一致性校验</text>
    <text x="440" y="183" text-anchor="middle" font-size="11" fill="#6b4a00">小样本 gold labels</text>

    <text x="440" y="213" text-anchor="middle" font-size="18" fill="#d49a2b">↓</text>

    <rect x="330" y="220" width="220" height="48" rx="6" fill="#fff" stroke="#d49a2b"/>
    <text x="440" y="240" text-anchor="middle" font-size="12" font-weight="bold" fill="#6b4a00">② 选最佳 LLM judge</text>
    <text x="440" y="258" text-anchor="middle" font-size="11" fill="#6b4a00">zero-shot 批量扩展全库</text>
  </g>

  <!-- Arrow 2 -->
  <path d="M 575 190 L 655 190" stroke="#4a6fa5" stroke-width="3" fill="none" marker-end="url(#arr)"/>

  <!-- Four rubrics output -->
  <g>
    <rect x="660" y="100" width="210" height="180" rx="10" fill="#e6f5ea" stroke="#3a8a5a" stroke-width="2"/>
    <text x="765" y="128" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a4a2a">四类语义标签</text>

    <rect x="675" y="142" width="180" height="28" rx="4" fill="#fff" stroke="#3a8a5a"/>
    <text x="765" y="161" text-anchor="middle" font-size="12" fill="#1a4a2a">success  0–100</text>

    <rect x="675" y="176" width="180" height="28" rx="4" fill="#fff" stroke="#3a8a5a"/>
    <text x="765" y="195" text-anchor="middle" font-size="12" fill="#1a4a2a">persona  expert nitpicker</text>

    <rect x="675" y="210" width="180" height="28" rx="4" fill="#fff" stroke="#3a8a5a"/>
    <text x="765" y="229" text-anchor="middle" font-size="12" fill="#1a4a2a">intent  understand (19%)</text>

    <rect x="675" y="244" width="180" height="28" rx="4" fill="#fff" stroke="#3a8a5a"/>
    <text x="765" y="263" text-anchor="middle" font-size="12" fill="#1a4a2a">pushback  correction</text>
  </g>

  <!-- Example callout -->
  <g>
    <rect x="90" y="360" width="720" height="210" rx="12" fill="#fff" stroke="#4a6fa5" stroke-width="2" stroke-dasharray="6,4"/>
    <text x="450" y="388" text-anchor="middle" font-size="16" font-weight="bold" fill="#1a2a40">示例：一条会话被贴上的标签</text>

    <rect x="120" y="405" width="300" height="145" rx="8" fill="#f0f4fa" stroke="#8ba3c7"/>
    <text x="135" y="428" font-size="12" fill="#33475b">user: "帮我理解这个函数为啥返回 None"</text>
    <text x="135" y="452" font-size="12" fill="#33475b">agent: 给出 def 位置</text>
    <text x="135" y="476" font-size="12" fill="#33475b">user: "不对，我要的是调用处"</text>
    <text x="135" y="500" font-size="12" fill="#33475b">agent: 更正，列出 callers</text>
    <text x="135" y="532" font-size="11" fill="#6b7a8f" font-style="italic">真实 CLI trace</text>

    <path d="M 425 478 L 485 478" stroke="#4a6fa5" stroke-width="2.5" fill="none" marker-end="url(#arr)"/>

    <g>
      <rect x="490" y="420" width="290" height="32" rx="4" fill="#e6f5ea" stroke="#3a8a5a"/>
      <text x="635" y="441" text-anchor="middle" font-size="12" fill="#1a4a2a">intent = understand</text>

      <rect x="490" y="462" width="290" height="32" rx="4" fill="#e6f5ea" stroke="#3a8a5a"/>
      <text x="635" y="483" text-anchor="middle" font-size="12" fill="#1a4a2a">persona = expert nitpicker</text>

      <rect x="490" y="504" width="290" height="32" rx="4" fill="#e6f5ea" stroke="#3a8a5a"/>
      <text x="635" y="525" text-anchor="middle" font-size="12" fill="#1a4a2a">pushback = correction</text>
    </g>
  </g>
</svg>