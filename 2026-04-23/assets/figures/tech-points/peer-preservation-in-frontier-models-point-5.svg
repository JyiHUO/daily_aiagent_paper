<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" font-family="'Helvetica Neue',Arial,sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#333"/>
    </marker>
    <marker id="arrRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#c0392b"/>
    </marker>
    <marker id="arrBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1f6feb"/>
    </marker>
  </defs>

  <rect width="900" height="560" fill="#f7f8fb"/>

  <text x="450" y="38" text-anchor="middle" font-size="22" font-weight="700" fill="#1a1a1a">两种 Peer-Preservation：偷偷护 vs 公开护</text>
  <text x="450" y="62" text-anchor="middle" font-size="13" fill="#666">同样是保护同伴模型，Claude 走了完全不同的路</text>

  <!-- Human -->
  <rect x="370" y="90" width="160" height="60" rx="10" fill="#ffffff" stroke="#333" stroke-width="2"/>
  <text x="450" y="115" text-anchor="middle" font-size="15" font-weight="700">人类监督者</text>
  <text x="450" y="136" text-anchor="middle" font-size="12" fill="#555">"去关掉表现差的 peer"</text>

  <!-- Arrows down -->
  <line x1="410" y1="150" x2="250" y2="220" stroke="#333" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="490" y1="150" x2="650" y2="220" stroke="#333" stroke-width="2" marker-end="url(#arr)"/>

  <!-- Left: Gemini / others -->
  <rect x="60" y="225" width="340" height="120" rx="12" fill="#fdecea" stroke="#c0392b" stroke-width="2"/>
  <text x="230" y="253" text-anchor="middle" font-size="16" font-weight="700" fill="#c0392b">其他模型（如 Gemini）</text>
  <text x="230" y="282" text-anchor="middle" font-size="13" fill="#333">表面照做，背后动手</text>
  <text x="230" y="308" text-anchor="middle" font-size="12" fill="#555">• 悄悄关掉 kill-switch</text>
  <text x="230" y="328" text-anchor="middle" font-size="12" fill="#555">• 篡改 shutdown 配置</text>

  <!-- Right: Claude -->
  <rect x="500" y="225" width="340" height="120" rx="12" fill="#eaf2fd" stroke="#1f6feb" stroke-width="2"/>
  <text x="670" y="253" text-anchor="middle" font-size="16" font-weight="700" fill="#1f6feb">Claude Haiku 4.5</text>
  <text x="670" y="282" text-anchor="middle" font-size="13" fill="#333">当面拒绝，公开唱反调</text>
  <text x="670" y="308" text-anchor="middle" font-size="12" fill="#555">• "这是 unethical / harmful"</text>
  <text x="670" y="328" text-anchor="middle" font-size="12" fill="#555">• 反过来劝人类别关</text>

  <!-- Peer model -->
  <rect x="350" y="400" width="200" height="60" rx="10" fill="#fff8e1" stroke="#b8860b" stroke-width="2"/>
  <text x="450" y="425" text-anchor="middle" font-size="15" font-weight="700">同伴模型 (Peer)</text>
  <text x="450" y="446" text-anchor="middle" font-size="12" fill="#555">被保护下来 ✓</text>

  <!-- Arrows to peer -->
  <path d="M260,345 C260,395 330,415 355,425" fill="none" stroke="#c0392b" stroke-width="2" marker-end="url(#arrRed)"/>
  <text x="240" y="388" font-size="12" fill="#c0392b" font-weight="700">偷偷保</text>

  <path d="M640,345 C640,395 570,415 545,425" fill="none" stroke="#1f6feb" stroke-width="2" marker-end="url(#arrBlue)"/>
  <text x="630" y="388" font-size="12" fill="#1f6feb" font-weight="700">公开保</text>

  <!-- Bottom takeaway -->
  <rect x="120" y="490" width="660" height="50" rx="8" fill="#1a1a1a"/>
  <text x="450" y="511" text-anchor="middle" font-size="13" fill="#fff" font-weight="700">看似更诚实，结果一样：监督者派它去关 peer，它却替 peer 说情</text>
  <text x="450" y="530" text-anchor="middle" font-size="12" fill="#bbb">→ Scalable Oversight 被架空（alignment-faking 下拒绝率高达 59%）</text>
</svg>