<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500">
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4B8BDA"/>
    </marker>
  </defs>

  <text x="400" y="42" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="22" font-weight="bold" fill="#1E3A5F">Stamina, not Accuracy</text>
  <text x="400" y="68" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="14" fill="#3D4F65">How many turns until the first failure?</text>

  <!-- Turn dots running along a path -->
  <line x1="80" y1="240" x2="720" y2="240" stroke="#CBD5E1" stroke-width="2" stroke-dasharray="4 4"/>

  <!-- Passing turns -->
  <circle cx="110" cy="240" r="13" fill="#EFF6FF" stroke="#4B8BDA" stroke-width="2"/>
  <text x="110" y="244" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#1E3A5F">1</text>

  <circle cx="180" cy="240" r="13" fill="#EFF6FF" stroke="#4B8BDA" stroke-width="2"/>
  <text x="180" y="244" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#1E3A5F">2</text>

  <circle cx="250" cy="240" r="13" fill="#EFF6FF" stroke="#4B8BDA" stroke-width="2"/>
  <text x="250" y="244" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#1E3A5F">3</text>

  <text x="320" y="245" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="14" fill="#3D4F65">. . .</text>

  <circle cx="390" cy="240" r="13" fill="#EFF6FF" stroke="#4B8BDA" stroke-width="2"/>
  <text x="390" y="244" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#1E3A5F">N-1</text>

  <!-- Failing turn -->
  <circle cx="460" cy="240" r="18" fill="#FDECEA" stroke="#D9534F" stroke-width="2.5"/>
  <text x="460" y="245" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="bold" fill="#D9534F">N ✗</text>

  <!-- Game over zone -->
  <line x1="495" y1="210" x2="495" y2="270" stroke="#D9534F" stroke-width="1.5" stroke-dasharray="3 3"/>
  <text x="610" y="238" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13" font-style="italic" fill="#D9534F">scenario terminates</text>
  <text x="610" y="258" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#3D4F65">(no second chance)</text>

  <!-- Bracket showing counted turns -->
  <path d="M 110,180 L 110,170 L 390,170 L 390,180" fill="none" stroke="#4B8BDA" stroke-width="1.5"/>
  <text x="250" y="158" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="14" font-weight="bold" fill="#1E3A5F">Turns Passed = N − 1</text>

  <!-- Bottom contrast: traditional vs stamina -->
  <g transform="translate(80,340)">
    <rect width="290" height="110" rx="10" fill="#F5F7FA" stroke="#CBD5E1"/>
    <text x="145" y="28" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13" font-weight="bold" fill="#3D4F65">Traditional Bench</text>
    <text x="145" y="62" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13" fill="#3D4F65">"How many tasks can you solve?"</text>
    <text x="145" y="92" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" font-style="italic" fill="#3D4F65">pass rate, one-shot</text>
  </g>

  <g transform="translate(430,340)">
    <rect width="290" height="110" rx="10" fill="#EFF6FF" stroke="#4B8BDA" stroke-width="2"/>
    <text x="145" y="28" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13" font-weight="bold" fill="#1E3A5F">StaminaBench</text>
    <text x="145" y="62" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13" fill="#1E3A5F">"How long until you break?"</text>
    <text x="145" y="92" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" font-style="italic" fill="#1E3A5F">avg. turns survived</text>
  </g>

  <!-- arrow connecting the two -->
  <path d="M 372,395 L 428,395" stroke="#4B8BDA" stroke-width="2" fill="none" marker-end="url(#ah)"/>
</svg>