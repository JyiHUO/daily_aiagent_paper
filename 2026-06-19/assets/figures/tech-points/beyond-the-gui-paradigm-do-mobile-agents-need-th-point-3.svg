<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 420" font-family="-apple-system,Segoe UI,sans-serif">
  <!-- Title -->
  <text x="300" y="36" text-anchor="middle" font-size="17" font-weight="700" fill="#1E3A5F">CLI 的天花板与盲区</text>
  <text x="300" y="58" text-anchor="middle" font-size="12" fill="#3D4F65">纯命令行能解多少手机任务？</text>

  <!-- Big circle: total tasks -->
  <circle cx="260" cy="240" r="120" fill="#EFF6FF" stroke="#4B8BDA" stroke-width="1.5"/>

  <!-- CLI solvable arc (about 88%) -->
  <path d="M 260 120 A 120 120 0 1 1 231 358.5 L 260 240 Z" fill="#DCE9F8" stroke="#4B8BDA" stroke-width="1.5"/>

  <!-- Labels inside CLI region -->
  <text x="235" y="225" text-anchor="middle" font-size="24" font-weight="700" fill="#1E3A5F">~88%</text>
  <text x="235" y="248" text-anchor="middle" font-size="12" fill="#3D4F65">CLI 可解</text>
  <text x="235" y="264" text-anchor="middle" font-size="11" fill="#3D4F65">(终端 / ADB)</text>

  <!-- Visual-only slice label -->
  <text x="330" y="320" text-anchor="middle" font-size="13" font-weight="700" fill="#B8651B">~12%</text>
  <text x="330" y="338" text-anchor="middle" font-size="11" fill="#B8651B">必须看屏幕</text>

  <!-- Side icons: visual-only tasks -->
  <g transform="translate(500,180)">
    <rect x="-36" y="-24" width="72" height="48" rx="6" fill="#FFF4E6" stroke="#D98E3F" stroke-width="1.5"/>
    <circle cx="0" cy="0" r="11" fill="none" stroke="#D98E3F" stroke-width="1.5"/>
    <circle cx="0" cy="0" r="4" fill="#D98E3F"/>
    <text x="0" y="44" text-anchor="middle" font-size="11" fill="#1E3A5F">拍照</text>
  </g>

  <g transform="translate(500,300)">
    <rect x="-36" y="-24" width="72" height="48" rx="6" fill="#FFF4E6" stroke="#D98E3F" stroke-width="1.5"/>
    <path d="M -16 8 L -4 -8 L 4 4 L 16 -10" fill="none" stroke="#D98E3F" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="0" y="44" text-anchor="middle" font-size="11" fill="#1E3A5F">画图 / 看图</text>
  </g>

  <!-- Arrow marker -->
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4B8BDA"/>
    </marker>
  </defs>

  <!-- Arrows from icons pointing into the orange slice -->
  <path d="M 460 188 Q 400 240 348 312" fill="none" stroke="#4B8BDA" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arr)"/>
  <path d="M 460 300 Q 405 318 358 322" fill="none" stroke="#4B8BDA" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arr)"/>

  <!-- Bottom caption -->
  <text x="300" y="402" text-anchor="middle" font-size="11" fill="#3D4F65">屏幕并非必需 —— 但视觉任务仍是不可替代的盲区</text>
</svg>