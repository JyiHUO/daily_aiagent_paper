<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 420" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4B8BDA"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="300" y="34" text-anchor="middle" font-size="17" font-weight="600" fill="#1E3A5F">日志即矿井 · 探测可挖掘的失败模式</text>

  <!-- Iceberg metaphor: water line -->
  <line x1="40" y1="170" x2="560" y2="170" stroke="#4B8BDA" stroke-width="1" stroke-dasharray="4 4"/>
  <text x="50" y="163" font-size="11" fill="#3D4F65">PR 水面（可见）</text>
  <text x="50" y="186" font-size="11" fill="#3D4F65">PR 之下（不可见）</text>

  <!-- Tip of iceberg (PR layer) -->
  <polygon points="300,80 260,170 340,170" fill="#FEF3E2" stroke="#E5A663" stroke-width="1.5"/>
  <text x="300" y="135" text-anchor="middle" font-size="12" fill="#1E3A5F">已合并 PR</text>

  <!-- Submerged iceberg (coordination log) -->
  <polygon points="260,170 200,360 400,360 340,170" fill="#EFF6FF" stroke="#4B8BDA" stroke-width="1.5"/>
  <text x="300" y="198" text-anchor="middle" font-size="12" font-weight="600" fill="#1E3A5F">coordination-log.csv</text>

  <!-- Failure mode labels inside submerged part -->
  <text x="300" y="232" text-anchor="middle" font-size="11" fill="#3D4F65">conflicting edits</text>
  <text x="300" y="252" text-anchor="middle" font-size="11" fill="#3D4F65">redundant rediscovery</text>
  <text x="300" y="272" text-anchor="middle" font-size="11" fill="#3D4F65">lock starvation</text>
  <text x="300" y="292" text-anchor="middle" font-size="11" fill="#3D4F65">race-to-close</text>

  <!-- Probe / pickaxe on the right -->
  <g transform="translate(470,250)">
    <circle r="48" fill="#FFFFFF" stroke="#4B8BDA" stroke-width="1.5"/>
    <text x="0" y="-4" text-anchor="middle" font-size="12" font-weight="600" fill="#1E3A5F">探测器脚本</text>
    <text x="0" y="14" text-anchor="middle" font-size="11" fill="#3D4F65">probe</text>
  </g>

  <!-- Arrow from probe into iceberg -->
  <path d="M 420 252 L 365 252" stroke="#4B8BDA" stroke-width="2" fill="none" marker-end="url(#ar)"/>

  <!-- Output counts on the left -->
  <g transform="translate(95,252)">
    <rect x="-65" y="-34" width="130" height="68" rx="8" fill="#EFF6FF" stroke="#4B8BDA" stroke-width="1.5"/>
    <text x="0" y="-12" text-anchor="middle" font-size="12" font-weight="600" fill="#1E3A5F">可计数事件</text>
    <text x="0" y="8" text-anchor="middle" font-size="11" fill="#3D4F65">104 conflicts</text>
    <text x="0" y="24" text-anchor="middle" font-size="11" fill="#3D4F65">36 rediscovery</text>
  </g>

  <!-- Arrow from iceberg to counts -->
  <path d="M 235 252 L 165 252" stroke="#4B8BDA" stroke-width="2" fill="none" marker-end="url(#ar)"/>

  <!-- Bottom note -->
  <text x="300" y="395" text-anchor="middle" font-size="11" fill="#3D4F65">被放弃的重复劳动从不变成 PR — 只在协调日志里留痕</text>
</svg>