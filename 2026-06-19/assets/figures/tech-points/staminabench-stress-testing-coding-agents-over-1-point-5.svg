<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4B8BDA"/>
    </marker>
  </defs>

  <text x="300" y="34" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="17" font-weight="bold" fill="#1E3A5F">Rules fade as turns grow</text>

  <!-- README book on the left, fixed -->
  <g>
    <rect x="50" y="120" width="120" height="150" rx="4" fill="#EFF6FF" stroke="#1E3A5F" stroke-width="2"/>
    <line x1="70" y1="150" x2="150" y2="150" stroke="#3D4F65" stroke-width="1.2"/>
    <line x1="70" y1="170" x2="150" y2="170" stroke="#3D4F65" stroke-width="1.2"/>
    <line x1="70" y1="190" x2="150" y2="190" stroke="#3D4F65" stroke-width="1.2"/>
    <line x1="70" y1="210" x2="135" y2="210" stroke="#3D4F65" stroke-width="1.2"/>
    <line x1="70" y1="230" x2="150" y2="230" stroke="#3D4F65" stroke-width="1.2"/>
    <line x1="70" y1="250" x2="120" y2="250" stroke="#3D4F65" stroke-width="1.2"/>
    <text x="110" y="295" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13" fill="#1E3A5F" font-weight="bold">README</text>
    <text x="110" y="312" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#3D4F65">always in workdir</text>
  </g>

  <!-- Agent attention fading: three eyes shrinking -->
  <g>
    <!-- turn 1 -->
    <circle cx="280" cy="170" r="26" fill="#FEF3C7" stroke="#D97706" stroke-width="2"/>
    <circle cx="280" cy="170" r="8" fill="#1E3A5F"/>
    <text x="280" y="220" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#3D4F65">turn 1</text>

    <!-- turn 30 -->
    <circle cx="380" cy="175" r="18" fill="#FEF3C7" stroke="#D97706" stroke-width="1.8" opacity="0.7"/>
    <circle cx="380" cy="175" r="5" fill="#1E3A5F" opacity="0.7"/>
    <text x="380" y="220" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#3D4F65">turn 30</text>

    <!-- turn 100 -->
    <circle cx="470" cy="180" r="11" fill="#FEF3C7" stroke="#D97706" stroke-width="1.5" opacity="0.4"/>
    <circle cx="470" cy="180" r="2.5" fill="#1E3A5F" opacity="0.4"/>
    <text x="470" y="220" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#3D4F65">turn 100</text>
  </g>

  <!-- Arrows from README to eyes, fading -->
  <line x1="170" y1="172" x2="251" y2="170" stroke="#4B8BDA" stroke-width="2" marker-end="url(#ar)"/>
  <line x1="170" y1="180" x2="359" y2="175" stroke="#4B8BDA" stroke-width="1.5" stroke-dasharray="4,3" opacity="0.6" marker-end="url(#ar)"/>
  <line x1="170" y1="188" x2="456" y2="180" stroke="#4B8BDA" stroke-width="1" stroke-dasharray="2,4" opacity="0.35" marker-end="url(#ar)"/>

  <!-- Bottom: forgotten rule example -->
  <g>
    <rect x="120" y="330" width="360" height="50" rx="6" fill="#FEE2E2" stroke="#B91C1C" stroke-width="1.5"/>
    <text x="300" y="352" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13" fill="#1E3A5F" font-weight="bold">"non-nullable" field → accepts null</text>
    <text x="300" y="370" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#3D4F65">context rot · lost in the middle</text>
  </g>
</svg>