<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 420" font-family="-apple-system, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4B8BDA"/>
    </marker>
    <marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#C97064"/>
    </marker>
  </defs>

  <text x="300" y="36" text-anchor="middle" font-size="17" font-weight="600" fill="#1E3A5F">100 轮持续改需求 · REST API 压力测试</text>

  <!-- Track -->
  <ellipse cx="300" cy="250" rx="220" ry="22" fill="#EFF6FF" stroke="#4B8BDA" stroke-width="1.5"/>
  <ellipse cx="300" cy="250" rx="220" ry="22" fill="none" stroke="#4B8BDA" stroke-dasharray="4 6" opacity="0.5"/>

  <!-- Agent -->
  <circle cx="120" cy="250" r="32" fill="#FFF4DB" stroke="#E0A93C" stroke-width="2"/>
  <text x="120" y="246" text-anchor="middle" font-size="12" font-weight="600" fill="#1E3A5F">Agent</text>
  <text x="120" y="262" text-anchor="middle" font-size="10" fill="#3D4F65">server.py</text>

  <!-- Turn markers -->
  <g font-size="10" fill="#3D4F65" text-anchor="middle">
    <circle cx="220" cy="250" r="4" fill="#4B8BDA"/>
    <text x="220" y="276">+Group</text>
    <circle cx="320" cy="250" r="4" fill="#4B8BDA"/>
    <text x="320" y="276">rename</text>
    <circle cx="420" cy="250" r="4" fill="#4B8BDA"/>
    <text x="420" y="276">cascade</text>
    <circle cx="500" cy="250" r="4" fill="#E0A93C"/>
    <text x="500" y="276">turn 100</text>
  </g>

  <!-- Forward arrow along track -->
  <path d="M 160 248 Q 330 222 495 244" fill="none" stroke="#4B8BDA" stroke-width="2" marker-end="url(#a)"/>

  <!-- NL spec input -->
  <rect x="60" y="90" width="170" height="56" rx="8" fill="#EFF6FF" stroke="#4B8BDA" stroke-width="1.5"/>
  <text x="145" y="112" text-anchor="middle" font-size="12" font-weight="600" fill="#1E3A5F">NL change request</text>
  <text x="145" y="130" text-anchor="middle" font-size="10" fill="#3D4F65">add field, rename, delete…</text>
  <path d="M 120 148 Q 110 180 115 218" fill="none" stroke="#4B8BDA" stroke-width="1.8" marker-end="url(#a)"/>

  <!-- HTTP test suite -->
  <rect x="370" y="90" width="170" height="56" rx="8" fill="#FCEEEE" stroke="#C97064" stroke-width="1.5"/>
  <text x="455" y="112" text-anchor="middle" font-size="12" font-weight="600" fill="#1E3A5F">HTTP test suite</text>
  <text x="455" y="130" text-anchor="middle" font-size="10" fill="#3D4F65">black-box pass / fail</text>
  <path d="M 370 148 Q 260 170 152 232" fill="none" stroke="#C97064" stroke-width="1.8" marker-end="url(#r)"/>

  <!-- Bottom note -->
  <text x="300" y="350" text-anchor="middle" font-size="11" fill="#3D4F65">程序化生成 · 语言无关 · 每轮通过才进入下一轮</text>
  <text x="300" y="372" text-anchor="middle" font-size="11" font-style="italic" fill="#1E3A5F">考的不是单步能力，是长程一致性</text>
</svg>