<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4B8BDA"/>
    </marker>
  </defs>

  <text x="400" y="40" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="bold" fill="#1E3A5F">同一模型，换 harness 差 6×</text>

  <!-- Same model in middle -->
  <circle cx="400" cy="250" r="58" fill="#FEF3C7" stroke="#D97706" stroke-width="2"/>
  <text x="400" y="246" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="bold" fill="#1E3A5F">GLM-5</text>
  <text x="400" y="268" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#3D4F65">同一模型</text>

  <!-- Left harness: good -->
  <rect x="60" y="180" width="200" height="150" rx="10" fill="#EFF6FF" stroke="#4B8BDA" stroke-width="2"/>
  <text x="160" y="210" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="bold" fill="#1E3A5F">OpenCode (稳健)</text>
  <text x="160" y="258" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="32" font-weight="bold" fill="#1E3A5F">57 轮</text>
  <text x="160" y="290" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#3D4F65">上下文管理稳、工具调用鲁棒</text>

  <!-- Right harness: bad -->
  <rect x="540" y="180" width="200" height="150" rx="10" fill="#FEE2E2" stroke="#DC2626" stroke-width="2"/>
  <text x="640" y="210" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="bold" fill="#1E3A5F">OpenHands (脆弱)</text>
  <text x="640" y="258" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="32" font-weight="bold" fill="#DC2626">8.7 轮</text>
  <text x="640" y="290" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#3D4F65">基础设施层面失误频发</text>

  <!-- Arrows from model to two harnesses -->
  <line x1="343" y1="240" x2="265" y2="225" stroke="#4B8BDA" stroke-width="2" marker-end="url(#ar)"/>
  <line x1="457" y1="240" x2="535" y2="225" stroke="#4B8BDA" stroke-width="2" marker-end="url(#ar)"/>

  <!-- Failure modes box for OpenHands -->
  <rect x="540" y="355" width="200" height="80" rx="8" fill="#FFFFFF" stroke="#DC2626" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="640" y="375" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="bold" fill="#DC2626">典型失败模式</text>
  <text x="640" y="394" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#3D4F65">loop-detection 污染 session</text>
  <text x="640" y="411" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#3D4F65">pkill 误杀自身进程</text>
  <text x="640" y="428" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#3D4F65">压缩时丢关键指令</text>

  <!-- Bottom message -->
  <text x="400" y="475" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#1E3A5F">长程瓶颈在 harness，不在模型</text>
</svg>