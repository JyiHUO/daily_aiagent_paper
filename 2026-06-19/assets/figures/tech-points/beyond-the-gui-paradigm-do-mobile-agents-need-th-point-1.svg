<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4B8BDA"/>
    </marker>
  </defs>

  <text x="400" y="36" text-anchor="middle" font-family="Helvetica,Arial" font-size="20" font-weight="bold" fill="#1E3A5F">Do mobile agents need the screen?</text>

  <!-- LEFT: GUI -->
  <g>
    <text x="200" y="80" text-anchor="middle" font-family="Helvetica,Arial" font-size="15" font-weight="bold" fill="#3D4F65">GUI Agent · looks at screen</text>

    <!-- phone -->
    <rect x="150" y="120" width="100" height="180" rx="12" fill="#EFF6FF" stroke="#1E3A5F" stroke-width="2"/>
    <rect x="160" y="138" width="80" height="130" fill="#FFFFFF" stroke="#B8CDE4"/>
    <circle cx="200" cy="285" r="5" fill="none" stroke="#1E3A5F" stroke-width="1.5"/>
    <rect x="170" y="150" width="18" height="18" fill="#D9E7F5"/>
    <rect x="194" y="150" width="18" height="18" fill="#D9E7F5"/>
    <rect x="218" y="150" width="14" height="18" fill="#D9E7F5"/>

    <!-- eye -->
    <ellipse cx="200" cy="370" rx="40" ry="22" fill="#FFFFFF" stroke="#1E3A5F" stroke-width="2"/>
    <circle cx="200" cy="370" r="10" fill="#4B8BDA"/>
    <circle cx="203" cy="367" r="3" fill="#FFFFFF"/>

    <line x1="200" y1="348" x2="200" y2="305" stroke="#4B8BDA" stroke-width="2" marker-end="url(#ar)" stroke-dasharray="4,3"/>

    <text x="200" y="425" text-anchor="middle" font-family="Helvetica,Arial" font-size="13" fill="#3D4F65">tap · swipe — 7 steps</text>
  </g>

  <!-- VS -->
  <text x="400" y="255" text-anchor="middle" font-family="Helvetica,Arial" font-size="22" font-weight="bold" fill="#C97A4A">vs</text>

  <!-- RIGHT: CLI -->
  <g>
    <text x="600" y="80" text-anchor="middle" font-family="Helvetica,Arial" font-size="15" font-weight="bold" fill="#3D4F65">Coding Agent · types ADB</text>

    <rect x="550" y="120" width="100" height="180" rx="12" fill="#EFF6FF" stroke="#1E3A5F" stroke-width="2"/>
    <rect x="560" y="138" width="80" height="130" fill="#FFFFFF" stroke="#B8CDE4"/>
    <circle cx="600" cy="285" r="5" fill="none" stroke="#1E3A5F" stroke-width="1.5"/>
    <text x="600" y="215" text-anchor="middle" font-family="Helvetica,Arial" font-size="36" fill="#B8CDE4">_</text>

    <!-- terminal -->
    <rect x="515" y="335" width="170" height="80" rx="6" fill="#1E3A5F"/>
    <text x="528" y="358" font-family="Courier,monospace" font-size="12" fill="#9DD0A8">$ adb shell ls /Movies</text>
    <text x="528" y="378" font-family="Courier,monospace" font-size="12" fill="#FFFFFF">$ adb shell rm zebra.mp4</text>
    <text x="528" y="398" font-family="Courier,monospace" font-size="12" fill="#9DD0A8">done.</text>

    <line x1="600" y1="335" x2="600" y2="305" stroke="#4B8BDA" stroke-width="2" marker-end="url(#ar)"/>

    <text x="600" y="440" text-anchor="middle" font-family="Helvetica,Arial" font-size="13" fill="#3D4F65">bash — 3 steps</text>
  </g>

  <text x="400" y="480" text-anchor="middle" font-family="Helvetica,Arial" font-size="13" font-weight="bold" fill="#C97A4A">No screenshots, no mobile fine-tuning — yet beats GUI baselines</text>
</svg>