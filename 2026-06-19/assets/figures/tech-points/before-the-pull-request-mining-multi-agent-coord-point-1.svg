<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 420" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#4B8BDA"/>
    </marker>
  </defs>

  <text x="300" y="34" text-anchor="middle" font-size="17" font-weight="700" fill="#1E3A5F">grite: coordination lives inside git</text>

  <!-- Git repo container -->
  <rect x="60" y="70" width="480" height="300" rx="14" fill="#EFF6FF" stroke="#4B8BDA" stroke-width="2"/>
  <text x="80" y="96" font-size="13" fill="#1E3A5F" font-weight="700">git repo</text>

  <!-- Code branch (left) -->
  <circle cx="155" cy="200" r="58" fill="#FFFFFF" stroke="#3D4F65" stroke-width="1.5"/>
  <text x="155" y="195" text-anchor="middle" font-size="12" fill="#1E3A5F" font-weight="700">code</text>
  <text x="155" y="213" text-anchor="middle" font-size="11" fill="#3D4F65">refs/heads</text>

  <!-- WAL log (right) -->
  <g>
    <rect x="305" y="125" width="210" height="180" rx="8" fill="#FFFFFF" stroke="#D97757" stroke-width="2"/>
    <text x="410" y="148" text-anchor="middle" font-size="12" font-weight="700" fill="#1E3A5F">refs/grite/wal (append-only)</text>

    <!-- event chain -->
    <rect x="320" y="165" width="180" height="34" rx="3" fill="#FFF1EC" stroke="#D97757"/>
    <text x="330" y="180" font-size="10" fill="#1E3A5F">#a3f  claim issue 6</text>
    <text x="330" y="193" font-size="9" fill="#3D4F65">BLAKE2b id</text>

    <rect x="320" y="207" width="180" height="34" rx="3" fill="#FFF1EC" stroke="#D97757"/>
    <text x="330" y="222" font-size="10" fill="#1E3A5F">#b71  state-changed</text>
    <text x="330" y="235" font-size="9" fill="#3D4F65">Ed25519 signed</text>

    <rect x="320" y="249" width="180" height="34" rx="3" fill="#FFF1EC" stroke="#D97757"/>
    <text x="330" y="264" font-size="10" fill="#1E3A5F">#c92  closed</text>
    <text x="330" y="277" font-size="9" fill="#3D4F65">replayed into KV view</text>
  </g>

  <!-- link code <-> log -->
  <path d="M213 200 L305 215" stroke="#4B8BDA" stroke-width="1.5" stroke-dasharray="4 3" fill="none"/>
  <text x="259" y="196" text-anchor="middle" font-size="10" fill="#3D4F65">same repo</text>

  <!-- Agents -->
  <g>
    <circle cx="115" cy="335" r="18" fill="#1E3A5F"/>
    <text x="115" y="340" text-anchor="middle" font-size="11" fill="#FFFFFF" font-weight="700">A1</text>
    <circle cx="170" cy="335" r="18" fill="#1E3A5F"/>
    <text x="170" y="340" text-anchor="middle" font-size="11" fill="#FFFFFF" font-weight="700">A2</text>
  </g>

  <!-- agents push events into WAL -->
  <path d="M188 326 L318 290" stroke="#4B8BDA" stroke-width="1.8" fill="none" marker-end="url(#a)"/>
  <text x="220" y="312" font-size="10" fill="#3D4F65">push / fetch (CRDT merge)</text>

  <!-- bottom annotation -->
  <text x="300" y="395" text-anchor="middle" font-size="11" fill="#3D4F65">content-addressed · signed · no central server</text>
</svg>