<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 460" font-family="Helvetica, Arial, sans-serif">
  <!-- Title -->
  <text x="300" y="34" text-anchor="middle" font-size="18" font-weight="700" fill="#1E3A5F">Five Memory Skills of an Experienced Colleague</text>

  <!-- Central figure: experienced colleague badge -->
  <circle cx="300" cy="248" r="60" fill="#FFF4E0" stroke="#E0A458" stroke-width="2"/>
  <circle cx="300" cy="232" r="16" fill="#E0A458" opacity="0.9"/>
  <path d="M272 286 Q300 260 328 286 L328 300 L272 300 Z" fill="#E0A458" opacity="0.9"/>
  <text x="300" y="338" text-anchor="middle" font-size="13" font-weight="600" fill="#1E3A5F">Senior Agent</text>

  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4B8BDA"/>
    </marker>
  </defs>

  <!-- 1 Static State (top-left) -->
  <rect x="40" y="80" width="170" height="56" rx="10" fill="#EFF6FF" stroke="#4B8BDA" stroke-width="1.6"/>
  <text x="125" y="104" text-anchor="middle" font-size="13" font-weight="600" fill="#1E3A5F">Static State</text>
  <text x="125" y="122" text-anchor="middle" font-size="11" fill="#3D4F65">where things live</text>

  <!-- 2 Dynamic State (top-right) -->
  <rect x="390" y="80" width="170" height="56" rx="10" fill="#EFF6FF" stroke="#4B8BDA" stroke-width="1.6"/>
  <text x="475" y="104" text-anchor="middle" font-size="13" font-weight="600" fill="#1E3A5F">Dynamic State</text>
  <text x="475" y="122" text-anchor="middle" font-size="11" fill="#3D4F65">what just changed</text>

  <!-- 3 Workflow (left) -->
  <rect x="20" y="220" width="170" height="56" rx="10" fill="#EFF6FF" stroke="#4B8BDA" stroke-width="1.6"/>
  <text x="105" y="244" text-anchor="middle" font-size="13" font-weight="600" fill="#1E3A5F">Workflow</text>
  <text x="105" y="262" text-anchor="middle" font-size="11" fill="#3D4F65">the standard way</text>

  <!-- 4 Gotchas (right) -->
  <rect x="410" y="220" width="170" height="56" rx="10" fill="#FFF1F0" stroke="#D26A6A" stroke-width="1.6"/>
  <text x="495" y="244" text-anchor="middle" font-size="13" font-weight="600" fill="#1E3A5F">Gotchas</text>
  <text x="495" y="262" text-anchor="middle" font-size="11" fill="#3D4F65">hidden traps</text>

  <!-- 5 Premise Check (bottom) -->
  <rect x="215" y="380" width="170" height="56" rx="10" fill="#FFF1F0" stroke="#D26A6A" stroke-width="1.6"/>
  <text x="300" y="404" text-anchor="middle" font-size="13" font-weight="600" fill="#1E3A5F">Premise Check</text>
  <text x="300" y="422" text-anchor="middle" font-size="11" fill="#3D4F65">spot false assumptions</text>

  <!-- Arrows from skills to center circle (edge ~ r=60 around 300,248) -->
  <line x1="195" y1="136" x2="258" y2="208" stroke="#4B8BDA" stroke-width="1.6" marker-end="url(#ar)"/>
  <line x1="405" y1="136" x2="342" y2="208" stroke="#4B8BDA" stroke-width="1.6" marker-end="url(#ar)"/>
  <line x1="190" y1="248" x2="238" y2="248" stroke="#4B8BDA" stroke-width="1.6" marker-end="url(#ar)"/>
  <line x1="410" y1="248" x2="362" y2="248" stroke="#4B8BDA" stroke-width="1.6" marker-end="url(#ar)"/>
  <line x1="300" y1="380" x2="300" y2="310" stroke="#4B8BDA" stroke-width="1.6" marker-end="url(#ar)"/>
</svg>