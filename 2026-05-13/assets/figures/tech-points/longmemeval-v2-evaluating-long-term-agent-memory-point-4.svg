<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 420" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4B8BDA"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="300" y="36" text-anchor="middle" font-size="18" font-weight="600" fill="#1E3A5F">AgentRunbook-C: Memory as Files</text>
  <text x="300" y="56" text-anchor="middle" font-size="12" fill="#3D4F65">trajectories on disk, read by a coding agent</text>

  <!-- Left: file cabinet (memory = files) -->
  <g transform="translate(60,100)">
    <rect x="0" y="0" width="150" height="210" rx="6" fill="#EFF6FF" stroke="#4B8BDA" stroke-width="1.5"/>
    <rect x="20" y="20" width="110" height="32" rx="3" fill="#FFFFFF" stroke="#4B8BDA"/>
    <text x="75" y="40" text-anchor="middle" font-size="11" fill="#1E3A5F">trajectory_001</text>
    <rect x="20" y="62" width="110" height="32" rx="3" fill="#FFFFFF" stroke="#4B8BDA"/>
    <text x="75" y="82" text-anchor="middle" font-size="11" fill="#1E3A5F">trajectory_002</text>
    <rect x="20" y="104" width="110" height="32" rx="3" fill="#FFFFFF" stroke="#4B8BDA"/>
    <text x="75" y="124" text-anchor="middle" font-size="11" fill="#1E3A5F">trajectory_003</text>
    <text x="75" y="160" text-anchor="middle" font-size="11" fill="#3D4F65">...</text>
    <text x="75" y="188" text-anchor="middle" font-size="11" fill="#3D4F65" font-style="italic">~115M tokens</text>
  </g>
  <text x="135" y="332" text-anchor="middle" font-size="12" fill="#1E3A5F" font-weight="600">memory = filesystem</text>

  <!-- Center: coding agent in sandbox -->
  <g transform="translate(245,120)">
    <rect x="0" y="0" width="180" height="170" rx="8" fill="#FFF4E6" stroke="#D4895A" stroke-width="1.5" stroke-dasharray="5,3"/>
    <text x="90" y="20" text-anchor="middle" font-size="11" fill="#8A5230">sandbox</text>
    <circle cx="90" cy="55" r="20" fill="#FFFFFF" stroke="#1E3A5F" stroke-width="1.5"/>
    <text x="90" y="60" text-anchor="middle" font-size="11" fill="#1E3A5F" font-weight="600">{ }</text>
    <text x="90" y="95" text-anchor="middle" font-size="12" fill="#1E3A5F" font-weight="600">Coding Agent</text>
    <text x="90" y="120" text-anchor="middle" font-size="10" fill="#3D4F65">workflow doc + manifest + helpers</text>
    <text x="90" y="140" text-anchor="middle" font-size="10" fill="#3D4F65">grep / view-state-span / search</text>
    <text x="90" y="158" text-anchor="middle" font-size="10" fill="#8A5230" font-style="italic">manifest first, then read trajectories</text>
  </g>
  <text x="335" y="332" text-anchor="middle" font-size="12" fill="#1E3A5F" font-weight="600">file ops as memory control</text>

  <!-- Right: output note -->
  <g transform="translate(460,140)">
    <rect x="0" y="0" width="100" height="130" rx="4" fill="#EFF6FF" stroke="#4B8BDA" stroke-width="1.5"/>
    <text x="50" y="22" text-anchor="middle" font-size="10" fill="#1E3A5F" font-weight="600">memo</text>
    <line x1="12" y1="30" x2="88" y2="30" stroke="#4B8BDA" stroke-width="1"/>
    <line x1="12" y1="48" x2="88" y2="48" stroke="#B8D4F0"/>
    <line x1="12" y1="62" x2="88" y2="62" stroke="#B8D4F0"/>
    <line x1="12" y1="76" x2="70" y2="76" stroke="#B8D4F0"/>
    <line x1="12" y1="94" x2="88" y2="94" stroke="#B8D4F0"/>
    <line x1="12" y1="108" x2="60" y2="108" stroke="#B8D4F0"/>
  </g>
  <text x="510" y="290" text-anchor="middle" font-size="12" fill="#1E3A5F" font-weight="600">note + evidence</text>

  <!-- Arrows -->
  <line x1="212" y1="205" x2="243" y2="205" stroke="#4B8BDA" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="427" y1="205" x2="457" y2="205" stroke="#4B8BDA" stroke-width="2" marker-end="url(#arr)"/>

  <!-- Bottom caption -->
  <text x="300" y="382" text-anchor="middle" font-size="11" fill="#3D4F65" font-style="italic">no custom memory module — just files and a coder (Codex + GPT-5.4-mini)</text>
</svg>