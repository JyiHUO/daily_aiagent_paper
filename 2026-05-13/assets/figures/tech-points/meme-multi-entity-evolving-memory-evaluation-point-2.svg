<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 420">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4B8BDA"/>
    </marker>
  </defs>

  <text x="300" y="34" text-anchor="middle" font-family="Helvetica,Arial" font-size="17" font-weight="700" fill="#1E3A5F">DAG 即真值：构造即验证</text>

  <!-- Left: DAG -->
  <g>
    <text x="135" y="78" text-anchor="middle" font-size="12" fill="#3D4F65" font-family="Helvetica,Arial">依赖图 (规则 φ)</text>

    <circle cx="135" cy="120" r="26" fill="#EFF6FF" stroke="#4B8BDA" stroke-width="2"/>
    <text x="135" y="124" text-anchor="middle" font-size="11" fill="#1E3A5F" font-family="Helvetica,Arial">lead</text>

    <circle cx="80" cy="220" r="24" fill="#EFF6FF" stroke="#4B8BDA" stroke-width="2"/>
    <text x="80" y="224" text-anchor="middle" font-size="10" fill="#1E3A5F" font-family="Helvetica,Arial">report</text>

    <circle cx="190" cy="220" r="24" fill="#EFF6FF" stroke="#4B8BDA" stroke-width="2"/>
    <text x="190" y="224" text-anchor="middle" font-size="10" fill="#1E3A5F" font-family="Helvetica,Arial">channel</text>

    <circle cx="135" cy="320" r="24" fill="#FDECEC" stroke="#D97757" stroke-width="2"/>
    <text x="135" y="324" text-anchor="middle" font-size="11" fill="#B0411A" font-family="Helvetica,Arial" font-weight="700">v*</text>

    <line x1="121" y1="142" x2="92" y2="198" stroke="#4B8BDA" stroke-width="1.6" marker-end="url(#a)"/>
    <line x1="149" y1="142" x2="178" y2="198" stroke="#4B8BDA" stroke-width="1.6" marker-end="url(#a)"/>
    <line x1="93" y1="242" x2="124" y2="298" stroke="#4B8BDA" stroke-width="1.6" marker-end="url(#a)"/>
    <line x1="177" y1="242" x2="146" y2="298" stroke="#4B8BDA" stroke-width="1.6" marker-end="url(#a)"/>

    <text x="135" y="368" text-anchor="middle" font-size="11" fill="#3D4F65" font-family="Helvetica,Arial" font-style="italic">沿边传播 → gold 答案</text>
  </g>

  <!-- arrow across -->
  <line x1="225" y1="220" x2="345" y2="220" stroke="#4B8BDA" stroke-width="2" marker-end="url(#a)"/>
  <text x="285" y="212" text-anchor="middle" font-size="11" fill="#1E3A5F" font-family="Helvetica,Arial">verbalize (LLM 自聊天)</text>

  <!-- Right: dialogue haystack -->
  <g>
    <text x="465" y="78" text-anchor="middle" font-size="12" fill="#3D4F65" font-family="Helvetica,Arial">35K token 对话 haystack</text>
    <rect x="355" y="95" width="220" height="250" rx="8" fill="#FFF6E8" stroke="#C89A4A" stroke-width="1.5"/>

    <rect x="370" y="115" width="120" height="14" rx="4" fill="#EFE2C8"/>
    <rect x="440" y="140" width="120" height="14" rx="4" fill="#EFE2C8"/>
    <rect x="370" y="165" width="100" height="14" rx="4" fill="#EFE2C8"/>
    <rect x="450" y="190" width="110" height="14" rx="4" fill="#EFE2C8"/>
    <rect x="370" y="215" width="160" height="16" rx="4" fill="#D6E8FB" stroke="#4B8BDA" stroke-width="1.2"/>
    <text x="450" y="226" text-anchor="middle" font-size="10" fill="#1E3A5F" font-family="Helvetica,Arial">"新 lead = Jihoon"</text>
    <rect x="440" y="242" width="120" height="14" rx="4" fill="#EFE2C8"/>
    <rect x="370" y="267" width="110" height="14" rx="4" fill="#EFE2C8"/>
    <rect x="430" y="292" width="130" height="14" rx="4" fill="#EFE2C8"/>
    <rect x="370" y="317" width="100" height="14" rx="4" fill="#EFE2C8"/>

    <text x="465" y="368" text-anchor="middle" font-size="11" fill="#B0411A" font-family="Helvetica,Arial" font-weight="600">v* 从不直接出现在对话中</text>
  </g>

  <text x="300" y="402" text-anchor="middle" font-size="11" fill="#3D4F65" font-family="Helvetica,Arial">Agent 必须沿依赖链多跳推理才能命中 v*</text>
</svg>