<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4B8BDA"/>
    </marker>
    <marker id="arrRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#C7553F"/>
    </marker>
  </defs>

  <text x="400" y="42" text-anchor="middle" font-size="20" font-weight="bold" fill="#1E3A5F">上游事实变了，下游跟不跟？</text>
  <text x="400" y="66" text-anchor="middle" font-size="13" fill="#3D4F65">六大记忆系统在 Cascade 推理上集体失守</text>

  <!-- Memory store -->
  <rect x="60" y="130" width="240" height="220" rx="10" fill="#EFF6FF" stroke="#4B8BDA" stroke-width="1.5"/>
  <text x="180" y="156" text-anchor="middle" font-size="14" font-weight="bold" fill="#1E3A5F">记忆库里其实都有</text>

  <rect x="85" y="175" width="190" height="38" rx="5" fill="#FFFFFF" stroke="#4B8BDA"/>
  <text x="180" y="199" text-anchor="middle" font-size="12" fill="#3D4F65">规则 / 旧值 (pre-change)</text>

  <rect x="85" y="223" width="190" height="38" rx="5" fill="#FFFFFF" stroke="#C7553F"/>
  <text x="180" y="247" text-anchor="middle" font-size="12" fill="#C7553F">change 事件（新值）</text>

  <rect x="85" y="271" width="190" height="38" rx="5" fill="#FFFFFF" stroke="#4B8BDA"/>
  <text x="180" y="295" text-anchor="middle" font-size="12" fill="#3D4F65">依赖事实</text>

  <text x="180" y="332" text-anchor="middle" font-size="11" fill="#3D4F65">encoding/maintenance 都没丢</text>

  <!-- Retrieval funnel -->
  <polygon points="360,175 480,175 450,255 390,255" fill="#FFF4E6" stroke="#E08A3C" stroke-width="1.5"/>
  <text x="420" y="210" text-anchor="middle" font-size="13" font-weight="bold" fill="#1E3A5F">检索 top-k</text>
  <text x="420" y="232" text-anchor="middle" font-size="11" fill="#3D4F65">按相似度排序</text>
  <text x="420" y="285" text-anchor="middle" font-size="11" fill="#C7553F">change 被挤出</text>

  <!-- Answering LLM -->
  <rect x="540" y="170" width="200" height="110" rx="10" fill="#EFF6FF" stroke="#4B8BDA" stroke-width="1.5"/>
  <text x="640" y="200" text-anchor="middle" font-size="14" font-weight="bold" fill="#1E3A5F">Answering LLM</text>
  <text x="640" y="228" text-anchor="middle" font-size="12" fill="#3D4F65">只看到旧值</text>
  <text x="640" y="255" text-anchor="middle" font-size="12" fill="#C7553F">→ 照报旧答案</text>

  <!-- arrows: rule + old value go through -->
  <line x1="278" y1="194" x2="362" y2="194" stroke="#4B8BDA" stroke-width="1.8" marker-end="url(#arr)"/>
  <line x1="278" y1="290" x2="388" y2="240" stroke="#4B8BDA" stroke-width="1.8" marker-end="url(#arr)"/>

  <!-- change event blocked -->
  <line x1="278" y1="242" x2="355" y2="242" stroke="#C7553F" stroke-width="1.8" stroke-dasharray="5,4"/>
  <line x1="350" y1="230" x2="372" y2="254" stroke="#C7553F" stroke-width="2.2"/>
  <line x1="372" y1="230" x2="350" y2="254" stroke="#C7553F" stroke-width="2.2"/>

  <!-- funnel to LLM -->
  <line x1="480" y1="215" x2="538" y2="215" stroke="#4B8BDA" stroke-width="1.8" marker-end="url(#arr)"/>

  <!-- Bottom score band -->
  <rect x="60" y="385" width="680" height="80" rx="8" fill="#F8F1EC" stroke="#C7553F" stroke-width="1.2"/>
  <text x="400" y="412" text-anchor="middle" font-size="13" font-weight="bold" fill="#1E3A5F">结构性失败 · 不是调参能救的</text>
  <text x="170" y="442" text-anchor="middle" font-size="13" fill="#C7553F" font-weight="bold">Cascade ≈ 0.03</text>
  <text x="400" y="442" text-anchor="middle" font-size="13" fill="#C7553F" font-weight="bold">Absence ≈ 0.01</text>
  <text x="630" y="442" text-anchor="middle" font-size="13" fill="#3D4F65" font-weight="bold">最佳系统 overall 0.42</text>
</svg>