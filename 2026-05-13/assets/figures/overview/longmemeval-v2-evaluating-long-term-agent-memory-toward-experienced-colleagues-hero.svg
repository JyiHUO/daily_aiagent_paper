<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 640" font-family="'PingFang SC','Helvetica Neue',Arial,sans-serif">
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4B8BDA"/>
    </marker>
    <marker id="ahw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#C97A4A"/>
    </marker>
  </defs>

  <rect width="900" height="640" fill="#FAFAF6"/>

  <text x="450" y="48" text-anchor="middle" font-size="22" font-weight="700" fill="#1E3A5F">LongMemEval-V2：让 Agent 成为环境里的"资深同事"</text>
  <text x="450" y="72" text-anchor="middle" font-size="13" fill="#3D4F65">把长期工作经验沉淀为可被检索的记忆 · 451 题 / 500 轨迹 / 115M tokens</text>

  <!-- LEFT: New colleague -->
  <g>
    <circle cx="140" cy="340" r="62" fill="#FFF1E6" stroke="#C97A4A" stroke-width="2"/>
    <text x="140" y="320" text-anchor="middle" font-size="13" fill="#1E3A5F" font-weight="600">新人 Agent</text>
    <text x="140" y="350" text-anchor="middle" font-size="26">🤖</text>
    <text x="140" y="378" text-anchor="middle" font-size="11" fill="#8A5A3B">无环境记忆</text>
  </g>

  <!-- RIGHT: Experienced colleague -->
  <g>
    <circle cx="760" cy="340" r="78" fill="#EFF6FF" stroke="#4B8BDA" stroke-width="2.5"/>
    <text x="760" y="316" text-anchor="middle" font-size="13" fill="#1E3A5F" font-weight="700">资深同事 Agent</text>
    <text x="760" y="350" text-anchor="middle" font-size="30">🧠</text>
    <text x="760" y="380" text-anchor="middle" font-size="11" fill="#3D4F65">内化环境经验 · 72.5% 准确</text>
  </g>

  <!-- arrow new -> experienced -->
  <path d="M 200 305 Q 450 205 698 305" fill="none" stroke="#C97A4A" stroke-width="2" stroke-dasharray="5,4" marker-end="url(#ahw)"/>
  <text x="450" y="220" text-anchor="middle" font-size="12" fill="#8A5A3B" font-weight="600">经验内化 · 长期记忆</text>

  <!-- CENTER: Memory core -->
  <g>
    <rect x="320" y="250" width="260" height="200" rx="10" fill="#FFFFFF" stroke="#1E3A5F" stroke-width="2"/>
    <text x="450" y="278" text-anchor="middle" font-size="14" font-weight="700" fill="#1E3A5F">记忆系统 (Insert / Query)</text>
    <line x1="340" y1="290" x2="560" y2="290" stroke="#CBD5E1"/>

    <g font-size="11.5" fill="#1E3A5F">
      <rect x="335" y="302" width="115" height="26" rx="13" fill="#EFF6FF" stroke="#4B8BDA"/>
      <text x="392" y="320" text-anchor="middle">静态状态回忆</text>

      <rect x="455" y="302" width="115" height="26" rx="13" fill="#EFF6FF" stroke="#4B8BDA"/>
      <text x="512" y="320" text-anchor="middle">动态状态追踪</text>

      <rect x="335" y="335" width="115" height="26" rx="13" fill="#EFF6FF" stroke="#4B8BDA"/>
      <text x="392" y="353" text-anchor="middle">工作流知识</text>

      <rect x="455" y="335" width="115" height="26" rx="13" fill="#EFF6FF" stroke="#4B8BDA"/>
      <text x="512" y="353" text-anchor="middle">环境坑点 Gotchas</text>

      <rect x="395" y="368" width="115" height="26" rx="13" fill="#FFF1E6" stroke="#C97A4A"/>
      <text x="452" y="386" text-anchor="middle">前提觉知 (假题)</text>
    </g>

    <line x1="340" y1="408" x2="560" y2="408" stroke="#CBD5E1" stroke-dasharray="3,3"/>
    <text x="392" y="427" text-anchor="middle" font-size="11.5" font-weight="600" fill="#3D4F65">AgentRunbook-R</text>
    <text x="392" y="441" text-anchor="middle" font-size="10" fill="#3D4F65">三池 RAG · 低延迟</text>

    <text x="512" y="427" text-anchor="middle" font-size="11.5" font-weight="600" fill="#C97A4A">AgentRunbook-C</text>
    <text x="512" y="441" text-anchor="middle" font-size="10" fill="#3D4F65">轨迹即文件 · Coding Agent</text>
  </g>

  <!-- Insert flow -->
  <g>
    <rect x="60" y="470" width="220" height="90" rx="8" fill="#F1F5F9" stroke="#3D4F65" stroke-width="1.5"/>
    <text x="170" y="495" text-anchor="middle" font-size="13" font-weight="700" fill="#1E3A5F">历史轨迹 Haystack</text>
    <text x="170" y="516" text-anchor="middle" font-size="11" fill="#3D4F65">WebArena · WorkArena</text>
    <text x="170" y="535" text-anchor="middle" font-size="11" fill="#3D4F65">500 条轨迹 · 115M tokens</text>
    <text x="170" y="552" text-anchor="middle" font-size="10" fill="#94A3B8">证据稀疏 · 多模态截图</text>
  </g>
  <path d="M 280 490 Q 310 460 325 450" fill="none" stroke="#4B8BDA" stroke-width="2" marker-end="url(#ah)"/>
  <text x="288" y="460" font-size="11" fill="#4B8BDA" font-weight="600">Insert</text>

  <!-- Query flow -->
  <g>
    <rect x="620" y="470" width="220" height="90" rx="8" fill="#F1F5F9" stroke="#3D4F65" stroke-width="1.5"/>
    <text x="730" y="495" text-anchor="middle" font-size="13" font-weight="700" fill="#1E3A5F">固定 Reader 答题</text>
    <text x="730" y="516" text-anchor="middle" font-size="11" fill="#3D4F65">≤200K tokens 紧凑证据</text>
    <text x="730" y="535" text-anchor="middle" font-size="11" fill="#3D4F65">解耦记忆质量 vs 答题</text>
    <text x="730" y="552" text-anchor="middle" font-size="10" fill="#94A3B8">截图 + 笔记 + 状态片段</text>
  </g>
  <path d="M 575 450 Q 600 460 620 490" fill="none" stroke="#4B8BDA" stroke-width="2" marker-end="url(#ah)"/>
  <text x="602" y="460" font-size="11" fill="#4B8BDA" font-weight="600">Query</text>

  <!-- return arrow to right agent -->
  <path d="M 760 470 L 760 422" fill="none" stroke="#4B8BDA" stroke-width="2" marker-end="url(#ah)"/>

  <!-- left agent connects to haystack -->
  <path d="M 140 405 L 140 468" fill="none" stroke="#C97A4A" stroke-width="1.5" stroke-dasharray="4,3"/>

  <text x="450" y="610" text-anchor="middle" font-size="11" fill="#94A3B8">把环境经验从噪声轨迹中筛出 — 记忆系统是新人成长为资深同事的桥</text>
</svg>