<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 680" font-family="'PingFang SC','Microsoft YaHei',sans-serif">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4B8BDA"/>
    </marker>
    <marker id="arO" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#E8833A"/>
    </marker>
  </defs>

  <rect width="900" height="680" fill="#FAFBFC"/>

  <text x="450" y="44" text-anchor="middle" font-size="22" font-weight="700" fill="#1E3A5F">当模拟在说谎：工具调用 Agent 的 Sim-to-Real 鸿沟</text>
  <text x="450" y="68" text-anchor="middle" font-size="13" fill="#3D4F65">RobustBench-TC 基准 &amp; ToolRL-DR 域随机化训练</text>

  <g>
    <rect x="50" y="110" width="240" height="180" rx="14" fill="#EFF6FF" stroke="#4B8BDA" stroke-width="1.5"/>
    <text x="170" y="138" text-anchor="middle" font-size="14" font-weight="700" fill="#1E3A5F">干净模拟环境</text>
    <text x="170" y="158" text-anchor="middle" font-size="11" fill="#3D4F65">现有 Benchmark 假设</text>
    <text x="74" y="190" font-size="11.5" fill="#3D4F65">✓ 用户输入规范</text>
    <text x="74" y="212" font-size="11.5" fill="#3D4F65">✓ 工具注册表清晰</text>
    <text x="74" y="234" font-size="11.5" fill="#3D4F65">✓ API 调用稳定</text>
    <text x="74" y="256" font-size="11.5" fill="#3D4F65">✓ 描述真实可信</text>
    <text x="74" y="278" font-size="11" fill="#7A8A9E" font-style="italic">→ 模型轻松刷高分</text>
  </g>

  <g>
    <rect x="610" y="110" width="240" height="180" rx="14" fill="#FDF1E7" stroke="#E8833A" stroke-width="1.5"/>
    <text x="730" y="138" text-anchor="middle" font-size="14" font-weight="700" fill="#8B4513">真实部署现场</text>
    <text x="730" y="158" text-anchor="middle" font-size="11" fill="#6B4423">来自 GitHub Issue 的事故</text>
    <text x="634" y="190" font-size="11.5" fill="#6B4423">✗ typo 被抄进幻觉工具名</text>
    <text x="634" y="212" font-size="11.5" fill="#6B4423">✗ 同名工具冻结 SDK</text>
    <text x="634" y="234" font-size="11.5" fill="#6B4423">✗ "-Fast" 后缀骗模型选错</text>
    <text x="634" y="256" font-size="11.5" fill="#6B4423">✗ 429 / Timeout 直接放弃</text>
    <text x="634" y="278" font-size="11" fill="#A0522D" font-style="italic">→ Agent 集体翻车</text>
  </g>

  <path d="M295 200 Q 450 180 605 200" stroke="#E8833A" stroke-width="2" fill="none" stroke-dasharray="6,4" marker-end="url(#arO)"/>
  <text x="450" y="172" text-anchor="middle" font-size="12" font-weight="700" fill="#E8833A">Sim-to-Real 鸿沟</text>

  <g>
    <rect x="240" y="320" width="420" height="180" rx="14" fill="#FFFFFF" stroke="#1E3A5F" stroke-width="2"/>
    <text x="450" y="346" text-anchor="middle" font-size="14" font-weight="700" fill="#1E3A5F">RobustBench-TC：把失败按 POMDP 拆成四通道</text>

    <g>
      <rect x="260" y="362" width="190" height="58" rx="8" fill="#EFF6FF" stroke="#4B8BDA"/>
      <text x="270" y="382" font-size="12" font-weight="700" fill="#1E3A5F">Observation 观测</text>
      <text x="270" y="400" font-size="10.5" fill="#3D4F65">query / 描述带 typo</text>
      <text x="440" y="414" text-anchor="end" font-size="11" font-weight="700" fill="#2E7D5B">下降 &lt;5%</text>
    </g>
    <g>
      <rect x="460" y="362" width="190" height="58" rx="8" fill="#EFF6FF" stroke="#4B8BDA"/>
      <text x="470" y="382" font-size="12" font-weight="700" fill="#1E3A5F">Action 动作空间</text>
      <text x="470" y="400" font-size="10.5" fill="#3D4F65">同名 / 冗余干扰工具</text>
      <text x="640" y="414" text-anchor="end" font-size="11" font-weight="700" fill="#C77700">中等</text>
    </g>
    <g>
      <rect x="260" y="428" width="190" height="58" rx="8" fill="#FDF1E7" stroke="#E8833A"/>
      <text x="270" y="448" font-size="12" font-weight="700" fill="#8B4513">Reward 元信息</text>
      <text x="270" y="466" font-size="10.5" fill="#6B4423">"-Fast" 误导命名</text>
      <text x="440" y="480" text-anchor="end" font-size="11" font-weight="700" fill="#C0392B">↓40pp</text>
    </g>
    <g>
      <rect x="460" y="428" width="190" height="58" rx="8" fill="#FDF1E7" stroke="#E8833A"/>
      <text x="470" y="448" font-size="12" font-weight="700" fill="#8B4513">Transition 转移</text>
      <text x="470" y="466" font-size="10.5" fill="#6B4423">429 / 5xx / schema drift</text>
      <text x="640" y="480" text-anchor="end" font-size="11" font-weight="700" fill="#C0392B">↓30pp</text>
    </g>
  </g>

  <path d="M450 505 L 450 553" stroke="#4B8BDA" stroke-width="2" fill="none" marker-end="url(#ar)"/>
  <text x="460" y="532" font-size="11" fill="#3D4F65">域随机化</text>

  <g>
    <rect x="120" y="555" width="660" height="100" rx="14" fill="#EAF4EC" stroke="#2E7D5B" stroke-width="1.5"/>
    <text x="450" y="582" text-anchor="middle" font-size="14" font-weight="700" fill="#1B4D33">ToolRL-DR：在 3 个静态通道上随机化训练（不见 Transition）</text>

    <g transform="translate(145,598)">
      <rect width="150" height="42" rx="6" fill="#FFFFFF" stroke="#2E7D5B"/>
      <text x="75" y="18" text-anchor="middle" font-size="11" font-weight="700" fill="#1B4D33">3B 主干</text>
      <text x="75" y="34" text-anchor="middle" font-size="10" fill="#3D4F65">≈ 开源 14B 水平</text>
    </g>
    <g transform="translate(310,598)">
      <rect width="160" height="42" rx="6" fill="#FFFFFF" stroke="#2E7D5B"/>
      <text x="80" y="18" text-anchor="middle" font-size="11" font-weight="700" fill="#1B4D33">保留 ~75% 干净精度</text>
      <text x="80" y="34" text-anchor="middle" font-size="10" fill="#3D4F65">逼近 o4-mini</text>
    </g>
    <g transform="translate(485,598)">
      <rect width="150" height="42" rx="6" fill="#FFFFFF" stroke="#2E7D5B"/>
      <text x="75" y="18" text-anchor="middle" font-size="11" font-weight="700" fill="#1B4D33">闭合 27% Transition</text>
      <text x="75" y="34" text-anchor="middle" font-size="10" fill="#3D4F65">未见过的运行时错误</text>
    </g>
    <g transform="translate(650,598)">
      <rect width="115" height="42" rx="6" fill="#FFFFFF" stroke="#2E7D5B"/>
      <text x="57" y="18" text-anchor="middle" font-size="11" font-weight="700" fill="#1B4D33">习得 retry 策略</text>
      <text x="57" y="34" text-anchor="middle" font-size="10" fill="#3D4F65">遇错不再放弃</text>
    </g>
  </g>
</svg>