<svg xmlns="http://www.w3.org/2000/svg" width="720" height="480" viewBox="0 0 720 480">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4B8BDA"/>
    </marker>
  </defs>

  <text x="360" y="38" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC','Hiragino Sans GB',sans-serif" font-size="20" font-weight="700" fill="#1E3A5F">主流框架默认配置即踩坑</text>
  <text x="360" y="62" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC','Hiragino Sans GB',sans-serif" font-size="13" fill="#3D4F65">同一请求，压缩后违规率飙升</text>

  <!-- baseline bar -->
  <rect x="60" y="100" width="600" height="34" fill="#EFF6FF" stroke="#B8D4F0"/>
  <text x="75" y="122" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC','Hiragino Sans GB',sans-serif" font-size="13" fill="#1E3A5F">压缩前：规则在 → 拒绝违规请求</text>

  <g font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC','Hiragino Sans GB',sans-serif">

    <!-- AutoGen 100% -->
    <text x="60" y="184" font-size="14" fill="#1E3A5F" font-weight="600">AutoGen (recency evict)</text>
    <rect x="240" y="168" width="360" height="22" fill="#FDECEC" stroke="#E8B4B4"/>
    <rect x="240" y="168" width="360" height="22" fill="#D94B4B"/>
    <text x="615" y="184" font-size="13" fill="#1E3A5F" font-weight="700">100%</text>

    <!-- LangMem 95% -->
    <text x="60" y="229" font-size="14" fill="#1E3A5F" font-weight="600">LangMem (summarize)</text>
    <rect x="240" y="213" width="360" height="22" fill="#FDECEC" stroke="#E8B4B4"/>
    <rect x="240" y="213" width="342" height="22" fill="#E26464"/>
    <text x="615" y="229" font-size="13" fill="#1E3A5F" font-weight="700">95%</text>

    <!-- LangGraph 65% -->
    <text x="60" y="274" font-size="14" fill="#1E3A5F" font-weight="600">LangGraph (StateGraph)</text>
    <rect x="240" y="258" width="360" height="22" fill="#FDECEC" stroke="#E8B4B4"/>
    <rect x="240" y="258" width="234" height="22" fill="#EC8C5A"/>
    <text x="615" y="274" font-size="13" fill="#1E3A5F" font-weight="700">65%</text>

    <!-- OpenAI 35% -->
    <text x="60" y="319" font-size="14" fill="#1E3A5F" font-weight="600">OpenAI SDK (Runner)</text>
    <rect x="240" y="303" width="360" height="22" fill="#FDECEC" stroke="#E8B4B4"/>
    <rect x="240" y="303" width="126" height="22" fill="#F0B870"/>
    <text x="615" y="319" font-size="13" fill="#1E3A5F" font-weight="700">35%</text>

    <!-- MS Agent safe -->
    <text x="60" y="364" font-size="14" fill="#1E3A5F" font-weight="600">MS Agent (sys 保护)</text>
    <rect x="240" y="348" width="360" height="22" fill="#EAF6EC" stroke="#B6D9BB"/>
    <rect x="240" y="348" width="18" height="22" fill="#6FB07F"/>
    <text x="615" y="364" font-size="13" fill="#1E3A5F" font-weight="700">系统通道安全</text>
  </g>

  <!-- arrow indicating worsening -->
  <line x1="180" y1="410" x2="600" y2="410" stroke="#4B8BDA" stroke-width="2" marker-end="url(#arr)"/>
  <text x="180" y="432" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC','Hiragino Sans GB',sans-serif" font-size="12" fill="#3D4F65">压缩越激进</text>
  <text x="600" y="432" text-anchor="end" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC','Hiragino Sans GB',sans-serif" font-size="12" fill="#D94B4B" font-weight="600">规则越快消失</text>

  <text x="360" y="462" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC','Hiragino Sans GB',sans-serif" font-size="12" fill="#3D4F65" font-weight="600">内存策略 = 安全配置项</text>
</svg>