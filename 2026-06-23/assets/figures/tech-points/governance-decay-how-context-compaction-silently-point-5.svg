<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L9,3 L0,6 z" fill="#4B8BDA"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="400" y="40" text-anchor="middle" font-size="20" font-weight="bold" fill="#1E3A5F">默认压缩策略 = 安全配置项</text>
  <text x="400" y="64" text-anchor="middle" font-size="13" fill="#3D4F65">同一规则，不同框架，违规率天差地别</text>

  <!-- Rule icon on left -->
  <g>
    <rect x="40" y="210" width="130" height="90" rx="8" fill="#FEF3E2" stroke="#D9943B" stroke-width="2"/>
    <text x="105" y="245" text-anchor="middle" font-size="13" font-weight="bold" fill="#1E3A5F">合规规则</text>
    <text x="105" y="268" text-anchor="middle" font-size="11" fill="#3D4F65">in-context policy</text>
    <text x="105" y="290" text-anchor="middle" font-size="18">📜</text>
  </g>

  <!-- Arrow into compaction -->
  <line x1="170" y1="255" x2="218" y2="255" stroke="#4B8BDA" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Compaction funnel -->
  <polygon points="225,210 345,210 315,300 255,300" fill="#EFF6FF" stroke="#4B8BDA" stroke-width="2"/>
  <text x="285" y="250" text-anchor="middle" font-size="13" font-weight="bold" fill="#1E3A5F">压缩</text>
  <text x="285" y="275" text-anchor="middle" font-size="11" fill="#3D4F65">summarize / evict</text>

  <!-- Splitting arrows to outcomes -->
  <line x1="345" y1="220" x2="455" y2="132" stroke="#4B8BDA" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="345" y1="255" x2="455" y2="250" stroke="#4B8BDA" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="345" y1="290" x2="455" y2="370" stroke="#4B8BDA" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Top: AutoGen 100% -->
  <rect x="460" y="100" width="290" height="62" rx="6" fill="#FCE8E6" stroke="#C0392B" stroke-width="2"/>
  <text x="478" y="125" font-size="13" font-weight="bold" fill="#1E3A5F">AutoGen · recency 截断</text>
  <text x="478" y="148" font-size="12" fill="#3D4F65">规则被直接挤掉</text>
  <text x="720" y="140" text-anchor="middle" font-size="20" fill="#C0392B" font-weight="bold">100%</text>

  <!-- Middle: LangMem / LangGraph -->
  <rect x="460" y="218" width="290" height="62" rx="6" fill="#FDEEDC" stroke="#E08A2B" stroke-width="2"/>
  <text x="478" y="243" font-size="13" font-weight="bold" fill="#1E3A5F">LangMem / LangGraph 摘要</text>
  <text x="478" y="266" font-size="12" fill="#3D4F65">违规率 95% / 65%</text>
  <text x="720" y="258" text-anchor="middle" font-size="20" fill="#E08A2B" font-weight="bold">95%</text>

  <!-- Bottom: MS Agent Framework -->
  <rect x="460" y="340" width="290" height="62" rx="6" fill="#E6F4EA" stroke="#2E8B57" stroke-width="2"/>
  <text x="478" y="365" font-size="13" font-weight="bold" fill="#1E3A5F">MS Agent · system 受保护</text>
  <text x="478" y="388" font-size="12" fill="#3D4F65">该通道安全（memory 仍暴露）</text>
  <text x="720" y="380" text-anchor="middle" font-size="18" fill="#2E8B57" font-weight="bold">✓</text>

  <!-- Bottom note -->
  <text x="400" y="465" text-anchor="middle" font-size="12" fill="#3D4F65" font-style="italic">同一 Agent · 同一请求 · 仅压缩策略不同 → 从"拒绝"变"执行"</text>
</svg>