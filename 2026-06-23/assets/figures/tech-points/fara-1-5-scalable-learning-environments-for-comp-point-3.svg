<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4B8BDA"/>
    </marker>
    <marker id="arrGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#5BA572"/>
    </marker>
    <marker id="arrRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#C75A5A"/>
    </marker>
  </defs>

  <text x="400" y="42" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="22" font-weight="600" fill="#1E3A5F">三重独立验证器</text>
  <text x="400" y="68" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#3D4F65">单一维度有盲点 · 三道关卡才放行</text>

  <!-- Trajectory source -->
  <rect x="50" y="225" width="140" height="70" rx="10" fill="#FFF4E6" stroke="#E0A668" stroke-width="1.5"/>
  <text x="120" y="257" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#1E3A5F">候选轨迹</text>
  <text x="120" y="277" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#3D4F65">Agent rollout</text>

  <!-- Three gates -->
  <g>
    <rect x="260" y="100" width="180" height="90" rx="10" fill="#EFF6FF" stroke="#4B8BDA" stroke-width="1.5"/>
    <text x="350" y="130" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#1E3A5F">① 正确性</text>
    <text x="350" y="152" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#3D4F65">rubric ≥ 0.8 — 做对了吗？</text>
    <text x="350" y="170" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#3D4F65">盲点：可能放过绕弯路</text>
  </g>

  <g>
    <rect x="260" y="220" width="180" height="90" rx="10" fill="#EFF6FF" stroke="#4B8BDA" stroke-width="1.5"/>
    <text x="350" y="250" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#1E3A5F">② 效率</text>
    <text x="350" y="272" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#3D4F65">LLM judge ≥ 4 / 5 — 走得顺吗？</text>
    <text x="350" y="290" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#3D4F65">盲点：抓不到幻觉答案</text>
  </g>

  <g>
    <rect x="260" y="340" width="180" height="90" rx="10" fill="#EFF6FF" stroke="#4B8BDA" stroke-width="1.5"/>
    <text x="350" y="370" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#1E3A5F">③ 关键点合规</text>
    <text x="350" y="392" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#3D4F65">PII / 不可逆操作 — 该问用户了吗？</text>
    <text x="350" y="410" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#3D4F65">盲点：前两关都抓不到</text>
  </g>

  <!-- input arrows from trajectory to each gate -->
  <line x1="190" y1="248" x2="258" y2="150" stroke="#4B8BDA" stroke-width="1.8" marker-end="url(#arr)"/>
  <line x1="190" y1="260" x2="258" y2="265" stroke="#4B8BDA" stroke-width="1.8" marker-end="url(#arr)"/>
  <line x1="190" y1="272" x2="258" y2="380" stroke="#4B8BDA" stroke-width="1.8" marker-end="url(#arr)"/>

  <!-- AND join -->
  <circle cx="520" cy="265" r="30" fill="#1E3A5F"/>
  <text x="520" y="270" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#FFFFFF">AND</text>

  <line x1="440" y1="150" x2="498" y2="250" stroke="#4B8BDA" stroke-width="1.8" marker-end="url(#arr)"/>
  <line x1="440" y1="265" x2="489" y2="265" stroke="#4B8BDA" stroke-width="1.8" marker-end="url(#arr)"/>
  <line x1="440" y1="380" x2="498" y2="285" stroke="#4B8BDA" stroke-width="1.8" marker-end="url(#arr)"/>

  <!-- Outputs: pass / fail -->
  <rect x="620" y="155" width="140" height="70" rx="10" fill="#E8F3EC" stroke="#5BA572" stroke-width="1.5"/>
  <text x="690" y="185" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#1E3A5F">收入训练集</text>
  <text x="690" y="205" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#3D4F65">三关全过</text>

  <rect x="620" y="305" width="140" height="70" rx="10" fill="#FBECEC" stroke="#C75A5A" stroke-width="1.5"/>
  <text x="690" y="335" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#1E3A5F">丢弃</text>
  <text x="690" y="355" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#3D4F65">任一不达标</text>

  <line x1="546" y1="248" x2="618" y2="195" stroke="#5BA572" stroke-width="1.8" marker-end="url(#arrGreen)"/>
  <line x1="546" y1="285" x2="618" y2="333" stroke="#C75A5A" stroke-width="1.8" marker-end="url(#arrRed)"/>

  <text x="572" y="232" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#5BA572">pass</text>
  <text x="572" y="312" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#C75A5A">fail</text>
</svg>