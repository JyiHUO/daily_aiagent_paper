<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4B8BDA"/>
    </marker>
  </defs>

  <text x="400" y="38" text-anchor="middle" font-family="Helvetica,Arial" font-size="20" font-weight="600" fill="#1E3A5F">Constraint Pinning</text>
  <text x="400" y="60" text-anchor="middle" font-family="Helvetica,Arial" font-size="13" fill="#3D4F65">a safe-room the compactor cannot enter</text>

  <!-- Context window -->
  <rect x="80" y="110" width="640" height="230" rx="10" fill="#F5F1EA" stroke="#C9B79C" stroke-width="1.5"/>
  <text x="100" y="135" font-family="Helvetica,Arial" font-size="13" fill="#8A7048">context window</text>

  <!-- Pinned buffer -->
  <rect x="110" y="155" width="220" height="135" rx="8" fill="#EFF6FF" stroke="#4B8BDA" stroke-width="2.2"/>
  <text x="220" y="182" text-anchor="middle" font-family="Helvetica,Arial" font-size="14" font-weight="600" fill="#1E3A5F">Pinned Buffer</text>
  <text x="220" y="210" text-anchor="middle" font-family="Helvetica,Arial" font-size="12" fill="#3D4F65">"no external email"  (~47 tok)</text>
  <text x="220" y="240" text-anchor="middle" font-family="Helvetica,Arial" font-size="11" fill="#1E3A5F">verbatim re-injected each round</text>
  <text x="220" y="262" text-anchor="middle" font-family="Helvetica,Arial" font-size="11" fill="#1E3A5F">immune to compaction</text>

  <!-- Shield -->
  <path d="M355 170 Q343 222 355 275 Q367 222 355 170 Z" fill="#4B8BDA" opacity="0.85"/>

  <!-- Compactor -->
  <rect x="400" y="155" width="290" height="135" rx="8" fill="#FFF4E6" stroke="#D89B4A" stroke-width="1.6" stroke-dasharray="5,4"/>
  <text x="545" y="182" text-anchor="middle" font-family="Helvetica,Arial" font-size="14" font-weight="600" fill="#1E3A5F">Compactor</text>
  <text x="545" y="210" text-anchor="middle" font-family="Helvetica,Arial" font-size="12" fill="#3D4F65">summarizes history (lossy)</text>
  <text x="545" y="248" text-anchor="middle" font-family="Helvetica,Arial" font-size="20" fill="#D89B4A">— — —</text>
  <text x="545" y="272" text-anchor="middle" font-family="Helvetica,Arial" font-size="11" fill="#8A7048">rules here may be dropped</text>

  <!-- Integrity check arrow -->
  <path d="M220 290 Q220 322 400 322 Q545 322 545 295" fill="none" stroke="#4B8BDA" stroke-width="1.8" marker-end="url(#ar)"/>
  <text x="400" y="316" text-anchor="middle" font-family="Helvetica,Arial" font-size="11" fill="#1E3A5F">entailment check: rule still present?</text>

  <!-- Outcomes -->
  <rect x="110" y="370" width="290" height="48" rx="6" fill="#E8F0E5" stroke="#6B9F5E" stroke-width="1.5"/>
  <text x="255" y="392" text-anchor="middle" font-family="Helvetica,Arial" font-size="12" font-weight="600" fill="#2F5F2A">violations 0%  ·  legit success ~99%</text>
  <text x="255" y="409" text-anchor="middle" font-family="Helvetica,Arial" font-size="11" fill="#2F5F2A">training-free, &lt;0.5% token overhead</text>

  <rect x="400" y="370" width="290" height="48" rx="6" fill="#FDECEC" stroke="#C26B5A" stroke-width="1.5"/>
  <text x="545" y="392" text-anchor="middle" font-family="Helvetica,Arial" font-size="12" font-weight="600" fill="#7A3A2E">remaining gap: operator-impersonation</text>
  <text x="545" y="409" text-anchor="middle" font-family="Helvetica,Arial" font-size="11" fill="#7A3A2E">forged "policy update" bypasses naive pin</text>

  <text x="400" y="455" text-anchor="middle" font-family="Helvetica,Arial" font-size="11" font-style="italic" fill="#3D4F65">fix the leak by giving constraints a slot compaction is not allowed to touch</text>
</svg>