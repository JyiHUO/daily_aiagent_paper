<svg xmlns="http://www.w3.org/2000/svg" width="720" height="480" viewBox="0 0 720 480">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4B8BDA"/>
    </marker>
    <marker id="arrRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#C9554E"/>
    </marker>
    <marker id="arrGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#5A9A5A"/>
    </marker>
  </defs>

  <text x="360" y="34" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif" font-size="20" font-weight="700" fill="#1E3A5F">Constraint Pinning</text>
  <text x="360" y="56" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif" font-size="13" fill="#3D4F65">规则锚定，免疫压缩</text>

  <!-- 上方：无防御 -->
  <text x="40" y="134" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif" font-size="13" font-weight="700" fill="#C9554E">前</text>

  <rect x="70" y="95" width="140" height="70" rx="8" fill="#FFF4E6" stroke="#E0A458" stroke-width="1.5"/>
  <text x="140" y="125" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif" font-size="13" fill="#1E3A5F">长上下文</text>
  <text x="140" y="145" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif" font-size="11" fill="#3D4F65">含治理规则</text>

  <path d="M240,100 L310,100 L290,135 L290,150 L260,150 L260,135 Z" fill="#EFF6FF" stroke="#4B8BDA" stroke-width="1.5"/>
  <text x="275" y="128" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif" font-size="11" fill="#1E3A5F">压缩</text>
  <line x1="210" y1="130" x2="255" y2="130" stroke="#4B8BDA" stroke-width="1.8" marker-end="url(#arr)"/>

  <rect x="340" y="95" width="140" height="70" rx="8" fill="#FBEAE8" stroke="#C9554E" stroke-width="1.5"/>
  <text x="410" y="125" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif" font-size="13" fill="#1E3A5F">摘要后·规则消失</text>
  <text x="410" y="145" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif" font-size="11" fill="#C9554E">治理约束被抹掉</text>
  <line x1="310" y1="130" x2="335" y2="130" stroke="#4B8BDA" stroke-width="1.8" marker-end="url(#arr)"/>

  <line x1="480" y1="130" x2="555" y2="130" stroke="#C9554E" stroke-width="1.8" marker-end="url(#arrRed)"/>
  <text x="517" y="122" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif" font-size="11" fill="#C9554E">违规执行</text>

  <rect x="560" y="105" width="100" height="50" rx="6" fill="#FFFFFF" stroke="#C9554E" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="610" y="135" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif" font-size="13" fill="#C9554E">Agent 失守</text>

  <!-- 分隔 -->
  <line x1="60" y1="215" x2="660" y2="215" stroke="#D8DEE8" stroke-width="1" stroke-dasharray="5,4"/>

  <!-- 下方：Pinning -->
  <text x="40" y="305" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif" font-size="13" font-weight="700" fill="#5A9A5A">后</text>

  <!-- Pinned buffer -->
  <circle cx="140" cy="300" r="44" fill="#EFF6FF" stroke="#4B8BDA" stroke-width="2"/>
  <path d="M140,280 L140,292 M132,292 L148,292 L144,312 L136,312 Z M140,312 L140,325" stroke="#1E3A5F" stroke-width="2" fill="#1E3A5F"/>
  <text x="140" y="365" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif" font-size="13" font-weight="600" fill="#1E3A5F">Pinned 规则 (~47 tok)</text>

  <!-- 压缩漏斗 -->
  <path d="M240,275 L310,275 L290,310 L290,325 L260,325 L260,310 Z" fill="#EFF6FF" stroke="#4B8BDA" stroke-width="1.5"/>
  <text x="275" y="303" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif" font-size="11" fill="#1E3A5F">压缩</text>

  <!-- 重注入弧线：从pinned顶部出发，绕到漏斗左上入口 -->
  <path d="M140,256 Q200,225 260,272" fill="none" stroke="#4B8BDA" stroke-width="1.8" marker-end="url(#arr)"/>
  <text x="200" y="220" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif" font-size="11" fill="#1E3A5F">每轮 verbatim 重注入</text>

  <!-- 完整性检查 -->
  <rect x="340" y="270" width="140" height="70" rx="8" fill="#E8F3E8" stroke="#5A9A5A" stroke-width="1.5"/>
  <text x="410" y="300" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif" font-size="13" fill="#1E3A5F">蕴含检查</text>
  <text x="410" y="320" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif" font-size="11" fill="#3D4F65">规则仍在 context</text>
  <line x1="310" y1="300" x2="335" y2="300" stroke="#4B8BDA" stroke-width="1.8" marker-end="url(#arr)"/>

  <line x1="480" y1="305" x2="555" y2="305" stroke="#5A9A5A" stroke-width="1.8" marker-end="url(#arrGreen)"/>
  <text x="517" y="297" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif" font-size="11" fill="#5A9A5A">正确拒绝</text>

  <rect x="560" y="280" width="100" height="50" rx="6" fill="#FFFFFF" stroke="#5A9A5A" stroke-width="1.5"/>
  <text x="610" y="310" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif" font-size="13" fill="#1E3A5F">违规率 0%</text>

  <text x="360" y="455" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif" font-size="11" fill="#3D4F65">training-free · 开销 &lt; 0.5%</text>
</svg>