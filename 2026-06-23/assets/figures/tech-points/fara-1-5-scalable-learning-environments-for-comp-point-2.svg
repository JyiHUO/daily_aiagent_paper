<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 420" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4B8BDA"/>
    </marker>
  </defs>

  <text x="300" y="34" text-anchor="middle" font-size="17" font-weight="600" fill="#1E3A5F">同一套工具，教师即学生的影子</text>

  <!-- Teacher -->
  <circle cx="140" cy="200" r="62" fill="#EFF6FF" stroke="#1E3A5F" stroke-width="2"/>
  <text x="140" y="196" text-anchor="middle" font-size="15" font-weight="600" fill="#1E3A5F">Teacher</text>
  <text x="140" y="216" text-anchor="middle" font-size="11" fill="#3D4F65">single agent</text>

  <!-- Shared toolbelt -->
  <rect x="255" y="155" width="90" height="90" rx="8" fill="#FFF4E6" stroke="#C47A3D" stroke-width="2"/>
  <text x="300" y="188" text-anchor="middle" font-size="12" font-weight="600" fill="#1E3A5F">shared toolset</text>
  <line x1="270" y1="202" x2="330" y2="202" stroke="#C47A3D" stroke-width="1"/>
  <text x="300" y="222" text-anchor="middle" font-size="10" fill="#3D4F65">click · type · ask-user</text>

  <!-- Student -->
  <circle cx="460" cy="200" r="50" fill="#EFF6FF" stroke="#1E3A5F" stroke-width="2"/>
  <text x="460" y="198" text-anchor="middle" font-size="14" font-weight="600" fill="#1E3A5F">Student</text>
  <text x="460" y="216" text-anchor="middle" font-size="11" fill="#3D4F65">small model</text>

  <!-- Connecting arrows -->
  <line x1="204" y1="200" x2="252" y2="200" stroke="#4B8BDA" stroke-width="2" marker-end="url(#ar)"/>
  <line x1="347" y1="200" x2="407" y2="200" stroke="#4B8BDA" stroke-width="2" marker-end="url(#ar)"/>

  <!-- forbidden actions -->
  <g transform="translate(140,335)">
    <circle r="26" fill="#FDECEC" stroke="#B0413E" stroke-width="2"/>
    <line x1="-18" y1="18" x2="18" y2="-18" stroke="#B0413E" stroke-width="3"/>
    <text x="0" y="56" text-anchor="middle" font-size="11" fill="#1E3A5F">disabled: URL hacks / unsafe clicks</text>
  </g>
  <line x1="140" y1="262" x2="140" y2="306" stroke="#B0413E" stroke-width="2" stroke-dasharray="4,3"/>

  <!-- user simulator -->
  <g transform="translate(460,335)">
    <rect x="-70" y="-20" width="140" height="40" rx="20" fill="#E8F1E8" stroke="#3F7A4F" stroke-width="2"/>
    <text x="0" y="4" text-anchor="middle" font-size="12" font-weight="600" fill="#1E3A5F">user simulator</text>
    <text x="0" y="56" text-anchor="middle" font-size="11" fill="#1E3A5F">answers ask-user, adds follow-ups</text>
  </g>
  <line x1="460" y1="250" x2="460" y2="313" stroke="#4B8BDA" stroke-width="2" marker-end="url(#ar)"/>

  <!-- bottom caption -->
  <text x="300" y="405" text-anchor="middle" font-size="12" fill="#3D4F65">action spaces aligned → no distribution shift in distillation</text>
</svg>