<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 460" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#4B8BDA"/>
    </marker>
    <marker id="b" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#C97B4A"/>
    </marker>
    <marker id="c" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#6FA86B"/>
    </marker>
  </defs>

  <rect width="720" height="460" fill="#FAF7F2"/>

  <text x="360" y="38" text-anchor="middle" font-size="20" font-weight="700" fill="#1E3A5F">Stop or Ask at Critical Points</text>
  <text x="360" y="60" text-anchor="middle" font-size="12" fill="#3D4F65">irreversible action · missing info · PII needed</text>

  <!-- Agent -->
  <circle cx="100" cy="240" r="46" fill="#EFF6FF" stroke="#4B8BDA" stroke-width="2"/>
  <text x="100" y="237" text-anchor="middle" font-size="13" font-weight="600" fill="#1E3A5F">Agent</text>
  <text x="100" y="254" text-anchor="middle" font-size="11" fill="#3D4F65">about to act</text>

  <!-- Critical-point gate -->
  <line x1="340" y1="110" x2="340" y2="370" stroke="#C97B4A" stroke-width="2.5" stroke-dasharray="6 5"/>
  <text x="340" y="100" text-anchor="middle" font-size="12" font-weight="600" fill="#C97B4A">critical point</text>
  <text x="340" y="388" text-anchor="middle" font-size="11" fill="#C97B4A">(submit · pay · send)</text>

  <!-- Ask path: Agent -> User -->
  <path d="M 146 218 Q 260 140 455 150" stroke="#4B8BDA" stroke-width="2" fill="none" marker-end="url(#a)"/>
  <text x="260" y="130" text-anchor="middle" font-size="11" fill="#1E3A5F">ask-user-question</text>

  <!-- Pre-authorized path: Agent -> Task Complete -->
  <path d="M 146 262 Q 260 350 475 320" stroke="#6FA86B" stroke-width="2" fill="none" marker-end="url(#c)"/>
  <text x="240" y="345" text-anchor="middle" font-size="11" fill="#3F6B3C">pre-authorized → proceed</text>

  <!-- User -->
  <rect x="455" y="120" width="160" height="70" rx="10" fill="#FFF4E6" stroke="#C97B4A" stroke-width="1.8"/>
  <text x="535" y="150" text-anchor="middle" font-size="13" font-weight="600" fill="#1E3A5F">User</text>
  <text x="535" y="170" text-anchor="middle" font-size="11" fill="#3D4F65">confirm · provide PII</text>

  <!-- Grant: User -> Task Complete -->
  <path d="M 535 192 Q 560 240 545 285" stroke="#C97B4A" stroke-width="1.8" fill="none" stroke-dasharray="4 4" marker-end="url(#b)"/>
  <text x="572" y="245" font-size="11" fill="#C97B4A">grant</text>

  <!-- Task Complete -->
  <rect x="465" y="288" width="150" height="64" rx="10" fill="#EFF6FF" stroke="#4B8BDA" stroke-width="1.8"/>
  <text x="540" y="316" text-anchor="middle" font-size="13" font-weight="600" fill="#1E3A5F">Task Complete</text>
  <text x="540" y="334" text-anchor="middle" font-size="11" fill="#3D4F65">safely closed loop</text>

  <text x="360" y="430" text-anchor="middle" font-size="11" fill="#3D4F65" font-style="italic">from cautious demo → cooperative completion</text>
</svg>