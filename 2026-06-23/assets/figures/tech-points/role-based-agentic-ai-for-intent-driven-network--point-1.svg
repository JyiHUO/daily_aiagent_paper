<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4B8BDA"/>
    </marker>
  </defs>

  <text x="400" y="40" text-anchor="middle" font-size="20" font-weight="600" fill="#1E3A5F">Agents mirror the Telco org chart</text>

  <!-- Left: customer -->
  <circle cx="60" cy="140" r="28" fill="#FFE8D6" stroke="#D98E5F" stroke-width="1.5"/>
  <text x="60" y="144" text-anchor="middle" font-size="12" fill="#1E3A5F">Customer</text>
  <text x="60" y="188" text-anchor="middle" font-size="11" fill="#3D4F65">intent</text>

  <!-- Layer 1: Business Agent / Product Manager -->
  <rect x="130" y="100" width="180" height="80" rx="10" fill="#EFF6FF" stroke="#4B8BDA" stroke-width="1.5"/>
  <text x="220" y="128" text-anchor="middle" font-size="14" font-weight="600" fill="#1E3A5F">Business Agent</text>
  <text x="220" y="150" text-anchor="middle" font-size="11" fill="#3D4F65">— Product Manager —</text>
  <text x="220" y="168" text-anchor="middle" font-size="11" fill="#3D4F65">clarify &amp; formalize intent</text>

  <!-- Layer 2: Supervisor / Architect -->
  <rect x="350" y="100" width="180" height="80" rx="10" fill="#EFF6FF" stroke="#4B8BDA" stroke-width="1.5"/>
  <text x="440" y="128" text-anchor="middle" font-size="14" font-weight="600" fill="#1E3A5F">Supervisor Agent</text>
  <text x="440" y="150" text-anchor="middle" font-size="11" fill="#3D4F65">— Solution Architect —</text>
  <text x="440" y="168" text-anchor="middle" font-size="11" fill="#3D4F65">plan DAG, govern policy</text>

  <!-- Layer 3: Service Agents -->
  <rect x="580" y="60" width="190" height="70" rx="10" fill="#E8F1FF" stroke="#4B8BDA" stroke-width="1.5"/>
  <text x="675" y="86" text-anchor="middle" font-size="14" font-weight="600" fill="#1E3A5F">Service Agents</text>
  <text x="675" y="106" text-anchor="middle" font-size="11" fill="#3D4F65">— Service Teams —</text>
  <text x="675" y="122" text-anchor="middle" font-size="11" fill="#3D4F65">intent · billing · assurance</text>

  <!-- Layer 4: Resource Agents -->
  <rect x="580" y="150" width="190" height="70" rx="10" fill="#E8F1FF" stroke="#4B8BDA" stroke-width="1.5"/>
  <text x="675" y="176" text-anchor="middle" font-size="14" font-weight="600" fill="#1E3A5F">Resource Agents</text>
  <text x="675" y="196" text-anchor="middle" font-size="11" fill="#3D4F65">— Infra Teams —</text>
  <text x="675" y="212" text-anchor="middle" font-size="11" fill="#3D4F65">RAN · Core · Cloud</text>

  <!-- Arrows -->
  <line x1="89" y1="140" x2="128" y2="140" stroke="#4B8BDA" stroke-width="2" marker-end="url(#ar)"/>
  <line x1="311" y1="140" x2="348" y2="140" stroke="#4B8BDA" stroke-width="2" marker-end="url(#ar)"/>
  <line x1="531" y1="125" x2="578" y2="100" stroke="#4B8BDA" stroke-width="2" marker-end="url(#ar)"/>
  <line x1="531" y1="155" x2="578" y2="180" stroke="#4B8BDA" stroke-width="2" marker-end="url(#ar)"/>

  <!-- Bottom note: contrast -->
  <line x1="100" y1="320" x2="700" y2="320" stroke="#C9D6E2" stroke-width="1" stroke-dasharray="4 4"/>

  <text x="400" y="355" text-anchor="middle" font-size="14" fill="#1E3A5F" font-weight="600">Split by business role, not by tech function</text>

  <!-- Left column: generic stack -->
  <rect x="110" y="385" width="280" height="100" rx="8" fill="#F4F6F9" stroke="#C9D6E2" stroke-width="1"/>
  <text x="250" y="410" text-anchor="middle" font-size="12" font-weight="600" fill="#8090A4">Generic agent stack</text>
  <text x="250" y="432" text-anchor="middle" font-size="12" fill="#9AA7B8">retriever · planner · executor</text>
  <text x="250" y="462" text-anchor="middle" font-size="11" fill="#B0BCCB">unclear ownership across BSS/OSS</text>

  <!-- Right column: role-based -->
  <rect x="410" y="385" width="280" height="100" rx="8" fill="#EFF6FF" stroke="#4B8BDA" stroke-width="1.2"/>
  <text x="550" y="410" text-anchor="middle" font-size="12" font-weight="600" fill="#1E3A5F">Role-based (this paper)</text>
  <text x="550" y="432" text-anchor="middle" font-size="12" fill="#3D4F65">PM · Architect · Service · Infra</text>
  <text x="550" y="462" text-anchor="middle" font-size="11" fill="#3D4F65">clear accountability &amp; compliance</text>
</svg>