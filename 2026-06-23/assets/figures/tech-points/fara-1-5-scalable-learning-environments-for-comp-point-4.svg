<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 420" font-family="-apple-system,Helvetica,Arial">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4B8BDA"/>
    </marker>
  </defs>

  <text x="300" y="34" text-anchor="middle" font-size="18" font-weight="600" fill="#1E3A5F">纯像素小模型 · 看屏幕即可操作</text>

  <!-- 左：屏幕 + URL -->
  <g>
    <rect x="40" y="90" width="190" height="140" rx="6" fill="#EFF6FF" stroke="#4B8BDA" stroke-width="2"/>
    <rect x="52" y="102" width="166" height="14" rx="3" fill="#DCEAFB"/>
    <text x="58" y="113" font-size="10" fill="#3D4F65">https://...</text>
    <rect x="52" y="124" width="166" height="94" fill="#FFFFFF" stroke="#B8D2EE"/>
    <rect x="64" y="138" width="60" height="10" fill="#DCEAFB"/>
    <rect x="64" y="156" width="120" height="8" fill="#E8EEF5"/>
    <rect x="64" y="170" width="100" height="8" fill="#E8EEF5"/>
    <rect x="64" y="190" width="50" height="18" rx="3" fill="#4B8BDA"/>
    <text x="135" y="252" text-anchor="middle" font-size="12" fill="#3D4F65">截图 + 短 URL（无 DOM / 无 a11y）</text>
  </g>

  <!-- 中：循环 observe-think-act -->
  <g transform="translate(330,160)">
    <circle r="62" fill="#FFF4E6" stroke="#E89B3C" stroke-width="2"/>
    <text x="0" y="-18" text-anchor="middle" font-size="13" font-weight="600" fill="#1E3A5F">observe</text>
    <text x="0" y="2" text-anchor="middle" font-size="13" font-weight="600" fill="#1E3A5F">think</text>
    <text x="0" y="22" text-anchor="middle" font-size="13" font-weight="600" fill="#1E3A5F">act</text>
    <text x="0" y="80" text-anchor="middle" font-size="11" fill="#7A8699">仅保留最近 3 张截图</text>
  </g>

  <!-- 屏幕 -> 模型 -->
  <path d="M232,160 L266,160" stroke="#4B8BDA" stroke-width="2" fill="none" marker-end="url(#ar)"/>

  <!-- 模型 -> 原子动作 -->
  <path d="M394,160 L468,160" stroke="#4B8BDA" stroke-width="2" fill="none" marker-end="url(#ar)"/>

  <!-- 右：原子动作 -->
  <g>
    <rect x="470" y="120" width="110" height="80" rx="6" fill="#EAF5EE" stroke="#3FA468" stroke-width="2"/>
    <text x="525" y="150" text-anchor="middle" font-size="13" font-weight="600" fill="#1E3A5F">click(x,y)</text>
    <text x="525" y="170" text-anchor="middle" font-size="11" fill="#3D4F65">每步一个</text>
    <text x="525" y="186" text-anchor="middle" font-size="11" fill="#3D4F65">原子动作</text>
  </g>

  <!-- 回环箭头 动作 -> 屏幕（下一帧） -->
  <path d="M470,200 Q300,340 135,232" stroke="#4B8BDA" stroke-width="1.6" fill="none" stroke-dasharray="5 4" marker-end="url(#ar)"/>
  <text x="300" y="320" text-anchor="middle" font-size="11" fill="#7A8699">动作产生新画面 → 下一轮 observe</text>

  <!-- 底部 -->
  <text x="300" y="378" text-anchor="middle" font-size="12" font-weight="600" fill="#1E3A5F">Online-Mind2Web：9B 63.4% · 27B 72.3%</text>
  <text x="300" y="396" text-anchor="middle" font-size="11" fill="#7A8699">小模型凭高质量轨迹蒸馏，正面对位专有大系统</text>
</svg>