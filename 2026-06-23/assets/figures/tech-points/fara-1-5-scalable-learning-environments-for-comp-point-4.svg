<svg xmlns="http://www.w3.org/2000/svg" width="720" height="480" viewBox="0 0 720 480">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4B8BDA"/>
    </marker>
    <marker id="arrLoop" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#E89B6C"/>
    </marker>
  </defs>

  <text x="360" y="40" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC','Hiragino Sans GB',sans-serif" font-size="20" font-weight="700" fill="#1E3A5F">纯像素小模型 observe-think-act</text>
  <text x="360" y="62" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC','Hiragino Sans GB',sans-serif" font-size="13" fill="#3D4F65">只看截图 不看 DOM</text>

  <!-- Left: input as screenshot stack -->
  <g>
    <rect x="50" y="170" width="170" height="110" rx="6" fill="#EFF6FF" stroke="#4B8BDA" stroke-width="1.5"/>
    <rect x="62" y="158" width="170" height="110" rx="6" fill="#EFF6FF" stroke="#4B8BDA" stroke-width="1.5"/>
    <rect x="74" y="146" width="170" height="110" rx="6" fill="#DCEBFB" stroke="#4B8BDA" stroke-width="2"/>
    <circle cx="88" cy="162" r="4" fill="#E89B6C"/>
    <circle cx="102" cy="162" r="4" fill="#E89B6C"/>
    <circle cx="116" cy="162" r="4" fill="#E89B6C"/>
    <line x1="90" y1="190" x2="228" y2="190" stroke="#4B8BDA" stroke-width="1"/>
    <line x1="90" y1="210" x2="208" y2="210" stroke="#4B8BDA" stroke-width="1"/>
    <line x1="90" y1="230" x2="220" y2="230" stroke="#4B8BDA" stroke-width="1"/>
    <text x="148" y="305" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC','Hiragino Sans GB',sans-serif" font-size="14" font-weight="600" fill="#1E3A5F">最近3张截图 + URL前缀</text>
  </g>

  <!-- Middle: small brain -->
  <g>
    <circle cx="360" cy="220" r="70" fill="#FFF4EC" stroke="#E89B6C" stroke-width="2"/>
    <text x="360" y="212" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC','Hiragino Sans GB',sans-serif" font-size="16" font-weight="700" fill="#1E3A5F">Fara-1.5</text>
    <text x="360" y="236" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC','Hiragino Sans GB',sans-serif" font-size="13" fill="#3D4F65">4B / 9B / 27B</text>
    <text x="360" y="305" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC','Hiragino Sans GB',sans-serif" font-size="13" font-weight="600" fill="#1E3A5F">小模型 一步一动作</text>
  </g>

  <!-- Right: atomic action -->
  <g>
    <rect x="500" y="160" width="170" height="120" rx="8" fill="#EFF6FF" stroke="#4B8BDA" stroke-width="2"/>
    <text x="585" y="190" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC','Hiragino Sans GB',sans-serif" font-size="13" fill="#3D4F65">click(412, 308)</text>
    <text x="585" y="214" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC','Hiragino Sans GB',sans-serif" font-size="13" fill="#3D4F65">type("...")</text>
    <text x="585" y="238" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC','Hiragino Sans GB',sans-serif" font-size="13" fill="#3D4F65">scroll(down)</text>
    <text x="585" y="305" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC','Hiragino Sans GB',sans-serif" font-size="14" font-weight="600" fill="#1E3A5F">原子动作</text>
  </g>

  <!-- Forward arrows -->
  <line x1="256" y1="200" x2="288" y2="210" stroke="#4B8BDA" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="432" y1="220" x2="496" y2="220" stroke="#4B8BDA" stroke-width="2" marker-end="url(#arr)"/>

  <!-- Loop back arrow (action triggers new screenshot) -->
  <path d="M585,160 Q585,110 360,110 Q150,110 150,150" fill="none" stroke="#E89B6C" stroke-width="1.8" stroke-dasharray="5,4" marker-end="url(#arrLoop)"/>
  <text x="360" y="102" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC','Hiragino Sans GB',sans-serif" font-size="12" fill="#B86B3E">动作执行后产生新截图，进入下一步</text>

  <!-- Bottom result bar -->
  <g>
    <rect x="80" y="385" width="560" height="70" rx="8" fill="#FFF4EC" stroke="#E89B6C" stroke-width="1.5"/>
    <text x="360" y="410" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC','Hiragino Sans GB',sans-serif" font-size="13" font-weight="700" fill="#1E3A5F">Online-Mind2Web 成绩</text>
    <text x="180" y="438" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC','Hiragino Sans GB',sans-serif" font-size="12" fill="#3D4F65">9B: 63.4%</text>
    <text x="360" y="438" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC','Hiragino Sans GB',sans-serif" font-size="12" font-weight="700" fill="#1E3A5F">27B: 72.3%</text>
    <text x="540" y="438" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC','Hiragino Sans GB',sans-serif" font-size="12" fill="#3D4F65">超过 Gemini 57.3%</text>
  </g>
</svg>