<svg xmlns="http://www.w3.org/2000/svg" width="720" height="480" viewBox="0 0 720 480">
  <style>
    text { font-family: 'PingFang SC','Microsoft YaHei','Noto Sans CJK SC','Hiragino Sans GB',sans-serif; }
  </style>

  <!-- Title -->
  <text x="360" y="42" text-anchor="middle" font-size="20" font-weight="700" fill="#1E3A5F">两种失败模式</text>
  <text x="360" y="66" text-anchor="middle" font-size="13" fill="#3D4F65">小模型早锚定 · 强模型慢崩塌</text>

  <!-- Left: Qwen - concentrated anchoring -->
  <rect x="50" y="100" width="280" height="320" rx="14" fill="#EFF6FF" stroke="#4B8BDA" stroke-width="1.5"/>
  <text x="190" y="132" text-anchor="middle" font-size="15" font-weight="700" fill="#1E3A5F">Qwen2.5-7B · 早期锚定</text>

  <!-- Anchor metaphor: one bad step poisons the chain -->
  <circle cx="90" cy="230" r="18" fill="#D94F4F"/>
  <text x="90" y="234" text-anchor="middle" font-size="11" font-weight="700" fill="#FFFFFF">毒</text>
  <text x="90" y="270" text-anchor="middle" font-size="11" fill="#3D4F65">第1步</text>

  <line x1="108" y1="230" x2="148" y2="230" stroke="#1E3A5F" stroke-width="2"/>
  <circle cx="165" cy="230" r="10" fill="#B8C5D6"/>
  <line x1="175" y1="230" x2="210" y2="230" stroke="#B8C5D6" stroke-width="2"/>
  <circle cx="225" cy="230" r="10" fill="#B8C5D6"/>
  <line x1="235" y1="230" x2="270" y2="230" stroke="#B8C5D6" stroke-width="2"/>
  <circle cx="285" cy="230" r="10" fill="#B8C5D6"/>

  <text x="190" y="330" text-anchor="middle" font-size="12" fill="#3D4F65">一步带偏，全程回不来</text>
  <text x="190" y="390" text-anchor="middle" font-size="11" fill="#D94F4F" font-style="italic">concentrated anchoring</text>

  <!-- Right: GPT-4o - distributed trust collapse -->
  <rect x="390" y="100" width="280" height="320" rx="14" fill="#FFF4E6" stroke="#E89B3C" stroke-width="1.5"/>
  <text x="530" y="132" text-anchor="middle" font-size="15" font-weight="700" fill="#1E3A5F">GPT-4o · 渐进崩塌</text>

  <!-- Multiple poison drops, accumulating -->
  <circle cx="430" cy="200" r="11" fill="#D94F4F" opacity="0.5"/>
  <circle cx="480" cy="200" r="11" fill="#D94F4F" opacity="0.65"/>
  <circle cx="530" cy="200" r="11" fill="#D94F4F" opacity="0.8"/>
  <circle cx="580" cy="200" r="11" fill="#D94F4F" opacity="0.9"/>
  <circle cx="630" cy="200" r="11" fill="#D94F4F"/>

  <!-- Trust bar shrinking -->
  <rect x="420" y="255" width="220" height="22" rx="4" fill="#FFFFFF" stroke="#E89B3C" stroke-width="1"/>
  <rect x="420" y="255" width="40" height="22" rx="4" fill="#E89B3C"/>
  <text x="530" y="271" text-anchor="middle" font-size="11" fill="#1E3A5F">信任残量</text>

  <text x="530" y="330" text-anchor="middle" font-size="12" fill="#3D4F65">反复挣扎，最终压垮</text>
  <text x="530" y="390" text-anchor="middle" font-size="11" fill="#E89B3C" font-style="italic">distributed trust collapse</text>

  <!-- Bottom takeaway -->
  <text x="360" y="455" text-anchor="middle" font-size="12" fill="#1E3A5F">能力更强 ≠ 免疫，只是换一种失败方式</text>
</svg>