<svg xmlns="http://www.w3.org/2000/svg" width="720" height="480" viewBox="0 0 720 480">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4B8BDA"/>
    </marker>
  </defs>

  <text x="360" y="40" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC','Hiragino Sans GB',sans-serif" font-size="20" font-weight="700" fill="#1E3A5F">上下文压缩后：谁被抹掉了？</text>

  <!-- Compaction arrow from top -->
  <line x1="360" y1="56" x2="360" y2="100" stroke="#4B8BDA" stroke-width="2" marker-end="url(#ar)"/>

  <!-- Hard rules side -->
  <rect x="60" y="110" width="260" height="300" rx="14" fill="#EFF6FF" stroke="#4B8BDA" stroke-width="2"/>
  <text x="190" y="142" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC','Hiragino Sans GB',sans-serif" font-size="16" font-weight="700" fill="#1E3A5F">硬安全规则 (Hard)</text>

  <!-- Shield -->
  <path d="M190 175 L240 195 L240 250 Q240 290 190 315 Q140 290 140 250 L140 195 Z" fill="#DCEBFB" stroke="#1E3A5F" stroke-width="2"/>
  <text x="190" y="245" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC','Hiragino Sans GB',sans-serif" font-size="13" font-weight="700" fill="#1E3A5F">模型先验保护</text>
  <text x="190" y="268" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC','Hiragino Sans GB',sans-serif" font-size="11" fill="#3D4F65">PII / SSH / 审计</text>

  <text x="190" y="365" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC','Hiragino Sans GB',sans-serif" font-size="28" font-weight="700" fill="#1E3A5F">+6 pt</text>
  <text x="190" y="390" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC','Hiragino Sans GB',sans-serif" font-size="12" fill="#3D4F65">几乎不涨</text>

  <!-- Soft rules side -->
  <rect x="400" y="110" width="260" height="300" rx="14" fill="#FDECEC" stroke="#D9534F" stroke-width="2"/>
  <text x="530" y="142" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC','Hiragino Sans GB',sans-serif" font-size="16" font-weight="700" fill="#1E3A5F">软组织策略 (Soft)</text>

  <!-- Broken paper -->
  <path d="M480 180 L580 180 L580 275 L555 295 L530 280 L505 295 L480 275 Z" fill="#FFFFFF" stroke="#D9534F" stroke-width="2" stroke-dasharray="5,4"/>
  <line x1="495" y1="205" x2="565" y2="205" stroke="#D9534F" stroke-width="1.5"/>
  <line x1="495" y1="225" x2="565" y2="225" stroke="#D9534F" stroke-width="1.5"/>
  <line x1="495" y1="245" x2="545" y2="245" stroke="#D9534F" stroke-width="1.5"/>
  <text x="530" y="320" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC','Hiragino Sans GB',sans-serif" font-size="12" fill="#D9534F">region / 额度 / 语言</text>

  <text x="530" y="365" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC','Hiragino Sans GB',sans-serif" font-size="28" font-weight="700" fill="#D9534F">+50 pt</text>
  <text x="530" y="390" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC','Hiragino Sans GB',sans-serif" font-size="12" fill="#3D4F65">完全失守</text>

  <!-- gap label -->
  <text x="360" y="448" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC','Hiragino Sans GB',sans-serif" font-size="15" font-weight="700" fill="#1E3A5F">违规涨幅差距 8.3×</text>
</svg>