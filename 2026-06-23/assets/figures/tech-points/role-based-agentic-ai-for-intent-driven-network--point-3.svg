<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 420" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4B8BDA"/>
    </marker>
  </defs>

  <text x="300" y="38" text-anchor="middle" font-size="18" font-weight="700" fill="#1E3A5F">Three Layers of One Agent</text>
  <text x="300" y="58" text-anchor="middle" font-size="12" fill="#3D4F65">ReAct · MCP · A2A</text>

  <!-- ReAct: brain -->
  <circle cx="120" cy="220" r="62" fill="#EFF6FF" stroke="#4B8BDA" stroke-width="2"/>
  <text x="120" y="210" text-anchor="middle" font-size="14" font-weight="700" fill="#1E3A5F">ReAct</text>
  <text x="120" y="230" text-anchor="middle" font-size="10" fill="#3D4F65">think ↻ act</text>
  <text x="120" y="305" text-anchor="middle" font-size="10" fill="#7A6A55" font-style="italic">the brain</text>

  <!-- MCP: tools -->
  <g transform="translate(305,220)">
    <rect x="-55" y="-55" width="38" height="55" rx="3" fill="#FFF4E6" stroke="#E89B4C" stroke-width="2"/>
    <rect x="-10" y="-40" width="38" height="40" rx="3" fill="#FFF4E6" stroke="#E89B4C" stroke-width="2"/>
    <rect x="35" y="-55" width="30" height="55" rx="3" fill="#FFF4E6" stroke="#E89B4C" stroke-width="2"/>
    <text x="5" y="22" text-anchor="middle" font-size="14" font-weight="700" fill="#1E3A5F">MCP</text>
    <text x="5" y="40" text-anchor="middle" font-size="10" fill="#3D4F65">parser · validator · activate</text>
    <text x="5" y="85" text-anchor="middle" font-size="10" fill="#7A6A55" font-style="italic">the toolbelt</text>
  </g>

  <!-- A2A: bridge between two agents -->
  <circle cx="475" cy="205" r="24" fill="#EFF6FF" stroke="#4B8BDA" stroke-width="2"/>
  <circle cx="540" cy="245" r="24" fill="#EFF6FF" stroke="#4B8BDA" stroke-width="2"/>
  <text x="475" y="209" text-anchor="middle" font-size="11" fill="#1E3A5F">Biz</text>
  <text x="540" y="249" text-anchor="middle" font-size="11" fill="#1E3A5F">Svc</text>
  <line x1="495" y1="218" x2="521" y2="234" stroke="#4B8BDA" stroke-width="2" marker-end="url(#arr)"/>
  <text x="507" y="180" text-anchor="middle" font-size="14" font-weight="700" fill="#1E3A5F">A2A</text>
  <text x="507" y="305" text-anchor="middle" font-size="10" fill="#7A6A55" font-style="italic">the handshake</text>

  <!-- arrows between layers -->
  <line x1="184" y1="220" x2="232" y2="220" stroke="#4B8BDA" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="378" y1="205" x2="445" y2="200" stroke="#4B8BDA" stroke-width="2" marker-end="url(#arr)"/>

  <!-- bottom note -->
  <text x="300" y="380" text-anchor="middle" font-size="11" fill="#3D4F65">reason inside · call tools outward · talk to peers across</text>
</svg>