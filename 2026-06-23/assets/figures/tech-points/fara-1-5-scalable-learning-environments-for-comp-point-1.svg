<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4B8BDA"/>
    </marker>
  </defs>

  <text x="400" y="40" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="bold" fill="#1E3A5F">FaraEnvs · 沙盒克隆</text>

  <!-- Real website (locked) -->
  <g>
    <rect x="60" y="100" width="220" height="200" rx="10" fill="#FFF4E6" stroke="#E0A050" stroke-width="2"/>
    <text x="170" y="130" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="bold" fill="#1E3A5F">真实网站</text>
    <rect x="150" y="170" width="40" height="35" rx="4" fill="none" stroke="#E0A050" stroke-width="2.5"/>
    <path d="M158 170 v-12 a12 12 0 0 1 24 0 v12" fill="none" stroke="#E0A050" stroke-width="2.5"/>
    <circle cx="170" cy="187" r="3" fill="#E0A050"/>
    <text x="170" y="245" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#3D4F65">登录 / 反爬 / 不可逆副作用</text>
  </g>

  <!-- Arrow clone -->
  <line x1="290" y1="200" x2="395" y2="200" stroke="#4B8BDA" stroke-width="2.5" marker-end="url(#arr)" stroke-dasharray="6 4"/>
  <text x="342" y="190" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#4B8BDA">克隆</text>

  <!-- Sandbox -->
  <g>
    <rect x="400" y="100" width="340" height="200" rx="10" fill="#EFF6FF" stroke="#4B8BDA" stroke-width="2"/>
    <text x="570" y="130" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="bold" fill="#1E3A5F">沙盒副本 (React + FastAPI + SQLite)</text>

    <ellipse cx="470" cy="200" rx="32" ry="20" fill="#FFFFFF" stroke="#1E3A5F" stroke-width="2"/>
    <circle cx="470" cy="200" r="9" fill="#4B8BDA"/>
    <circle cx="470" cy="200" r="3" fill="#1E3A5F"/>
    <text x="470" y="250" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#3D4F65">上帝视角</text>

    <g transform="translate(640,180)">
      <ellipse cx="0" cy="0" rx="32" ry="8" fill="#FFFFFF" stroke="#1E3A5F" stroke-width="2"/>
      <path d="M-32,0 v36 a32,8 0 0 0 64,0 v-36" fill="#FFFFFF" stroke="#1E3A5F" stroke-width="2"/>
      <ellipse cx="0" cy="18" rx="32" ry="8" fill="none" stroke="#1E3A5F" stroke-width="1.5"/>
    </g>
    <text x="640" y="250" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#3D4F65">数据库可查可重置</text>
  </g>

  <!-- link sandbox to flow -->
  <line x1="280" y1="300" x2="280" y2="365" stroke="#4B8BDA" stroke-width="2" marker-end="url(#arr)"/>

  <!-- Bottom flow: verification -->
  <g>
    <rect x="120" y="370" width="180" height="70" rx="8" fill="#EFF6FF" stroke="#4B8BDA" stroke-width="1.5"/>
    <text x="210" y="400" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#1E3A5F">Agent 放心执行</text>
    <text x="210" y="420" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#3D4F65">点击 / 提交 / 发送</text>
  </g>

  <line x1="305" y1="405" x2="368" y2="405" stroke="#4B8BDA" stroke-width="2.5" marker-end="url(#arr)"/>

  <g>
    <rect x="370" y="370" width="180" height="70" rx="8" fill="#FFF4E6" stroke="#E0A050" stroke-width="1.5"/>
    <text x="460" y="400" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#1E3A5F">sqldiff + LLM 判定</text>
    <text x="460" y="420" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#3D4F65">前后数据库对比</text>
  </g>

  <line x1="555" y1="405" x2="618" y2="405" stroke="#4B8BDA" stroke-width="2.5" marker-end="url(#arr)"/>

  <g>
    <rect x="620" y="370" width="160" height="70" rx="8" fill="#EAF7EE" stroke="#3DA35D" stroke-width="1.5"/>
    <text x="700" y="400" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#1E3A5F">收为训练样本</text>
    <text x="700" y="420" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#3D4F65">重置后再来一条</text>
  </g>

  <!-- loop back -->
  <path d="M700 440 Q 700 470 400 470 Q 210 470 210 445" fill="none" stroke="#3DA35D" stroke-width="1.8" stroke-dasharray="5 4" marker-end="url(#arr)"/>
  <text x="455" y="464" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#3DA35D">重置状态，下一条任务</text>
</svg>