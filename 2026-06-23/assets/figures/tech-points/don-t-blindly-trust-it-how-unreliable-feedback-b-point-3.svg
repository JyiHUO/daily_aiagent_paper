<svg xmlns="http://www.w3.org/2000/svg" width="720" height="480" viewBox="0 0 720 480">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4B8BDA"/>
    </marker>
    <marker id="arrRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#C77B6B"/>
    </marker>
  </defs>

  <text x="360" y="44" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC','Hiragino Sans GB',sans-serif" font-size="20" font-weight="bold" fill="#1E3A5F">易诊断，难修复  (detect ≠ recover)</text>

  <!-- Step 1: Bad feedback -->
  <rect x="40" y="180" width="140" height="90" rx="10" fill="#FDECE6" stroke="#C77B6B" stroke-width="1.5"/>
  <text x="110" y="218" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC','Hiragino Sans GB',sans-serif" font-size="15" font-weight="bold" fill="#1E3A5F">坏反馈</text>
  <text x="110" y="242" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC','Hiragino Sans GB',sans-serif" font-size="11" fill="#3D4F65">noisy tool output</text>

  <!-- Step 2: Detector -->
  <rect x="240" y="180" width="160" height="90" rx="10" fill="#EFF6FF" stroke="#4B8BDA" stroke-width="1.5"/>
  <text x="320" y="212" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC','Hiragino Sans GB',sans-serif" font-size="15" font-weight="bold" fill="#1E3A5F">检测器 ✓</text>
  <text x="320" y="234" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC','Hiragino Sans GB',sans-serif" font-size="11" fill="#3D4F65">AUC 0.75–0.85，能拒坏证据</text>

  <!-- Step 3: Fallback -->
  <rect x="460" y="180" width="220" height="90" rx="10" fill="#FDECE6" stroke="#C77B6B" stroke-width="1.5" stroke-dasharray="5,4"/>
  <text x="570" y="212" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC','Hiragino Sans GB',sans-serif" font-size="15" font-weight="bold" fill="#1E3A5F">退回自身知识 ✗</text>
  <text x="570" y="234" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC','Hiragino Sans GB',sans-serif" font-size="11" fill="#C77B6B">parametric fallback 兜底更差</text>

  <!-- arrows -->
  <line x1="180" y1="225" x2="234" y2="225" stroke="#4B8BDA" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="400" y1="225" x2="454" y2="225" stroke="#C77B6B" stroke-width="2" marker-end="url(#arrRed)"/>

  <!-- bottom insight -->
  <line x1="120" y1="360" x2="600" y2="360" stroke="#CBD5E1" stroke-width="1"/>
  <text x="360" y="395" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC','Hiragino Sans GB',sans-serif" font-size="14" font-weight="bold" fill="#1E3A5F">过滤器与 fallback 必须共同评估</text>
  <text x="360" y="420" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC','Hiragino Sans GB',sans-serif" font-size="12" fill="#3D4F65">拒绝坏证据，未必带来更好答案</text>
</svg>