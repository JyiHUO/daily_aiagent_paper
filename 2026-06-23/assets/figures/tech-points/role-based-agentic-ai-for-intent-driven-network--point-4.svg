<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 420" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#4B8BDA"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="300" y="35" text-anchor="middle" font-size="17" font-weight="bold" fill="#1E3A5F">入口 Agent 决定整条链路</text>
  <text x="300" y="56" text-anchor="middle" font-size="11" fill="#3D4F65">门口卡住，下游再强也无用</text>

  <!-- Gate (entry) -->
  <g>
    <rect x="50" y="110" width="150" height="200" rx="10" fill="#EFF6FF" stroke="#4B8BDA" stroke-width="2"/>
    <text x="125" y="138" text-anchor="middle" font-size="13" font-weight="bold" fill="#1E3A5F">Business Agent（入口）</text>
    <circle cx="125" cy="200" r="18" fill="none" stroke="#1E3A5F" stroke-width="2.5"/>
    <rect x="123" y="215" width="4" height="35" fill="#1E3A5F"/>
    <rect x="127" y="235" width="10" height="4" fill="#1E3A5F"/>
    <rect x="127" y="243" width="7" height="4" fill="#1E3A5F"/>
    <text x="125" y="280" text-anchor="middle" font-size="11" fill="#3D4F65">需强模型</text>
    <text x="125" y="297" text-anchor="middle" font-size="11" fill="#3D4F65">语义解析 + 工具调用</text>
  </g>

  <!-- Downstream -->
  <g>
    <rect x="400" y="110" width="150" height="200" rx="10" fill="#FFF4E6" stroke="#E89B4A" stroke-width="2"/>
    <text x="475" y="138" text-anchor="middle" font-size="13" font-weight="bold" fill="#1E3A5F">Service Agent（下游）</text>
    <circle cx="475" cy="210" r="22" fill="none" stroke="#1E3A5F" stroke-width="2.5"/>
    <circle cx="475" cy="210" r="6" fill="#1E3A5F"/>
    <g stroke="#1E3A5F" stroke-width="3" stroke-linecap="round">
      <line x1="475" y1="183" x2="475" y2="193"/>
      <line x1="475" y1="227" x2="475" y2="237"/>
      <line x1="448" y1="210" x2="458" y2="210"/>
      <line x1="492" y1="210" x2="502" y2="210"/>
    </g>
    <text x="475" y="280" text-anchor="middle" font-size="11" fill="#3D4F65">小模型即可</text>
    <text x="475" y="297" text-anchor="middle" font-size="11" fill="#3D4F65">结构化指令驱动</text>
  </g>

  <!-- Arrow: success path -->
  <path d="M 205 185 L 395 185" stroke="#4B8BDA" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/>
  <text x="300" y="178" text-anchor="middle" font-size="11" fill="#1E3A5F" font-weight="bold">GPT-OSS ✓ 走通全链路</text>

  <!-- Arrow: blocked -->
  <path d="M 205 245 L 280 245" stroke="#C94C4C" stroke-width="2.5" fill="none" stroke-dasharray="6,4"/>
  <line x1="275" y1="233" x2="295" y2="257" stroke="#C94C4C" stroke-width="3"/>
  <line x1="295" y1="233" x2="275" y2="257" stroke="#C94C4C" stroke-width="3"/>
  <text x="260" y="275" text-anchor="middle" font-size="11" fill="#C94C4C" font-weight="bold">Mistral / Qwen ✗ 工具调用失败</text>

  <!-- Bottom insight -->
  <text x="300" y="365" text-anchor="middle" font-size="12" fill="#1E3A5F" font-weight="bold">强模型放门口，省钱放下游</text>
  <text x="300" y="385" text-anchor="middle" font-size="10" fill="#3D4F65">速度救不了能力短板</text>
</svg>