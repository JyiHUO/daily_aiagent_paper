<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 640" font-family="'Helvetica Neue',Arial,'PingFang SC','Microsoft YaHei',sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4B8BDA"/>
    </marker>
    <marker id="arrO" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#E89B5A"/>
    </marker>
  </defs>

  <rect width="1000" height="640" fill="#FAFBFD"/>

  <!-- Title -->
  <text x="500" y="42" text-anchor="middle" font-size="22" font-weight="700" fill="#1E3A5F">Fara-1.5：为计算机使用智能体造一条可扩展的数据流水线</text>
  <text x="500" y="66" text-anchor="middle" font-size="13" fill="#3D4F65">环境 · 求解器 · 三重验证器 —— 小模型也能学到前沿教师的行为</text>

  <!-- Stage 1: Environments -->
  <g>
    <rect x="50" y="120" width="220" height="380" rx="14" fill="#EFF6FF" stroke="#4B8BDA" stroke-width="1.5"/>
    <text x="160" y="148" text-anchor="middle" font-size="15" font-weight="700" fill="#1E3A5F">① 环境 FaraEnvs</text>

    <!-- Live web globe -->
    <circle cx="110" cy="210" r="30" fill="#FFFFFF" stroke="#4B8BDA" stroke-width="1.5"/>
    <path d="M80,210 a30,30 0 0,0 60,0 M110,180 a16,30 0 0,0 0,60 M110,180 a16,30 0 0,1 0,60 M80,210 h60" fill="none" stroke="#4B8BDA" stroke-width="1.2"/>
    <text x="170" y="205" font-size="12" font-weight="600" fill="#1E3A5F">真实网站</text>
    <text x="170" y="222" font-size="11" fill="#3D4F65">开放页面</text>

    <!-- Sandbox box -->
    <rect x="80" y="270" width="160" height="100" rx="8" fill="#FFFFFF" stroke="#E89B5A" stroke-width="1.5" stroke-dasharray="5,3"/>
    <text x="160" y="292" text-anchor="middle" font-size="12" font-weight="700" fill="#B85C2A">合成沙盒克隆</text>
    <text x="160" y="312" text-anchor="middle" font-size="10.5" fill="#3D4F65">React + FastAPI + SQLite</text>
    <text x="160" y="330" text-anchor="middle" font-size="10.5" fill="#3D4F65">邮件 / 日历 / 下单 …</text>
    <text x="160" y="354" text-anchor="middle" font-size="10" fill="#B85C2A" font-style="italic">登录态 · 不可逆动作</text>

    <text x="160" y="410" text-anchor="middle" font-size="11" fill="#3D4F65">可重置 · sqldiff 直查数据库</text>
    <text x="160" y="460" text-anchor="middle" font-size="10.5" fill="#1E3A5F" font-weight="600">解决：副作用任务无法采集</text>
  </g>

  <!-- Arrow 1 -->
  <line x1="272" y1="310" x2="320" y2="310" stroke="#4B8BDA" stroke-width="2" marker-end="url(#arr)"/>

  <!-- Stage 2: Solver -->
  <g>
    <rect x="322" y="120" width="220" height="380" rx="14" fill="#FFF4EA" stroke="#E89B5A" stroke-width="1.5"/>
    <text x="432" y="148" text-anchor="middle" font-size="15" font-weight="700" fill="#1E3A5F">② 求解器 Solver</text>

    <!-- Teacher node -->
    <circle cx="432" cy="210" r="34" fill="#E89B5A"/>
    <text x="432" y="208" text-anchor="middle" font-size="13" font-weight="700" fill="#FFFFFF">GPT-5.4</text>
    <text x="432" y="224" text-anchor="middle" font-size="10" fill="#FFFFFF">teacher</text>

    <!-- Tool circle -->
    <g transform="translate(432,320)">
      <circle r="48" fill="#FFFFFF" stroke="#E89B5A" stroke-width="1.5"/>
      <text y="-20" text-anchor="middle" font-size="10.5" fill="#1E3A5F" font-weight="600">tool-calling 循环</text>
      <text y="-2" text-anchor="middle" font-size="10" fill="#3D4F65">click · type · scroll · ask-user</text>
      <text y="18" text-anchor="middle" font-size="10" fill="#B85C2A" font-style="italic">与学生同一动作空间</text>
    </g>

    <!-- User simulator -->
    <rect x="362" y="402" width="140" height="38" rx="6" fill="#FFFFFF" stroke="#4B8BDA" stroke-width="1.2"/>
    <text x="432" y="418" text-anchor="middle" font-size="11" font-weight="600" fill="#1E3A5F">User Simulator</text>
    <text x="432" y="432" text-anchor="middle" font-size="10" fill="#3D4F65">多轮澄清 · 追加请求</text>

    <text x="432" y="462" text-anchor="middle" font-size="10.5" fill="#1E3A5F" font-weight="600">解决：教师-学生分布漂移</text>
  </g>

  <!-- Arrow 2: trajectories -->
  <path d="M544,310 L592,310" stroke="#4B8BDA" stroke-width="2" fill="none" marker-end="url(#arr)"/>
  <text x="568" y="302" text-anchor="middle" font-size="10" fill="#3D4F65">轨迹</text>

  <!-- Stage 3: Verifiers (triple filter) -->
  <g>
    <rect x="594" y="120" width="356" height="380" rx="14" fill="#EFF6FF" stroke="#4B8BDA" stroke-width="1.5"/>
    <text x="772" y="148" text-anchor="middle" font-size="15" font-weight="700" fill="#1E3A5F">③ 三重验证器（互补过滤）</text>

    <!-- V1 -->
    <g>
      <rect x="614" y="170" width="316" height="62" rx="8" fill="#FFFFFF" stroke="#4B8BDA" stroke-width="1.2"/>
      <circle cx="640" cy="201" r="14" fill="#4B8BDA"/>
      <text x="640" y="206" text-anchor="middle" font-size="12" font-weight="700" fill="#FFFFFF">✓</text>
      <text x="666" y="194" font-size="12" font-weight="700" fill="#1E3A5F">正确性</text>
      <text x="666" y="212" font-size="10.5" fill="#3D4F65">Universal Verifier · sqldiff · rubric ≥ 0.8</text>
    </g>

    <!-- V2 -->
    <g>
      <rect x="614" y="246" width="316" height="62" rx="8" fill="#FFFFFF" stroke="#4B8BDA" stroke-width="1.2"/>
      <circle cx="640" cy="277" r="14" fill="#4B8BDA"/>
      <text x="640" y="282" text-anchor="middle" font-size="13" font-weight="700" fill="#FFFFFF">⚡</text>
      <text x="666" y="270" font-size="12" font-weight="700" fill="#1E3A5F">效率</text>
      <text x="666" y="288" font-size="10.5" fill="#3D4F65">LLM judge 1–5 分，剔除循环/冗余（≥4）</text>
    </g>

    <!-- V3 -->
    <g>
      <rect x="614" y="322" width="316" height="68" rx="8" fill="#FFFFFF" stroke="#E89B5A" stroke-width="1.5"/>
      <circle cx="640" cy="356" r="14" fill="#E89B5A"/>
      <text x="640" y="361" text-anchor="middle" font-size="13" font-weight="700" fill="#FFFFFF">!</text>
      <text x="666" y="346" font-size="12" font-weight="700" fill="#1E3A5F">关键点合规</text>
      <text x="666" y="364" font-size="10.5" fill="#3D4F65">不可逆动作前必须 ask-user</text>
      <text x="666" y="380" font-size="10" fill="#B85C2A">PII 未提供却自填 → 丢弃</text>
    </g>

    <!-- Output -->
    <rect x="614" y="410" width="316" height="56" rx="8" fill="#1E3A5F"/>
    <text x="772" y="432" text-anchor="middle" font-size="12" font-weight="700" fill="#FFFFFF">高质量 SFT 训练数据</text>
    <text x="772" y="452" text-anchor="middle" font-size="11" fill="#B8D4F5">正确 · 简洁 · 懂得何时停下来问人</text>
  </g>

  <!-- Bottom student box -->
  <g>
    <rect x="280" y="540" width="440" height="70" rx="10" fill="#FFFFFF" stroke="#1E3A5F" stroke-width="1.5"/>
    <text x="500" y="566" text-anchor="middle" font-size="14" font-weight="700" fill="#1E3A5F">Fara-1.5 原生 CUA（Qwen3.5 · 4B / 9B / 27B）</text>
    <text x="500" y="586" text-anchor="middle" font-size="11" fill="#3D4F65">纯像素 observe–think–act · 与教师同动作空间</text>
    <text x="500" y="602" text-anchor="middle" font-size="11" fill="#B85C2A" font-weight="600">9B: Online-Mind2Web 63.4%  ·  27B: 72.3%（超 Operator / Gemini CU）</text>
  </g>

  <!-- Down arrow from verifier output to student -->
  <path d="M772 466 L772 515 L600 515 L600 540" stroke="#4B8BDA" stroke-width="2" fill="none" marker-end="url(#arr)"/>
  <text x="690" y="508" font-size="10.5" fill="#3D4F65">SFT 蒸馏</text>

  <!-- Iterative loop arrow back to solver -->
  <path d="M400 540 L400 520 L160 520 L160 500" stroke="#E89B5A" stroke-width="1.8" fill="none" stroke-dasharray="6,4" marker-end="url(#arrO)"/>
  <text x="200" y="513" font-size="10" fill="#B85C2A">迭代：补足模型短板任务</text>
</svg>