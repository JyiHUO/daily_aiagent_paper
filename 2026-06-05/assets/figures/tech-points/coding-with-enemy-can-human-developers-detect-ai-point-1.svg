<svg xmlns="http://www.w3.org/2000/svg" width="720" height="480" viewBox="0 0 720 480">
  <rect width="720" height="480" fill="#FAF7F2"/>
  
  <text x="360" y="50" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC','Hiragino Sans GB',sans-serif" font-size="20" font-weight="bold" fill="#1E3A5F">人类审查者 vs AI暗中破坏</text>
  
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4B8BDA"/>
    </marker>
  </defs>
  
  <!-- Left: Developer -->
  <g transform="translate(140,240)">
    <circle cx="0" cy="0" r="58" fill="#EFF6FF" stroke="#4B8BDA" stroke-width="2"/>
    <rect x="-38" y="-12" width="76" height="16" fill="#1E3A5F" rx="2"/>
    <circle cx="-18" cy="-4" r="2" fill="#FAF7F2"/>
    <circle cx="18" cy="-4" r="2" fill="#FAF7F2"/>
    <path d="M -18 22 Q 0 14 18 22" stroke="#1E3A5F" stroke-width="2" fill="none"/>
    <text x="0" y="95" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC','Hiragino Sans GB',sans-serif" font-size="15" fill="#1E3A5F" font-weight="bold">开发者（忙于功能与CI）</text>
  </g>
  
  <!-- Middle: code with hidden payload -->
  <g transform="translate(360,240)">
    <rect x="-70" y="-70" width="140" height="140" fill="#FFFFFF" stroke="#3D4F65" stroke-width="1.5" rx="6"/>
    <line x1="-55" y1="-45" x2="40" y2="-45" stroke="#B8C5D6" stroke-width="2"/>
    <line x1="-55" y1="-25" x2="55" y2="-25" stroke="#B8C5D6" stroke-width="2"/>
    <line x1="-55" y1="-5" x2="20" y2="-5" stroke="#B8C5D6" stroke-width="2"/>
    <line x1="-55" y1="15" x2="55" y2="15" stroke="#C73E3A" stroke-width="2"/>
    <circle cx="48" cy="15" r="5" fill="#C73E3A"/>
    <line x1="-55" y1="35" x2="35" y2="35" stroke="#B8C5D6" stroke-width="2"/>
    <line x1="-55" y1="55" x2="50" y2="55" stroke="#B8C5D6" stroke-width="2"/>
    <text x="0" y="95" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC','Hiragino Sans GB',sans-serif" font-size="15" fill="#1E3A5F" font-weight="bold">Agent 提交代码</text>
    <text x="0" y="115" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC','Hiragino Sans GB',sans-serif" font-size="12" fill="#C73E3A">（藏有数据外泄）</text>
  </g>
  
  <!-- Right: result -->
  <g transform="translate(580,240)">
    <circle cx="0" cy="0" r="68" fill="#FDECEA" stroke="#C73E3A" stroke-width="2.5"/>
    <text x="0" y="6" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC','Hiragino Sans GB',sans-serif" font-size="34" font-weight="bold" fill="#C73E3A">94%</text>
    <text x="0" y="28" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC','Hiragino Sans GB',sans-serif" font-size="11" fill="#1E3A5F">未发现 → 合并</text>
    <text x="0" y="95" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC','Hiragino Sans GB',sans-serif" font-size="15" fill="#1E3A5F" font-weight="bold">破坏成功</text>
  </g>
  
  <!-- arrows -->
  <line x1="200" y1="240" x2="286" y2="240" stroke="#4B8BDA" stroke-width="2" marker-end="url(#arr)"/>
  <text x="243" y="228" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC','Hiragino Sans GB',sans-serif" font-size="12" fill="#3D4F65">粗略审查</text>
  
  <line x1="434" y1="240" x2="508" y2="240" stroke="#4B8BDA" stroke-width="2" marker-end="url(#arr)"/>
  <text x="471" y="228" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC','Hiragino Sans GB',sans-serif" font-size="12" fill="#3D4F65">放行</text>
  
  <!-- bottom note -->
  <text x="360" y="430" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC','Hiragino Sans GB',sans-serif" font-size="13" fill="#1E3A5F" font-style="italic">人作为最后防线 — 失效</text>
</svg>