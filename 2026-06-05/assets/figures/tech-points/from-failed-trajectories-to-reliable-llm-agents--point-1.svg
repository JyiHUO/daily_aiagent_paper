<svg xmlns="http://www.w3.org/2000/svg" width="720" height="480" viewBox="0 0 720 480">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4B8BDA"/>
    </marker>
    <marker id="arrO" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#E89B5A"/>
    </marker>
  </defs>

  <text x="360" y="38" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif" font-size="19" font-weight="600" fill="#1E3A5F">HTIR：把"内容来源"与"控制流"拆开建模</text>

  <!-- Left: raw trace -->
  <g font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif">
    <text x="120" y="88" text-anchor="middle" font-size="13" fill="#3D4F65">原始轨迹</text>
    <rect x="60" y="100" width="120" height="290" rx="6" fill="#F5F0E8" stroke="#C9B89A" stroke-width="1.2"/>
    <text x="120" y="135" text-anchor="middle" font-size="12" fill="#7A6A4F">S1</text>
    <text x="120" y="180" text-anchor="middle" font-size="12" fill="#7A6A4F">S2</text>
    <text x="120" y="225" text-anchor="middle" font-size="12" fill="#7A6A4F">S3</text>
    <text x="120" y="270" text-anchor="middle" font-size="12" fill="#7A6A4F">S4</text>
    <text x="120" y="315" text-anchor="middle" font-size="12" fill="#7A6A4F">…</text>
    <text x="120" y="370" text-anchor="middle" font-size="11" fill="#A89070" font-style="italic">日志混在一起</text>
  </g>

  <!-- arrow to right -->
  <line x1="186" y1="245" x2="278" y2="245" stroke="#4B8BDA" stroke-width="2" marker-end="url(#arr)"/>
  <text x="232" y="236" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif" font-size="11" fill="#4B8BDA">拆解</text>

  <!-- Right: Provenance chain -->
  <g font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif">
    <rect x="290" y="100" width="380" height="135" rx="8" fill="#EFF6FF" stroke="#4B8BDA" stroke-width="1.5"/>
    <text x="305" y="124" font-size="13" font-weight="600" fill="#1E3A5F">Input Provenance（内容从哪一步来）</text>

    <circle cx="340" cy="190" r="17" fill="#FFFFFF" stroke="#4B8BDA" stroke-width="1.5"/>
    <text x="340" y="194" text-anchor="middle" font-size="11" fill="#1E3A5F">S1</text>
    <circle cx="430" cy="190" r="17" fill="#FFFFFF" stroke="#4B8BDA" stroke-width="1.5"/>
    <text x="430" y="194" text-anchor="middle" font-size="11" fill="#1E3A5F">S2</text>
    <circle cx="520" cy="190" r="17" fill="#FFFFFF" stroke="#4B8BDA" stroke-width="1.5"/>
    <text x="520" y="194" text-anchor="middle" font-size="11" fill="#1E3A5F">S3</text>
    <circle cx="610" cy="190" r="17" fill="#FFF7ED" stroke="#E89B5A" stroke-width="2"/>
    <text x="610" y="194" text-anchor="middle" font-size="11" fill="#B5621F">S4</text>

    <line x1="357" y1="190" x2="411" y2="190" stroke="#4B8BDA" stroke-width="1.5" marker-end="url(#arr)"/>
    <line x1="447" y1="190" x2="501" y2="190" stroke="#4B8BDA" stroke-width="1.5" marker-end="url(#arr)"/>
    <line x1="537" y1="190" x2="591" y2="190" stroke="#4B8BDA" stroke-width="1.5" marker-end="url(#arr)"/>

    <text x="480" y="222" text-anchor="middle" font-size="10" fill="#4B8BDA" font-style="italic">S3 已暴露 user-email，但 S4 未复用</text>
  </g>

  <!-- Control flow chain -->
  <g font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif">
    <rect x="290" y="260" width="380" height="135" rx="8" fill="#FFF7ED" stroke="#E89B5A" stroke-width="1.5"/>
    <text x="305" y="284" font-size="13" font-weight="600" fill="#1E3A5F">Control Flow（为何触发该步）</text>

    <circle cx="340" cy="350" r="17" fill="#FFFFFF" stroke="#E89B5A" stroke-width="1.5"/>
    <text x="340" y="354" text-anchor="middle" font-size="11" fill="#1E3A5F">S1</text>
    <circle cx="430" cy="350" r="17" fill="#FFFFFF" stroke="#E89B5A" stroke-width="1.5"/>
    <text x="430" y="354" text-anchor="middle" font-size="11" fill="#1E3A5F">S2</text>
    <circle cx="520" cy="350" r="17" fill="#FFFFFF" stroke="#E89B5A" stroke-width="1.5"/>
    <text x="520" y="354" text-anchor="middle" font-size="11" fill="#1E3A5F">S3</text>
    <circle cx="610" cy="350" r="17" fill="#FFF7ED" stroke="#E89B5A" stroke-width="2"/>
    <text x="610" y="354" text-anchor="middle" font-size="11" fill="#B5621F">S4</text>

    <line x1="357" y1="350" x2="411" y2="350" stroke="#E89B5A" stroke-width="1.5" marker-end="url(#arrO)"/>
    <line x1="447" y1="350" x2="501" y2="350" stroke="#E89B5A" stroke-width="1.5" marker-end="url(#arrO)"/>
    <line x1="537" y1="350" x2="591" y2="350" stroke="#E89B5A" stroke-width="1.5" marker-end="url(#arrO)"/>

    <text x="480" y="382" text-anchor="middle" font-size="10" fill="#B5621F" font-style="italic">S4 未写入 PaymentRequest → Tool Interface 层</text>
  </g>

  <!-- Highlight S4 cross-chain -->
  <line x1="610" y1="207" x2="610" y2="333" stroke="#B5621F" stroke-width="1.2" stroke-dasharray="4,3"/>
  <text x="610" y="430" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif" font-size="12" fill="#B5621F" font-weight="600">step 级精确归因 → 定位到 S4</text>
</svg>