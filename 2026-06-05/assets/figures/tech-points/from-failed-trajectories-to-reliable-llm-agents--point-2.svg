<svg width="720" height="480" viewBox="0 0 720 480" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4B8BDA"/>
    </marker>
  </defs>

  <style>
    .t { font-family: 'PingFang SC','Microsoft YaHei','Noto Sans CJK SC','Hiragino Sans GB',sans-serif; }
  </style>

  <text class="t" x="360" y="40" text-anchor="middle" font-size="20" font-weight="700" fill="#1E3A5F">失败轨迹 → Harness 层归因</text>
  <text class="t" x="360" y="64" text-anchor="middle" font-size="12" fill="#3D4F65">Trace attribution to ETCLOVG</text>

  <!-- Left: failed trajectory steps -->
  <rect x="40" y="100" width="190" height="300" rx="10" fill="#EFF6FF" stroke="#4B8BDA" stroke-width="1.5"/>
  <text class="t" x="135" y="125" text-anchor="middle" font-size="13" font-weight="700" fill="#1E3A5F">失败轨迹</text>

  <circle cx="75" cy="165" r="9" fill="#B8CFE8"/>
  <text class="t" x="75" y="169" text-anchor="middle" font-size="10" fill="#1E3A5F">S3</text>
  <text class="t" x="95" y="169" font-size="12" fill="#3D4F65">…正常</text>

  <circle cx="75" cy="215" r="11" fill="#E8A87C" stroke="#C25B3A" stroke-width="1.5"/>
  <text class="t" x="75" y="219" text-anchor="middle" font-size="10" fill="#5C2A14">S4</text>
  <text class="t" x="95" y="219" font-size="12" fill="#3D4F65">漏参数</text>

  <circle cx="75" cy="265" r="11" fill="#E8A87C" stroke="#C25B3A" stroke-width="1.5"/>
  <text class="t" x="75" y="269" text-anchor="middle" font-size="10" fill="#5C2A14">S5</text>
  <text class="t" x="95" y="269" font-size="12" fill="#3D4F65">吞错误</text>

  <circle cx="75" cy="315" r="11" fill="#E8A87C" stroke="#C25B3A" stroke-width="1.5"/>
  <text class="t" x="75" y="319" text-anchor="middle" font-size="10" fill="#5C2A14">S6</text>
  <text class="t" x="95" y="319" font-size="12" fill="#3D4F65">假完成</text>

  <circle cx="75" cy="365" r="9" fill="#D9534F"/>
  <text class="t" x="75" y="369" text-anchor="middle" font-size="10" fill="#FFFFFF" font-weight="700">✗</text>
  <text class="t" x="95" y="369" font-size="12" fill="#3D4F65">最终失败</text>

  <!-- arrows from steps to layers -->
  <line x1="230" y1="215" x2="378" y2="168" stroke="#4B8BDA" stroke-width="1.8" marker-end="url(#arr)"/>
  <line x1="230" y1="265" x2="378" y2="228" stroke="#4B8BDA" stroke-width="1.8" marker-end="url(#arr)"/>
  <line x1="230" y1="315" x2="378" y2="293" stroke="#4B8BDA" stroke-width="1.8" marker-end="url(#arr)"/>
  <line x1="230" y1="315" x2="378" y2="353" stroke="#4B8BDA" stroke-width="1.8" marker-end="url(#arr)"/>

  <!-- Right: ETCLOVG stack -->
  <text class="t" x="520" y="125" text-anchor="middle" font-size="13" font-weight="700" fill="#1E3A5F">Harness 七层 (ETCLOVG)</text>

  <rect x="380" y="150" width="280" height="36" rx="6" fill="#FFF1E0" stroke="#E8A87C" stroke-width="1.5"/>
  <text class="t" x="395" y="173" font-size="13" fill="#1E3A5F" font-weight="600">Tool Interface</text>
  <text class="t" x="645" y="173" text-anchor="end" font-size="11" fill="#3D4F65">← S4 漏参</text>

  <rect x="380" y="210" width="280" height="36" rx="6" fill="#FFF1E0" stroke="#E8A87C" stroke-width="1.5"/>
  <text class="t" x="395" y="233" font-size="13" fill="#1E3A5F" font-weight="600">Observability</text>
  <text class="t" x="645" y="233" text-anchor="end" font-size="11" fill="#3D4F65">← S5 吞错</text>

  <rect x="380" y="275" width="280" height="36" rx="6" fill="#FFF1E0" stroke="#E8A87C" stroke-width="1.5"/>
  <text class="t" x="395" y="298" font-size="13" fill="#1E3A5F" font-weight="600">Lifecycle</text>
  <text class="t" x="645" y="298" text-anchor="end" font-size="11" fill="#3D4F65">← S6 假完成</text>

  <rect x="380" y="335" width="280" height="36" rx="6" fill="#FFF1E0" stroke="#E8A87C" stroke-width="1.5"/>
  <text class="t" x="395" y="358" font-size="13" fill="#1E3A5F" font-weight="600">Verification</text>
  <text class="t" x="645" y="358" text-anchor="end" font-size="11" fill="#3D4F65">← S6 假完成</text>

  <text class="t" x="360" y="425" text-anchor="middle" font-size="12" fill="#3D4F65">把锅甩对层：每个失败步 → 一个 harness 层；先定位，再修复</text>
</svg>