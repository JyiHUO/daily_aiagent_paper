<svg xmlns="http://www.w3.org/2000/svg" width="720" height="480" viewBox="0 0 720 480">
  <style>
    .title { font-family: 'PingFang SC','Microsoft YaHei','Noto Sans CJK SC','Hiragino Sans GB',sans-serif; font-size: 18px; fill: #1E3A5F; font-weight: 600; }
    .label { font-family: 'PingFang SC','Microsoft YaHei','Noto Sans CJK SC','Hiragino Sans GB',sans-serif; font-size: 13px; fill: #1E3A5F; font-weight: 600; }
    .sub { font-family: 'PingFang SC','Microsoft YaHei','Noto Sans CJK SC','Hiragino Sans GB',sans-serif; font-size: 11px; fill: #3D4F65; }
    .win { font-family: 'PingFang SC','Microsoft YaHei','Noto Sans CJK SC','Hiragino Sans GB',sans-serif; font-size: 12px; fill: #C2410C; font-weight: 700; }
  </style>

  <defs>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#4B8BDA"/>
    </marker>
  </defs>

  <text x="360" y="36" class="title" text-anchor="middle">三机制互补 · 各治一种瓶颈</text>

  <!-- Three mechanisms (top row) -->
  <g>
    <circle cx="160" cy="140" r="52" fill="#EFF6FF" stroke="#4B8BDA" stroke-width="2"/>
    <text x="160" y="135" class="label" text-anchor="middle">演化器</text>
    <text x="160" y="155" class="sub" text-anchor="middle">造能力</text>
  </g>

  <g>
    <circle cx="360" cy="140" r="52" fill="#FEF3E7" stroke="#E89B4B" stroke-width="2"/>
    <text x="360" y="135" class="label" text-anchor="middle">路由器</text>
    <text x="360" y="155" class="sub" text-anchor="middle">选分支</text>
  </g>

  <g>
    <circle cx="560" cy="140" r="52" fill="#F0F0F7" stroke="#7C6FB5" stroke-width="2"/>
    <text x="560" y="135" class="label" text-anchor="middle">HITL</text>
    <text x="560" y="155" class="sub" text-anchor="middle">补盲区</text>
  </g>

  <!-- Arrows down to bottlenecks -->
  <line x1="160" y1="194" x2="160" y2="271" stroke="#4B8BDA" stroke-width="1.8" marker-end="url(#arr)"/>
  <line x1="360" y1="194" x2="360" y2="271" stroke="#4B8BDA" stroke-width="1.8" marker-end="url(#arr)"/>
  <line x1="560" y1="194" x2="560" y2="271" stroke="#4B8BDA" stroke-width="1.8" marker-end="url(#arr)"/>

  <!-- Three streams (bottom row) -->
  <g>
    <rect x="80" y="275" width="160" height="130" rx="8" fill="#FFFFFF" stroke="#1E3A5F" stroke-width="1.5"/>
    <text x="160" y="298" class="label" text-anchor="middle">CTF-Dojo</text>
    <text x="160" y="320" class="sub" text-anchor="middle">瓶颈：大 payload</text>
    <line x1="100" y1="335" x2="220" y2="335" stroke="#E5E7EB"/>
    <text x="160" y="358" class="win" text-anchor="middle">Full System</text>
    <text x="160" y="378" class="sub" text-anchor="middle">Pass 50.2%</text>
  </g>

  <g>
    <rect x="280" y="275" width="160" height="130" rx="8" fill="#FFFFFF" stroke="#1E3A5F" stroke-width="1.5"/>
    <text x="360" y="298" class="label" text-anchor="middle">FutureX</text>
    <text x="360" y="320" class="sub" text-anchor="middle">瓶颈：检索源</text>
    <line x1="300" y1="335" x2="420" y2="335" stroke="#E5E7EB"/>
    <text x="360" y="358" class="win" text-anchor="middle">Multi-agent</text>
    <text x="360" y="378" class="sub" text-anchor="middle">领先 49.5%</text>
  </g>

  <g>
    <rect x="480" y="275" width="160" height="130" rx="8" fill="#FFFFFF" stroke="#1E3A5F" stroke-width="1.5"/>
    <text x="560" y="298" class="label" text-anchor="middle">PolyBench</text>
    <text x="560" y="320" class="sub" text-anchor="middle">瓶颈：策略定制</text>
    <line x1="500" y1="335" x2="620" y2="335" stroke="#E5E7EB"/>
    <text x="560" y="358" class="win" text-anchor="middle">Adaptive</text>
    <text x="560" y="378" class="sub" text-anchor="middle">Return +352%</text>
  </g>

  <text x="360" y="442" class="sub" text-anchor="middle">单一机制必偏科 · 三件套同时上才能跨流领先</text>
</svg>