<svg xmlns="http://www.w3.org/2000/svg" width="720" height="480" viewBox="0 0 720 480">
  <defs>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#4B8BDA"/>
    </marker>
  </defs>

  <text x="360" y="40" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC','Hiragino Sans GB',sans-serif" font-size="20" font-weight="600" fill="#1E3A5F">四阶段分工演化</text>
  <text x="360" y="62" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC','Hiragino Sans GB',sans-serif" font-size="13" fill="#3D4F65">各有上下文，共享一本笔记</text>

  <!-- Four roles in a circle -->
  <g>
    <circle cx="170" cy="210" r="50" fill="#EFF6FF" stroke="#4B8BDA" stroke-width="2"/>
    <text x="170" y="206" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC','Hiragino Sans GB',sans-serif" font-size="14" font-weight="600" fill="#1E3A5F">Analyst</text>
    <text x="170" y="224" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC','Hiragino Sans GB',sans-serif" font-size="11" fill="#3D4F65">分析</text>
  </g>

  <g>
    <circle cx="360" cy="140" r="50" fill="#FFF4E6" stroke="#E8965A" stroke-width="2"/>
    <text x="360" y="136" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC','Hiragino Sans GB',sans-serif" font-size="14" font-weight="600" fill="#1E3A5F">Researcher</text>
    <text x="360" y="154" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC','Hiragino Sans GB',sans-serif" font-size="11" fill="#3D4F65">并行调研</text>
  </g>

  <g>
    <circle cx="550" cy="210" r="50" fill="#EFF6FF" stroke="#4B8BDA" stroke-width="2"/>
    <text x="550" y="206" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC','Hiragino Sans GB',sans-serif" font-size="14" font-weight="600" fill="#1E3A5F">Builder</text>
    <text x="550" y="224" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC','Hiragino Sans GB',sans-serif" font-size="11" fill="#3D4F65">写代码</text>
  </g>

  <g>
    <circle cx="360" cy="340" r="50" fill="#EFF6FF" stroke="#4B8BDA" stroke-width="2"/>
    <text x="360" y="336" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC','Hiragino Sans GB',sans-serif" font-size="14" font-weight="600" fill="#1E3A5F">Verifier</text>
    <text x="360" y="354" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC','Hiragino Sans GB',sans-serif" font-size="11" fill="#3D4F65">门禁验证</text>
  </g>

  <!-- Cycle arrows: Analyst -> Researcher -> Builder -> Verifier -> Analyst -->
  <path d="M 210,180 L 312,150" stroke="#4B8BDA" stroke-width="2" fill="none" marker-end="url(#arr)"/>
  <path d="M 408,150 L 510,180" stroke="#4B8BDA" stroke-width="2" fill="none" marker-end="url(#arr)"/>
  <path d="M 540,258 L 408,328" stroke="#4B8BDA" stroke-width="2" fill="none" marker-end="url(#arr)"/>
  <path d="M 312,328 L 188,254" stroke="#4B8BDA" stroke-width="2" fill="none" marker-end="url(#arr)"/>

  <!-- Shared git workspace in center -->
  <rect x="306" y="222" width="108" height="46" rx="6" fill="#FEF3C7" stroke="#D4A04A" stroke-width="1.5"/>
  <text x="360" y="242" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC','Hiragino Sans GB',sans-serif" font-size="12" font-weight="600" fill="#1E3A5F">git 工作区</text>
  <text x="360" y="259" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC','Hiragino Sans GB',sans-serif" font-size="10" fill="#3D4F65">跨 cycle 持久</text>

  <!-- Temporal reveal gate at bottom -->
  <rect x="240" y="420" width="240" height="42" rx="6" fill="#EFF6FF" stroke="#4B8BDA" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="360" y="438" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC','Hiragino Sans GB',sans-serif" font-size="13" font-weight="600" fill="#1E3A5F">temporal-reveal 门</text>
  <text x="360" y="454" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC','Hiragino Sans GB',sans-serif" font-size="11" fill="#3D4F65">真实结果到期才回流</text>

  <path d="M 360,420 L 360,392" stroke="#4B8BDA" stroke-width="2" fill="none" marker-end="url(#arr)" stroke-dasharray="4,3"/>
</svg>