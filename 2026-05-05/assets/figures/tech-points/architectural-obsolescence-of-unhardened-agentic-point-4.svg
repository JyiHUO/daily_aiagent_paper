<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4B8BDA"/>
    </marker>
  </defs>

  <rect width="900" height="600" fill="#F7FAFC"/>

  <!-- Title -->
  <text x="450" y="40" text-anchor="middle" font-size="22" font-weight="bold" fill="#1E3A5F">"架构性过时" = 三条必须同时成立</text>
  <text x="450" y="64" text-anchor="middle" font-size="13" fill="#3D4F65">任一条不成立，指控即被推翻（可证伪）</text>

  <!-- Candidate Runtime R -->
  <rect x="40" y="100" width="220" height="380" rx="10" fill="#FFF5E6" stroke="#D98A3D" stroke-width="2"/>
  <text x="150" y="132" text-anchor="middle" font-size="16" font-weight="bold" fill="#1E3A5F">候选 Runtime R</text>
  <text x="150" y="152" text-anchor="middle" font-size="12" fill="#3D4F65">（如 OpenClaw）</text>

  <rect x="70" y="180" width="160" height="70" rx="8" fill="#FFE0B8" stroke="#D98A3D"/>
  <text x="150" y="205" text-anchor="middle" font-size="12" fill="#1E3A5F">F1 越闸 · F2 伪日志</text>
  <text x="150" y="225" text-anchor="middle" font-size="12" fill="#1E3A5F">F3 静默 · F4 错目标</text>
  <text x="150" y="243" text-anchor="middle" font-size="11" fill="#3D4F65">四类失效模式</text>

  <rect x="70" y="280" width="160" height="60" rx="8" fill="#FFE0B8" stroke="#D98A3D"/>
  <text x="150" y="305" text-anchor="middle" font-size="13" fill="#B34700" font-weight="bold">Recall = 0.000</text>
  <text x="150" y="324" text-anchor="middle" font-size="11" fill="#3D4F65">(1600 样本 CLI 实测)</text>

  <text x="150" y="380" text-anchor="middle" font-size="12" fill="#3D4F65">被质疑"架构性过时"</text>
  <text x="150" y="430" text-anchor="middle" font-size="28" fill="#D98A3D">⇒</text>
  <text x="150" y="460" text-anchor="middle" font-size="11" fill="#7A4A00" font-style="italic">需三条同时成立</text>

  <!-- Condition 1 -->
  <rect x="300" y="100" width="560" height="110" rx="8" fill="#EFF6FF" stroke="#4B8BDA" stroke-width="2"/>
  <text x="320" y="128" font-size="15" font-weight="bold" fill="#1E3A5F">① 端到端 adversarial harness</text>
  <text x="320" y="152" font-size="12" fill="#3D4F65">同一测试集：R 全部漏检，A 全部捕获</text>
  <rect x="580" y="138" width="110" height="50" rx="6" fill="#FFE0B8" stroke="#D98A3D"/>
  <text x="635" y="158" text-anchor="middle" font-size="12" fill="#1E3A5F">R recall</text>
  <text x="635" y="178" text-anchor="middle" font-size="14" font-weight="bold" fill="#B34700">= 0</text>
  <text x="710" y="170" text-anchor="middle" font-size="22" fill="#4B8BDA">≠</text>
  <rect x="730" y="138" width="110" height="50" rx="6" fill="#DCEBFA" stroke="#4B8BDA"/>
  <text x="785" y="158" text-anchor="middle" font-size="12" fill="#1E3A5F">A recall</text>
  <text x="785" y="178" text-anchor="middle" font-size="14" font-weight="bold" fill="#1E5FB3">= 1</text>

  <!-- Condition 2 -->
  <rect x="300" y="225" width="560" height="90" rx="8" fill="#EFF6FF" stroke="#4B8BDA" stroke-width="2"/>
  <text x="320" y="253" font-size="15" font-weight="bold" fill="#1E3A5F">② 存在可用替代 A</text>
  <text x="320" y="277" font-size="12" fill="#3D4F65">开源 · drop-in · 无新增基础设施</text>
  <text x="320" y="297" font-size="12" fill="#1E5FB3">A = enclawed-oss（MIT License）</text>

  <!-- Condition 3 -->
  <rect x="300" y="330" width="560" height="150" rx="8" fill="#EFF6FF" stroke="#4B8BDA" stroke-width="2"/>
  <text x="320" y="358" font-size="15" font-weight="bold" fill="#1E3A5F">③ 源码 tree-walk：grep 7 项原语 P(F)</text>
  <text x="320" y="380" font-size="12" fill="#3D4F65">R 源码命中 = 0　／　A 源码必须全命中</text>
  <g font-size="11" fill="#1E3A5F">
    <rect x="320" y="395" width="150" height="24" rx="3" fill="#DCEBFA"/>
    <text x="395" y="411" text-anchor="middle">biconditional checker</text>
    <rect x="480" y="395" width="110" height="24" rx="3" fill="#DCEBFA"/>
    <text x="535" y="411" text-anchor="middle">audit seal</text>
    <rect x="600" y="395" width="130" height="24" rx="3" fill="#DCEBFA"/>
    <text x="665" y="411" text-anchor="middle">admission gate</text>
    <rect x="740" y="395" width="100" height="24" rx="3" fill="#DCEBFA"/>
    <text x="790" y="411" text-anchor="middle">… ×7</text>
  </g>
  <text x="320" y="450" font-size="11" fill="#7A4A00" font-style="italic">审计者只需 grep 即可反驳此条</text>

  <!-- Arrows from R to conditions -->
  <line x1="262" y1="155" x2="297" y2="155" stroke="#4B8BDA" stroke-width="2" marker-end="url(#ar)"/>
  <line x1="262" y1="270" x2="297" y2="270" stroke="#4B8BDA" stroke-width="2" marker-end="url(#ar)"/>
  <line x1="262" y1="405" x2="297" y2="405" stroke="#4B8BDA" stroke-width="2" marker-end="url(#ar)"/>

  <!-- Bottom conclusion -->
  <rect x="140" y="508" width="620" height="62" rx="8" fill="#1E3A5F"/>
  <text x="450" y="534" text-anchor="middle" font-size="15" font-weight="bold" fill="#FFFFFF">①②③ 同时成立 → R 被判定"架构性过时"</text>
  <text x="450" y="556" text-anchor="middle" font-size="12" fill="#DCEBFA">任一条被驳倒 → 结论失败（可复现、可审计）</text>
</svg>