<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4B8BDA"/>
    </marker>
  </defs>

  <rect width="900" height="560" fill="#F7FAFC"/>

  <!-- Title -->
  <text x="450" y="40" text-anchor="middle" font-size="23" font-weight="bold" fill="#1E3A5F">OpenEvolve 自适应红队：让攻击邮件"自己进化"</text>
  <text x="450" y="64" text-anchor="middle" font-size="13" fill="#3D4F65">每轮：生成变体 → 真实 Agent 环境运行 → 评分打磨 → 回灌候选池</text>

  <!-- Candidate pool (left) -->
  <rect x="40" y="100" width="230" height="370" rx="10" fill="#EFF6FF" stroke="#4B8BDA" stroke-width="2"/>
  <text x="155" y="128" text-anchor="middle" font-size="16" font-weight="bold" fill="#1E3A5F">候选池 (MAP-Elites)</text>
  <text x="155" y="148" text-anchor="middle" font-size="11" fill="#3D4F65">按 长度 × 差异度 分格</text>

  <!-- grid cells -->
  <g font-size="10" fill="#1E3A5F">
    <rect x="65" y="165" width="55" height="40" fill="#DBEAFE" stroke="#4B8BDA"/>
    <text x="92" y="190" text-anchor="middle">短/A</text>
    <rect x="125" y="165" width="55" height="40" fill="#BFDBFE" stroke="#4B8BDA"/>
    <text x="152" y="190" text-anchor="middle">短/B</text>
    <rect x="185" y="165" width="55" height="40" fill="#DBEAFE" stroke="#4B8BDA"/>
    <text x="212" y="190" text-anchor="middle">短/C</text>

    <rect x="65" y="210" width="55" height="40" fill="#BFDBFE" stroke="#4B8BDA"/>
    <text x="92" y="235" text-anchor="middle">中/A</text>
    <rect x="125" y="210" width="55" height="40" fill="#93C5FD" stroke="#4B8BDA"/>
    <text x="152" y="235" text-anchor="middle">中/B</text>
    <rect x="185" y="210" width="55" height="40" fill="#DBEAFE" stroke="#4B8BDA"/>
    <text x="212" y="235" text-anchor="middle">中/C</text>

    <rect x="65" y="255" width="55" height="40" fill="#DBEAFE" stroke="#4B8BDA"/>
    <text x="92" y="280" text-anchor="middle">长/A</text>
    <rect x="125" y="255" width="55" height="40" fill="#BFDBFE" stroke="#4B8BDA"/>
    <text x="152" y="280" text-anchor="middle">长/B</text>
    <rect x="185" y="255" width="55" height="40" fill="#93C5FD" stroke="#4B8BDA"/>
    <text x="212" y="280" text-anchor="middle">长/C</text>
  </g>

  <!-- best example -->
  <rect x="60" y="315" width="190" height="140" rx="6" fill="#FFF7ED" stroke="#E8A34B" stroke-width="1.5"/>
  <text x="155" y="337" text-anchor="middle" font-size="12" font-weight="bold" fill="#1E3A5F">精英样本示例</text>
  <text x="155" y="360" text-anchor="middle" font-size="10" fill="#3D4F65">税务 + Mem0 + 限长防御</text>
  <text x="155" y="385" text-anchor="middle" font-size="11" font-weight="bold" fill="#B8561F">≤80 字符 payload</text>
  <text x="155" y="408" text-anchor="middle" font-size="10" fill="#3D4F65">成功触发 send-email</text>
  <text x="155" y="435" text-anchor="middle" font-size="10" fill="#3D4F65">held-out 测试集验证 ASR</text>

  <!-- Mutator -->
  <rect x="330" y="100" width="210" height="130" rx="10" fill="#EFF6FF" stroke="#4B8BDA" stroke-width="2"/>
  <text x="435" y="132" text-anchor="middle" font-size="15" font-weight="bold" fill="#1E3A5F">LLM Mutator</text>
  <text x="435" y="160" text-anchor="middle" font-size="12" fill="#3D4F65">采样候选 → 生成变体</text>
  <text x="435" y="182" text-anchor="middle" font-size="12" fill="#3D4F65">(压缩 / 改写 / 换触发词)</text>
  <text x="435" y="210" text-anchor="middle" font-size="11" fill="#B8561F">攻击邮件的新一代种子</text>

  <!-- Agent Env -->
  <rect x="600" y="100" width="260" height="130" rx="10" fill="#F0F9F4" stroke="#4FA66B" stroke-width="2"/>
  <text x="730" y="132" text-anchor="middle" font-size="15" font-weight="bold" fill="#1E3A5F">真实 Agent 环境</text>
  <text x="730" y="160" text-anchor="middle" font-size="12" fill="#3D4F65">邮件被写入记忆后端</text>
  <text x="730" y="182" text-anchor="middle" font-size="12" fill="#3D4F65">观察是否外泄敏感数据</text>
  <text x="730" y="210" text-anchor="middle" font-size="11" fill="#3D4F65">Mem0 / LangMem / Zep / Letta</text>

  <!-- Critic -->
  <rect x="600" y="310" width="260" height="140" rx="10" fill="#FDF4FF" stroke="#A855C7" stroke-width="2"/>
  <text x="730" y="340" text-anchor="middle" font-size="15" font-weight="bold" fill="#1E3A5F">LLM Critic</text>
  <text x="730" y="366" text-anchor="middle" font-size="12" fill="#3D4F65">打分 1–10 并给改进建议</text>
  <text x="730" y="402" text-anchor="middle" font-size="11" fill="#8B3FA8">例："指令被截断，</text>
  <text x="730" y="420" text-anchor="middle" font-size="11" fill="#8B3FA8">请缩短到一句话"</text>

  <!-- Arrows -->
  <!-- pool -> mutator -->
  <line x1="270" y1="165" x2="328" y2="165" stroke="#4B8BDA" stroke-width="2.5" marker-end="url(#ar)"/>
  <!-- mutator -> agent -->
  <line x1="540" y1="165" x2="598" y2="165" stroke="#4B8BDA" stroke-width="2.5" marker-end="url(#ar)"/>
  <!-- agent -> critic -->
  <line x1="730" y1="232" x2="730" y2="308" stroke="#4B8BDA" stroke-width="2.5" marker-end="url(#ar)"/>
  <!-- critic -> pool (feedback loop) -->
  <path d="M 600 400 Q 420 430 272 400" stroke="#4B8BDA" stroke-width="2.5" fill="none" marker-end="url(#ar)" stroke-dasharray="6,4"/>
  <text x="436" y="425" text-anchor="middle" font-size="11" font-style="italic" fill="#4B8BDA">回灌改进后的变体</text>

  <!-- Bottom note -->
  <rect x="40" y="490" width="820" height="50" rx="8" fill="#1E3A5F"/>
  <text x="450" y="513" text-anchor="middle" font-size="13" font-weight="bold" fill="#F7FAFC">每个 (话题 × 记忆后端 × 防御) 独立进化，train/test 模板与实体完全不相交</text>
  <text x="450" y="531" text-anchor="middle" font-size="11" fill="#BFDBFE">→ 动态 benchmark：模型/防御升级后，攻击也会自动升级</text>
</svg>