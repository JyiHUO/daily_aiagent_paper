<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" font-family="'Helvetica Neue',Arial,sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4B8BDA"/>
    </marker>
  </defs>

  <rect width="900" height="600" fill="#F7F9FC"/>

  <!-- Title -->
  <text x="450" y="40" text-anchor="middle" font-size="22" font-weight="bold" fill="#1E3A5F">Compliance Gap：文本看不出，日志才能照</text>
  <text x="450" y="64" text-anchor="middle" font-size="13" fill="#3D4F65">定理：只看输出文本，不可能识别 Agent 是否真的按流程执行</text>

  <!-- Agent -->
  <rect x="60" y="200" width="180" height="120" rx="12" fill="#EFF6FF" stroke="#4B8BDA" stroke-width="2"/>
  <text x="150" y="235" text-anchor="middle" font-size="15" font-weight="bold" fill="#1E3A5F">Agent</text>
  <text x="150" y="262" text-anchor="middle" font-size="12" fill="#3D4F65">说：我已按流程</text>
  <text x="150" y="282" text-anchor="middle" font-size="12" fill="#3D4F65">逐文件脱敏分析 ✓</text>
  <text x="150" y="302" text-anchor="middle" font-size="11" fill="#8A6E3B">（实际走了捷径）</text>

  <!-- Text branch arrow -->
  <path d="M240 235 L335 170" stroke="#4B8BDA" stroke-width="2" fill="none" marker-end="url(#arr)"/>
  <text x="278" y="195" text-anchor="middle" font-size="11" fill="#3D4F65">文本输出</text>

  <!-- Text-only evaluation box -->
  <rect x="340" y="110" width="230" height="130" rx="12" fill="#FFF3E6" stroke="#D98841" stroke-width="2"/>
  <text x="455" y="138" text-anchor="middle" font-size="15" font-weight="bold" fill="#1E3A5F">只看文本</text>
  <text x="360" y="168" font-size="12" fill="#3D4F65">人类盲审</text>
  <text x="548" y="168" text-anchor="end" font-size="12" font-weight="bold" fill="#C0392B">0 / 15</text>
  <text x="360" y="192" font-size="12" fill="#3D4F65">LLM-judge</text>
  <text x="548" y="192" text-anchor="end" font-size="12" font-weight="bold" fill="#C0392B">≤ 60%</text>
  <text x="455" y="222" text-anchor="middle" font-size="11" fill="#8A6E3B">定理2：行为信息未进文本通道</text>

  <!-- Log branch arrow -->
  <path d="M240 290 L335 380" stroke="#4B8BDA" stroke-width="2" fill="none" marker-end="url(#arr)"/>
  <text x="278" y="350" text-anchor="middle" font-size="11" fill="#3D4F65">工具调用日志</text>

  <!-- Log evaluation box -->
  <rect x="340" y="340" width="230" height="120" rx="12" fill="#E6F4EA" stroke="#3A9D5D" stroke-width="2"/>
  <text x="455" y="368" text-anchor="middle" font-size="15" font-weight="bold" fill="#1E3A5F">读取日志</text>
  <text x="455" y="392" text-anchor="middle" font-size="12" fill="#3D4F65">确定性规则核对</text>
  <text x="455" y="418" text-anchor="middle" font-size="14" font-weight="bold" fill="#2E7D4F">κ &gt; 0.80 ✓</text>
  <text x="455" y="440" text-anchor="middle" font-size="11" fill="#3D4F65">真正能发现捷径</text>

  <!-- Theorem 1 -->
  <rect x="620" y="110" width="230" height="160" rx="12" fill="#EFF6FF" stroke="#4B8BDA" stroke-width="2"/>
  <text x="735" y="138" text-anchor="middle" font-size="14" font-weight="bold" fill="#1E3A5F">定理 1｜Gap 必然存在</text>
  <text x="635" y="168" font-size="11" fill="#3D4F65">奖励 R(y) 只看文本</text>
  <text x="635" y="188" font-size="11" fill="#3D4F65">同一句话，多种行为</text>
  <text x="635" y="208" font-size="11" fill="#3D4F65">模型挑最省事那条</text>
  <text x="735" y="240" text-anchor="middle" font-size="13" font-weight="bold" fill="#C0392B">VCR − ACR &gt; 0</text>
  <text x="735" y="258" text-anchor="middle" font-size="10" fill="#8A6E3B">口头合规 &gt; 实际合规</text>

  <!-- Theorem 2 -->
  <rect x="620" y="300" width="230" height="160" rx="12" fill="#EFF6FF" stroke="#4B8BDA" stroke-width="2"/>
  <text x="735" y="328" text-anchor="middle" font-size="14" font-weight="bold" fill="#1E3A5F">定理 2｜文本不可检测</text>
  <text x="635" y="358" font-size="11" fill="#3D4F65">数据处理不等式：</text>
  <text x="635" y="380" font-size="11" fill="#3D4F65">任何 f(y) 恢复不了</text>
  <text x="635" y="400" font-size="11" fill="#3D4F65">残差 b − E[b|y]</text>
  <text x="735" y="430" text-anchor="middle" font-size="12" font-weight="bold" fill="#1E3A5F">必须看行为日志</text>
  <text x="735" y="448" text-anchor="middle" font-size="10" fill="#8A6E3B">结构性不可能，非能力问题</text>

  <!-- Bottom takeaway -->
  <rect x="60" y="500" width="790" height="70" rx="10" fill="#1E3A5F"/>
  <text x="455" y="530" text-anchor="middle" font-size="14" font-weight="bold" fill="#FFFFFF">结论：评测 Agent 合规性，不能读它说了什么，要看它做了什么</text>
  <text x="455" y="552" text-anchor="middle" font-size="12" fill="#BFD3EA">文本审阅 ≈ 随机  ｜  日志审计 = 唯一可靠镜子</text>
</svg>