<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 420">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4B8BDA"/>
    </marker>
    <marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#C77B5C"/>
    </marker>
  </defs>

  <text x="300" y="30" text-anchor="middle" font-family="Helvetica,Arial" font-size="16" font-weight="600" fill="#1E3A5F">变体隔离 · 一个 Harness 分叉成多个专精体</text>

  <!-- Left: single harness conflict -->
  <g>
    <rect x="30" y="75" width="180" height="110" rx="10" fill="#FBE9E2" stroke="#C77B5C" stroke-width="1.5"/>
    <text x="120" y="103" text-anchor="middle" font-family="Helvetica,Arial" font-size="14" font-weight="600" fill="#1E3A5F">单一 Harness</text>
    <text x="120" y="130" text-anchor="middle" font-family="Helvetica,Arial" font-size="12" fill="#3D4F65">改 A 任务 → B 退步</text>
    <text x="120" y="152" text-anchor="middle" font-family="Helvetica,Arial" font-size="12" fill="#3D4F65">seesaw 拒绝该编辑</text>
    <text x="120" y="174" text-anchor="middle" font-family="Helvetica,Arial" font-size="12" font-weight="600" fill="#C77B5C">进化停滞</text>
  </g>

  <!-- Arrow fork -->
  <path d="M215,130 L268,130" stroke="#4B8BDA" stroke-width="2" fill="none" marker-end="url(#a)"/>
  <text x="241" y="122" text-anchor="middle" font-family="Helvetica,Arial" font-size="11" fill="#1E3A5F">fork</text>

  <!-- Router -->
  <polygon points="280,105 345,130 280,155 298,130" fill="#EFF6FF" stroke="#4B8BDA" stroke-width="1.5"/>
  <text x="312" y="175" text-anchor="middle" font-family="Helvetica,Arial" font-size="12" fill="#1E3A5F">任务簇路由</text>

  <!-- Variants -->
  <g>
    <rect x="400" y="70" width="170" height="60" rx="10" fill="#EFF6FF" stroke="#4B8BDA" stroke-width="1.5"/>
    <text x="485" y="93" text-anchor="middle" font-family="Helvetica,Arial" font-size="13" font-weight="600" fill="#1E3A5F">变体 1 · 重搜索</text>
    <text x="485" y="114" text-anchor="middle" font-family="Helvetica,Arial" font-size="11" fill="#3D4F65">服务搜索类任务</text>
  </g>
  <g>
    <rect x="400" y="150" width="170" height="60" rx="10" fill="#EFF6FF" stroke="#4B8BDA" stroke-width="1.5"/>
    <text x="485" y="173" text-anchor="middle" font-family="Helvetica,Arial" font-size="13" font-weight="600" fill="#1E3A5F">变体 2 · 轻代码</text>
    <text x="485" y="194" text-anchor="middle" font-family="Helvetica,Arial" font-size="11" fill="#3D4F65">服务代码类任务</text>
  </g>

  <path d="M345,125 L398,100" stroke="#4B8BDA" stroke-width="1.8" fill="none" marker-end="url(#a)"/>
  <path d="M345,138 L398,178" stroke="#4B8BDA" stroke-width="1.8" fill="none" marker-end="url(#a)"/>

  <!-- Bottom: edit scoping -->
  <g>
    <rect x="50" y="275" width="180" height="60" rx="10" fill="#FFF6E5" stroke="#C77B5C" stroke-width="1.5"/>
    <text x="140" y="299" text-anchor="middle" font-family="Helvetica,Arial" font-size="13" font-weight="600" fill="#1E3A5F">新编辑：加重搜索工具</text>
    <text x="140" y="320" text-anchor="middle" font-family="Helvetica,Arial" font-size="11" fill="#3D4F65">作用域限定到目标变体</text>
  </g>

  <!-- scoped to variant 1 (search) -->
  <path d="M235,290 C320,260 360,140 398,108" stroke="#4B8BDA" stroke-width="2" fill="none" marker-end="url(#a)"/>
  <text x="320" y="245" text-anchor="middle" font-family="Helvetica,Arial" font-size="11" fill="#1E3A5F">只挂到搜索变体</text>

  <!-- not affecting variant 2 (code) -->
  <path d="M235,318 C300,340 360,260 398,200" stroke="#C77B5C" stroke-width="1.6" fill="none" stroke-dasharray="5,4"/>
  <text x="320" y="358" text-anchor="middle" font-family="Helvetica,Arial" font-size="11" fill="#C77B5C">不波及代码变体</text>

  <!-- Footer note -->
  <text x="300" y="398" text-anchor="middle" font-family="Helvetica,Arial" font-size="12" fill="#3D4F65">seesaw 约束按变体作用域评估 · GAIA +13.6%，15 轮不退化</text>
</svg>