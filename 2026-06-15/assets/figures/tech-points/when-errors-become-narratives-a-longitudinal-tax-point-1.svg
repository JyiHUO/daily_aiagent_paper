<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 460" font-family="-apple-system, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4B8BDA"/>
    </marker>
  </defs>

  <text x="400" y="40" text-anchor="middle" font-size="20" font-weight="600" fill="#1E3A5F">Fail-plausible：错误被讲成故事</text>
  <text x="400" y="62" text-anchor="middle" font-size="13" fill="#3D4F65">错误信号 → 流畅叙述 → 无人察觉</text>

  <!-- Upstream error -->
  <g>
    <polygon points="70,180 110,150 150,170 175,200 155,235 115,250 80,225 60,200"
             fill="#FCE4E4" stroke="#C45B5B" stroke-width="2"/>
    <text x="115" y="198" text-anchor="middle" font-size="13" font-weight="600" fill="#1E3A5F">上游故障</text>
    <text x="115" y="220" text-anchor="middle" font-size="11" fill="#3D4F65">HTTP 400 / Bad JSON</text>
  </g>

  <!-- LLM as storyteller -->
  <g>
    <rect x="320" y="145" width="170" height="120" rx="10" fill="#EFF6FF" stroke="#4B8BDA" stroke-width="2"/>
    <circle cx="405" cy="180" r="14" fill="#FFFFFF" stroke="#4B8BDA" stroke-width="1.5"/>
    <path d="M398 178 Q405 172 412 178" stroke="#1E3A5F" stroke-width="1.5" fill="none"/>
    <circle cx="401" cy="180" r="1.5" fill="#1E3A5F"/>
    <circle cx="409" cy="180" r="1.5" fill="#1E3A5F"/>
    <text x="405" y="222" text-anchor="middle" font-size="13" font-weight="600" fill="#1E3A5F">LLM 续写</text>
    <text x="405" y="244" text-anchor="middle" font-size="11" fill="#3D4F65">把错误当信号，流畅补全</text>
  </g>

  <!-- Output bubble -->
  <g>
    <path d="M610 150 H760 Q775 150 775 165 V235 Q775 250 760 250 H650 L625 275 L633 250 H610 Q595 250 595 235 V165 Q595 150 610 150 Z"
          fill="#FFF4E0" stroke="#D89A3D" stroke-width="2"/>
    <text x="685" y="188" text-anchor="middle" font-size="13" font-weight="600" fill="#1E3A5F">看似健康的输出</text>
    <text x="685" y="214" text-anchor="middle" font-size="11" fill="#3D4F65">"Hugging Face 平台危机分析"</text>
    <text x="685" y="238" text-anchor="middle" font-size="10" fill="#A66A1F" font-style="italic">推送给用户</text>
  </g>

  <!-- arrows -->
  <line x1="178" y1="200" x2="316" y2="200" stroke="#4B8BDA" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="492" y1="200" x2="591" y2="200" stroke="#4B8BDA" stroke-width="2" marker-end="url(#arr)"/>

  <!-- bottom: silent monitor -->
  <g>
    <rect x="180" y="350" width="440" height="60" rx="6" fill="#F4F6F8" stroke="#9AA8BC" stroke-width="1.5" stroke-dasharray="5 4"/>
    <text x="400" y="378" text-anchor="middle" font-size="13" font-weight="600" fill="#1E3A5F">观测层 · 全程无告警</text>
    <text x="400" y="398" text-anchor="middle" font-size="11" fill="#3D4F65">监控不仅瞎了，还被故事骗着报"健康"</text>
  </g>

  <line x1="685" y1="278" x2="620" y2="350" stroke="#9AA8BC" stroke-width="1.3" stroke-dasharray="3 3"/>
  <line x1="115" y1="252" x2="180" y2="350" stroke="#9AA8BC" stroke-width="1.3" stroke-dasharray="3 3"/>
</svg>