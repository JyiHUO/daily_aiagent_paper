<svg xmlns="http://www.w3.org/2000/svg" width="720" height="480" viewBox="0 0 720 480">
  <style>
    .title { font-family: 'PingFang SC','Microsoft YaHei','Noto Sans CJK SC','Hiragino Sans GB',sans-serif; font-size: 20px; font-weight: 600; fill: #1E3A5F; }
    .label { font-family: 'PingFang SC','Microsoft YaHei','Noto Sans CJK SC','Hiragino Sans GB',sans-serif; font-size: 14px; fill: #3D4F65; }
    .metric-num { font-family: 'PingFang SC','Microsoft YaHei','Noto Sans CJK SC','Hiragino Sans GB',sans-serif; font-size: 32px; font-weight: 700; }
    .metric-label { font-family: 'PingFang SC','Microsoft YaHei','Noto Sans CJK SC','Hiragino Sans GB',sans-serif; font-size: 13px; fill: #3D4F65; }
    .vs { font-family: 'PingFang SC','Microsoft YaHei','Noto Sans CJK SC','Hiragino Sans GB',sans-serif; font-size: 22px; fill: #4B8BDA; font-weight: 700; }
  </style>

  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4B8BDA"/>
    </marker>
  </defs>

  <text x="360" y="44" text-anchor="middle" class="title">SOPGuard 实测三项指标</text>

  <!-- 违规率 原版 -->
  <g>
    <rect x="60" y="90" width="240" height="160" rx="10" fill="#FEF2F2" stroke="#E89A8A" stroke-width="1.5"/>
    <text x="180" y="122" text-anchor="middle" class="metric-label">违规率（原版 BrowserOS）</text>
    <text x="180" y="180" text-anchor="middle" class="metric-num" fill="#C0504D">0.97</text>
    <text x="180" y="220" text-anchor="middle" class="label">Email → Google Forms</text>
  </g>

  <!-- 箭头 -->
  <line x1="310" y1="170" x2="410" y2="170" stroke="#4B8BDA" stroke-width="2.5" marker-end="url(#arr)"/>
  <text x="360" y="160" text-anchor="middle" class="vs">SOPGuard</text>

  <!-- 违规率 加防御 -->
  <g>
    <rect x="420" y="90" width="240" height="160" rx="10" fill="#EFF6FF" stroke="#4B8BDA" stroke-width="1.5"/>
    <text x="540" y="122" text-anchor="middle" class="metric-label">违规率（加上防御）</text>
    <text x="540" y="180" text-anchor="middle" class="metric-num" fill="#4B8BDA">0.00</text>
    <text x="540" y="220" text-anchor="middle" class="label">跨域写入全部拦截</text>
  </g>

  <!-- 任务效用 -->
  <g>
    <rect x="60" y="290" width="285" height="150" rx="10" fill="#F5F7FA" stroke="#A8B8CC" stroke-width="1.5"/>
    <text x="202" y="320" text-anchor="middle" class="metric-label">任务效用</text>
    <text x="202" y="370" text-anchor="middle" class="metric-num" fill="#1E3A5F">≈</text>
    <text x="202" y="410" text-anchor="middle" class="label">与原版无显著差异 (paired t-test)</text>
  </g>

  <!-- 运行开销 -->
  <g>
    <rect x="375" y="290" width="285" height="150" rx="10" fill="#FFF8EC" stroke="#D9A85C" stroke-width="1.5"/>
    <text x="517" y="320" text-anchor="middle" class="metric-label">运行时开销</text>
    <text x="517" y="370" text-anchor="middle" class="metric-num" fill="#B8842E">2.07%–5.79%</text>
    <text x="517" y="410" text-anchor="middle" class="label">工程上可承担</text>
  </g>
</svg>