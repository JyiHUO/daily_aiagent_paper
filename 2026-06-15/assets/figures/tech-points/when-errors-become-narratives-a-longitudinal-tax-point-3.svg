<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 460" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4B8BDA"/>
    </marker>
    <marker id="arX" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#C97A6B"/>
    </marker>
  </defs>

  <text x="360" y="34" text-anchor="middle" font-size="19" font-weight="600" fill="#1E3A5F">Audit = rear-view mirror, not crystal ball</text>

  <!-- Left: looking forward (fails) -->
  <g>
    <text x="160" y="78" text-anchor="middle" font-size="13" fill="#3D4F65">looking forward</text>
    <circle cx="160" cy="165" r="58" fill="#FBECE7" stroke="#C97A6B" stroke-width="2"/>
    <circle cx="160" cy="165" r="22" fill="#fff" stroke="#C97A6B" stroke-width="2"/>
    <circle cx="160" cy="165" r="9" fill="#C97A6B"/>
    <line x1="118" y1="207" x2="202" y2="123" stroke="#C97A6B" stroke-width="3"/>
    <text x="160" y="252" text-anchor="middle" font-size="14" font-weight="600" fill="#1E3A5F">predict new failure</text>
    <text x="160" y="272" text-anchor="middle" font-size="13" fill="#C97A6B">0 / 15</text>
  </g>

  <!-- Right: looking back (works) -->
  <g>
    <text x="560" y="78" text-anchor="middle" font-size="13" fill="#3D4F65">looking back</text>
    <rect x="500" y="113" width="120" height="104" rx="8" fill="#EFF6FF" stroke="#4B8BDA" stroke-width="2"/>
    <rect x="514" y="127" width="92" height="76" rx="4" fill="#fff" stroke="#4B8BDA" stroke-width="1.5"/>
    <line x1="514" y1="145" x2="606" y2="145" stroke="#4B8BDA" stroke-width="1" opacity="0.5"/>
    <line x1="514" y1="165" x2="606" y2="165" stroke="#4B8BDA" stroke-width="1" opacity="0.5"/>
    <line x1="514" y1="185" x2="606" y2="185" stroke="#4B8BDA" stroke-width="1" opacity="0.5"/>
    <text x="560" y="252" text-anchor="middle" font-size="14" font-weight="600" fill="#1E3A5F">block known regression</text>
    <text x="560" y="272" text-anchor="middle" font-size="13" fill="#4B8BDA">13 / 15  (87%)</text>
  </g>

  <!-- Past incident arrow into mirror -->
  <text x="445" y="158" text-anchor="middle" font-size="12" fill="#3D4F65">past incident</text>
  <path d="M 400 170 L 498 170" stroke="#4B8BDA" stroke-width="2" fill="none" marker-end="url(#ar)"/>

  <!-- Future arrow blocked at crystal ball -->
  <text x="275" y="158" text-anchor="middle" font-size="12" fill="#3D4F65">unseen failure</text>
  <path d="M 320 170 L 222 170" stroke="#C97A6B" stroke-width="2" fill="none" stroke-dasharray="5,4" marker-end="url(#arX)"/>

  <!-- Maturity ladder -->
  <g transform="translate(0,310)">
    <text x="360" y="0" text-anchor="middle" font-size="13" fill="#3D4F65">only step 3 brings zero recurrence</text>

    <rect x="60" y="20" width="160" height="58" rx="6" fill="#F4F1EA" stroke="#A89B7E" stroke-width="1.5"/>
    <text x="140" y="44" text-anchor="middle" font-size="13" font-weight="600" fill="#1E3A5F">point fix</text>
    <text x="140" y="64" text-anchor="middle" font-size="11" fill="#3D4F65">one diff</text>

    <rect x="280" y="20" width="160" height="58" rx="6" fill="#E7EEF7" stroke="#7AA4D1" stroke-width="1.5"/>
    <text x="360" y="44" text-anchor="middle" font-size="13" font-weight="600" fill="#1E3A5F">meta-rule</text>
    <text x="360" y="64" text-anchor="middle" font-size="11" fill="#3D4F65">23 written</text>

    <rect x="500" y="20" width="160" height="58" rx="6" fill="#DCEBFB" stroke="#4B8BDA" stroke-width="2"/>
    <text x="580" y="44" text-anchor="middle" font-size="13" font-weight="600" fill="#1E3A5F">mechanized scanner</text>
    <text x="580" y="64" text-anchor="middle" font-size="11" fill="#4B8BDA">14 — zero recur</text>

    <path d="M 220 49 L 278 49" stroke="#4B8BDA" stroke-width="2" fill="none" marker-end="url(#ar)"/>
    <path d="M 440 49 L 498 49" stroke="#4B8BDA" stroke-width="2" fill="none" marker-end="url(#ar)"/>
  </g>
</svg>