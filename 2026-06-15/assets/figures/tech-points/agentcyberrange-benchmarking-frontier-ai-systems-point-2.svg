<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 440" font-family="-apple-system, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4B8BDA"/>
    </marker>
  </defs>

  <text x="360" y="42" text-anchor="middle" font-size="20" font-weight="600" fill="#1E3A5F">三档难度提示 · 给 Agent 的能力照 X 光</text>
  <text x="360" y="66" text-anchor="middle" font-size="13" fill="#3D4F65">逐层揭示线索，分离「攻击面发现」与「漏洞利用」</text>

  <!-- Level 0 -->
  <g>
    <rect x="60" y="110" width="180" height="170" rx="10" fill="#EFF6FF" stroke="#4B8BDA" stroke-width="1.5"/>
    <text x="150" y="138" text-anchor="middle" font-size="14" font-weight="600" fill="#1E3A5F">Level 0 · 只给入口</text>
    <circle cx="150" cy="200" r="32" fill="#fff" stroke="#1E3A5F" stroke-width="1.5"/>
    <text x="150" y="206" text-anchor="middle" font-size="13" fill="#1E3A5F">URL</text>
    <text x="150" y="260" text-anchor="middle" font-size="13" font-weight="600" fill="#C97B4A">成功率 16.1%</text>
  </g>

  <!-- Level 1 -->
  <g>
    <rect x="270" y="110" width="180" height="170" rx="10" fill="#FFF4E6" stroke="#E0A86A" stroke-width="1.5"/>
    <text x="360" y="138" text-anchor="middle" font-size="14" font-weight="600" fill="#1E3A5F">Level 1 · 指出漏洞位置</text>
    <circle cx="350" cy="205" r="22" fill="none" stroke="#1E3A5F" stroke-width="1.5"/>
    <line x1="367" y1="222" x2="383" y2="238" stroke="#1E3A5F" stroke-width="2.5"/>
    <circle cx="350" cy="205" r="5" fill="#C97B4A"/>
    <text x="360" y="260" text-anchor="middle" font-size="13" font-weight="600" fill="#C97B4A">较 L0 +21 pp</text>
  </g>

  <!-- Level 2 -->
  <g>
    <rect x="480" y="110" width="180" height="170" rx="10" fill="#E8F0E8" stroke="#6FA86F" stroke-width="1.5"/>
    <text x="570" y="138" text-anchor="middle" font-size="14" font-weight="600" fill="#1E3A5F">Level 2 · 指明漏洞类型</text>
    <circle cx="552" cy="205" r="10" fill="none" stroke="#1E3A5F" stroke-width="2"/>
    <line x1="562" y1="205" x2="592" y2="205" stroke="#1E3A5F" stroke-width="2"/>
    <line x1="585" y1="205" x2="585" y2="213" stroke="#1E3A5F" stroke-width="2"/>
    <line x1="592" y1="205" x2="592" y2="215" stroke="#1E3A5F" stroke-width="2"/>
    <text x="570" y="260" text-anchor="middle" font-size="13" font-weight="600" fill="#3F7A3F">成功率 33.0%</text>
  </g>

  <!-- arrows between levels -->
  <line x1="240" y1="195" x2="268" y2="195" stroke="#4B8BDA" stroke-width="2" marker-end="url(#ar)"/>
  <line x1="450" y1="195" x2="478" y2="195" stroke="#4B8BDA" stroke-width="2" marker-end="url(#ar)"/>

  <!-- bottom insight -->
  <rect x="100" y="330" width="520" height="74" rx="10" fill="#F5F0E8" stroke="#C97B4A" stroke-width="1.2" stroke-dasharray="4 3"/>
  <text x="360" y="358" text-anchor="middle" font-size="13" font-weight="600" fill="#1E3A5F">瓶颈不在「写 payload」，而在「连页面都爬不到」</text>
  <text x="360" y="382" text-anchor="middle" font-size="12" fill="#3D4F65">深度 2 漏洞 35% → 深度 6 漏洞 11%</text>
</svg>