<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 440" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4B8BDA"/>
    </marker>
  </defs>

  <text x="300" y="30" text-anchor="middle" font-size="17" font-weight="bold" fill="#1E3A5F">Silent failures slip past automated checks</text>
  <text x="300" y="50" text-anchor="middle" font-size="12" fill="#3D4F65">— caught by the human reading the output</text>

  <!-- Agent runtime stack -->
  <rect x="40" y="110" width="180" height="200" rx="8" fill="#EFF6FF" stroke="#4B8BDA" stroke-width="1.5"/>
  <text x="130" y="132" text-anchor="middle" font-size="12" fill="#1E3A5F" font-weight="bold">Automated checks</text>
  <line x1="60" y1="142" x2="200" y2="142" stroke="#B8CFE5"/>

  <rect x="60" y="156" width="140" height="30" rx="4" fill="#FFFFFF" stroke="#B8CFE5"/>
  <text x="130" y="175" text-anchor="middle" font-size="11" fill="#3D4F65">unit tests</text>

  <rect x="60" y="194" width="140" height="30" rx="4" fill="#FFFFFF" stroke="#B8CFE5"/>
  <text x="130" y="213" text-anchor="middle" font-size="11" fill="#3D4F65">preflight checks</text>

  <rect x="60" y="232" width="140" height="30" rx="4" fill="#FFFFFF" stroke="#B8CFE5"/>
  <text x="130" y="251" text-anchor="middle" font-size="11" fill="#3D4F65">LLM observer</text>

  <text x="130" y="287" text-anchor="middle" font-size="11" fill="#B85C5C" font-style="italic" font-weight="bold">~0% catch rate</text>

  <!-- Pushed output -->
  <rect x="255" y="175" width="110" height="90" rx="6" fill="#FFF4E0" stroke="#D9A85C" stroke-width="1.5"/>
  <text x="310" y="210" text-anchor="middle" font-size="12" fill="#1E3A5F" font-weight="bold">pushed output</text>
  <text x="310" y="232" text-anchor="middle" font-size="10" fill="#8A6A2E" font-style="italic">plausible prose</text>
  <text x="310" y="250" text-anchor="middle" font-size="10" fill="#8A6A2E" font-style="italic">(error narrated)</text>

  <!-- Errors flowing through: runtime -> output -->
  <line x1="220" y1="220" x2="253" y2="220" stroke="#4B8BDA" stroke-width="1.5" marker-end="url(#ar)"/>

  <!-- Human eye -->
  <g transform="translate(490,220)">
    <ellipse cx="0" cy="0" rx="50" ry="30" fill="#EFF6FF" stroke="#1E3A5F" stroke-width="2"/>
    <circle cx="0" cy="0" r="17" fill="#FFFFFF" stroke="#1E3A5F" stroke-width="1.5"/>
    <circle cx="0" cy="0" r="8" fill="#1E3A5F"/>
    <circle cx="3" cy="-3" r="2.2" fill="#FFFFFF"/>
  </g>
  <text x="490" y="278" text-anchor="middle" font-size="12" fill="#1E3A5F" font-weight="bold">human reader</text>
  <text x="490" y="294" text-anchor="middle" font-size="11" fill="#B85C5C" font-weight="bold">~70% catch</text>

  <!-- output -> human -->
  <line x1="367" y1="220" x2="435" y2="220" stroke="#4B8BDA" stroke-width="1.5" marker-end="url(#ar)"/>

  <!-- User quote (single, concise) -->
  <text x="310" y="298" text-anchor="middle" font-size="10" fill="#3D4F65" font-style="italic">"this digest is shallow…"</text>

  <!-- Bottom: observation ritual -->
  <rect x="60" y="345" width="480" height="70" rx="8" fill="#FDF6E7" stroke="#D9A85C" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="300" y="368" text-anchor="middle" font-size="12" font-weight="bold" fill="#1E3A5F">weekly 30-min observation ritual</text>
  <text x="300" y="388" text-anchor="middle" font-size="11" fill="#3D4F65">noise · latency · density · quality</text>
  <text x="300" y="405" text-anchor="middle" font-size="10" fill="#8A6A2E" font-style="italic">— the human as a first-class observer</text>

  <!-- Feedback loop: human -> ritual -> runtime -->
  <path d="M490 252 Q 490 330 470 340" fill="none" stroke="#8A6A2E" stroke-width="1.2" stroke-dasharray="3,3" marker-end="url(#ar)"/>
  <path d="M130 345 Q 130 320 130 312" fill="none" stroke="#8A6A2E" stroke-width="1.2" stroke-dasharray="3,3" marker-end="url(#ar)"/>
</svg>