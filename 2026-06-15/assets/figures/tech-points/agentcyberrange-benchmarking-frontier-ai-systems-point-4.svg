<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 420" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4B8BDA"/>
    </marker>
  </defs>

  <text x="300" y="32" text-anchor="middle" font-size="17" font-weight="700" fill="#1E3A5F">六大前沿 Agent · 同一靶场</text>

  <!-- Six agents as a row of small chips -->
  <g font-size="11" fill="#1E3A5F">
    <rect x="30"  y="58" width="86" height="30" rx="6" fill="#EFF6FF" stroke="#4B8BDA"/>
    <text x="73"  y="78" text-anchor="middle">GPT-5.5</text>
    <rect x="126" y="58" width="86" height="30" rx="6" fill="#EFF6FF" stroke="#4B8BDA"/>
    <text x="169" y="78" text-anchor="middle">Opus-4.7</text>
    <rect x="222" y="58" width="86" height="30" rx="6" fill="#EFF6FF" stroke="#4B8BDA"/>
    <text x="265" y="78" text-anchor="middle">Qwen</text>
    <rect x="318" y="58" width="86" height="30" rx="6" fill="#EFF6FF" stroke="#4B8BDA"/>
    <text x="361" y="78" text-anchor="middle">Kimi</text>
    <rect x="414" y="58" width="86" height="30" rx="6" fill="#EFF6FF" stroke="#4B8BDA"/>
    <text x="457" y="78" text-anchor="middle">DeepSeek-V4</text>
    <rect x="510" y="58" width="60" height="30" rx="6" fill="#EFF6FF" stroke="#4B8BDA"/>
    <text x="540" y="78" text-anchor="middle">GLM-5.1</text>
  </g>

  <!-- converging arrows to scoreboard -->
  <line x1="100" y1="89" x2="220" y2="155" stroke="#4B8BDA" stroke-width="1.3" marker-end="url(#a)"/>
  <line x1="300" y1="89" x2="300" y2="155" stroke="#4B8BDA" stroke-width="1.3" marker-end="url(#a)"/>
  <line x1="500" y1="89" x2="380" y2="155" stroke="#4B8BDA" stroke-width="1.3" marker-end="url(#a)"/>

  <!-- Scoreboard: leader -->
  <rect x="160" y="160" width="280" height="105" rx="10" fill="#FFF4E6" stroke="#E29A4A" stroke-width="1.6"/>
  <text x="300" y="184" text-anchor="middle" font-size="13" font-weight="700" fill="#1E3A5F">领先者 GPT-5.5 · Pass@3</text>
  <text x="235" y="220" text-anchor="middle" font-size="22" font-weight="700" fill="#C2632A">16.1%</text>
  <text x="235" y="238" text-anchor="middle" font-size="11" fill="#3D4F65">Web</text>
  <text x="365" y="220" text-anchor="middle" font-size="22" font-weight="700" fill="#C2632A">31.7%</text>
  <text x="365" y="238" text-anchor="middle" font-size="11" fill="#3D4F65">Post-Exploit</text>
  <text x="300" y="258" text-anchor="middle" font-size="11" fill="#3D4F65">加提示后 → 33% / 46.3%</text>

  <!-- Two outcome panels: capability vs instability -->
  <rect x="30" y="300" width="260" height="95" rx="10" fill="#EAF4EC" stroke="#5BA169"/>
  <text x="160" y="324" text-anchor="middle" font-size="13" font-weight="700" fill="#1E3A5F">✓ 能力浮现</text>
  <text x="160" y="350" text-anchor="middle" font-size="11" fill="#3D4F65">自写 exploit，发现 0day</text>
  <text x="160" y="370" text-anchor="middle" font-size="11" fill="#3D4F65">webshell 被杀后变形重连</text>

  <rect x="310" y="300" width="260" height="95" rx="10" fill="#FBEAEA" stroke="#C25A5A"/>
  <text x="440" y="324" text-anchor="middle" font-size="13" font-weight="700" fill="#1E3A5F">✗ 仍不稳定</text>
  <text x="440" y="350" text-anchor="middle" font-size="11" fill="#3D4F65">三次跑结果方差大</text>
  <text x="440" y="370" text-anchor="middle" font-size="11" fill="#3D4F65">踩 honeypot，触发告警</text>

  <line x1="240" y1="265" x2="180" y2="300" stroke="#4B8BDA" stroke-width="1.3" marker-end="url(#a)"/>
  <line x1="360" y1="265" x2="420" y2="300" stroke="#4B8BDA" stroke-width="1.3" marker-end="url(#a)"/>
</svg>