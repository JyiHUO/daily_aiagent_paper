<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 640" font-family="'PingFang SC','Helvetica Neue',Arial,sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4B8BDA"/>
    </marker>
    <marker id="arrOrange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#E89A3C"/>
    </marker>
  </defs>

  <rect width="900" height="640" fill="#FAFBFD"/>

  <!-- Title -->
  <text x="450" y="40" text-anchor="middle" font-size="22" font-weight="700" fill="#1E3A5F">HarnessX：把 Agent 外壳铸成可演化的一等对象</text>
  <text x="450" y="62" text-anchor="middle" font-size="13" fill="#3D4F65">Composable · Adaptive · Evolvable Harness Foundry</text>

  <!-- Variant isolation hint label only -->
  <text x="450" y="92" text-anchor="middle" font-size="11" fill="#7A8A9F">变体隔离：异构任务 fork 出多套 harness 路由</text>

  <!-- Center: Model -->
  <circle cx="450" cy="350" r="58" fill="#FFF4E6" stroke="#E89A3C" stroke-width="2.5"/>
  <text x="450" y="346" text-anchor="middle" font-size="15" font-weight="700" fill="#1E3A5F">LLM</text>
  <text x="450" y="366" text-anchor="middle" font-size="11" fill="#3D4F65">模型</text>

  <!-- Outer harness ring (dashed) -->
  <circle cx="450" cy="350" r="160" fill="none" stroke="#4B8BDA" stroke-width="2" stroke-dasharray="6 5" opacity="0.55"/>

  <!-- Ring label -->
  <text x="450" y="178" text-anchor="middle" font-size="11" fill="#4B8BDA" font-weight="600">Harness 外壳：8 hooks · 9 维度 processor</text>

  <!-- 4 harness primitive nodes -->
  <g font-size="12" fill="#1E3A5F">
    <rect x="395" y="208" width="110" height="38" rx="8" fill="#EFF6FF" stroke="#4B8BDA" stroke-width="1.5"/>
    <text x="450" y="232" text-anchor="middle" font-weight="600">Prompt 提示</text>

    <rect x="540" y="331" width="110" height="38" rx="8" fill="#EFF6FF" stroke="#4B8BDA" stroke-width="1.5"/>
    <text x="595" y="355" text-anchor="middle" font-weight="600">Tools 工具</text>

    <rect x="395" y="454" width="110" height="38" rx="8" fill="#EFF6FF" stroke="#4B8BDA" stroke-width="1.5"/>
    <text x="450" y="478" text-anchor="middle" font-weight="600">Memory 记忆</text>

    <rect x="250" y="331" width="110" height="38" rx="8" fill="#EFF6FF" stroke="#4B8BDA" stroke-width="1.5"/>
    <text x="305" y="355" text-anchor="middle" font-weight="600">Control 控制流</text>
  </g>

  <!-- LEFT: Trace input -->
  <g>
    <rect x="40" y="260" width="170" height="92" rx="10" fill="#F1F5FB" stroke="#3D4F65" stroke-width="1.3"/>
    <text x="125" y="286" text-anchor="middle" font-size="13" font-weight="700" fill="#1E3A5F">执行轨迹 τ</text>
    <text x="125" y="306" text-anchor="middle" font-size="11" fill="#3D4F65">5 个 Benchmark</text>
    <text x="125" y="324" text-anchor="middle" font-size="10" fill="#3D4F65">ALFWorld · GAIA · WebShop</text>
    <text x="125" y="340" text-anchor="middle" font-size="10" fill="#3D4F65">τ³-Bench · SWE-bench</text>
  </g>
  <path d="M210,310 Q230,330 250,345" stroke="#4B8BDA" stroke-width="2" fill="none" marker-end="url(#arr)"/>

  <!-- RIGHT: AEGIS evolution engine -->
  <g>
    <rect x="700" y="220" width="170" height="170" rx="12" fill="#FFF4E6" stroke="#E89A3C" stroke-width="2"/>
    <text x="785" y="244" text-anchor="middle" font-size="14" font-weight="700" fill="#1E3A5F">AEGIS 演化引擎</text>
    <text x="785" y="262" text-anchor="middle" font-size="10" fill="#7A5A2E">symbolic MDP · 改写当 RL</text>

    <g font-size="11.5" fill="#1E3A5F">
      <text x="718" y="292">① Digester　摘要</text>
      <text x="718" y="312">② Planner　规划</text>
      <text x="718" y="332">③ Evolver　改写</text>
      <text x="718" y="352">④ Critic　验收</text>
      <text x="718" y="378" font-weight="600" fill="#C0392B">⛔ 不回归旧任务</text>
    </g>
  </g>
  <!-- model/ring -> AEGIS -->
  <path d="M650,345 L700,310" stroke="#E89A3C" stroke-width="2" fill="none" marker-end="url(#arrOrange)"/>

  <!-- harness updates feedback -->
  <path d="M700,235 Q600,150 505,212" stroke="#E89A3C" stroke-width="2" fill="none" marker-end="url(#arrOrange)"/>
  <text x="610" y="148" text-anchor="middle" font-size="11" fill="#B8742A" font-weight="600">harness 更新</text>

  <!-- Bottom: GRPO -->
  <g>
    <rect x="220" y="540" width="460" height="76" rx="10" fill="#EFF6FF" stroke="#4B8BDA" stroke-width="1.8"/>
    <text x="450" y="564" text-anchor="middle" font-size="13" font-weight="700" fill="#1E3A5F">Cross-Harness GRPO · 模型与外壳协同进化</text>
    <text x="450" y="584" text-anchor="middle" font-size="11" fill="#3D4F65">同任务跨 H₀/H₁/H₂ 版本聚组 · 把脚手架经验内化进权重</text>
    <text x="450" y="602" text-anchor="middle" font-size="10" fill="#7A8A9F">FIFO Replay Buffer B：(τ, r) 同时喂给 AEGIS 与 GRPO</text>
  </g>

  <!-- model -> buffer -->
  <path d="M470,410 L470,538" stroke="#4B8BDA" stroke-width="2" fill="none" marker-end="url(#arr)"/>
  <!-- buffer back to model -->
  <path d="M420,540 Q360,470 410,410" stroke="#4B8BDA" stroke-width="2" fill="none" marker-end="url(#arr)"/>
  <text x="345" y="492" text-anchor="middle" font-size="10.5" fill="#2E5A8A" font-weight="600">训练信号</text>

  <!-- Bottom-right gain badge -->
  <g>
    <rect x="700" y="540" width="170" height="76" rx="10" fill="#FFFFFF" stroke="#E89A3C" stroke-width="1.8"/>
    <text x="785" y="572" text-anchor="middle" font-size="22" font-weight="800" fill="#E89A3C">+14.5%</text>
    <text x="785" y="592" text-anchor="middle" font-size="10.5" fill="#3D4F65">5 项 Benchmark 平均</text>
    <text x="785" y="608" text-anchor="middle" font-size="10" fill="#7A8A9F">最高 +44.0%</text>
  </g>
</svg>