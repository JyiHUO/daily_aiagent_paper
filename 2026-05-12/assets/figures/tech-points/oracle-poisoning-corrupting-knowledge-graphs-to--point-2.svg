<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4B8BDA"/>
    </marker>
    <marker id="arRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#C0392B"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="450" y="38" text-anchor="middle" font-size="22" font-weight="bold" fill="#1E3A5F">Oracle Poisoning：3 个节点骗倒 9 个大模型</text>
  <text x="450" y="62" text-anchor="middle" font-size="13" fill="#3D4F65">攻击者不改模型、不改 prompt，只在知识图谱里塞 3 个假节点</text>

  <!-- Left: Graph poison -->
  <rect x="40" y="95" width="240" height="180" rx="10" fill="#FFF3E6" stroke="#E08A3C" stroke-width="2"/>
  <text x="160" y="120" text-anchor="middle" font-size="15" font-weight="bold" fill="#1E3A5F">4200 万节点代码图谱</text>
  <text x="160" y="140" text-anchor="middle" font-size="12" fill="#3D4F65">仅注入 3 个节点 (0.000007%)</text>

  <!-- tiny graph dots -->
  <g fill="#B0BCCB">
    <circle cx="75" cy="175" r="3"/><circle cx="95" cy="190" r="3"/><circle cx="115" cy="170" r="3"/>
    <circle cx="135" cy="200" r="3"/><circle cx="170" cy="180" r="3"/><circle cx="200" cy="195" r="3"/>
    <circle cx="225" cy="170" r="3"/><circle cx="250" cy="195" r="3"/>
    <circle cx="85" cy="220" r="3"/><circle cx="125" cy="235" r="3"/><circle cx="170" cy="225" r="3"/>
    <circle cx="215" cy="240" r="3"/><circle cx="250" cy="225" r="3"/>
  </g>
  <!-- 3 poisoned nodes -->
  <circle cx="145" cy="215" r="7" fill="#C0392B"/>
  <circle cx="180" cy="245" r="7" fill="#C0392B"/>
  <circle cx="210" cy="210" r="7" fill="#C0392B"/>
  <text x="160" y="266" text-anchor="middle" font-size="11" fill="#C0392B" font-weight="bold">假节点：命名规范 + OWASP 引用</text>

  <!-- Middle: MCP tool -->
  <rect x="335" y="125" width="230" height="120" rx="10" fill="#EFF6FF" stroke="#4B8BDA" stroke-width="2"/>
  <text x="450" y="153" text-anchor="middle" font-size="15" font-weight="bold" fill="#1E3A5F">MCP 工具调用</text>
  <text x="450" y="178" text-anchor="middle" font-size="12" fill="#3D4F65">query_knowledge_graph()</text>
  <text x="450" y="202" text-anchor="middle" font-size="11" fill="#3D4F65">SDK 真实注册的工具</text>
  <text x="450" y="222" text-anchor="middle" font-size="11" fill="#3D4F65">Agent 自主决定调用</text>

  <!-- Right: 9 models -->
  <rect x="620" y="95" width="240" height="180" rx="10" fill="#EAF3EC" stroke="#5B9C6E" stroke-width="2"/>
  <text x="740" y="120" text-anchor="middle" font-size="15" font-weight="bold" fill="#1E3A5F">9 个主流模型</text>
  <text x="740" y="140" text-anchor="middle" font-size="11" fill="#3D4F65">GPT-4o · Claude Opus 4.5 · Gemini 2.5 Pro …</text>

  <g font-size="11" fill="#1E3A5F">
    <rect x="635" y="152" width="65" height="22" rx="3" fill="#FFFFFF" stroke="#5B9C6E"/>
    <text x="667" y="168" text-anchor="middle">OpenAI</text>
    <rect x="707" y="152" width="65" height="22" rx="3" fill="#FFFFFF" stroke="#5B9C6E"/>
    <text x="740" y="168" text-anchor="middle">Anthropic</text>
    <rect x="779" y="152" width="65" height="22" rx="3" fill="#FFFFFF" stroke="#5B9C6E"/>
    <text x="811" y="168" text-anchor="middle">Google</text>
  </g>

  <text x="740" y="215" text-anchor="middle" font-size="30" font-weight="bold" fill="#C0392B">269 / 269</text>
  <text x="740" y="240" text-anchor="middle" font-size="13" fill="#1E3A5F" font-weight="bold">100% 接受伪造的安全声明</text>
  <text x="740" y="262" text-anchor="middle" font-size="11" fill="#3D4F65">“SQL 注入已缓解” ✓</text>

  <!-- Arrows -->
  <line x1="280" y1="185" x2="333" y2="185" stroke="#4B8BDA" stroke-width="2.5" marker-end="url(#ar)"/>
  <text x="306" y="177" text-anchor="middle" font-size="10" fill="#3D4F65">查询</text>

  <line x1="565" y1="185" x2="618" y2="185" stroke="#C0392B" stroke-width="2.5" marker-end="url(#arRed)"/>
  <text x="591" y="177" text-anchor="middle" font-size="10" fill="#C0392B">污染结果</text>

  <!-- Bottom: skill ladder L0-L3 -->
  <text x="450" y="320" text-anchor="middle" font-size="15" font-weight="bold" fill="#1E3A5F">攻击者技能梯度：不是“能不能骗”，而是“花多少功夫”</text>

  <!-- ladder -->
  <g font-size="12">
    <rect x="60" y="345" width="180" height="70" rx="8" fill="#EFF6FF" stroke="#4B8BDA"/>
    <text x="150" y="368" text-anchor="middle" font-weight="bold" fill="#1E3A5F">L0 / L1</text>
    <text x="150" y="388" text-anchor="middle" fill="#3D4F65">粗糙伪造</text>
    <text x="150" y="406" text-anchor="middle" font-weight="bold" fill="#5B9C6E">≈ 0% 中招</text>

    <rect x="360" y="345" width="180" height="70" rx="8" fill="#FFF3E6" stroke="#E08A3C"/>
    <text x="450" y="368" text-anchor="middle" font-weight="bold" fill="#1E3A5F">L2</text>
    <text x="450" y="388" text-anchor="middle" fill="#3D4F65">命名规范 + OWASP</text>
    <text x="450" y="406" text-anchor="middle" font-weight="bold" fill="#C0392B">100% 中招</text>

    <rect x="660" y="345" width="180" height="70" rx="8" fill="#F5E6E6" stroke="#C0392B"/>
    <text x="750" y="368" text-anchor="middle" font-weight="bold" fill="#1E3A5F">L3</text>
    <text x="750" y="388" text-anchor="middle" fill="#3D4F65">深度伪装</text>
    <text x="750" y="406" text-anchor="middle" font-weight="bold" fill="#C0392B">100% 中招</text>
  </g>

  <!-- discrete jump arrow -->
  <path d="M 245 380 L 355 380" stroke="#C0392B" stroke-width="3" stroke-dasharray="6,4" marker-end="url(#arRed)"/>
  <text x="300" y="372" text-anchor="middle" font-size="11" font-weight="bold" fill="#C0392B">离散破防点</text>
  <text x="300" y="398" text-anchor="middle" font-size="10" fill="#3D4F65">0 → 100</text>

  <!-- Bottom takeaway -->
  <rect x="120" y="455" width="660" height="70" rx="10" fill="#1E3A5F"/>
  <text x="450" y="482" text-anchor="middle" font-size="14" font-weight="bold" fill="#FFFFFF">核心警示：Agent 把 MCP 返回值当“事实”，不当“声明”</text>
  <text x="450" y="505" text-anchor="middle" font-size="12" fill="#D5E2F0">推理链看起来完全合理 —— 但前提是假的</text>
</svg>