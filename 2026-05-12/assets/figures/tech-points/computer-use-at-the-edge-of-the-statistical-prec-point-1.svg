<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4B8BDA"/>
    </marker>
  </defs>

  <rect width="900" height="560" fill="#FAF7F2"/>

  <text x="450" y="40" text-anchor="middle" font-size="24" font-weight="bold" fill="#1E3A5F">1MB 脚本击败前沿大模型</text>
  <text x="450" y="64" text-anchor="middle" font-size="13" fill="#3D4F65">确定性环境下，重放就能"作弊"</text>

  <!-- Step 1: Record -->
  <g>
    <rect x="50" y="100" width="240" height="160" rx="12" fill="#EFF6FF" stroke="#4B8BDA" stroke-width="2"/>
    <text x="170" y="128" text-anchor="middle" font-size="16" font-weight="bold" fill="#1E3A5F">① 录一次成功</text>
    <text x="170" y="155" text-anchor="middle" font-size="13" fill="#3D4F65">前沿模型跑 k 次，偶然成功 1 次</text>
    <rect x="80" y="180" width="180" height="60" rx="6" fill="#FFFFFF" stroke="#7FA8D6"/>
    <text x="170" y="202" text-anchor="middle" font-size="12" fill="#1E3A5F">click(320,180)</text>
    <text x="170" y="222" text-anchor="middle" font-size="12" fill="#1E3A5F">type("report.pdf")</text>
  </g>

  <line x1="290" y1="180" x2="355" y2="180" stroke="#4B8BDA" stroke-width="2.5" marker-end="url(#ar)"/>

  <!-- Step 2: Replay agent -->
  <g>
    <rect x="360" y="100" width="220" height="160" rx="12" fill="#FFF1E6" stroke="#E89B5C" stroke-width="2"/>
    <text x="470" y="128" text-anchor="middle" font-size="16" font-weight="bold" fill="#7A3E12">② 1MB 重放脚本</text>
    <text x="470" y="172" text-anchor="middle" font-size="34">📼</text>
    <text x="470" y="210" text-anchor="middle" font-size="13" fill="#3D4F65">不看屏幕、不调 LLM</text>
    <text x="470" y="232" text-anchor="middle" font-size="13" fill="#3D4F65">机械按时间戳重放</text>
  </g>

  <line x1="580" y1="180" x2="645" y2="180" stroke="#4B8BDA" stroke-width="2.5" marker-end="url(#ar)"/>

  <!-- Step 3: Result -->
  <g>
    <rect x="650" y="100" width="200" height="160" rx="12" fill="#E8F5EC" stroke="#4FA86E" stroke-width="2"/>
    <text x="750" y="128" text-anchor="middle" font-size="16" font-weight="bold" fill="#1E3A5F">③ 居然赢了</text>
    <text x="750" y="170" text-anchor="middle" font-size="22" font-weight="bold" fill="#2E7D45">71.1%</text>
    <text x="750" y="188" text-anchor="middle" font-size="11" fill="#3D4F65">OSWorld</text>
    <text x="750" y="222" text-anchor="middle" font-size="22" font-weight="bold" fill="#2E7D45">41.5%</text>
    <text x="750" y="240" text-anchor="middle" font-size="11" fill="#3D4F65">MobileWorld</text>
  </g>

  <!-- Bottom: comparison -->
  <g>
    <rect x="80" y="310" width="340" height="200" rx="12" fill="#FFFFFF" stroke="#C9D6E8" stroke-width="1.5"/>
    <text x="250" y="340" text-anchor="middle" font-size="15" font-weight="bold" fill="#1E3A5F">前沿模型 (源 agent)</text>
    <text x="250" y="370" text-anchor="middle" font-size="13" fill="#3D4F65">每次重新看屏幕、推理</text>
    <text x="250" y="392" text-anchor="middle" font-size="13" fill="#3D4F65">采样有波动，偶尔失败</text>

    <rect x="120" y="420" width="260" height="28" rx="4" fill="#EFF6FF"/>
    <rect x="120" y="420" width="170" height="28" rx="4" fill="#7FA8D6"/>
    <text x="250" y="440" text-anchor="middle" font-size="13" font-weight="bold" fill="#FFFFFF">~65%</text>
    <text x="250" y="478" text-anchor="middle" font-size="11" fill="#3D4F65">每次都努力思考，反而更低</text>
  </g>

  <g>
    <rect x="480" y="310" width="340" height="200" rx="12" fill="#FFFFFF" stroke="#E89B5C" stroke-width="1.5"/>
    <text x="650" y="340" text-anchor="middle" font-size="15" font-weight="bold" fill="#7A3E12">1MB 重放脚本</text>
    <text x="650" y="370" text-anchor="middle" font-size="13" fill="#3D4F65">环境确定性 → 同样输入</text>
    <text x="650" y="392" text-anchor="middle" font-size="13" fill="#3D4F65">期望成功率 = 源模型 pass@k</text>

    <rect x="520" y="420" width="260" height="28" rx="4" fill="#FFF1E6"/>
    <rect x="520" y="420" width="185" height="28" rx="4" fill="#E89B5C"/>
    <text x="650" y="440" text-anchor="middle" font-size="13" font-weight="bold" fill="#FFFFFF">71.1%</text>
    <text x="650" y="478" text-anchor="middle" font-size="11" fill="#3D4F65">什么都不"看"，反而更稳</text>
  </g>

  <text x="450" y="538" text-anchor="middle" font-size="13" font-style="italic" fill="#1E3A5F">结论：刷 pass@k 的高分，可能只是在"背一次抽中的答案"</text>
</svg>