<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4B8BDA"/>
    </marker>
  </defs>

  <rect width="900" height="560" fill="#F7F9FC"/>

  <text x="450" y="40" text-anchor="middle" font-size="24" font-weight="bold" fill="#1E3A5F">排行榜可识别性检查</text>
  <text x="450" y="65" text-anchor="middle" font-size="14" fill="#3D4F65">规则：仅当 LB(i) &gt; UB(j) 才声明 i ≻ j，否则判为「未识别」</text>

  <!-- Case A: AgentDojo -->
  <g>
    <rect x="50" y="100" width="380" height="210" rx="10" fill="#EFF6FF" stroke="#4B8BDA" stroke-width="1.5"/>
    <text x="240" y="128" text-anchor="middle" font-size="16" font-weight="bold" fill="#1E3A5F">AgentDojo：区间重叠</text>
    <text x="240" y="148" text-anchor="middle" font-size="12" fill="#3D4F65">原始排名 C ≻ D ≻ G</text>

    <line x1="110" y1="265" x2="410" y2="265" stroke="#B0BEC5" stroke-width="1"/>
    <rect x="160" y="170" width="170" height="14" fill="#4B8BDA" opacity="0.7"/>
    <text x="90" y="181" font-size="12" fill="#1E3A5F">C</text>
    <rect x="135" y="195" width="170" height="14" fill="#E89B5C" opacity="0.8"/>
    <text x="90" y="206" font-size="12" fill="#1E3A5F">D</text>
    <rect x="115" y="220" width="170" height="14" fill="#7CB342" opacity="0.8"/>
    <text x="90" y="231" font-size="12" fill="#1E3A5F">G</text>

    <text x="240" y="290" text-anchor="middle" font-size="13" font-weight="bold" fill="#C0392B">→ 三对区间全部重叠，不可识别</text>
  </g>

  <!-- Case B: MiniWoB -->
  <g>
    <rect x="470" y="100" width="380" height="210" rx="10" fill="#EFF6FF" stroke="#4B8BDA" stroke-width="1.5"/>
    <text x="660" y="128" text-anchor="middle" font-size="16" font-weight="bold" fill="#1E3A5F">MiniWoB：区间分离</text>
    <text x="660" y="148" text-anchor="middle" font-size="12" fill="#3D4F65">原始 C ≻ G = D</text>

    <line x1="530" y1="265" x2="830" y2="265" stroke="#B0BEC5" stroke-width="1"/>
    <rect x="700" y="170" width="80" height="14" fill="#4B8BDA" opacity="0.85"/>
    <text x="510" y="181" font-size="12" fill="#1E3A5F">C</text>
    <rect x="600" y="195" width="70" height="14" fill="#E89B5C" opacity="0.85"/>
    <text x="510" y="206" font-size="12" fill="#1E3A5F">D</text>
    <rect x="520" y="220" width="60" height="14" fill="#7CB342" opacity="0.85"/>
    <text x="510" y="231" font-size="12" fill="#1E3A5F">G</text>

    <text x="660" y="290" text-anchor="middle" font-size="13" font-weight="bold" fill="#2E7D32">→ 区间窄而分离，支持 C ≻ D ≻ G</text>
  </g>

  <!-- Bottom verdict -->
  <rect x="170" y="370" width="560" height="160" rx="12" fill="#FFF4E6" stroke="#E89B5C" stroke-width="1.5"/>
  <text x="450" y="402" text-anchor="middle" font-size="16" font-weight="bold" fill="#1E3A5F">这是 support rule，不是显著性检验</text>

  <g font-size="13" fill="#3D4F65">
    <circle cx="215" cy="437" r="5" fill="#2E7D32"/>
    <text x="230" y="442">证据区间分开 → 排序被证据支撑</text>

    <circle cx="215" cy="470" r="5" fill="#C0392B"/>
    <text x="230" y="475">区间重叠 → 不同 Unknown 填法可翻转，不声称方向</text>

    <circle cx="215" cy="503" r="5" fill="#E89B5C"/>
    <text x="230" y="508">「未识别」≠ 平局，而是证据不足以定向</text>
  </g>

  <!-- arrows linking cases to verdict -->
  <path d="M240,310 Q290,345 370,370" stroke="#4B8BDA" stroke-width="1.8" fill="none" marker-end="url(#ar)"/>
  <path d="M660,310 Q610,345 530,370" stroke="#4B8BDA" stroke-width="1.8" fill="none" marker-end="url(#ar)"/>
</svg>