<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4B8BDA"/>
    </marker>
    <marker id="arR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#DC6B5C"/>
    </marker>
  </defs>

  <rect width="900" height="600" fill="#FAF7F2"/>

  <!-- Title -->
  <text x="450" y="44" text-anchor="middle" font-size="24" font-weight="bold" fill="#1E3A5F">PRISM：给 Agent 考场定的五条规矩</text>
  <text x="450" y="70" text-anchor="middle" font-size="14" fill="#3D4F65">少一条，刷分就变成考记忆</text>

  <!-- Center task -->
  <rect x="360" y="255" width="180" height="90" rx="10" fill="#FFF3E0" stroke="#D97706" stroke-width="2"/>
  <text x="450" y="288" text-anchor="middle" font-size="15" font-weight="bold" fill="#1E3A5F">任务</text>
  <text x="450" y="310" text-anchor="middle" font-size="13" fill="#3D4F65">"转 50 元给 Alice"</text>
  <text x="450" y="330" text-anchor="middle" font-size="11" fill="#8B5A2B">必须同时通过 5 关</text>

  <!-- P -->
  <g>
    <rect x="40" y="110" width="220" height="80" rx="10" fill="#EFF6FF" stroke="#4B8BDA" stroke-width="2"/>
    <circle cx="70" cy="150" r="18" fill="#4B8BDA"/>
    <text x="70" y="157" text-anchor="middle" font-size="20" font-weight="bold" fill="#FFFFFF">P</text>
    <text x="98" y="142" font-size="14" font-weight="bold" fill="#1E3A5F">Privileged 判分</text>
    <text x="98" y="164" font-size="11" fill="#3D4F65">查后台 SQL，不靠</text>
    <text x="98" y="180" font-size="11" fill="#3D4F65">截图/LLM 打分</text>
  </g>

  <!-- R -->
  <g>
    <rect x="640" y="110" width="220" height="80" rx="10" fill="#EFF6FF" stroke="#4B8BDA" stroke-width="2"/>
    <circle cx="670" cy="150" r="18" fill="#4B8BDA"/>
    <text x="670" y="157" text-anchor="middle" font-size="20" font-weight="bold" fill="#FFFFFF">R</text>
    <text x="698" y="142" font-size="14" font-weight="bold" fill="#1E3A5F">Realistic 真实应用</text>
    <text x="698" y="164" font-size="11" fill="#3D4F65">不是 toy demo，用</text>
    <text x="698" y="180" font-size="11" fill="#3D4F65">真复杂的 app</text>
  </g>

  <!-- I -->
  <g>
    <rect x="40" y="410" width="220" height="80" rx="10" fill="#FEF2F2" stroke="#DC6B5C" stroke-width="2.5"/>
    <circle cx="70" cy="450" r="18" fill="#DC6B5C"/>
    <text x="70" y="457" text-anchor="middle" font-size="20" font-weight="bold" fill="#FFFFFF">I</text>
    <text x="98" y="442" font-size="14" font-weight="bold" fill="#1E3A5F">Integrity 自检</text>
    <text x="98" y="464" font-size="11" fill="#3D4F65">余额够 50？任务</text>
    <text x="98" y="480" font-size="11" fill="#3D4F65">确实还没完成？</text>
    <text x="255" y="402" text-anchor="end" font-size="10" fill="#DC6B5C" font-style="italic">最常缺失</text>
  </g>

  <!-- S -->
  <g>
    <rect x="340" y="450" width="220" height="80" rx="10" fill="#EFF6FF" stroke="#4B8BDA" stroke-width="2"/>
    <circle cx="370" cy="490" r="18" fill="#4B8BDA"/>
    <text x="370" y="497" text-anchor="middle" font-size="20" font-weight="bold" fill="#FFFFFF">S</text>
    <text x="398" y="482" font-size="14" font-weight="bold" fill="#1E3A5F">Sandboxed 沙盒</text>
    <text x="398" y="504" font-size="11" fill="#3D4F65">自包含，可确定性</text>
    <text x="398" y="520" font-size="11" fill="#3D4F65">reset</text>
  </g>

  <!-- M -->
  <g>
    <rect x="640" y="410" width="220" height="80" rx="10" fill="#FEF2F2" stroke="#DC6B5C" stroke-width="2.5"/>
    <circle cx="670" cy="450" r="18" fill="#DC6B5C"/>
    <text x="670" y="457" text-anchor="middle" font-size="20" font-weight="bold" fill="#FFFFFF">M</text>
    <text x="698" y="442" font-size="14" font-weight="bold" fill="#1E3A5F">Multifactorial 多轴</text>
    <text x="698" y="464" font-size="11" fill="#3D4F65">随机换联系人/主题</text>
    <text x="698" y="480" font-size="11" fill="#3D4F65">/起始页，破固定坐标</text>
    <text x="855" y="402" text-anchor="end" font-size="10" fill="#DC6B5C" font-style="italic">最常缺失</text>
  </g>

  <!-- arrows from each rule pointing to center -->
  <line x1="260" y1="175" x2="362" y2="262" stroke="#4B8BDA" stroke-width="2" marker-end="url(#ar)"/>
  <line x1="640" y1="175" x2="538" y2="262" stroke="#4B8BDA" stroke-width="2" marker-end="url(#ar)"/>
  <line x1="260" y1="425" x2="362" y2="338" stroke="#DC6B5C" stroke-width="2" marker-end="url(#arR)"/>
  <line x1="450" y1="450" x2="450" y2="348" stroke="#4B8BDA" stroke-width="2" marker-end="url(#ar)"/>
  <line x1="640" y1="425" x2="538" y2="338" stroke="#DC6B5C" stroke-width="2" marker-end="url(#arR)"/>

  <!-- bottom note -->
  <rect x="160" y="555" width="580" height="34" rx="6" fill="#1E3A5F"/>
  <text x="450" y="578" text-anchor="middle" font-size="13" fill="#FAF7F2">作者审视 10 个主流 CUA 基准：没有一个 5 条全部满足</text>
</svg>