<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 600" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4B8BDA"/>
    </marker>
  </defs>

  <rect width="820" height="600" fill="#FAF7F2"/>

  <text x="410" y="38" text-anchor="middle" font-size="22" font-weight="bold" fill="#1E3A5F">两轴诊断：分数为何不可信？</text>
  <text x="410" y="60" text-anchor="middle" font-size="13" fill="#3D4F65">Unknown 证据缺失  ×  Benchmark 设计冲突</text>

  <!-- Axes -->
  <line x1="140" y1="500" x2="720" y2="500" stroke="#1E3A5F" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="140" y1="500" x2="140" y2="110" stroke="#1E3A5F" stroke-width="2" marker-end="url(#arr)"/>

  <text x="735" y="497" font-size="13" fill="#1E3A5F" font-weight="bold" text-anchor="middle">Conflicts →</text>
  <text x="735" y="513" font-size="11" fill="#3D4F65" text-anchor="middle">设计算错了</text>

  <text x="180" y="100" font-size="13" fill="#1E3A5F" font-weight="bold" text-anchor="middle">Unknown ↑</text>
  <text x="180" y="116" font-size="11" fill="#3D4F65" text-anchor="middle">证据没留够</text>

  <!-- Quadrant divider lines -->
  <line x1="430" y1="120" x2="430" y2="500" stroke="#C9D4E0" stroke-dasharray="4 4"/>
  <line x1="140" y1="310" x2="720" y2="310" stroke="#C9D4E0" stroke-dasharray="4 4"/>

  <!-- Quadrant labels -->
  <text x="285" y="478" text-anchor="middle" font-size="11" fill="#8AA0B5" font-style="italic">低 / 低</text>
  <text x="575" y="478" text-anchor="middle" font-size="11" fill="#8AA0B5" font-style="italic">低 Unknown / 高冲突</text>
  <text x="285" y="335" text-anchor="middle" font-size="11" fill="#8AA0B5" font-style="italic">高 Unknown / 低冲突</text>
  <text x="575" y="335" text-anchor="middle" font-size="11" fill="#8AA0B5" font-style="italic">两头都坏</text>

  <!-- AppWorld: low/low -->
  <g>
    <circle cx="240" cy="430" r="46" fill="#DCEBDA" stroke="#5B9A6E" stroke-width="2"/>
    <text x="240" y="428" text-anchor="middle" font-size="14" font-weight="bold" fill="#1E3A5F">AppWorld</text>
    <text x="240" y="448" text-anchor="middle" font-size="11" fill="#3D4F65">双低 ✓</text>
  </g>

  <!-- τ3-retail -->
  <g>
    <circle cx="600" cy="420" r="52" fill="#FCE4D0" stroke="#D98B4A" stroke-width="2"/>
    <text x="600" y="414" text-anchor="middle" font-size="14" font-weight="bold" fill="#1E3A5F">τ3-retail</text>
    <text x="600" y="434" text-anchor="middle" font-size="10" fill="#3D4F65">24 处 reward/action 冲突</text>
  </g>

  <!-- AndroidWorld -->
  <g>
    <circle cx="285" cy="215" r="54" fill="#E0E8F5" stroke="#4B8BDA" stroke-width="2"/>
    <text x="285" y="210" text-anchor="middle" font-size="14" font-weight="bold" fill="#1E3A5F">AndroidWorld</text>
    <text x="285" y="230" text-anchor="middle" font-size="10" fill="#3D4F65">mobile post-state 缺失</text>
  </g>

  <!-- MiniWoB -->
  <g>
    <circle cx="455" cy="265" r="44" fill="#F1E0EC" stroke="#A86B92" stroke-width="2"/>
    <text x="455" y="263" text-anchor="middle" font-size="13" font-weight="bold" fill="#1E3A5F">MiniWoB</text>
    <text x="455" y="280" text-anchor="middle" font-size="10" fill="#3D4F65">shortcut/proxy</text>
  </g>

  <!-- AgentDojo -->
  <g>
    <circle cx="615" cy="200" r="54" fill="#F5D5D5" stroke="#C25656" stroke-width="2"/>
    <text x="615" y="195" text-anchor="middle" font-size="14" font-weight="bold" fill="#1E3A5F">AgentDojo</text>
    <text x="615" y="215" text-anchor="middle" font-size="10" fill="#3D4F65">两类毛病都有 ✗</text>
  </g>

  <!-- Bottom legend / takeaway -->
  <rect x="140" y="538" width="580" height="48" rx="6" fill="#EFF6FF" stroke="#4B8BDA"/>
  <text x="158" y="560" font-size="12" fill="#1E3A5F" font-weight="bold">修法不同：</text>
  <text x="232" y="560" font-size="12" fill="#3D4F65">↑ 留更多 artifact　　→ 修任务/评测器</text>
  <text x="158" y="578" font-size="11" fill="#3D4F65" font-style="italic">同样的"低分可信度"，原因和修复方向完全不同。</text>
</svg>