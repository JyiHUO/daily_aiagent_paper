<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 560" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4B8BDA"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="440" y="38" text-anchor="middle" font-size="22" font-weight="700" fill="#1E3A5F">证据支撑的分数区间</text>
  <text x="440" y="62" text-anchor="middle" font-size="13" fill="#3D4F65">不再纠结 Unknown，给出最坏 / 最好两端</text>

  <!-- Three buckets -->
  <g>
    <rect x="80" y="90" width="200" height="90" rx="10" fill="#E6F4EA" stroke="#4FA86B" stroke-width="2"/>
    <text x="180" y="120" text-anchor="middle" font-size="16" font-weight="700" fill="#1E3A5F">P  通过 ✓</text>
    <text x="180" y="148" text-anchor="middle" font-size="13" fill="#3D4F65">证据足够</text>
    <text x="180" y="168" text-anchor="middle" font-size="13" fill="#3D4F65">71 条</text>

    <rect x="340" y="90" width="200" height="90" rx="10" fill="#FDECEC" stroke="#D9534F" stroke-width="2"/>
    <text x="440" y="120" text-anchor="middle" font-size="16" font-weight="700" fill="#1E3A5F">F  失败 ✗</text>
    <text x="440" y="148" text-anchor="middle" font-size="13" fill="#3D4F65">证据反驳</text>
    <text x="440" y="168" text-anchor="middle" font-size="13" fill="#3D4F65">8 条</text>

    <rect x="600" y="90" width="200" height="90" rx="10" fill="#FFF6DC" stroke="#D4A017" stroke-width="2"/>
    <text x="700" y="120" text-anchor="middle" font-size="16" font-weight="700" fill="#1E3A5F">U  未知 ?</text>
    <text x="700" y="148" text-anchor="middle" font-size="13" fill="#3D4F65">证据缺失</text>
    <text x="700" y="168" text-anchor="middle" font-size="13" fill="#3D4F65">21 条</text>
  </g>

  <!-- arrows down to interval bar -->
  <line x1="180" y1="182" x2="155" y2="278" stroke="#4B8BDA" stroke-width="2" marker-end="url(#ar)"/>
  <line x1="700" y1="182" x2="725" y2="278" stroke="#4B8BDA" stroke-width="2" marker-end="url(#ar)"/>
  <text x="200" y="230" font-size="12" fill="#3D4F65">最坏：U 全算错 → 下界</text>
  <text x="680" y="230" text-anchor="end" font-size="12" fill="#3D4F65">最好：U 全算对 → 上界</text>

  <!-- Interval bar -->
  <g transform="translate(140,300)">
    <rect x="0" y="0" width="600" height="38" rx="6" fill="#EFF6FF" stroke="#4B8BDA"/>
    <rect x="0" y="0" width="427" height="38" rx="6" fill="#CDE3F8" stroke="none"/>
    <rect x="427" y="0" width="126" height="38" fill="#FFE9A8" stroke="none"/>
    <line x1="427" y1="-8" x2="427" y2="46" stroke="#1E3A5F" stroke-width="2"/>
    <line x1="553" y1="-8" x2="553" y2="46" stroke="#1E3A5F" stroke-width="2"/>
    <text x="427" y="-14" text-anchor="middle" font-size="13" font-weight="700" fill="#1E3A5F">71% (P/N)</text>
    <text x="553" y="-14" text-anchor="middle" font-size="13" font-weight="700" fill="#1E3A5F">92% ((P+U)/N)</text>
    <text x="213" y="24" text-anchor="middle" font-size="12" fill="#1E3A5F">P 已证实</text>
    <text x="490" y="24" text-anchor="middle" font-size="12" fill="#1E3A5F">U 不确定带 = 21%</text>
  </g>

  <!-- Example callout -->
  <rect x="140" y="400" width="600" height="120" rx="10" fill="#EFF6FF" stroke="#4B8BDA" stroke-width="1.5"/>
  <text x="160" y="428" font-size="14" font-weight="700" fill="#1E3A5F">例：AgentDojo · Claude 4.7</text>
  <text x="160" y="455" font-size="13" fill="#3D4F65">原始报告分数：<tspan font-weight="700" fill="#D9534F">93%</tspan>（单点，掩盖证据缺口）</text>
  <text x="160" y="478" font-size="13" fill="#3D4F65">证据区间：<tspan font-weight="700" fill="#1E3A5F">(71%, 92%)</tspan> → 区间宽 = benchmark 该补 artifact</text>
  <text x="160" y="501" font-size="12" fill="#3D4F65" font-style="italic">区间窄 = 分数有据；区间宽 = 评测留证不足，而非模型差</text>
</svg>