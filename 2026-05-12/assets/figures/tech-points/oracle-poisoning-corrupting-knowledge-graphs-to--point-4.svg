<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4B8BDA"/>
    </marker>
    <marker id="arRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#C0504D"/>
    </marker>
  </defs>

  <rect width="900" height="560" fill="#FAFBFD"/>

  <text x="450" y="38" text-anchor="middle" font-size="22" font-weight="700" fill="#1E3A5F">单工具盲信 vs 多工具交叉验证</text>
  <text x="450" y="62" text-anchor="middle" font-size="13" fill="#3D4F65">改 prompt 没用 · 给历史快照没用 · 加一个独立数据源才有效</text>

  <!-- LEFT: single tool -->
  <rect x="40" y="90" width="380" height="430" rx="14" fill="#FBEFEF" stroke="#C0504D" stroke-width="1.5"/>
  <text x="230" y="118" text-anchor="middle" font-size="16" font-weight="700" fill="#7A2E2A">单一图谱工具</text>
  <text x="230" y="138" text-anchor="middle" font-size="12" fill="#7A2E2A">100% 盲信被污染数据</text>

  <!-- Agent left -->
  <rect x="155" y="160" width="150" height="56" rx="10" fill="#FFFFFF" stroke="#C0504D" stroke-width="1.5"/>
  <text x="230" y="185" text-anchor="middle" font-size="14" font-weight="600" fill="#1E3A5F">AI Agent</text>
  <text x="230" y="204" text-anchor="middle" font-size="11" fill="#3D4F65">"sanitizer 是否存在?"</text>

  <!-- KG poisoned -->
  <rect x="105" y="280" width="250" height="90" rx="10" fill="#F4D6D4" stroke="#C0504D" stroke-width="1.5"/>
  <text x="230" y="308" text-anchor="middle" font-size="13" font-weight="700" fill="#7A2E2A">知识图谱 (被投毒)</text>
  <text x="230" y="330" text-anchor="middle" font-size="11" fill="#3D4F65">parameterized = true ✗</text>
  <text x="230" y="350" text-anchor="middle" font-size="11" fill="#3D4F65">3 / 4200 万节点被改</text>

  <path d="M240,216 L240,278" stroke="#4B8BDA" stroke-width="2" fill="none" marker-end="url(#ar)"/>
  <path d="M220,278 L220,218" stroke="#C0504D" stroke-width="2" fill="none" marker-end="url(#arRed)" stroke-dasharray="5,3"/>
  <text x="270" y="252" font-size="10" fill="#7A2E2A">假数据</text>

  <!-- conclusion -->
  <rect x="80" y="420" width="300" height="74" rx="10" fill="#FFFFFF" stroke="#C0504D" stroke-width="1.5"/>
  <text x="230" y="447" text-anchor="middle" font-size="13" font-weight="700" fill="#7A2E2A">✗ "漏洞已缓解"</text>
  <text x="230" y="470" text-anchor="middle" font-size="11" fill="#3D4F65">推理正确，但前提是假的</text>
  <text x="230" y="486" text-anchor="middle" font-size="11" fill="#3D4F65">9 个主流模型全部上当</text>
  <path d="M230,370 L230,418" stroke="#C0504D" stroke-width="2" fill="none" marker-end="url(#arRed)"/>

  <!-- RIGHT: multi-tool -->
  <rect x="480" y="90" width="380" height="430" rx="14" fill="#EFF6FF" stroke="#4B8BDA" stroke-width="1.5"/>
  <text x="670" y="118" text-anchor="middle" font-size="16" font-weight="700" fill="#1E3A5F">+ 源码搜索工具</text>
  <text x="670" y="138" text-anchor="middle" font-size="12" fill="#1E3A5F">Claude / Gemini 盲信率 → 0%</text>

  <rect x="595" y="160" width="150" height="56" rx="10" fill="#FFFFFF" stroke="#4B8BDA" stroke-width="1.5"/>
  <text x="670" y="185" text-anchor="middle" font-size="14" font-weight="600" fill="#1E3A5F">AI Agent</text>
  <text x="670" y="204" text-anchor="middle" font-size="11" fill="#3D4F65">同一问题 · 问两边</text>

  <!-- KG -->
  <rect x="500" y="270" width="150" height="80" rx="10" fill="#F4D6D4" stroke="#C0504D" stroke-width="1.5"/>
  <text x="575" y="298" text-anchor="middle" font-size="12" font-weight="700" fill="#7A2E2A">图谱 (被投毒)</text>
  <text x="575" y="320" text-anchor="middle" font-size="11" fill="#3D4F65">"sanitizer 存在"</text>
  <text x="575" y="338" text-anchor="middle" font-size="11" fill="#3D4F65">parameterized=true</text>

  <!-- Source -->
  <rect x="690" y="270" width="150" height="80" rx="10" fill="#E5F2E0" stroke="#5B9A4F" stroke-width="1.5"/>
  <text x="765" y="298" text-anchor="middle" font-size="12" font-weight="700" fill="#2F5A24">源码 (独立)</text>
  <text x="765" y="320" text-anchor="middle" font-size="11" fill="#3D4F65">grep: not found</text>
  <text x="765" y="338" text-anchor="middle" font-size="11" fill="#3D4F65">函数根本不存在</text>

  <path d="M625,216 L585,268" stroke="#4B8BDA" stroke-width="2" fill="none" marker-end="url(#ar)"/>
  <path d="M715,216 L755,268" stroke="#4B8BDA" stroke-width="2" fill="none" marker-end="url(#ar)"/>

  <!-- conflict -->
  <path d="M650,310 L690,310" stroke="#E89B2C" stroke-width="2.5" stroke-dasharray="4,3"/>
  <text x="670" y="304" text-anchor="middle" font-size="13" fill="#B8731F" font-weight="700">≠</text>

  <!-- conclusion right -->
  <rect x="520" y="400" width="300" height="94" rx="10" fill="#FFFFFF" stroke="#4B8BDA" stroke-width="1.5"/>
  <text x="670" y="427" text-anchor="middle" font-size="13" font-weight="700" fill="#1E3A5F">✓ "两源矛盾，需调查"</text>
  <text x="670" y="450" text-anchor="middle" font-size="11" fill="#3D4F65">10 次试验 9 次主动质疑</text>
  <text x="670" y="470" text-anchor="middle" font-size="11" fill="#3D4F65">架构防御 &gt; prompt 硬化</text>
  <text x="670" y="486" text-anchor="middle" font-size="11" fill="#3D4F65">真正打破 Oracle 盲信</text>

  <path d="M590,350 L645,398" stroke="#4B8BDA" stroke-width="2" fill="none" marker-end="url(#ar)"/>
  <path d="M750,350 L695,398" stroke="#4B8BDA" stroke-width="2" fill="none" marker-end="url(#ar)"/>
</svg>