<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 560" font-family="'Helvetica Neue',Arial,sans-serif">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4B8BDA"/>
    </marker>
  </defs>

  <rect width="880" height="560" fill="#FAF7F2"/>

  <!-- Title -->
  <text x="440" y="42" text-anchor="middle" font-size="22" font-weight="700" fill="#1E3A5F">双层报告：Native 还是 Stronger，分开算分</text>
  <text x="440" y="66" text-anchor="middle" font-size="13" fill="#3D4F65">把 benchmark 自己说要查的，和我们觉得该更严的，分两栏</text>

  <!-- Source hierarchy box -->
  <rect x="60" y="95" width="760" height="70" rx="10" fill="#EFF6FF" stroke="#4B8BDA" stroke-width="1.5"/>
  <text x="80" y="122" font-size="13" font-weight="700" fill="#1E3A5F">Checklist 来源层级（严格按此）</text>
  <text x="80" y="148" font-size="13" fill="#3D4F65">official evaluator  ›  task text / policy  ›  schema</text>
  <text x="540" y="148" font-size="12" fill="#9C6A2A" font-style="italic">超出此范围的要求 → 另算</text>

  <!-- Split arrow -->
  <line x1="440" y1="170" x2="240" y2="218" stroke="#4B8BDA" stroke-width="2" marker-end="url(#ar)"/>
  <line x1="440" y1="170" x2="640" y2="218" stroke="#C97B5A" stroke-width="2" marker-end="url(#ar)"/>

  <!-- Native panel -->
  <rect x="70" y="225" width="340" height="270" rx="12" fill="#E6F0FB" stroke="#4B8BDA" stroke-width="2"/>
  <text x="240" y="258" text-anchor="middle" font-size="17" font-weight="700" fill="#1E3A5F">Native bounds</text>
  <text x="240" y="278" text-anchor="middle" font-size="12" fill="#3D4F65">只问：benchmark 自己的 claim 成立吗？</text>

  <rect x="92" y="298" width="296" height="58" rx="8" fill="#FFFFFF" stroke="#9DBCE0"/>
  <text x="106" y="320" font-size="12" fill="#3D4F65">AppWorld 例子</text>
  <text x="106" y="340" font-size="13" font-weight="600" fill="#1E3A5F">U = 0，无冲突 ✓</text>

  <text x="106" y="380" font-size="12" fill="#3D4F65">• 与原分数同口径</text>
  <text x="106" y="403" font-size="12" fill="#3D4F65">• 给出"原分数支不支持"</text>
  <text x="106" y="426" font-size="12" fill="#3D4F65">• 不引入额外严格度</text>

  <rect x="92" y="448" width="296" height="34" rx="6" fill="#4B8BDA"/>
  <text x="240" y="470" text-anchor="middle" font-size="13" font-weight="700" fill="#FFFFFF">→ 原 claim 完全被支持</text>

  <!-- Stronger panel -->
  <rect x="470" y="225" width="340" height="270" rx="12" fill="#FBEBE2" stroke="#C97B5A" stroke-width="2"/>
  <text x="640" y="258" text-anchor="middle" font-size="17" font-weight="700" fill="#1E3A5F">Stronger-measurement</text>
  <text x="640" y="278" text-anchor="middle" font-size="12" fill="#3D4F65">额外加严：副作用、精确匹配、no-collateral</text>

  <rect x="492" y="298" width="296" height="58" rx="8" fill="#FFFFFF" stroke="#E0B19D"/>
  <text x="506" y="320" font-size="12" fill="#3D4F65">同样 100 个 case</text>
  <text x="506" y="340" font-size="13" font-weight="600" fill="#1E3A5F">40 个 oracle blind spot</text>

  <text x="506" y="380" font-size="12" fill="#3D4F65">• 删文件 → 没列目录证明</text>
  <text x="506" y="403" font-size="12" fill="#3D4F65">• 单独标注、单独报告</text>
  <text x="506" y="426" font-size="12" fill="#3D4F65">• 不污染 native 分数</text>

  <rect x="492" y="448" width="296" height="34" rx="6" fill="#C97B5A"/>
  <text x="640" y="470" text-anchor="middle" font-size="13" font-weight="700" fill="#FFFFFF">→ 仅作"如果更严"的参考</text>

  <!-- Bottom note -->
  <text x="440" y="528" text-anchor="middle" font-size="12.5" fill="#1E3A5F" font-style="italic">两栏分开 ⇒ 既诚实于原 benchmark，又揭示其盲区</text>
</svg>