<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 820" font-family="'Helvetica Neue',Arial,'PingFang SC','Microsoft YaHei',sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F7FAFD"/>
      <stop offset="1" stop-color="#EAF1F8"/>
    </linearGradient>
    <linearGradient id="gAgent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFE8D6"/>
      <stop offset="1" stop-color="#FFD4B8"/>
    </linearGradient>
    <linearGradient id="gRefiner" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#DCE8FB"/>
      <stop offset="1" stop-color="#B9D0F5"/>
    </linearGradient>
    <linearGradient id="gEnv" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#E3F0E2"/>
      <stop offset="1" stop-color="#C7E0C5"/>
    </linearGradient>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4B8BDA"/>
    </marker>
    <marker id="ar2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#E07A4F"/>
    </marker>
    <marker id="ar3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#7A9C5F"/>
    </marker>
  </defs>

  <rect width="1280" height="820" fill="url(#bg)"/>

  <!-- Title -->
  <text x="640" y="48" text-anchor="middle" font-size="26" font-weight="700" fill="#1E3A5F">Continual Harness：不重置环境的 agent 自进化脚手架</text>
  <text x="640" y="74" text-anchor="middle" font-size="14" fill="#3D4F65">同一局游戏内：行动 ↔ 自我精修 ↔ 师生共学，三层闭环让 Gemini 通关 Pokémon</text>

  <!-- ============== ENVIRONMENT (left) ============== -->
  <g>
    <rect x="60" y="120" width="300" height="560" rx="18" fill="url(#gEnv)" stroke="#7A9C5F" stroke-width="1.5"/>
    <text x="210" y="152" text-anchor="middle" font-size="16" font-weight="700" fill="#1E3A5F">长程具身环境</text>
    <text x="210" y="172" text-anchor="middle" font-size="12" fill="#3D4F65">reset-free · 部分可观测</text>

    <!-- minimal interface -->
    <rect x="90" y="195" width="240" height="58" rx="10" fill="#F4FAF3" stroke="#7A9C5F"/>
    <text x="210" y="217" text-anchor="middle" font-size="13" font-weight="600" fill="#1E3A5F">最小接口</text>
    <text x="210" y="237" text-anchor="middle" font-size="11" fill="#3D4F65">原始按键 · 屏幕像素 · 无任何工具</text>

    <!-- single run timeline -->
    <text x="210" y="285" text-anchor="middle" font-size="13" font-weight="700" fill="#1E3A5F">单局轨迹（环境永不重置）</text>
    <line x1="100" y1="310" x2="320" y2="310" stroke="#7A9C5F" stroke-width="2"/>
    <circle cx="100" cy="310" r="5" fill="#7A9C5F"/>
    <circle cx="173" cy="310" r="5" fill="#7A9C5F"/>
    <circle cx="246" cy="310" r="5" fill="#7A9C5F"/>
    <circle cx="320" cy="310" r="5" fill="#E07A4F"/>
    <text x="100" y="332" text-anchor="middle" font-size="10" fill="#3D4F65">出生点</text>
    <text x="173" y="332" text-anchor="middle" font-size="10" fill="#3D4F65">道馆</text>
    <text x="246" y="332" text-anchor="middle" font-size="10" fill="#3D4F65">迷宫</text>
    <text x="320" y="332" text-anchor="middle" font-size="10" fill="#3D4F65">通关</text>

    <!-- milestones -->
    <rect x="90" y="365" width="240" height="135" rx="10" fill="#FFFFFF" stroke="#7A9C5F" stroke-dasharray="3 3"/>
    <text x="210" y="386" text-anchor="middle" font-size="12" font-weight="700" fill="#1E3A5F">真实成果</text>
    <text x="105" y="408" font-size="11" fill="#3D4F65">• Pokémon Blue 通关</text>
    <text x="105" y="428" font-size="11" fill="#3D4F65">• Yellow Legacy 困难模式</text>
    <text x="105" y="448" font-size="11" fill="#3D4F65">• Crystal 零败战通关</text>
    <text x="105" y="468" font-size="11" fill="#3D4F65">• Red / Emerald 自启脚手架</text>
    <text x="105" y="488" font-size="11" fill="#3D4F65">  按键成本较 baseline 降 ~40%</text>

    <!-- contrast with GEPA -->
    <rect x="90" y="520" width="240" height="140" rx="10" fill="#FFF6EE" stroke="#E07A4F"/>
    <text x="210" y="542" text-anchor="middle" font-size="12" font-weight="700" fill="#1E3A5F">对比 GEPA 等方法</text>
    <text x="105" y="565" font-size="11" fill="#3D4F65">传统 prompt 优化：</text>
    <text x="105" y="583" font-size="11" fill="#E07A4F">跑完一局 → 重置 → 重训</text>
    <text x="105" y="610" font-size="11" fill="#3D4F65">Continual Harness：</text>
    <text x="105" y="628" font-size="11" fill="#7A9C5F">同一局内边玩边改，存档即起点</text>
    <text x="105" y="650" font-size="10" fill="#3D4F65" font-style="italic">长程 RPG / 运维 / 机器人皆适用</text>
  </g>

  <!-- ============== AGENT CORE (center) ============== -->
  <g>
    <rect x="420" y="120" width="440" height="560" rx="20" fill="url(#gAgent)" stroke="#E07A4F" stroke-width="1.8"/>
    <text x="640" y="152" text-anchor="middle" font-size="16" font-weight="700" fill="#1E3A5F">Agent ⊕ Harness（同一模型扮演两个角色）</text>

    <!-- ACT side -->
    <rect x="442" y="178" width="180" height="200" rx="12" fill="#FFFFFF" stroke="#E07A4F"/>
    <text x="532" y="202" text-anchor="middle" font-size="13" font-weight="700" fill="#1E3A5F">行动者 Actor</text>
    <text x="532" y="222" text-anchor="middle" font-size="11" fill="#3D4F65">读屏幕 → 决策 → 按键</text>
    <line x1="460" y1="238" x2="604" y2="238" stroke="#E07A4F" stroke-dasharray="2 2"/>
    <text x="532" y="260" text-anchor="middle" font-size="11" fill="#3D4F65">每 F 步触发一次精修</text>
    <rect x="460" y="278" width="144" height="86" rx="8" fill="#FFF6EE" stroke="#E07A4F" stroke-dasharray="3 2"/>
    <text x="532" y="298" text-anchor="middle" font-size="11" font-weight="600" fill="#1E3A5F">轨迹窗口</text>
    <text x="532" y="318" text-anchor="middle" font-size="10" fill="#3D4F65">最近 K 步动作 + 观测</text>
    <text x="532" y="336" text-anchor="middle" font-size="10" fill="#3D4F65">+ 失败模式</text>
    <text x="532" y="354" text-anchor="middle" font-size="10" fill="#E07A4F">（送给 Refiner）</text>

    <!-- REFINE side -->
    <rect x="658" y="178" width="180" height="200" rx="12" fill="#FFFFFF" stroke="#4B8BDA"/>
    <text x="748" y="202" text-anchor="middle" font-size="13" font-weight="700" fill="#1E3A5F">精修者 Refiner</text>
    <text x="748" y="222" text-anchor="middle" font-size="11" fill="#3D4F65">同模型扮演 · CRUD 编辑</text>
    <text x="748" y="246" text-anchor="middle" font-size="11" font-weight="600" fill="#1E3A5F">H_(t+1) = H_t ⊕ Δ</text>

    <rect x="676" y="262" width="144" height="22" rx="5" fill="#EFF6FF" stroke="#4B8BDA"/>
    <text x="748" y="278" text-anchor="middle" font-size="10" fill="#1E3A5F">p · 系统提示</text>
    <rect x="676" y="288" width="144" height="22" rx="5" fill="#EFF6FF" stroke="#4B8BDA"/>
    <text x="748" y="304" text-anchor="middle" font-size="10" fill="#1E3A5F">G · 子代理</text>
    <rect x="676" y="314" width="144" height="22" rx="5" fill="#EFF6FF" stroke="#4B8BDA"/>
    <text x="748" y="330" text-anchor="middle" font-size="10" fill="#1E3A5F">K · 技能库</text>
    <rect x="676" y="340" width="144" height="22" rx="5" fill="#EFF6FF" stroke="#4B8BDA"/>
    <text x="748" y="356" text-anchor="middle" font-size="10" fill="#1E3A5F">M · 长上下文记忆</text>

    <!-- act <-> refine arrows (straightened) -->
    <line x1="622" y1="278" x2="674" y2="278" stroke="#E07A4F" stroke-width="2" marker-end="url(#ar2)"/>
    <text x="648" y="271" text-anchor="middle" font-size="10" fill="#E07A4F">轨迹</text>
    <line x1="674" y1="330" x2="622" y2="330" stroke="#4B8BDA" stroke-width="2" marker-end="url(#ar)"/>
    <text x="648" y="346" text-anchor="middle" font-size="10" fill="#4B8BDA">Δ harness</text>

    <!-- examples / emergent skills -->
    <rect x="442" y="398" width="396" height="138" rx="12" fill="#FFFFFF" stroke="#E07A4F" stroke-dasharray="4 3"/>
    <text x="640" y="420" text-anchor="middle" font-size="13" font-weight="700" fill="#1E3A5F">单局内涌现的自进化产物</text>
    <text x="460" y="442" font-size="11" fill="#3D4F65">▸ press-sequence 技能：把 autopress 漏洞包装成通用工具</text>
    <text x="460" y="462" font-size="11" fill="#3D4F65">▸ Goldenrod 地下道开关谜题 → 真值表写进 notepad</text>
    <text x="460" y="482" font-size="11" fill="#3D4F65">▸ "Operation Zombie Phoenix" 多阶段终战策略</text>
    <text x="460" y="502" font-size="11" fill="#3D4F65">▸ 寻路 path-cost 与 Dijkstra 差距：~50% → 个位数</text>
    <text x="460" y="522" font-size="11" fill="#7A9C5F" font-weight="600">→ 客观可量化地朝最优逼近，无需 episode 重置</text>

    <!-- capability floor -->
    <rect x="442" y="552" width="396" height="110" rx="12" fill="#FFF6EE" stroke="#E07A4F"/>
    <text x="640" y="574" text-anchor="middle" font-size="13" font-weight="700" fill="#1E3A5F">能力地板：自精修不是免费午餐</text>
    <rect x="460" y="588" width="116" height="58" rx="6" fill="#E3F0E2" stroke="#7A9C5F"/>
    <text x="518" y="608" text-anchor="middle" font-size="11" font-weight="600" fill="#1E3A5F">Gemini 3 Pro</text>
    <text x="518" y="624" text-anchor="middle" font-size="10" fill="#3D4F65">100% 里程碑</text>
    <text x="518" y="638" text-anchor="middle" font-size="10" fill="#7A9C5F">成本 ↓ 40%</text>
    <rect x="582" y="588" width="116" height="58" rx="6" fill="#FFF6EE" stroke="#E07A4F"/>
    <text x="640" y="608" text-anchor="middle" font-size="11" font-weight="600" fill="#1E3A5F">Flash</text>
    <text x="640" y="624" text-anchor="middle" font-size="10" fill="#3D4F65">高方差区</text>
    <text x="640" y="638" text-anchor="middle" font-size="10" fill="#E07A4F">不稳定</text>
    <rect x="704" y="588" width="116" height="58" rx="6" fill="#FBE5DC" stroke="#C24D2A"/>
    <text x="762" y="608" text-anchor="middle" font-size="11" font-weight="600" fill="#1E3A5F">Flash-Lite</text>
    <text x="762" y="624" text-anchor="middle" font-size="10" fill="#3D4F65">3–13%</text>
    <text x="762" y="638" text-anchor="middle" font-size="10" fill="#C24D2A">反被拖累</text>
  </g>

  <!-- ============== CO-LEARNING (right) ============== -->
  <g>
    <rect x="920" y="120" width="300" height="560" rx="18" fill="url(#gRefiner)" stroke="#4B8BDA" stroke-width="1.5"/>
    <text x="1070" y="152" text-anchor="middle" font-size="16" font-weight="700" fill="#1E3A5F">在线师生共学闭环</text>
    <text x="1070" y="172" text-anchor="middle" font-size="12" fill="#3D4F65">harness 与模型一起进化</text>

    <!-- student -->
    <rect x="950" y="200" width="240" height="78" rx="10" fill="#FFFFFF" stroke="#4B8BDA"/>
    <text x="1070" y="224" text-anchor="middle" font-size="13" font-weight="700" fill="#1E3A5F">学生 θ_k （开源 Gemma-4）</text>
    <text x="1070" y="244" text-anchor="middle" font-size="11" fill="#3D4F65">在 H_t 中跑 K=256 步</text>
    <text x="1070" y="262" text-anchor="middle" font-size="11" fill="#3D4F65">过程奖励模型给窗口打分</text>

    <!-- arrow down -->
    <line x1="1040" y1="280" x2="1040" y2="310" stroke="#4B8BDA" stroke-width="2" marker-end="url(#ar)"/>
    <text x="1052" y="298" font-size="10" fill="#3D4F65">低奖励片段</text>

    <!-- teacher -->
    <rect x="950" y="312" width="240" height="78" rx="10" fill="#FFFFFF" stroke="#4B8BDA"/>
    <text x="1070" y="336" text-anchor="middle" font-size="13" font-weight="700" fill="#1E3A5F">教师 Gemini 3.1 Pro</text>
    <text x="1070" y="356" text-anchor="middle" font-size="11" fill="#3D4F65">重标轨迹 → 示范答案</text>
    <text x="1070" y="374" text-anchor="middle" font-size="11" fill="#3D4F65">soft SFT 更新策略</text>

    <!-- arrow back: teacher -> student (right side loop) -->
    <path d="M 1100,312 L 1100,300 L 1210,300 L 1210,239 L 1190,239" stroke="#4B8BDA" stroke-width="2" fill="none" marker-end="url(#ar)"/>
    <text x="1218" y="275" text-anchor="middle" font-size="10" fill="#4B8BDA" transform="rotate(90 1218 275)">θ_(k+1)</text>

    <!-- save state -->
    <rect x="950" y="412" width="240" height="78" rx="10" fill="#EFF6FF" stroke="#4B8BDA" stroke-dasharray="4 3"/>
    <text x="1070" y="436" text-anchor="middle" font-size="13" font-weight="700" fill="#1E3A5F">关键设计：存档即起点</text>
    <text x="1070" y="456" text-anchor="middle" font-size="11" fill="#3D4F65">第 k 轮模拟器存档</text>
    <text x="1070" y="474" text-anchor="middle" font-size="11" fill="#7A9C5F">↓ 直接作为第 k+1 轮起点</text>

    <!-- result -->
    <rect x="950" y="510" width="240" height="150" rx="10" fill="#FFFFFF" stroke="#4B8BDA"/>
    <text x="1070" y="532" text-anchor="middle" font-size="13" font-weight="700" fill="#1E3A5F">Pokémon Red 实测</text>
    <line x1="970" y1="558" x2="1170" y2="558" stroke="#CFDCEA" stroke-width="6" stroke-linecap="round"/>
    <line x1="970" y1="558" x2="1130" y2="558" stroke="#7A9C5F" stroke-width="6" stroke-linecap="round"/>
    <text x="970" y="580" font-size="11" fill="#3D4F65">里程碑净进展 +2 ~ +5</text>
    <text x="970" y="602" font-size="11" fill="#3D4F65">训练中环境从未重置</text>
    <text x="970" y="624" font-size="10" fill="#E07A4F">反例：Qwen 27B/35B 无 warm-up</text>
    <text x="970" y="640" font-size="10" fill="#E07A4F">连出生点都走不出 → 非协议工件</text>
  </g>

  <!-- ============== outer-most loop arrows ============== -->
  <!-- env -> agent (act) -->
  <path d="M 360,260 L 420,260" stroke="#7A9C5F" stroke-width="2.4" fill="none" marker-end="url(#ar3)"/>
  <text x="390" y="252" text-anchor="middle" font-size="11" fill="#7A9C5F">观测</text>
  <!-- agent -> env (action) -->
  <path d="M 420,360 L 360,360" stroke="#E07A4F" stroke-width="2.4" fill="none" marker-end="url(#ar2)"/>
  <text x="390" y="378" text-anchor="middle" font-size="11" fill="#E07A4F">按键</text>

  <!-- agent -> co-learning -->
  <path d="M 860,260 L 920,260" stroke="#4B8BDA" stroke-width="2.4" fill="none" marker-end="url(#ar)"/>
  <text x="890" y="252" text-anchor="middle" font-size="11" fill="#4B8BDA">轨迹 + harness</text>
  <!-- co-learning -> agent -->
  <path d="M 920,360 L 860,360" stroke="#4B8BDA" stroke-width="2.4" fill="none" marker-end="url(#ar)"/>
  <text x="890" y="378" text-anchor="middle" font-size="11" fill="#4B8BDA">更新后的 θ</text>

  <!-- bottom caption -->
  <text x="640" y="720" text-anchor="middle" font-size="13" font-weight="700" fill="#1E3A5F">三层闭环同时运转：环境永不重置 · harness 在线自我精修 · 学生模型师生共学</text>
  <text x="640" y="744" text-anchor="middle" font-size="12" fill="#3D4F65">从最小接口出发，agent 自己写工具、写记忆、写策略，越玩越聪明</text>

  <!-- legend -->
  <g transform="translate(440,770)">
    <line x1="0" y1="0" x2="28" y2="0" stroke="#7A9C5F" stroke-width="2.4" marker-end="url(#ar3)"/>
    <text x="36" y="4" font-size="11" fill="#3D4F65">环境信号</text>
    <line x1="130" y1="0" x2="158" y2="0" stroke="#E07A4F" stroke-width="2.4" marker-end="url(#ar2)"/>
    <text x="166" y="4" font-size="11" fill="#3D4F65">行动 / 轨迹</text>
    <line x1="280" y1="0" x2="308" y2="0" stroke="#4B8BDA" stroke-width="2.4" marker-end="url(#ar)"/>
    <text x="316" y="4" font-size="11" fill="#3D4F65">精修 / 模型更新</text>
  </g>
</svg>