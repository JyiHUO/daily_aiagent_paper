<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 760" font-family="-apple-system,Segoe UI,PingFang SC,Microsoft YaHei,sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F7FAFD"/>
      <stop offset="1" stop-color="#EDF2F8"/>
    </linearGradient>
    <linearGradient id="leftG" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FDECEC"/>
      <stop offset="1" stop-color="#FBD9D2"/>
    </linearGradient>
    <linearGradient id="rightG" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#E6F1FB"/>
      <stop offset="1" stop-color="#D4E6F8"/>
    </linearGradient>
    <linearGradient id="prismG" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4B8BDA"/>
      <stop offset="1" stop-color="#2C5C9C"/>
    </linearGradient>
    <marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4B8BDA"/>
    </marker>
  </defs>

  <rect width="1280" height="760" fill="url(#bg)"/>

  <!-- Title -->
  <text x="640" y="48" text-anchor="middle" font-size="26" font-weight="700" fill="#1E3A5F">站在统计悬崖边的 Computer Use Agent 评测</text>
  <text x="640" y="74" text-anchor="middle" font-size="14" fill="#3D4F65">一个不看屏幕的 1MB 重放脚本就能击败前沿模型 — 问题出在环境与统计，而不是模型</text>

  <!-- LEFT: broken benchmark -->
  <g>
    <rect x="40" y="110" width="380" height="560" rx="18" fill="url(#leftG)" stroke="#E0A99B" stroke-width="1.2"/>
    <text x="230" y="140" text-anchor="middle" font-size="16" font-weight="700" fill="#7A2E1F">现状：榜单可被记忆攻破</text>

    <!-- replay agent box -->
    <rect x="70" y="160" width="320" height="86" rx="10" fill="#FFFFFF" stroke="#C8553D" stroke-width="1.4"/>
    <text x="230" y="185" text-anchor="middle" font-size="14" font-weight="700" fill="#7A2E1F">1MB Replay Agent</text>
    <text x="230" y="206" text-anchor="middle" font-size="11.5" fill="#5C3A33">不读截图，盲重放 tap / type 序列</text>
    <text x="230" y="226" text-anchor="middle" font-size="11.5" fill="#5C3A33">数学等价于源模型的 pass@k</text>

    <!-- benchmarks scores -->
    <rect x="70" y="270" width="320" height="44" rx="8" fill="#FFFFFF" stroke="#E5BFB5"/>
    <text x="86" y="297" font-size="12" font-weight="600" fill="#1E3A5F">OSWorld</text>
    <text x="370" y="297" text-anchor="end" font-size="12" font-weight="700" fill="#C8553D">71.1%</text>

    <rect x="70" y="322" width="320" height="44" rx="8" fill="#FFFFFF" stroke="#E5BFB5"/>
    <text x="86" y="349" font-size="12" font-weight="600" fill="#1E3A5F">MobileWorld</text>
    <text x="370" y="349" text-anchor="end" font-size="12" font-weight="700" fill="#C8553D">41.5%</text>

    <text x="230" y="386" text-anchor="middle" font-size="11" fill="#7A2E1F">↑ 均高于源模型本身</text>

    <!-- root causes -->
    <text x="230" y="420" text-anchor="middle" font-size="13" font-weight="700" fill="#7A2E1F">根因：两类方法论硬伤</text>

    <rect x="70" y="436" width="320" height="48" rx="8" fill="#FFFFFF" stroke="#E5BFB5"/>
    <text x="86" y="456" font-size="11.5" font-weight="700" fill="#1E3A5F">① 环境不规范</text>
    <text x="86" y="473" font-size="11.5" fill="#5C3A33">静态初始 · 活线漂移 · LLM 打分不可靠</text>

    <rect x="70" y="494" width="320" height="48" rx="8" fill="#FFFFFF" stroke="#E5BFB5"/>
    <text x="86" y="514" font-size="11.5" font-weight="700" fill="#1E3A5F">② 评测不规范</text>
    <text x="86" y="531" font-size="11.5" fill="#5C3A33">独立硬币假设 · 滥用 pass@k · 忽略嵌套</text>

    <!-- diverging trajectories -->
    <g stroke="#C8553D" stroke-width="1.6" fill="none" opacity="0.75">
      <path d="M85 600 L 380 600"/>
      <path d="M85 600 L 380 625"/>
      <path d="M85 600 L 380 578"/>
      <path d="M85 600 L 380 648"/>
    </g>
    <circle cx="85" cy="600" r="5" fill="#C8553D"/>
    <text x="85" y="588" text-anchor="middle" font-size="10.5" fill="#7A2E1F">同一任务</text>
    <text x="230" y="668" text-anchor="middle" font-size="11" fill="#7A2E1F">分数发散 · CI 被低估 · 误判模型优劣</text>
  </g>

  <!-- CENTER: PRISM prism -->
  <g>
    <text x="640" y="142" text-anchor="middle" font-size="15" font-weight="700" fill="#1E3A5F">PRISM 五原则</text>

    <!-- prism shape -->
    <polygon points="640,170 760,310 700,470 580,470 520,310" fill="url(#prismG)" opacity="0.92"/>
    <polygon points="640,170 760,310 700,470 580,470 520,310" fill="none" stroke="#1E3A5F" stroke-width="1.2"/>

    <g font-size="11" fill="#FFFFFF" font-weight="600" text-anchor="middle">
      <text x="640" y="220">P  Privileged</text>
      <text x="640" y="234" font-size="10" font-weight="400" opacity="0.9">查后台 DB 而非截图</text>

      <text x="585" y="290">R  Realistic</text>
      <text x="585" y="304" font-size="10" font-weight="400" opacity="0.9">真实复杂应用</text>

      <text x="695" y="290">I  Integrity</text>
      <text x="695" y="304" font-size="10" font-weight="400" opacity="0.9">配置自检非平凡</text>

      <text x="585" y="360">S  Sandboxed</text>
      <text x="585" y="374" font-size="10" font-weight="400" opacity="0.9">确定性 reset</text>

      <text x="695" y="360">M  Multifactorial</text>
      <text x="695" y="374" font-size="10" font-weight="400" opacity="0.9">多轴独立扰动</text>
    </g>

    <text x="640" y="430" text-anchor="middle" font-size="11" fill="#FFFFFF" opacity="0.95">10 个主流基准 · 无一全部满足</text>
    <text x="640" y="448" text-anchor="middle" font-size="11" fill="#FFFFFF" opacity="0.95">最常缺：Integrity &amp; Multifactorial</text>

    <!-- arrows from left to prism -->
    <path d="M420 380 L 515 360" stroke="#4B8BDA" stroke-width="1.8" fill="none" marker-end="url(#arrR)"/>
    <text x="468" y="370" text-anchor="middle" font-size="10.5" fill="#1E3A5F">用原则修复</text>

    <!-- arrow prism to right -->
    <path d="M765 360 L 860 380" stroke="#4B8BDA" stroke-width="1.8" fill="none" marker-end="url(#arrR)"/>
    <text x="812" y="370" text-anchor="middle" font-size="10.5" fill="#1E3A5F">实例化落地</text>

    <!-- DigiWorld + Stats below prism -->
    <rect x="475" y="505" width="330" height="78" rx="10" fill="#FFFFFF" stroke="#4B8BDA" stroke-width="1.3"/>
    <text x="640" y="528" text-anchor="middle" font-size="13" font-weight="700" fill="#1E3A5F">DigiWorld</text>
    <text x="640" y="548" text-anchor="middle" font-size="11" fill="#3D4F65">15 应用 · 387 场景 · 4300+ 任务</text>
    <text x="640" y="565" text-anchor="middle" font-size="11" fill="#3D4F65">数据 × 主题 × UI × 参数 = 3.2M 配置</text>
    <text x="640" y="580" text-anchor="middle" font-size="10.5" fill="#C8553D" font-weight="600">重放脚本：70% → 6.9%</text>

    <rect x="475" y="595" width="330" height="75" rx="10" fill="#FFFFFF" stroke="#4B8BDA" stroke-width="1.3"/>
    <text x="640" y="618" text-anchor="middle" font-size="13" font-weight="700" fill="#1E3A5F">分层 Bootstrap + Wilson CI</text>
    <text x="640" y="638" text-anchor="middle" font-size="11" fill="#3D4F65">scenario → 配置轴 → rollout 逐层重采</text>
    <text x="640" y="655" text-anchor="middle" font-size="10.5" fill="#3D4F65">覆盖率：17% → 56% → <tspan font-weight="700" fill="#2C7A4B">95%</tspan></text>
  </g>

  <!-- RIGHT: principled evaluation -->
  <g>
    <rect x="860" y="110" width="380" height="560" rx="18" fill="url(#rightG)" stroke="#9DBDE0" stroke-width="1.2"/>
    <text x="1050" y="140" text-anchor="middle" font-size="16" font-weight="700" fill="#1E3A5F">愿景：可靠的 CUA 评测</text>

    <!-- multifactorial axes -->
    <rect x="890" y="160" width="320" height="120" rx="10" fill="#FFFFFF" stroke="#9DBDE0"/>
    <text x="1050" y="183" text-anchor="middle" font-size="13" font-weight="700" fill="#1E3A5F">每次评测 · 多轴随机化</text>
    <g font-size="11" fill="#3D4F65">
      <text x="906" y="208">· 数据 profile</text>
      <text x="906" y="228">· 主题 / 配色</text>
      <text x="906" y="248">· UI 初始状态</text>
      <text x="906" y="268">· 实例参数</text>
      <text x="1100" y="208" fill="#4B8BDA">~10</text>
      <text x="1100" y="228" fill="#4B8BDA">~10</text>
      <text x="1100" y="248" fill="#4B8BDA">~10</text>
      <text x="1100" y="268" fill="#4B8BDA">×</text>
    </g>

    <!-- privileged verification -->
    <rect x="890" y="296" width="320" height="76" rx="10" fill="#FFFFFF" stroke="#9DBDE0"/>
    <text x="1050" y="319" text-anchor="middle" font-size="13" font-weight="700" fill="#1E3A5F">特权验证</text>
    <text x="1050" y="340" text-anchor="middle" font-size="11" fill="#3D4F65">SQL 直查应用真实状态</text>
    <text x="1050" y="358" text-anchor="middle" font-size="11" fill="#3D4F65">不靠截图 · 不靠 LLM judge</text>

    <!-- convergent trajectories -->
    <rect x="890" y="388" width="320" height="170" rx="10" fill="#FFFFFF" stroke="#9DBDE0"/>
    <text x="1050" y="410" text-anchor="middle" font-size="13" font-weight="700" fill="#1E3A5F">分数收敛 · 决策可信</text>

    <g stroke="#4B8BDA" stroke-width="1.6" fill="none" opacity="0.85">
      <path d="M915 510 L 1180 478"/>
      <path d="M915 510 L 1180 482"/>
      <path d="M915 510 L 1180 486"/>
      <path d="M915 510 L 1180 490"/>
    </g>
    <circle cx="915" cy="510" r="5" fill="#4B8BDA"/>
    <text x="915" y="500" text-anchor="middle" font-size="10" fill="#1E3A5F">同一任务</text>

    <!-- CI bar -->
    <line x1="1180" y1="468" x2="1180" y2="500" stroke="#1E3A5F" stroke-width="1.4"/>
    <line x1="1174" y1="468" x2="1186" y2="468" stroke="#1E3A5F" stroke-width="1.4"/>
    <line x1="1174" y1="500" x2="1186" y2="500" stroke="#1E3A5F" stroke-width="1.4"/>
    <circle cx="1180" cy="484" r="3.5" fill="#1E3A5F"/>
    <text x="1180" y="540" text-anchor="middle" font-size="10.5" fill="#1E3A5F">真实 CI</text>

    <text x="1050" y="582" text-anchor="middle" font-size="11" fill="#3D4F65">部署遗憾 9.8% → 6.0%</text>

    <!-- bottom takeaway -->
    <rect x="890" y="595" width="320" height="61" rx="10" fill="#1E3A5F"/>
    <text x="1050" y="618" text-anchor="middle" font-size="12" font-weight="700" fill="#FFFFFF">规范的环境 + 严谨的统计</text>
    <text x="1050" y="640" text-anchor="middle" font-size="11" fill="#D4E6F8">是 CUA 研究的前置条件，而非可选优化</text>
  </g>

  <!-- footer hint -->
  <text x="640" y="720" text-anchor="middle" font-size="11" fill="#3D4F65" opacity="0.85">从「记忆作弊也能登顶」到「换一批场景仍然稳」 · Meta Superintelligence Labs</text>
</svg>