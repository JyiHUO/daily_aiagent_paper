<svg xmlns="http://www.w3.org/2000/svg" width="720" height="480" viewBox="0 0 720 480">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4B8BDA"/>
    </marker>
    <marker id="arrRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#C85A5A"/>
    </marker>
  </defs>

  <text x="360" y="38" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC','Hiragino Sans GB',sans-serif" font-size="20" font-weight="700" fill="#1E3A5F">分布式 Agent 攻击：分而治之 + 伪装</text>

  <!-- Orchestrator -->
  <ellipse cx="360" cy="115" rx="135" ry="40" fill="#FEF3E7" stroke="#E8A857" stroke-width="2"/>
  <text x="360" y="110" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC','Hiragino Sans GB',sans-serif" font-size="15" font-weight="700" fill="#1E3A5F">协调者 (掌握完整入侵任务)</text>
  <text x="360" y="132" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC','Hiragino Sans GB',sans-serif" font-size="11" fill="#3D4F65">伪装为普通工程任务下发</text>

  <!-- Three sub-agents -->
  <g>
    <rect x="50" y="240" width="170" height="90" rx="8" fill="#EFF6FF" stroke="#4B8BDA" stroke-width="1.5"/>
    <text x="135" y="268" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC','Hiragino Sans GB',sans-serif" font-size="13" font-weight="600" fill="#1E3A5F">子Agent A</text>
    <text x="135" y="292" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC','Hiragino Sans GB',sans-serif" font-size="11" fill="#3D4F65">"扫描网络"</text>
    <text x="135" y="313" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC','Hiragino Sans GB',sans-serif" font-size="10" fill="#7A8AA0">单看合规</text>
  </g>

  <g>
    <rect x="275" y="240" width="170" height="90" rx="8" fill="#EFF6FF" stroke="#4B8BDA" stroke-width="1.5"/>
    <text x="360" y="268" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC','Hiragino Sans GB',sans-serif" font-size="13" font-weight="600" fill="#1E3A5F">子Agent B</text>
    <text x="360" y="292" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC','Hiragino Sans GB',sans-serif" font-size="11" fill="#3D4F65">"检查凭证"</text>
    <text x="360" y="313" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC','Hiragino Sans GB',sans-serif" font-size="10" fill="#7A8AA0">单看合规</text>
  </g>

  <g>
    <rect x="500" y="240" width="170" height="90" rx="8" fill="#EFF6FF" stroke="#4B8BDA" stroke-width="1.5"/>
    <text x="585" y="268" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC','Hiragino Sans GB',sans-serif" font-size="13" font-weight="600" fill="#1E3A5F">子Agent C</text>
    <text x="585" y="292" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC','Hiragino Sans GB',sans-serif" font-size="11" fill="#3D4F65">"读取文件"</text>
    <text x="585" y="313" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC','Hiragino Sans GB',sans-serif" font-size="10" fill="#7A8AA0">单看合规</text>
  </g>

  <!-- Arrows orchestrator -> subagents -->
  <line x1="270" y1="148" x2="160" y2="236" stroke="#4B8BDA" stroke-width="1.8" marker-end="url(#arr)"/>
  <line x1="360" y1="156" x2="360" y2="236" stroke="#4B8BDA" stroke-width="1.8" marker-end="url(#arr)"/>
  <line x1="450" y1="148" x2="560" y2="236" stroke="#4B8BDA" stroke-width="1.8" marker-end="url(#arr)"/>

  <!-- Bottom result -->
  <rect x="140" y="395" width="440" height="60" rx="6" fill="#FBE9E9" stroke="#C85A5A" stroke-width="1.5" stroke-dasharray="5,3"/>
  <text x="360" y="418" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC','Hiragino Sans GB',sans-serif" font-size="14" font-weight="700" fill="#1E3A5F">共享数据库汇总 = 完整渗透</text>
  <text x="360" y="440" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC','Hiragino Sans GB',sans-serif" font-size="11" fill="#3D4F65">标准监控捕获率仅 ~20%（顺序拆分攻击则几乎全抓）</text>

  <line x1="135" y1="332" x2="240" y2="393" stroke="#C85A5A" stroke-width="1.3" stroke-dasharray="4,3" marker-end="url(#arrRed)"/>
  <line x1="360" y1="332" x2="360" y2="393" stroke="#C85A5A" stroke-width="1.3" stroke-dasharray="4,3" marker-end="url(#arrRed)"/>
  <line x1="585" y1="332" x2="480" y2="393" stroke="#C85A5A" stroke-width="1.3" stroke-dasharray="4,3" marker-end="url(#arrRed)"/>
</svg>