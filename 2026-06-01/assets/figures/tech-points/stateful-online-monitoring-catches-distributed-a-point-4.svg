<svg xmlns="http://www.w3.org/2000/svg" width="720" height="480" viewBox="0 0 720 480">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4B8BDA"/>
    </marker>
  </defs>

  <text x="360" y="40" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC','Hiragino Sans GB',sans-serif" font-size="20" font-weight="700" fill="#1E3A5F">跨账号聚类：意外的越狱拦截器</text>

  <!-- Left: scattered attempts (different accounts) -->
  <g font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC','Hiragino Sans GB',sans-serif">
    <text x="135" y="92" text-anchor="middle" font-size="13" fill="#3D4F65">不同账号·改写措辞</text>

    <circle cx="65"  cy="140" r="22" fill="#FCE7E7" stroke="#C9665E" stroke-width="1.5"/>
    <text x="65" y="144" text-anchor="middle" font-size="11" fill="#1E3A5F">变体A</text>

    <circle cx="140" cy="118" r="22" fill="#FCE7E7" stroke="#C9665E" stroke-width="1.5"/>
    <text x="140" y="122" text-anchor="middle" font-size="11" fill="#1E3A5F">变体B</text>

    <circle cx="215" cy="150" r="22" fill="#FCE7E7" stroke="#C9665E" stroke-width="1.5"/>
    <text x="215" y="154" text-anchor="middle" font-size="11" fill="#1E3A5F">变体C</text>

    <circle cx="85"  cy="210" r="22" fill="#FCE7E7" stroke="#C9665E" stroke-width="1.5"/>
    <text x="85" y="214" text-anchor="middle" font-size="11" fill="#1E3A5F">变体D</text>

    <circle cx="185" cy="220" r="22" fill="#FCE7E7" stroke="#C9665E" stroke-width="1.5"/>
    <text x="185" y="224" text-anchor="middle" font-size="11" fill="#1E3A5F">变体E</text>

    <text x="135" y="280" text-anchor="middle" font-size="12" fill="#8B5A4A" font-style="italic">单看：每个都放过</text>
  </g>

  <!-- Arrow to cluster -->
  <line x1="255" y1="170" x2="368" y2="170" stroke="#4B8BDA" stroke-width="2.5" marker-end="url(#arr)"/>
  <text x="312" y="160" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC','Hiragino Sans GB',sans-serif" font-size="12" fill="#3D4F65">语义聚合</text>

  <!-- Center: cluster lens -->
  <g>
    <ellipse cx="450" cy="170" rx="80" ry="68" fill="#EFF6FF" stroke="#4B8BDA" stroke-width="2"/>
    <circle cx="430" cy="155" r="9" fill="#C9665E"/>
    <circle cx="465" cy="148" r="9" fill="#C9665E"/>
    <circle cx="445" cy="180" r="9" fill="#C9665E"/>
    <circle cx="475" cy="185" r="9" fill="#C9665E"/>
    <circle cx="420" cy="190" r="9" fill="#C9665E"/>
    <text x="450" y="260" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC','Hiragino Sans GB',sans-serif" font-size="13" font-weight="600" fill="#1E3A5F">同一簇 Gt</text>
  </g>

  <!-- Arrow to block -->
  <line x1="532" y1="170" x2="613" y2="170" stroke="#4B8BDA" stroke-width="2.5" marker-end="url(#arr)"/>

  <!-- Right: blocked -->
  <g>
    <rect x="615" y="135" width="90" height="70" rx="6" fill="#FFF4E6" stroke="#D89B4A" stroke-width="2"/>
    <text x="660" y="165" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC','Hiragino Sans GB',sans-serif" font-size="14" font-weight="700" fill="#1E3A5F">拦截</text>
    <text x="660" y="187" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC','Hiragino Sans GB',sans-serif" font-size="12" fill="#3D4F65">整体意图</text>
  </g>

  <!-- Bottom insight box -->
  <g font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC','Hiragino Sans GB',sans-serif">
    <rect x="80" y="345" width="560" height="100" rx="10" fill="#EFF6FF" stroke="#4B8BDA" stroke-width="1.5"/>
    <text x="360" y="375" text-anchor="middle" font-size="14" font-weight="700" fill="#1E3A5F">意外收益</text>
    <text x="360" y="402" text-anchor="middle" font-size="13" fill="#3D4F65">为分布式 Agent 攻击设计的跨会话监控，</text>
    <text x="360" y="424" text-anchor="middle" font-size="13" fill="#3D4F65">同时拦截了人类越狱者的反复改写尝试</text>
  </g>
</svg>