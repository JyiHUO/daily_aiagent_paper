<svg xmlns="http://www.w3.org/2000/svg" width="720" height="480" viewBox="0 0 720 480">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4B8BDA"/>
    </marker>
  </defs>

  <text x="360" y="34" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC','Hiragino Sans GB',sans-serif" font-size="20" font-weight="600" fill="#1E3A5F">共享决策地形</text>
  <text x="360" y="56" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC','Hiragino Sans GB',sans-serif" font-size="12" fill="#3D4F65">不同模型在同一张图上走不同路径</text>

  <!-- Left: separate trajectories -->
  <text x="130" y="100" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC','Hiragino Sans GB',sans-serif" font-size="13" font-weight="600" fill="#1E3A5F">独立轨迹（无法比较）</text>

  <g stroke-width="2" fill="none">
    <path d="M40,150 L200,150" stroke="#D97757" stroke-dasharray="4,3"/>
    <path d="M40,195 L200,195" stroke="#4B8BDA" stroke-dasharray="4,3"/>
    <path d="M40,240 L200,240" stroke="#7BA89F" stroke-dasharray="4,3"/>
  </g>
  <circle cx="40" cy="150" r="4" fill="#D97757"/><circle cx="200" cy="150" r="4" fill="#D97757"/>
  <circle cx="40" cy="195" r="4" fill="#4B8BDA"/><circle cx="200" cy="195" r="4" fill="#4B8BDA"/>
  <circle cx="40" cy="240" r="4" fill="#7BA89F"/><circle cx="200" cy="240" r="4" fill="#7BA89F"/>

  <text x="210" y="154" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC','Hiragino Sans GB',sans-serif" font-size="11" fill="#D97757">DeepSeek</text>
  <text x="210" y="199" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC','Hiragino Sans GB',sans-serif" font-size="11" fill="#4B8BDA">Gemini</text>
  <text x="210" y="244" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC','Hiragino Sans GB',sans-serif" font-size="11" fill="#7BA89F">Qwen</text>

  <!-- Arrow: pool by observable keys -->
  <line x1="290" y1="200" x2="395" y2="220" stroke="#4B8BDA" stroke-width="2.5" marker-end="url(#arr)"/>
  <text x="342" y="186" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC','Hiragino Sans GB',sans-serif" font-size="11" fill="#1E3A5F">IDF-Jaccard + mutual-kNN</text>
  <text x="342" y="232" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC','Hiragino Sans GB',sans-serif" font-size="11" fill="#3D4F65">→ BCC 分块</text>

  <!-- Right: shared landscape with BCC blocks -->
  <text x="540" y="100" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC','Hiragino Sans GB',sans-serif" font-size="13" font-weight="600" fill="#1E3A5F">共享地形（BCC 分块）</text>

  <!-- BCC region B0 -->
  <ellipse cx="490" cy="175" rx="55" ry="40" fill="#EFF6FF" stroke="#4B8BDA" stroke-width="1.5"/>
  <text x="490" y="180" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC','Hiragino Sans GB',sans-serif" font-size="14" font-weight="600" fill="#1E3A5F">B0</text>

  <!-- B6 -->
  <ellipse cx="615" cy="215" rx="48" ry="36" fill="#FFF1EC" stroke="#D97757" stroke-width="1.5"/>
  <text x="615" y="220" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC','Hiragino Sans GB',sans-serif" font-size="14" font-weight="600" fill="#1E3A5F">B6</text>

  <!-- B9 -->
  <ellipse cx="500" cy="295" rx="48" ry="34" fill="#F0F5F2" stroke="#7BA89F" stroke-width="1.5"/>
  <text x="500" y="300" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC','Hiragino Sans GB',sans-serif" font-size="14" font-weight="600" fill="#1E3A5F">B9</text>

  <!-- articulation points -->
  <circle cx="555" cy="195" r="5" fill="#1E3A5F"/>
  <circle cx="538" cy="260" r="5" fill="#1E3A5F"/>

  <!-- traces overlaid -->
  <path d="M450,160 Q510,170 590,205" stroke="#D97757" stroke-width="2" fill="none" stroke-linecap="round"/>
  <path d="M455,180 Q540,195 645,218" stroke="#4B8BDA" stroke-width="2" fill="none" stroke-linecap="round"/>
  <path d="M608,240 Q540,278 505,295 Q545,275 605,240" stroke="#7BA89F" stroke-width="2" fill="none" stroke-linecap="round"/>

  <text x="540" y="365" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC','Hiragino Sans GB',sans-serif" font-size="11" fill="#3D4F65">块 = 共享状态区　·　黑点 = 关节点（阶段切换）</text>

  <text x="360" y="440" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC','Hiragino Sans GB',sans-serif" font-size="12" fill="#1E3A5F" font-style="italic">同一地形，三种走法一眼可见</text>
</svg>