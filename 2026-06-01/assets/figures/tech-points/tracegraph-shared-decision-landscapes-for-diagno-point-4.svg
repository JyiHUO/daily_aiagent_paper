<svg xmlns="http://www.w3.org/2000/svg" width="720" height="480" viewBox="0 0 720 480">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4B8BDA"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#D9534F"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#9AA8B8"/>
    </marker>
  </defs>

  <text x="360" y="40" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC','Hiragino Sans GB',sans-serif" font-size="20" font-weight="bold" fill="#1E3A5F">陷阱处三路分叉</text>

  <!-- Trajectory line approaching trap -->
  <path d="M 60 200 L 230 200" stroke="#3D4F65" stroke-width="2.5" fill="none" stroke-dasharray="6,4"/>
  <circle cx="80" cy="200" r="5" fill="#3D4F65"/>
  <circle cx="140" cy="200" r="5" fill="#3D4F65"/>
  <circle cx="200" cy="200" r="5" fill="#3D4F65"/>
  <text x="140" y="180" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC','Hiragino Sans GB',sans-serif" font-size="13" fill="#3D4F65">轨迹进行中</text>

  <!-- Trap detector -->
  <polygon points="270,200 310,168 350,200 310,232" fill="#FEF3E2" stroke="#E0954A" stroke-width="2.5"/>
  <text x="310" y="197" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC','Hiragino Sans GB',sans-serif" font-size="13" font-weight="bold" fill="#1E3A5F">陷阱报警</text>
  <text x="310" y="214" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC','Hiragino Sans GB',sans-serif" font-size="11" fill="#888">snapshot</text>

  <!-- Baseline fork -->
  <path d="M 340 180 Q 450 130 535 110" stroke="#9AA8B8" stroke-width="2" fill="none" marker-end="url(#arrG)"/>
  <rect x="540" y="85" width="140" height="50" rx="6" fill="#F1F4F8" stroke="#9AA8B8" stroke-width="1.8"/>
  <text x="610" y="108" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC','Hiragino Sans GB',sans-serif" font-size="14" font-weight="bold" fill="#1E3A5F">Baseline</text>
  <text x="610" y="125" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC','Hiragino Sans GB',sans-serif" font-size="11" fill="#3D4F65">T=0.6 原样</text>

  <!-- Hot fork -->
  <path d="M 350 200 L 535 200" stroke="#D9534F" stroke-width="2.5" fill="none" marker-end="url(#arrR)"/>
  <rect x="540" y="175" width="140" height="50" rx="6" fill="#FCEAE9" stroke="#D9534F" stroke-width="2"/>
  <text x="610" y="198" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC','Hiragino Sans GB',sans-serif" font-size="14" font-weight="bold" fill="#1E3A5F">Hot</text>
  <text x="610" y="215" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC','Hiragino Sans GB',sans-serif" font-size="11" fill="#3D4F65">T=0.9 高温</text>

  <!-- Note fork -->
  <path d="M 340 220 Q 450 270 535 290" stroke="#4B8BDA" stroke-width="2.5" fill="none" marker-end="url(#arr)"/>
  <rect x="540" y="265" width="140" height="50" rx="6" fill="#EFF6FF" stroke="#4B8BDA" stroke-width="2"/>
  <text x="610" y="288" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC','Hiragino Sans GB',sans-serif" font-size="14" font-weight="bold" fill="#1E3A5F">Note</text>
  <text x="610" y="305" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC','Hiragino Sans GB',sans-serif" font-size="11" fill="#3D4F65">加诊断提示</text>

  <!-- Result panel -->
  <line x1="60" y1="385" x2="660" y2="385" stroke="#D6DCE5" stroke-width="1.5"/>
  <text x="60" y="420" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC','Hiragino Sans GB',sans-serif" font-size="13" font-weight="bold" fill="#1E3A5F">SWE-bench 实测：触发子集 resolved 40.4% → <tspan fill="#D9534F" font-weight="bold">43.5%</tspan> (+3.1pp, p=0.016)</text>
  <text x="60" y="445" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC','Hiragino Sans GB',sans-serif" font-size="11" fill="#888" font-style="italic">同一状态 prefix-fork，对比哪种干预最能把这一步救回</text>
</svg>