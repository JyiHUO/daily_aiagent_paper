<svg xmlns="http://www.w3.org/2000/svg" width="720" height="480" viewBox="0 0 720 480">
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4B8BDA"/>
    </marker>
    <marker id="ahx" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#C97B6B"/>
    </marker>
  </defs>

  <text x="360" y="38" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC','Hiragino Sans GB',sans-serif" font-size="20" font-weight="600" fill="#1E3A5F">弱模型的两道关卡</text>

  <!-- Agent -->
  <circle cx="80" cy="240" r="40" fill="#EFF6FF" stroke="#4B8BDA" stroke-width="2"/>
  <text x="80" y="236" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC','Hiragino Sans GB',sans-serif" font-size="14" fill="#1E3A5F">弱模型</text>
  <text x="80" y="256" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC','Hiragino Sans GB',sans-serif" font-size="11" fill="#3D4F65">Agent</text>

  <!-- Gate 1: Activation -->
  <g>
    <rect x="210" y="160" width="170" height="160" rx="6" fill="#FFF4EC" stroke="#C97B6B" stroke-width="2"/>
    <text x="295" y="145" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC','Hiragino Sans GB',sans-serif" font-size="14" font-weight="600" fill="#1E3A5F">关卡一 · 激活</text>
    <line x1="232" y1="180" x2="232" y2="300" stroke="#C97B6B" stroke-width="3"/>
    <line x1="358" y1="180" x2="358" y2="300" stroke="#C97B6B" stroke-width="3"/>
    <line x1="232" y1="200" x2="358" y2="200" stroke="#C97B6B" stroke-width="2"/>
    <line x1="232" y1="240" x2="358" y2="240" stroke="#C97B6B" stroke-width="2"/>
    <line x1="232" y1="280" x2="358" y2="280" stroke="#C97B6B" stroke-width="2"/>
    <text x="295" y="345" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC','Hiragino Sans GB',sans-serif" font-size="12" fill="#3D4F65">load 命令格式错 · SLR 25%</text>
  </g>

  <!-- Gate 2: Adherence -->
  <g>
    <rect x="465" y="160" width="190" height="160" rx="6" fill="#FFF4EC" stroke="#C97B6B" stroke-width="2"/>
    <text x="560" y="145" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC','Hiragino Sans GB',sans-serif" font-size="14" font-weight="600" fill="#1E3A5F">关卡二 · 遵循</text>
    <!-- skill steps decaying -->
    <circle cx="495" cy="240" r="8" fill="#4B8BDA"/>
    <line x1="503" y1="240" x2="528" y2="240" stroke="#4B8BDA" stroke-width="2"/>
    <circle cx="535" cy="240" r="7" fill="#4B8BDA" opacity="0.7"/>
    <line x1="542" y1="240" x2="564" y2="240" stroke="#C97B6B" stroke-width="2" stroke-dasharray="3,3"/>
    <circle cx="572" cy="240" r="6" fill="#C97B6B" opacity="0.6"/>
    <!-- abandon X -->
    <line x1="600" y1="228" x2="630" y2="258" stroke="#C97B6B" stroke-width="2.5"/>
    <line x1="630" y1="228" x2="600" y2="258" stroke="#C97B6B" stroke-width="2.5"/>
    <text x="560" y="290" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC','Hiragino Sans GB',sans-serif" font-size="11" fill="#3D4F65">越走越偏 · 不走 fallback</text>
    <text x="560" y="345" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC','Hiragino Sans GB',sans-serif" font-size="12" fill="#3D4F65">adherence 0.52 → 0.13</text>
  </g>

  <!-- arrows -->
  <line x1="122" y1="240" x2="206" y2="240" stroke="#4B8BDA" stroke-width="2" marker-end="url(#ah)"/>
  <line x1="383" y1="240" x2="461" y2="240" stroke="#4B8BDA" stroke-width="2" marker-end="url(#ah)"/>

  <!-- failure exits to bottom label -->
  <path d="M 295,320 Q 295,400 410,420" fill="none" stroke="#C97B6B" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#ahx)"/>
  <path d="M 560,320 Q 560,400 470,420" fill="none" stroke="#C97B6B" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#ahx)"/>
  <rect x="380" y="425" width="120" height="30" rx="4" fill="#FFF4EC" stroke="#C97B6B" stroke-width="1.5"/>
  <text x="440" y="445" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC','Hiragino Sans GB',sans-serif" font-size="13" font-weight="600" fill="#C97B6B">技能失效</text>
</svg>