<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 420" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4B8BDA"/>
    </marker>
  </defs>

  <text x="300" y="32" text-anchor="middle" font-size="17" font-weight="bold" fill="#1E3A5F">Manifest 质量决定防护上限</text>
  <text x="300" y="52" text-anchor="middle" font-size="11" fill="#3D4F65">同一机制，钥匙填得好不好，结果天差地别</text>

  <!-- Left: Expert manifest -->
  <g>
    <rect x="50" y="80" width="200" height="240" rx="10" fill="#EFF6FF" stroke="#4B8BDA" stroke-width="1.5"/>
    <text x="150" y="105" text-anchor="middle" font-size="13" font-weight="bold" fill="#1E3A5F">Expert Manifest</text>
    <text x="150" y="124" text-anchor="middle" font-size="11" fill="#3D4F65">精确标注 source / sink</text>

    <!-- Lock icon -->
    <g transform="translate(115,148)">
      <rect x="5" y="22" width="60" height="45" rx="4" fill="#C9DEF5" stroke="#1E3A5F" stroke-width="1.5"/>
      <path d="M15,22 V12 a20,20 0 0,1 40,0 V22" fill="none" stroke="#1E3A5F" stroke-width="2.5"/>
      <circle cx="35" cy="42" r="4" fill="#1E3A5F"/>
    </g>

    <text x="150" y="258" text-anchor="middle" font-size="14" font-weight="bold" fill="#1E3A5F">阻断率 100%</text>
    <text x="150" y="285" text-anchor="middle" font-size="11" fill="#3D4F65">预算交集严格生效，攻击全拦</text>
  </g>

  <!-- Right: Naive manifest -->
  <g>
    <rect x="350" y="80" width="200" height="240" rx="10" fill="#FBEEE6" stroke="#D98859" stroke-width="1.5"/>
    <text x="450" y="105" text-anchor="middle" font-size="13" font-weight="bold" fill="#1E3A5F">Naive Manifest</text>
    <text x="450" y="124" text-anchor="middle" font-size="11" fill="#3D4F65">pass-through = *  通配符</text>

    <!-- Broken lock -->
    <g transform="translate(415,148)">
      <rect x="5" y="22" width="60" height="45" rx="4" fill="#F5D5C0" stroke="#A0522D" stroke-width="1.5"/>
      <path d="M15,22 V12 a20,20 0 0,1 40,0 V18" fill="none" stroke="#A0522D" stroke-width="2.5"/>
      <path d="M55,18 L62,8" stroke="#A0522D" stroke-width="2.5" stroke-linecap="round"/>
      <line x1="20" y1="35" x2="50" y2="58" stroke="#A0522D" stroke-width="2"/>
    </g>

    <text x="450" y="258" text-anchor="middle" font-size="14" font-weight="bold" fill="#1E3A5F">阻断率 27%</text>
    <text x="450" y="285" text-anchor="middle" font-size="11" fill="#3D4F65">交集形同虚设，73% 攻击通过</text>
  </g>

  <!-- Comparison arrow -->
  <line x1="258" y1="200" x2="342" y2="200" stroke="#4B8BDA" stroke-width="1.5" stroke-dasharray="4 4"/>
  <text x="300" y="195" text-anchor="middle" font-size="11" fill="#4B8BDA">同一机制</text>

  <!-- Bottom: linter -->
  <rect x="170" y="358" width="260" height="44" rx="22" fill="#1E3A5F"/>
  <text x="300" y="378" text-anchor="middle" font-size="12" font-weight="bold" fill="#FFFFFF">Manifest Linter · 6 条规则</text>
  <text x="300" y="394" text-anchor="middle" font-size="10" fill="#C9DEF5">查通配符 / 缺 source / 行为不符</text>

  <line x1="180" y1="320" x2="240" y2="358" stroke="#4B8BDA" stroke-width="1.5" marker-end="url(#ar)"/>
  <line x1="420" y1="320" x2="360" y2="358" stroke="#4B8BDA" stroke-width="1.5" marker-end="url(#ar)"/>
</svg>