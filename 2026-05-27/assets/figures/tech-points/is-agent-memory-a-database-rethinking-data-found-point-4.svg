<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" font-family="-apple-system,Segoe UI,sans-serif">
  <text x="400" y="40" text-anchor="middle" font-size="20" font-weight="600" fill="#1E3A5F">Three Research Agendas for Agent Memory</text>
  <text x="400" y="62" text-anchor="middle" font-size="12" fill="#3D4F65">beyond CRUD — toward a memory workload</text>

  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4B8BDA"/>
    </marker>
  </defs>

  <!-- center -->
  <g>
    <circle cx="400" cy="270" r="58" fill="#FEF3E8" stroke="#D89B5C" stroke-width="2"/>
    <text x="400" y="266" text-anchor="middle" font-size="13" font-weight="600" fill="#1E3A5F">Agent</text>
    <text x="400" y="284" text-anchor="middle" font-size="13" font-weight="600" fill="#1E3A5F">Memory</text>
  </g>

  <!-- Pillar 1 -->
  <g>
    <rect x="60" y="140" width="190" height="130" rx="10" fill="#EFF6FF" stroke="#4B8BDA" stroke-width="1.8"/>
    <text x="155" y="162" text-anchor="middle" font-size="13" font-weight="600" fill="#1E3A5F">1. Native Engine</text>
    <rect x="90" y="178" width="40" height="16" fill="#4B8BDA" opacity="0.7"/>
    <rect x="135" y="178" width="40" height="16" fill="#4B8BDA" opacity="0.5"/>
    <rect x="180" y="178" width="40" height="16" fill="#4B8BDA" opacity="0.7"/>
    <rect x="112" y="196" width="40" height="16" fill="#4B8BDA" opacity="0.6"/>
    <rect x="158" y="196" width="40" height="16" fill="#4B8BDA" opacity="0.6"/>
    <text x="155" y="234" text-anchor="middle" font-size="11" fill="#3D4F65">page layout · unified index</text>
    <text x="155" y="252" text-anchor="middle" font-size="11" fill="#3D4F65">read-modify-write retrieval</text>
  </g>

  <!-- Pillar 2 -->
  <g>
    <rect x="305" y="380" width="190" height="100" rx="10" fill="#F0F7F0" stroke="#6BA368" stroke-width="1.8"/>
    <text x="400" y="403" text-anchor="middle" font-size="13" font-weight="600" fill="#1E3A5F">2. Trajectory Eval</text>
    <path d="M 325 438 Q 360 422 395 438 T 470 438" fill="none" stroke="#6BA368" stroke-width="2"/>
    <circle cx="325" cy="438" r="4" fill="#6BA368"/>
    <circle cx="395" cy="438" r="4" fill="#6BA368"/>
    <circle cx="470" cy="438" r="4" fill="#6BA368"/>
    <text x="400" y="465" text-anchor="middle" font-size="11" fill="#3D4F65">whole path, not last answer</text>
  </g>

  <!-- Pillar 3 -->
  <g>
    <rect x="550" y="140" width="190" height="130" rx="10" fill="#FBEEEE" stroke="#C97777" stroke-width="1.8"/>
    <text x="645" y="162" text-anchor="middle" font-size="13" font-weight="600" fill="#1E3A5F">3. Shared-Memory Privacy</text>
    <circle cx="595" cy="205" r="14" fill="none" stroke="#C97777" stroke-width="2"/>
    <text x="595" y="209" text-anchor="middle" font-size="11" fill="#1E3A5F">A</text>
    <circle cx="695" cy="205" r="14" fill="none" stroke="#C97777" stroke-width="2"/>
    <text x="695" y="209" text-anchor="middle" font-size="11" fill="#1E3A5F">B</text>
    <path d="M 611 205 L 679 205" stroke="#C97777" stroke-width="1.5" stroke-dasharray="4,3"/>
    <text x="645" y="196" text-anchor="middle" font-size="10" fill="#C97777">salience leak</text>
    <text x="645" y="248" text-anchor="middle" font-size="11" fill="#3D4F65">retrieval becomes write</text>
  </g>

  <!-- arrows from center to pillars (terminate at edges) -->
  <line x1="356" y1="240" x2="255" y2="210" stroke="#4B8BDA" stroke-width="1.8" marker-end="url(#ar)"/>
  <line x1="400" y1="328" x2="400" y2="376" stroke="#4B8BDA" stroke-width="1.8" marker-end="url(#ar)"/>
  <line x1="444" y1="240" x2="545" y2="210" stroke="#4B8BDA" stroke-width="1.8" marker-end="url(#ar)"/>
</svg>