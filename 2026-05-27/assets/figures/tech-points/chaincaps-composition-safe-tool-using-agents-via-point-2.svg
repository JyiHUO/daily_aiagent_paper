<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 420" font-family="-apple-system,Helvetica,Arial,sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4B8BDA"/>
    </marker>
    <marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#C0504D"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="300" y="40" text-anchor="middle" font-size="17" fill="#1E3A5F" font-weight="700">Permissions checked at the protocol edge</text>
  <text x="300" y="60" text-anchor="middle" font-size="12" fill="#3D4F65">no model change · no tool change</text>

  <!-- Agent -->
  <rect x="30" y="170" width="110" height="80" rx="10" fill="#FFF4E6" stroke="#D9A05B" stroke-width="1.5"/>
  <text x="85" y="205" text-anchor="middle" font-size="15" fill="#1E3A5F" font-weight="600">LLM Agent</text>
  <text x="85" y="225" text-anchor="middle" font-size="11" fill="#3D4F65">tools/call</text>

  <!-- Tool Server -->
  <rect x="460" y="170" width="110" height="80" rx="10" fill="#FFF4E6" stroke="#D9A05B" stroke-width="1.5"/>
  <text x="515" y="205" text-anchor="middle" font-size="15" fill="#1E3A5F" font-weight="600">Tool Server</text>
  <text x="515" y="225" text-anchor="middle" font-size="11" fill="#3D4F65">unchanged</text>

  <!-- Proxy gate -->
  <rect x="220" y="115" width="160" height="190" rx="8" fill="#EFF6FF" stroke="#4B8BDA" stroke-width="2"/>
  <text x="300" y="142" text-anchor="middle" font-size="15" fill="#1E3A5F" font-weight="700">ChainCaps</text>
  <text x="300" y="160" text-anchor="middle" font-size="12" fill="#3D4F65">MCP Proxy</text>

  <!-- gate bars -->
  <line x1="245" y1="180" x2="245" y2="290" stroke="#4B8BDA" stroke-width="2"/>
  <line x1="355" y1="180" x2="355" y2="290" stroke="#4B8BDA" stroke-width="2"/>
  <text x="300" y="210" text-anchor="middle" font-size="11" fill="#1E3A5F">B_agg = B_ctx ∩ T</text>
  <text x="300" y="235" text-anchor="middle" font-size="11" fill="#1E3A5F">lineage DAG</text>
  <text x="300" y="260" text-anchor="middle" font-size="11" fill="#1E3A5F">fail-closed</text>
  <text x="300" y="285" text-anchor="middle" font-size="11" fill="#1E3A5F">B(y) = Pass(t) ∩ B_agg</text>

  <!-- Forward arrow agent -> proxy -->
  <line x1="140" y1="200" x2="218" y2="200" stroke="#4B8BDA" stroke-width="2" marker-end="url(#a)"/>
  <!-- Forward arrow proxy -> tool -->
  <line x1="380" y1="200" x2="458" y2="200" stroke="#4B8BDA" stroke-width="2" marker-end="url(#a)"/>

  <!-- Block return -->
  <path d="M218,225 Q180,255 142,232" fill="none" stroke="#C0504D" stroke-width="2" stroke-dasharray="4,3" marker-end="url(#r)"/>
  <text x="178" y="270" text-anchor="middle" font-size="11" fill="#C0504D">deny</text>

  <!-- bottom note -->
  <text x="300" y="360" text-anchor="middle" font-size="12" fill="#3D4F65" font-style="italic">every call passes the gate; budgets shrink, never grow</text>
</svg>