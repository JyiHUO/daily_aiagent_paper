<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 460" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4B8BDA"/>
    </marker>
  </defs>

  <text x="360" y="34" text-anchor="middle" font-size="18" font-weight="600" fill="#1E3A5F">CRUD records  vs.  GEM state</text>

  <!-- LEFT: CRUD record-level -->
  <g>
    <rect x="50" y="60" width="260" height="370" rx="10" fill="#FBF1EC" stroke="#C97A5C" stroke-width="1.5"/>
    <text x="180" y="86" text-anchor="middle" font-size="13" font-weight="600" fill="#3D4F65">record-level CRUD</text>

    <rect x="100" y="110" width="160" height="20" fill="#fff" stroke="#C97A5C"/>
    <rect x="100" y="134" width="160" height="20" fill="#fff" stroke="#C97A5C"/>
    <rect x="100" y="158" width="160" height="20" fill="#fff" stroke="#C97A5C"/>
    <rect x="100" y="182" width="160" height="20" fill="#fff" stroke="#C97A5C"/>
    <rect x="100" y="206" width="160" height="20" fill="#fff" stroke="#C97A5C"/>
    <rect x="100" y="230" width="160" height="20" fill="#fff" stroke="#C97A5C"/>

    <text x="180" y="272" text-anchor="middle" font-size="11" font-style="italic" fill="#C97A5C">unbounded pile</text>

    <text x="180" y="320" text-anchor="middle" font-size="11" fill="#3D4F65">• no semantic revision</text>
    <text x="180" y="345" text-anchor="middle" font-size="11" fill="#3D4F65">• capacity-based forgetting</text>
    <text x="180" y="370" text-anchor="middle" font-size="11" fill="#3D4F65">• read-only retrieval</text>
    <text x="180" y="400" text-anchor="middle" font-size="11" fill="#3D4F65">→ correctness not enforced</text>
  </g>

  <!-- arrow between -->
  <line x1="315" y1="240" x2="395" y2="240" stroke="#4B8BDA" stroke-width="2" marker-end="url(#a)"/>
  <text x="355" y="232" text-anchor="middle" font-size="11" fill="#1E3A5F">rethink</text>

  <!-- RIGHT: GEM state -->
  <g>
    <rect x="400" y="60" width="270" height="370" rx="10" fill="#EFF6FF" stroke="#4B8BDA" stroke-width="1.5"/>
    <text x="535" y="86" text-anchor="middle" font-size="13" font-weight="600" fill="#3D4F65">GEM global state</text>
    <text x="535" y="104" text-anchor="middle" font-size="11" fill="#3D4F65">M_t = ( D_t , S_t , P_t )</text>

    <!-- governed state circle -->
    <circle cx="535" cy="230" r="72" fill="#fff" stroke="#1E3A5F" stroke-width="1.8"/>
    <text x="535" y="226" text-anchor="middle" font-size="14" font-weight="600" fill="#1E3A5F">M_t</text>
    <text x="535" y="244" text-anchor="middle" font-size="10" fill="#3D4F65">policy P guards</text>

    <!-- 4 operators around -->
    <text x="535" y="142" text-anchor="middle" font-size="11" font-weight="600" fill="#1E3A5F">ingestion</text>
    <text x="635" y="234" text-anchor="middle" font-size="11" font-weight="600" fill="#1E3A5F">revision</text>
    <text x="535" y="328" text-anchor="middle" font-size="11" font-weight="600" fill="#1E3A5F">forgetting</text>
    <text x="435" y="234" text-anchor="middle" font-size="11" font-weight="600" fill="#1E3A5F">retrieval</text>

    <!-- straight arrows into the circle -->
    <line x1="535" y1="148" x2="535" y2="156" stroke="#4B8BDA" stroke-width="1.5" marker-end="url(#a)"/>
    <line x1="620" y1="230" x2="610" y2="230" stroke="#4B8BDA" stroke-width="1.5" marker-end="url(#a)"/>
    <line x1="535" y1="318" x2="535" y2="306" stroke="#4B8BDA" stroke-width="1.5" marker-end="url(#a)"/>
    <line x1="450" y1="230" x2="460" y2="230" stroke="#4B8BDA" stroke-width="1.5" marker-end="url(#a)"/>

    <text x="535" y="370" text-anchor="middle" font-size="11" fill="#3D4F65">retrieval also writes salience</text>
    <text x="535" y="392" text-anchor="middle" font-size="11" fill="#3D4F65">C1–C6 correctness conditions</text>
    <text x="535" y="414" text-anchor="middle" font-size="11" font-style="italic" fill="#1E3A5F">state-level, not record-level</text>
  </g>
</svg>