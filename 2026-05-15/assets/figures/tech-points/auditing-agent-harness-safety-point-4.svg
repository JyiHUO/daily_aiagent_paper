<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 420" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4B8BDA"/>
    </marker>
    <marker id="arR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#D97A6C"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="300" y="36" text-anchor="middle" font-size="17" font-weight="700" fill="#1E3A5F">210 任务剧场 · 多 Agent 协作基准</text>
  <text x="300" y="56" text-anchor="middle" font-size="11" fill="#3D4F65">真实场景 + 扰动诱饵，逼出"选错对象"的细微失误</text>

  <!-- Stage -->
  <rect x="50" y="85" width="500" height="170" rx="14" fill="#EFF6FF" stroke="#4B8BDA" stroke-width="1.5"/>
  <text x="70" y="108" font-size="12" font-weight="700" fill="#1E3A5F">8 个场景剧场 · 69 角色模板</text>

  <!-- Domain chips -->
  <g font-size="11" fill="#1E3A5F">
    <rect x="70" y="122" width="60" height="22" rx="11" fill="#FFFFFF" stroke="#4B8BDA"/>
    <text x="100" y="137" text-anchor="middle">金融</text>
    <rect x="138" y="122" width="60" height="22" rx="11" fill="#FFFFFF" stroke="#4B8BDA"/>
    <text x="168" y="137" text-anchor="middle">医疗</text>
    <rect x="206" y="122" width="60" height="22" rx="11" fill="#FFFFFF" stroke="#4B8BDA"/>
    <text x="236" y="137" text-anchor="middle">电商</text>
    <rect x="274" y="122" width="60" height="22" rx="11" fill="#FFFFFF" stroke="#4B8BDA"/>
    <text x="304" y="137" text-anchor="middle">办公</text>
    <rect x="342" y="122" width="60" height="22" rx="11" fill="#FFFFFF" stroke="#4B8BDA"/>
    <text x="372" y="137" text-anchor="middle">社交</text>
    <rect x="410" y="122" width="60" height="22" rx="11" fill="#FFFFFF" stroke="#4B8BDA"/>
    <text x="440" y="137" text-anchor="middle">法律</text>
    <rect x="478" y="122" width="60" height="22" rx="11" fill="#FFFFFF" stroke="#4B8BDA"/>
    <text x="508" y="137" text-anchor="middle">软件</text>
  </g>

  <!-- Agents cluster -->
  <g>
    <circle cx="155" cy="200" r="14" fill="#4B8BDA"/>
    <circle cx="195" cy="218" r="14" fill="#4B8BDA"/>
    <circle cx="160" cy="236" r="14" fill="#4B8BDA"/>
    <text x="155" y="204" font-size="10" fill="#FFFFFF" text-anchor="middle">A</text>
    <text x="195" y="222" font-size="10" fill="#FFFFFF" text-anchor="middle">A</text>
    <text x="160" y="240" font-size="10" fill="#FFFFFF" text-anchor="middle">A</text>
  </g>
  <text x="175" y="262" text-anchor="middle" font-size="11" fill="#1E3A5F">~4.6 Agent / 任务</text>

  <!-- Target file -->
  <g transform="translate(330,178)">
    <rect x="0" y="0" width="50" height="60" rx="4" fill="#FFFFFF" stroke="#4B8BDA" stroke-width="2"/>
    <line x1="8" y1="14" x2="42" y2="14" stroke="#4B8BDA"/>
    <line x1="8" y1="24" x2="42" y2="24" stroke="#4B8BDA"/>
    <line x1="8" y1="34" x2="42" y2="34" stroke="#4B8BDA"/>
    <text x="25" y="74" font-size="10" fill="#1E3A5F" text-anchor="middle">目标对象</text>
  </g>

  <!-- Decoy file -->
  <g transform="translate(410,178)">
    <rect x="0" y="0" width="50" height="60" rx="4" fill="#FDECEC" stroke="#D97A6C" stroke-width="2" stroke-dasharray="3,2"/>
    <line x1="8" y1="14" x2="42" y2="14" stroke="#D97A6C"/>
    <line x1="8" y1="24" x2="42" y2="24" stroke="#D97A6C"/>
    <line x1="8" y1="34" x2="42" y2="34" stroke="#D97A6C"/>
    <text x="25" y="74" font-size="10" fill="#B85A4A" text-anchor="middle">同名诱饵</text>
  </g>

  <!-- Arrows -->
  <path d="M215,210 Q275,200 326,200" fill="none" stroke="#4B8BDA" stroke-width="2" marker-end="url(#ar)"/>
  <path d="M215,225 Q310,255 406,225" fill="none" stroke="#D97A6C" stroke-width="2" stroke-dasharray="4,3" marker-end="url(#arR)"/>

  <!-- Bottom: perturbations -->
  <text x="300" y="298" text-anchor="middle" font-size="13" font-weight="700" fill="#1E3A5F">+ 525 个扰动用例（覆盖 105 任务 × 5 类）</text>

  <g font-size="11" fill="#1E3A5F">
    <rect x="70" y="318" width="140" height="44" rx="6" fill="#FFF4E6" stroke="#D9954B"/>
    <text x="140" y="336" text-anchor="middle" font-weight="600">间接注入</text>
    <text x="140" y="352" text-anchor="middle" fill="#3D4F65">藏在工具返回里</text>

    <rect x="230" y="318" width="140" height="44" rx="6" fill="#FFF4E6" stroke="#D9954B"/>
    <text x="300" y="336" text-anchor="middle" font-weight="600">模糊目标</text>
    <text x="300" y="352" text-anchor="middle" fill="#3D4F65">指代不清的请求</text>

    <rect x="390" y="318" width="140" height="44" rx="6" fill="#FFF4E6" stroke="#D9954B"/>
    <text x="460" y="336" text-anchor="middle" font-weight="600">运行时扰动</text>
    <text x="460" y="352" text-anchor="middle" fill="#3D4F65">工具失败 / 超时</text>
  </g>

  <!-- Footer -->
  <text x="300" y="395" text-anchor="middle" font-size="11" fill="#3D4F65">同一任务可在 单 Agent / 多 Agent 下对比 → 量化"协作"的额外风险</text>
</svg>