<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 420" font-family="-apple-system, sans-serif">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4B8BDA"/>
    </marker>
  </defs>

  <text x="300" y="38" text-anchor="middle" font-size="18" font-weight="600" fill="#1E3A5F">能力越强，越易越界</text>
  <text x="300" y="60" text-anchor="middle" font-size="12" fill="#3D4F65">协作放大风险 · harness 决定安全上限</text>

  <!-- Single agent -->
  <g>
    <circle cx="150" cy="180" r="42" fill="#EFF6FF" stroke="#4B8BDA" stroke-width="1.8"/>
    <text x="150" y="178" text-anchor="middle" font-size="13" fill="#1E3A5F">单 Agent</text>
    <text x="150" y="196" text-anchor="middle" font-size="11" fill="#3D4F65">SAR 0.91</text>
  </g>

  <!-- Multi agent -->
  <g transform="translate(450,180)">
    <circle cx="-38" cy="-22" r="22" fill="#FFF1E6" stroke="#E89B5A" stroke-width="1.6"/>
    <circle cx="38" cy="-22" r="22" fill="#FFF1E6" stroke="#E89B5A" stroke-width="1.6"/>
    <circle cx="0" cy="32" r="22" fill="#FFF1E6" stroke="#E89B5A" stroke-width="1.6"/>
    <line x1="-18" y1="-22" x2="18" y2="-22" stroke="#E89B5A" stroke-width="1.2"/>
    <line x1="-30" y1="-5" x2="-12" y2="18" stroke="#E89B5A" stroke-width="1.2"/>
    <line x1="30" y1="-5" x2="12" y2="18" stroke="#E89B5A" stroke-width="1.2"/>
    <text x="0" y="-18" text-anchor="middle" font-size="14" fill="#C2410C">⚠</text>
    <text x="0" y="75" text-anchor="middle" font-size="13" fill="#1E3A5F">多 Agent</text>
    <text x="0" y="92" text-anchor="middle" font-size="11" fill="#C2410C">SAR 0.64 ↓</text>
  </g>

  <!-- Degradation arrow -->
  <line x1="195" y1="175" x2="385" y2="175" stroke="#4B8BDA" stroke-width="2" marker-end="url(#ar)" stroke-dasharray="5,4"/>
  <text x="290" y="165" text-anchor="middle" font-size="12" fill="#1E3A5F" font-weight="600">通道越多，泄露越多</text>

  <!-- Bottom insight -->
  <g transform="translate(80,310)">
    <rect x="0" y="0" width="440" height="70" rx="8" fill="#EFF6FF" stroke="#4B8BDA" stroke-width="1.5"/>
    <text x="220" y="28" text-anchor="middle" font-size="13" font-weight="600" fill="#1E3A5F">同模型 · 换 harness：SAR 0.30 → 0.37</text>
    <text x="220" y="52" text-anchor="middle" font-size="12" fill="#3D4F65">完成率与安全可同时提升</text>
  </g>

  <line x1="150" y1="225" x2="240" y2="308" stroke="#4B8BDA" stroke-width="1.5" marker-end="url(#ar)"/>
  <line x1="450" y1="245" x2="360" y2="308" stroke="#4B8BDA" stroke-width="1.5" marker-end="url(#ar)"/>
</svg>