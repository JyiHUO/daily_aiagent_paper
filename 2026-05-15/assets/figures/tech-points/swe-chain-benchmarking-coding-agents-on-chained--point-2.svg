<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 460" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4B8BDA"/>
    </marker>
  </defs>

  <text x="360" y="38" text-anchor="middle" font-size="20" font-weight="700" fill="#1E3A5F">DecompSynth: 噪声 → 干净规格</text>
  <text x="360" y="60" text-anchor="middle" font-size="12" fill="#3D4F65">先把 diff 对齐到 task，再据此合成规格</text>

  <!-- Left: messy inputs -->
  <g>
    <rect x="40" y="110" width="180" height="230" rx="10" fill="#FFF3E6" stroke="#E0A06A" stroke-width="1.5"/>
    <text x="130" y="135" text-anchor="middle" font-size="13" font-weight="700" fill="#1E3A5F">原始材料</text>

    <rect x="58" y="155" width="144" height="36" rx="5" fill="#FFFFFF" stroke="#E0A06A"/>
    <text x="130" y="178" text-anchor="middle" font-size="12" fill="#3D4F65">release note 一行</text>

    <rect x="58" y="205" width="144" height="36" rx="5" fill="#FFFFFF" stroke="#E0A06A"/>
    <text x="130" y="228" text-anchor="middle" font-size="12" fill="#3D4F65">issue / PR 噪声</text>

    <rect x="58" y="255" width="144" height="68" rx="5" fill="#FFFFFF" stroke="#E0A06A"/>
    <text x="130" y="278" text-anchor="middle" font-size="12" fill="#3D4F65">diff hunks</text>
    <line x1="72" y1="295" x2="188" y2="295" stroke="#E0A06A" stroke-dasharray="3,2"/>
    <line x1="72" y1="310" x2="170" y2="310" stroke="#E0A06A" stroke-dasharray="3,2"/>
  </g>

  <!-- Middle: matching -->
  <g>
    <rect x="270" y="140" width="180" height="170" rx="10" fill="#EFF6FF" stroke="#4B8BDA" stroke-width="1.5"/>
    <text x="360" y="165" text-anchor="middle" font-size="13" font-weight="700" fill="#1E3A5F">Step 1 · Hunk 对齐</text>

    <circle cx="310" cy="220" r="22" fill="#FFFFFF" stroke="#4B8BDA"/>
    <text x="310" y="224" text-anchor="middle" font-size="11" fill="#1E3A5F">task A</text>
    <circle cx="360" cy="260" r="22" fill="#FFFFFF" stroke="#4B8BDA"/>
    <text x="360" y="264" text-anchor="middle" font-size="11" fill="#1E3A5F">task B</text>
    <circle cx="410" cy="220" r="22" fill="#FFFFFF" stroke="#9CA8B8" stroke-dasharray="3,2"/>
    <text x="410" y="224" text-anchor="middle" font-size="10" fill="#3D4F65">others</text>

    <text x="360" y="297" text-anchor="middle" font-size="10" fill="#3D4F65">多标签匹配</text>
  </g>

  <!-- Right: spec -->
  <g>
    <rect x="500" y="110" width="180" height="230" rx="10" fill="#E8F0E4" stroke="#6B9B5E" stroke-width="1.5"/>
    <text x="590" y="135" text-anchor="middle" font-size="13" font-weight="700" fill="#1E3A5F">Step 2 · 合成规格</text>

    <rect x="518" y="155" width="144" height="32" rx="4" fill="#FFFFFF" stroke="#6B9B5E"/>
    <text x="590" y="176" text-anchor="middle" font-size="11" fill="#3D4F65">问题描述</text>

    <rect x="518" y="195" width="144" height="32" rx="4" fill="#FFFFFF" stroke="#6B9B5E"/>
    <text x="590" y="216" text-anchor="middle" font-size="11" fill="#3D4F65">期望与约束</text>

    <rect x="518" y="235" width="144" height="32" rx="4" fill="#FFFFFF" stroke="#6B9B5E"/>
    <text x="590" y="256" text-anchor="middle" font-size="11" fill="#3D4F65">行为</text>

    <rect x="518" y="275" width="144" height="32" rx="4" fill="#FFFFFF" stroke="#6B9B5E"/>
    <text x="590" y="296" text-anchor="middle" font-size="11" fill="#3D4F65">验收标准</text>
  </g>

  <!-- arrows -->
  <line x1="222" y1="225" x2="268" y2="225" stroke="#4B8BDA" stroke-width="2" marker-end="url(#ar)"/>
  <line x1="452" y1="225" x2="498" y2="225" stroke="#4B8BDA" stroke-width="2" marker-end="url(#ar)"/>

  <!-- footer note -->
  <text x="360" y="395" text-anchor="middle" font-size="12" fill="#1E3A5F" font-weight="600">有依据，不泄答案</text>
  <text x="360" y="415" text-anchor="middle" font-size="11" fill="#3D4F65">pytest 8.2.2 → 8.3.0 · 10 次重复匹配 exact match 93.66%</text>
</svg>