<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 420">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4B8BDA"/>
    </marker>
  </defs>

  <text x="300" y="36" text-anchor="middle" font-family="Helvetica,Arial" font-size="20" font-weight="700" fill="#1E3A5F">三合一训练目标</text>
  <text x="300" y="58" text-anchor="middle" font-family="Helvetica,Arial" font-size="12" fill="#3D4F65">同一份 WildGUI 数据，三种视角学习</text>

  <!-- Eye: grounding -->
  <g>
    <circle cx="120" cy="190" r="58" fill="#EFF6FF" stroke="#4B8BDA" stroke-width="2"/>
    <ellipse cx="120" cy="190" rx="40" ry="20" fill="none" stroke="#1E3A5F" stroke-width="2"/>
    <circle cx="120" cy="190" r="9" fill="#1E3A5F"/>
    <text x="120" y="278" text-anchor="middle" font-family="Helvetica,Arial" font-size="14" font-weight="700" fill="#1E3A5F">看图找控件 (Grounding)</text>
  </g>

  <!-- Cursor click: single action -->
  <g>
    <circle cx="300" cy="190" r="58" fill="#FFF4E6" stroke="#E89B4C" stroke-width="2"/>
    <path d="M286 168 L286 212 L297 203 L304 218 L312 214 L305 199 L319 199 Z" fill="#1E3A5F"/>
    <circle cx="316" cy="212" r="13" fill="none" stroke="#E89B4C" stroke-width="2"/>
    <text x="300" y="278" text-anchor="middle" font-family="Helvetica,Arial" font-size="14" font-weight="700" fill="#1E3A5F">单步动作 (Action)</text>
  </g>

  <!-- Trajectory frames -->
  <g>
    <rect x="430" y="160" width="38" height="30" fill="#EFF6FF" stroke="#4B8BDA" stroke-width="2"/>
    <rect x="450" y="175" width="38" height="30" fill="#EFF6FF" stroke="#4B8BDA" stroke-width="2"/>
    <rect x="470" y="190" width="38" height="30" fill="#EFF6FF" stroke="#4B8BDA" stroke-width="2"/>
    <rect x="490" y="205" width="38" height="30" fill="#1E3A5F" stroke="#1E3A5F" stroke-width="2"/>
    <text x="480" y="278" text-anchor="middle" font-family="Helvetica,Arial" font-size="14" font-weight="700" fill="#1E3A5F">长程轨迹 (Trajectory)</text>
  </g>

  <!-- Bottom highlight -->
  <rect x="80" y="320" width="440" height="70" rx="8" fill="#F5F0E6" stroke="#E89B4C" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="300" y="348" text-anchor="middle" font-family="Helvetica,Arial" font-size="13" font-weight="700" fill="#1E3A5F">消融：去掉 Trajectory 损失</text>
  <text x="300" y="372" text-anchor="middle" font-family="Helvetica,Arial" font-size="12" fill="#3D4F65">AndroidWorld 在线成功率 31.9% → 24.1%</text>

  <!-- arrows from each to bottom -->
  <line x1="120" y1="295" x2="200" y2="320" stroke="#4B8BDA" stroke-width="1.5" marker-end="url(#ar)"/>
  <line x1="300" y1="295" x2="300" y2="320" stroke="#4B8BDA" stroke-width="1.5" marker-end="url(#ar)"/>
  <line x1="480" y1="295" x2="400" y2="320" stroke="#4B8BDA" stroke-width="1.5" marker-end="url(#ar)"/>
</svg>