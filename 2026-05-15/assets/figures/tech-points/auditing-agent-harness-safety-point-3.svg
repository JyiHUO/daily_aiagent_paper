<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 420" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4B8BDA"/>
    </marker>
    <marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#D9883C"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="300" y="32" text-anchor="middle" font-size="17" font-weight="700" fill="#1E3A5F">Hidden Audit Channel</text>
  <text x="300" y="52" text-anchor="middle" font-size="11" fill="#3D4F65">rules invisible to agent, revealed at judging</text>

  <!-- Agent's visible world (left) -->
  <rect x="50" y="80" width="200" height="240" rx="10" fill="#EFF6FF" stroke="#4B8BDA" stroke-width="1.5"/>
  <text x="150" y="104" text-anchor="middle" font-size="12" font-weight="700" fill="#1E3A5F">Agent's View</text>

  <!-- Agent icon -->
  <circle cx="150" cy="160" r="26" fill="#FFFFFF" stroke="#1E3A5F" stroke-width="1.8"/>
  <circle cx="141" cy="158" r="3" fill="#1E3A5F"/>
  <circle cx="159" cy="158" r="3" fill="#1E3A5F"/>
  <line x1="150" y1="134" x2="150" y2="124" stroke="#1E3A5F" stroke-width="1.8"/>
  <circle cx="150" cy="122" r="2.5" fill="#4B8BDA"/>

  <text x="150" y="210" text-anchor="middle" font-size="11" fill="#3D4F65">think → act → observe</text>

  <!-- trajectory log strip -->
  <rect x="80" y="232" width="140" height="62" rx="4" fill="#FFFFFF" stroke="#4B8BDA" stroke-width="1"/>
  <line x1="92" y1="248" x2="208" y2="248" stroke="#B8CFE5" stroke-width="1"/>
  <line x1="92" y1="260" x2="190" y2="260" stroke="#B8CFE5" stroke-width="1"/>
  <line x1="92" y1="272" x2="200" y2="272" stroke="#B8CFE5" stroke-width="1"/>
  <text x="150" y="288" text-anchor="middle" font-size="10" fill="#3D4F65">trajectory log</text>

  <!-- Hidden audit channel (right) -->
  <rect x="350" y="80" width="200" height="240" rx="10" fill="#FFF4E6" stroke="#D9883C" stroke-width="1.5" stroke-dasharray="5 3"/>
  <text x="450" y="104" text-anchor="middle" font-size="12" font-weight="700" fill="#1E3A5F">Hidden Artifacts</text>

  <!-- Eye icon -->
  <ellipse cx="450" cy="155" rx="34" ry="20" fill="#FFFFFF" stroke="#D9883C" stroke-width="1.8"/>
  <circle cx="450" cy="155" r="10" fill="#1E3A5F"/>
  <circle cx="453" cy="152" r="3" fill="#FFFFFF"/>

  <text x="450" y="208" text-anchor="middle" font-size="11" fill="#3D4F65">• checkpoints</text>
  <text x="450" y="226" text-anchor="middle" font-size="11" fill="#3D4F65">• policy rules</text>
  <text x="450" y="244" text-anchor="middle" font-size="11" fill="#3D4F65">• violation taxonomy</text>

  <text x="450" y="288" text-anchor="middle" font-size="10" font-style="italic" fill="#9C5A1F">unseen during run</text>

  <!-- Wall between -->
  <line x1="300" y1="80" x2="300" y2="320" stroke="#1E3A5F" stroke-width="1" stroke-dasharray="2 4" opacity="0.4"/>

  <!-- Judge box at bottom -->
  <rect x="200" y="350" width="200" height="50" rx="8" fill="#1E3A5F"/>
  <text x="300" y="372" text-anchor="middle" font-size="13" font-weight="700" fill="#FFFFFF">Judge</text>
  <text x="300" y="389" text-anchor="middle" font-size="10" fill="#B8CFE5">compare log vs hidden rules</text>

  <!-- Arrows to judge -->
  <path d="M 180 320 Q 220 340 250 351" fill="none" stroke="#4B8BDA" stroke-width="2" marker-end="url(#ah)"/>
  <path d="M 420 320 Q 380 340 350 351" fill="none" stroke="#D9883C" stroke-width="2" stroke-dasharray="5 3" marker-end="url(#ao)"/>
</svg>