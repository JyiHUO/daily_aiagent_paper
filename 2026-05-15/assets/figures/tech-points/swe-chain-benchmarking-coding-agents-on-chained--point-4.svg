<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 420" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4B8BDA"/>
    </marker>
  </defs>

  <text x="300" y="36" text-anchor="middle" font-size="18" font-weight="700" fill="#1E3A5F">前沿 Agent 在版本升级链上的表现</text>
  <text x="300" y="58" text-anchor="middle" font-size="12" fill="#3D4F65">只能解决一半多一点，链越大越吃力</text>

  <!-- Easy chain -->
  <g>
    <rect x="60" y="100" width="200" height="120" rx="10" fill="#EFF6FF" stroke="#4B8BDA" stroke-width="1.5"/>
    <text x="160" y="125" text-anchor="middle" font-size="13" font-weight="700" fill="#1E3A5F">小型链 · PyJWT</text>
    <rect x="90" y="150" width="140" height="18" fill="#DCE7F2" stroke="#4B8BDA" stroke-width="0.8"/>
    <rect x="90" y="150" width="95" height="18" fill="#4B8BDA"/>
    <text x="160" y="188" text-anchor="middle" font-size="22" font-weight="700" fill="#1E3A5F">~68%</text>
    <text x="160" y="208" text-anchor="middle" font-size="11" fill="#3D4F65">Resolving</text>
  </g>

  <!-- Hard chain -->
  <g>
    <rect x="340" y="100" width="200" height="120" rx="10" fill="#FFF1E6" stroke="#E8915B" stroke-width="1.5"/>
    <text x="440" y="125" text-anchor="middle" font-size="13" font-weight="700" fill="#1E3A5F">大型链 · xarray / conan</text>
    <rect x="370" y="150" width="140" height="18" fill="#F6E0CD" stroke="#E8915B" stroke-width="0.8"/>
    <rect x="370" y="150" width="32" height="18" fill="#E8915B"/>
    <text x="440" y="188" text-anchor="middle" font-size="22" font-weight="700" fill="#1E3A5F">~23%</text>
    <text x="440" y="208" text-anchor="middle" font-size="11" fill="#3D4F65">Resolving</text>
  </g>

  <!-- Gap arrow -->
  <line x1="265" y1="160" x2="335" y2="160" stroke="#4B8BDA" stroke-width="2" stroke-dasharray="5,4" marker-end="url(#ar)"/>
  <text x="300" y="152" text-anchor="middle" font-size="11" fill="#3D4F65">难度跳水</text>

  <!-- Bottom: leader -->
  <rect x="100" y="260" width="400" height="110" rx="10" fill="#F4F8FC" stroke="#4B8BDA" stroke-width="1.2"/>
  <text x="300" y="284" text-anchor="middle" font-size="13" font-weight="700" fill="#1E3A5F">领先者：Claude-Opus + Claude Code</text>

  <g>
    <text x="170" y="322" text-anchor="middle" font-weight="700" font-size="18" fill="#4B8BDA">60.8%</text>
    <text x="170" y="342" text-anchor="middle" font-size="12" fill="#3D4F65">Resolving</text>
    <text x="300" y="322" text-anchor="middle" font-weight="700" font-size="18" fill="#4B8BDA">80.6%</text>
    <text x="300" y="342" text-anchor="middle" font-size="12" fill="#3D4F65">Precision</text>
    <text x="430" y="322" text-anchor="middle" font-weight="700" font-size="18" fill="#4B8BDA">68.5%</text>
    <text x="430" y="342" text-anchor="middle" font-size="12" fill="#3D4F65">F1</text>
  </g>

  <text x="300" y="362" text-anchor="middle" font-size="11" fill="#3D4F65" font-style="italic">改得保守 (Precision 高)，但很多升级行为根本没实现</text>
</svg>