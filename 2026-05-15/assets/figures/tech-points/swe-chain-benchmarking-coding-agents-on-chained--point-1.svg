<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4B8BDA"/>
    </marker>
  </defs>

  <text x="360" y="36" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#1E3A5F">链式版本升级：上一关的代码就是下一关的起点</text>

  <!-- Version V1 -->
  <g>
    <circle cx="110" cy="180" r="50" fill="#EFF6FF" stroke="#4B8BDA" stroke-width="2"/>
    <text x="110" y="175" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#1E3A5F">V1</text>
    <text x="110" y="195" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#3D4F65">干净代码</text>
  </g>

  <!-- Version V2 -->
  <g>
    <circle cx="310" cy="180" r="50" fill="#FFF4E6" stroke="#E89B4B" stroke-width="2"/>
    <text x="310" y="175" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#1E3A5F">V2</text>
    <text x="310" y="195" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#3D4F65">带 1 处旧坑</text>
  </g>

  <!-- Version V3 -->
  <g>
    <circle cx="510" cy="180" r="50" fill="#FFF4E6" stroke="#E89B4B" stroke-width="2"/>
    <text x="510" y="175" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#1E3A5F">V3</text>
    <text x="510" y="195" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#3D4F65">坑被继承</text>
  </g>

  <!-- Continuation VN -->
  <g>
    <text x="640" y="186" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="22" fill="#3D4F65">… VN</text>
  </g>

  <!-- Arrows between versions -->
  <line x1="160" y1="180" x2="257" y2="180" stroke="#4B8BDA" stroke-width="2.2" marker-end="url(#a)"/>
  <line x1="360" y1="180" x2="457" y2="180" stroke="#4B8BDA" stroke-width="2.2" marker-end="url(#a)"/>
  <line x1="560" y1="180" x2="612" y2="180" stroke="#4B8BDA" stroke-width="2.2" marker-end="url(#a)"/>

  <!-- Arrow labels -->
  <text x="208" y="168" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#1E3A5F">Agent 升级</text>
  <text x="408" y="168" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#1E3A5F">在病代码上续写</text>

  <!-- Bug accumulation hint -->
  <text x="310" y="258" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#C0504D">●</text>
  <text x="510" y="258" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#C0504D">● ●</text>
  <text x="640" y="258" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#C0504D">● ● ●</text>
  <text x="475" y="282" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#C0504D">错误被继承并累积</text>

  <!-- Footer note -->
  <text x="360" y="330" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#3D4F65">不是一次性答题，而是连环关卡 —— 检验 Agent 的长期维护能力</text>
  <text x="360" y="352" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#3D4F65">9 个包 · 12 条链 · 155 次版本切换 · 1660 个升级任务</text>
</svg>