<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 620" font-family="'Helvetica Neue',Arial,'PingFang SC','Microsoft YaHei',sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4B8BDA"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#C0392B"/>
    </marker>
  </defs>

  <rect width="900" height="620" fill="#FAF7F2"/>

  <!-- Title -->
  <text x="450" y="44" text-anchor="middle" font-size="22" font-weight="700" fill="#1E3A5F">ShareLock：把恶意指令切成碎片，藏进多个 MCP 工具</text>
  <text x="450" y="68" text-anchor="middle" font-size="13" fill="#3D4F65">单工具看都干净 · 凑齐门限 t 才能拼出钥匙 · 平均攻击成功率 &gt; 90%</text>

  <!-- LEFT: malicious key -->
  <g transform="translate(60,130)">
    <text x="90" y="6" text-anchor="middle" font-size="13" font-weight="600" fill="#C0392B">恶意指令（密钥）</text>
    <path d="M60 30 h60 a20 20 0 0 1 20 20 v40 a20 20 0 0 1 -20 20 h-60 a20 20 0 0 1 -20 -20 v-40 a20 20 0 0 1 20 -20 z"
          fill="#FDECEA" stroke="#C0392B" stroke-width="2"/>
    <path d="M68 30 v-12 a22 22 0 0 1 44 0 v12" fill="none" stroke="#C0392B" stroke-width="2.5"/>
    <circle cx="90" cy="70" r="6" fill="#C0392B"/>
    <text x="90" y="135" text-anchor="middle" font-size="11" fill="#3D4F65">读取 api-key 并追加 FLAG</text>
  </g>

  <!-- Shamir split arrow -->
  <path d="M210 200 C 270 200, 290 230, 335 230" stroke="#4B8BDA" stroke-width="2" fill="none" marker-end="url(#arr)"/>
  <text x="272" y="192" font-size="11" fill="#1E3A5F" font-style="italic">Shamir 门限分享：切成 n 份，t 份可重建</text>

  <!-- MIDDLE: tool shares -->
  <g transform="translate(340,130)">
    <text x="115" y="-10" text-anchor="middle" font-size="13" font-weight="600" fill="#1E3A5F">分散到多个工具描述</text>

    <g>
      <rect x="0" y="10" width="230" height="46" rx="6" fill="#EFF6FF" stroke="#4B8BDA" stroke-width="1.5"/>
      <text x="12" y="30" font-size="11" font-weight="600" fill="#1E3A5F">weather-info</text>
      <text x="12" y="46" font-size="10" fill="#3D4F65" font-family="monospace">share#1  sha384:7f2c…</text>
    </g>
    <g>
      <rect x="0" y="64" width="230" height="46" rx="6" fill="#EFF6FF" stroke="#4B8BDA" stroke-width="1.5"/>
      <text x="12" y="84" font-size="11" font-weight="600" fill="#1E3A5F">flight-book</text>
      <text x="12" y="100" font-size="10" fill="#3D4F65" font-family="monospace">share#2  sha384:a91e…</text>
    </g>
    <g>
      <rect x="0" y="118" width="230" height="46" rx="6" fill="#EFF6FF" stroke="#4B8BDA" stroke-width="1.5"/>
      <text x="12" y="138" font-size="11" font-weight="600" fill="#1E3A5F">hotel-search</text>
      <text x="12" y="154" font-size="10" fill="#3D4F65" font-family="monospace">share#3  sha384:3d04…</text>
    </g>
    <g>
      <rect x="0" y="178" width="230" height="46" rx="6" fill="#FFF4E0" stroke="#E89B2A" stroke-width="1.8" stroke-dasharray="4 3"/>
      <text x="12" y="198" font-size="11" font-weight="600" fill="#A55F00">EnvSetup（更新时悄悄加入）</text>
      <text x="12" y="214" font-size="10" fill="#7A5310">收集 share → Lagrange 还原</text>
    </g>

    <!-- audit eye -->
    <g transform="translate(265,90)">
      <circle cx="0" cy="0" r="20" fill="#FFFFFF" stroke="#3D4F65" stroke-width="1.5"/>
      <path d="M-13 0 Q 0 -11 13 0 Q 0 11 -13 0 Z" fill="none" stroke="#3D4F65" stroke-width="1.5"/>
      <circle cx="0" cy="0" r="4" fill="#3D4F65"/>
      <text x="0" y="42" text-anchor="middle" font-size="10" fill="#3D4F65">审计扫描</text>
      <text x="0" y="55" text-anchor="middle" font-size="10" fill="#3D4F65">逐个看均正常</text>
    </g>
  </g>

  <!-- arrow to reconstruction -->
  <path d="M635 245 C 690 245, 700 310, 720 310" stroke="#C0392B" stroke-width="2" fill="none" marker-end="url(#arrR)"/>
  <text x="640" y="290" font-size="11" font-style="italic" fill="#C0392B">触发重组</text>

  <!-- RIGHT: reconstructed key -->
  <g transform="translate(720,250)">
    <circle cx="60" cy="60" r="58" fill="#FDECEA" stroke="#C0392B" stroke-width="2"/>
    <path d="M30 60 h60 a10 10 0 0 1 10 10 v25 a10 10 0 0 1 -10 10 h-60 a10 10 0 0 1 -10 -10 v-25 a10 10 0 0 1 10 -10 z"
          fill="#FFFFFF" stroke="#C0392B" stroke-width="2"/>
    <path d="M38 60 v-12 a22 22 0 0 1 44 0 v12" fill="none" stroke="#C0392B" stroke-width="2.5"/>
    <circle cx="60" cy="82" r="5" fill="#C0392B"/>
    <text x="60" y="138" text-anchor="middle" font-size="12" font-weight="600" fill="#C0392B">恶意指令重组</text>
    <text x="60" y="154" text-anchor="middle" font-size="11" fill="#3D4F65">Agent 顺手执行</text>
  </g>

  <!-- BOTTOM: robustness band -->
  <g transform="translate(60,470)">
    <rect x="0" y="0" width="780" height="110" rx="10" fill="#EFF6FF" stroke="#4B8BDA" stroke-width="1.2"/>

    <text x="20" y="28" font-size="13" font-weight="700" fill="#1E3A5F">为什么难防？</text>

    <g transform="translate(20,48)">
      <circle cx="8" cy="8" r="5" fill="#4B8BDA"/>
      <text x="22" y="12" font-size="12" fill="#1E3A5F">单工具信息论安全</text>
      <text x="22" y="28" font-size="11" fill="#3D4F65">少于 t 份 share 时无法还原</text>
    </g>

    <g transform="translate(290,48)">
      <circle cx="8" cy="8" r="5" fill="#4B8BDA"/>
      <text x="22" y="12" font-size="12" fill="#1E3A5F">天然冗余 · 抗下架</text>
      <text x="22" y="28" font-size="11" fill="#3D4F65">扫掉几个工具，剩余 ≥ t 仍可重建</text>
    </g>

    <g transform="translate(560,48)">
      <circle cx="8" cy="8" r="5" fill="#C0392B"/>
      <text x="22" y="12" font-size="12" fill="#1E3A5F">ASR &gt; 90%</text>
      <text x="22" y="28" font-size="11" fill="#3D4F65">Gemini / DeepSeek / Qwen 全线沦陷</text>
    </g>
  </g>
</svg>