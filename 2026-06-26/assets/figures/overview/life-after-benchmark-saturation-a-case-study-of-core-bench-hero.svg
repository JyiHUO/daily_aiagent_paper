<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 640" font-family="'Helvetica Neue',Arial,'PingFang SC','Microsoft YaHei',sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4B8BDA"/>
    </marker>
    <marker id="arrL" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#9AA8BC"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="500" y="46" text-anchor="middle" font-size="22" font-weight="700" fill="#1E3A5F">基准饱和之后：CORE-Bench 还能告诉我们什么</text>
  <text x="500" y="70" text-anchor="middle" font-size="13" fill="#3D4F65">当 accuracy 撞顶，把视线移到剩下六个维度</text>

  <!-- Center: saturated benchmark icon -->
  <g>
    <circle cx="430" cy="340" r="92" fill="#FFF4E6" stroke="#E8A33D" stroke-width="2.5"/>
    <text x="430" y="320" text-anchor="middle" font-size="14" fill="#7A4A12">准确率</text>
    <text x="430" y="350" text-anchor="middle" font-size="34" font-weight="700" fill="#1E3A5F">97%</text>
    <text x="430" y="376" text-anchor="middle" font-size="12" fill="#9C6A1E">已饱和 · 看不出差异</text>
    <line x1="360" y1="296" x2="500" y2="296" stroke="#E8A33D" stroke-width="2" stroke-dasharray="4 3"/>
    <text x="430" y="288" text-anchor="middle" font-size="10" fill="#B07520">天花板</text>
  </g>

  <!-- Left: retire &amp; replace (old paradigm) -->
  <g>
    <rect x="30" y="270" width="170" height="140" rx="10" fill="#F1F3F7" stroke="#9AA8BC" stroke-width="1.5"/>
    <text x="115" y="300" text-anchor="middle" font-size="13" font-weight="700" fill="#54647A">旧做法</text>
    <text x="115" y="324" text-anchor="middle" font-size="12" fill="#54647A">retire &amp; replace</text>
    <text x="115" y="346" text-anchor="middle" font-size="11" fill="#8493A8">换更难的题继续刷榜</text>
    <text x="115" y="368" text-anchor="middle" font-size="11" fill="#8493A8">丢掉饱和后的全部信号</text>
  </g>
  <line x1="200" y1="340" x2="335" y2="340" stroke="#9AA8BC" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrL)"/>
  <text x="267" y="332" text-anchor="middle" font-size="10" fill="#8493A8">直接丢弃</text>

  <!-- Right side: 6 dimensions -->
  <g font-size="12" fill="#1E3A5F">
    <g>
      <rect x="660" y="80" width="280" height="56" rx="10" fill="#EFF6FF" stroke="#4B8BDA" stroke-width="1.5"/>
      <text x="800" y="103" text-anchor="middle" font-weight="700">① 构造效度 / shortcut</text>
      <text x="800" y="122" text-anchor="middle" font-size="11" fill="#3D4F65">强 Agent 暴露 benchmark bug</text>
    </g>
    <g>
      <rect x="660" y="158" width="280" height="56" rx="10" fill="#EFF6FF" stroke="#4B8BDA" stroke-width="1.5"/>
      <text x="800" y="181" text-anchor="middle" font-weight="700">② 分布外泛化 (OOD)</text>
      <text x="800" y="200" text-anchor="middle" font-size="11" fill="#3D4F65">新建 19 题跨学科套件</text>
    </g>
    <g>
      <rect x="660" y="236" width="280" height="56" rx="10" fill="#EFF6FF" stroke="#4B8BDA" stroke-width="1.5"/>
      <text x="800" y="259" text-anchor="middle" font-weight="700">③ 效率 (token / $)</text>
      <text x="800" y="278" text-anchor="middle" font-size="11" fill="#3D4F65">同分模型成本差 60%</text>
    </g>
    <g>
      <rect x="660" y="314" width="280" height="56" rx="10" fill="#EFF6FF" stroke="#4B8BDA" stroke-width="1.5"/>
      <text x="800" y="337" text-anchor="middle" font-weight="700">④ 可靠性 &amp; 校准</text>
      <text x="800" y="356" text-anchor="middle" font-size="11" fill="#3D4F65">置信度 AUROC ≈ 随机</text>
    </g>
    <g>
      <rect x="660" y="392" width="280" height="56" rx="10" fill="#EFF6FF" stroke="#4B8BDA" stroke-width="1.5"/>
      <text x="800" y="415" text-anchor="middle" font-weight="700">⑤ 模型 vs 脚手架</text>
      <text x="800" y="434" text-anchor="middle" font-size="11" fill="#3D4F65">同模型换 scaffold 差 44 pt</text>
    </g>
    <g>
      <rect x="660" y="470" width="280" height="56" rx="10" fill="#EFF6FF" stroke="#4B8BDA" stroke-width="1.5"/>
      <text x="800" y="493" text-anchor="middle" font-weight="700">⑥ 人机协作 uplift</text>
      <text x="800" y="512" text-anchor="middle" font-size="11" fill="#3D4F65">复现耗时 ↓ 2.11×</text>
    </g>
  </g>

  <!-- arrows from center to dimensions -->
  <g fill="none" stroke="#4B8BDA" stroke-width="1.6">
    <path d="M500,285 C570,210 610,140 660,112" marker-end="url(#arr)"/>
    <path d="M515,310 C580,250 610,200 660,186" marker-end="url(#arr)"/>
    <path d="M522,335 C580,290 610,275 660,266" marker-end="url(#arr)"/>
    <path d="M522,348 C580,360 610,345 660,342" marker-end="url(#arr)"/>
    <path d="M515,372 C580,420 610,400 660,418" marker-end="url(#arr)"/>
    <path d="M500,395 C570,470 610,490 660,498" marker-end="url(#arr)"/>
  </g>

  <!-- new paradigm label -->
  <text x="940" y="560" text-anchor="end" font-size="12" font-weight="700" fill="#1E3A5F">新范式：在饱和之后继续榨取信号</text>

  <!-- bottom note -->
  <text x="500" y="610" text-anchor="middle" font-size="11" fill="#8493A8">案例：CORE-Bench Hard → v1.1（修 35 个任务） + OOD 套件</text>
</svg>