<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 620" font-family="'PingFang SC','Helvetica Neue',Arial,sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4B8BDA"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#D97757"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="450" y="42" text-anchor="middle" font-size="22" font-weight="700" fill="#1E3A5F">验证的地平线：编码 Agent 奖励没有银弹</text>
  <text x="450" y="66" text-anchor="middle" font-size="13" fill="#3D4F65">verifier 必须与 generator 共同演化 · co-evolution</text>

  <!-- Left: Generator -->
  <g>
    <circle cx="160" cy="300" r="72" fill="#EFF6FF" stroke="#4B8BDA" stroke-width="2"/>
    <text x="160" y="290" text-anchor="middle" font-size="16" font-weight="700" fill="#1E3A5F">生成器</text>
    <text x="160" y="310" text-anchor="middle" font-size="12" fill="#3D4F65">Coding Agent</text>
    <text x="160" y="328" text-anchor="middle" font-size="11" fill="#3D4F65">能力持续增长 ↑</text>
  </g>

  <!-- Right: Verifier -->
  <g>
    <circle cx="740" cy="300" r="72" fill="#FFF4ED" stroke="#D97757" stroke-width="2"/>
    <text x="740" y="290" text-anchor="middle" font-size="16" font-weight="700" fill="#1E3A5F">验证器</text>
    <text x="740" y="310" text-anchor="middle" font-size="12" fill="#3D4F65">代理 ≠ 用户意图</text>
    <text x="740" y="328" text-anchor="middle" font-size="11" fill="#3D4F65">易被 hack / 饱和</text>
  </g>

  <!-- Arrows -->
  <path d="M 232 278 Q 450 210 668 278" stroke="#4B8BDA" stroke-width="2.2" fill="none" marker-end="url(#arr)"/>
  <text x="450" y="220" text-anchor="middle" font-size="12" fill="#1E3A5F">候选方案 / trajectory</text>

  <path d="M 668 322 Q 450 392 232 322" stroke="#D97757" stroke-width="2.2" fill="none" marker-end="url(#arrR)"/>
  <text x="450" y="386" text-anchor="middle" font-size="12" fill="#1E3A5F">奖励信号（可能失真）</text>

  <!-- Center triangle -->
  <g transform="translate(450,308)">
    <polygon points="0,-50 -54,32 54,32" fill="#FFFFFF" stroke="#1E3A5F" stroke-width="1.8"/>
    <text x="0" y="-58" text-anchor="middle" font-size="12" font-weight="700" fill="#1E3A5F">三难权衡</text>
    <text x="0" y="-30" text-anchor="middle" font-size="11" fill="#1E3A5F">可扩展</text>
    <text x="-50" y="48" text-anchor="end" font-size="11" fill="#1E3A5F">忠实</text>
    <text x="50" y="48" text-anchor="start" font-size="11" fill="#1E3A5F">鲁棒</text>
  </g>

  <!-- Bottom: four verifier instantiations -->
  <g font-size="11.5" fill="#1E3A5F">
    <rect x="90" y="470" width="170" height="68" rx="10" fill="#EFF6FF" stroke="#4B8BDA" stroke-width="1.4"/>
    <text x="175" y="492" text-anchor="middle" font-weight="700">单测 + 行为监控</text>
    <text x="175" y="511" text-anchor="middle" fill="#3D4F65">通用代码任务</text>
    <text x="175" y="528" text-anchor="middle" fill="#B5532C" font-weight="700">hack 率 28.57% → 0.56%</text>

    <rect x="275" y="470" width="170" height="68" rx="10" fill="#EFF6FF" stroke="#4B8BDA" stroke-width="1.4"/>
    <text x="360" y="492" text-anchor="middle" font-weight="700">交互式 Rubric Judge</text>
    <text x="360" y="511" text-anchor="middle" fill="#3D4F65">前端 · 真实浏览器</text>
    <text x="360" y="528" text-anchor="middle" fill="#B5532C" font-weight="700">WebDev 78 → 84</text>

    <rect x="460" y="470" width="170" height="68" rx="10" fill="#EFF6FF" stroke="#4B8BDA" stroke-width="1.4"/>
    <text x="545" y="492" text-anchor="middle" font-weight="700">用户隐式反馈</text>
    <text x="545" y="511" text-anchor="middle" fill="#3D4F65">真实多轮交互</text>
    <text x="545" y="528" text-anchor="middle" fill="#B5532C" font-weight="700">私有 bench +13.3pp</text>

    <rect x="645" y="470" width="170" height="68" rx="10" fill="#EFF6FF" stroke="#4B8BDA" stroke-width="1.4"/>
    <text x="730" y="492" text-anchor="middle" font-weight="700">Agent-as-Verifier</text>
    <text x="730" y="511" text-anchor="middle" fill="#3D4F65">长程任务</text>
    <text x="730" y="528" text-anchor="middle" fill="#3D4F65">自动化评测闭环</text>
  </g>

  <!-- Connector from verifier circle down to the row of boxes -->
  <path d="M 740 372 L 740 430 L 175 430 L 175 470" stroke="#4B8BDA" stroke-width="1.2" fill="none" opacity="0.5"/>
  <path d="M 360 430 L 360 470" stroke="#4B8BDA" stroke-width="1.2" fill="none" opacity="0.5"/>
  <path d="M 545 430 L 545 470" stroke="#4B8BDA" stroke-width="1.2" fill="none" opacity="0.5"/>
  <path d="M 730 430 L 730 470" stroke="#4B8BDA" stroke-width="1.2" fill="none" opacity="0.5"/>

  <!-- Footer -->
  <text x="450" y="580" text-anchor="middle" font-size="12" fill="#3D4F65">没有固定奖励能永远有效 — 验证器必须随策略持续演化</text>
</svg>