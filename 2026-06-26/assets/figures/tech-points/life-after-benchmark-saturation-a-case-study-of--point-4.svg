<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 420" font-family="Helvetica, Arial, sans-serif">
  <!-- Title -->
  <text x="300" y="38" text-anchor="middle" font-size="20" font-weight="700" fill="#1E3A5F">Human vs Human + Agent</text>
  <text x="300" y="60" text-anchor="middle" font-size="13" fill="#3D4F65">replicating papers under a 3h limit</text>

  <!-- Human bar -->
  <g>
    <text x="90" y="135" font-size="14" font-weight="600" fill="#1E3A5F">Human</text>
    <rect x="90" y="150" width="380" height="44" rx="6" fill="#FCE7D2" stroke="#D9884A" stroke-width="1.5"/>
    <text x="280" y="178" text-anchor="middle" font-size="14" fill="#1E3A5F">long hours — 1 in 5 unfinished at 3h</text>
    <!-- clock icon -->
    <circle cx="495" cy="172" r="16" fill="none" stroke="#D9884A" stroke-width="2"/>
    <line x1="495" y1="172" x2="495" y2="161" stroke="#D9884A" stroke-width="2"/>
    <line x1="495" y1="172" x2="503" y2="178" stroke="#D9884A" stroke-width="2"/>
  </g>

  <!-- Human + Agent bar -->
  <g>
    <text x="90" y="245" font-size="14" font-weight="600" fill="#1E3A5F">Human + Agent</text>
    <rect x="90" y="260" width="180" height="44" rx="6" fill="#EFF6FF" stroke="#4B8BDA" stroke-width="1.5"/>
    <text x="180" y="288" text-anchor="middle" font-size="14" fill="#1E3A5F">all 25 finished</text>
    <!-- clock icon smaller -->
    <circle cx="295" cy="282" r="12" fill="none" stroke="#4B8BDA" stroke-width="2"/>
    <line x1="295" y1="282" x2="295" y2="273" stroke="#4B8BDA" stroke-width="2"/>
    <line x1="295" y1="282" x2="301" y2="285" stroke="#4B8BDA" stroke-width="2"/>
  </g>

  <!-- Speedup callout -->
  <g>
    <rect x="360" y="250" width="180" height="70" rx="10" fill="#E6F0FB" stroke="#4B8BDA" stroke-width="1.5"/>
    <text x="450" y="282" text-anchor="middle" font-size="22" font-weight="700" fill="#1E3A5F">2.11× faster</text>
    <text x="450" y="304" text-anchor="middle" font-size="12" fill="#3D4F65">p = 0.00176 (lower bound)</text>
  </g>

  <!-- Bottom takeaway -->
  <text x="300" y="370" text-anchor="middle" font-size="13" font-weight="600" fill="#1E3A5F">Saturated accuracy, yet real human uplift is measurable</text>
  <text x="300" y="392" text-anchor="middle" font-size="12" fill="#3D4F65" font-style="italic">Agent helps most with: Docker setup · running code · finding entry script</text>
</svg>