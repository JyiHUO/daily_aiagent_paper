<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4B8BDA"/>
    </marker>
    <marker id="ar2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#D97757"/>
    </marker>
  </defs>

  <text x="300" y="36" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="18" font-weight="700" fill="#1E3A5F">饱和后，漏洞才显形</text>

  <!-- Left: weak agent -->
  <g>
    <rect x="40" y="80" width="200" height="240" rx="12" fill="#F3F4F6" stroke="#9CA3AF" stroke-width="1.5"/>
    <text x="140" y="108" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="14" font-weight="700" fill="#3D4F65">弱 Agent</text>

    <!-- fence (benchmark) with hole -->
    <line x1="70" y1="220" x2="210" y2="220" stroke="#3D4F65" stroke-width="2"/>
    <line x1="80" y1="160" x2="80" y2="220" stroke="#3D4F65" stroke-width="2"/>
    <line x1="110" y1="160" x2="110" y2="220" stroke="#3D4F65" stroke-width="2"/>
    <line x1="170" y1="160" x2="170" y2="220" stroke="#3D4F65" stroke-width="2"/>
    <line x1="200" y1="160" x2="200" y2="220" stroke="#3D4F65" stroke-width="2"/>
    <line x1="70" y1="170" x2="120" y2="170" stroke="#3D4F65" stroke-width="2"/>
    <line x1="160" y1="170" x2="210" y2="170" stroke="#3D4F65" stroke-width="2"/>

    <!-- agent dot, far from fence -->
    <circle cx="140" cy="275" r="14" fill="#4B8BDA"/>
    <text x="140" y="308" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#3D4F65">走不到围栏</text>
    <text x="140" y="140" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#9CA3AF">漏洞隐藏</text>
  </g>

  <!-- Right: strong agent finds shortcut -->
  <g>
    <rect x="360" y="80" width="200" height="240" rx="12" fill="#FEF3E2" stroke="#E0A66B" stroke-width="1.5"/>
    <text x="460" y="108" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="14" font-weight="700" fill="#1E3A5F">顶级 Agent</text>

    <!-- same fence -->
    <line x1="390" y1="220" x2="530" y2="220" stroke="#3D4F65" stroke-width="2"/>
    <line x1="400" y1="160" x2="400" y2="220" stroke="#3D4F65" stroke-width="2"/>
    <line x1="430" y1="160" x2="430" y2="220" stroke="#3D4F65" stroke-width="2"/>
    <line x1="490" y1="160" x2="490" y2="220" stroke="#3D4F65" stroke-width="2"/>
    <line x1="520" y1="160" x2="520" y2="220" stroke="#3D4F65" stroke-width="2"/>
    <line x1="390" y1="170" x2="440" y2="170" stroke="#3D4F65" stroke-width="2"/>
    <line x1="480" y1="170" x2="530" y2="170" stroke="#3D4F65" stroke-width="2"/>

    <!-- agent dot near gap, arrow through -->
    <circle cx="460" cy="275" r="14" fill="#D97757"/>
    <path d="M460,261 L460,196" stroke="#D97757" stroke-width="2.5" stroke-dasharray="5,4" fill="none" marker-end="url(#ar2)"/>
    <text x="460" y="148" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#1E3A5F" font-weight="600">抄近路</text>
    <text x="460" y="308" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#3D4F65">找到漏洞</text>
  </g>

  <!-- Middle arrow: same benchmark -->
  <path d="M250,200 L350,200" stroke="#4B8BDA" stroke-width="2" fill="none" marker-end="url(#ar)"/>
  <text x="300" y="192" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#3D4F65">同一 benchmark</text>

  <!-- Bottom takeaway -->
  <text x="300" y="365" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13" fill="#1E3A5F" font-weight="600">准确率饱和 = 发现 benchmark 漏洞的最佳时机</text>
</svg>