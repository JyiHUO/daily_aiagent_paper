<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 420" font-family="Helvetica, Arial, sans-serif">
  <text x="300" y="38" text-anchor="middle" font-size="17" font-weight="bold" fill="#1E3A5F">Same Accuracy, Different Agents</text>

  <g>
    <rect x="80" y="70" width="180" height="60" rx="8" fill="#EFF6FF" stroke="#4B8BDA" stroke-width="1.5"/>
    <text x="170" y="95" text-anchor="middle" font-size="13" fill="#1E3A5F">Agent A</text>
    <text x="170" y="118" text-anchor="middle" font-size="16" font-weight="bold" fill="#1E3A5F">97.4%</text>

    <rect x="340" y="70" width="180" height="60" rx="8" fill="#EFF6FF" stroke="#4B8BDA" stroke-width="1.5"/>
    <text x="430" y="95" text-anchor="middle" font-size="13" fill="#1E3A5F">Agent B</text>
    <text x="430" y="118" text-anchor="middle" font-size="16" font-weight="bold" fill="#1E3A5F">97.4%</text>

    <text x="300" y="108" text-anchor="middle" font-size="22" font-weight="bold" fill="#C97A4A">=</text>
  </g>

  <g transform="translate(300,180)">
    <circle cx="0" cy="0" r="26" fill="#FFFFFF" stroke="#1E3A5F" stroke-width="2.5"/>
    <line x1="18" y1="18" x2="34" y2="34" stroke="#1E3A5F" stroke-width="3" stroke-linecap="round"/>
  </g>
  <text x="300" y="234" text-anchor="middle" font-size="11" fill="#3D4F65" font-style="italic">look deeper</text>

  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4B8BDA"/>
    </marker>
  </defs>
  <g stroke="#4B8BDA" stroke-width="1.5" fill="none" marker-end="url(#ar)">
    <line x1="282" y1="200" x2="130" y2="268"/>
    <line x1="293" y1="207" x2="230" y2="268"/>
    <line x1="307" y1="207" x2="365" y2="268"/>
    <line x1="318" y1="200" x2="470" y2="268"/>
  </g>

  <g font-size="12" fill="#1E3A5F">
    <rect x="50" y="270" width="115" height="70" rx="6" fill="#FFF4E6" stroke="#C97A4A" stroke-width="1.3"/>
    <text x="107" y="298" text-anchor="middle" font-weight="bold">Cost</text>
    <text x="107" y="320" text-anchor="middle" font-size="10" fill="#3D4F65">−60% tokens</text>

    <rect x="178" y="270" width="115" height="70" rx="6" fill="#FFF4E6" stroke="#C97A4A" stroke-width="1.3"/>
    <text x="235" y="298" text-anchor="middle" font-weight="bold">Reliability</text>
    <text x="235" y="320" text-anchor="middle" font-size="10" fill="#3D4F65">consistency</text>

    <rect x="306" y="270" width="115" height="70" rx="6" fill="#FFF4E6" stroke="#C97A4A" stroke-width="1.3"/>
    <text x="363" y="298" text-anchor="middle" font-weight="bold">Calibration</text>
    <text x="363" y="320" text-anchor="middle" font-size="10" fill="#3D4F65">93% vs 32%</text>

    <rect x="434" y="270" width="115" height="70" rx="6" fill="#FFF4E6" stroke="#C97A4A" stroke-width="1.3"/>
    <text x="491" y="298" text-anchor="middle" font-weight="bold">Discrimination</text>
    <text x="491" y="320" text-anchor="middle" font-size="10" fill="#3D4F65">AUROC ≈ random</text>
  </g>

  <text x="300" y="380" text-anchor="middle" font-size="12" font-weight="bold" fill="#1E3A5F">Benchmark lives on beyond saturated accuracy</text>
</svg>