<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" font-family="-apple-system, sans-serif">
  <defs>
    <marker id="redArr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#C97B5C"/>
    </marker>
    <marker id="blueArr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4B8BDA"/>
    </marker>
    <marker id="darkArr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1E3A5F"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="400" y="40" text-anchor="middle" font-size="20" font-weight="600" fill="#1E3A5F">Static Judge vs Interactive Judge</text>
  <text x="400" y="62" text-anchor="middle" font-size="13" fill="#3D4F65">奖励信号锚在「页面真的能交互」</text>

  <!-- LEFT: Static judge -->
  <g>
    <rect x="60" y="100" width="290" height="340" rx="14" fill="#FFF4E6" stroke="#E8A87C" stroke-width="1.5"/>
    <text x="205" y="128" text-anchor="middle" font-size="14" font-weight="600" fill="#1E3A5F">Static Judge</text>

    <!-- screenshot frame -->
    <rect x="115" y="150" width="180" height="115" rx="4" fill="#FFFFFF" stroke="#C97B5C" stroke-width="1.5"/>
    <rect x="130" y="170" width="100" height="10" fill="#FBD8C2"/>
    <rect x="130" y="190" width="150" height="8" fill="#FBD8C2"/>
    <rect x="130" y="206" width="120" height="8" fill="#FBD8C2"/>
    <text x="205" y="250" text-anchor="middle" font-size="11" fill="#8C5A3F">screenshot + code</text>

    <text x="205" y="300" text-anchor="middle" font-size="12" fill="#3D4F65">堆 CSS / JS → 刷分</text>
    <path d="M 130 320 L 280 320" stroke="#C97B5C" stroke-width="2" marker-end="url(#redArr)"/>
    <text x="205" y="358" text-anchor="middle" font-size="13" font-weight="600" fill="#C25A3E">length exploitation</text>
    <text x="205" y="400" text-anchor="middle" font-size="11" fill="#8C5A3F">长度膨胀 · 分数停滞</text>
  </g>

  <!-- RIGHT: Interactive judge -->
  <g>
    <rect x="450" y="100" width="290" height="340" rx="14" fill="#EFF6FF" stroke="#4B8BDA" stroke-width="1.5"/>
    <text x="595" y="128" text-anchor="middle" font-size="14" font-weight="600" fill="#1E3A5F">Interactive Judge</text>

    <!-- browser window -->
    <rect x="505" y="150" width="180" height="115" rx="4" fill="#FFFFFF" stroke="#4B8BDA" stroke-width="1.5"/>
    <circle cx="517" cy="162" r="3" fill="#E8A87C"/>
    <circle cx="527" cy="162" r="3" fill="#F0C674"/>
    <circle cx="537" cy="162" r="3" fill="#8AB97A"/>
    <line x1="505" y1="172" x2="685" y2="172" stroke="#4B8BDA" stroke-width="1"/>

    <!-- click button + cursor -->
    <rect x="540" y="200" width="60" height="22" rx="3" fill="#4B8BDA"/>
    <text x="570" y="216" text-anchor="middle" font-size="11" fill="#FFFFFF">Click</text>
    <path d="M 605 222 l 8 8 l -4 1 l 3 6 l -3 1 l -3 -6 l -3 3 z" fill="#1E3A5F"/>

    <text x="595" y="250" text-anchor="middle" font-size="11" fill="#3D4F65">Playwright · 真实浏览器</text>

    <text x="595" y="300" text-anchor="middle" font-size="12" fill="#3D4F65">录屏 + DOM 变化</text>
    <path d="M 520 320 L 670 320" stroke="#4B8BDA" stroke-width="2" marker-end="url(#blueArr)"/>
    <text x="595" y="358" text-anchor="middle" font-size="13" font-weight="600" fill="#1E5BA8">runtime grounded</text>
    <text x="595" y="400" text-anchor="middle" font-size="11" fill="#3D4F65">长度稳定 · 分数上升</text>
  </g>

  <!-- center arrow -->
  <path d="M 358 260 L 442 260" stroke="#1E3A5F" stroke-width="2.5" marker-end="url(#darkArr)"/>
  <text x="400" y="252" text-anchor="middle" font-size="11" font-weight="600" fill="#1E3A5F">升级</text>
</svg>