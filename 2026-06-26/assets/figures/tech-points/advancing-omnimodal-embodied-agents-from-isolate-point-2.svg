<svg xmlns="http://www.w3.org/2000/svg" width="720" height="480" viewBox="0 0 720 480">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4B8BDA"/>
    </marker>
  </defs>

  <text x="360" y="42" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC','Hiragino Sans GB',sans-serif" font-size="20" font-weight="700" fill="#1E3A5F">事件边界驱动的分层记忆</text>
  <text x="360" y="64" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC','Hiragino Sans GB',sans-serif" font-size="12" fill="#3D4F65">在子任务边界压缩，长程对话 token 不爆炸（160k → 4–8k）</text>

  <!-- 左：原始流标签 -->
  <text x="80" y="108" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC','Hiragino Sans GB',sans-serif" font-size="13" font-weight="600" fill="#1E3A5F">原始观测流 (Sensory)</text>

  <!-- 帧序列 -->
  <g stroke="#C9D6E5" stroke-width="1" fill="#EFF6FF">
    <rect x="80" y="125" width="18" height="42" rx="2"/>
    <rect x="102" y="125" width="18" height="42" rx="2"/>
    <rect x="124" y="125" width="18" height="42" rx="2"/>
    <rect x="146" y="125" width="18" height="42" rx="2"/>
    <rect x="168" y="125" width="18" height="42" rx="2"/>
    <rect x="190" y="125" width="18" height="42" rx="2"/>
    <rect x="212" y="125" width="18" height="42" rx="2"/>
    <rect x="234" y="125" width="18" height="42" rx="2"/>
    <rect x="256" y="125" width="18" height="42" rx="2"/>
    <rect x="278" y="125" width="18" height="42" rx="2"/>
    <rect x="300" y="125" width="18" height="42" rx="2"/>
    <rect x="322" y="125" width="18" height="42" rx="2"/>
    <rect x="344" y="125" width="18" height="42" rx="2"/>
    <rect x="366" y="125" width="18" height="42" rx="2"/>
    <rect x="388" y="125" width="18" height="42" rx="2"/>
    <rect x="410" y="125" width="18" height="42" rx="2"/>
    <rect x="432" y="125" width="18" height="42" rx="2"/>
    <rect x="454" y="125" width="18" height="42" rx="2"/>
    <rect x="476" y="125" width="18" height="42" rx="2"/>
    <rect x="498" y="125" width="18" height="42" rx="2"/>
    <rect x="520" y="125" width="18" height="42" rx="2"/>
    <rect x="542" y="125" width="18" height="42" rx="2"/>
    <rect x="564" y="125" width="18" height="42" rx="2"/>
    <rect x="586" y="125" width="18" height="42" rx="2"/>
    <rect x="608" y="125" width="18" height="42" rx="2"/>
    <rect x="630" y="125" width="18" height="42" rx="2"/>
  </g>

  <!-- 事件边界剪刀线 -->
  <g stroke="#E07B5C" stroke-width="2" stroke-dasharray="3,3">
    <line x1="220" y1="120" x2="220" y2="175"/>
    <line x1="395" y1="120" x2="395" y2="175"/>
    <line x1="570" y1="120" x2="570" y2="175"/>
  </g>
  <text x="395" y="118" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC','Hiragino Sans GB',sans-serif" font-size="11" fill="#E07B5C">↓ 事件边界（子任务完成 / 状态变化）</text>

  <!-- 压缩箭头 -->
  <line x1="150" y1="180" x2="150" y2="228" stroke="#4B8BDA" stroke-width="2" marker-end="url(#ar)"/>
  <line x1="307" y1="180" x2="307" y2="228" stroke="#4B8BDA" stroke-width="2" marker-end="url(#ar)"/>
  <line x1="482" y1="180" x2="482" y2="228" stroke="#4B8BDA" stroke-width="2" marker-end="url(#ar)"/>

  <!-- Episodic keyframes -->
  <g>
    <circle cx="150" cy="252" r="22" fill="#DCE9F8" stroke="#4B8BDA" stroke-width="1.5"/>
    <text x="150" y="256" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC','Hiragino Sans GB',sans-serif" font-size="11" fill="#1E3A5F">keyframe</text>
    <circle cx="307" cy="252" r="22" fill="#DCE9F8" stroke="#4B8BDA" stroke-width="1.5"/>
    <text x="307" y="256" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC','Hiragino Sans GB',sans-serif" font-size="11" fill="#1E3A5F">keyframe</text>
    <circle cx="482" cy="252" r="22" fill="#DCE9F8" stroke="#4B8BDA" stroke-width="1.5"/>
    <text x="482" y="256" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC','Hiragino Sans GB',sans-serif" font-size="11" fill="#1E3A5F">keyframe</text>
  </g>
  <text x="75" y="256" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC','Hiragino Sans GB',sans-serif" font-size="12" font-weight="600" fill="#1E3A5F" text-anchor="end">Episodic</text>

  <!-- Reflective 常驻约束 -->
  <rect x="60" y="305" width="600" height="60" rx="6" fill="#FFF1E6" stroke="#E07B5C" stroke-width="1.5"/>
  <text x="75" y="328" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC','Hiragino Sans GB',sans-serif" font-size="13" font-weight="600" fill="#1E3A5F">Reflective 常驻约束</text>
  <text x="75" y="352" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC','Hiragino Sans GB',sans-serif" font-size="12" fill="#3D4F65">"no sugar" · 用户偏好 · 失败根因+纠正策略 · 工具 schema</text>

  <!-- 规划器 -->
  <rect x="240" y="400" width="240" height="50" rx="8" fill="#1E3A5F"/>
  <text x="360" y="430" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC','Hiragino Sans GB',sans-serif" font-size="14" font-weight="600" fill="#FFFFFF">规划器（输入稳定 4–8k token）</text>

  <!-- 注入箭头：episodic 与 reflective 都汇入规划器 -->
  <line x1="307" y1="274" x2="320" y2="305" stroke="#4B8BDA" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#ar)"/>
  <line x1="360" y1="365" x2="360" y2="398" stroke="#4B8BDA" stroke-width="2" marker-end="url(#ar)"/>
</svg>