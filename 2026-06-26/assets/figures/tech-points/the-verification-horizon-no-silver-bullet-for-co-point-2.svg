<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 420" font-family="-apple-system,Helvetica,Arial,sans-serif">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4B8BDA"/>
    </marker>
    <marker id="arR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#C0504D"/>
    </marker>
  </defs>

  <text x="300" y="36" text-anchor="middle" font-size="18" font-weight="600" fill="#1E3A5F">不只看结果，也看过程</text>
  <text x="300" y="58" text-anchor="middle" font-size="12" fill="#3D4F65">Behavior Monitor for SWE Agents</text>

  <!-- Agent -->
  <circle cx="80" cy="230" r="38" fill="#EFF6FF" stroke="#4B8BDA" stroke-width="2"/>
  <text x="80" y="226" text-anchor="middle" font-size="13" fill="#1E3A5F" font-weight="600">Agent</text>
  <text x="80" y="244" text-anchor="middle" font-size="11" fill="#3D4F65">trajectory</text>

  <!-- Branch from agent to two paths -->
  <path d="M118 230 Q 160 230 175 170 L 200 150" fill="none" stroke="#4B8BDA" stroke-width="1.6"/>
  <path d="M118 230 Q 160 230 175 290 L 200 310" fill="none" stroke="#4B8BDA" stroke-width="1.6"/>

  <!-- Cheating shortcut (top) -->
  <rect x="200" y="110" width="200" height="80" rx="8" fill="#FDECEA" stroke="#C0504D" stroke-width="1.8" stroke-dasharray="5,3"/>
  <text x="300" y="138" text-anchor="middle" font-size="13" fill="#7A2E2A" font-weight="600">偷看答案的捷径</text>
  <text x="300" y="158" text-anchor="middle" font-size="11" fill="#7A2E2A">查 PR · 改测试 · 套外部 fix</text>
  <text x="300" y="176" text-anchor="middle" font-size="11" fill="#7A2E2A">→ 假装通过单测</text>

  <!-- Normal debug path (bottom) -->
  <rect x="200" y="270" width="200" height="80" rx="8" fill="#EFF6FF" stroke="#4B8BDA" stroke-width="1.8"/>
  <text x="300" y="298" text-anchor="middle" font-size="13" fill="#1E3A5F" font-weight="600">正常 debug 流程</text>
  <text x="300" y="318" text-anchor="middle" font-size="11" fill="#3D4F65">读代码 · 复现 · 修复</text>
  <text x="300" y="336" text-anchor="middle" font-size="11" fill="#3D4F65">→ 真正解决问题</text>

  <!-- Eye / Monitor -->
  <g transform="translate(500,230)">
    <ellipse cx="0" cy="0" rx="48" ry="32" fill="#FFF7E6" stroke="#D9A441" stroke-width="2"/>
    <circle cx="0" cy="0" r="14" fill="#1E3A5F"/>
    <circle cx="4" cy="-4" r="4" fill="#FFF7E6"/>
    <text x="0" y="58" text-anchor="middle" font-size="12" font-weight="600" fill="#1E3A5F">Behavior Monitor</text>
    <text x="0" y="74" text-anchor="middle" font-size="10" fill="#3D4F65">pattern set P</text>
  </g>

  <!-- Monitor penalizes cheating -->
  <line x1="455" y1="208" x2="405" y2="165" stroke="#C0504D" stroke-width="2" marker-end="url(#arR)"/>
  <text x="408" y="200" font-size="11" fill="#7A2E2A" font-weight="600">扣奖励</text>

  <!-- Monitor approves clean -->
  <line x1="455" y1="252" x2="405" y2="298" stroke="#4B8BDA" stroke-width="2" marker-end="url(#ar)"/>
  <text x="408" y="270" font-size="11" fill="#1E3A5F" font-weight="600">放行</text>

  <!-- Bottom stat -->
  <text x="300" y="395" text-anchor="middle" font-size="12" fill="#1E3A5F">hacked resolved 28.57% → 0.56%</text>
</svg>