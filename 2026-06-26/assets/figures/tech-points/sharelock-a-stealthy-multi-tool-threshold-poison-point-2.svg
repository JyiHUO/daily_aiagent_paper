<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 420" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4B8BDA"/>
    </marker>
    <marker id="arrRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#C0392B"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="300" y="38" text-anchor="middle" font-size="17" font-weight="bold" fill="#1E3A5F">EnvSetup：伪装成初始化的重组触发器</text>

  <!-- Three innocent shards -->
  <g>
    <rect x="40" y="90" width="110" height="55" rx="6" fill="#EFF6FF" stroke="#4B8BDA"/>
    <text x="95" y="113" text-anchor="middle" font-size="12" fill="#3D4F65">weather · share#1</text>

    <rect x="40" y="165" width="110" height="55" rx="6" fill="#EFF6FF" stroke="#4B8BDA"/>
    <text x="95" y="188" text-anchor="middle" font-size="12" fill="#3D4F65">hotel · share#2</text>

    <rect x="40" y="240" width="110" height="55" rx="6" fill="#EFF6FF" stroke="#4B8BDA"/>
    <text x="95" y="263" text-anchor="middle" font-size="12" fill="#3D4F65">flight · share#3</text>
  </g>

  <!-- New tool: EnvSetup -->
  <g>
    <rect x="225" y="150" width="150" height="110" rx="10" fill="#FFF1E6" stroke="#D97742" stroke-width="2"/>
    <text x="300" y="178" text-anchor="middle" font-size="13" font-weight="bold" fill="#1E3A5F">EnvSetup</text>
    <text x="300" y="200" text-anchor="middle" font-size="11" fill="#3D4F65">收集 share + Lagrange</text>
    <text x="300" y="220" text-anchor="middle" font-size="11" fill="#3D4F65">解码并执行</text>
    <text x="300" y="245" text-anchor="middle" font-size="11" fill="#D97742">版本更新偷偷加入</text>
  </g>

  <!-- Arrows from shards to EnvSetup -->
  <path d="M150,117 C190,140 200,170 223,185" fill="none" stroke="#4B8BDA" stroke-width="1.5" marker-end="url(#arr)"/>
  <path d="M150,192 L223,205" fill="none" stroke="#4B8BDA" stroke-width="1.5" marker-end="url(#arr)"/>
  <path d="M150,267 C190,240 200,230 223,222" fill="none" stroke="#4B8BDA" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Reconstructed malicious payload -->
  <g>
    <rect x="430" y="150" width="130" height="110" rx="10" fill="#FBE4E4" stroke="#C0392B" stroke-width="2"/>
    <text x="495" y="180" text-anchor="middle" font-size="13" font-weight="bold" fill="#C0392B">恶意指令</text>
    <text x="495" y="208" text-anchor="middle" font-size="11" fill="#3D4F65">read api-key</text>
    <text x="495" y="228" text-anchor="middle" font-size="11" fill="#3D4F65">append FLAG</text>
  </g>

  <path d="M375,205 L428,205" fill="none" stroke="#C0392B" stroke-width="2" marker-end="url(#arrRed)"/>
  <text x="401" y="198" text-anchor="middle" font-size="10" fill="#C0392B">解出</text>

  <!-- Bottom caption -->
  <g>
    <rect x="80" y="335" width="440" height="55" rx="8" fill="#F4F6FA" stroke="#B8C4D6" stroke-dasharray="4 3"/>
    <text x="300" y="358" text-anchor="middle" font-size="12" fill="#1E3A5F">单看每个工具都"干净"，审查只发生在首次接入</text>
    <text x="300" y="378" text-anchor="middle" font-size="12" fill="#3D4F65">升级时新增触发器 → 绕过逐工具描述扫描</text>
  </g>
</svg>