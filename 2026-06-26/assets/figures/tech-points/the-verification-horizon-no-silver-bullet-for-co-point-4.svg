<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4B8BDA"/>
    </marker>
  </defs>

  <text x="400" y="42" text-anchor="middle" font-size="20" font-weight="600" fill="#1E3A5F">用户的下一句话 = 最忠实的奖励</text>

  <!-- User bubble -->
  <circle cx="130" cy="250" r="55" fill="#EFF6FF" stroke="#4B8BDA" stroke-width="2"/>
  <text x="130" y="245" text-anchor="middle" font-size="14" fill="#1E3A5F" font-weight="600">用户</text>
  <text x="130" y="265" text-anchor="middle" font-size="12" fill="#3D4F65">下一轮发言</text>

  <!-- Agent turn -->
  <rect x="300" y="205" width="170" height="90" rx="10" fill="#F5F0E6" stroke="#C9A66B" stroke-width="2"/>
  <text x="385" y="240" text-anchor="middle" font-size="14" fill="#1E3A5F" font-weight="600">Agent 这一轮</text>
  <text x="385" y="270" text-anchor="middle" font-size="12" fill="#3D4F65">代码改动 · 等待评判</text>

  <!-- Three reactions -->
  <g>
    <rect x="540" y="100" width="220" height="60" rx="8" fill="#E8F3EC" stroke="#5BA572" stroke-width="2"/>
    <text x="565" y="137" text-anchor="middle" font-size="22" fill="#5BA572">✓</text>
    <text x="595" y="128" font-size="13" fill="#1E3A5F" font-weight="600">提新需求 → 隐式正反馈</text>
    <text x="595" y="148" font-size="11" fill="#3D4F65">默认上一轮已通过</text>
  </g>

  <g>
    <rect x="540" y="220" width="220" height="60" rx="8" fill="#FFF8E1" stroke="#D9A441" stroke-width="2"/>
    <text x="565" y="257" text-anchor="middle" font-size="20" fill="#D9A441">↻</text>
    <text x="595" y="248" font-size="13" fill="#1E3A5F" font-weight="600">换说法重提 → 隐式负反馈</text>
    <text x="595" y="268" font-size="11" fill="#3D4F65">需求未被正确理解</text>
  </g>

  <g>
    <rect x="540" y="340" width="220" height="60" rx="8" fill="#FDECEC" stroke="#D46A6A" stroke-width="2"/>
    <text x="565" y="377" text-anchor="middle" font-size="20" fill="#D46A6A">✗</text>
    <text x="595" y="368" font-size="13" fill="#1E3A5F" font-weight="600">"撤销" → 显式负反馈</text>
    <text x="595" y="388" font-size="11" fill="#3D4F65">执行错误占 56.6%</text>
  </g>

  <!-- Arrows -->
  <path d="M185,250 L300,250" stroke="#4B8BDA" stroke-width="2" fill="none" marker-end="url(#ar)"/>
  <path d="M470,225 C500,200 515,160 540,135" stroke="#4B8BDA" stroke-width="2" fill="none" marker-end="url(#ar)"/>
  <path d="M470,250 L540,250" stroke="#4B8BDA" stroke-width="2" fill="none" marker-end="url(#ar)"/>
  <path d="M470,275 C500,310 515,345 540,370" stroke="#4B8BDA" stroke-width="2" fill="none" marker-end="url(#ar)"/>

  <text x="400" y="455" text-anchor="middle" font-size="13" fill="#3D4F65" font-style="italic">无需打分 · 真实分布 · 自然涌现的 reward 信号</text>
</svg>