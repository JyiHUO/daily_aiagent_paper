<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 620" font-family="'Helvetica Neue', 'PingFang SC', Arial, sans-serif">
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4B8BDA"/>
    </marker>
    <marker id="ahO" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#E68A3B"/>
    </marker>
  </defs>

  <rect width="880" height="620" fill="#FBFAF7"/>

  <!-- Title -->
  <text x="440" y="40" text-anchor="middle" font-size="22" font-weight="700" fill="#1E3A5F">MEMPROBE：把长期记忆当作可审计的产物来检验</text>
  <text x="440" y="64" text-anchor="middle" font-size="13" fill="#3D4F65">任务做对 ≠ 真的记住用户 — 直接还原隐藏用户状态</text>

  <!-- LEFT: Hidden user -->
  <g>
    <circle cx="130" cy="320" r="82" fill="#EFF6FF" stroke="#4B8BDA" stroke-width="1.8"/>
    <text x="130" y="290" text-anchor="middle" font-size="13" font-weight="700" fill="#1E3A5F">隐藏用户状态</text>
    <text x="130" y="312" text-anchor="middle" font-size="11" fill="#3D4F65">31 个维度</text>
    <text x="130" y="328" text-anchor="middle" font-size="11" fill="#3D4F65">技能 / 记忆 / 偏好</text>
    <text x="130" y="350" text-anchor="middle" font-size="10" fill="#3D4F65">（仅作为 ground truth）</text>
    <!-- lock icon -->
    <rect x="118" y="365" width="24" height="18" rx="2" fill="#4B8BDA"/>
    <path d="M123 365 v-6 a7 7 0 0 1 14 0 v6" fill="none" stroke="#4B8BDA" stroke-width="2"/>
  </g>

  <!-- expose arrow -->
  <path d="M212 305 Q 280 265 348 275" fill="none" stroke="#4B8BDA" stroke-width="2" marker-end="url(#ah)"/>
  <text x="280" y="255" text-anchor="middle" font-size="11" fill="#1E3A5F" font-style="italic">间接暴露（防泄漏任务）</text>

  <!-- CENTER: Agent + memory -->
  <g>
    <rect x="350" y="240" width="180" height="170" rx="14" fill="#FFF4E6" stroke="#E68A3B" stroke-width="1.8"/>
    <text x="440" y="268" text-anchor="middle" font-size="13" font-weight="700" fill="#7A3E0F">记忆型 Agent</text>
    <text x="440" y="287" text-anchor="middle" font-size="11" fill="#5C4633">日常协助用户</text>

    <!-- memory artifact -->
    <rect x="378" y="305" width="124" height="90" rx="6" fill="#FBFAF7" stroke="#E68A3B" stroke-width="1.3" stroke-dasharray="3 3"/>
    <text x="440" y="324" text-anchor="middle" font-size="11" font-weight="700" fill="#7A3E0F">遗留记忆 m_final</text>
    <line x1="390" y1="338" x2="490" y2="338" stroke="#E68A3B" stroke-width="0.8"/>
    <line x1="390" y1="350" x2="478" y2="350" stroke="#E68A3B" stroke-width="0.8"/>
    <line x1="390" y1="362" x2="492" y2="362" stroke="#E68A3B" stroke-width="0.8"/>
    <line x1="390" y1="374" x2="470" y2="374" stroke="#E68A3B" stroke-width="0.8"/>
    <text x="440" y="389" text-anchor="middle" font-size="10" fill="#7A3E0F">可审计产物</text>
  </g>

  <!-- two read modes -->
  <path d="M532 310 Q 600 285 678 280" fill="none" stroke="#4B8BDA" stroke-width="2" marker-end="url(#ah)"/>
  <text x="605" y="275" text-anchor="middle" font-size="11" fill="#1E3A5F">全量审计 R_dump</text>

  <path d="M532 380 Q 600 400 678 400" fill="none" stroke="#4B8BDA" stroke-width="2" marker-end="url(#ah)"/>
  <text x="605" y="420" text-anchor="middle" font-size="11" fill="#1E3A5F">检索 top-k</text>

  <!-- RIGHT: Recovery -->
  <g>
    <rect x="680" y="240" width="170" height="210" rx="12" fill="#EFF6FF" stroke="#4B8BDA" stroke-width="1.8"/>
    <text x="765" y="266" text-anchor="middle" font-size="13" font-weight="700" fill="#1E3A5F">还原用户状态</text>
    <text x="765" y="282" text-anchor="middle" font-size="10" fill="#3D4F65">slot-filling reader</text>

    <!-- score bars -->
    <text x="695" y="308" font-size="10" fill="#3D4F65">任务完成率</text>
    <rect x="695" y="313" width="120" height="8" rx="2" fill="#E5E7EB"/>
    <rect x="695" y="313" width="120" height="8" rx="2" fill="#4B8BDA"/>
    <text x="838" y="320" text-anchor="end" font-size="9" fill="#1E3A5F">~1.00</text>

    <text x="695" y="342" font-size="10" fill="#3D4F65">全量恢复 B</text>
    <rect x="695" y="347" width="120" height="8" rx="2" fill="#E5E7EB"/>
    <rect x="695" y="347" width="74" height="8" rx="2" fill="#E68A3B"/>
    <text x="838" y="354" text-anchor="end" font-size="9" fill="#7A3E0F">0.62</text>

    <text x="695" y="376" font-size="10" fill="#3D4F65">top-k 恢复 B</text>
    <rect x="695" y="381" width="120" height="8" rx="2" fill="#E5E7EB"/>
    <rect x="695" y="381" width="58" height="8" rx="2" fill="#E68A3B"/>
    <text x="838" y="388" text-anchor="end" font-size="9" fill="#7A3E0F">0.50</text>

    <line x1="695" y1="408" x2="835" y2="408" stroke="#CBD5E1" stroke-width="0.8"/>
    <text x="765" y="428" text-anchor="middle" font-size="11" font-weight="700" fill="#1E3A5F">协助成功 ≠ 记住用户</text>
  </g>

  <!-- compare back arrow (closed loop to ground truth) -->
  <path d="M760 470 Q 440 540 150 400" fill="none" stroke="#E68A3B" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#ahO)"/>
  <text x="455" y="525" text-anchor="middle" font-size="12" fill="#7A3E0F" font-weight="600">对照真值评分（按类别均衡的 0–1 分）</text>

  <!-- bottom keywords -->
  <g font-size="11" fill="#1E3A5F">
    <rect x="60" y="565" width="180" height="28" rx="14" fill="#EFF6FF" stroke="#4B8BDA" stroke-width="1"/>
    <text x="150" y="583" text-anchor="middle">50 用户 × 31 维</text>

    <rect x="260" y="565" width="180" height="28" rx="14" fill="#EFF6FF" stroke="#4B8BDA" stroke-width="1"/>
    <text x="350" y="583" text-anchor="middle">防泄漏 anti-fishing</text>

    <rect x="460" y="565" width="180" height="28" rx="14" fill="#EFF6FF" stroke="#4B8BDA" stroke-width="1"/>
    <text x="550" y="583" text-anchor="middle">写入 vs 检索 分离</text>

    <rect x="660" y="565" width="180" height="28" rx="14" fill="#EFF6FF" stroke="#4B8BDA" stroke-width="1"/>
    <text x="750" y="583" text-anchor="middle">5 套记忆系统对比</text>
  </g>
</svg>