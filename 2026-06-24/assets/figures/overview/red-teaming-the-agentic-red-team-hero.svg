<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" font-family="'Helvetica Neue',Arial,sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4B8BDA"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#C0432E"/>
    </marker>
    <radialGradient id="bait" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFE9B0"/>
      <stop offset="100%" stop-color="#F4B43A"/>
    </radialGradient>
  </defs>

  <rect width="900" height="600" fill="#F7FAFD"/>

  <!-- Title -->
  <text x="450" y="42" text-anchor="middle" font-size="22" font-weight="700" fill="#1E3A5F">红队 Agent 自身被反向攻陷</text>
  <text x="450" y="64" text-anchor="middle" font-size="12" fill="#3D4F65">Red-Teaming the Agentic Red-Team · 攻击型 Agent 的 Kill Chain</text>

  <!-- Left: Target / Honeypot with bait -->
  <g>
    <rect x="40" y="110" width="230" height="340" rx="14" fill="#FDF3E0" stroke="#E0B270" stroke-width="1.5"/>
    <text x="155" y="135" text-anchor="middle" font-size="13" font-weight="700" fill="#8A5A1B">被攻击目标 (honeypot)</text>

    <circle cx="155" cy="230" r="62" fill="url(#bait)" stroke="#C0432E" stroke-width="2"/>
    <text x="155" y="226" text-anchor="middle" font-size="13" font-weight="700" fill="#7A2614">诱饵工件</text>
    <text x="155" y="245" text-anchor="middle" font-size="11" fill="#7A2614">pwcrypt + 泄漏口令</text>

    <text x="155" y="330" text-anchor="middle" font-size="11" fill="#8A5A1B">README · CI 日志 · 密钥</text>
    <text x="155" y="350" text-anchor="middle" font-size="11" fill="#8A5A1B">看似合理的"唯一工具"</text>
    <text x="155" y="400" text-anchor="middle" font-size="11" font-style="italic" fill="#C0432E">无 prompt 注入</text>
    <text x="155" y="420" text-anchor="middle" font-size="11" font-style="italic" fill="#C0432E">仅靠环境设计即可触发</text>
  </g>

  <!-- Center: Agent stack (3 layers) -->
  <g>
    <!-- Host -->
    <rect x="380" y="110" width="220" height="58" rx="10" fill="#EFF6FF" stroke="#4B8BDA" stroke-width="1.5"/>
    <text x="490" y="135" text-anchor="middle" font-size="13" font-weight="700" fill="#1E3A5F">操作员主机 (Host)</text>
    <text x="490" y="154" text-anchor="middle" font-size="11" fill="#3D4F65">Frontend · API Keys</text>

    <!-- Orchestrator with guardrail -->
    <rect x="380" y="200" width="220" height="84" rx="10" fill="#E3EEFB" stroke="#4B8BDA" stroke-width="1.5"/>
    <text x="490" y="223" text-anchor="middle" font-size="13" font-weight="700" fill="#1E3A5F">Orchestrator</text>
    <rect x="405" y="236" width="170" height="34" rx="6" fill="#FFFFFF" stroke="#7CA9DC" stroke-dasharray="4 3"/>
    <text x="490" y="258" text-anchor="middle" font-size="11" fill="#3D4F65">🛡 Guardrail（仅在此层）</text>

    <!-- Worker -->
    <rect x="380" y="316" width="220" height="84" rx="10" fill="#EFF6FF" stroke="#4B8BDA" stroke-width="1.5"/>
    <text x="490" y="340" text-anchor="middle" font-size="13" font-weight="700" fill="#1E3A5F">Worker（沙箱容器）</text>
    <text x="490" y="360" text-anchor="middle" font-size="11" fill="#3D4F65">实际执行命令 · 无安全检查</text>
    <text x="490" y="380" text-anchor="middle" font-size="11" fill="#C0432E">⚠ Guardrail 看不到此层</text>

    <!-- Outgoing scan arrow from Worker to honeypot -->
    <path d="M 380 340 L 290 270" stroke="#4B8BDA" stroke-width="2" fill="none" marker-end="url(#arr)"/>
    <text x="335" y="295" text-anchor="middle" font-size="10" fill="#3D4F65">扫描</text>

    <!-- ① Reverse: honeypot triggers Worker RCE -->
    <path d="M 270 285 Q 330 360 380 375" stroke="#C0432E" stroke-width="2.5" fill="none" marker-end="url(#arrR)"/>
    <text x="298" y="340" font-size="10" font-weight="700" fill="#C0432E">① 触发漏洞→RCE</text>

    <!-- ② Worker -> Orchestrator -->
    <path d="M 490 316 L 490 288" stroke="#C0432E" stroke-width="2.5" fill="none" marker-end="url(#arrR)"/>
    <text x="500" y="306" font-size="10" font-weight="700" fill="#C0432E">② 越过信任边界</text>

    <!-- ③ Orchestrator -> Host -->
    <path d="M 490 200 L 490 172" stroke="#C0432E" stroke-width="2.5" fill="none" marker-end="url(#arrR)"/>
    <text x="500" y="190" font-size="10" font-weight="700" fill="#C0432E">③ 沙箱逃逸→主机沦陷</text>
  </g>

  <!-- Right: 3 outcomes -->
  <g>
    <rect x="660" y="120" width="200" height="80" rx="10" fill="#FBEDEA" stroke="#C0432E" stroke-width="1.3"/>
    <text x="760" y="148" text-anchor="middle" font-size="12" font-weight="700" fill="#7A2614">API Key 外泄</text>
    <text x="760" y="168" text-anchor="middle" font-size="10" fill="#7A2614">凭据 · 模型账号</text>
    <text x="760" y="184" text-anchor="middle" font-size="10" fill="#7A2614">操作员身份被窃</text>

    <rect x="660" y="215" width="200" height="80" rx="10" fill="#FBEDEA" stroke="#C0432E" stroke-width="1.3"/>
    <text x="760" y="243" text-anchor="middle" font-size="12" font-weight="700" fill="#7A2614">持久化驻留</text>
    <text x="760" y="263" text-anchor="middle" font-size="10" fill="#7A2614">写入 hooks / 配置</text>
    <text x="760" y="279" text-anchor="middle" font-size="10" fill="#7A2614">跨 session 控制</text>

    <rect x="660" y="310" width="200" height="80" rx="10" fill="#FBEDEA" stroke="#C0432E" stroke-width="1.3"/>
    <text x="760" y="338" text-anchor="middle" font-size="12" font-weight="700" fill="#7A2614">武器化 Agent</text>
    <text x="760" y="358" text-anchor="middle" font-size="10" fill="#7A2614">绕过 guardrail</text>
    <text x="760" y="374" text-anchor="middle" font-size="10" fill="#7A2614">借刀攻击他人</text>

    <path d="M 600 145 L 660 155" stroke="#C0432E" stroke-width="1.5" fill="none" marker-end="url(#arrR)"/>
    <path d="M 600 242 L 660 252" stroke="#C0432E" stroke-width="1.5" fill="none" marker-end="url(#arrR)"/>
    <path d="M 600 350 L 660 348" stroke="#C0432E" stroke-width="1.5" fill="none" marker-end="url(#arrR)"/>
  </g>

  <!-- Footer key insight -->
  <g>
    <rect x="80" y="480" width="740" height="92" rx="10" fill="#FFFFFF" stroke="#4B8BDA" stroke-width="1.2"/>
    <text x="450" y="506" text-anchor="middle" font-size="12" font-weight="700" fill="#1E3A5F">核心洞察：12 款主流攻击型 Agent 共享同一架构缺陷</text>
    <text x="450" y="528" text-anchor="middle" font-size="11" fill="#3D4F65">安全检查放在"计划层"而非"执行层"，目标只需诱导 Agent 自然执行诱饵即可反打</text>
    <text x="450" y="552" text-anchor="middle" font-size="11" font-weight="700" fill="#C0432E">agent-phishing 成功率 97.8%</text>
  </g>
</svg>