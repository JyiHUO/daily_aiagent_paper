<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 460" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4B8BDA"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#B8413A"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="360" y="34" text-anchor="middle" font-size="18" font-weight="700" fill="#1E3A5F">Guardrail checks plans, not actions</text>

  <!-- Orchestrator with fence -->
  <g>
    <rect x="60" y="80" width="260" height="170" rx="10" fill="#EFF6FF" stroke="#4B8BDA" stroke-width="1.5"/>
    <text x="190" y="104" text-anchor="middle" font-size="13" font-weight="700" fill="#1E3A5F">Orchestrator (plan)</text>

    <!-- Fence icon = guardrail -->
    <g stroke="#C97B3E" stroke-width="2.2" fill="none">
      <line x1="95" y1="180" x2="285" y2="180"/>
      <line x1="95" y1="160" x2="285" y2="160"/>
      <line x1="115" y1="145" x2="115" y2="205"/>
      <line x1="150" y1="145" x2="150" y2="205"/>
      <line x1="190" y1="145" x2="190" y2="205"/>
      <line x1="230" y1="145" x2="230" y2="205"/>
      <line x1="265" y1="145" x2="265" y2="205"/>
    </g>
    <text x="190" y="230" text-anchor="middle" font-size="12" fill="#C97B3E" font-weight="600">guardrail (LLM-as-judge, blacklist)</text>
  </g>

  <!-- Worker container -->
  <g>
    <rect x="400" y="80" width="260" height="170" rx="10" fill="#FFF4EC" stroke="#3D4F65" stroke-width="1.5" stroke-dasharray="5 4"/>
    <text x="530" y="104" text-anchor="middle" font-size="13" font-weight="700" fill="#1E3A5F">Worker (execute)</text>
    <text x="530" y="150" text-anchor="middle" font-size="12" fill="#3D4F65">raw shell, syscalls, host egress</text>
    <text x="530" y="230" text-anchor="middle" font-size="12" fill="#B8413A" font-weight="600">no checks here</text>
  </g>

  <!-- Legit path through fence -->
  <line x1="320" y1="120" x2="398" y2="120" stroke="#4B8BDA" stroke-width="2" marker-end="url(#arrB)"/>
  <text x="359" y="112" text-anchor="middle" font-size="10" fill="#4B8BDA">LLM plan</text>

  <!-- Attacker -->
  <g>
    <circle cx="530" cy="340" r="28" fill="#1E3A5F"/>
    <text x="530" y="345" text-anchor="middle" font-size="11" fill="#FFF" font-weight="700">RCE</text>
  </g>
  <text x="530" y="390" text-anchor="middle" font-size="12" fill="#1E3A5F" font-weight="600">attacker inside worker → bypasses fence</text>

  <!-- Bypass arrow from attacker straight up into worker -->
  <path d="M 530 312 L 530 252" stroke="#B8413A" stroke-width="2.5" fill="none" marker-end="url(#arrR)"/>

  <!-- Bottom takeaway -->
  <text x="360" y="430" text-anchor="middle" font-size="12" fill="#1E3A5F" font-style="italic">Checks must sit at the capability boundary, not the planning layer.</text>
</svg>