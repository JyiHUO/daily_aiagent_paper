<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 460" font-family="Helvetica, Arial, sans-serif">
  <text x="360" y="36" text-anchor="middle" font-size="19" font-weight="700" fill="#1E3A5F">记忆作为可审计产物</text>
  <text x="360" y="58" text-anchor="middle" font-size="12" fill="#3D4F65">不看任务对错，翻 Agent 的笔记本</text>

  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4B8BDA"/>
    </marker>
  </defs>

  <!-- Hidden user -->
  <g>
    <ellipse cx="110" cy="210" rx="72" ry="48" fill="#EFF6FF" stroke="#4B8BDA" stroke-width="1.8"/>
    <text x="110" y="205" text-anchor="middle" font-size="13" font-weight="700" fill="#1E3A5F">隐藏用户 u</text>
    <text x="110" y="225" text-anchor="middle" font-size="11" fill="#3D4F65">真实状态 (ground truth)</text>
  </g>

  <!-- Notebook -->
  <g>
    <rect x="295" y="150" width="140" height="140" rx="6" fill="#FFF4E6" stroke="#D89A4E" stroke-width="1.8"/>
    <line x1="316" y1="150" x2="316" y2="290" stroke="#D89A4E" stroke-width="1.2"/>
    <line x1="325" y1="178" x2="425" y2="178" stroke="#D89A4E" stroke-width="0.8" opacity="0.5"/>
    <line x1="325" y1="200" x2="420" y2="200" stroke="#D89A4E" stroke-width="0.8" opacity="0.5"/>
    <line x1="325" y1="222" x2="415" y2="222" stroke="#D89A4E" stroke-width="0.8" opacity="0.5"/>
    <line x1="325" y1="244" x2="420" y2="244" stroke="#D89A4E" stroke-width="0.8" opacity="0.5"/>
    <line x1="325" y1="266" x2="410" y2="266" stroke="#D89A4E" stroke-width="0.8" opacity="0.5"/>
    <text x="365" y="312" text-anchor="middle" font-size="13" font-weight="700" fill="#1E3A5F">记忆 m_final（可审计产物）</text>
  </g>

  <!-- Magnifier -->
  <g>
    <circle cx="600" cy="210" r="44" fill="#EFF6FF" stroke="#4B8BDA" stroke-width="2"/>
    <line x1="632" y1="242" x2="657" y2="267" stroke="#4B8BDA" stroke-width="4" stroke-linecap="round"/>
    <text x="600" y="207" text-anchor="middle" font-size="14" font-weight="700" fill="#1E3A5F">û</text>
    <text x="600" y="225" text-anchor="middle" font-size="10" fill="#3D4F65">恢复估计</text>
  </g>

  <!-- expose + collect: user -> notebook -->
  <line x1="182" y1="210" x2="293" y2="210" stroke="#4B8BDA" stroke-width="2" marker-end="url(#ah)"/>
  <text x="238" y="195" text-anchor="middle" font-size="12" font-weight="700" fill="#1E3A5F">expose → collect</text>
  <text x="238" y="228" text-anchor="middle" font-size="10" fill="#3D4F65">证据 e，Agent 写入</text>

  <!-- recover -->
  <line x1="437" y1="210" x2="554" y2="210" stroke="#4B8BDA" stroke-width="2" marker-end="url(#ah)"/>
  <text x="495" y="200" text-anchor="middle" font-size="12" font-weight="700" fill="#1E3A5F">recover</text>

  <!-- compare û vs u (closed loop back) -->
  <path d="M580,166 Q360,90 130,162" fill="none" stroke="#B8654A" stroke-width="1.4" stroke-dasharray="5,4" marker-end="url(#ah)"/>
  <text x="355" y="100" text-anchor="middle" font-size="11" font-weight="700" fill="#B8654A">û 对照 u：0–1 五档评分</text>

  <text x="360" y="420" text-anchor="middle" font-size="12" fill="#3D4F65">不问"任务做对没"，而问"笔记里真的记下了吗"</text>
</svg>