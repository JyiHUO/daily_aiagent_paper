<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 420" font-family="-apple-system,Segoe UI,Helvetica,sans-serif">
  <rect width="600" height="420" fill="#FAF7F2"/>

  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4B8BDA"/>
    </marker>
    <marker id="ar2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#D97757"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="300" y="36" text-anchor="middle" font-size="15" fill="#1E3A5F" font-weight="700">同一份记忆，两种读法</text>

  <!-- Notebook (memory) in the middle -->
  <g>
    <rect x="250" y="150" width="100" height="120" rx="6" fill="#FFF4DF" stroke="#C9A66B" stroke-width="2"/>
    <line x1="265" y1="175" x2="335" y2="175" stroke="#C9A66B" stroke-width="1"/>
    <line x1="265" y1="195" x2="335" y2="195" stroke="#C9A66B" stroke-width="1"/>
    <line x1="265" y1="215" x2="335" y2="215" stroke="#C9A66B" stroke-width="1"/>
    <line x1="265" y1="235" x2="335" y2="235" stroke="#C9A66B" stroke-width="1"/>
    <line x1="265" y1="255" x2="335" y2="255" stroke="#C9A66B" stroke-width="1"/>
    <text x="300" y="290" text-anchor="middle" font-size="13" fill="#1E3A5F" font-weight="600">memory (m_final)</text>
  </g>

  <!-- Left: Dump-all (magnifier) -->
  <g>
    <text x="115" y="80" text-anchor="middle" font-size="13" fill="#1E3A5F" font-weight="700">读法1：dump-all</text>
    <circle cx="115" cy="140" r="34" fill="none" stroke="#4B8BDA" stroke-width="3"/>
    <line x1="140" y1="165" x2="160" y2="185" stroke="#4B8BDA" stroke-width="4" stroke-linecap="round"/>
    <text x="115" y="144" text-anchor="middle" font-size="11" fill="#1E3A5F">读全本</text>
    <text x="115" y="235" text-anchor="middle" font-size="11" fill="#3D4F65" font-style="italic">问：写入是否成功？</text>
  </g>

  <!-- Right: top-k (tiny window) -->
  <g>
    <text x="485" y="80" text-anchor="middle" font-size="13" fill="#1E3A5F" font-weight="700">读法2：top-k=5</text>
    <rect x="450" y="110" width="70" height="60" fill="none" stroke="#D97757" stroke-width="3"/>
    <line x1="460" y1="128" x2="510" y2="128" stroke="#D97757" stroke-width="2"/>
    <line x1="460" y1="143" x2="500" y2="143" stroke="#D97757" stroke-width="2"/>
    <line x1="460" y1="158" x2="505" y2="158" stroke="#D97757" stroke-width="2"/>
    <text x="485" y="195" text-anchor="middle" font-size="11" fill="#1E3A5F">只看检索给的几条</text>
    <text x="485" y="235" text-anchor="middle" font-size="11" fill="#3D4F65" font-style="italic">问：检索是否拿到？</text>
  </g>

  <!-- Arrows from readers to notebook -->
  <path d="M 162 175 Q 205 195 248 205" fill="none" stroke="#4B8BDA" stroke-width="2" marker-end="url(#ar)"/>
  <path d="M 448 150 Q 400 180 352 200" fill="none" stroke="#D97757" stroke-width="2" marker-end="url(#ar2)"/>

  <!-- Bottom: two score readings -->
  <g>
    <text x="300" y="330" text-anchor="middle" font-size="13" fill="#1E3A5F" font-weight="700">对比两个 B 分 → 定位失败环节</text>

    <rect x="55" y="345" width="220" height="55" rx="6" fill="#EAF1FB" stroke="#4B8BDA" stroke-width="1.5"/>
    <text x="165" y="365" text-anchor="middle" font-size="12" fill="#4B8BDA" font-weight="700">dump 高 · top-k 低</text>
    <text x="165" y="385" text-anchor="middle" font-size="11" fill="#3D4F65">写入OK，检索接口挂了</text>

    <rect x="325" y="345" width="220" height="55" rx="6" fill="#FBEDE6" stroke="#D97757" stroke-width="1.5"/>
    <text x="435" y="365" text-anchor="middle" font-size="12" fill="#D97757" font-weight="700">两者都低</text>
    <text x="435" y="385" text-anchor="middle" font-size="11" fill="#3D4F65">写入阶段就已经丢了</text>
  </g>
</svg>