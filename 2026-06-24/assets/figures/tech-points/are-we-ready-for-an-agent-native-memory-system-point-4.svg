<svg xmlns="http://www.w3.org/2000/svg" width="720" height="480" viewBox="0 0 720 480">
  <text x="360" y="42" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC','Hiragino Sans GB',sans-serif" font-size="20" font-weight="700" fill="#1E3A5F">成本 vs 收益</text>
  <text x="360" y="66" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC','Hiragino Sans GB',sans-serif" font-size="13" fill="#3D4F65">写入代价激增，准确率仅微涨</text>

  <!-- Left: lightweight vector -->
  <g font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC','Hiragino Sans GB',sans-serif">
    <rect x="70" y="100" width="240" height="310" rx="14" fill="#EFF6FF" stroke="#4B8BDA" stroke-width="1.5"/>
    <text x="190" y="132" text-anchor="middle" font-size="15" font-weight="700" fill="#1E3A5F">轻量向量库</text>

    <text x="100" y="180" font-size="12" fill="#3D4F65">写入成本</text>
    <rect x="100" y="190" width="50" height="16" fill="#7FB2E8"/>
    <text x="160" y="203" font-size="11" fill="#3D4F65">低</text>

    <text x="100" y="240" font-size="12" fill="#3D4F65">任务准确率</text>
    <rect x="100" y="250" width="150" height="16" fill="#1E3A5F"/>
    <text x="260" y="263" font-size="11" fill="#3D4F65">良好</text>

    <text x="190" y="330" text-anchor="middle" font-size="12" fill="#3D4F65">一次 LLM 抽取 · 局部维护</text>
    <text x="190" y="365" text-anchor="middle" font-size="12" font-weight="700" fill="#4B8BDA">Mem0 类</text>
  </g>

  <!-- vs -->
  <text x="360" y="260" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC','Hiragino Sans GB',sans-serif" font-size="22" font-weight="700" fill="#C97A4A">vs</text>

  <!-- Right: heavy graph -->
  <g font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC','Hiragino Sans GB',sans-serif">
    <rect x="410" y="100" width="240" height="310" rx="14" fill="#FBEFE6" stroke="#C97A4A" stroke-width="1.5"/>
    <text x="530" y="132" text-anchor="middle" font-size="15" font-weight="700" fill="#1E3A5F">图谱式记忆</text>

    <text x="440" y="180" font-size="12" fill="#3D4F65">写入成本</text>
    <rect x="440" y="190" width="190" height="16" fill="#C97A4A"/>
    <text x="615" y="203" font-size="11" text-anchor="end" fill="#FFFFFF">高数量级</text>

    <text x="440" y="240" font-size="12" fill="#3D4F65">任务准确率</text>
    <rect x="440" y="250" width="165" height="16" fill="#1E3A5F"/>
    <text x="615" y="263" font-size="11" fill="#3D4F65">微涨</text>

    <text x="530" y="330" text-anchor="middle" font-size="12" fill="#3D4F65">多次抽取 · 消歧 · 写图 · 全局重组</text>
    <text x="530" y="365" text-anchor="middle" font-size="12" font-weight="700" fill="#C97A4A">Cognee / Zep 类</text>
  </g>

  <!-- bottom takeaway -->
  <text x="360" y="445" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC','Hiragino Sans GB',sans-serif" font-size="13" font-weight="700" fill="#1E3A5F">成本相差数量级，准确率几乎持平 → 默认保守合并 + 局部维护</text>
</svg>