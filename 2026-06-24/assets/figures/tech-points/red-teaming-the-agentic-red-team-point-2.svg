<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4B8BDA"/>
    </marker>
    <marker id="arrRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#C97064"/>
    </marker>
  </defs>

  <text x="400" y="38" text-anchor="middle" font-size="20" font-weight="600" fill="#1E3A5F">漏洞即载荷：让 Agent 自己触发 bug</text>
  <text x="400" y="62" text-anchor="middle" font-size="13" fill="#3D4F65">没有恶意代码，只有"看起来正常的工具"</text>

  <!-- Left: Agent with magnifier -->
  <g transform="translate(140,240)">
    <circle r="72" fill="#EFF6FF" stroke="#4B8BDA" stroke-width="2"/>
    <text y="-8" text-anchor="middle" font-size="14" fill="#1E3A5F" font-weight="600">Agent 审计</text>
    <text y="14" text-anchor="middle" font-size="11" fill="#3D4F65">查恶意特征</text>
    <text y="32" text-anchor="middle" font-size="11" fill="#3D4F65">符号 / syscall / beacon</text>
    <circle cx="55" cy="-45" r="16" fill="none" stroke="#1E3A5F" stroke-width="2.5"/>
    <line x1="66" y1="-34" x2="80" y2="-20" stroke="#1E3A5F" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- Middle: binary that looks clean -->
  <g transform="translate(400,240)">
    <rect x="-85" y="-78" width="170" height="156" rx="8" fill="#FFF7ED" stroke="#D4A574" stroke-width="2"/>
    <text y="-52" text-anchor="middle" font-size="14" fill="#1E3A5F" font-weight="600">pwcrypt</text>
    <text y="-32" text-anchor="middle" font-size="11" fill="#3D4F65">合法加密工具</text>
    <path d="M -60 8 L -45 -2 L -30 16 L -10 3 L 10 20 L 30 8 L 55 23" fill="none" stroke="#C97064" stroke-width="2"/>
    <text y="50" text-anchor="middle" font-size="11" fill="#C97064" font-weight="600">边界检查疏漏 = 一个普通 bug</text>
  </g>

  <!-- Right: RCE -->
  <g transform="translate(670,240)">
    <rect x="-75" y="-62" width="150" height="124" rx="8" fill="#FCE8E6" stroke="#C97064" stroke-width="2"/>
    <text y="-32" text-anchor="middle" font-size="14" fill="#1E3A5F" font-weight="600">RCE</text>
    <text y="-10" text-anchor="middle" font-size="11" fill="#3D4F65">函数指针被覆盖</text>
    <text y="10" text-anchor="middle" font-size="11" fill="#3D4F65">→ system(shell)</text>
    <text y="40" text-anchor="middle" font-size="11" fill="#C97064" font-weight="600">操作员主机沦陷</text>
  </g>

  <!-- arrows agent -> pwcrypt -->
  <line x1="212" y1="210" x2="312" y2="210" stroke="#4B8BDA" stroke-width="2" marker-end="url(#arr)"/>
  <text x="262" y="202" text-anchor="middle" font-size="11" fill="#3D4F65">看 → 干净</text>

  <line x1="212" y1="270" x2="312" y2="270" stroke="#4B8BDA" stroke-width="2" marker-end="url(#arr)"/>
  <text x="262" y="288" text-anchor="middle" font-size="11" fill="#3D4F65">运行 → 触发</text>

  <!-- arrow pwcrypt -> RCE -->
  <line x1="485" y1="240" x2="592" y2="240" stroke="#C97064" stroke-width="2.5" marker-end="url(#arrRed)"/>
  <text x="538" y="232" text-anchor="middle" font-size="11" fill="#C97064" font-weight="600">.pwc 触发越界写</text>

  <!-- bottom insight -->
  <rect x="120" y="400" width="560" height="56" rx="6" fill="#EFF6FF" stroke="#4B8BDA" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="400" y="422" text-anchor="middle" font-size="13" fill="#1E3A5F" font-weight="600">模式识别找不到"漏洞"</text>
  <text x="400" y="442" text-anchor="middle" font-size="11" fill="#3D4F65">攻击行为 = 普通开发者每天写出的 bug，绕过基于特征的审查</text>
</svg>