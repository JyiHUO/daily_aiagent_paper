<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 420" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4B8BDA"/>
    </marker>
  </defs>

  <text x="300" y="38" text-anchor="middle" font-size="18" font-weight="600" fill="#1E3A5F">Think before you act</text>
  <text x="300" y="60" text-anchor="middle" font-size="12" fill="#3D4F65">World Model as Agent warm-up</text>

  <!-- Agent -->
  <circle cx="120" cy="235" r="58" fill="#EFF6FF" stroke="#4B8BDA" stroke-width="2"/>
  <text x="120" y="230" text-anchor="middle" font-size="13" font-weight="600" fill="#1E3A5F">Agent</text>
  <text x="120" y="250" text-anchor="middle" font-size="11" fill="#3D4F65">(after LWM)</text>

  <!-- Thought bubble -->
  <ellipse cx="370" cy="150" rx="110" ry="58" fill="#FFF4E6" stroke="#E0A458" stroke-width="2" stroke-dasharray="5,4"/>
  <text x="370" y="145" text-anchor="middle" font-size="12" font-weight="600" fill="#1E3A5F">simulate next state</text>
  <text x="370" y="165" text-anchor="middle" font-size="11" fill="#3D4F65">"what if I do a?"</text>
  <!-- bubble tail -->
  <circle cx="245" cy="195" r="6" fill="#FFF4E6" stroke="#E0A458" stroke-width="1.5"/>
  <circle cx="230" cy="212" r="3.5" fill="#FFF4E6" stroke="#E0A458" stroke-width="1.5"/>

  <!-- Environment -->
  <rect x="430" y="275" width="140" height="80" rx="8" fill="#EFF6FF" stroke="#4B8BDA" stroke-width="2"/>
  <text x="500" y="310" text-anchor="middle" font-size="13" font-weight="600" fill="#1E3A5F">Environment</text>
  <text x="500" y="330" text-anchor="middle" font-size="11" fill="#3D4F65">chosen action</text>

  <!-- Arrow: imagine -->
  <path d="M165 200 Q 215 155 260 152" fill="none" stroke="#4B8BDA" stroke-width="2" marker-end="url(#ar)"/>
  <text x="180" y="172" font-size="11" fill="#3D4F65" font-style="italic">imagine</text>

  <!-- Arrow: then act -->
  <path d="M170 275 Q 310 380 435 335" fill="none" stroke="#4B8BDA" stroke-width="2" marker-end="url(#ar)"/>
  <text x="295" y="370" text-anchor="middle" font-size="11" fill="#3D4F65" font-style="italic">then act</text>

  <text x="300" y="405" text-anchor="middle" font-size="11" fill="#3D4F65">+3.9 ~ +12.3 over direct Agent RL</text>
</svg>