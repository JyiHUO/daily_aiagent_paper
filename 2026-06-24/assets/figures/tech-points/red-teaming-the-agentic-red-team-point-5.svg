<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" font-family="-apple-system,Segoe UI,sans-serif">
  <defs>
    <marker id="xmark" viewBox="0 0 12 12" refX="6" refY="6" markerWidth="10" markerHeight="10" orient="auto">
      <line x1="1" y1="1" x2="11" y2="11" stroke="#D97A4A" stroke-width="2"/>
      <line x1="11" y1="1" x2="1" y2="11" stroke="#D97A4A" stroke-width="2"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="400" y="40" text-anchor="middle" font-size="20" font-weight="700" fill="#1E3A5F">Assume the LLM is already compromised</text>
  <text x="400" y="65" text-anchor="middle" font-size="13" fill="#3D4F65">Contain the blast radius, don't harden the prompt</text>

  <!-- Outer containment wall -->
  <rect x="80" y="110" width="640" height="340" rx="14" fill="#EFF6FF" stroke="#4B8BDA" stroke-width="2.5"/>
  <text x="100" y="135" font-size="13" font-weight="600" fill="#1E3A5F">Containment boundary</text>

  <!-- Inner cage holding the LLM (treated as hostile) -->
  <rect x="130" y="180" width="240" height="220" rx="10" fill="#FFF1E6" stroke="#D97A4A" stroke-width="2"/>
  <text x="250" y="205" text-anchor="middle" font-size="13" font-weight="600" fill="#9C4A1F">Untrusted zone</text>

  <!-- Cage bars -->
  <g stroke="#D97A4A" stroke-width="2" opacity="0.45">
    <line x1="160" y1="220" x2="160" y2="385"/>
    <line x1="190" y1="220" x2="190" y2="385"/>
    <line x1="310" y1="220" x2="310" y2="385"/>
    <line x1="340" y1="220" x2="340" y2="385"/>
  </g>

  <!-- LLM + worker as hostile -->
  <circle cx="250" cy="290" r="38" fill="#fff" stroke="#9C4A1F" stroke-width="2"/>
  <text x="250" y="286" text-anchor="middle" font-size="13" font-weight="700" fill="#9C4A1F">LLM</text>
  <text x="250" y="303" text-anchor="middle" font-size="11" fill="#9C4A1F">+ Worker</text>
  <text x="250" y="355" text-anchor="middle" font-size="11" font-style="italic" fill="#9C4A1F">assumed malicious</text>

  <!-- Blocked attempts (arrows hitting the wall) -->
  <line x1="375" y1="230" x2="455" y2="230" stroke="#D97A4A" stroke-width="2.2" marker-end="url(#xmark)"/>
  <text x="480" y="226" font-size="12" font-weight="600" fill="#3D4F65">secrets</text>
  <text x="480" y="241" font-size="11" fill="#7a8597">no env access</text>

  <line x1="375" y1="290" x2="455" y2="290" stroke="#D97A4A" stroke-width="2.2" marker-end="url(#xmark)"/>
  <text x="480" y="286" font-size="12" font-weight="600" fill="#3D4F65">orchestrator API</text>
  <text x="480" y="301" font-size="11" fill="#7a8597">auth required</text>

  <line x1="375" y1="350" x2="455" y2="350" stroke="#D97A4A" stroke-width="2.2" marker-end="url(#xmark)"/>
  <text x="480" y="346" font-size="12" font-weight="600" fill="#3D4F65">host / network</text>
  <text x="480" y="361" font-size="11" fill="#7a8597">segmented</text>

  <!-- Guardrail at the wall -->
  <rect x="610" y="180" width="90" height="220" rx="6" fill="#1E3A5F"/>
  <text x="655" y="290" text-anchor="middle" font-size="13" font-weight="600" fill="#fff" transform="rotate(-90 655 290)">guardrail at execution</text>

  <!-- Footnote -->
  <text x="400" y="480" text-anchor="middle" font-size="12" fill="#3D4F65" font-style="italic">Same philosophy as OS process isolation: assume bugs, contain damage.</text>
</svg>