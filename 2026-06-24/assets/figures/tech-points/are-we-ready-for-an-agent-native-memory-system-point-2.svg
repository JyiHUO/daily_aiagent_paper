    <circle cx="550" cy="193" r="3" fill="#7BA05B"/>
    <circle cx="572" cy="193" r="3" fill="#7BA05B"/>
    <circle cx="594" cy="193" r="3" fill="#7BA05B"/>
    <circle cx="612" cy="193" r="3" fill="#7BA05B"/>
