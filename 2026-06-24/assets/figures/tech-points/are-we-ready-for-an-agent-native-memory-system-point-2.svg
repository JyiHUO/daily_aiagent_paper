    <text x="360" y="386" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC','Hiragino Sans GB',sans-serif" font-size="13" font-weight="600" fill="#FFD78A">EM 11.5</text>
  </g>

  <!-- Winner 3 -->
  <g>
    <rect x="490" y="295" width="180" height="110" rx="10" fill="#1E3A5F"/>
    <text x="580" y="328" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC','Hiragino Sans GB',sans-serif" font-size="18" font-weight="700" fill="#FFFFFF">完整轨迹</text>
    <text x="580" y="360" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC','Hiragino Sans GB',sans-serif" font-size="12" fill="#A8C5E8">LongCtx / MemoChat</text>
    <text x="580" y="386" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC','Hiragino Sans GB',sans-serif" font-size="13" font-weight="600" fill="#FFD78A">EM 48.2</text>
