  <line x1="140" y1="215" x2="140" y2="290" stroke="#4B8BDA" stroke-width="2" marker-end="url(#ar)"/>
  <line x1="360" y1="215" x2="360" y2="290" stroke="#4B8BDA" stroke-width="2" marker-end="url(#ar)"/>
  <line x1="580" y1="215" x2="580" y2="290" stroke="#4B8BDA" stroke-width="2" marker-end="url(#ar)"/>

  <!-- Winner 1 -->
  <g>
