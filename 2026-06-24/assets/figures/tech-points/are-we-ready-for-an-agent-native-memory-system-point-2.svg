    <text x="140" y="328" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC','Hiragino Sans GB',sans-serif" font-size="18" font-weight="700" fill="#FFFFFF">图结构</text>
    <text x="140" y="360" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC','Hiragino Sans GB',sans-serif" font-size="12" fill="#A8C5E8">Zep / Cognee</text>
    <text x="140" y="386" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC','Hiragino Sans GB',sans-serif" font-size="13" font-weight="600" fill="#FFD78A">LLM Judge 48.0</text>
  </g>

  <!-- Winner 2 -->
  <g>
    <rect x="270" y="295" width="180" height="110" rx="10" fill="#1E3A5F"/>
    <text x="360" y="328" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC','Hiragino Sans GB',sans-serif" font-size="18" font-weight="700" fill="#FFFFFF">混合结构</text>
