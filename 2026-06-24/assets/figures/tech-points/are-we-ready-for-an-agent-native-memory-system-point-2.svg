    <line x1="140" y1="200" x2="165" y2="193" stroke="#4B8BDA" stroke-width="1.2"/>
    <line x1="115" y1="193" x2="165" y2="193" stroke="#4B8BDA" stroke-width="1.2"/>
  </g>

  <!-- Task 2: 精确事实 -->
  <g>
    <rect x="270" y="120" width="180" height="90" rx="10" fill="#FEF3E7" stroke="#E89B4C" stroke-width="1.5"/>
