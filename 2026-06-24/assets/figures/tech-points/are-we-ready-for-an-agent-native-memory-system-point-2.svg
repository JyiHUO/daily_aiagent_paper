  <text x="360" y="445" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC','Hiragino Sans GB',sans-serif" font-size="12" font-style="italic" fill="#3D4F65">压缩有利于关系，损耗于轨迹</text>
</svg>