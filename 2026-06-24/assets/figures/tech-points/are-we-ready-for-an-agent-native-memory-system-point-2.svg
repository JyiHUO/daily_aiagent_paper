    <text x="360" y="172" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC','Hiragino Sans GB',sans-serif" font-size="11" fill="#3D4F65">LoCoMo</text>
    <rect x="335" y="186" width="14" height="14" fill="#E89B4C" opacity="0.7"/>
    <circle cx="370" cy="193" r="6" fill="#E89B4C" opacity="0.7"/>
  </g>

  <!-- Task 3: 过程执行 -->
  <g>
    <rect x="490" y="120" width="180" height="90" rx="10" fill="#F0F4E8" stroke="#7BA05B" stroke-width="1.5"/>
    <text x="580" y="150" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC','Hiragino Sans GB',sans-serif" font-size="15" font-weight="600" fill="#1E3A5F">过程执行</text>
    <text x="580" y="172" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC','Hiragino Sans GB',sans-serif" font-size="11" fill="#3D4F65">DB-Bench</text>
