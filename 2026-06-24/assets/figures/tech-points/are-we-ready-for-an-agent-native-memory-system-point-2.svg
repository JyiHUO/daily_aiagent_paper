    <text x="140" y="150" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC','Hiragino Sans GB',sans-serif" font-size="15" font-weight="600" fill="#1E3A5F">跨会话推理</text>
    <text x="140" y="172" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC','Hiragino Sans GB',sans-serif" font-size="11" fill="#3D4F65">LongMemEval</text>
    <circle cx="115" cy="193" r="4" fill="#4B8BDA"/>
    <circle cx="140" cy="200" r="4" fill="#4B8BDA"/>
    <circle cx="165" cy="193" r="4" fill="#4B8BDA"/>
