<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 420" font-family="-apple-system, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4B8BDA"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="300" y="35" text-anchor="middle" font-size="17" font-weight="600" fill="#1E3A5F">用真实前沿 Agent 的轨迹当考卷</text>

  <!-- Left: Frontier Agents (source) -->
  <g>
    <rect x="30" y="80" width="200" height="250" rx="12" fill="#FFF4E6" stroke="#E8A857" stroke-width="1.5"/>
    <text x="130" y="108" text-anchor="middle" font-size="13" font-weight="600" fill="#1E3A5F">前沿 Agent 真实轨迹</text>

    <text x="130" y="138" text-anchor="middle" font-size="11" fill="#3D4F65">Claude Opus 4.6</text>
    <text x="130" y="156" text-anchor="middle" font-size="11" fill="#3D4F65">GPT · Gemini ...</text>

    <line x1="50" y1="175" x2="210" y2="175" stroke="#E8A857" stroke-dasharray="3 3" opacity="0.6"/>

    <text x="130" y="198" text-anchor="middle" font-size="11" fill="#3D4F65">Terminal-Bench</text>
    <text x="130" y="216" text-anchor="middle" font-size="11" fill="#3D4F65">OSWorld-Verified</text>
    <text x="130" y="234" text-anchor="middle" font-size="11" fill="#3D4F65">9 个真实环境</text>

    <text x="130" y="280" text-anchor="middle" font-size="11" fill="#7A6240" font-style="italic">(state, action)</text>
    <text x="130" y="300" text-anchor="middle" font-size="11" fill="#7A6240" font-style="italic">+ 真实 next state</text>
  </g>

  <!-- Arrow to middle -->
  <line x1="232" y1="205" x2="292" y2="205" stroke="#4B8BDA" stroke-width="2" marker-end="url(#arr)"/>
  <text x="262" y="196" text-anchor="middle" font-size="10" fill="#4B8BDA">考题</text>

  <!-- Middle: World Model under test -->
  <g>
    <rect x="295" y="150" width="140" height="115" rx="12" fill="#EFF6FF" stroke="#4B8BDA" stroke-width="1.8"/>
    <text x="365" y="190" text-anchor="middle" font-size="13" font-weight="600" fill="#1E3A5F">Qwen</text>
    <text x="365" y="210" text-anchor="middle" font-size="13" font-weight="600" fill="#1E3A5F">AgentWorld</text>
    <text x="365" y="238" text-anchor="middle" font-size="10" fill="#3D4F65">预测 next state</text>
  </g>

  <!-- Arrow to judges -->
  <line x1="437" y1="207" x2="475" y2="207" stroke="#4B8BDA" stroke-width="2" marker-end="url(#arr)"/>

  <!-- Right: Dual Judge -->
  <g>
    <rect x="478" y="115" width="105" height="85" rx="10" fill="#E8F0FE" stroke="#4B8BDA" stroke-width="1.5"/>
    <text x="530" y="143" text-anchor="middle" font-size="11" font-weight="600" fill="#1E3A5F">五维 Rubric</text>
    <text x="530" y="163" text-anchor="middle" font-size="10" fill="#3D4F65">开放式判分</text>
    <text x="530" y="186" text-anchor="middle" font-size="13" fill="#4B8BDA">★ ★ ★ ★ ★</text>

    <rect x="478" y="215" width="105" height="85" rx="10" fill="#E8F0FE" stroke="#4B8BDA" stroke-width="1.5"/>
    <text x="530" y="243" text-anchor="middle" font-size="11" font-weight="600" fill="#1E3A5F">规则验证器</text>
    <text x="530" y="263" text-anchor="middle" font-size="10" fill="#3D4F65">确定性内容</text>
    <text x="530" y="286" text-anchor="middle" font-size="13" fill="#4B8BDA">✓ / ✗</text>
  </g>

  <!-- Bottom note: OOD wall -->
  <g>
    <line x1="50" y1="365" x2="550" y2="365" stroke="#C94F4F" stroke-width="1.5" stroke-dasharray="6 4"/>
    <text x="300" y="390" text-anchor="middle" font-size="11" fill="#C94F4F" font-weight="600">训练数据 ⟂ 评测数据　严格隔离以保证 OOD</text>
  </g>
</svg>