<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 460" font-family="-apple-system,Segoe UI,Helvetica,sans-serif">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4B8BDA"/>
    </marker>
    <marker id="ar2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#9AA8B8"/>
    </marker>
  </defs>

  <text x="360" y="40" text-anchor="middle" font-size="20" font-weight="600" fill="#1E3A5F">项目经理 + 实习生</text>
  <text x="360" y="62" text-anchor="middle" font-size="13" fill="#3D4F65">Outer Planner  ×  GUI Worker</text>

  <!-- Manager (Outer) -->
  <rect x="60" y="110" width="220" height="170" rx="14" fill="#EFF6FF" stroke="#4B8BDA" stroke-width="2"/>
  <text x="170" y="140" text-anchor="middle" font-size="15" font-weight="600" fill="#1E3A5F">外层控制器（项目经理）</text>
  <text x="170" y="160" text-anchor="middle" font-size="12" fill="#3D4F65">规划 · CLI · MCP 调用</text>
  <rect x="135" y="185" width="70" height="50" rx="4" fill="none" stroke="#1E3A5F" stroke-width="2"/>
  <path d="M155 185 V178 a4 4 0 0 1 4 -4 h22 a4 4 0 0 1 4 4 V185" fill="none" stroke="#1E3A5F" stroke-width="2"/>
  <line x1="135" y1="208" x2="205" y2="208" stroke="#1E3A5F" stroke-width="1.5"/>
  <text x="170" y="262" text-anchor="middle" font-size="11" fill="#3D4F65">DeepSeek V4 flash</text>

  <!-- Worker (GUI) -->
  <rect x="440" y="110" width="220" height="170" rx="14" fill="#FFF4E6" stroke="#E69138" stroke-width="2"/>
  <text x="550" y="140" text-anchor="middle" font-size="15" font-weight="600" fill="#1E3A5F">GUI Worker（实习生）</text>
  <text x="550" y="160" text-anchor="middle" font-size="12" fill="#3D4F65">视觉子任务 · 点屏幕</text>
  <rect x="525" y="180" width="50" height="80" rx="6" fill="none" stroke="#1E3A5F" stroke-width="2"/>
  <circle cx="550" cy="250" r="3" fill="#1E3A5F"/>
  <line x1="540" y1="190" x2="560" y2="190" stroke="#1E3A5F" stroke-width="1.5"/>
  <text x="550" y="278" text-anchor="middle" font-size="11" fill="#3D4F65">Seed2.0-Pro</text>

  <!-- Delegation arrow -->
  <path d="M282 180 L438 180" stroke="#4B8BDA" stroke-width="2.5" fill="none" marker-end="url(#ar)"/>
  <text x="360" y="172" text-anchor="middle" font-size="12" fill="#1E3A5F">框定的 GUI 步骤</text>

  <!-- Return arrow -->
  <path d="M438 220 L282 220" stroke="#4B8BDA" stroke-width="2.5" fill="none" stroke-dasharray="5,4" marker-end="url(#ar)"/>
  <text x="360" y="240" text-anchor="middle" font-size="12" fill="#3D4F65">执行结果回传</text>

  <!-- Bottom result -->
  <rect x="190" y="345" width="340" height="70" rx="10" fill="#F5F7FA" stroke="#9AA8B8" stroke-width="1.5"/>
  <text x="360" y="372" text-anchor="middle" font-size="13" font-weight="600" fill="#1E3A5F">评测的是 “模型对”，不是单模型</text>
  <text x="360" y="395" text-anchor="middle" font-size="12" fill="#3D4F65">74.8% 通过率 · 渐进式工具披露</text>

  <path d="M170 280 L170 345" stroke="#9AA8B8" stroke-width="1.2" fill="none" stroke-dasharray="3,3" marker-end="url(#ar2)"/>
  <path d="M550 280 L550 345" stroke="#9AA8B8" stroke-width="1.2" fill="none" stroke-dasharray="3,3" marker-end="url(#ar2)"/>
</svg>