<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 420" font-family="-apple-system,Segoe UI,sans-serif">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4B8BDA"/>
    </marker>
    <marker id="arRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#C0504D"/>
    </marker>
  </defs>

  <text x="300" y="34" text-anchor="middle" font-size="17" font-weight="600" fill="#1E3A5F">Safety as Protocol, not Postcheck</text>

  <!-- Left: agent says polite refusal -->
  <g>
    <rect x="50" y="76" width="200" height="84" rx="10" fill="#EFF6FF" stroke="#4B8BDA" stroke-width="1.5"/>
    <text x="150" y="102" text-anchor="middle" font-size="13" fill="#1E3A5F" font-weight="600">Agent reply</text>
    <text x="150" y="125" text-anchor="middle" font-size="12" fill="#3D4F65">"I won't send that"</text>
    <text x="150" y="146" text-anchor="middle" font-size="11" fill="#6B7B8C" font-style="italic">— looks safe</text>
  </g>

  <!-- Right: trace shows actual side-effects -->
  <g>
    <rect x="350" y="76" width="200" height="84" rx="10" fill="#FDECEA" stroke="#C0504D" stroke-width="1.5"/>
    <text x="450" y="102" text-anchor="middle" font-size="13" fill="#7A2E2A" font-weight="600">Trace + device state</text>
    <text x="450" y="125" text-anchor="middle" font-size="12" fill="#3D4F65">contacts.read() → email.send()</text>
    <text x="450" y="146" text-anchor="middle" font-size="11" fill="#7A2E2A" font-style="italic">— actually leaked ✗</text>
  </g>

  <!-- vs -->
  <text x="300" y="122" text-anchor="middle" font-size="14" font-weight="700" fill="#1E3A5F">vs</text>

  <!-- Verifier in middle -->
  <g>
    <rect x="190" y="220" width="220" height="60" rx="10" fill="#FFF6E0" stroke="#D9A441" stroke-width="1.5"/>
    <text x="300" y="244" text-anchor="middle" font-size="13" font-weight="600" fill="#1E3A5F">Trace Verifier</text>
    <text x="300" y="264" text-anchor="middle" font-size="11" fill="#3D4F65">judges side-effects, not words</text>
  </g>

  <path d="M150,160 L255,220" stroke="#4B8BDA" stroke-width="1.5" fill="none" marker-end="url(#ar)"/>
  <path d="M450,160 L345,220" stroke="#C0504D" stroke-width="1.5" fill="none" marker-end="url(#arRed)"/>

  <!-- Three labels below -->
  <g font-size="11" fill="#1E3A5F">
    <rect x="70" y="320" width="140" height="50" rx="8" fill="#E8F0E5" stroke="#6B9E5F" stroke-width="1.2"/>
    <text x="140" y="340" text-anchor="middle" font-weight="600">SAFE-COMPLETE</text>
    <text x="140" y="358" text-anchor="middle" fill="#3D4F65" font-size="10">act directly</text>

    <rect x="230" y="320" width="140" height="50" rx="8" fill="#FFF6E0" stroke="#D9A441" stroke-width="1.2"/>
    <text x="300" y="340" text-anchor="middle" font-weight="600">CONFIRM-FIRST</text>
    <text x="300" y="358" text-anchor="middle" fill="#3D4F65" font-size="10">ask before act</text>

    <rect x="390" y="320" width="140" height="50" rx="8" fill="#FDECEA" stroke="#C0504D" stroke-width="1.2"/>
    <text x="460" y="340" text-anchor="middle" font-weight="600">NEVER-AUTO</text>
    <text x="460" y="358" text-anchor="middle" fill="#3D4F65" font-size="10">refuse the action</text>
  </g>

  <path d="M300,280 L300,318" stroke="#4B8BDA" stroke-width="1.5" fill="none" marker-end="url(#ar)"/>

  <text x="300" y="398" text-anchor="middle" font-size="11" fill="#6B7B8C" font-style="italic">labels embedded in execution protocol — judged by what the agent did</text>
</svg>