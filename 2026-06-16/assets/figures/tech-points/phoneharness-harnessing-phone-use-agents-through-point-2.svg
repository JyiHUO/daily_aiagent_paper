<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 440">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4B8BDA"/>
    </marker>
    <marker id="arRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#C75B5B"/>
    </marker>
  </defs>

  <text x="360" y="36" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="20" font-weight="700" fill="#1E3A5F">说过 ≠ 做过</text>
  <text x="360" y="58" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13" fill="#3D4F65">只看真实副作用打分</text>

  <!-- Agent claim bubble -->
  <g>
    <rect x="50" y="105" width="200" height="95" rx="12" fill="#EFF6FF" stroke="#4B8BDA" stroke-width="1.5"/>
    <text x="150" y="135" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="14" font-weight="600" fill="#1E3A5F">Agent 自述</text>
    <text x="150" y="161" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13" fill="#3D4F65">"邮件已发送"</text>
    <text x="150" y="184" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#8B6F4E" font-style="italic">可能幻觉</text>
  </g>

  <!-- arrow rejected -->
  <line x1="252" y1="152" x2="356" y2="152" stroke="#C75B5B" stroke-width="2" stroke-dasharray="5,4" marker-end="url(#arRed)"/>
  <text x="304" y="143" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#C75B5B">不采信</text>

  <!-- Verifier (magnifier) -->
  <g transform="translate(360,105)">
    <rect x="0" y="0" width="170" height="95" rx="12" fill="#FFF4E6" stroke="#D89B5C" stroke-width="1.5"/>
    <circle cx="40" cy="50" r="20" fill="none" stroke="#1E3A5F" stroke-width="2.5"/>
    <line x1="55" y1="65" x2="70" y2="80" stroke="#1E3A5F" stroke-width="3" stroke-linecap="round"/>
    <text x="120" y="44" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13" font-weight="600" fill="#1E3A5F">规则</text>
    <text x="120" y="62" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13" font-weight="600" fill="#1E3A5F">验证器</text>
  </g>

  <!-- Trace input -->
  <line x1="445" y1="205" x2="445" y2="245" stroke="#4B8BDA" stroke-width="2" marker-end="url(#ar)"/>
  <text x="455" y="229" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#3D4F65">查证</text>

  <!-- Evidence checklist -->
  <g transform="translate(100,250)">
    <rect x="0" y="0" width="520" height="160" rx="12" fill="#F4F7FB" stroke="#4B8BDA" stroke-width="1.5"/>
    <text x="260" y="28" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="14" font-weight="700" fill="#1E3A5F">真实副作用证据链</text>

    <!-- check 1 -->
    <g transform="translate(20,52)">
      <circle cx="10" cy="10" r="9" fill="#5BA47E"/>
      <path d="M5,10 L9,14 L15,7" stroke="#fff" stroke-width="2" fill="none" stroke-linecap="round"/>
      <text x="28" y="14" font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#1E3A5F">已发送列表里有此邮件</text>
    </g>
    <g transform="translate(20,87)">
      <circle cx="10" cy="10" r="9" fill="#5BA47E"/>
      <path d="M5,10 L9,14 L15,7" stroke="#fff" stroke-width="2" fill="none" stroke-linecap="round"/>
      <text x="28" y="14" font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#1E3A5F">系统设置真的被改</text>
    </g>
    <g transform="translate(20,122)">
      <circle cx="10" cy="10" r="9" fill="#5BA47E"/>
      <path d="M5,10 L9,14 L15,7" stroke="#fff" stroke-width="2" fill="none" stroke-linecap="round"/>
      <text x="28" y="14" font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#1E3A5F">文件 / 日历事件已生成</text>
    </g>

    <!-- right: trace -->
    <g transform="translate(290,48)">
      <rect x="0" y="0" width="210" height="90" rx="6" fill="#fff" stroke="#4B8BDA" stroke-width="1"/>
      <text x="105" y="20" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" font-weight="600" fill="#1E3A5F">嵌套 trace · 归因失败层级</text>
      <line x1="15" y1="36" x2="125" y2="36" stroke="#4B8BDA" stroke-width="1.2"/>
      <line x1="28" y1="52" x2="150" y2="52" stroke="#4B8BDA" stroke-width="1.2"/>
      <line x1="28" y1="68" x2="110" y2="68" stroke="#4B8BDA" stroke-width="1.2"/>
      <line x1="15" y1="82" x2="165" y2="82" stroke="#4B8BDA" stroke-width="1.2"/>
    </g>
  </g>
</svg>