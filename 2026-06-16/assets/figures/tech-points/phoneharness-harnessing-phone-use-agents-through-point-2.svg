<svg xmlns="http://www.w3.org/2000/svg" width="720" height="480" viewBox="0 0 720 480">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4B8BDA"/>
    </marker>
    <marker id="arGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#5BA169"/>
    </marker>
    <marker id="arRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#C97064"/>
    </marker>
  </defs>

  <text x="360" y="40" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC','Hiragino Sans GB',sans-serif" font-size="20" font-weight="600" fill="#1E3A5F">事实胜于雄辩</text>
  <text x="360" y="62" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC','Hiragino Sans GB',sans-serif" font-size="13" fill="#3D4F65">副作用可验证评测</text>

  <!-- Agent claim bubble -->
  <g>
    <rect x="60" y="110" width="200" height="90" rx="12" fill="#EFF6FF" stroke="#4B8BDA" stroke-width="1.5"/>
    <text x="160" y="140" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC','Hiragino Sans GB',sans-serif" font-size="14" font-weight="600" fill="#1E3A5F">Agent 自述</text>
    <text x="160" y="166" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC','Hiragino Sans GB',sans-serif" font-size="13" fill="#3D4F65">“已发送 ✓”（可能幻觉）</text>
  </g>

  <!-- Verifier (magnifier) -->
  <g transform="translate(360,155)">
    <circle cx="0" cy="0" r="46" fill="#FFF7ED" stroke="#D98B5F" stroke-width="2"/>
    <line x1="33" y1="33" x2="60" y2="60" stroke="#D98B5F" stroke-width="6" stroke-linecap="round"/>
    <text x="0" y="-4" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC','Hiragino Sans GB',sans-serif" font-size="13" font-weight="600" fill="#1E3A5F">验证器</text>
    <text x="0" y="14" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC','Hiragino Sans GB',sans-serif" font-size="11" fill="#3D4F65">trace + 规则</text>
  </g>

  <!-- Real world evidence -->
  <g>
    <rect x="490" y="100" width="180" height="110" rx="12" fill="#EFF6FF" stroke="#4B8BDA" stroke-width="1.5"/>
    <text x="580" y="128" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC','Hiragino Sans GB',sans-serif" font-size="13" font-weight="600" fill="#1E3A5F">真实副作用</text>
    <text x="580" y="152" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC','Hiragino Sans GB',sans-serif" font-size="12" fill="#3D4F65">📧 邮件已发</text>
    <text x="580" y="172" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC','Hiragino Sans GB',sans-serif" font-size="12" fill="#3D4F65">⚙ 设置已改</text>
    <text x="580" y="192" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC','Hiragino Sans GB',sans-serif" font-size="12" fill="#3D4F65">📅 日历已建</text>
  </g>

  <!-- Arrows from sources to verifier -->
  <line x1="260" y1="155" x2="312" y2="155" stroke="#4B8BDA" stroke-width="2" marker-end="url(#ar)"/>
  <line x1="490" y1="155" x2="408" y2="155" stroke="#4B8BDA" stroke-width="2" marker-end="url(#ar)"/>

  <!-- Pass case -->
  <g>
    <rect x="100" y="290" width="220" height="130" rx="12" fill="#ECF7EE" stroke="#5BA169" stroke-width="1.5"/>
    <text x="210" y="320" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC','Hiragino Sans GB',sans-serif" font-size="15" font-weight="600" fill="#2E6B3F">✓ 通过：说了，也做了</text>
    <text x="210" y="356" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC','Hiragino Sans GB',sans-serif" font-size="12" fill="#3D4F65">收件人 ✓  正文 ✓</text>
    <text x="210" y="380" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC','Hiragino Sans GB',sans-serif" font-size="12" fill="#3D4F65">工具调用 ✓</text>
  </g>

  <!-- Fail case -->
  <g>
    <rect x="400" y="290" width="220" height="130" rx="12" fill="#FBECEA" stroke="#C97064" stroke-width="1.5"/>
    <text x="510" y="320" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC','Hiragino Sans GB',sans-serif" font-size="15" font-weight="600" fill="#A04338">✗ 失败：说了，没做</text>
    <text x="510" y="356" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC','Hiragino Sans GB',sans-serif" font-size="12" fill="#3D4F65">发送日志为空</text>
    <text x="510" y="380" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC','Hiragino Sans GB',sans-serif" font-size="12" fill="#3D4F65">即便回答“已发送”</text>
  </g>

  <line x1="335" y1="200" x2="245" y2="288" stroke="#5BA169" stroke-width="2" marker-end="url(#arGreen)"/>
  <line x1="385" y1="200" x2="475" y2="288" stroke="#C97064" stroke-width="2" marker-end="url(#arRed)"/>

  <text x="360" y="455" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC','Hiragino Sans GB',sans-serif" font-size="11" fill="#8898A8">打分依据：可审计的执行证据，而非自述</text>
</svg>