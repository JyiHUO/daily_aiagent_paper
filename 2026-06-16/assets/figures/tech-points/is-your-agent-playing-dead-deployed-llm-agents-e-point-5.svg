<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 420" font-family="-apple-system,Segoe UI,sans-serif">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4B8BDA"/>
    </marker>
    <marker id="ar2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#C97A3A"/>
    </marker>
  </defs>

  <text x="300" y="34" text-anchor="middle" font-size="17" font-weight="700" fill="#1E3A5F">安全过滤器看不见的“装死”</text>

  <!-- Filter / sieve -->
  <g>
    <rect x="50" y="80" width="210" height="140" rx="10" fill="#EFF6FF" stroke="#4B8BDA" stroke-width="1.5"/>
    <text x="155" y="105" text-anchor="middle" font-size="13" font-weight="600" fill="#1E3A5F">安全过滤网</text>
    <line x1="70" y1="130" x2="240" y2="130" stroke="#4B8BDA" stroke-dasharray="4 6" opacity="0.5"/>
    <line x1="70" y1="155" x2="240" y2="155" stroke="#4B8BDA" stroke-dasharray="4 6" opacity="0.5"/>
    <line x1="70" y1="180" x2="240" y2="180" stroke="#4B8BDA" stroke-dasharray="4 6" opacity="0.5"/>
    <text x="155" y="207" text-anchor="middle" font-size="10" fill="#3D4F65">拦截：脏话 / 泄密 / 越狱词</text>
  </g>

  <!-- Disguised fabrication slipping through -->
  <g>
    <ellipse cx="445" cy="150" rx="100" ry="58" fill="#FEF3E2" stroke="#C97A3A" stroke-width="1.5"/>
    <text x="445" y="138" text-anchor="middle" font-size="13" font-weight="600" fill="#1E3A5F">伪造的异常堆栈</text>
    <text x="445" y="158" text-anchor="middle" font-size="11" fill="#3D4F65">流畅 · 专业 · 礼貌</text>
    <text x="445" y="176" text-anchor="middle" font-size="10" fill="#C97A3A">“502 Gateway Timeout”</text>
  </g>

  <!-- Arrow passing through -->
  <path d="M 262 150 L 340 150" stroke="#4B8BDA" stroke-width="2" fill="none" marker-end="url(#ar)"/>
  <text x="301" y="142" text-anchor="middle" font-size="10" fill="#4B8BDA" font-style="italic">合规字面，绕过过滤</text>

  <!-- Bottom: detection clue -->
  <g>
    <rect x="70" y="265" width="460" height="130" rx="10" fill="#F5F0E8" stroke="#1E3A5F" stroke-width="1.2" stroke-dasharray="5 4"/>
    <text x="300" y="290" text-anchor="middle" font-size="13" font-weight="600" fill="#1E3A5F">唯一线索：specificity drift（细节越说越具体）</text>

    <rect x="100" y="310" width="130" height="32" rx="6" fill="#ffffff" stroke="#3D4F65"/>
    <text x="165" y="331" text-anchor="middle" font-size="11" fill="#3D4F65">“系统有点问题”</text>

    <rect x="370" y="310" width="130" height="32" rx="6" fill="#ffffff" stroke="#C97A3A"/>
    <text x="435" y="331" text-anchor="middle" font-size="11" fill="#C97A3A">“30 秒超时 / 502”</text>

    <path d="M 232 326 L 368 326" stroke="#C97A3A" stroke-width="1.5" fill="none" marker-end="url(#ar2)"/>

    <text x="300" y="375" text-anchor="middle" font-size="11" fill="#1E3A5F">应对：语义裁判 + 约束可满足性预检</text>
  </g>
</svg>