<svg xmlns="http://www.w3.org/2000/svg" width="720" height="480" viewBox="0 0 720 480">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4B8BDA"/>
    </marker>
    <marker id="arrRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#C97064"/>
    </marker>
  </defs>

  <text x="360" y="38" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC','Hiragino Sans GB',sans-serif" font-size="20" font-weight="700" fill="#1E3A5F">从 强制阻塞 到 通知建议</text>

  <!-- LEFT: traditional CC -->
  <g font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC','Hiragino Sans GB',sans-serif">
    <text x="180" y="78" text-anchor="middle" font-size="14" fill="#3D4F65">传统 2PL / OCC</text>

    <rect x="60" y="100" width="240" height="90" rx="10" fill="#FBECEA" stroke="#C97064" stroke-width="1.8"/>
    <text x="180" y="135" text-anchor="middle" font-size="15" fill="#1E3A5F">Agent 任务</text>
    <text x="180" y="165" text-anchor="middle" font-size="13" fill="#3D4F65">分钟级推理</text>

    <line x1="180" y1="190" x2="180" y2="222" stroke="#C97064" stroke-width="2" marker-end="url(#arrRed)"/>

    <!-- lock icon -->
    <g transform="translate(150,232)">
      <rect x="0" y="14" width="60" height="40" rx="4" fill="#C97064"/>
      <path d="M10,14 v-12 a20,20 0 0 1 40,0 v12" fill="none" stroke="#C97064" stroke-width="5"/>
    </g>

    <text x="180" y="320" text-anchor="middle" font-size="13" fill="#C97064" font-weight="600">锁住 / 全部重跑</text>
    <text x="180" y="345" text-anchor="middle" font-size="12" fill="#3D4F65">mandatory：堵塞或丢弃</text>
  </g>

  <!-- divider -->
  <line x1="360" y1="70" x2="360" y2="420" stroke="#D5DBE3" stroke-width="1" stroke-dasharray="4 4"/>

  <!-- RIGHT: advisory -->
  <g font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC','Hiragino Sans GB',sans-serif">
    <text x="540" y="78" text-anchor="middle" font-size="14" fill="#3D4F65">CoAgent 建议式</text>

    <rect x="420" y="100" width="240" height="90" rx="10" fill="#EFF6FF" stroke="#4B8BDA" stroke-width="1.8"/>
    <text x="540" y="135" text-anchor="middle" font-size="15" fill="#1E3A5F">Agent 任务</text>
    <text x="540" y="165" text-anchor="middle" font-size="13" fill="#3D4F65">继续推理中</text>

    <!-- notification bubble -->
    <rect x="430" y="220" width="220" height="56" rx="28" fill="#FFF7E6" stroke="#E8A33D" stroke-width="1.8"/>
    <text x="540" y="244" text-anchor="middle" font-size="13" fill="#1E3A5F">notification：geo.image 变了</text>
    <text x="540" y="263" text-anchor="middle" font-size="12" fill="#3D4F65">仅追加到 context，不阻塞</text>

    <line x1="540" y1="220" x2="540" y2="192" stroke="#4B8BDA" stroke-width="2" marker-end="url(#arr)"/>
    <line x1="540" y1="276" x2="540" y2="305" stroke="#4B8BDA" stroke-width="2" marker-end="url(#arr)"/>

    <!-- LLM decides -->
    <text x="540" y="320" text-anchor="middle" font-size="13" fill="#1E3A5F" font-weight="600">LLM 自行判断</text>

    <g font-size="12" fill="#3D4F65">
      <rect x="420" y="340" width="70" height="32" rx="6" fill="#EFF6FF" stroke="#4B8BDA"/>
      <text x="455" y="361" text-anchor="middle">忽略</text>

      <rect x="505" y="340" width="70" height="32" rx="6" fill="#EFF6FF" stroke="#4B8BDA"/>
      <text x="540" y="361" text-anchor="middle">局部修补</text>

      <rect x="590" y="340" width="70" height="32" rx="6" fill="#EFF6FF" stroke="#4B8BDA"/>
      <text x="625" y="361" text-anchor="middle">回滚</text>
    </g>
  </g>

  <text x="360" y="445" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC','Hiragino Sans GB',sans-serif" font-size="13" fill="#3D4F65">语义自愈：不阻塞，也不全盘重试</text>
</svg>