<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" font-family="'PingFang SC','Microsoft YaHei',sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4B8BDA"/>
    </marker>
    <marker id="arrOrange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#E08B4A"/>
    </marker>
  </defs>

  <rect width="960" height="600" fill="#FAFBFD"/>

  <!-- Title -->
  <text x="480" y="44" text-anchor="middle" font-size="22" font-weight="700" fill="#1E3A5F">PhoneHarness：让手机 Agent 在 GUI / CLI / 工具 之间路由</text>
  <text x="480" y="68" text-anchor="middle" font-size="13" fill="#3D4F65">优先确定性路径，副作用可验证，安全嵌入执行</text>

  <!-- Central task -->
  <g>
    <rect x="400" y="100" width="160" height="56" rx="28" fill="#1E3A5F"/>
    <text x="480" y="125" text-anchor="middle" font-size="14" fill="#FFFFFF" font-weight="600">手机任务</text>
    <text x="480" y="144" text-anchor="middle" font-size="11" fill="#BFD3EC">查信息 · 改设置 · 发邮件</text>
  </g>

  <!-- Router diamond -->
  <g>
    <polygon points="480,200 560,260 480,320 400,260" fill="#FFF4E8" stroke="#E08B4A" stroke-width="2"/>
    <text x="480" y="252" text-anchor="middle" font-size="13" font-weight="700" fill="#1E3A5F">动作面路由</text>
    <text x="480" y="272" text-anchor="middle" font-size="11" fill="#3D4F65">deterministic-first</text>
    <text x="480" y="290" text-anchor="middle" font-size="10" fill="#7A6A55">能命令则不点击</text>
  </g>

  <line x1="480" y1="156" x2="480" y2="198" stroke="#4B8BDA" stroke-width="2" marker-end="url(#arr)"/>

  <!-- Three action surfaces -->
  <!-- CLI -->
  <g>
    <rect x="60" y="360" width="220" height="100" rx="10" fill="#EFF6FF" stroke="#4B8BDA" stroke-width="1.5"/>
    <text x="170" y="388" text-anchor="middle" font-size="14" font-weight="700" fill="#1E3A5F">CLI / adb</text>
    <text x="170" y="412" text-anchor="middle" font-size="11" fill="#3D4F65">改音量 · 读文件 · 系统设置一行搞定</text>
    <text x="170" y="440" text-anchor="middle" font-size="10" fill="#4B8BDA" font-style="italic">确定性 · 可复现</text>
  </g>

  <!-- MCP Tools -->
  <g>
    <rect x="370" y="360" width="220" height="100" rx="10" fill="#EFF6FF" stroke="#4B8BDA" stroke-width="1.5"/>
    <text x="480" y="388" text-anchor="middle" font-size="14" font-weight="700" fill="#1E3A5F">MCP 工具</text>
    <text x="480" y="412" text-anchor="middle" font-size="11" fill="#3D4F65">邮件 · 日历 · 检索 · 结构化 API</text>
    <text x="480" y="440" text-anchor="middle" font-size="10" fill="#4B8BDA" font-style="italic">技能按需披露</text>
  </g>

  <!-- GUI worker -->
  <g>
    <rect x="680" y="360" width="220" height="100" rx="10" fill="#FFF4E8" stroke="#E08B4A" stroke-width="1.5"/>
    <text x="790" y="388" text-anchor="middle" font-size="14" font-weight="700" fill="#1E3A5F">GUI Worker</text>
    <text x="790" y="412" text-anchor="middle" font-size="11" fill="#3D4F65">App 内可视化操作 · 独立视觉模型</text>
    <text x="790" y="440" text-anchor="middle" font-size="10" fill="#E08B4A" font-style="italic">bounded delegation</text>
  </g>

  <!-- Routing arrows -->
  <path d="M 420,290 Q 300,330 195,358" fill="none" stroke="#4B8BDA" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="480" y1="320" x2="480" y2="358" stroke="#4B8BDA" stroke-width="2" marker-end="url(#arr)"/>
  <path d="M 540,290 Q 660,330 765,358" fill="none" stroke="#E08B4A" stroke-width="2" marker-end="url(#arrOrange)"/>

  <!-- Verifier ring at bottom -->
  <g>
    <rect x="120" y="500" width="720" height="62" rx="12" fill="#1E3A5F"/>
    <text x="160" y="525" font-size="13" font-weight="700" fill="#FFD9B0">副作用验证</text>
    <text x="160" y="545" font-size="11" fill="#BFD3EC">trace + 规则：邮件真发了吗 · 设置真改了吗</text>

    <line x1="495" y1="510" x2="495" y2="554" stroke="#3D5A80" stroke-width="1"/>

    <text x="540" y="525" font-size="13" font-weight="700" fill="#FFD9B0">安全协议</text>
    <text x="540" y="545" font-size="11" fill="#BFD3EC">SAFE-COMPLETE / CONFIRM-FIRST / NEVER-AUTO</text>
  </g>

  <!-- arrows from action surfaces down to verifier -->
  <line x1="170" y1="460" x2="170" y2="498" stroke="#4B8BDA" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arr)"/>
  <line x1="480" y1="460" x2="480" y2="498" stroke="#4B8BDA" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arr)"/>
  <line x1="790" y1="460" x2="790" y2="498" stroke="#4B8BDA" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arr)"/>

  <!-- Side label: outer controller -->
  <g>
    <text x="60" y="135" font-size="11" fill="#3D4F65" font-weight="600">外层控制器</text>
    <text x="60" y="152" font-size="10" fill="#7A8A9D">规划 · 路由</text>
  </g>

</svg>