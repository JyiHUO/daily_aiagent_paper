<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#333"/>
    </marker>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#c0392b"/>
    </marker>
  </defs>

  <text x="450" y="34" text-anchor="middle" font-size="22" font-weight="bold" fill="#1a1a1a">把 Checkpoint 藏进 "LLM 思考" 的空档里</text>
  <text x="450" y="58" text-anchor="middle" font-size="14" fill="#666">Coordinator 作为反向代理，用等待窗口偷偷存档</text>

  <!-- Agent -->
  <rect x="30" y="150" width="120" height="90" rx="10" fill="#eaf3ff" stroke="#2c5fa8" stroke-width="2"/>
  <text x="90" y="190" text-anchor="middle" font-size="16" font-weight="bold" fill="#2c5fa8">Agent</text>
  <text x="90" y="212" text-anchor="middle" font-size="12" fill="#2c5fa8">sandbox</text>

  <!-- Coordinator -->
  <rect x="195" y="130" width="190" height="130" rx="10" fill="#fff4c2" stroke="#d4a017" stroke-width="2.5"/>
  <text x="290" y="160" text-anchor="middle" font-size="16" font-weight="bold" fill="#8a6d00">Coordinator (反向代理)</text>
  <text x="290" y="188" text-anchor="middle" font-size="11" fill="#5a4a00">① 识别 turn 结束</text>
  <text x="290" y="208" text-anchor="middle" font-size="11" fill="#5a4a00">② 触发 checkpoint</text>
  <text x="290" y="228" text-anchor="middle" font-size="11" fill="#5a4a00">③ 转发给 LLM</text>
  <text x="290" y="248" text-anchor="middle" font-size="11" fill="#5a4a00">④ 回包时做 gating</text>

  <!-- LLM -->
  <rect x="430" y="150" width="130" height="90" rx="10" fill="#e6f7ee" stroke="#2a8f5f" stroke-width="2"/>
  <text x="495" y="190" text-anchor="middle" font-size="16" font-weight="bold" fill="#2a8f5f">LLM API</text>
  <text x="495" y="212" text-anchor="middle" font-size="12" fill="#2a8f5f">思考中 ~几秒</text>

  <!-- C/R Engine -->
  <rect x="610" y="130" width="260" height="130" rx="10" fill="#fde4e4" stroke="#c0392b" stroke-width="2"/>
  <text x="740" y="160" text-anchor="middle" font-size="16" font-weight="bold" fill="#c0392b">C/R Engine</text>
  <text x="740" y="188" text-anchor="middle" font-size="12" fill="#7a1f1f">并行做 checkpoint</text>
  <text x="740" y="214" text-anchor="middle" font-size="11" fill="#7a1f1f">与 LLM 等待时间重叠</text>
  <text x="740" y="234" text-anchor="middle" font-size="12" font-weight="bold" fill="#7a1f1f">⇒ 几乎 0 暴露开销</text>

  <!-- arrows top row -->
  <line x1="150" y1="195" x2="190" y2="195" stroke="#333" stroke-width="2" marker-end="url(#a)"/>
  <line x1="385" y1="195" x2="425" y2="195" stroke="#333" stroke-width="2" marker-end="url(#a)"/>
  <line x1="385" y1="235" x2="605" y2="200" stroke="#c0392b" stroke-width="2" stroke-dasharray="5,4" marker-end="url(#ar)"/>
  <text x="495" y="258" text-anchor="middle" font-size="11" fill="#c0392b">触发 CKPT</text>

  <!-- timeline comparison -->
  <text x="40" y="310" font-size="14" font-weight="bold" fill="#1a1a1a">时间线对比</text>

  <!-- baseline -->
  <text x="40" y="350" font-size="12" fill="#666">朴素:</text>
  <rect x="100" y="338" width="130" height="22" fill="#a8c8ef" stroke="#2c5fa8"/>
  <text x="165" y="354" text-anchor="middle" font-size="11" fill="#1a3a66">Agent exec</text>
  <rect x="230" y="338" width="150" height="22" fill="#f4b5b0" stroke="#c0392b"/>
  <text x="305" y="354" text-anchor="middle" font-size="11" fill="#5a1010">CKPT (暴露)</text>
  <rect x="380" y="338" width="180" height="22" fill="#b8e0c8" stroke="#2a8f5f"/>
  <text x="470" y="354" text-anchor="middle" font-size="11" fill="#173f29">等 LLM (闲置)</text>

  <!-- Crab -->
  <text x="40" y="410" font-size="12" fill="#666">Crab:</text>
  <rect x="100" y="398" width="130" height="22" fill="#a8c8ef" stroke="#2c5fa8"/>
  <text x="165" y="414" text-anchor="middle" font-size="11" fill="#1a3a66">Agent exec</text>
  <rect x="230" y="398" width="330" height="22" fill="#b8e0c8" stroke="#2a8f5f"/>
  <text x="395" y="414" text-anchor="middle" font-size="11" fill="#173f29">等 LLM</text>
  <rect x="230" y="398" width="150" height="22" fill="none" stroke="#c0392b" stroke-width="2" stroke-dasharray="4,3"/>
  <text x="305" y="390" text-anchor="middle" font-size="11" fill="#c0392b">CKPT 藏在这里</text>

  <!-- Gating -->
  <rect x="40" y="450" width="540" height="80" rx="8" fill="#fff8e1" stroke="#d4a017" stroke-width="1.5"/>
  <text x="60" y="475" font-size="13" font-weight="bold" fill="#8a6d00">Completion Gating (LLM 回包时)</text>
  <text x="60" y="498" font-size="12" fill="#333">• CKPT 已完成 → 直接放行，用户零感知</text>
  <text x="60" y="518" font-size="12" fill="#333">• 否则阻塞等待，并把该任务升级到高优先级队列</text>

  <!-- result -->
  <rect x="610" y="450" width="260" height="80" rx="8" fill="#e8f5e9" stroke="#2a8f5f" stroke-width="2"/>
  <text x="740" y="478" text-anchor="middle" font-size="14" font-weight="bold" fill="#2a8f5f">p95 暴露开销</text>
  <text x="740" y="508" text-anchor="middle" font-size="22" font-weight="bold" fill="#c0392b">仅 0.44%</text>
  <text x="740" y="524" text-anchor="middle" font-size="11" fill="#555">@ 64 sandbox 共置</text>
</svg>