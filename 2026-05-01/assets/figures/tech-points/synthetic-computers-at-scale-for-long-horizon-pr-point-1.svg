<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" font-family="-apple-system,Segoe UI,Arial,sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#2b6cb0"/>
    </marker>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#718096"/>
    </marker>
    <linearGradient id="g1" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#fff7e6"/>
      <stop offset="1" stop-color="#ffe4b3"/>
    </linearGradient>
    <linearGradient id="g2" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#e6f0ff"/>
      <stop offset="1" stop-color="#bcd4ff"/>
    </linearGradient>
  </defs>

  <text x="480" y="38" text-anchor="middle" font-size="22" font-weight="700" fill="#1a365d">从 Persona 造一整台"有历史"的电脑</text>
  <text x="480" y="62" text-anchor="middle" font-size="13" fill="#4a5568">不是空文件夹，而是带版本、带引用关系的真实工作积累</text>

  <!-- Module 1: Persona -->
  <g>
    <rect x="40" y="100" width="220" height="170" rx="14" fill="url(#g1)" stroke="#dd8a1e" stroke-width="2"/>
    <circle cx="85" cy="150" r="22" fill="#fff" stroke="#dd8a1e" stroke-width="2"/>
    <circle cx="85" cy="144" r="8" fill="#dd8a1e"/>
    <path d="M67 168 Q85 156 103 168 L103 172 L67 172 Z" fill="#dd8a1e"/>
    <text x="130" y="140" font-size="14" font-weight="700" fill="#7a3e00">Persona</text>
    <text x="130" y="158" font-size="11" fill="#5a2d00">身份 / 职责</text>
    <text x="130" y="174" font-size="11" fill="#5a2d00">项目 / 协作者</text>
    <text x="60" y="210" font-size="11" fill="#5a2d00" font-style="italic">"Margaret，16 年经验</text>
    <text x="60" y="228" font-size="11" fill="#5a2d00" font-style="italic">的高级金融顾问"</text>
    <text x="60" y="252" font-size="11" fill="#5a2d00">命名习惯 / 默认盘符</text>
  </g>

  <!-- Arrow 1 -->
  <path d="M260 185 L298 185" stroke="#2b6cb0" stroke-width="2.5" fill="none" marker-end="url(#a)"/>
  <text x="279" y="178" text-anchor="middle" font-size="10" fill="#2b6cb0">LLM 扩写</text>

  <!-- Module 2: Plan -->
  <g>
    <rect x="303" y="100" width="220" height="170" rx="14" fill="#f0fff4" stroke="#38a169" stroke-width="2"/>
    <text x="413" y="128" text-anchor="middle" font-size="14" font-weight="700" fill="#22543d">规划：文件依赖图</text>
    <!-- DAG nodes -->
    <circle cx="350" cy="180" r="10" fill="#38a169"/>
    <circle cx="413" cy="205" r="10" fill="#38a169"/>
    <circle cx="413" cy="160" r="10" fill="#38a169"/>
    <circle cx="476" cy="180" r="10" fill="#38a169"/>
    <circle cx="476" cy="228" r="10" fill="#38a169"/>
    <line x1="360" y1="180" x2="403" y2="160" stroke="#38a169" stroke-width="2"/>
    <line x1="360" y1="180" x2="403" y2="205" stroke="#38a169" stroke-width="2"/>
    <line x1="423" y1="160" x2="466" y2="180" stroke="#38a169" stroke-width="2"/>
    <line x1="423" y1="205" x2="466" y2="225" stroke="#38a169" stroke-width="2"/>
    <line x1="423" y1="205" x2="466" y2="185" stroke="#38a169" stroke-width="2"/>
    <text x="413" y="256" text-anchor="middle" font-size="11" fill="#22543d">目录结构 + 命名风格 + 有向依赖</text>
  </g>

  <!-- Arrow 2 -->
  <path d="M523 185 L580 185" stroke="#2b6cb0" stroke-width="2.5" fill="none" marker-end="url(#a)"/>
  <text x="551" y="178" text-anchor="middle" font-size="10" fill="#2b6cb0">拓扑序生成</text>

  <!-- Module 3: Computer -->
  <g>
    <rect x="585" y="100" width="335" height="170" rx="14" fill="url(#g2)" stroke="#2b6cb0" stroke-width="2"/>
    <!-- monitor -->
    <rect x="605" y="125" width="140" height="100" rx="6" fill="#fff" stroke="#2b6cb0" stroke-width="2"/>
    <rect x="660" y="225" width="30" height="10" fill="#2b6cb0"/>
    <rect x="645" y="235" width="60" height="6" rx="2" fill="#2b6cb0"/>
    <!-- files on screen -->
    <rect x="615" y="138" width="22" height="26" fill="#ffd59e" stroke="#dd8a1e"/>
    <rect x="645" y="138" width="22" height="26" fill="#ffd59e" stroke="#dd8a1e"/>
    <rect x="675" y="138" width="22" height="26" fill="#ffd59e" stroke="#dd8a1e"/>
    <rect x="705" y="138" width="22" height="26" fill="#ffd59e" stroke="#dd8a1e"/>
    <rect x="615" y="175" width="22" height="26" fill="#ffd59e" stroke="#dd8a1e"/>
    <rect x="645" y="175" width="22" height="26" fill="#ffd59e" stroke="#dd8a1e"/>
    <rect x="675" y="175" width="22" height="26" fill="#ffd59e" stroke="#dd8a1e"/>
    <rect x="705" y="175" width="22" height="26" fill="#ffd59e" stroke="#dd8a1e"/>
    <!-- labels -->
    <text x="835" y="145" text-anchor="middle" font-size="14" font-weight="700" fill="#1a365d">合成电脑</text>
    <text x="835" y="170" text-anchor="middle" font-size="11" fill="#2b4a7a">docx · xlsx · pptx · pdf</text>
    <text x="835" y="190" text-anchor="middle" font-size="11" fill="#2b4a7a">100+ 文件</text>
    <text x="835" y="210" text-anchor="middle" font-size="11" fill="#2b4a7a">带版本 v1 / v2</text>
    <text x="835" y="230" text-anchor="middle" font-size="11" fill="#2b4a7a">带引用关系</text>
  </g>

  <!-- Bottom example -->
  <rect x="40" y="310" width="880" height="260" rx="14" fill="#fafafa" stroke="#cbd5e0" stroke-width="1.5"/>
  <text x="60" y="340" font-size="14" font-weight="700" fill="#1a365d">示例：依赖感知地逐份生成</text>
  <text x="60" y="360" font-size="11" fill="#718096">公开资料优先抓取，其他由带 skill 的 LLM agent 生成</text>

  <!-- chain of files -->
  <g font-size="11">
    <!-- file 1 -->
    <rect x="70" y="400" width="170" height="100" rx="8" fill="#fff" stroke="#4299e1" stroke-width="2"/>
    <text x="155" y="425" text-anchor="middle" font-weight="700" fill="#2b6cb0">VCMM-2025.pdf</text>
    <text x="155" y="447" text-anchor="middle" fill="#4a5568">Vanguard 官方</text>
    <text x="155" y="465" text-anchor="middle" fill="#4a5568">(网上抓取)</text>
    <text x="155" y="487" text-anchor="middle" font-size="10" fill="#a0aec0">根节点</text>

    <path d="M240 450 L300 450" stroke="#2b6cb0" stroke-width="2" fill="none" marker-end="url(#a)"/>
    <text x="270" y="443" text-anchor="middle" font-size="10" fill="#2b6cb0">派生</text>

    <!-- file 2 -->
    <rect x="305" y="400" width="210" height="100" rx="8" fill="#fff" stroke="#38a169" stroke-width="2"/>
    <text x="410" y="425" text-anchor="middle" font-weight="700" fill="#22543d">AssetClass</text>
    <text x="410" y="443" text-anchor="middle" font-weight="700" fill="#22543d">Projections-2025.xlsx</text>
    <text x="410" y="467" text-anchor="middle" fill="#4a5568">引用 PDF 数据</text>
    <text x="410" y="487" text-anchor="middle" font-size="10" fill="#a0aec0">LLM 生成</text>

    <path d="M515 450 L575 450" stroke="#2b6cb0" stroke-width="2" fill="none" marker-end="url(#a)"/>
    <text x="545" y="443" text-anchor="middle" font-size="10" fill="#2b6cb0">派生</text>

    <!-- file 3a -->
    <rect x="580" y="395" width="210" height="50" rx="8" fill="#fff" stroke="#dd8a1e" stroke-width="2"/>
    <text x="685" y="415" text-anchor="middle" font-weight="700" fill="#7a3e00">Allocation-Conservative</text>
    <text x="685" y="432" text-anchor="middle" fill="#4a5568">-v1.xlsx</text>

    <!-- file 3b -->
    <rect x="580" y="455" width="210" height="50" rx="8" fill="#fff" stroke="#dd8a1e" stroke-width="2"/>
    <text x="685" y="475" text-anchor="middle" font-weight="700" fill="#7a3e00">Allocation-Conservative</text>
    <text x="685" y="492" text-anchor="middle" fill="#4a5568">-v2.xlsx</text>

    <!-- outcome -->
    <path d="M790 450 L830 450" stroke="#718096" stroke-width="2" fill="none" marker-end="url(#ag)"/>
    <text x="875" y="440" text-anchor="middle" font-size="12" font-weight="700" fill="#1a365d">像真人</text>
    <text x="875" y="458" text-anchor="middle" font-size="12" font-weight="700" fill="#1a365d">积累多年</text>
    <text x="875" y="476" text-anchor="middle" font-size="12" font-weight="700" fill="#1a365d">的工作</text>
  </g>
</svg>