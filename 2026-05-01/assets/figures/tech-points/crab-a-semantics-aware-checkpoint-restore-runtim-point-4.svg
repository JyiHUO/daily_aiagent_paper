<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" font-family="'Helvetica Neue',Arial,sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
    </marker>
    <marker id="arrBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/>
    </marker>
    <marker id="arrPurple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#a21caf"/>
    </marker>
  </defs>

  <rect width="900" height="560" fill="#f8fafc"/>

  <!-- Title -->
  <text x="450" y="38" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">
    Manifest 式 Checkpoint：进程 × 文件 解耦复用
  </text>
  <text x="450" y="62" text-anchor="middle" font-size="13" fill="#64748b">
    像 git 提交链，只存变化的那一份，不必每轮全量 dump
  </text>

  <!-- Left: turns timeline -->
  <text x="70" y="105" font-size="14" font-weight="700" fill="#0f172a">Agent 每一轮发生了什么</text>

  <g font-size="13">
    <rect x="70" y="125" width="150" height="60" rx="8" fill="#fff" stroke="#94a3b8"/>
    <text x="145" y="150" text-anchor="middle" font-weight="700" fill="#0f172a">Turn 0</text>
    <text x="145" y="171" text-anchor="middle" fill="#475569">进程+文件 全变</text>

    <rect x="70" y="215" width="150" height="60" rx="8" fill="#fff" stroke="#94a3b8"/>
    <text x="145" y="240" text-anchor="middle" font-weight="700" fill="#0f172a">Turn 1</text>
    <text x="145" y="261" text-anchor="middle" fill="#475569">只改了文件</text>

    <rect x="70" y="305" width="150" height="60" rx="8" fill="#fff" stroke="#94a3b8"/>
    <text x="145" y="330" text-anchor="middle" font-weight="700" fill="#0f172a">Turn 3</text>
    <text x="145" y="351" text-anchor="middle" fill="#475569">只改了进程</text>
  </g>

  <!-- Arrows to manifests -->
  <line x1="222" y1="155" x2="352" y2="155" stroke="#374151" stroke-width="1.8" marker-end="url(#arr)"/>
  <line x1="222" y1="245" x2="352" y2="245" stroke="#374151" stroke-width="1.8" marker-end="url(#arr)"/>
  <line x1="222" y1="335" x2="352" y2="335" stroke="#374151" stroke-width="1.8" marker-end="url(#arr)"/>

  <!-- Middle: Manifest chain -->
  <text x="450" y="105" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a">Manager 发布的 Manifest</text>

  <rect x="355" y="125" width="190" height="60" rx="8" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
  <text x="450" y="150" text-anchor="middle" font-weight="700" fill="#78350f">C0 = (P0, F0)</text>
  <text x="450" y="171" text-anchor="middle" font-size="12" fill="#92400e">全量快照</text>

  <rect x="355" y="215" width="190" height="60" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="450" y="240" text-anchor="middle" font-weight="700" fill="#14532d">C1 = (P0, F1)</text>
  <text x="450" y="261" text-anchor="middle" font-size="12" fill="#166534">复用 P0，只加 F1</text>

  <rect x="355" y="305" width="190" height="60" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="450" y="330" text-anchor="middle" font-weight="700" fill="#14532d">C2 = (P3, F1)</text>
  <text x="450" y="351" text-anchor="middle" font-size="12" fill="#166534">复用 F1，只加 P3</text>

  <!-- Chain arrows -->
  <line x1="450" y1="185" x2="450" y2="213" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="450" y1="275" x2="450" y2="303" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Right: storage pool -->
  <text x="740" y="105" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a">底层只存这些</text>

  <rect x="620" y="125" width="240" height="110" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="640" y="148" font-size="13" font-weight="700" fill="#1e3a8a">进程快照 (CRIU)</text>
  <rect x="640" y="160" width="60" height="28" rx="4" fill="#bfdbfe" stroke="#2563eb"/>
  <text x="670" y="179" text-anchor="middle" font-size="12" fill="#1e3a8a">P0</text>
  <rect x="710" y="160" width="60" height="28" rx="4" fill="#bfdbfe" stroke="#2563eb"/>
  <text x="740" y="179" text-anchor="middle" font-size="12" fill="#1e3a8a">P3</text>
  <text x="640" y="218" font-size="11" fill="#64748b">省掉每轮 10–60s 的 dump</text>

  <rect x="620" y="255" width="240" height="110" rx="10" fill="#fdf4ff" stroke="#a21caf" stroke-width="1.5"/>
  <text x="640" y="278" font-size="13" font-weight="700" fill="#701a75">文件快照 (ZFS)</text>
  <rect x="640" y="290" width="60" height="28" rx="4" fill="#f5d0fe" stroke="#a21caf"/>
  <text x="670" y="309" text-anchor="middle" font-size="12" fill="#701a75">F0</text>
  <rect x="710" y="290" width="60" height="28" rx="4" fill="#f5d0fe" stroke="#a21caf"/>
  <text x="740" y="309" text-anchor="middle" font-size="12" fill="#701a75">F1</text>
  <text x="640" y="348" font-size="11" fill="#64748b">增量 COW，几乎零成本</text>

  <!-- Manifest -> storage dashed refs -->
  <line x1="547" y1="240" x2="618" y2="185" stroke="#2563eb" stroke-width="1.5" stroke-dasharray="5,4" marker-end="url(#arrBlue)"/>
  <line x1="547" y1="255" x2="618" y2="305" stroke="#a21caf" stroke-width="1.5" stroke-dasharray="5,4" marker-end="url(#arrPurple)"/>

  <!-- Bottom callout: transactional publish -->
  <rect x="70" y="410" width="790" height="125" rx="10" fill="#fff" stroke="#0f172a" stroke-width="1.5"/>
  <text x="90" y="438" font-size="15" font-weight="700" fill="#0f172a">事务化发布：部分失败 ≠ 可恢复点</text>

  <rect x="95" y="458" width="170" height="60" rx="6" fill="#fee2e2" stroke="#dc2626"/>
  <text x="180" y="481" text-anchor="middle" font-size="12" fill="#7f1d1d">Worker 写 P3 成功</text>
  <text x="180" y="502" text-anchor="middle" font-size="12" fill="#7f1d1d">写 F1 失败</text>

  <line x1="268" y1="488" x2="330" y2="488" stroke="#374151" stroke-width="1.8" marker-end="url(#arr)"/>

  <rect x="335" y="458" width="210" height="60" rx="6" fill="#f1f5f9" stroke="#475569"/>
  <text x="440" y="492" text-anchor="middle" font-size="13" fill="#0f172a">Manager 不发布 C_new</text>

  <line x1="548" y1="488" x2="610" y2="488" stroke="#374151" stroke-width="1.8" marker-end="url(#arr)"/>

  <rect x="615" y="458" width="230" height="60" rx="6" fill="#dcfce7" stroke="#16a34a"/>
  <text x="730" y="481" text-anchor="middle" font-size="12" fill="#14532d">崩溃时回退到最近的</text>
  <text x="730" y="502" text-anchor="middle" font-size="12" font-weight="700" fill="#14532d">有效 manifest (C2)</text>
</svg>