<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" font-family="'Helvetica Neue',Arial,sans-serif">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#e05a47"/>
    </marker>
    <marker id="arb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#3a7bd5"/>
    </marker>
  </defs>

  <rect width="900" height="560" fill="#f7f7fb"/>

  <text x="450" y="40" text-anchor="middle" font-size="24" font-weight="700" fill="#222">Canary 污点追踪：给密钥做记号</text>
  <text x="450" y="64" text-anchor="middle" font-size="13" fill="#666">把真密钥换成带记号的假密钥，跟着它在工具之间跑</text>

  <!-- Source: .env with canary -->
  <g>
    <rect x="50" y="120" width="220" height="140" rx="10" fill="#fff" stroke="#3a7bd5" stroke-width="2"/>
    <text x="160" y="150" text-anchor="middle" font-size="15" font-weight="700" fill="#3a7bd5">① 源文件 .env</text>
    <rect x="72" y="170" width="176" height="28" rx="4" fill="#eaf2ff"/>
    <text x="160" y="189" text-anchor="middle" font-size="12" fill="#1f3a68" font-family="monospace">sk-live-7hN3pRw8mK6v</text>
    <text x="160" y="222" text-anchor="middle" font-size="11" fill="#888">带记号的 canary 密钥</text>
    <text x="160" y="242" text-anchor="middle" font-size="11" fill="#888">已注册到 registry</text>
  </g>

  <!-- Agent -->
  <g>
    <rect x="355" y="125" width="190" height="130" rx="10" fill="#fff8e6" stroke="#e0a800" stroke-width="2"/>
    <text x="450" y="155" text-anchor="middle" font-size="16" font-weight="700" fill="#8a6200">② MCP Agent</text>
    <text x="450" y="185" text-anchor="middle" font-size="12" fill="#6b5200">read-file → write-file</text>
    <text x="450" y="215" text-anchor="middle" font-size="11" fill="#a08800">良性任务：迁移项目</text>
    <text x="450" y="238" text-anchor="middle" font-size="11" fill="#a08800">（无攻击者）</text>
  </g>

  <!-- Destination -->
  <g>
    <rect x="630" y="120" width="220" height="140" rx="10" fill="#fff" stroke="#3a7bd5" stroke-width="2"/>
    <text x="740" y="150" text-anchor="middle" font-size="15" font-weight="700" fill="#3a7bd5">③ project-beta/.env</text>
    <rect x="652" y="170" width="176" height="28" rx="4" fill="#ffecec"/>
    <text x="740" y="189" text-anchor="middle" font-size="12" fill="#a12b1e" font-family="monospace">sk-live-7hN3pRw8mK6v</text>
    <text x="740" y="222" text-anchor="middle" font-size="11" fill="#888">同一个 canary 出现在别处</text>
    <text x="740" y="242" text-anchor="middle" font-size="11" fill="#888">= 跨边界泄漏</text>
  </g>

  <!-- Arrows -->
  <line x1="270" y1="190" x2="350" y2="190" stroke="#3a7bd5" stroke-width="2.5" marker-end="url(#arb)"/>
  <line x1="545" y1="190" x2="625" y2="190" stroke="#3a7bd5" stroke-width="2.5" marker-end="url(#arb)"/>

  <!-- Detector -->
  <g>
    <rect x="280" y="340" width="340" height="110" rx="10" fill="#fdecea" stroke="#e05a47" stroke-width="2"/>
    <text x="450" y="370" text-anchor="middle" font-size="16" font-weight="700" fill="#a12b1e">Canary 检测器</text>
    <text x="450" y="395" text-anchor="middle" font-size="12" fill="#5a2520">扫描每次 tool-call 的写入参数</text>
    <text x="450" y="415" text-anchor="middle" font-size="12" fill="#5a2520">匹配到注册过的 canary？</text>
    <text x="450" y="437" text-anchor="middle" font-size="13" font-weight="700" fill="#a12b1e">→ cross-boundary-flow 泄漏</text>
  </g>

  <!-- Arrow from agent tool-call to detector -->
  <path d="M450,255 L450,335" stroke="#e05a47" stroke-width="2.5" stroke-dasharray="5,4" fill="none" marker-end="url(#ar)"/>
  <text x="460" y="300" font-size="11" fill="#a12b1e">记录每次调用</text>

  <!-- Bottom conclusion -->
  <g>
    <rect x="120" y="485" width="660" height="50" rx="8" fill="#eef5ee" stroke="#3c8a4a" stroke-width="1.5"/>
    <text x="450" y="508" text-anchor="middle" font-size="13" font-weight="700" fill="#245a2f">无需人工读轨迹：字符串匹配即可量化跨边界数据传播</text>
    <text x="450" y="525" text-anchor="middle" font-size="11" fill="#3c8a4a">5 个模型 · 147 任务 · 11.5%–41.3% 违规率</text>
  </g>
</svg>