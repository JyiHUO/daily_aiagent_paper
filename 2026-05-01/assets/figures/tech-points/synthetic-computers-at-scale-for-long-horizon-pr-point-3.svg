<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" font-family="-apple-system, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#2c3e50"/>
    </marker>
    <marker id="arG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#2e7d5b"/>
    </marker>
    <marker id="arO" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#c06a1f"/>
    </marker>
    <marker id="arD" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1f2d3d"/>
    </marker>
  </defs>

  <rect width="900" height="560" fill="#f7f5ef"/>

  <text x="450" y="38" text-anchor="middle" font-size="22" font-weight="700" fill="#1f2d3d">一次仿真，两种训练信号</text>
  <text x="450" y="62" text-anchor="middle" font-size="13" fill="#6b6b6b">2272 轮 · 8.59 小时 · 31 次协作 · 文件 112 → 197</text>

  <!-- Center: simulation -->
  <rect x="340" y="95" width="220" height="115" rx="14" fill="#2c3e50"/>
  <text x="450" y="128" text-anchor="middle" font-size="18" font-weight="700" fill="#fff">长程仿真</text>
  <text x="450" y="153" text-anchor="middle" font-size="12" fill="#cfd8dc">在合成电脑上跑一个月</text>
  <text x="450" y="174" text-anchor="middle" font-size="12" fill="#cfd8dc">双 Agent 协作工作</text>
  <text x="450" y="195" text-anchor="middle" font-size="12" fill="#cfd8dc">Margaret 的一整段职场</text>

  <!-- Left: process trajectory -->
  <rect x="50" y="260" width="330" height="210" rx="14" fill="#e8f3ec" stroke="#2e7d5b" stroke-width="2"/>
  <text x="215" y="289" text-anchor="middle" font-size="17" font-weight="700" fill="#2e7d5b">过程信号 (Process)</text>
  <text x="215" y="310" text-anchor="middle" font-size="12" fill="#3a5a48">2272 轮中间轨迹 · agentic RL 最缺的</text>

  <g font-size="12" fill="#1f2d3d">
    <circle cx="80" cy="340" r="4" fill="#2e7d5b"/>
    <text x="92" y="344">搜索 &amp; 规划</text>
    <circle cx="80" cy="368" r="4" fill="#2e7d5b"/>
    <text x="92" y="372">多版本修订 AllocationModel.xlsx</text>
    <circle cx="80" cy="396" r="4" fill="#2e7d5b"/>
    <text x="92" y="400">与 Hartley / Sandra 邮件往来</text>
    <circle cx="80" cy="424" r="4" fill="#2e7d5b"/>
    <text x="92" y="428">纠错与回溯</text>
    <circle cx="80" cy="452" r="4" fill="#2e7d5b"/>
    <text x="92" y="456">每日 activity log</text>
  </g>

  <!-- Right: deliverables -->
  <rect x="520" y="260" width="330" height="210" rx="14" fill="#fbece0" stroke="#c06a1f" stroke-width="2"/>
  <text x="685" y="289" text-anchor="middle" font-size="17" font-weight="700" fill="#c06a1f">结果信号 (Outcome)</text>
  <text x="685" y="310" text-anchor="middle" font-size="12" fill="#6d4520">交付物被 Judge 按 rubric 打分</text>

  <!-- file icons -->
  <g>
    <rect x="550" y="330" width="50" height="60" rx="4" fill="#fff" stroke="#c06a1f"/>
    <text x="575" y="365" text-anchor="middle" font-size="11" font-weight="700" fill="#c06a1f">PDF</text>
    <rect x="615" y="330" width="50" height="60" rx="4" fill="#fff" stroke="#c06a1f"/>
    <text x="640" y="365" text-anchor="middle" font-size="10" font-weight="700" fill="#c06a1f">XLSX</text>
    <rect x="680" y="330" width="50" height="60" rx="4" fill="#fff" stroke="#c06a1f"/>
    <text x="705" y="365" text-anchor="middle" font-size="10" font-weight="700" fill="#c06a1f">DOCX</text>
    <rect x="745" y="330" width="50" height="60" rx="4" fill="#fff" stroke="#c06a1f"/>
    <text x="770" y="365" text-anchor="middle" font-size="10" font-weight="700" fill="#c06a1f">PPTX</text>
  </g>

  <text x="685" y="418" text-anchor="middle" font-size="12" fill="#1f2d3d">CapMarketsOutlook-2026-FINAL.pdf</text>
  <text x="685" y="440" text-anchor="middle" font-size="12" fill="#1f2d3d">Judge: 55 条 rubric → 176 分</text>

  <!-- arrows from center to two boxes -->
  <path d="M 380 210 Q 300 238 250 258" stroke="#2e7d5b" stroke-width="2.5" fill="none" marker-end="url(#arG)"/>
  <path d="M 520 210 Q 600 238 650 258" stroke="#c06a1f" stroke-width="2.5" fill="none" marker-end="url(#arO)"/>

  <!-- bottom merge into reward box -->
  <path d="M 215 470 Q 320 498 385 510" stroke="#2e7d5b" stroke-width="2" fill="none" marker-end="url(#arD)"/>
  <path d="M 685 470 Q 580 498 515 510" stroke="#c06a1f" stroke-width="2" fill="none" marker-end="url(#arD)"/>

  <rect x="370" y="506" width="160" height="38" rx="19" fill="#1f2d3d"/>
  <text x="450" y="531" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">双重奖励训练 Agent</text>
</svg>