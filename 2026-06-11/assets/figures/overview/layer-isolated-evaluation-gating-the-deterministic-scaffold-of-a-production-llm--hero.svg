<svg xmlns="http://www.w3.org/2000/svg" width="900" height="600" viewBox="0 0 900 600">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4B8BDA"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#D9534F"/>
    </marker>
  </defs>

  <style>
    .t{font-family:'PingFang SC','Microsoft YaHei','Noto Sans CJK SC','Hiragino Sans GB',sans-serif;}
  </style>

  <!-- Title -->
  <text class="t" x="450" y="42" font-size="22" font-weight="700" fill="#1E3A5F" text-anchor="middle">分层切片评测：让聚合掩盖无所遁形</text>
  <text class="t" x="450" y="66" font-size="13" fill="#3D4F65" text-anchor="middle">Layer-Isolated Evaluation · No-LLM · 2.39s in CI</text>

  <!-- LEFT: aggregate (masking) -->
  <g>
    <rect x="60" y="110" width="320" height="200" rx="14" fill="#FFF4F2" stroke="#D9534F" stroke-width="1.5"/>
    <text class="t" x="220" y="138" font-size="15" font-weight="700" fill="#1E3A5F" text-anchor="middle">聚合通过率</text>
    <text class="t" x="220" y="158" font-size="11" fill="#3D4F65" text-anchor="middle">end-to-end pass rate</text>

    <rect x="100" y="190" width="240" height="34" rx="4" fill="#E5E9EF"/>
    <rect x="100" y="190" width="226" height="34" rx="4" fill="#F5B7AE"/>
    <text class="t" x="220" y="213" font-size="14" font-weight="700" fill="#8A2A22" text-anchor="middle">−1.7 ~ −5.9 pp</text>

    <text class="t" x="220" y="252" font-size="13" font-weight="700" fill="#8A2A22" text-anchor="middle">看似健康，回归被平均掩盖</text>
    <text class="t" x="220" y="278" font-size="11" fill="#8A2A22" text-anchor="middle">noise 级波动，进不了 hard-gate</text>
  </g>

  <!-- RIGHT: per-slice harness -->
  <g>
    <rect x="520" y="110" width="320" height="430" rx="14" fill="#EFF6FF" stroke="#4B8BDA" stroke-width="1.5"/>
    <text class="t" x="680" y="138" font-size="15" font-weight="700" fill="#1E3A5F" text-anchor="middle">分层切片 harness</text>
    <text class="t" x="680" y="158" font-size="11" fill="#3D4F65" text-anchor="middle">23 slices · 225 cases · no LLM</text>

    <g font-size="11" class="t">
      <rect x="540" y="180" width="160" height="16" rx="2" fill="#D8E8F8"/>
      <rect x="540" y="180" width="156" height="16" rx="2" fill="#7FB3E5"/>
      <text x="710" y="192" fill="#3D4F65">L0 本体</text>

      <rect x="540" y="204" width="160" height="16" rx="2" fill="#D8E8F8"/>
      <rect x="540" y="204" width="158" height="16" rx="2" fill="#7FB3E5"/>
      <text x="710" y="216" fill="#3D4F65">L0 意图</text>

      <rect x="540" y="228" width="160" height="16" rx="2" fill="#D8E8F8"/>
      <rect x="540" y="228" width="155" height="16" rx="2" fill="#7FB3E5"/>
      <text x="710" y="240" fill="#3D4F65">L2 路由</text>

      <rect x="540" y="252" width="160" height="16" rx="2" fill="#D8E8F8"/>
      <rect x="540" y="252" width="154" height="16" rx="2" fill="#7FB3E5"/>
      <text x="710" y="264" fill="#3D4F65">L3 分解</text>

      <!-- the broken one -->
      <rect x="540" y="276" width="160" height="16" rx="2" fill="#FBDAD5"/>
      <rect x="540" y="276" width="40" height="16" rx="2" fill="#D9534F"/>
      <text x="710" y="288" fill="#8A2A22" font-weight="700">L3 升级 ⚠</text>

      <rect x="540" y="300" width="160" height="16" rx="2" fill="#D8E8F8"/>
      <rect x="540" y="300" width="159" height="16" rx="2" fill="#7FB3E5"/>
      <text x="710" y="312" fill="#3D4F65">L4 安全</text>

      <rect x="540" y="324" width="160" height="16" rx="2" fill="#D8E8F8"/>
      <rect x="540" y="324" width="157" height="16" rx="2" fill="#7FB3E5"/>
      <text x="710" y="336" fill="#3D4F65">L4 计价</text>

      <rect x="540" y="348" width="160" height="16" rx="2" fill="#E5E9EF" stroke="#9AA7B5" stroke-dasharray="3 2"/>
      <text x="620" y="360" fill="#9AA7B5" text-anchor="middle">uncovered</text>
      <text x="710" y="360" fill="#3D4F65">L4 记忆</text>

      <rect x="540" y="372" width="160" height="16" rx="2" fill="#D8E8F8"/>
      <rect x="540" y="372" width="158" height="16" rx="2" fill="#7FB3E5"/>
      <text x="710" y="384" fill="#3D4F65">OOD 拒绝</text>

      <rect x="540" y="396" width="160" height="16" rx="2" fill="#D8E8F8"/>
      <rect x="540" y="396" width="156" height="16" rx="2" fill="#7FB3E5"/>
      <text x="710" y="408" fill="#3D4F65">防御层</text>
    </g>

    <text class="t" x="540" y="450" font-size="13" font-weight="700" fill="#8A2A22">责任切片：−25 ~ −91 pp</text>
    <text class="t" x="540" y="470" font-size="12" fill="#3D4F65">单层注入 → 单层崩溃</text>
    <text class="t" x="540" y="488" font-size="12" fill="#3D4F65">7/7 进 top-3，平均排名 1.29</text>
    <text class="t" x="540" y="514" font-size="11" fill="#4B8BDA">基线锁定 · PR 级 hard-gate</text>
  </g>

  <!-- center: regression injection -->
  <g>
    <circle cx="450" cy="200" r="48" fill="#FFE9C7" stroke="#E89B3C" stroke-width="1.5"/>
    <text class="t" x="450" y="195" font-size="13" font-weight="700" fill="#8A5A1F" text-anchor="middle">回归注入</text>
    <text class="t" x="450" y="214" font-size="11" fill="#8A5A1F" text-anchor="middle">monkeypatch</text>
    <text class="t" x="450" y="262" font-size="11" fill="#3D4F65" text-anchor="middle">逐层单点损坏</text>
  </g>

  <!-- arrows from injection to both panels -->
  <path d="M 402 200 L 382 200" fill="none" stroke="#D9534F" stroke-width="2" marker-end="url(#arrR)"/>
  <path d="M 498 200 L 518 200" fill="none" stroke="#4B8BDA" stroke-width="2" marker-end="url(#arr)"/>

  <!-- bottom takeaway -->
  <g>
    <rect x="60" y="350" width="320" height="190" rx="14" fill="#F4F7FB" stroke="#C8D4E2"/>
    <text class="t" x="220" y="378" font-size="13" font-weight="700" fill="#1E3A5F" text-anchor="middle">三个关键设计</text>

    <circle cx="90" cy="408" r="4" fill="#4B8BDA"/>
    <text class="t" x="105" y="412" font-size="12" fill="#3D4F65">无 LLM 确定性断言</text>

    <circle cx="90" cy="438" r="4" fill="#4B8BDA"/>
    <text class="t" x="105" y="442" font-size="12" fill="#3D4F65">每切片基线锁定</text>

    <circle cx="90" cy="468" r="4" fill="#4B8BDA"/>
    <text class="t" x="105" y="472" font-size="12" fill="#3D4F65">未覆盖即 null 不给分</text>

    <text class="t" x="220" y="510" font-size="11" fill="#4B8BDA" text-anchor="middle">225 cases / 2.39s · 每 PR 可跑</text>
  </g>
</svg>