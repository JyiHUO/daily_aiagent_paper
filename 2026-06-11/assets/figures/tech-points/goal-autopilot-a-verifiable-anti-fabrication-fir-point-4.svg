<svg xmlns="http://www.w3.org/2000/svg" width="720" height="480" viewBox="0 0 720 480">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4B8BDA"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4A9D6F"/>
    </marker>
    <marker id="arrB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#B97A56"/>
    </marker>
  </defs>

  <text x="360" y="44" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC','Hiragino Sans GB',sans-serif" font-size="20" font-weight="700" fill="#1E3A5F">No-False-Success：错误的单向安全性</text>

  <!-- Agent source -->
  <circle cx="110" cy="260" r="48" fill="#EFF6FF" stroke="#4B8BDA" stroke-width="2"/>
  <text x="110" y="256" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC','Hiragino Sans GB',sans-serif" font-size="14" fill="#1E3A5F" font-weight="600">Agent</text>
  <text x="110" y="276" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC','Hiragino Sans GB',sans-serif" font-size="11" fill="#3D4F65">声明完成</text>

  <!-- Gate as wall -->
  <rect x="290" y="150" width="80" height="220" fill="#FDF4E3" stroke="#D4A24C" stroke-width="2.5"/>
  <text x="330" y="246" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC','Hiragino Sans GB',sans-serif" font-size="15" font-weight="700" fill="#1E3A5F">Gate</text>
  <text x="330" y="268" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC','Hiragino Sans GB',sans-serif" font-size="11" fill="#3D4F65">A1·A2·A3</text>

  <!-- DONE outcome -->
  <rect x="500" y="140" width="170" height="80" rx="8" fill="#E8F4EC" stroke="#4A9D6F" stroke-width="2"/>
  <text x="585" y="172" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC','Hiragino Sans GB',sans-serif" font-size="15" font-weight="700" fill="#1E3A5F">DONE</text>
  <text x="585" y="196" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC','Hiragino Sans GB',sans-serif" font-size="11" fill="#3D4F65">⇒ 目标 G 成立（真完成）</text>

  <!-- STALL outcome -->
  <rect x="500" y="300" width="170" height="80" rx="8" fill="#F4ECE8" stroke="#B97A56" stroke-width="2"/>
  <text x="585" y="332" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC','Hiragino Sans GB',sans-serif" font-size="15" font-weight="700" fill="#1E3A5F">STALL</text>
  <text x="585" y="356" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC','Hiragino Sans GB',sans-serif" font-size="11" fill="#3D4F65">诚实停下，等人介入</text>

  <!-- arrows from agent to gate -->
  <path d="M158,248 L288,190" stroke="#4B8BDA" stroke-width="2" fill="none" marker-end="url(#arr)"/>
  <path d="M158,272 L288,330" stroke="#4B8BDA" stroke-width="2" fill="none" marker-end="url(#arr)"/>

  <!-- gate to outcomes -->
  <path d="M370,180 L498,180" stroke="#4A9D6F" stroke-width="2.2" fill="none" marker-end="url(#arrG)"/>
  <text x="434" y="170" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC','Hiragino Sans GB',sans-serif" font-size="11" fill="#4A9D6F">gate=⊤ 通过</text>

  <path d="M370,340 L498,340" stroke="#B97A56" stroke-width="2.2" fill="none" marker-end="url(#arrB)"/>
  <text x="434" y="330" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC','Hiragino Sans GB',sans-serif" font-size="11" fill="#B97A56">gate=⊥ 拦截</text>

  <!-- blocked false success path -->
  <path d="M180,250 Q330,425 535,255" stroke="#C0504D" stroke-width="1.8" fill="none" stroke-dasharray="5,4" opacity="0.7"/>
  <line x1="325" y1="378" x2="345" y2="358" stroke="#C0504D" stroke-width="3"/>
  <line x1="345" y1="378" x2="325" y2="358" stroke="#C0504D" stroke-width="3"/>
  <text x="360" y="455" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC','Hiragino Sans GB',sans-serif" font-size="12" fill="#C0504D" font-weight="600">绕过 Gate 的虚假成功路径 · 结构上不可能</text>
</svg>