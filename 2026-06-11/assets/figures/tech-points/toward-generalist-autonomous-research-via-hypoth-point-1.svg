<svg xmlns="http://www.w3.org/2000/svg" width="720" height="480" viewBox="0 0 720 480">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4B8BDA"/>
    </marker>
    <marker id="arrUp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#E8A87C"/>
    </marker>
  </defs>

  <text x="360" y="42" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC','Hiragino Sans GB',sans-serif" font-size="20" font-weight="600" fill="#1E3A5F">假设树：可累积的研究状态</text>
  <text x="360" y="64" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC','Hiragino Sans GB',sans-serif" font-size="12" fill="#3D4F65">Hypothesis Tree</text>

  <!-- Root -->
  <circle cx="360" cy="120" r="26" fill="#EFF6FF" stroke="#4B8BDA" stroke-width="2"/>
  <text x="360" y="124" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC','Hiragino Sans GB',sans-serif" font-size="12" fill="#1E3A5F">根方向</text>

  <!-- Level 2 connectors -->
  <line x1="343" y1="138" x2="237" y2="206" stroke="#4B8BDA" stroke-width="1.5"/>
  <line x1="360" y1="146" x2="360" y2="200" stroke="#4B8BDA" stroke-width="2.2"/>
  <line x1="377" y1="138" x2="483" y2="206" stroke="#4B8BDA" stroke-width="1.5"/>

  <circle cx="220" cy="222" r="22" fill="#FFF" stroke="#B0BEC5" stroke-width="1.5" stroke-dasharray="3,3"/>
  <text x="220" y="226" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC','Hiragino Sans GB',sans-serif" font-size="11" fill="#90A4AE">剪枝</text>

  <circle cx="360" cy="222" r="22" fill="#DCEAFB" stroke="#4B8BDA" stroke-width="2.5"/>
  <text x="360" y="226" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC','Hiragino Sans GB',sans-serif" font-size="11" fill="#1E3A5F">假设</text>

  <circle cx="500" cy="222" r="22" fill="#FFF" stroke="#4B8BDA" stroke-width="1.5"/>
  <text x="500" y="226" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC','Hiragino Sans GB',sans-serif" font-size="11" fill="#3D4F65">分支</text>

  <!-- Level 3 connectors -->
  <line x1="348" y1="240" x2="312" y2="296" stroke="#4B8BDA" stroke-width="2.2"/>
  <line x1="372" y1="240" x2="408" y2="296" stroke="#4B8BDA" stroke-width="1.5"/>

  <circle cx="300" cy="312" r="20" fill="#FFF1E0" stroke="#E8A87C" stroke-width="2"/>
  <text x="300" y="316" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC','Hiragino Sans GB',sans-serif" font-size="10" fill="#1E3A5F">叶=实验</text>

  <circle cx="420" cy="312" r="20" fill="#FFF" stroke="#B0BEC5" stroke-width="1.5"/>
  <text x="420" y="316" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC','Hiragino Sans GB',sans-serif" font-size="10" fill="#3D4F65">候选</text>

  <!-- Executor box -->
  <rect x="60" y="290" width="130" height="50" rx="8" fill="#EFF6FF" stroke="#4B8BDA" stroke-width="1.5"/>
  <text x="125" y="312" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC','Hiragino Sans GB',sans-serif" font-size="12" fill="#1E3A5F">短寿命 Executor</text>
  <text x="125" y="328" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC','Hiragino Sans GB',sans-serif" font-size="10" fill="#3D4F65">实现并评测</text>

  <!-- Down: dispatch (leaf -> executor) -->
  <path d="M 282 320 Q 230 332 192 318" stroke="#4B8BDA" stroke-width="1.8" fill="none" marker-end="url(#arr)"/>
  <text x="235" y="305" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC','Hiragino Sans GB',sans-serif" font-size="11" fill="#3D4F65">派发执行</text>

  <!-- Up: feedback insight propagates back to tree -->
  <path d="M 120 290 Q 140 180 335 128" stroke="#E8A87C" stroke-width="1.8" fill="none" stroke-dasharray="5,3" marker-end="url(#arrUp)"/>
  <text x="170" y="210" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC','Hiragino Sans GB',sans-serif" font-size="11" fill="#C97A4A">分数+洞见向祖先传播</text>

  <!-- Right side: legend -->
  <g transform="translate(540,290)">
    <rect x="0" y="0" width="150" height="120" rx="8" fill="#F7FAFC" stroke="#CBD5E0" stroke-width="1"/>
    <text x="75" y="22" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC','Hiragino Sans GB',sans-serif" font-size="11" font-weight="600" fill="#1E3A5F">每个节点包含</text>
    <circle cx="20" cy="46" r="4" fill="#4B8BDA"/>
    <text x="32" y="50" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC','Hiragino Sans GB',sans-serif" font-size="11" fill="#3D4F65">假设 h</text>
    <circle cx="20" cy="70" r="4" fill="#E8A87C"/>
    <text x="32" y="74" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC','Hiragino Sans GB',sans-serif" font-size="11" fill="#3D4F65">洞见 ι</text>
    <circle cx="20" cy="94" r="4" fill="#90A4AE"/>
    <text x="32" y="98" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC','Hiragino Sans GB',sans-serif" font-size="11" fill="#3D4F65">元数据 μ</text>
  </g>

  <text x="360" y="455" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC','Hiragino Sans GB',sans-serif" font-size="12" fill="#3D4F65">失败留为负向约束 · 路径可审计</text>
</svg>