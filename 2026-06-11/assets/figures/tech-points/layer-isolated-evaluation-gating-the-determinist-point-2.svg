<svg xmlns="http://www.w3.org/2000/svg" width="720" height="480" viewBox="0 0 720 480">
  <style>
    text { font-family: 'PingFang SC','Microsoft YaHei','Noto Sans CJK SC','Hiragino Sans GB',sans-serif; }
  </style>

  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4B8BDA"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="360" y="38" text-anchor="middle" font-size="20" font-weight="600" fill="#1E3A5F">注入回归 · 聚合掩盖 vs 切片报警</text>
  <text x="360" y="60" text-anchor="middle" font-size="13" fill="#3D4F65">同一个 bug，两种视角看到的差别</text>

  <!-- Injection source -->
  <g>
    <circle cx="90" cy="250" r="46" fill="#FEF3E2" stroke="#E8A857" stroke-width="2"/>
    <text x="90" y="246" text-anchor="middle" font-size="13" fill="#1E3A5F" font-weight="600">注入回归</text>
    <text x="90" y="266" text-anchor="middle" font-size="11" fill="#3D4F65">单层失效</text>
  </g>

  <!-- Arrows -->
  <path d="M 132 228 Q 190 160 258 155" stroke="#4B8BDA" stroke-width="2" fill="none" marker-end="url(#arr)"/>
  <path d="M 132 272 Q 190 350 258 350" stroke="#4B8BDA" stroke-width="2" fill="none" marker-end="url(#arr)"/>

  <text x="170" y="170" font-size="11" fill="#4B8BDA">看不见</text>
  <text x="170" y="345" font-size="11" fill="#4B8BDA">看得见</text>

  <!-- Top: Aggregate (masked) -->
  <g>
    <rect x="260" y="105" width="410" height="130" rx="10" fill="#EFF6FF" stroke="#4B8BDA" stroke-width="1.5"/>
    <text x="280" y="132" font-size="14" fill="#1E3A5F" font-weight="600">聚合通过率（所有切片平均）</text>

    <rect x="280" y="158" width="200" height="22" fill="#CFE0F4"/>
    <rect x="473" y="158" width="7" height="22" fill="#E8A857"/>
    <text x="495" y="174" font-size="13" fill="#1E3A5F" font-weight="600">−1.7 pp</text>

    <text x="280" y="212" font-size="12" fill="#A04848" font-style="italic">淹没在噪声里 · dashboard 上看不出退化</text>
  </g>

  <!-- Bottom: Slice (alarm) -->
  <g>
    <rect x="260" y="285" width="410" height="130" rx="10" fill="#FDECEC" stroke="#D86B6B" stroke-width="1.5"/>
    <text x="280" y="312" font-size="14" fill="#1E3A5F" font-weight="600">责任层切片（定位到具体一层）</text>

    <rect x="280" y="338" width="60" height="22" fill="#CFE0F4"/>
    <rect x="340" y="338" width="140" height="22" fill="#D86B6B"/>
    <text x="495" y="354" font-size="13" fill="#1E3A5F" font-weight="600">−36 pp</text>

    <text x="280" y="392" font-size="12" fill="#1E7A4F" font-style="italic">直接报警 · 一眼定位到该修哪一层</text>
  </g>
</svg>