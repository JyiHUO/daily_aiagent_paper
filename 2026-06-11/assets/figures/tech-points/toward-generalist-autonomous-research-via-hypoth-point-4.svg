<svg xmlns="http://www.w3.org/2000/svg" width="720" height="480" viewBox="0 0 720 480">
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4B8BDA"/>
    </marker>
  </defs>

  <text x="360" y="44" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC','Hiragino Sans GB',sans-serif" font-size="20" font-weight="700" fill="#1E3A5F">同一控制器 · 六类任务</text>
  <text x="360" y="68" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC','Hiragino Sans GB',sans-serif" font-size="13" fill="#3D4F65">depth=2 · 48h wall-clock</text>

  <!-- Center: one controller -->
  <circle cx="360" cy="240" r="58" fill="#FFF4E6" stroke="#E8A24A" stroke-width="2"/>
  <text x="360" y="234" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC','Hiragino Sans GB',sans-serif" font-size="15" font-weight="700" fill="#1E3A5F">Arbor</text>
  <text x="360" y="254" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC','Hiragino Sans GB',sans-serif" font-size="12" fill="#3D4F65">同一框架</text>

  <!-- arrows from controller to each task (drawn before boxes so endpoints sit at box edge) -->
  <g stroke="#4B8BDA" stroke-width="1.6" fill="none" marker-end="url(#ah)">
    <line x1="312" y1="212" x2="186" y2="152"/>
    <line x1="302" y1="240" x2="186" y2="240"/>
    <line x1="312" y1="268" x2="186" y2="328"/>
    <line x1="408" y1="212" x2="534" y2="152"/>
    <line x1="418" y1="240" x2="534" y2="240"/>
    <line x1="408" y1="268" x2="534" y2="328"/>
  </g>

  <!-- 6 task nodes around -->
  <g font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC','Hiragino Sans GB',sans-serif" font-size="12" fill="#1E3A5F">
    <rect x="60" y="120" width="124" height="46" rx="8" fill="#EFF6FF" stroke="#4B8BDA"/>
    <text x="122" y="140" text-anchor="middle" font-weight="600">优化器设计</text>
    <text x="122" y="156" text-anchor="middle" font-size="10" fill="#3D4F65">Optimizer</text>

    <rect x="60" y="217" width="124" height="46" rx="8" fill="#EFF6FF" stroke="#4B8BDA"/>
    <text x="122" y="237" text-anchor="middle" font-weight="600">架构设计</text>
    <text x="122" y="253" text-anchor="middle" font-size="10" fill="#3D4F65">Architecture</text>

    <rect x="60" y="314" width="124" height="46" rx="8" fill="#EFF6FF" stroke="#4B8BDA"/>
    <text x="122" y="334" text-anchor="middle" font-weight="600">终端任务</text>
    <text x="122" y="350" text-anchor="middle" font-size="10" fill="#3D4F65">Terminal-Bench</text>

    <rect x="536" y="120" width="124" height="46" rx="8" fill="#EFF6FF" stroke="#4B8BDA"/>
    <text x="598" y="140" text-anchor="middle" font-weight="600">浏览检索</text>
    <text x="598" y="156" text-anchor="middle" font-size="10" fill="#3D4F65">BrowseComp</text>

    <rect x="536" y="217" width="124" height="46" rx="8" fill="#EFF6FF" stroke="#4B8BDA"/>
    <text x="598" y="237" text-anchor="middle" font-weight="600">搜索智能体</text>
    <text x="598" y="253" text-anchor="middle" font-size="10" fill="#3D4F65">Search-Agent</text>

    <rect x="536" y="314" width="124" height="46" rx="8" fill="#EFF6FF" stroke="#4B8BDA"/>
    <text x="598" y="334" text-anchor="middle" font-weight="600">数学合成</text>
    <text x="598" y="350" text-anchor="middle" font-size="10" fill="#3D4F65">Math-Reason</text>
  </g>

  <!-- Bottom result strip -->
  <rect x="120" y="408" width="480" height="46" rx="8" fill="#FEF3F2" stroke="#D86C5C"/>
  <text x="360" y="428" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC','Hiragino Sans GB',sans-serif" font-size="13" font-weight="700" fill="#1E3A5F">通用提升来自搜索流程本身</text>
  <text x="360" y="446" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC','Hiragino Sans GB',sans-serif" font-size="11" fill="#3D4F65">Math +19.79 · BrowseComp 45→67 · 零样本迁移 HLE 25→31</text>
</svg>