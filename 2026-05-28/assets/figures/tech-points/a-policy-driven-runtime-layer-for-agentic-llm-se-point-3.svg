<svg xmlns="http://www.w3.org/2000/svg" width="720" height="480" viewBox="0 0 720 480">
  <style>
    .title { font-family: 'PingFang SC','Microsoft YaHei','Noto Sans CJK SC','Hiragino Sans GB',sans-serif; font-size: 18px; fill: #1E3A5F; font-weight: 600; }
    .label { font-family: 'PingFang SC','Microsoft YaHei','Noto Sans CJK SC','Hiragino Sans GB',sans-serif; font-size: 13px; fill: #3D4F65; }
    .name { font-family: 'PingFang SC','Microsoft YaHei','Noto Sans CJK SC','Hiragino Sans GB',sans-serif; font-size: 14px; fill: #1E3A5F; font-weight: 600; }
    .num { font-family: 'PingFang SC','Microsoft YaHei','Noto Sans CJK SC','Hiragino Sans GB',sans-serif; font-size: 22px; font-weight: 700; }
    .small { font-family: 'PingFang SC','Microsoft YaHei','Noto Sans CJK SC','Hiragino Sans GB',sans-serif; font-size: 11px; fill: #6B7A8F; }
  </style>

  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4B8BDA"/>
    </marker>
  </defs>

  <text x="360" y="40" text-anchor="middle" class="title">CacheSage vs 基线 · 五项胜出</text>

  <!-- 左列：基线 -->
  <rect x="60" y="80" width="180" height="60" rx="6" fill="#F1F2F5" stroke="#B8BFCB" stroke-width="1"/>
  <text x="150" y="105" text-anchor="middle" class="name">vLLM</text>
  <text x="150" y="128" text-anchor="middle" class="label">LRU 淘汰</text>

  <rect x="60" y="155" width="180" height="60" rx="6" fill="#F1F2F5" stroke="#B8BFCB" stroke-width="1"/>
  <text x="150" y="180" text-anchor="middle" class="name">Continuum</text>
  <text x="150" y="203" text-anchor="middle" class="label">TTL 钉住</text>

  <!-- 箭头指向 CacheSage 左边缘 -->
  <line x1="245" y1="148" x2="338" y2="148" stroke="#4B8BDA" stroke-width="2" marker-end="url(#ar)"/>

  <!-- 右列：CacheSage -->
  <rect x="340" y="100" width="320" height="100" rx="8" fill="#EFF6FF" stroke="#4B8BDA" stroke-width="2"/>
  <text x="500" y="130" text-anchor="middle" class="name">CacheSage</text>
  <text x="500" y="155" text-anchor="middle" class="label">学习 Agent 转移频率</text>
  <text x="500" y="180" text-anchor="middle" class="small">5 / 5 workloads win</text>

  <!-- 三个增益指标 -->
  <rect x="60" y="270" width="180" height="140" rx="8" fill="#FFF4E6" stroke="#E8A33D" stroke-width="1.5"/>
  <text x="150" y="300" text-anchor="middle" class="label">缓存命中率 ↑</text>
  <text x="150" y="345" text-anchor="middle" class="num" fill="#C97A1F">+13~37</text>
  <text x="150" y="380" text-anchor="middle" class="small">percentage points</text>

  <rect x="270" y="270" width="180" height="140" rx="8" fill="#EFF6FF" stroke="#4B8BDA" stroke-width="1.5"/>
  <text x="360" y="300" text-anchor="middle" class="label">首 token 延迟 ↓</text>
  <text x="360" y="345" text-anchor="middle" class="num" fill="#1E3A5F">−12~29%</text>
  <text x="360" y="380" text-anchor="middle" class="small">TTFT</text>

  <rect x="480" y="270" width="180" height="140" rx="8" fill="#EFF6FF" stroke="#4B8BDA" stroke-width="1.5"/>
  <text x="570" y="300" text-anchor="middle" class="label">吞吐 ↑</text>
  <text x="570" y="345" text-anchor="middle" class="num" fill="#1E3A5F">+6~14%</text>
  <text x="570" y="380" text-anchor="middle" class="small">throughput</text>

  <text x="360" y="450" text-anchor="middle" class="small">热路径开销 ~1μs / 协调状态 &lt; 25KB</text>
</svg>