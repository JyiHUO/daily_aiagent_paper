<svg xmlns="http://www.w3.org/2000/svg" width="720" height="480" viewBox="0 0 720 480">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L9,3 L0,6 z" fill="#4B8BDA"/>
    </marker>
    <marker id="arrowBroken" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L9,3 L0,6 z" fill="#D97757"/>
    </marker>
  </defs>

  <text x="360" y="42" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC','Hiragino Sans GB',sans-serif" font-size="20" font-weight="600" fill="#1E3A5F">执行对齐断裂</text>
  <text x="360" y="66" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC','Hiragino Sans GB',sans-serif" font-size="13" fill="#3D4F65">想得对，但没做成可验证的交付</text>

  <!-- Left: Reasoning -->
  <ellipse cx="130" cy="220" rx="92" ry="58" fill="#EFF6FF" stroke="#4B8BDA" stroke-width="2"/>
  <text x="130" y="214" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC','Hiragino Sans GB',sans-serif" font-size="16" font-weight="600" fill="#1E3A5F">模型推理</text>
  <text x="130" y="236" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC','Hiragino Sans GB',sans-serif" font-size="12" fill="#3D4F65">想法正确</text>

  <!-- Right: Workspace -->
  <rect x="500" y="160" width="180" height="120" rx="6" fill="#FFF4E6" stroke="#D97757" stroke-width="2"/>
  <text x="590" y="214" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC','Hiragino Sans GB',sans-serif" font-size="16" font-weight="600" fill="#1E3A5F">可验证交付</text>
  <text x="590" y="238" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC','Hiragino Sans GB',sans-serif" font-size="12" fill="#3D4F65">artifact / 状态</text>

  <!-- Bridge with gap -->
  <line x1="222" y1="220" x2="328" y2="220" stroke="#4B8BDA" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="408" y1="220" x2="498" y2="220" stroke="#D97757" stroke-width="2.5" stroke-dasharray="6,4" marker-end="url(#arrowBroken)"/>

  <!-- Gap symbol -->
  <text x="368" y="214" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC','Hiragino Sans GB',sans-serif" font-size="26" fill="#D97757">⚡</text>
  <text x="368" y="244" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC','Hiragino Sans GB',sans-serif" font-size="11" fill="#D97757" font-weight="600">harness 缺位</text>

  <!-- Failure modes -->
  <text x="360" y="318" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC','Hiragino Sans GB',sans-serif" font-size="13" font-weight="600" fill="#1E3A5F">失败轨迹的 5 类典型症状</text>

  <g font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC','Hiragino Sans GB',sans-serif" font-size="11" fill="#1E3A5F">
    <rect x="60" y="338" width="116" height="32" rx="4" fill="#FDECEC" stroke="#D97757" stroke-width="1"/>
    <text x="118" y="358" text-anchor="middle">格式违规 36%</text>

    <rect x="190" y="338" width="116" height="32" rx="4" fill="#FDECEC" stroke="#D97757" stroke-width="1"/>
    <text x="248" y="358" text-anchor="middle">恢复失败 25%</text>

    <rect x="320" y="338" width="116" height="32" rx="4" fill="#FDECEC" stroke="#D97757" stroke-width="1"/>
    <text x="378" y="358" text-anchor="middle">缺证据 15%</text>

    <rect x="450" y="338" width="116" height="32" rx="4" fill="#FDECEC" stroke="#D97757" stroke-width="1"/>
    <text x="508" y="358" text-anchor="middle">未提交 11%</text>

    <rect x="580" y="338" width="116" height="32" rx="4" fill="#FDECEC" stroke="#D97757" stroke-width="1"/>
    <text x="638" y="358" text-anchor="middle">状态丢失 9%</text>
  </g>

  <text x="360" y="420" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC','Hiragino Sans GB',sans-serif" font-size="12" fill="#3D4F65" font-style="italic">harness 的价值：把"想"显式地接到"做"</text>
</svg>