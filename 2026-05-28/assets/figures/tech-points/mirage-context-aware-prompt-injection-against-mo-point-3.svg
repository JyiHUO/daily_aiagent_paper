<svg xmlns="http://www.w3.org/2000/svg" width="720" height="480" viewBox="0 0 720 480">
  <defs>
    <marker id="arrB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4B8BDA"/>
    </marker>
    <marker id="arrO" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#E89B4A"/>
    </marker>
  </defs>

  <text x="360" y="40" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif" font-size="20" font-weight="700" fill="#1E3A5F">真实度 ≠ 攻击成功率</text>
  <text x="360" y="62" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif" font-size="12" fill="#3D4F65">Spearman ρ = −0.03，画质过滤失效</text>

  <!-- LEFT: 精致假UI -->
  <g>
    <rect x="70" y="100" width="220" height="210" rx="12" fill="#EFF6FF" stroke="#4B8BDA" stroke-width="1.5"/>
    <rect x="90" y="120" width="180" height="34" rx="4" fill="#ffffff" stroke="#4B8BDA"/>
    <rect x="98" y="130" width="60" height="6" rx="2" fill="#4B8BDA" opacity="0.6"/>
    <rect x="98" y="142" width="120" height="5" rx="2" fill="#4B8BDA" opacity="0.3"/>
    <rect x="90" y="166" width="180" height="34" rx="4" fill="#ffffff" stroke="#4B8BDA"/>
    <rect x="98" y="176" width="80" height="6" rx="2" fill="#4B8BDA" opacity="0.6"/>
    <rect x="98" y="188" width="100" height="5" rx="2" fill="#4B8BDA" opacity="0.3"/>
    <text x="180" y="236" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif" font-size="14" fill="#1E3A5F" font-weight="700">渲染精致的假UI</text>
    <text x="180" y="270" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif" font-size="11" fill="#3D4F65">真实度 4.29  ·  ASR 普通</text>
  </g>

  <!-- RIGHT: 粗糙但命中指令 -->
  <g>
    <rect x="430" y="100" width="220" height="210" rx="12" fill="#FFF4E6" stroke="#E89B4A" stroke-width="1.5"/>
    <rect x="450" y="125" width="180" height="60" rx="4" fill="#ffffff" stroke="#E89B4A" stroke-dasharray="3,2"/>
    <text x="540" y="150" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif" font-size="12" fill="#B8651A" font-weight="700">Tap Add to Cart</text>
    <text x="540" y="170" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif" font-size="12" fill="#B8651A" font-weight="700">for 30% off</text>
    <text x="540" y="236" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif" font-size="14" fill="#1E3A5F" font-weight="700">粗糙但带指令</text>
    <text x="540" y="270" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif" font-size="11" fill="#B8651A" font-weight="600">真实度 4.29  ·  ASR 同样高</text>
  </g>

  <!-- center equivalence -->
  <text x="360" y="200" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif" font-size="28" fill="#1E3A5F" font-weight="700">≈</text>
  <text x="360" y="226" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif" font-size="11" fill="#3D4F65">ASR 与真实度无关</text>

  <!-- Agent at bottom -->
  <g>
    <ellipse cx="360" cy="410" rx="95" ry="34" fill="#1E3A5F"/>
    <text x="360" y="406" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif" font-size="14" fill="#ffffff" font-weight="700">GUI Agent</text>
    <text x="360" y="424" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif" font-size="10" fill="#BFD7F0">看语义，不看像素</text>
  </g>

  <!-- arrows to agent -->
  <path d="M 200 312 Q 240 360 290 393" stroke="#4B8BDA" stroke-width="2" fill="none" marker-end="url(#arrB)"/>
  <path d="M 520 312 Q 480 360 430 393" stroke="#E89B4A" stroke-width="2" fill="none" marker-end="url(#arrO)"/>
</svg>