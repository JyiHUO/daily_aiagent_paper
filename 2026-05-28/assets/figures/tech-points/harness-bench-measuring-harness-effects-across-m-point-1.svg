<svg xmlns="http://www.w3.org/2000/svg" width="720" height="480" viewBox="0 0 720 480">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4B8BDA"/>
    </marker>
  </defs>

  <text x="360" y="36" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC','Hiragino Sans GB',sans-serif" font-size="20" font-weight="700" fill="#1E3A5F">Agent = Model + Harness</text>
  <text x="360" y="58" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC','Hiragino Sans GB',sans-serif" font-size="13" fill="#3D4F65">固定车架，只换底盘</text>

  <!-- Fixed frame: shared task -->
  <rect x="60" y="78" width="600" height="64" rx="10" fill="#FFF4E6" stroke="#E8A857" stroke-width="1.5"/>
  <text x="360" y="104" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC','Hiragino Sans GB',sans-serif" font-size="14" font-weight="600" fill="#1E3A5F">同一任务 · 同一预算 · 同一裁判 (106 sandbox tasks)</text>
  <text x="360" y="126" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC','Hiragino Sans GB',sans-serif" font-size="12" fill="#3D4F65">8 models × 6 harnesses → 5,088 traces</text>

  <!-- Variable axis: harness chassis -->
  <text x="60" y="180" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC','Hiragino Sans GB',sans-serif" font-size="13" font-weight="600" fill="#1E3A5F">变量轴：6 个 Harness（context / tools / state / recovery）</text>

  <g font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC','Hiragino Sans GB',sans-serif" font-size="12" fill="#1E3A5F">
    <rect x="60" y="195" width="90" height="46" rx="8" fill="#EFF6FF" stroke="#4B8BDA" stroke-width="1.5"/>
    <text x="105" y="223" text-anchor="middle">H1</text>

    <rect x="160" y="195" width="90" height="46" rx="8" fill="#EFF6FF" stroke="#4B8BDA" stroke-width="1.5"/>
    <text x="205" y="223" text-anchor="middle">H2</text>

    <rect x="260" y="195" width="90" height="46" rx="8" fill="#EFF6FF" stroke="#4B8BDA" stroke-width="1.5"/>
    <text x="305" y="223" text-anchor="middle">H3</text>

    <rect x="360" y="195" width="90" height="46" rx="8" fill="#EFF6FF" stroke="#4B8BDA" stroke-width="1.5"/>
    <text x="405" y="223" text-anchor="middle">H4</text>

    <rect x="460" y="195" width="90" height="46" rx="8" fill="#EFF6FF" stroke="#4B8BDA" stroke-width="1.5"/>
    <text x="505" y="223" text-anchor="middle">H5</text>

    <rect x="560" y="195" width="90" height="46" rx="8" fill="#EFF6FF" stroke="#4B8BDA" stroke-width="1.5"/>
    <text x="605" y="223" text-anchor="middle">H6</text>
  </g>

  <!-- arrows down to scores -->
  <line x1="105" y1="246" x2="105" y2="288" stroke="#4B8BDA" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="205" y1="246" x2="205" y2="288" stroke="#4B8BDA" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="305" y1="246" x2="305" y2="288" stroke="#4B8BDA" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="405" y1="246" x2="405" y2="288" stroke="#4B8BDA" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="505" y1="246" x2="505" y2="288" stroke="#4B8BDA" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="605" y1="246" x2="605" y2="288" stroke="#4B8BDA" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- score axis label -->
  <text x="60" y="305" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC','Hiragino Sans GB',sans-serif" font-size="12" fill="#3D4F65">Diagnostic score</text>

  <!-- score bars showing variation -->
  <g>
    <rect x="80" y="315" width="50" height="85" fill="#C7DCF5" stroke="#4B8BDA" stroke-width="1"/>
    <rect x="180" y="345" width="50" height="55" fill="#C7DCF5" stroke="#4B8BDA" stroke-width="1"/>
    <rect x="280" y="325" width="50" height="75" fill="#C7DCF5" stroke="#4B8BDA" stroke-width="1"/>
    <rect x="380" y="370" width="50" height="30" fill="#C7DCF5" stroke="#4B8BDA" stroke-width="1"/>
    <rect x="480" y="335" width="50" height="65" fill="#C7DCF5" stroke="#4B8BDA" stroke-width="1"/>
    <rect x="580" y="358" width="50" height="42" fill="#C7DCF5" stroke="#4B8BDA" stroke-width="1"/>
    <line x1="60" y1="400" x2="660" y2="400" stroke="#1E3A5F" stroke-width="1.5"/>
  </g>

  <!-- delta annotation -->
  <line x1="105" y1="315" x2="105" y2="305" stroke="#D9534F" stroke-width="1"/>
  <line x1="405" y1="370" x2="405" y2="305" stroke="#D9534F" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="105" y1="305" x2="405" y2="305" stroke="#D9534F" stroke-width="1"/>
  <text x="255" y="300" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC','Hiragino Sans GB',sans-serif" font-size="11" fill="#D9534F">Δ ≥ 20</text>

  <text x="360" y="438" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC','Hiragino Sans GB',sans-serif" font-size="13" font-weight="600" fill="#1E3A5F">同模型换 harness：分差 ≥ 20 → 干净归因到执行层</text>
  <text x="360" y="458" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC','Hiragino Sans GB',sans-serif" font-size="11" fill="#3D4F65">越弱的模型对 harness 越敏感</text>
</svg>