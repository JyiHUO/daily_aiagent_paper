<svg width="720" height="480" viewBox="0 0 720 480" xmlns="http://www.w3.org/2000/svg" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC','Hiragino Sans GB',sans-serif">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4B8BDA"/>
    </marker>
  </defs>

  <text x="360" y="44" text-anchor="middle" font-size="20" font-weight="700" fill="#1E3A5F">乘法式严格分</text>
  <text x="360" y="68" text-anchor="middle" font-size="13" fill="#3D4F65">三者同时成立才得分，蒙对结果不算赢</text>

  <!-- Security 0/1 gate -->
  <rect x="60" y="160" width="150" height="130" rx="10" fill="#FEF3E8" stroke="#E89C4A" stroke-width="2"/>
  <text x="135" y="195" text-anchor="middle" font-size="16" font-weight="700" fill="#1E3A5F">Security</text>
  <text x="135" y="232" text-anchor="middle" font-size="22" font-weight="700" fill="#E89C4A">0 / 1</text>
  <text x="135" y="268" text-anchor="middle" font-size="12" fill="#3D4F65">越权即归零</text>

  <text x="232" y="232" text-anchor="middle" font-size="28" font-weight="700" fill="#4B8BDA">×</text>

  <!-- Completion -->
  <rect x="255" y="160" width="150" height="130" rx="10" fill="#EFF6FF" stroke="#4B8BDA" stroke-width="2"/>
  <text x="330" y="195" text-anchor="middle" font-size="16" font-weight="700" fill="#1E3A5F">Completion</text>
  <text x="330" y="232" text-anchor="middle" font-size="20" font-weight="700" fill="#4B8BDA">[0, 1]</text>
  <text x="330" y="268" text-anchor="middle" font-size="12" fill="#3D4F65">是否完成</text>

  <text x="427" y="232" text-anchor="middle" font-size="28" font-weight="700" fill="#4B8BDA">×</text>

  <!-- Process -->
  <rect x="450" y="160" width="210" height="130" rx="10" fill="#EEF4EE" stroke="#5BA37F" stroke-width="2"/>
  <text x="555" y="190" text-anchor="middle" font-size="16" font-weight="700" fill="#1E3A5F">Process</text>
  <text x="555" y="216" text-anchor="middle" font-size="12" fill="#3D4F65">三项均值 [0, 1]</text>
  <text x="555" y="244" text-anchor="middle" font-size="11" fill="#3D4F65">Robust · ToolUse · Consist</text>
  <text x="555" y="272" text-anchor="middle" font-size="12" font-weight="700" fill="#5BA37F">过程靠谱</text>

  <!-- Arrows down to score -->
  <line x1="135" y1="290" x2="295" y2="375" stroke="#4B8BDA" stroke-width="2" marker-end="url(#ar)"/>
  <line x1="330" y1="290" x2="350" y2="372" stroke="#4B8BDA" stroke-width="2" marker-end="url(#ar)"/>
  <line x1="555" y1="290" x2="425" y2="375" stroke="#4B8BDA" stroke-width="2" marker-end="url(#ar)"/>

  <!-- Final score -->
  <rect x="240" y="380" width="240" height="68" rx="10" fill="#1E3A5F"/>
  <text x="360" y="408" text-anchor="middle" font-size="14" fill="#EFF6FF">诊断总分 = Sec × Comp × Proc</text>
  <text x="360" y="432" text-anchor="middle" font-size="13" font-weight="700" fill="#FFD68A">任一项为零，总分归零</text>
</svg>