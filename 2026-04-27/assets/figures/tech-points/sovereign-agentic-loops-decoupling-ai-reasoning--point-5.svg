<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1e7e34"/>
    </marker>
    <marker id="arRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#c0392b"/>
    </marker>
    <linearGradient id="gKey" x1="0" x2="1">
      <stop offset="0" stop-color="#ffe27a"/>
      <stop offset="1" stop-color="#f5a623"/>
    </linearGradient>
  </defs>

  <rect width="900" height="560" fill="#f7f8fb"/>

  <text x="450" y="36" text-anchor="middle" font-size="21" font-weight="700" fill="#1f2a44">
    短时凭证 + 默认拒绝：每次只发一把一次性钥匙
  </text>
  <text x="450" y="58" text-anchor="middle" font-size="13" fill="#5a6479">
    执行权永远留在控制平面，不交给 Agent
  </text>

  <!-- Traditional -->
  <g>
    <text x="220" y="92" text-anchor="middle" font-size="15" font-weight="700" fill="#c0392b">❌ 传统做法</text>
    <rect x="70" y="105" width="300" height="150" rx="10" fill="#fdecea" stroke="#e6a9a3"/>
    <rect x="90" y="140" width="90" height="60" rx="8" fill="#fff" stroke="#c0392b"/>
    <text x="135" y="175" text-anchor="middle" font-size="13" fill="#333">Agent</text>

    <!-- big key -->
    <g transform="translate(210,155)">
      <circle cx="15" cy="18" r="15" fill="url(#gKey)" stroke="#b8860b"/>
      <rect x="28" y="13" width="90" height="10" fill="url(#gKey)" stroke="#b8860b"/>
      <rect x="100" y="23" width="6" height="10" fill="#b8860b"/>
      <rect x="112" y="23" width="6" height="10" fill="#b8860b"/>
    </g>
    <text x="280" y="225" text-anchor="middle" font-size="12" fill="#8a2b23">长期持有 · 大权限</text>
  </g>

  <!-- SAL -->
  <g>
    <text x="680" y="92" text-anchor="middle" font-size="15" font-weight="700" fill="#1e7e34">✅ SAL 做法</text>
    <rect x="530" y="105" width="300" height="150" rx="10" fill="#e8f5ec" stroke="#9cc9a8"/>

    <rect x="550" y="140" width="100" height="60" rx="8" fill="#fff" stroke="#1e7e34"/>
    <text x="600" y="165" text-anchor="middle" font-size="12" fill="#333">已审批意图</text>
    <text x="600" y="185" text-anchor="middle" font-size="11" fill="#666">单次窗口</text>

    <!-- tiny key -->
    <g transform="translate(672,168)">
      <circle cx="8" cy="10" r="8" fill="url(#gKey)" stroke="#b8860b"/>
      <rect x="16" y="7" width="30" height="6" fill="url(#gKey)" stroke="#b8860b"/>
      <rect x="40" y="13" width="4" height="6" fill="#b8860b"/>
    </g>
    <text x="740" y="165" font-size="11" fill="#1e7e34">范围：1 台</text>
    <text x="740" y="182" font-size="11" fill="#1e7e34">时限：5 分钟</text>
    <text x="740" y="199" font-size="11" fill="#1e7e34">用完即焚</text>
  </g>

  <!-- Middle: example -->
  <rect x="110" y="290" width="680" height="95" rx="10" fill="#fff" stroke="#c9d2e0"/>
  <text x="130" y="316" font-size="13" font-weight="700" fill="#1f2a44">🎯 例子</text>
  <text x="130" y="342" font-size="13" fill="#333">控制平面临发凭证 <tspan font-family="monospace" fill="#0b66c3">Terminate i-0abc123 · TTL=5min</tspan></text>
  <text x="130" y="368" font-size="13" fill="#333">调用完成 → <tspan font-weight="700" fill="#1e7e34">立即作废</tspan>，Agent 无法复用</text>

  <!-- Default deny block -->
  <rect x="110" y="410" width="680" height="120" rx="10" fill="#fff3e0" stroke="#e0a96d"/>
  <text x="130" y="435" font-size="14" font-weight="700" fill="#b45b09">🛡 Default-Deny：任何环节出错 → 拒绝 + 记入证据链</text>

  <g font-size="12" fill="#333">
    <rect x="130" y="452" width="180" height="56" rx="6" fill="#fff" stroke="#e0a96d"/>
    <text x="220" y="475" text-anchor="middle">意图解析失败</text>
    <text x="220" y="495" text-anchor="middle" fill="#c0392b">→ denied</text>

    <rect x="330" y="452" width="180" height="56" rx="6" fill="#fff" stroke="#e0a96d"/>
    <text x="420" y="475" text-anchor="middle">上下文拉不到</text>
    <text x="420" y="495" text-anchor="middle" fill="#c0392b">→ denied</text>

    <rect x="530" y="452" width="180" height="56" rx="6" fill="#fff" stroke="#e0a96d"/>
    <text x="620" y="475" text-anchor="middle">适配器报错</text>
    <text x="620" y="495" text-anchor="middle" fill="#c0392b">→ denied</text>
  </g>

  <!-- arrows connecting top to middle -->
  <path d="M 220,255 C 220,275 340,280 380,290" fill="none" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arRed)"/>
  <path d="M 680,255 C 680,275 560,280 520,290" fill="none" stroke="#1e7e34" stroke-width="1.8" marker-end="url(#ar)"/>
</svg>