<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
    <marker id="arG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#059669"/>
    </marker>
    <marker id="arR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
    <linearGradient id="bg" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset="1" stop-color="#e2e8f0"/>
    </linearGradient>
  </defs>

  <rect width="900" height="600" fill="url(#bg)"/>

  <!-- Title -->
  <text x="450" y="38" text-anchor="middle" font-size="21" font-weight="bold" fill="#0f172a">加密证据链：每次执行都能被"回放"</text>
  <text x="450" y="62" text-anchor="middle" font-size="13" fill="#475569">C_t = ⟨ 意图 i_t , 理由 J_t , 评估 E_t , 动作 a_t , H(ctx) , H(C_{t-1}) ⟩</text>

  <!-- Chain blocks -->
  <g>
    <!-- Block 1 -->
    <rect x="45" y="100" width="220" height="180" rx="10" fill="#ffffff" stroke="#1e40af" stroke-width="2"/>
    <text x="155" y="124" text-anchor="middle" font-size="14" font-weight="bold" fill="#1e40af">C_{t-1}</text>
    <line x1="60" y1="134" x2="250" y2="134" stroke="#cbd5e1"/>
    <text x="60" y="156" font-size="12" fill="#334155">意图: SCALE-UP</text>
    <text x="60" y="176" font-size="12" fill="#334155">理由: CPU &gt; 80%</text>
    <text x="60" y="196" font-size="12" fill="#334155">评估: ✓ 通过</text>
    <text x="60" y="216" font-size="12" fill="#334155">动作: AddNode</text>
    <text x="60" y="242" font-size="11" fill="#64748b">H(ctx) = a91f…</text>
    <text x="60" y="262" font-size="11" fill="#64748b">H(prev) = 0000…</text>

    <!-- Block 2 (highlighted) -->
    <rect x="340" y="100" width="220" height="180" rx="10" fill="#fff7ed" stroke="#ea580c" stroke-width="2.5"/>
    <text x="450" y="124" text-anchor="middle" font-size="14" font-weight="bold" fill="#ea580c">C_t  （事故点）</text>
    <line x1="355" y1="134" x2="545" y2="134" stroke="#fed7aa"/>
    <text x="355" y="156" font-size="12" fill="#334155">意图: TERMINATE-NODE</text>
    <text x="355" y="176" font-size="12" fill="#334155">理由: memory 95%</text>
    <text x="355" y="196" font-size="12" fill="#334155">评估: ✓ 策略通过</text>
    <text x="355" y="216" font-size="12" fill="#334155">动作: Terminate(i-7f2)</text>
    <text x="355" y="242" font-size="11" fill="#64748b">H(ctx) = 3c8e…</text>
    <text x="355" y="262" font-size="11" fill="#64748b">H(prev) = a91f…</text>

    <!-- Block 3 -->
    <rect x="635" y="100" width="220" height="180" rx="10" fill="#ffffff" stroke="#1e40af" stroke-width="2"/>
    <text x="745" y="124" text-anchor="middle" font-size="14" font-weight="bold" fill="#1e40af">C_{t+1}</text>
    <line x1="650" y1="134" x2="840" y2="134" stroke="#cbd5e1"/>
    <text x="650" y="156" font-size="12" fill="#334155">意图: RESCHEDULE</text>
    <text x="650" y="176" font-size="12" fill="#334155">理由: pod pending</text>
    <text x="650" y="196" font-size="12" fill="#334155">评估: ✓ 通过</text>
    <text x="650" y="216" font-size="12" fill="#334155">动作: Reassign</text>
    <text x="650" y="242" font-size="11" fill="#64748b">H(ctx) = b12d…</text>
    <text x="650" y="262" font-size="11" fill="#64748b">H(prev) = 3c8e…</text>

    <!-- chain arrows -->
    <line x1="265" y1="190" x2="338" y2="190" stroke="#334155" stroke-width="2" marker-end="url(#ar)"/>
    <line x1="560" y1="190" x2="633" y2="190" stroke="#334155" stroke-width="2" marker-end="url(#ar)"/>
    <text x="301" y="182" text-anchor="middle" font-size="10" fill="#64748b">SHA-256</text>
    <text x="596" y="182" text-anchor="middle" font-size="10" fill="#64748b">SHA-256</text>
  </g>

  <!-- Replay section -->
  <g>
    <rect x="100" y="355" width="300" height="115" rx="10" fill="#ecfdf5" stroke="#059669" stroke-width="2"/>
    <text x="250" y="382" text-anchor="middle" font-size="15" font-weight="bold" fill="#065f46">Replay(C_t) = a_t</text>
    <text x="250" y="406" text-anchor="middle" font-size="12" fill="#065f46">确定性回放，得到完全相同的动作</text>
    <text x="250" y="428" text-anchor="middle" font-size="12" fill="#065f46">7500 条执行记录</text>
    <text x="250" y="450" text-anchor="middle" font-size="14" font-weight="bold" fill="#047857">100% 精确复现</text>

    <rect x="500" y="355" width="300" height="115" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
    <text x="650" y="382" text-anchor="middle" font-size="15" font-weight="bold" fill="#991b1b">任意一处被篡改</text>
    <text x="650" y="410" text-anchor="middle" font-size="12" fill="#991b1b">H(prev) 立刻对不上</text>
    <text x="650" y="440" text-anchor="middle" font-size="14" font-weight="bold" fill="#b91c1c">整条链失效 · 审计可见</text>
  </g>

  <!-- Arrows from chain to bottom -->
  <line x1="410" y1="282" x2="280" y2="353" stroke="#059669" stroke-width="2" marker-end="url(#arG)"/>
  <line x1="490" y1="282" x2="620" y2="353" stroke="#dc2626" stroke-width="2" marker-end="url(#arR)"/>

  <!-- Footer tag -->
  <text x="450" y="510" text-anchor="middle" font-size="14" fill="#0f172a" font-weight="bold">事后审计不再靠日志拼凑——决策本身可验证、可复现</text>
  <text x="450" y="533" text-anchor="middle" font-size="12" fill="#475569">把"当时为什么这么做"冻结进哈希链</text>

  <!-- legend -->
  <g transform="translate(330,560)" font-size="11" fill="#475569">
    <circle cx="8" cy="8" r="6" fill="none" stroke="#059669" stroke-width="2"/>
    <text x="22" y="12">可回放</text>
    <circle cx="110" cy="8" r="6" fill="none" stroke="#dc2626" stroke-width="2"/>
    <text x="124" y="12">防篡改</text>
    <circle cx="212" cy="8" r="6" fill="none" stroke="#1e40af" stroke-width="2"/>
    <text x="226" y="12">可追责</text>
  </g>
</svg>