<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif">
  <defs>
    <marker id="arR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#c0392b"/>
    </marker>
    <marker id="arG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1e8449"/>
    </marker>
  </defs>

  <text x="480" y="38" text-anchor="middle" font-size="22" font-weight="700" fill="#1a1a1a">只看输出 vs 完整 Trace：谁害的任务失败？</text>
  <text x="480" y="62" text-anchor="middle" font-size="13" fill="#666">输入上下文才是归因关键 — TraceElephant</text>

  <!-- LEFT: Output only -->
  <g>
    <rect x="40" y="95" width="420" height="460" rx="14" fill="#fdecea" stroke="#c0392b" stroke-width="2"/>
    <text x="250" y="124" text-anchor="middle" font-size="16" font-weight="700" fill="#a93226">仅输出 (Who &amp; When 设置)</text>
    <text x="250" y="144" text-anchor="middle" font-size="12" fill="#7b241c">像只看证人口供，没监控录像</text>

    <!-- Agents -->
    <rect x="70" y="175" width="110" height="60" rx="8" fill="#fff" stroke="#c0392b"/>
    <text x="125" y="200" text-anchor="middle" font-size="13" font-weight="600">Agent A</text>
    <text x="125" y="220" text-anchor="middle" font-size="11" fill="#888">output ✓?</text>

    <rect x="195" y="175" width="110" height="60" rx="8" fill="#fff" stroke="#c0392b"/>
    <text x="250" y="200" text-anchor="middle" font-size="13" font-weight="600">Agent B</text>
    <text x="250" y="220" text-anchor="middle" font-size="11" fill="#888">output ?</text>

    <rect x="320" y="175" width="110" height="60" rx="8" fill="#fff" stroke="#c0392b"/>
    <text x="375" y="200" text-anchor="middle" font-size="13" font-weight="600">Agent C</text>
    <text x="375" y="220" text-anchor="middle" font-size="11" fill="#888">output ✗</text>

    <line x1="180" y1="205" x2="193" y2="205" stroke="#c0392b" stroke-width="1.5" marker-end="url(#arR)"/>
    <line x1="305" y1="205" x2="318" y2="205" stroke="#c0392b" stroke-width="1.5" marker-end="url(#arR)"/>

    <!-- Question mark -->
    <text x="250" y="300" text-anchor="middle" font-size="52" font-weight="700" fill="#c0392b">?</text>
    <text x="250" y="332" text-anchor="middle" font-size="13" fill="#7b241c">21%+ 案例无法判断责任</text>

    <!-- Metrics -->
    <rect x="80" y="370" width="340" height="160" rx="10" fill="#fff" stroke="#c0392b"/>
    <text x="250" y="395" text-anchor="middle" font-size="13" font-weight="700" fill="#a93226">归因准确率</text>

    <text x="115" y="430" font-size="12" fill="#555">Agent 级</text>
    <rect x="175" y="418" width="102" height="16" fill="#f5b7b1"/>
    <text x="300" y="431" font-size="13" font-weight="700" fill="#c0392b">51%</text>

    <text x="115" y="470" font-size="12" fill="#555">Step 级</text>
    <rect x="175" y="458" width="32" height="16" fill="#f5b7b1"/>
    <text x="300" y="471" font-size="13" font-weight="700" fill="#c0392b">16%</text>

    <text x="250" y="510" text-anchor="middle" font-size="11" fill="#888">（输出不足以定位决定性错误步骤）</text>
  </g>

  <!-- VS -->
  <circle cx="480" cy="325" r="26" fill="#34495e"/>
  <text x="480" y="331" text-anchor="middle" font-size="15" font-weight="700" fill="#fff">VS</text>

  <!-- RIGHT: Full trace -->
  <g>
    <rect x="500" y="95" width="420" height="460" rx="14" fill="#e8f6ef" stroke="#1e8449" stroke-width="2"/>
    <text x="710" y="124" text-anchor="middle" font-size="16" font-weight="700" fill="#145a32">完整 Trace (TraceElephant)</text>
    <text x="710" y="144" text-anchor="middle" font-size="12" fill="#186a3b">输入 + 上下文 + metadata 全记录</text>

    <!-- Agents with input+output -->
    <rect x="530" y="175" width="110" height="60" rx="8" fill="#fff" stroke="#1e8449"/>
    <text x="585" y="197" text-anchor="middle" font-size="13" font-weight="600">Agent A</text>
    <text x="585" y="218" text-anchor="middle" font-size="10" fill="#1e8449">in + out + ctx</text>

    <rect x="655" y="175" width="110" height="60" rx="8" fill="#fff" stroke="#1e8449"/>
    <text x="710" y="197" text-anchor="middle" font-size="13" font-weight="600">Agent B</text>
    <text x="710" y="218" text-anchor="middle" font-size="10" fill="#c0392b">丢掉关键参数!</text>

    <rect x="780" y="175" width="110" height="60" rx="8" fill="#fff" stroke="#1e8449"/>
    <text x="835" y="197" text-anchor="middle" font-size="13" font-weight="600">Agent C</text>
    <text x="835" y="218" text-anchor="middle" font-size="10" fill="#888">被喂错数据 → ✗</text>

    <line x1="640" y1="205" x2="653" y2="205" stroke="#1e8449" stroke-width="1.5" marker-end="url(#arG)"/>
    <line x1="765" y1="205" x2="778" y2="205" stroke="#1e8449" stroke-width="1.5" marker-end="url(#arG)"/>

    <!-- Pinpoint -->
    <circle cx="710" cy="290" r="14" fill="#e67e22"/>
    <text x="710" y="295" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">!</text>
    <text x="710" y="330" text-anchor="middle" font-size="13" fill="#145a32">精确定位：Agent B 的过滤步骤</text>

    <!-- Metrics -->
    <rect x="540" y="370" width="340" height="160" rx="10" fill="#fff" stroke="#1e8449"/>
    <text x="710" y="395" text-anchor="middle" font-size="13" font-weight="700" fill="#145a32">归因准确率</text>

    <text x="575" y="430" font-size="12" fill="#555">Agent 级</text>
    <rect x="635" y="418" width="124" height="16" fill="#a9dfbf"/>
    <text x="790" y="431" font-size="13" font-weight="700" fill="#1e8449">62% ↑22%</text>

    <text x="575" y="470" font-size="12" fill="#555">Step 级</text>
    <rect x="635" y="458" width="56" height="16" fill="#a9dfbf"/>
    <text x="790" y="471" font-size="13" font-weight="700" fill="#1e8449">28% ↑76%</text>

    <text x="710" y="510" text-anchor="middle" font-size="11" fill="#555">metadata 与 input 缺一不可，Step 级尤为敏感</text>
  </g>
</svg>