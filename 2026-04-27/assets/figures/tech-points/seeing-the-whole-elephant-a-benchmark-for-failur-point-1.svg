<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" font-family="'Helvetica Neue',Arial,sans-serif">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#333"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="450" y="38" text-anchor="middle" font-size="24" font-weight="bold" fill="#1a1a1a">从"盲人摸象"到"看见整头大象"</text>
  <text x="450" y="62" text-anchor="middle" font-size="14" fill="#666">TraceElephant：全可观测的多 Agent 失败归因基准</text>

  <!-- LEFT: old benchmark -->
  <g>
    <rect x="50" y="100" width="340" height="360" rx="12" fill="#fdecec" stroke="#c0392b" stroke-width="2"/>
    <text x="220" y="130" text-anchor="middle" font-size="17" font-weight="bold" fill="#c0392b">旧基准：只看 Agent 输出</text>
    <text x="220" y="152" text-anchor="middle" font-size="12" fill="#a33">部分可观测 · 21% 案例无法判责</text>

    <rect x="90" y="180" width="260" height="120" rx="8" fill="#fff" stroke="#c0392b" stroke-dasharray="5,4"/>
    <text x="220" y="205" text-anchor="middle" font-size="13" fill="#555">trace step（仅输出可见）</text>

    <rect x="130" y="225" width="180" height="40" rx="6" fill="#f7d2d2" stroke="#c0392b"/>
    <text x="220" y="250" text-anchor="middle" font-size="13" fill="#333">Agent 输出: "答案 = 42"</text>

    <text x="220" y="285" text-anchor="middle" font-size="12" fill="#999">❌ 输入 prompt  ❌ 工具返回  ❌ 上下文</text>

    <rect x="90" y="330" width="260" height="110" rx="8" fill="#fff" stroke="#c0392b"/>
    <text x="220" y="360" text-anchor="middle" font-size="14" fill="#c0392b" font-weight="bold">谁的锅？说不清</text>
    <text x="220" y="385" text-anchor="middle" font-size="12" fill="#666">上游给错信息？</text>
    <text x="220" y="405" text-anchor="middle" font-size="12" fill="#666">还是本 Agent 自己推错？</text>
  </g>

  <!-- Arrow between -->
  <line x1="395" y1="280" x2="505" y2="280" stroke="#333" stroke-width="3" marker-end="url(#ar)"/>
  <text x="450" y="270" text-anchor="middle" font-size="13" font-weight="bold" fill="#333">补全 trace</text>

  <!-- RIGHT: TraceElephant -->
  <g>
    <rect x="510" y="100" width="340" height="360" rx="12" fill="#e8f6ee" stroke="#1f8a4c" stroke-width="2"/>
    <text x="680" y="130" text-anchor="middle" font-size="17" font-weight="bold" fill="#1f8a4c">TraceElephant：全程记录</text>
    <text x="680" y="152" text-anchor="middle" font-size="12" fill="#2a6e44">380 traces · 220 已标注 · 可重放</text>

    <!-- Step record -->
    <rect x="540" y="175" width="280" height="115" rx="8" fill="#fff" stroke="#1f8a4c"/>
    <text x="555" y="195" font-size="13" font-weight="bold" fill="#1f8a4c">Step 级记录</text>
    <text x="555" y="216" font-size="12" fill="#333">• 输入 prompt + 上下文</text>
    <text x="555" y="234" font-size="12" fill="#333">• Agent 输出</text>
    <text x="555" y="252" font-size="12" fill="#333">• 工具调用与返回日志</text>
    <text x="555" y="278" font-size="11" fill="#777">planner → browser → HTML 片段</text>

    <!-- Trace meta -->
    <rect x="540" y="305" width="135" height="75" rx="8" fill="#fff" stroke="#1f8a4c"/>
    <text x="607" y="325" text-anchor="middle" font-size="12" font-weight="bold" fill="#1f8a4c">Trace 元信息</text>
    <text x="607" y="348" text-anchor="middle" font-size="11" fill="#333">任务指令 / Agent 配置</text>
    <text x="607" y="366" text-anchor="middle" font-size="11" fill="#333">系统架构代码</text>

    <!-- Replay env -->
    <rect x="685" y="305" width="135" height="75" rx="8" fill="#fff" stroke="#1f8a4c"/>
    <text x="752" y="325" text-anchor="middle" font-size="12" font-weight="bold" fill="#1f8a4c">可重放环境</text>
    <text x="752" y="350" text-anchor="middle" font-size="11" fill="#333">这一步重新跑</text>
    <text x="752" y="368" text-anchor="middle" font-size="11" fill="#333">验证假设</text>

    <!-- Result -->
    <rect x="540" y="395" width="280" height="50" rx="8" fill="#1f8a4c"/>
    <text x="680" y="418" text-anchor="middle" font-size="13" font-weight="bold" fill="#fff">Step 级归因准确率 +76%</text>
    <text x="680" y="435" text-anchor="middle" font-size="11" fill="#d4f0de">定位到"谁、在哪一步"出错</text>
  </g>

  <!-- Bottom sources -->
  <g>
    <text x="450" y="500" text-anchor="middle" font-size="12" fill="#555">数据来源：三类代表性多 Agent 系统</text>
    <rect x="230" y="510" width="140" height="32" rx="16" fill="#f0f0f0" stroke="#888"/>
    <text x="300" y="531" text-anchor="middle" font-size="12" fill="#333">Captain-Agent</text>
    <rect x="380" y="510" width="140" height="32" rx="16" fill="#f0f0f0" stroke="#888"/>
    <text x="450" y="531" text-anchor="middle" font-size="12" fill="#333">Magentic-One</text>
    <rect x="530" y="510" width="140" height="32" rx="16" fill="#f0f0f0" stroke="#888"/>
    <text x="600" y="531" text-anchor="middle" font-size="12" fill="#333">SWE-Agent</text>
  </g>
</svg>