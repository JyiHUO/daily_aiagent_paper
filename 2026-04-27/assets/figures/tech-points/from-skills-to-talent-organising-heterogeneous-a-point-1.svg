<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 560" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#2b5cff"/>
    </marker>
    <marker id="arG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#888"/>
    </marker>
  </defs>

  <text x="430" y="36" text-anchor="middle" font-size="22" font-weight="700" fill="#111">Talent（身份） × Container（执行壳）</text>
  <text x="430" y="58" text-anchor="middle" font-size="13" fill="#666">同一个 Talent 可换壳部署；任何 runtime 只要实现 6 接口就能接入</text>

  <!-- Talent card -->
  <g>
    <rect x="50" y="100" width="230" height="230" rx="14" fill="#eef3ff" stroke="#2b5cff" stroke-width="2"/>
    <text x="165" y="128" text-anchor="middle" font-size="17" font-weight="700" fill="#2b5cff">Talent（谁）</text>
    <text x="165" y="148" text-anchor="middle" font-size="12" fill="#555">可移植的身份包</text>

    <rect x="75" y="168" width="180" height="30" rx="6" fill="#fff" stroke="#cfd8ef"/>
    <text x="165" y="188" text-anchor="middle" font-size="13" fill="#222">角色 + Prompt</text>

    <rect x="75" y="206" width="180" height="30" rx="6" fill="#fff" stroke="#cfd8ef"/>
    <text x="165" y="226" text-anchor="middle" font-size="13" fill="#222">技能 + 工具</text>

    <rect x="75" y="244" width="180" height="30" rx="6" fill="#fff" stroke="#cfd8ef"/>
    <text x="165" y="264" text-anchor="middle" font-size="13" fill="#222">工作原则</text>

    <text x="165" y="305" text-anchor="middle" font-size="12" fill="#2b5cff" font-style="italic">例：「软件工程师」</text>
  </g>

  <!-- Plug arrow -->
  <g>
    <line x1="285" y1="215" x2="355" y2="215" stroke="#2b5cff" stroke-width="3" marker-end="url(#ar)"/>
    <text x="320" y="205" text-anchor="middle" font-size="12" fill="#2b5cff">插入</text>
  </g>

  <!-- Container with 6 interfaces -->
  <g>
    <rect x="360" y="100" width="300" height="330" rx="14" fill="#fff7e6" stroke="#e8922a" stroke-width="2"/>
    <text x="510" y="128" text-anchor="middle" font-size="17" font-weight="700" fill="#b8690e">Container（怎么跑）</text>
    <text x="510" y="148" text-anchor="middle" font-size="12" fill="#777">六个类型化接口 = 统一插槽</text>

    <g font-size="12" fill="#333">
      <rect x="380" y="168" width="125" height="34" rx="6" fill="#fff" stroke="#e8c38a"/>
      <text x="442" y="190" text-anchor="middle">① Execution</text>
      <rect x="515" y="168" width="125" height="34" rx="6" fill="#fff" stroke="#e8c38a"/>
      <text x="577" y="190" text-anchor="middle">② Task</text>

      <rect x="380" y="210" width="125" height="34" rx="6" fill="#fff" stroke="#e8c38a"/>
      <text x="442" y="232" text-anchor="middle">③ Event</text>
      <rect x="515" y="210" width="125" height="34" rx="6" fill="#fff" stroke="#e8c38a"/>
      <text x="577" y="232" text-anchor="middle">④ Storage</text>

      <rect x="380" y="252" width="125" height="34" rx="6" fill="#fff" stroke="#e8c38a"/>
      <text x="442" y="274" text-anchor="middle">⑤ Context</text>
      <rect x="515" y="252" width="125" height="34" rx="6" fill="#fff" stroke="#e8c38a"/>
      <text x="577" y="274" text-anchor="middle">⑥ Lifecycle</text>
    </g>

    <text x="510" y="310" text-anchor="middle" font-size="12" fill="#b8690e">像 OS 内核给异构硬件的统一驱动</text>

    <!-- runtime options -->
    <rect x="380" y="330" width="80" height="36" rx="8" fill="#ffe8c2" stroke="#e8922a"/>
    <text x="420" y="353" text-anchor="middle" font-size="12" fill="#8a4b00">LangGraph</text>
    <rect x="470" y="330" width="90" height="36" rx="8" fill="#ffe8c2" stroke="#e8922a"/>
    <text x="515" y="353" text-anchor="middle" font-size="12" fill="#8a4b00">Claude Code</text>
    <rect x="570" y="330" width="70" height="36" rx="8" fill="#ffe8c2" stroke="#e8922a"/>
    <text x="605" y="353" text-anchor="middle" font-size="12" fill="#8a4b00">Script</text>

    <text x="510" y="395" text-anchor="middle" font-size="11" fill="#888">新增 runtime = 写一个符合 6 接口的壳</text>
  </g>

  <!-- Platform -->
  <g>
    <line x1="660" y1="215" x2="733" y2="215" stroke="#888" stroke-width="2" marker-end="url(#arG)"/>
    <rect x="735" y="160" width="100" height="110" rx="12" fill="#f2f2f2" stroke="#555"/>
    <text x="785" y="188" text-anchor="middle" font-size="14" font-weight="700" fill="#222">平台</text>
    <text x="785" y="213" text-anchor="middle" font-size="11" fill="#444">execute</text>
    <text x="785" y="231" text-anchor="middle" font-size="11" fill="#444">emit event</text>
    <text x="785" y="249" text-anchor="middle" font-size="11" fill="#444">save memory</text>
  </g>

  <!-- Bottom insight -->
  <g>
    <rect x="50" y="470" width="760" height="60" rx="10" fill="#111"/>
    <text x="430" y="497" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">把「身份」和「执行壳」解耦</text>
    <text x="430" y="517" text-anchor="middle" font-size="12" fill="#cfd8ef">同一个「软件工程师」Talent → 今天跑 Claude Code 壳，明天换 LangGraph 壳，平台调用完全不变</text>
  </g>
</svg>