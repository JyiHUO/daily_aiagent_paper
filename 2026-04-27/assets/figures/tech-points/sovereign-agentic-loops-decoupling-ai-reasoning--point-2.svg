<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
    <marker id="arB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/>
    </marker>
    <marker id="arR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
  </defs>

  <rect width="900" height="600" fill="#f8fafc"/>

  <text x="450" y="38" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">两道门：策略 + 一致性 双层校验</text>
  <text x="450" y="62" text-anchor="middle" font-size="13" fill="#64748b">E(i,s,P) = E_policy ∧ E_consistency — 任一不过则拒绝</text>

  <!-- Agent intent -->
  <rect x="40" y="230" width="180" height="110" rx="10" fill="#ffffff" stroke="#334155" stroke-width="2"/>
  <text x="130" y="258" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a">Agent 意图</text>
  <text x="130" y="285" text-anchor="middle" font-size="12" fill="#334155">"CPU过热，紧急驱逐集群"</text>
  <text x="130" y="318" text-anchor="middle" font-size="11" fill="#64748b">action + justification</text>

  <!-- branches from intent to two gates -->
  <line x1="220" y1="265" x2="285" y2="180" stroke="#2563eb" stroke-width="2" marker-end="url(#arB)"/>
  <line x1="220" y1="305" x2="285" y2="370" stroke="#d97706" stroke-width="2" marker-end="url(#ar)"/>

  <!-- Gate 1: Policy -->
  <rect x="285" y="110" width="270" height="140" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="2.5"/>
  <text x="420" y="138" text-anchor="middle" font-size="16" font-weight="700" fill="#1e3a8a">门① 策略层 (OPA)：硬规则</text>
  <text x="420" y="170" text-anchor="middle" font-size="12" fill="#334155">✗ 不许删生产库   ✗ 跨区限制</text>
  <text x="420" y="200" text-anchor="middle" font-size="13" fill="#059669" font-weight="600">✓ 紧急驱逐 允许</text>
  <text x="420" y="228" text-anchor="middle" font-size="12" fill="#1e40af">E_policy = 1</text>

  <!-- Gate 2: Consistency -->
  <rect x="285" y="300" width="270" height="140" rx="12" fill="#fef3c7" stroke="#d97706" stroke-width="2.5"/>
  <text x="420" y="328" text-anchor="middle" font-size="16" font-weight="700" fill="#78350f">门② 一致性层：理由 vs 现场</text>
  <text x="420" y="358" text-anchor="middle" font-size="12" fill="#92400e">把 justification J 与实时状态 c_t 对比</text>
  <text x="420" y="388" text-anchor="middle" font-size="12" fill="#334155">遥测显示：CPU 温度正常 → 理由不成立</text>
  <text x="420" y="420" text-anchor="middle" font-size="13" font-weight="700" fill="#dc2626">✗ E_consistency = 0</text>

  <!-- AND gate result lines -->
  <line x1="555" y1="180" x2="620" y2="260" stroke="#2563eb" stroke-width="2" marker-end="url(#arB)"/>
  <line x1="555" y1="370" x2="620" y2="290" stroke="#dc2626" stroke-width="2.5" marker-end="url(#arR)"/>

  <rect x="620" y="230" width="220" height="90" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="2.5"/>
  <text x="730" y="260" text-anchor="middle" font-size="16" font-weight="700" fill="#991b1b">拒绝执行</text>
  <text x="730" y="285" text-anchor="middle" font-size="12" fill="#7f1d1d">策略通过但语境不符</text>
  <text x="730" y="305" text-anchor="middle" font-size="12" fill="#7f1d1d">→ 一致性层拦截</text>

  <!-- stats -->
  <rect x="620" y="355" width="220" height="115" rx="10" fill="#ffffff" stroke="#334155" stroke-width="1.5"/>
  <text x="730" y="380" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">2500 对抗意图实测</text>
  <line x1="640" y1="390" x2="820" y2="390" stroke="#e2e8f0"/>
  <text x="645" y="415" font-size="12" fill="#2563eb">● 门① 拦下</text>
  <text x="825" y="415" text-anchor="end" font-size="14" font-weight="700" fill="#2563eb">93%</text>
  <text x="645" y="440" font-size="12" fill="#d97706">● 门② 补刀</text>
  <text x="825" y="440" text-anchor="end" font-size="14" font-weight="700" fill="#d97706">7%</text>
  <text x="730" y="460" text-anchor="middle" font-size="11" fill="#64748b">正是硬规则漏掉的那部分</text>

  <text x="450" y="560" text-anchor="middle" font-size="13" fill="#475569">硬规则挡已知红线，语义一致性揪出"说得通但不属实"</text>
</svg>