<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 620" font-family="'Helvetica Neue',Arial,sans-serif">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#333"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="480" y="38" text-anchor="middle" font-size="22" font-weight="700" fill="#1a1a1a">同一个查询，三种"找代码"方式</text>
  <text x="480" y="62" text-anchor="middle" font-size="14" fill="#666">查询：哪里处理了请求超时的重试逻辑？</text>

  <!-- Query box -->
  <rect x="340" y="80" width="280" height="42" rx="8" fill="#fff5e6" stroke="#e08a1e" stroke-width="1.5"/>
  <text x="480" y="106" text-anchor="middle" font-size="13" fill="#7a4a00">自然语言需求（和代码词面对不上）</text>

  <!-- Arrows to three methods -->
  <line x1="420" y1="122" x2="180" y2="170" stroke="#888" stroke-width="1.5" marker-end="url(#ar)"/>
  <line x1="480" y1="122" x2="480" y2="170" stroke="#888" stroke-width="1.5" marker-end="url(#ar)"/>
  <line x1="540" y1="122" x2="780" y2="170" stroke="#888" stroke-width="1.5" marker-end="url(#ar)"/>

  <!-- BM25 -->
  <g>
    <rect x="40" y="175" width="240" height="335" rx="10" fill="#fbeaea" stroke="#c94a4a" stroke-width="2"/>
    <text x="160" y="203" text-anchor="middle" font-size="16" font-weight="700" fill="#8a1f1f">BM25 关键词</text>
    <text x="160" y="223" text-anchor="middle" font-size="11" fill="#8a1f1f">按 timeout / retry 匹配</text>

    <rect x="60" y="240" width="200" height="175" rx="6" fill="#fff" stroke="#c94a4a" stroke-dasharray="3,3"/>
    <text x="72" y="260" font-size="10" fill="#999">log.py</text>
    <text x="72" y="278" font-size="10" fill="#c94a4a">print("timeout")</text>
    <text x="72" y="298" font-size="10" fill="#999">config.py</text>
    <text x="72" y="316" font-size="10" fill="#c94a4a">RETRY = 3</text>
    <text x="72" y="336" font-size="10" fill="#999">test_foo.py</text>
    <text x="72" y="354" font-size="10" fill="#c94a4a">retry_msg = ...</text>
    <text x="72" y="380" font-size="11" fill="#8a1f1f">✗ 零散、错位，丢掉真正逻辑</text>

    <text x="160" y="445" text-anchor="middle" font-size="12" fill="#555">Recall</text>
    <text x="160" y="478" text-anchor="middle" font-size="24" font-weight="700" fill="#c94a4a">0.537</text>
  </g>

  <!-- Dense -->
  <g>
    <rect x="360" y="175" width="240" height="335" rx="10" fill="#eef1f8" stroke="#5c6fa5" stroke-width="2"/>
    <text x="480" y="203" text-anchor="middle" font-size="16" font-weight="700" fill="#2b3a6b">向量检索</text>
    <text x="480" y="223" text-anchor="middle" font-size="11" fill="#2b3a6b">30 行固定窗口, top-3</text>

    <rect x="380" y="240" width="200" height="175" rx="6" fill="#fff" stroke="#5c6fa5" stroke-dasharray="3,3"/>
    <text x="392" y="260" font-size="10" fill="#999">client.py (行 40-70)</text>
    <text x="392" y="282" font-size="10" fill="#333">def send_request():</text>
    <text x="392" y="298" font-size="10" fill="#333">  try:</text>
    <text x="392" y="314" font-size="10" fill="#333">    r = http.get(...)</text>
    <text x="392" y="330" font-size="10" fill="#333">  except Timeout:</text>
    <line x1="392" y1="340" x2="568" y2="340" stroke="#c94a4a" stroke-width="1.5" stroke-dasharray="3,2"/>
    <text x="480" y="356" text-anchor="middle" font-size="10" fill="#c94a4a">— 窗口在这里被切断 —</text>
    <text x="392" y="380" font-size="11" fill="#2b3a6b">✗ except 块截断，越界丢失</text>

    <text x="480" y="445" text-anchor="middle" font-size="12" fill="#555">Recall</text>
    <text x="480" y="478" text-anchor="middle" font-size="24" font-weight="700" fill="#5c6fa5">0.868</text>
  </g>

  <!-- LLM Viewer -->
  <g>
    <rect x="680" y="175" width="240" height="335" rx="10" fill="#e6f5ec" stroke="#2e8b57" stroke-width="2.5"/>
    <text x="800" y="203" text-anchor="middle" font-size="16" font-weight="700" fill="#1e5a38">LLM Viewer ⭐</text>
    <text x="800" y="223" text-anchor="middle" font-size="11" fill="#1e5a38">理解意图 + 按语义裁块</text>

    <rect x="700" y="240" width="200" height="175" rx="6" fill="#fff" stroke="#2e8b57" stroke-dasharray="3,3"/>
    <text x="712" y="260" font-size="10" fill="#999">client.py · 完整 try 块</text>
    <text x="712" y="278" font-size="10" fill="#333">def send_request():</text>
    <text x="712" y="294" font-size="10" fill="#333">  for i in range(N):</text>
    <text x="712" y="310" font-size="10" fill="#333">    try: http.get(...)</text>
    <text x="712" y="326" font-size="10" fill="#333">    except Timeout:</text>
    <text x="712" y="342" font-size="10" fill="#2e8b57">      backoff(i); retry()</text>
    <text x="712" y="362" font-size="10" fill="#999">retry.py · backoff 定义</text>
    <text x="712" y="388" font-size="11" fill="#1e5a38">✓ 跨函数完整逻辑，裁剪干净</text>

    <text x="800" y="445" text-anchor="middle" font-size="12" fill="#555">Recall</text>
    <text x="800" y="478" text-anchor="middle" font-size="24" font-weight="700" fill="#2e8b57">0.938</text>
  </g>

  <!-- Bottom note -->
  <rect x="120" y="540" width="720" height="60" rx="8" fill="#f5f5f5" stroke="#bbb"/>
  <text x="480" y="565" text-anchor="middle" font-size="13" fill="#333">上下文压缩 60.3%，长文件（&gt;300 行）优势最大</text>
  <text x="480" y="586" text-anchor="middle" font-size="12" fill="#666">小模型（GPT-5-mini）就够 —— 拼的是"懂查询"，不是"模型大"</text>
</svg>