<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 560" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif">
  <defs>
    <marker id="arR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#c0392b"/>
    </marker>
    <marker id="arG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1e8449"/>
    </marker>
  </defs>

  <text x="440" y="34" text-anchor="middle" font-size="22" font-weight="700" fill="#111">结构化控件 &gt; 自由聊天</text>
  <text x="440" y="58" text-anchor="middle" font-size="13" fill="#666">真实资金下，UI 决定可靠性</text>

  <!-- LEFT: Free chat -->
  <g>
    <rect x="50" y="90" width="340" height="170" rx="12" fill="#fdecea" stroke="#c0392b" stroke-width="2"/>
    <text x="220" y="118" text-anchor="middle" font-size="15" font-weight="700" fill="#c0392b">自由聊天框</text>
    <rect x="75" y="140" width="290" height="80" rx="6" fill="#fff" stroke="#e6b8b3"/>
    <text x="90" y="170" font-size="14" fill="#333">"帮我 outperform"</text>
    <text x="90" y="198" font-size="12" fill="#999">跑赢什么？何时卖？没说</text>
    <text x="220" y="245" text-anchor="middle" font-size="12" fill="#c0392b">无法校验的意图</text>
  </g>

  <!-- RIGHT: Structured -->
  <g>
    <rect x="490" y="90" width="340" height="170" rx="12" fill="#e8f5ee" stroke="#1e8449" stroke-width="2"/>
    <text x="660" y="118" text-anchor="middle" font-size="15" font-weight="700" fill="#1e8449">Slider + 带条件策略</text>

    <g font-size="11" fill="#333">
      <text x="510" y="145">Trade Size</text>
      <rect x="590" y="138" width="220" height="6" rx="3" fill="#cfe6d8"/>
      <circle cx="805" cy="141" r="6" fill="#1e8449"/>
      <text x="510" y="168">Risk</text>
      <rect x="590" y="161" width="220" height="6" rx="3" fill="#cfe6d8"/>
      <circle cx="740" cy="164" r="6" fill="#1e8449"/>
      <text x="510" y="191">Diversify</text>
      <rect x="590" y="184" width="220" height="6" rx="3" fill="#cfe6d8"/>
      <circle cx="660" cy="187" r="6" fill="#1e8449"/>
    </g>
    <rect x="510" y="208" width="300" height="38" rx="6" fill="#fff" stroke="#b8dcc6"/>
    <text x="520" y="232" font-size="12" fill="#333">"XYZ 涨 &gt;20% 卖一半" · 过期 24h</text>
  </g>

  <!-- middle compiler -->
  <rect x="340" y="310" width="200" height="60" rx="10" fill="#eef2ff" stroke="#4050c0" stroke-width="2"/>
  <text x="440" y="338" text-anchor="middle" font-size="14" font-weight="700" fill="#2c3a9e">Prompt 编译 + 硬约束</text>
  <text x="440" y="357" text-anchor="middle" font-size="11" fill="#556">滑块→参数 · 策略→规则</text>

  <!-- arrows to compiler -->
  <path d="M 300 260 L 365 308" stroke="#c0392b" stroke-width="2" fill="none" marker-end="url(#arR)"/>
  <path d="M 580 260 L 515 308" stroke="#1e8449" stroke-width="2" fill="none" marker-end="url(#arG)"/>

  <!-- outcomes -->
  <rect x="70" y="410" width="300" height="110" rx="10" fill="#fff" stroke="#c0392b" stroke-width="1.5"/>
  <text x="220" y="440" text-anchor="middle" font-size="14" font-weight="700" fill="#c0392b">模糊意图</text>
  <text x="220" y="467" text-anchor="middle" font-size="13" fill="#333">Agent 在 trace 里反复纠结</text>
  <text x="220" y="500" text-anchor="middle" font-size="20" font-weight="800" fill="#c0392b">基准盈利率</text>

  <rect x="510" y="410" width="300" height="110" rx="10" fill="#fff" stroke="#1e8449" stroke-width="1.5"/>
  <text x="660" y="440" text-anchor="middle" font-size="14" font-weight="700" fill="#1e8449">明确退出条件</text>
  <text x="660" y="467" text-anchor="middle" font-size="13" fill="#333">纯 slider 用户 41% 盈利</text>
  <text x="660" y="500" text-anchor="middle" font-size="20" font-weight="800" fill="#1e8449">4.2× 盈利概率</text>

  <path d="M 400 372 L 230 408" stroke="#c0392b" stroke-width="2" fill="none" marker-end="url(#arR)"/>
  <path d="M 480 372 L 650 408" stroke="#1e8449" stroke-width="2" fill="none" marker-end="url(#arG)"/>
</svg>