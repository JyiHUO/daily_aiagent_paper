<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" font-family="'Helvetica Neue',Arial,sans-serif">
  <rect width="900" height="560" fill="#F6F3EC"/>
  
  <!-- Title -->
  <text x="450" y="40" text-anchor="middle" font-size="22" font-weight="700" fill="#1E3A5F">同一个 Agent · 同一份需求 · 两种微架构</text>
  <text x="450" y="64" text-anchor="middle" font-size="13" fill="#3D4F65">Agent 读取 PnR / 时序反馈，回到 RTL 层做结构性重构</text>

  <defs>
    <marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L8,5 L0,10 z" fill="#4B8BDA"/>
    </marker>
  </defs>

  <!-- Central Agent -->
  <rect x="370" y="100" width="160" height="80" rx="10" fill="#FFE8CC" stroke="#E8A055" stroke-width="2"/>
  <text x="450" y="135" text-anchor="middle" font-size="16" font-weight="700" fill="#1E3A5F">Conductor 2.0</text>
  <text x="450" y="158" text-anchor="middle" font-size="12" fill="#3D4F65">AES CTR · 同一 repo</text>

  <!-- Feedback loop: PnR/timing feedback flows back into agent -->
  <path d="M 370 160 Q 300 160 290 200 Q 285 230 330 230 Q 380 230 400 180" fill="none" stroke="#4B8BDA" stroke-width="1.8" stroke-dasharray="5,3" marker-end="url(#ar)"/>
  <text x="235" y="205" font-size="11" fill="#3D4F65">时序 / PnR 反馈回灌</text>
  <text x="260" y="222" font-size="11" fill="#3D4F65">→ 重构 RTL</text>

  <!-- Arrows down to two branches -->
  <path d="M 410 180 L 250 262" stroke="#4B8BDA" stroke-width="2.5" fill="none" marker-end="url(#ar)"/>
  <path d="M 490 180 L 650 262" stroke="#4B8BDA" stroke-width="2.5" fill="none" marker-end="url(#ar)"/>

  <!-- Left: ASIC 7nm -->
  <rect x="70" y="270" width="320" height="230" rx="12" fill="#EFF6FF" stroke="#4B8BDA" stroke-width="2"/>
  <text x="230" y="300" text-anchor="middle" font-size="17" font-weight="700" fill="#1E3A5F">ASAP7 · 7nm ASIC</text>
  
  <rect x="90" y="318" width="280" height="30" fill="#C7DEF5" stroke="#4B8BDA"/>
  <text x="230" y="338" text-anchor="middle" font-size="11" fill="#1E3A5F">160 S-Box · 60 级深流水</text>

  <!-- Mini pipeline dashes -->
  <g transform="translate(90,360)" stroke="#4B8BDA" stroke-width="1" fill="#FFFFFF">
    <rect x="0" y="0" width="12" height="16"/>
    <rect x="16" y="0" width="12" height="16"/>
    <rect x="32" y="0" width="12" height="16"/>
    <rect x="48" y="0" width="12" height="16"/>
    <rect x="64" y="0" width="12" height="16"/>
    <rect x="80" y="0" width="12" height="16"/>
    <rect x="96" y="0" width="12" height="16"/>
    <rect x="112" y="0" width="12" height="16"/>
    <text x="135" y="12" font-size="11" fill="#3D4F65">...</text>
    <rect x="156" y="0" width="12" height="16"/>
    <rect x="172" y="0" width="12" height="16"/>
    <rect x="188" y="0" width="12" height="16"/>
    <rect x="204" y="0" width="12" height="16"/>
    <rect x="220" y="0" width="12" height="16"/>
    <rect x="236" y="0" width="12" height="16"/>
    <rect x="252" y="0" width="12" height="16"/>
    <rect x="268" y="0" width="12" height="16"/>
  </g>
  <text x="230" y="405" text-anchor="middle" font-size="11" fill="#3D4F65">S-Box 微流水，追极限频率</text>

  <rect x="90" y="425" width="280" height="55" rx="6" fill="#FFFFFF" stroke="#4B8BDA"/>
  <text x="230" y="450" text-anchor="middle" font-size="20" font-weight="700" fill="#C8532B">&gt; 400 Gbps</text>
  <text x="230" y="470" text-anchor="middle" font-size="12" fill="#3D4F65">@ 3.2 GHz</text>

  <!-- Right: FPGA -->
  <rect x="510" y="270" width="320" height="230" rx="12" fill="#EAF3EA" stroke="#6B9E5A" stroke-width="2"/>
  <text x="670" y="300" text-anchor="middle" font-size="17" font-weight="700" fill="#1E3A5F">KU5P-3 · FPGA</text>

  <text x="670" y="320" text-anchor="middle" font-size="11" fill="#3D4F65">每个 S-Box = 8 × 4 LUT6</text>

  <g transform="translate(555,332)" stroke="#6B9E5A" stroke-width="1" fill="#D6E8CF">
    <g>
      <rect x="0"   y="0"  width="26" height="16"/>
      <rect x="30"  y="0"  width="26" height="16"/>
      <rect x="60"  y="0"  width="26" height="16"/>
      <rect x="90"  y="0"  width="26" height="16"/>
      <rect x="120" y="0"  width="26" height="16"/>
      <rect x="150" y="0"  width="26" height="16"/>
      <rect x="180" y="0"  width="26" height="16"/>
      <rect x="210" y="0"  width="26" height="16"/>
    </g>
    <g transform="translate(0,20)">
      <rect x="0"   y="0"  width="26" height="16"/>
      <rect x="30"  y="0"  width="26" height="16"/>
      <rect x="60"  y="0"  width="26" height="16"/>
      <rect x="90"  y="0"  width="26" height="16"/>
      <rect x="120" y="0"  width="26" height="16"/>
      <rect x="150" y="0"  width="26" height="16"/>
      <rect x="180" y="0"  width="26" height="16"/>
      <rect x="210" y="0"  width="26" height="16"/>
    </g>
    <g transform="translate(0,40)">
      <rect x="0"   y="0"  width="26" height="16"/>
      <rect x="30"  y="0"  width="26" height="16"/>
      <rect x="60"  y="0"  width="26" height="16"/>
      <rect x="90"  y="0"  width="26" height="16"/>
      <rect x="120" y="0"  width="26" height="16"/>
      <rect x="150" y="0"  width="26" height="16"/>
      <rect x="180" y="0"  width="26" height="16"/>
      <rect x="210" y="0"  width="26" height="16"/>
    </g>
    <g transform="translate(0,60)">
      <rect x="0"   y="0"  width="26" height="16"/>
      <rect x="30"  y="0"  width="26" height="16"/>
      <rect x="60"  y="0"  width="26" height="16"/>
      <rect x="90"  y="0"  width="26" height="16"/>
      <rect x="120" y="0"  width="26" height="16"/>
      <rect x="150" y="0"  width="26" height="16"/>
      <rect x="180" y="0"  width="26" height="16"/>
      <rect x="210" y="0"  width="26" height="16"/>
    </g>
  </g>
  <text x="670" y="418" text-anchor="middle" font-size="11" fill="#3D4F65">贴合查找表资源，改走 LUT 映射</text>

  <rect x="530" y="425" width="280" height="55" rx="6" fill="#FFFFFF" stroke="#6B9E5A"/>
  <text x="670" y="450" text-anchor="middle" font-size="20" font-weight="700" fill="#3F7A2E">&gt; 100 Gbps</text>
  <text x="670" y="470" text-anchor="middle" font-size="12" fill="#3D4F65">@ 1 GHz</text>

  <!-- Bottom line -->
  <text x="450" y="532" text-anchor="middle" font-size="13" fill="#1E3A5F" font-weight="600">换工艺 = 换微架构：对 Agent 来说 refactor 成本几乎为零</text>
</svg>