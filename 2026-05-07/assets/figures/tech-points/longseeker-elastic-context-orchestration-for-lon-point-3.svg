<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" font-family="'Helvetica Neue',Arial,sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4B8BDA"/>
    </marker>
    <linearGradient id="gBlue" x1="0" x2="1">
      <stop offset="0" stop-color="#EFF6FF"/><stop offset="1" stop-color="#D8E8F8"/>
    </linearGradient>
  </defs>

  <text x="450" y="36" text-anchor="middle" font-size="21" font-weight="700" fill="#1E3A5F">
    LongSeeker：把"整理上下文"当成本能学进模型
  </text>
  <text x="450" y="60" text-anchor="middle" font-size="13" fill="#3D4F65">
    教师轨迹 → SFT，无需 RL，30B 模型登顶搜索 Agent
  </text>

  <!-- Teacher -->
  <rect x="40" y="95" width="220" height="115" rx="12" fill="url(#gBlue)" stroke="#4B8BDA" stroke-width="1.5"/>
  <text x="150" y="124" text-anchor="middle" font-size="15" font-weight="700" fill="#1E3A5F">教师：DeepSeek V3.2</text>
  <text x="150" y="150" text-anchor="middle" font-size="12" fill="#3D4F65">1 万多跳问题 rollout</text>
  <text x="150" y="175" text-anchor="middle" font-size="11" fill="#3D4F65">每步输出四字段轨迹</text>
  <text x="150" y="194" text-anchor="middle" font-size="11" font-weight="600" fill="#1E3A5F">think · meta-tool · motiv · tool</text>

  <!-- Arrow teacher->student -->
  <line x1="262" y1="152" x2="355" y2="152" stroke="#4B8BDA" stroke-width="2.2" marker-end="url(#arr)"/>
  <text x="308" y="142" text-anchor="middle" font-size="11" fill="#4B8BDA">next-token SFT</text>

  <!-- Student -->
  <rect x="360" y="95" width="220" height="115" rx="12" fill="#FFF4E0" stroke="#E0A84B" stroke-width="1.5"/>
  <text x="470" y="124" text-anchor="middle" font-size="15" font-weight="700" fill="#1E3A5F">学生：Qwen3-30B-A3B</text>
  <text x="470" y="150" text-anchor="middle" font-size="12" fill="#3D4F65">loss 覆盖整段结构化输出</text>
  <text x="470" y="178" text-anchor="middle" font-size="11" fill="#3D4F65">学会 Skip / Compress /</text>
  <text x="470" y="196" text-anchor="middle" font-size="11" fill="#3D4F65">Rollback / Snippet / Delete</text>

  <!-- Arrow student->result -->
  <line x1="582" y1="152" x2="665" y2="152" stroke="#4B8BDA" stroke-width="2.2" marker-end="url(#arr)"/>

  <!-- Result -->
  <rect x="670" y="95" width="200" height="115" rx="12" fill="#E8F4EC" stroke="#4CA373" stroke-width="1.5"/>
  <text x="770" y="124" text-anchor="middle" font-size="15" font-weight="700" fill="#1E3A5F">LongSeeker</text>
  <text x="770" y="148" text-anchor="middle" font-size="11" fill="#3D4F65">BrowseComp    61.5</text>
  <text x="770" y="166" text-anchor="middle" font-size="11" fill="#3D4F65">BrowseComp-ZH 62.5</text>
  <text x="770" y="184" text-anchor="middle" font-size="11" fill="#3D4F65">xbench        78.0</text>
  <text x="770" y="202" text-anchor="middle" font-size="11" fill="#3D4F65">GAIA-text     77.7</text>

  <!-- Divider -->
  <line x1="60" y1="248" x2="840" y2="248" stroke="#C9D6E6" stroke-width="1" stroke-dasharray="4 4"/>
  <text x="450" y="276" text-anchor="middle" font-size="15" font-weight="700" fill="#1E3A5F">300 步推理，上下文规模对比</text>

  <!-- Chart area -->
  <g transform="translate(90,300)">
    <!-- axes -->
    <line x1="0" y1="240" x2="720" y2="240" stroke="#1E3A5F" stroke-width="1.5"/>
    <line x1="0" y1="0" x2="0" y2="240" stroke="#1E3A5F" stroke-width="1.5"/>

    <!-- Window cap -->
    <line x1="0" y1="10" x2="720" y2="10" stroke="#B8B8B8" stroke-dasharray="4 4"/>
    <text x="725" y="14" font-size="10" fill="#7A7A7A">窗口上限 256k</text>

    <text x="-8" y="14" text-anchor="end" font-size="10" fill="#3D4F65">256k</text>
    <text x="-8" y="125" text-anchor="end" font-size="10" fill="#3D4F65">128k</text>
    <text x="-8" y="224" text-anchor="end" font-size="10" fill="#3D4F65">15k</text>
    <text x="-8" y="243" text-anchor="end" font-size="10" fill="#3D4F65">0</text>

    <text x="0" y="258" font-size="10" fill="#3D4F65">step 0</text>
    <text x="720" y="258" text-anchor="end" font-size="10" fill="#3D4F65">step 300</text>

    <!-- ReAct explosion curve -->
    <path d="M0,235 Q200,218 370,125 T720,15" stroke="#D8504B" stroke-width="3" fill="none"/>
    <circle cx="720" cy="15" r="5" fill="#D8504B"/>
    <text x="540" y="78" font-size="12" fill="#D8504B" font-weight="600">ReAct：线性爆炸 → 爆窗口</text>

    <!-- LongSeeker flat curve -->
    <path d="M0,228 Q200,225 370,226 T720,224" stroke="#2E8B5C" stroke-width="3" fill="none"/>
    <circle cx="720" cy="224" r="5" fill="#2E8B5C"/>
    <text x="400" y="216" font-size="12" fill="#2E8B5C" font-weight="600">LongSeeker：稳定 ~15k token</text>
  </g>
</svg>