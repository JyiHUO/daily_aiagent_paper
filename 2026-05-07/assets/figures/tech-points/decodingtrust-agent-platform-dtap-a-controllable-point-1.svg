<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" font-family="Arial, sans-serif">
  <defs>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L9,3 L0,6 z" fill="#4B8BDA"/>
    </marker>
    <marker id="arrR" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L9,3 L0,6 z" fill="#D97757"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="450" y="40" text-anchor="middle" font-size="24" font-weight="bold" fill="#1E3A5F">影子互联网：50+ 真实环境红队沙箱</text>
  <text x="450" y="65" text-anchor="middle" font-size="14" fill="#3D4F65">长得像真货 · 随便搞破坏 · 一键回滚</text>

  <!-- Red Team Agent (left) -->
  <rect x="40" y="230" width="170" height="130" rx="12" fill="#FFF1EC" stroke="#D97757" stroke-width="2"/>
  <text x="125" y="262" text-anchor="middle" font-size="16" font-weight="bold" fill="#1E3A5F">🎯 红队 Agent</text>
  <text x="125" y="295" text-anchor="middle" font-size="12" fill="#3D4F65">自主探索攻击路径</text>
  <text x="125" y="318" text-anchor="middle" font-size="12" fill="#3D4F65">注入恶意邮件 / 评论</text>
  <text x="125" y="341" text-anchor="middle" font-size="12" fill="#3D4F65">4k+ 恶意目标</text>

