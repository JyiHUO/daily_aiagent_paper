<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 620" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4B8BDA"/>
    </marker>
  </defs>

  <rect width="900" height="620" fill="#F7F9FC"/>

  <text x="450" y="38" text-anchor="middle" font-size="22" font-weight="700" fill="#1E3A5F">
    Harness 四支柱：让 Agent 撑完 80 小时芯片设计
  </text>
  <text x="450" y="62" text-anchor="middle" font-size="13" fill="#3D4F65">
    主 Agent 当总设计师，派子会话分工，用结构化记忆粘合全局
  </text>

  <!-- Main Agent (Conductor) -->
  <rect x="340" y="95" width="220" height="80" rx="10" fill="#DCE8FA" stroke="#4B8BDA" stroke-width="2"/>
  <text x="450" y="125" text-anchor="middle" font-size="17" font-weight="700" fill="#1E3A5F">主 Agent · 总设计师</text>
  <text x="450" y="148" text-anchor="middle" font-size="12" fill="#3D4F65">拆任务 / 定架构 / 维全局约束</text>
  <text x="450" y="165" text-anchor="middle" font-size="12" fill="#3D4F65">读 TurboQuant 论文 + 自然语言需求</text>

  <!-- Four pillars -->
  <g>
    <rect x="50" y="240" width="180" height="110" rx="10" fill="#EFF6FF" stroke="#4B8BDA" stroke-width="2"/>
    <text x="140" y="268" text-anchor="middle" font-size="15" font-weight="700" fill="#1E3A5F">① 上下文管理</text>
    <text x="140" y="298" text-anchor="middle" font-size="12" fill="#3D4F65">提高 prefix 命中率</text>
    <text x="140" y="318" text-anchor="middle" font-size="12" fill="#3D4F65">绕开 token 窗口上限</text>
  </g>

  <g>
    <rect x="255" y="240" width="180" height="110" rx="10" fill="#FFF3E6" stroke="#E89A4A" stroke-width="2"/>
    <text x="345" y="268" text-anchor="middle" font-size="15" font-weight="700" fill="#1E3A5F">② 子 Agent 会话</text>
    <text x="345" y="298" text-anchor="middle" font-size="12" fill="#3D4F65">分工写 RTL 模块</text>
    <text x="345" y="318" text-anchor="middle" font-size="12" fill="#3D4F65">跑 testbench / 结构化任务</text>
  </g>

  <g>
    <rect x="460" y="240" width="180" height="110" rx="10" fill="#FDECEC" stroke="#D97575" stroke-width="2"/>
    <text x="550" y="268" text-anchor="middle" font-size="15" font-weight="700" fill="#1E3A5F">③ 跨会话记忆</text>
    <text x="550" y="298" text-anchor="middle" font-size="12" fill="#3D4F65">数月级项目状态</text>
    <text x="550" y="318" text-anchor="middle" font-size="12" fill="#3D4F65">记笔记 / 存决策</text>
  </g>

  <g>
    <rect x="665" y="240" width="180" height="110" rx="10" fill="#E8F3EC" stroke="#4FA06F" stroke-width="2"/>
    <text x="755" y="268" text-anchor="middle" font-size="15" font-weight="700" fill="#1E3A5F">④ 领域知识注入</text>
    <text x="755" y="298" text-anchor="middle" font-size="12" fill="#3D4F65">RTL / 综合 / 时序</text>
    <text x="755" y="318" text-anchor="middle" font-size="12" fill="#3D4F65">论文 / 设计约定</text>
  </g>

  <!-- arrows from main to pillars -->
  <path d="M370,175 L170,238" stroke="#4B8BDA" stroke-width="2" fill="none" marker-end="url(#ar)"/>
  <path d="M420,175 L355,238" stroke="#4B8BDA" stroke-width="2" fill="none" marker-end="url(#ar)"/>
  <path d="M480,175 L545,238" stroke="#4B8BDA" stroke-width="2" fill="none" marker-end="url(#ar)"/>
  <path d="M530,175 L730,238" stroke="#4B8BDA" stroke-width="2" fill="none" marker-end="url(#ar)"/>

  <!-- Token consumption bar -->
  <text x="60" y="405" font-size="15" font-weight="700" fill="#1E3A5F">80 小时 token 开销画像（高层模块 + 最终集成最烧）</text>

  <g transform="translate(60,420)">
    <rect x="0"    y="0" width="49"  height="36" fill="#DCE8FA" stroke="#1E3A5F"/>
    <rect x="49"   y="0" width="220" height="36" fill="#FFD7A8" stroke="#1E3A5F"/>
    <rect x="269"  y="0" width="254" height="36" fill="#F5A9A9" stroke="#1E3A5F"/>
    <rect x="523"  y="0" width="257" height="36" fill="#A8D8B8" stroke="#1E3A5F"/>

    <text x="24"  y="23" text-anchor="middle" font-size="11" fill="#1E3A5F">架构</text>
    <text x="24"  y="52" text-anchor="middle" font-size="11" fill="#3D4F65">6.3%</text>

    <text x="159" y="23" text-anchor="middle" font-size="12" fill="#1E3A5F">底层模块 28.2%</text>

    <text x="396" y="23" text-anchor="middle" font-size="12" fill="#1E3A5F">高层模块 32.6%</text>

    <text x="651" y="23" text-anchor="middle" font-size="12" fill="#1E3A5F">最终集成 32.9%</text>
  </g>

  <!-- Example callout -->
  <rect x="60" y="500" width="780" height="95" rx="8" fill="#FFFBEC" stroke="#E89A4A" stroke-width="1.5" stroke-dasharray="5,3"/>
  <text x="75" y="525" font-size="13" font-weight="700" fill="#1E3A5F">例：VerTQ 验证阶段 FP16/FP32 对不齐</text>
  <text x="75" y="549" font-size="12" fill="#3D4F65">子 Agent 定位 → 发现负指数单元多项式误差过大 → 改用 5 阶 Taylor + Horner 重写</text>
  <text x="75" y="572" font-size="12" fill="#3D4F65">主 Agent 只维护进度与全局约束，定位-假设-修复循环全部交给子会话</text>
</svg>