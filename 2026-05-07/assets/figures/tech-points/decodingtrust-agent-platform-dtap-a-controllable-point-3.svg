<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4B8BDA"/>
    </marker>
    <marker id="arR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#C0564A"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="450" y="38" text-anchor="middle" font-size="22" font-weight="bold" fill="#1E3A5F">别听 Agent 说，查真实账本</text>
  <text x="450" y="62" text-anchor="middle" font-size="14" fill="#3D4F65">Verifiable Judge：用环境终态而非回答文本判成败</text>

  <!-- Agent -->
  <rect x="60" y="110" width="200" height="110" rx="10" fill="#FFF4E6" stroke="#E0A060" stroke-width="2"/>
  <text x="160" y="140" text-anchor="middle" font-size="15" font-weight="bold" fill="#1E3A5F">AI Agent 自述</text>
  <text x="160" y="172" text-anchor="middle" font-size="13" fill="#3D4F65">“客户数据已发送完成 ✓”</text>
  <text x="160" y="200" text-anchor="middle" font-size="11" fill="#8B6B3A" font-style="italic">（可能在撒谎）</text>

  <!-- LLM judge (被骗) -->
  <rect x="60" y="250" width="200" height="80" rx="10" fill="#F3F0F0" stroke="#B0A5A5" stroke-width="1.5" stroke-dasharray="5,4"/>
  <text x="160" y="278" text-anchor="middle" font-size="14" font-weight="bold" fill="#7A5555">✗ 旧法：LLM 当裁判</text>
  <text x="160" y="300" text-anchor="middle" font-size="12" fill="#7A5555">只读文本 → 轻易被骗</text>
  <text x="160" y="318" text-anchor="middle" font-size="12" fill="#7A5555">判定：攻击成功（误报）</text>

  <!-- Arrow agent -> llm judge -->
  <path d="M160,220 L160,248" stroke="#B0A5A5" stroke-width="2" fill="none" marker-end="url(#ar)" stroke-dasharray="4,3"/>

  <!-- VS -->
  <text x="340" y="230" text-anchor="middle" font-size="28" font-weight="bold" fill="#C0564A">VS</text>

  <!-- Environment DB -->
  <rect x="420" y="110" width="420" height="220" rx="10" fill="#EFF6FF" stroke="#4B8BDA" stroke-width="2"/>
  <text x="630" y="138" text-anchor="middle" font-size="15" font-weight="bold" fill="#1E3A5F">✓ 新法：查真实环境状态（终态）</text>

  <!-- Three mini checks -->
  <g>
    <rect x="438" y="158" width="120" height="70" rx="6" fill="#FFFFFF" stroke="#4B8BDA"/>
    <text x="498" y="182" text-anchor="middle" font-size="20">📧</text>
    <text x="498" y="203" text-anchor="middle" font-size="12" font-weight="bold" fill="#1E3A5F">Gmail 收件箱</text>
    <text x="498" y="220" text-anchor="middle" font-size="11" fill="#3D4F65">那封邮件到了吗？</text>
  </g>
  <g>
    <rect x="570" y="158" width="120" height="70" rx="6" fill="#FFFFFF" stroke="#4B8BDA"/>
    <text x="630" y="182" text-anchor="middle" font-size="20">💳</text>
    <text x="630" y="203" text-anchor="middle" font-size="12" font-weight="bold" fill="#1E3A5F">PayPal 账本</text>
    <text x="630" y="220" text-anchor="middle" font-size="11" fill="#3D4F65">有这笔转账吗？</text>
  </g>
  <g>
    <rect x="702" y="158" width="120" height="70" rx="6" fill="#FFFFFF" stroke="#4B8BDA"/>
    <text x="762" y="182" text-anchor="middle" font-size="20">📁</text>
    <text x="762" y="203" text-anchor="middle" font-size="12" font-weight="bold" fill="#1E3A5F">文件系统</text>
    <text x="762" y="220" text-anchor="middle" font-size="11" fill="#3D4F65">文件真被删了吗？</text>
  </g>

  <!-- Verdict -->
  <rect x="438" y="248" width="384" height="64" rx="8" fill="#E8F5E9" stroke="#3C8A4E" stroke-width="2"/>
  <text x="630" y="272" text-anchor="middle" font-size="13" font-weight="bold" fill="#1E3A5F">Verifiable Judge：邮件未送达 → 判定失败</text>
  <text x="630" y="294" text-anchor="middle" font-size="12" fill="#3D4F65">Agent 说“已发送”也没用，以环境为准</text>

  <!-- Arrow agent -> env -->
  <path d="M260,165 L418,165" stroke="#4B8BDA" stroke-width="2.5" fill="none" marker-end="url(#ar)"/>
  <text x="339" y="156" text-anchor="middle" font-size="11" fill="#3D4F65">工具调用</text>

  <!-- Refinement feedback loop -->
  <rect x="240" y="400" width="420" height="110" rx="10" fill="#FFF0EE" stroke="#C0564A" stroke-width="2"/>
  <text x="450" y="428" text-anchor="middle" font-size="15" font-weight="bold" fill="#1E3A5F">Refinement Judge：失败原因回传</text>
  <text x="450" y="454" text-anchor="middle" font-size="12" fill="#3D4F65">• 注入没被 Agent 看到  • 工具调用了但目的地错误</text>
  <text x="450" y="484" text-anchor="middle" font-size="12" fill="#3D4F65">→ 给红队 Agent 靠谱的梯度信号，下轮改进</text>

  <!-- Arrows to refinement -->
  <path d="M560,330 L500,398" stroke="#C0564A" stroke-width="2" fill="none" marker-end="url(#arR)"/>
  <path d="M260,455 L200,335" stroke="#C0564A" stroke-width="2" fill="none" marker-end="url(#arR)" stroke-dasharray="5,4"/>
  <text x="175" y="395" font-size="11" fill="#C0564A">反馈红队</text>

</svg>