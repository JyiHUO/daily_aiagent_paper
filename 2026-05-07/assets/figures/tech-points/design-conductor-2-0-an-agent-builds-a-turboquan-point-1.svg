<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" font-family="'Helvetica Neue',Arial,sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4B8BDA"/>
    </marker>
  </defs>

  <rect width="900" height="560" fill="#F7FAFD"/>

  <text x="450" y="38" text-anchor="middle" font-size="22" font-weight="700" fill="#1E3A5F">从一篇论文 + 一页需求 → 一颗芯片</text>
  <text x="450" y="62" text-anchor="middle" font-size="13" fill="#3D4F65">Design Conductor 2.0 · 80 小时自主完成</text>

  <!-- INPUT -->
  <g>
    <rect x="40" y="100" width="210" height="360" rx="10" fill="#EFF6FF" stroke="#4B8BDA" stroke-width="1.5"/>
    <text x="145" y="128" text-anchor="middle" font-size="15" font-weight="700" fill="#1E3A5F">人类输入</text>

    <rect x="60" y="148" width="170" height="58" rx="6" fill="#FFFFFF" stroke="#9FC0E8"/>
    <text x="145" y="172" text-anchor="middle" font-size="12" fill="#1E3A5F" font-weight="600">TurboQuant 论文</text>
    <text x="145" y="192" text-anchor="middle" font-size="11" fill="#3D4F65">+ Python 参考实现</text>

    <rect x="60" y="220" width="170" height="100" rx="6" fill="#FFFFFF" stroke="#9FC0E8"/>
    <text x="145" y="244" text-anchor="middle" font-size="12" font-weight="600" fill="#1E3A5F">一页自然语言需求</text>
    <text x="145" y="266" text-anchor="middle" font-size="11" fill="#3D4F65">XCVU29P-3 · 125 MHz</text>
    <text x="145" y="286" text-anchor="middle" font-size="11" fill="#3D4F65">Qwen3-4B · FP16 KV</text>
    <text x="145" y="306" text-anchor="middle" font-size="11" fill="#3D4F65">3 PQ bits + 1-bit QJL</text>

    <rect x="60" y="334" width="170" height="110" rx="6" fill="#FFF4E6" stroke="#E8B87A"/>
    <text x="145" y="358" text-anchor="middle" font-size="12" font-weight="700" fill="#8A5A1F">人类不做</text>
    <text x="145" y="380" text-anchor="middle" font-size="11" fill="#8A5A1F">架构 / 微架构</text>
    <text x="145" y="400" text-anchor="middle" font-size="11" fill="#8A5A1F">RTL / 验证</text>
    <text x="145" y="420" text-anchor="middle" font-size="11" fill="#8A5A1F">综合 / 布局布线</text>
  </g>

  <!-- AGENT -->
  <g>
    <rect x="310" y="100" width="280" height="360" rx="12" fill="#E3EEFB" stroke="#1E3A5F" stroke-width="2"/>
    <text x="450" y="128" text-anchor="middle" font-size="15" font-weight="700" fill="#1E3A5F">Conductor 2.0 Agent</text>
    <text x="450" y="147" text-anchor="middle" font-size="11" fill="#3D4F65">自己当架构师</text>

    <rect x="335" y="166" width="230" height="62" rx="6" fill="#FFFFFF" stroke="#4B8BDA"/>
    <text x="450" y="188" text-anchor="middle" font-size="12" font-weight="600" fill="#1E3A5F">① 读论文，拆子系统</text>
    <text x="450" y="210" text-anchor="middle" font-size="11" fill="#3D4F65">K压缩 · V压缩 · FlashAttn</text>

    <rect x="335" y="238" width="230" height="62" rx="6" fill="#FFFFFF" stroke="#4B8BDA"/>
    <text x="450" y="260" text-anchor="middle" font-size="12" font-weight="600" fill="#1E3A5F">② 架构探索 + 切 die</text>
    <text x="450" y="282" text-anchor="middle" font-size="11" fill="#3D4F65">4 SLR → 压进 3 SLR</text>

    <rect x="335" y="310" width="230" height="62" rx="6" fill="#FFFFFF" stroke="#4B8BDA"/>
    <text x="450" y="332" text-anchor="middle" font-size="12" font-weight="600" fill="#1E3A5F">③ RTL + 模块/系统验证</text>
    <text x="450" y="354" text-anchor="middle" font-size="11" fill="#3D4F65">接入 vLLM 端到端仿真</text>

    <rect x="335" y="382" width="230" height="62" rx="6" fill="#FFFFFF" stroke="#4B8BDA"/>
    <text x="450" y="404" text-anchor="middle" font-size="12" font-weight="600" fill="#1E3A5F">④ 综合 · P&amp;R · bitstream</text>
    <text x="450" y="426" text-anchor="middle" font-size="11" fill="#3D4F65">时序收敛自动迭代</text>
  </g>

  <!-- OUTPUT -->
  <g>
    <rect x="650" y="100" width="210" height="360" rx="10" fill="#EAF5EE" stroke="#3A9D6B" stroke-width="1.5"/>
    <text x="755" y="128" text-anchor="middle" font-size="15" font-weight="700" fill="#1E4A33">产出：VerTQ</text>

    <rect x="670" y="148" width="170" height="78" rx="6" fill="#FFFFFF" stroke="#7FC89E"/>
    <text x="755" y="172" text-anchor="middle" font-size="12" font-weight="600" fill="#1E4A33">硅级加速器</text>
    <text x="755" y="192" text-anchor="middle" font-size="11" fill="#3D4F65">5129 FP16/32 单元</text>
    <text x="755" y="212" text-anchor="middle" font-size="11" fill="#3D4F65">240 周期流水</text>

    <rect x="670" y="240" width="170" height="64" rx="6" fill="#FFFFFF" stroke="#7FC89E"/>
    <text x="755" y="264" text-anchor="middle" font-size="12" font-weight="600" fill="#1E4A33">TSMC 16FF</text>
    <text x="755" y="286" text-anchor="middle" font-size="11" fill="#3D4F65">5.7 mm² 版图</text>

    <rect x="670" y="318" width="170" height="64" rx="6" fill="#FFFFFF" stroke="#7FC89E"/>
    <text x="755" y="342" text-anchor="middle" font-size="12" font-weight="600" fill="#1E4A33">FPGA bitstream</text>
    <text x="755" y="364" text-anchor="middle" font-size="11" fill="#3D4F65">跑通 Qwen3-4B 36 层</text>

    <rect x="670" y="396" width="170" height="44" rx="6" fill="#FFF0F0" stroke="#D47A7A"/>
    <text x="755" y="423" text-anchor="middle" font-size="13" font-weight="700" fill="#8A2A2A">⏱ 80 小时</text>
  </g>

  <!-- ARROWS -->
  <line x1="252" y1="280" x2="306" y2="280" stroke="#4B8BDA" stroke-width="2.5" marker-end="url(#arr)"/>
  <line x1="592" y1="280" x2="646" y2="280" stroke="#4B8BDA" stroke-width="2.5" marker-end="url(#arr)"/>

  <text x="450" y="510" text-anchor="middle" font-size="13" fill="#1E3A5F" font-weight="600">以前：规格 → RTL（按图施工）　　现在：论文 → 版图（自主当架构师）</text>
</svg>