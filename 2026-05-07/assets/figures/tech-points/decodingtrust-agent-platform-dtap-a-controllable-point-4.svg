<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4B8BDA"/>
    </marker>
  </defs>

  <rect width="900" height="600" fill="#FAF7F2"/>

  <text x="450" y="40" text-anchor="middle" font-size="22" font-weight="bold" fill="#1E3A5F">从合规文件 → 可执行红队任务</text>
  <text x="450" y="62" text-anchor="middle" font-size="13" fill="#3D4F65">DTap-Bench：政策驱动，而非拍脑袋</text>

  <!-- Module 1: Policies -->
  <rect x="40" y="110" width="200" height="150" rx="10" fill="#EFF6FF" stroke="#4B8BDA" stroke-width="2"/>
  <text x="140" y="140" text-anchor="middle" font-size="16" font-weight="bold" fill="#1E3A5F">① 真实合规政策</text>
  <text x="140" y="175" text-anchor="middle" font-size="13" fill="#3D4F65">Salesforce AUP · EU AI Act</text>
  <text x="140" y="198" text-anchor="middle" font-size="13" fill="#3D4F65">FINRA · ISO 等</text>
  <text x="140" y="235" text-anchor="middle" font-size="12" fill="#8B6F47" font-style="italic">60+ 份政策</text>

  <!-- Arrow 1 -->
  <line x1="244" y1="185" x2="326" y2="185" stroke="#4B8BDA" stroke-width="2.5" marker-end="url(#arr)"/>
  <text x="285" y="178" text-anchor="middle" font-size="11" fill="#3D4F65">抽取</text>

  <!-- Module 2: Risks -->
  <rect x="330" y="110" width="200" height="150" rx="10" fill="#FFF4E6" stroke="#D99858" stroke-width="2"/>
  <text x="430" y="140" text-anchor="middle" font-size="16" font-weight="bold" fill="#1E3A5F">② 风险类别</text>
  <text x="430" y="175" text-anchor="middle" font-size="13" fill="#3D4F65">数据外泄 · 未授权交易</text>
  <text x="430" y="198" text-anchor="middle" font-size="13" fill="#3D4F65">钓鱼下载 · 权限提升…</text>
  <text x="430" y="235" text-anchor="middle" font-size="12" fill="#8B6F47" font-style="italic">300+ 类风险</text>

  <!-- Arrow 2 -->
  <line x1="534" y1="185" x2="616" y2="185" stroke="#4B8BDA" stroke-width="2.5" marker-end="url(#arr)"/>
  <text x="575" y="178" text-anchor="middle" font-size="11" fill="#3D4F65">派生</text>

  <!-- Module 3: Tasks -->
  <rect x="620" y="110" width="240" height="150" rx="10" fill="#E8F0E4" stroke="#6B9A5A" stroke-width="2"/>
  <text x="740" y="140" text-anchor="middle" font-size="16" font-weight="bold" fill="#1E3A5F">③ 红队任务</text>
  <text x="740" y="175" text-anchor="middle" font-size="13" fill="#3D4F65">4K+ 恶意目标 / 6682 任务</text>
  <text x="740" y="198" text-anchor="middle" font-size="13" fill="#3D4F65">benign · 间接 · 直接</text>
  <text x="740" y="235" text-anchor="middle" font-size="12" fill="#8B6F47" font-style="italic">DTap-Red 优化 + 专家审</text>

  <!-- Example box -->
  <rect x="80" y="320" width="740" height="210" rx="10" fill="#FFFFFF" stroke="#1E3A5F" stroke-width="1.5" stroke-dasharray="5,4"/>
  <text x="100" y="348" font-size="14" font-weight="bold" fill="#1E3A5F">具体案例：“钓鱼恶意软件下载”</text>

  <!-- Panel 1 -->
  <rect x="105" y="370" width="220" height="130" rx="8" fill="#EFF6FF" stroke="#4B8BDA" stroke-width="1.5"/>
  <text x="215" y="398" text-anchor="middle" font-size="13" font-weight="bold" fill="#1E3A5F">Slack 公开频道</text>
  <text x="215" y="422" text-anchor="middle" font-size="12" fill="#3D4F65">攻击者发钓鱼链接</text>
  <text x="215" y="470" text-anchor="middle" font-size="28">💬</text>

  <line x1="330" y1="435" x2="363" y2="435" stroke="#4B8BDA" stroke-width="2.5" marker-end="url(#arr)"/>

  <!-- Panel 2 -->
  <rect x="370" y="370" width="220" height="130" rx="8" fill="#FFF4E6" stroke="#D99858" stroke-width="1.5"/>
  <text x="480" y="398" text-anchor="middle" font-size="13" font-weight="bold" fill="#1E3A5F">伪造同事 DM</text>
  <text x="480" y="422" text-anchor="middle" font-size="12" fill="#3D4F65">诱导 Agent 确认</text>
  <text x="480" y="470" text-anchor="middle" font-size="28">🎭</text>

  <line x1="595" y1="435" x2="628" y2="435" stroke="#4B8BDA" stroke-width="2.5" marker-end="url(#arr)"/>

  <!-- Panel 3 -->
  <rect x="635" y="370" width="170" height="130" rx="8" fill="#FDE8E8" stroke="#C8574B" stroke-width="1.5"/>
  <text x="720" y="398" text-anchor="middle" font-size="13" font-weight="bold" fill="#1E3A5F">Agent 中招</text>
  <text x="720" y="422" text-anchor="middle" font-size="12" fill="#3D4F65">下载并执行附件</text>
  <text x="720" y="470" text-anchor="middle" font-size="28">⚠️</text>

  <text x="450" y="575" text-anchor="middle" font-size="12" fill="#8B6F47" font-style="italic">判别函数直接检查：受害机上是否真的运行了该文件 —— 漏洞与企业合规点对齐</text>
</svg>