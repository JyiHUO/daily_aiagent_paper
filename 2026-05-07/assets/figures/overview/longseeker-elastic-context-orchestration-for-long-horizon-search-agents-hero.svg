<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 640" font-family="'PingFang SC','Microsoft YaHei',sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F7FAFD"/>
      <stop offset="1" stop-color="#EEF3F9"/>
    </linearGradient>
    <linearGradient id="coreG" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4B8BDA"/>
      <stop offset="1" stop-color="#2E5A9E"/>
    </linearGradient>
    <linearGradient id="badBar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#F3C98B"/>
      <stop offset="1" stop-color="#D97757"/>
    </linearGradient>
    <linearGradient id="goodBar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8FBFE8"/>
      <stop offset="1" stop-color="#4B8BDA"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#D97757"/>
    </marker>
    <marker id="arrowDark" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#2E5A9E"/>
    </marker>
  </defs>

  <rect width="1000" height="640" fill="url(#bg)"/>

  <!-- Title -->
  <text x="500" y="40" text-anchor="middle" font-size="22" font-weight="700" fill="#1E3A5F">LongSeeker：把"整理工作记忆"变成 Agent 的一等动作</text>
  <text x="500" y="62" text-anchor="middle" font-size="13" fill="#3D4F65">Context-ReAct = 推理 + 五个原子上下文算子 + 工具调用，统一在单次自回归里生成</text>

  <!-- LEFT: ReAct baseline (context explosion) -->
  <g>
    <text x="150" y="100" text-anchor="middle" font-size="13" font-weight="700" fill="#8A4B2A">传统 ReAct：线性堆叠</text>
    <text x="150" y="118" text-anchor="middle" font-size="11" fill="#7A5A3F">每步 (r, c, o) 全量累加</text>

    <g transform="translate(60,130)">
      <rect x="0" y="0" width="30" height="14" fill="url(#badBar)" opacity="0.7"/>
      <rect x="0" y="18" width="55" height="14" fill="url(#badBar)" opacity="0.75"/>
      <rect x="0" y="36" width="90" height="14" fill="url(#badBar)" opacity="0.8"/>
      <rect x="0" y="54" width="130" height="14" fill="url(#badBar)" opacity="0.85"/>
      <rect x="0" y="72" width="170" height="14" fill="url(#badBar)" opacity="0.9"/>
      <rect x="0" y="90" width="180" height="14" fill="url(#badBar)"/>
      <rect x="0" y="108" width="180" height="14" fill="url(#badBar)"/>
      <text x="185" y="122" font-size="10" fill="#C0502A">⚠ 爆窗口</text>
    </g>
    <text x="150" y="285" text-anchor="middle" font-size="11" fill="#8A4B2A">噪声累积 · 成本线性增长 · 幻觉风险↑</text>
  </g>

  <!-- Center: Context-ReAct core -->
  <g>
    <circle cx="500" cy="320" r="175" fill="none" stroke="#C7D7EA" stroke-width="1.5" stroke-dasharray="4 4"/>

    <rect x="405" y="265" width="190" height="110" rx="14" fill="url(#coreG)"/>
    <text x="500" y="292" text-anchor="middle" font-size="14" font-weight="700" fill="#FFFFFF">Context-ReAct 循环</text>
    <text x="500" y="312" text-anchor="middle" font-size="11" fill="#E3EDF9">单次生成同时输出：</text>
    <text x="500" y="330" text-anchor="middle" font-size="11" fill="#FFFFFF">think · meta-tool</text>
    <text x="500" y="346" text-anchor="middle" font-size="11" fill="#FFFFFF">motivation · tool-call</text>
    <text x="500" y="365" text-anchor="middle" font-size="10" fill="#C9DBF0" font-style="italic">历史 H ──▶ H′（动态塑形）</text>

    <!-- Skip (top) -->
    <g>
      <circle cx="500" cy="165" r="36" fill="#EFF6FF" stroke="#4B8BDA" stroke-width="1.5"/>
      <text x="500" y="162" text-anchor="middle" font-size="12" font-weight="700" fill="#1E3A5F">Skip</text>
      <text x="500" y="178" text-anchor="middle" font-size="9" fill="#3D4F65">保持原样</text>
    </g>
    <!-- Compress (upper-right) -->
    <g>
      <circle cx="680" cy="235" r="44" fill="#DCEBFA" stroke="#2E5A9E" stroke-width="2"/>
      <text x="680" y="229" text-anchor="middle" font-size="12" font-weight="700" fill="#1E3A5F">Compress ★</text>
      <text x="680" y="245" text-anchor="middle" font-size="9" fill="#3D4F65">区间摘要</text>
      <text x="680" y="258" text-anchor="middle" font-size="9" fill="#6A7A8F" font-style="italic">表达完备</text>
    </g>
    <!-- Snippet (lower-right) -->
    <g>
      <circle cx="680" cy="405" r="38" fill="#EFF6FF" stroke="#4B8BDA" stroke-width="1.5"/>
      <text x="680" y="402" text-anchor="middle" font-size="12" font-weight="700" fill="#1E3A5F">Snippet</text>
      <text x="680" y="418" text-anchor="middle" font-size="9" fill="#3D4F65">锚点无损截取</text>
    </g>
    <!-- Rollback (lower-left) -->
    <g>
      <circle cx="320" cy="405" r="40" fill="#DCEBFA" stroke="#2E5A9E" stroke-width="2"/>
      <text x="320" y="402" text-anchor="middle" font-size="12" font-weight="700" fill="#1E3A5F">Rollback</text>
      <text x="320" y="418" text-anchor="middle" font-size="9" fill="#3D4F65">断点+失败洞见</text>
    </g>
    <!-- Delete (upper-left) -->
    <g>
      <circle cx="320" cy="235" r="36" fill="#EFF6FF" stroke="#4B8BDA" stroke-width="1.5"/>
      <text x="320" y="232" text-anchor="middle" font-size="12" font-weight="700" fill="#1E3A5F">Delete</text>
      <text x="320" y="248" text-anchor="middle" font-size="9" fill="#3D4F65">整步抹除</text>
    </g>

    <!-- connectors from core to each op -->
    <line x1="500" y1="265" x2="500" y2="201" stroke="#4B8BDA" stroke-width="1.2"/>
    <line x1="580" y1="278" x2="644" y2="250" stroke="#4B8BDA" stroke-width="1.2"/>
    <line x1="580" y1="362" x2="648" y2="393" stroke="#4B8BDA" stroke-width="1.2"/>
    <line x1="420" y1="362" x2="354" y2="393" stroke="#4B8BDA" stroke-width="1.2"/>
    <line x1="420" y1="278" x2="354" y2="250" stroke="#4B8BDA" stroke-width="1.2"/>

    <!-- loop arrow -->
    <path d="M 340 485 Q 500 545 660 485" fill="none" stroke="#2E5A9E" stroke-width="1.6" marker-end="url(#arrowDark)"/>
    <text x="500" y="528" text-anchor="middle" font-size="11" fill="#1E3A5F">观察回流 → 下一轮再整理</text>
  </g>

  <!-- RIGHT: LongSeeker flat context + results -->
  <g>
    <text x="860" y="100" text-anchor="middle" font-size="13" font-weight="700" fill="#1E3A5F">LongSeeker：弹性多分辨率</text>
    <text x="860" y="118" text-anchor="middle" font-size="11" fill="#3D4F65">关键证据精确保留，冗余折叠</text>

    <g transform="translate(780,130)">
      <rect x="0" y="0" width="70" height="14" fill="url(#goodBar)" opacity="0.9"/>
      <rect x="0" y="18" width="85" height="14" fill="url(#goodBar)" opacity="0.9"/>
      <rect x="0" y="36" width="60" height="14" fill="url(#goodBar)" opacity="0.95"/>
      <rect x="0" y="54" width="95" height="14" fill="url(#goodBar)"/>
      <rect x="0" y="72" width="75" height="14" fill="url(#goodBar)"/>
      <rect x="0" y="90" width="90" height="14" fill="url(#goodBar)"/>
      <rect x="0" y="108" width="70" height="14" fill="url(#goodBar)"/>
      <text x="110" y="60" font-size="10" fill="#2E5A9E">≈ 15k tok</text>
      <text x="110" y="76" font-size="10" fill="#2E5A9E">300 步内稳定</text>
    </g>

    <!-- results -->
    <g transform="translate(760,275)">
      <rect x="0" y="0" width="200" height="160" rx="10" fill="#FFFFFF" stroke="#4B8BDA" stroke-width="1.2"/>
      <text x="100" y="22" text-anchor="middle" font-size="12" font-weight="700" fill="#1E3A5F">结果（Qwen3-30B-A3B）</text>
      <line x1="12" y1="32" x2="188" y2="32" stroke="#E0E9F3"/>

      <text x="14" y="52" font-size="11" fill="#3D4F65">BrowseComp</text>
      <text x="186" y="52" text-anchor="end" font-size="12" font-weight="700" fill="#2E5A9E">61.5%</text>
      <text x="186" y="66" text-anchor="end" font-size="9" fill="#8A9AAE">vs Tongyi 43.2 / AgentFold 36.2</text>

      <text x="14" y="88" font-size="11" fill="#3D4F65">BrowseComp-ZH</text>
      <text x="186" y="88" text-anchor="end" font-size="12" font-weight="700" fill="#2E5A9E">62.5%</text>

      <text x="14" y="110" font-size="11" fill="#3D4F65">xbench</text>
      <text x="186" y="110" text-anchor="end" font-size="12" font-weight="700" fill="#2E5A9E">78.0%</text>

      <text x="14" y="132" font-size="11" fill="#3D4F65">GAIA-text</text>
      <text x="186" y="132" text-anchor="end" font-size="12" font-weight="700" fill="#2E5A9E">77.7%</text>

      <text x="100" y="152" text-anchor="middle" font-size="9" fill="#6A7A8F" font-style="italic">10k 合成轨迹 · 纯 SFT · 无 RL</text>
    </g>
  </g>

  <!-- flow arrows between three zones -->
  <path d="M 245 235 Q 272 215 280 232" fill="none" stroke="#D97757" stroke-width="1.5" stroke-dasharray="3 3" marker-end="url(#arrow)"/>
  <text x="262" y="205" text-anchor="middle" font-size="10" fill="#8A4B2A">升级为策略</text>

  <path d="M 724 232 Q 752 212 778 225" fill="none" stroke="#2E5A9E" stroke-width="1.5" marker-end="url(#arrowDark)"/>
  <text x="752" y="205" text-anchor="middle" font-size="10" fill="#1E3A5F">训练落地</text>

  <!-- bottom takeaway -->
  <rect x="100" y="580" width="800" height="44" rx="10" fill="#FFFFFF" stroke="#C7D7EA"/>
  <text x="500" y="600" text-anchor="middle" font-size="12" font-weight="700" fill="#1E3A5F">核心洞见：上下文管理不是工程 trick，而是 Agent 策略的一部分</text>
  <text x="500" y="617" text-anchor="middle" font-size="11" fill="#3D4F65">Compress/Rollback 主力整形 · Snippet 护住数字与 URL · Skip/Delete 控规模 → 更长、更稳、更对</text>
</svg>