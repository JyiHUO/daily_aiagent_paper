<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4B8BDA"/>
    </marker>
    <marker id="ard" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#B8860B"/>
    </marker>
  </defs>

  <rect width="600" height="380" fill="#FAFBFC"/>

  <text x="300" y="30" text-anchor="middle" font-size="16" font-weight="bold" fill="#1E3A5F">RL 自发涌现：一回合多动作</text>

  <!-- SFT side -->
  <text x="150" y="68" text-anchor="middle" font-size="12" font-weight="bold" fill="#3D4F65">SFT · 单步执行（3 turns）</text>

  <g>
    <circle cx="60" cy="120" r="22" fill="#FFF1E6" stroke="#E8A87C" stroke-width="1.5"/>
    <text x="60" y="124" text-anchor="middle" font-size="11" fill="#1E3A5F">File</text>

    <circle cx="150" cy="120" r="22" fill="#FFF1E6" stroke="#E8A87C" stroke-width="1.5"/>
    <text x="150" y="124" text-anchor="middle" font-size="11" fill="#1E3A5F">Export</text>

    <circle cx="240" cy="120" r="22" fill="#FFF1E6" stroke="#E8A87C" stroke-width="1.5"/>
    <text x="240" y="124" text-anchor="middle" font-size="11" fill="#1E3A5F">PDF</text>

    <path d="M 82 120 L 126 120" stroke="#B8860B" stroke-width="1.5" stroke-dasharray="3,3" marker-end="url(#ard)"/>
    <path d="M 172 120 L 216 120" stroke="#B8860B" stroke-width="1.5" stroke-dasharray="3,3" marker-end="url(#ard)"/>

    <text x="104" y="158" text-anchor="middle" font-size="10" fill="#8B6F47">↑看截图</text>
    <text x="194" y="158" text-anchor="middle" font-size="10" fill="#8B6F47">↑看截图</text>
  </g>

  <!-- divider -->
  <line x1="300" y1="55" x2="300" y2="200" stroke="#D0D7DE" stroke-width="1" stroke-dasharray="4,4"/>

  <!-- RL side -->
  <text x="450" y="68" text-anchor="middle" font-size="12" font-weight="bold" fill="#3D4F65">RL · 一回合连招（1 turn）</text>

  <g>
    <rect x="345" y="98" width="210" height="50" rx="25" fill="#EFF6FF" stroke="#4B8BDA" stroke-width="2"/>
    <circle cx="385" cy="123" r="14" fill="#fff" stroke="#4B8BDA"/>
    <text x="385" y="127" text-anchor="middle" font-size="10" fill="#1E3A5F">File</text>
    <circle cx="450" cy="123" r="14" fill="#fff" stroke="#4B8BDA"/>
    <text x="450" y="127" text-anchor="middle" font-size="10" fill="#1E3A5F">Export</text>
    <circle cx="515" cy="123" r="14" fill="#fff" stroke="#4B8BDA"/>
    <text x="515" y="127" text-anchor="middle" font-size="10" fill="#1E3A5F">PDF</text>

    <path d="M 399 123 L 434 123" stroke="#4B8BDA" stroke-width="2" marker-end="url(#ar)"/>
    <path d="M 464 123 L 499 123" stroke="#4B8BDA" stroke-width="2" marker-end="url(#ar)"/>

    <text x="450" y="170" text-anchor="middle" font-size="10" fill="#3D4F65">三个 tool call 一次性发送</text>
  </g>

  <!-- bottom comparison -->
  <g transform="translate(0,220)">
    <rect x="40" y="0" width="220" height="90" rx="8" fill="#FFF8F0" stroke="#E8A87C" stroke-width="1"/>
    <text x="150" y="24" text-anchor="middle" font-size="12" font-weight="bold" fill="#1E3A5F">每步 ≈ 1.0 tool call</text>
    <text x="150" y="48" text-anchor="middle" font-size="11" fill="#3D4F65">轨迹长 · 时延高</text>
    <text x="150" y="74" text-anchor="middle" font-size="13" font-weight="bold" fill="#B8860B">━━━━━━━━━</text>

    <rect x="340" y="0" width="220" height="90" rx="8" fill="#EFF6FF" stroke="#4B8BDA" stroke-width="1"/>
    <text x="450" y="24" text-anchor="middle" font-size="12" font-weight="bold" fill="#1E3A5F">每步 1.4 ~ 1.9 tool call</text>
    <text x="450" y="48" text-anchor="middle" font-size="11" fill="#3D4F65">长度缩短 33–45% · 不掉分</text>
    <text x="450" y="74" text-anchor="middle" font-size="13" font-weight="bold" fill="#4B8BDA">━━━━━</text>
  </g>

  <text x="300" y="355" text-anchor="middle" font-size="11" fill="#3D4F65" font-style="italic">超时扣分 → 策略自发把可预测动作打包发送</text>
</svg>