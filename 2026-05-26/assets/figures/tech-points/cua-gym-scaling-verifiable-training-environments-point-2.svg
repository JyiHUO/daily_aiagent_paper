<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 420" font-family="-apple-system,Segoe UI,sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4B8BDA"/>
    </marker>
  </defs>

  <text x="300" y="32" text-anchor="middle" font-size="18" font-weight="600" fill="#1E3A5F">One Mock App · Many Worlds</text>

  <!-- State injection label on top -->
  <text x="300" y="118" text-anchor="middle" font-size="11" fill="#1E3A5F">state injection</text>
  <path d="M300 124 L300 168" stroke="#E8A857" stroke-width="2" stroke-dasharray="3,3" marker-end="url(#a)"/>

  <!-- Central mock app -->
  <g>
    <rect x="240" y="170" width="120" height="80" rx="8" fill="#EFF6FF" stroke="#1E3A5F" stroke-width="2"/>
    <rect x="252" y="182" width="96" height="8" rx="2" fill="#4B8BDA"/>
    <rect x="252" y="198" width="70" height="5" rx="2" fill="#A8C5E8"/>
    <rect x="252" y="210" width="80" height="5" rx="2" fill="#A8C5E8"/>
    <rect x="252" y="222" width="60" height="5" rx="2" fill="#A8C5E8"/>
    <text x="300" y="268" text-anchor="middle" font-size="12" fill="#1E3A5F" font-weight="600">Mail mock (shared frontend)</text>
  </g>

  <!-- Left context: O*NET -->
  <text x="60" y="200" font-size="11" fill="#3D4F65">O*NET</text>
  <text x="60" y="215" font-size="11" fill="#3D4F65">occupations</text>
  <path d="M120 208 L238 208" stroke="#4B8BDA" stroke-width="1.5" fill="none" marker-end="url(#a)" opacity="0.6"/>

  <!-- Right context: HTTP API -->
  <text x="540" y="200" text-anchor="end" font-size="11" fill="#3D4F65">HTTP state API</text>
  <text x="540" y="215" text-anchor="end" font-size="11" fill="#3D4F65">verifiable reward</text>
  <path d="M480 208 L362 208" stroke="#4B8BDA" stroke-width="1.5" fill="none" marker-end="url(#a)" opacity="0.6"/>

  <!-- Session isolation label -->
  <text x="300" y="295" text-anchor="middle" font-size="10" fill="#3D4F65" font-style="italic">parallel sessions · isolated</text>

  <!-- Arrows from mock to states -->
  <path d="M275 250 Q200 285 130 318" stroke="#4B8BDA" stroke-width="1.8" fill="none" marker-end="url(#a)"/>
  <path d="M300 252 L300 318" stroke="#4B8BDA" stroke-width="1.8" fill="none" marker-end="url(#a)"/>
  <path d="M325 250 Q400 285 470 318" stroke="#4B8BDA" stroke-width="1.8" fill="none" marker-end="url(#a)"/>

  <!-- World A: empty -->
  <g>
    <rect x="50" y="320" width="160" height="70" rx="6" fill="#FFF7EC" stroke="#E8A857" stroke-width="1.5"/>
    <circle cx="72" cy="345" r="4" fill="#E8A857" opacity="0.3"/>
    <text x="130" y="349" text-anchor="middle" font-size="11" fill="#3D4F65">empty inbox</text>
    <text x="130" y="378" text-anchor="middle" font-size="11" fill="#1E3A5F" font-weight="600">state A</text>
  </g>

  <!-- World B: deadlines -->
  <g>
    <rect x="220" y="320" width="160" height="70" rx="6" fill="#FFF7EC" stroke="#E8A857" stroke-width="1.5"/>
    <line x1="235" y1="338" x2="365" y2="338" stroke="#E8A857" stroke-width="2"/>
    <line x1="235" y1="346" x2="365" y2="346" stroke="#E8A857" stroke-width="2"/>
    <line x1="235" y1="354" x2="350" y2="354" stroke="#E8A857" stroke-width="2"/>
    <text x="300" y="378" text-anchor="middle" font-size="11" fill="#1E3A5F" font-weight="600">state B · 30 deadlines</text>
  </g>

  <!-- World C: backlog -->
  <g>
    <rect x="390" y="320" width="160" height="70" rx="6" fill="#FFF7EC" stroke="#E8A857" stroke-width="1.5"/>
    <rect x="405" y="335" width="130" height="6" fill="#E8A857" opacity="0.5"/>
    <rect x="405" y="343" width="130" height="6" fill="#E8A857" opacity="0.7"/>
    <rect x="405" y="351" width="130" height="6" fill="#E8A857" opacity="0.9"/>
    <text x="470" y="378" text-anchor="middle" font-size="11" fill="#1E3A5F" font-weight="600">state C · backlog</text>
  </g>
</svg>