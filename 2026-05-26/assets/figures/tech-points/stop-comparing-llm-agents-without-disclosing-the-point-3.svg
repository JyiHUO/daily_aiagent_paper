<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 460" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif">
  <rect width="720" height="460" fill="#FAF7F2"/>

  <text x="360" y="38" text-anchor="middle" font-size="18" font-weight="700" fill="#1E3A5F">谁让分数抖得更厉害？</text>
  <text x="360" y="60" text-anchor="middle" font-size="12" fill="#3D4F65">同一基准，同一 100 题：换模型 vs 换 harness</text>

  <!-- Left: Model variance (small) -->
  <g>
    <text x="180" y="100" text-anchor="middle" font-size="13" font-weight="600" fill="#1E3A5F">换模型</text>
    <text x="180" y="120" text-anchor="middle" font-size="11" fill="#3D4F65">MV ≈ 2.37 pp²  (±2–5 点)</text>

    <line x1="70" y1="340" x2="290" y2="340" stroke="#C9B79C" stroke-width="1"/>
    <rect x="100" y="320" width="30" height="20" fill="#9DB4D0"/>
    <rect x="160" y="312" width="30" height="28" fill="#9DB4D0"/>
    <rect x="220" y="318" width="30" height="22" fill="#9DB4D0"/>
    <text x="180" y="365" text-anchor="middle" font-size="11" fill="#7A8AA0">三模型差距 &lt; 3 点</text>
  </g>

  <!-- Divider -->
  <line x1="360" y1="90" x2="360" y2="385" stroke="#D9CDB8" stroke-width="1" stroke-dasharray="4 4"/>

  <!-- Right: Harness variance (large) -->
  <g>
    <text x="540" y="100" text-anchor="middle" font-size="13" font-weight="600" fill="#1E3A5F">换 harness</text>
    <text x="540" y="120" text-anchor="middle" font-size="11" fill="#C2410C">HV ≈ 18.48 pp²  (±8–13 点)</text>

    <line x1="430" y1="340" x2="650" y2="340" stroke="#C9B79C" stroke-width="1"/>
    <rect x="460" y="280" width="30" height="60" fill="#E8A87C"/>
    <rect x="520" y="232" width="30" height="108" fill="#E8A87C"/>
    <rect x="580" y="208" width="30" height="132" fill="#E8A87C"/>
    <text x="540" y="365" text-anchor="middle" font-size="11" fill="#7A8AA0">GLM: 52.5% → 65.5%</text>
  </g>

  <!-- Ratio marker -->
  <text x="360" y="220" text-anchor="middle" font-size="13" fill="#4B8BDA" font-weight="700">7.8 ×</text>
  <path d="M 305 245 Q 360 235 415 245" stroke="#4B8BDA" stroke-width="1.5" fill="none" stroke-dasharray="3 3"/>

  <!-- Bottom conclusion bar -->
  <rect x="180" y="410" width="360" height="34" rx="6" fill="#1E3A5F"/>
  <text x="360" y="432" text-anchor="middle" font-size="14" font-weight="700" fill="#FAF7F2">harness 方差 = 7.8 × 模型方差</text>
</svg>