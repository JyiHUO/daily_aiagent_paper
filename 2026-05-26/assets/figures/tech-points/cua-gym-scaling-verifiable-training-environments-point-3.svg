<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 420">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4B8BDA"/>
    </marker>
    <marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#D98C3F"/>
    </marker>
    <marker id="c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1E3A5F"/>
    </marker>
  </defs>

  <text x="300" y="34" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="700" fill="#1E3A5F">环境多样性 ≠ 轨迹数量</text>
  <text x="300" y="54" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#3D4F65">两个独立的 scaling 维度</text>

  <!-- Y axis -->
  <line x1="90" y1="370" x2="90" y2="90" stroke="#1E3A5F" stroke-width="1.5" marker-end="url(#c)"/>
  <text x="82" y="84" text-anchor="end" font-family="sans-serif" font-size="11" font-weight="600" fill="#1E3A5F">环境多样性</text>

  <!-- X axis -->
  <line x1="90" y1="370" x2="550" y2="370" stroke="#1E3A5F" stroke-width="1.5" marker-end="url(#c)"/>
  <text x="548" y="388" text-anchor="end" font-family="sans-serif" font-size="11" font-weight="600" fill="#1E3A5F">轨迹数量</text>

  <!-- 10 env / 3K -->
  <circle cx="200" cy="320" r="16" fill="#EFF6FF" stroke="#4B8BDA" stroke-width="1.5"/>
  <text x="200" y="324" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#3D4F65">10env/3K</text>

  <!-- 80 env / 3K -->
  <circle cx="200" cy="180" r="24" fill="#DDEBFB" stroke="#4B8BDA" stroke-width="2"/>
  <text x="200" y="184" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="600" fill="#1E3A5F">80env/3K</text>

  <!-- 80 env / 6K -->
  <circle cx="410" cy="140" r="32" fill="#FCE7C8" stroke="#D98C3F" stroke-width="2"/>
  <text x="410" y="144" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="700" fill="#1E3A5F">80env/6K</text>

  <!-- Arrow: scale environments -->
  <path d="M 200 304 L 200 206" fill="none" stroke="#4B8BDA" stroke-width="2" marker-end="url(#a)"/>
  <text x="215" y="258" font-family="sans-serif" font-size="10" font-weight="600" fill="#1E3A5F">扩环境：大幅提升</text>

  <!-- Arrow: scale trajectories -->
  <path d="M 226 172 L 380 142" fill="none" stroke="#D98C3F" stroke-width="2" marker-end="url(#b)"/>
  <text x="300" y="115" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="600" fill="#D98C3F">再加轨迹：继续涨</text>

  <!-- Bottom note -->
  <text x="300" y="402" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#3D4F65">单加轨迹补不回环境覆盖的缺失</text>
</svg>