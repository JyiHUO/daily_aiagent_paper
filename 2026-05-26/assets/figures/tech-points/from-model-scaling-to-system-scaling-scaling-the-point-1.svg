<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 460" font-family="-apple-system,Helvetica,Arial,sans-serif">
  <defs>
    <marker id="ar1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#E8A04B"/>
    </marker>
    <marker id="ar2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4B8BDA"/>
    </marker>
  </defs>

  <!-- title -->
  <text x="300" y="36" text-anchor="middle" font-size="17" font-weight="700" fill="#1E3A5F">Model is just one of six knobs</text>
  <text x="300" y="58" text-anchor="middle" font-size="12" fill="#3D4F65">PH = Φ(R, M, C, S, O, G)</text>

  <!-- thin connecting lines from R outward -->
  <g stroke="#4B8BDA" stroke-width="1.4" fill="none" opacity="0.6">
    <line x1="300" y1="201" x2="300" y2="161"/>
    <line x1="338" y1="222" x2="430" y2="190"/>
    <line x1="338" y1="268" x2="430" y2="300"/>
    <line x1="262" y1="268" x2="170" y2="300"/>
    <line x1="262" y1="222" x2="170" y2="190"/>
  </g>

  <!-- Center: R model -->
  <circle cx="300" cy="245" r="44" fill="#FEF3E2" stroke="#E8A04B" stroke-width="2"/>
  <text x="300" y="242" text-anchor="middle" font-size="14" font-weight="700" fill="#1E3A5F">R</text>
  <text x="300" y="260" text-anchor="middle" font-size="10" fill="#3D4F65">model</text>

  <!-- M: Memory (top) -->
  <rect x="245" y="105" width="110" height="56" rx="10" fill="#EFF6FF" stroke="#4B8BDA" stroke-width="1.6"/>
  <text x="300" y="130" text-anchor="middle" font-size="13" font-weight="700" fill="#1E3A5F">M · memory</text>
  <text x="300" y="148" text-anchor="middle" font-size="10" fill="#3D4F65">what to remember</text>

  <!-- C: Context (top-right) -->
  <rect x="430" y="160" width="110" height="56" rx="10" fill="#EFF6FF" stroke="#4B8BDA" stroke-width="1.6"/>
  <text x="485" y="185" text-anchor="middle" font-size="13" font-weight="700" fill="#1E3A5F">C · context</text>
  <text x="485" y="203" text-anchor="middle" font-size="10" fill="#3D4F65">what to feed R</text>

  <!-- S: Skills (bottom-right) -->
  <rect x="430" y="275" width="110" height="56" rx="10" fill="#EFF6FF" stroke="#4B8BDA" stroke-width="1.6"/>
  <text x="485" y="300" text-anchor="middle" font-size="13" font-weight="700" fill="#1E3A5F">S · skills</text>
  <text x="485" y="318" text-anchor="middle" font-size="10" fill="#3D4F65">tool / sub-agent routing</text>

  <!-- O: Orchestration (bottom-left) -->
  <rect x="60" y="275" width="110" height="56" rx="10" fill="#EFF6FF" stroke="#4B8BDA" stroke-width="1.6"/>
  <text x="115" y="300" text-anchor="middle" font-size="13" font-weight="700" fill="#1E3A5F">O · orchestration</text>
  <text x="115" y="318" text-anchor="middle" font-size="10" fill="#3D4F65">control loop</text>

  <!-- G: Governance (top-left) -->
  <rect x="60" y="160" width="110" height="56" rx="10" fill="#EFF6FF" stroke="#4B8BDA" stroke-width="1.6"/>
  <text x="115" y="185" text-anchor="middle" font-size="13" font-weight="700" fill="#1E3A5F">G · governance</text>
  <text x="115" y="203" text-anchor="middle" font-size="10" fill="#3D4F65">verify before commit</text>

  <!-- bottom legend: scaling axes -->
  <line x1="80" y1="400" x2="235" y2="400" stroke="#E8A04B" stroke-width="2.5" marker-end="url(#ar1)"/>
  <text x="80" y="392" font-size="11" fill="#3D4F65">model scaling</text>
  <text x="248" y="404" font-size="11" font-weight="700" fill="#1E3A5F">R</text>

  <line x1="295" y1="400" x2="500" y2="400" stroke="#4B8BDA" stroke-width="2.5" marker-end="url(#ar2)"/>
  <text x="295" y="392" font-size="11" fill="#3D4F65">system scaling (harness)</text>
  <text x="510" y="404" font-size="11" font-weight="700" fill="#1E3A5F">M C S O G</text>
</svg>