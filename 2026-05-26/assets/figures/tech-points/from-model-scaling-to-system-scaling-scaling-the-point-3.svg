<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 420" font-family="-apple-system,Helvetica,Arial,sans-serif">
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4B8BDA"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="300" y="34" text-anchor="middle" font-size="17" font-weight="600" fill="#1E3A5F">看终点 vs 看过程与演化</text>

  <!-- Left: single score view -->
  <g>
    <rect x="40" y="70" width="220" height="160" rx="10" fill="#FEF3E7" stroke="#E0A86B" stroke-width="1.5"/>
    <text x="150" y="98" text-anchor="middle" font-size="13" fill="#3D4F65" font-weight="600">传统评测</text>
    <text x="150" y="148" text-anchor="middle" font-size="34" fill="#1E3A5F">✓</text>
    <text x="150" y="178" text-anchor="middle" font-size="12" fill="#3D4F65">一次成功率</text>
    <text x="150" y="208" text-anchor="middle" font-size="11" fill="#8A6A3B">A 与 B 看起来一样</text>
  </g>

  <!-- Right top: process metrics -->
  <g>
    <rect x="340" y="70" width="220" height="120" rx="10" fill="#EFF6FF" stroke="#4B8BDA" stroke-width="1.5"/>
    <text x="450" y="96" text-anchor="middle" font-size="13" fill="#1E3A5F" font-weight="600">过程指标</text>
    <line x1="365" y1="108" x2="535" y2="108" stroke="#C8D9EC"/>
    <text x="365" y="130" font-size="11" fill="#3D4F65">• 轨迹质量</text>
    <text x="365" y="150" font-size="11" fill="#3D4F65">• 记忆卫生</text>
    <text x="365" y="170" font-size="11" fill="#3D4F65">• token / 工具消耗</text>
  </g>

  <!-- Right bottom: longitudinal metrics -->
  <g>
    <rect x="340" y="230" width="220" height="130" rx="10" fill="#EFF6FF" stroke="#4B8BDA" stroke-width="1.5"/>
    <text x="450" y="256" text-anchor="middle" font-size="13" fill="#1E3A5F" font-weight="600">纵向指标</text>

    <line x1="365" y1="330" x2="540" y2="330" stroke="#C8D9EC" stroke-width="1"/>
    <polyline points="365,305 400,302 440,298 480,294 520,290" fill="none" stroke="#4B8BDA" stroke-width="2"/>
    <text x="546" y="293" font-size="10" fill="#4B8BDA">A</text>

    <polyline points="365,305 400,310 440,318 480,328 520,340" fill="none" stroke="#D97757" stroke-width="2"/>
    <text x="546" y="343" font-size="10" fill="#D97757">B 漂移</text>

    <text x="365" y="350" font-size="10" fill="#3D4F65">第 N 次重复使用 →</text>
  </g>

  <!-- Arrows from left to right -->
  <path d="M 262 120 L 336 120" fill="none" stroke="#4B8BDA" stroke-width="2" marker-end="url(#ah)"/>
  <path d="M 262 170 Q 300 250 336 285" fill="none" stroke="#4B8BDA" stroke-width="2" marker-end="url(#ah)"/>

  <!-- Bottom caption -->
  <text x="300" y="395" text-anchor="middle" font-size="12" fill="#1E3A5F" font-style="italic">单分数掩盖了记忆污染与漂移</text>
</svg>