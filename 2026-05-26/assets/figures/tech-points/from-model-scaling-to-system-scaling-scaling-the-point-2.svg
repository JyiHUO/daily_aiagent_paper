<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 440">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4B8BDA"/>
    </marker>
  </defs>

  <text x="300" y="36" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="18" font-weight="bold" fill="#1E3A5F">Three System Bottlenecks</text>

  <!-- Context -->
  <g>
    <polygon points="60,110 180,110 150,180 90,180" fill="#EFF6FF" stroke="#4B8BDA" stroke-width="2"/>
    <text x="120" y="100" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#1E3A5F">Context  C</text>
    <text x="120" y="148" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#1E3A5F">minimal &amp;</text>
    <text x="120" y="164" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#1E3A5F">traceable</text>
    <text x="120" y="208" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#A0522D" font-style="italic">vs. shown but unread</text>
  </g>

  <!-- Memory -->
  <g>
    <rect x="240" y="105" width="120" height="80" rx="6" fill="#EFF6FF" stroke="#4B8BDA" stroke-width="2"/>
    <text x="300" y="100" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#1E3A5F">Memory  M</text>
    <text x="300" y="150" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#1E3A5F">verified,</text>
    <text x="300" y="166" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#1E3A5F">not stale</text>
    <text x="300" y="208" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#A0522D" font-style="italic">vs. confidently outdated</text>
  </g>

  <!-- Skills -->
  <g>
    <circle cx="480" cy="120" r="8" fill="#4B8BDA"/>
    <line x1="480" y1="128" x2="445" y2="165" stroke="#4B8BDA" stroke-width="2"/>
    <line x1="480" y1="128" x2="480" y2="165" stroke="#4B8BDA" stroke-width="2"/>
    <line x1="480" y1="128" x2="515" y2="165" stroke="#4B8BDA" stroke-width="2"/>
    <circle cx="445" cy="170" r="6" fill="#EFF6FF" stroke="#4B8BDA" stroke-width="2"/>
    <circle cx="480" cy="170" r="6" fill="#EFF6FF" stroke="#4B8BDA" stroke-width="2"/>
    <circle cx="515" cy="170" r="6" fill="#EFF6FF" stroke="#4B8BDA" stroke-width="2"/>
    <text x="480" y="100" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#1E3A5F">Skills  S</text>
    <text x="480" y="208" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#1E3A5F">routed &amp; checked</text>
    <text x="480" y="224" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#A0522D" font-style="italic">vs. called but unverified</text>
  </g>

  <!-- Arrows down to G -->
  <line x1="135" y1="230" x2="245" y2="328" stroke="#4B8BDA" stroke-width="2" marker-end="url(#a)"/>
  <line x1="300" y1="230" x2="300" y2="326" stroke="#4B8BDA" stroke-width="2" marker-end="url(#a)"/>
  <line x1="465" y1="230" x2="355" y2="328" stroke="#4B8BDA" stroke-width="2" marker-end="url(#a)"/>

  <!-- Governance G as gate -->
  <g>
    <rect x="200" y="335" width="200" height="70" rx="8" fill="#FDF4E7" stroke="#A0522D" stroke-width="2.5"/>
    <text x="300" y="367" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="bold" fill="#1E3A5F">Verification  G</text>
    <text x="300" y="389" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#3D4F65">the shared gatekeeper</text>
  </g>
</svg>