<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4B8BDA"/>
    </marker>
  </defs>

  <text x="400" y="40" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="600" fill="#1E3A5F">Same Model · Different Harness</text>
  <text x="400" y="62" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#3D4F65">"remember: use pytest" → stored as ?</text>

  <!-- central memory note -->
  <rect x="330" y="85" width="140" height="40" rx="8" fill="#FFF4E0" stroke="#E0A85C" stroke-width="1.5"/>
  <text x="400" y="110" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#1E3A5F">user preference</text>

  <!-- arrows from center to each harness top -->
  <line x1="360" y1="125" x2="170" y2="220" stroke="#4B8BDA" stroke-width="1.8" marker-end="url(#ar)"/>
  <line x1="400" y1="125" x2="400" y2="220" stroke="#4B8BDA" stroke-width="1.8" marker-end="url(#ar)"/>
  <line x1="440" y1="125" x2="630" y2="220" stroke="#4B8BDA" stroke-width="1.8" marker-end="url(#ar)"/>

  <!-- Claude Code -->
  <rect x="40" y="225" width="240" height="210" rx="10" fill="#EFF6FF" stroke="#4B8BDA" stroke-width="1.5"/>
  <text x="160" y="252" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#1E3A5F">Claude Code</text>
  <text x="160" y="271" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#3D4F65">vendor coding agent · TS</text>

  <rect x="65" y="290" width="190" height="54" rx="6" fill="#FFFFFF" stroke="#9CB6D4"/>
  <text x="160" y="312" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#1E3A5F">CLAUDE.md (persistent file)</text>
  <text x="160" y="332" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#3D4F65">project-scoped, human-edited</text>

  <text x="160" y="395" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#1E3A5F">priority: stability</text>

  <!-- OpenClaw -->
  <rect x="290" y="225" width="220" height="210" rx="10" fill="#EFF6FF" stroke="#4B8BDA" stroke-width="1.5"/>
  <text x="400" y="252" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#1E3A5F">OpenClaw</text>
  <text x="400" y="271" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#3D4F65">personal assistant · TS</text>

  <rect x="315" y="290" width="170" height="54" rx="6" fill="#FFFFFF" stroke="#9CB6D4"/>
  <text x="400" y="312" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#1E3A5F">chat history + vectors</text>
  <text x="400" y="332" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#3D4F65">implicit recall by similarity</text>

  <text x="400" y="395" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#1E3A5F">priority: multi-channel</text>

  <!-- CheetahClaws (highlight) -->
  <rect x="520" y="225" width="240" height="210" rx="10" fill="#FFF4E0" stroke="#E0A85C" stroke-width="2.2"/>
  <text x="640" y="252" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#1E3A5F">CheetahClaws</text>
  <text x="640" y="271" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#3D4F65">open research ref · Py</text>

  <rect x="545" y="285" width="190" height="64" rx="6" fill="#FFFFFF" stroke="#E0A85C"/>
  <text x="640" y="305" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#1E3A5F">{ pref: pytest,</text>
  <text x="640" y="322" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#C25E2E">confidence: 0.9,</text>
  <text x="640" y="339" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#C25E2E">recency: today }</text>

  <text x="640" y="395" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#1E3A5F">priority: explicit · ranked</text>

  <!-- footer -->
  <text x="400" y="470" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" font-style="italic" fill="#1E3A5F">harness choice → agent behavior</text>
</svg>