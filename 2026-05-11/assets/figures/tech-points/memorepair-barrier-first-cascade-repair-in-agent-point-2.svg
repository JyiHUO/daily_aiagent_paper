<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4B8BDA"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="450" y="38" text-anchor="middle" font-size="22" font-weight="bold" fill="#1E3A5F">Barrier-first 修复契约：先封锁，再重建，最后放行</text>
  <text x="450" y="62" text-anchor="middle" font-size="13" fill="#3D4F65">源头被删/改 → 下游派生物三步事务式修复</text>

  <!-- Stage 1: Barrier (Withdraw) -->
  <g>
    <rect x="40" y="90" width="250" height="400" rx="12" fill="#FDECE7" stroke="#C0654A" stroke-width="2"/>
    <text x="165" y="120" text-anchor="middle" font-size="16" font-weight="bold" fill="#1E3A5F">① Withdrawal Barrier</text>
    <text x="165" y="140" text-anchor="middle" font-size="12" fill="#3D4F65">整体下架 C(F)，禁止服务</text>

    <rect x="70" y="165" width="190" height="44" rx="6" fill="#FFFFFF" stroke="#C0654A" stroke-dasharray="5,3"/>
    <text x="165" y="192" text-anchor="middle" font-size="13" fill="#9A4A36" text-decoration="line-through">源记忆 e (已删/改)</text>

    <rect x="70" y="230" width="190" height="44" rx="6" fill="#FFE0D6" stroke="#C0654A"/>
    <text x="165" y="257" text-anchor="middle" font-size="13" fill="#1E3A5F">S1 · summary</text>

    <rect x="70" y="290" width="190" height="44" rx="6" fill="#FFE0D6" stroke="#C0654A"/>
    <text x="165" y="317" text-anchor="middle" font-size="13" fill="#1E3A5F">C2 · cache</text>

    <rect x="70" y="350" width="190" height="44" rx="6" fill="#FFE0D6" stroke="#C0654A"/>
    <text x="165" y="377" text-anchor="middle" font-size="13" fill="#1E3A5F">K3 · neural skill</text>

    <text x="165" y="430" text-anchor="middle" font-size="12" fill="#9A4A36">C(F) 全部不可见</text>
    <text x="165" y="450" text-anchor="middle" font-size="12" fill="#9A4A36">杜绝 stale 泄漏</text>
  </g>

  <!-- Arrow 1 -->
  <line x1="293" y1="290" x2="347" y2="290" stroke="#4B8BDA" stroke-width="3" marker-end="url(#arr)"/>

  <!-- Stage 2: Construct -->
  <g>
    <rect x="350" y="90" width="270" height="400" rx="12" fill="#EFF6FF" stroke="#4B8BDA" stroke-width="2"/>
    <text x="485" y="120" text-anchor="middle" font-size="16" font-weight="bold" fill="#1E3A5F">② 候选后继构造</text>
    <text x="485" y="140" text-anchor="middle" font-size="12" fill="#3D4F65">为每个后代选模式 µ</text>

    <rect x="370" y="165" width="230" height="56" rx="6" fill="#FFFFFF" stroke="#4B8BDA"/>
    <text x="385" y="187" font-size="13" font-weight="bold" fill="#1E3A5F">S1 → regen</text>
    <text x="385" y="207" font-size="11" fill="#3D4F65">用保留支撑重新摘要</text>

    <rect x="370" y="232" width="230" height="56" rx="6" fill="#FFFFFF" stroke="#4B8BDA"/>
    <text x="385" y="254" font-size="13" font-weight="bold" fill="#1E3A5F">C2 → recompute</text>
    <text x="385" y="274" font-size="11" fill="#3D4F65">确定性 replay 重算</text>

    <rect x="370" y="299" width="230" height="56" rx="6" fill="#FFFFFF" stroke="#4B8BDA"/>
    <text x="385" y="321" font-size="13" font-weight="bold" fill="#1E3A5F">K3 → param</text>
    <text x="385" y="341" font-size="11" fill="#3D4F65">LUNE 参数级 forget</text>

    <rect x="370" y="366" width="230" height="44" rx="6" fill="#FFFFFF" stroke="#4B8BDA" stroke-dasharray="4,3"/>
    <text x="485" y="393" text-anchor="middle" font-size="13" fill="#3D4F65">或 remove (无法修复)</text>

    <text x="485" y="445" text-anchor="middle" font-size="12" fill="#1E3A5F">基于 Ret(e) 与已修前驱</text>
  </g>

  <!-- Arrow 2 -->
  <line x1="623" y1="290" x2="677" y2="290" stroke="#4B8BDA" stroke-width="3" marker-end="url(#arr)"/>

  <!-- Stage 3: Validate + Republish -->
  <g>
    <rect x="680" y="90" width="200" height="400" rx="12" fill="#E8F3EC" stroke="#4A8C6F" stroke-width="2"/>
    <text x="780" y="120" text-anchor="middle" font-size="16" font-weight="bold" fill="#1E3A5F">③ 校验 + 重发布</text>
    <text x="780" y="140" text-anchor="middle" font-size="12" fill="#3D4F65">predecessor-closed</text>

    <rect x="700" y="170" width="160" height="50" rx="6" fill="#D6EADD" stroke="#4A8C6F"/>
    <text x="780" y="192" text-anchor="middle" font-size="12" fill="#1E3A5F">Validate-i ✓</text>
    <text x="780" y="210" text-anchor="middle" font-size="11" fill="#3D4F65">schema + 回归</text>

    <rect x="700" y="235" width="160" height="50" rx="6" fill="#D6EADD" stroke="#4A8C6F"/>
    <text x="780" y="257" text-anchor="middle" font-size="12" fill="#1E3A5F">前驱已修 ✓</text>
    <text x="780" y="275" text-anchor="middle" font-size="11" fill="#3D4F65">依赖闭包成立</text>

    <rect x="700" y="305" width="160" height="60" rx="6" fill="#4A8C6F" stroke="#2F6A50"/>
    <text x="780" y="330" text-anchor="middle" font-size="14" font-weight="bold" fill="#FFFFFF">republish</text>
    <text x="780" y="350" text-anchor="middle" font-size="11" fill="#E8F3EC">放回服务</text>

    <text x="780" y="410" text-anchor="middle" font-size="12" fill="#1E3A5F">未通过 → 留在 barrier</text>
  </g>

  <!-- Bottom slogan -->
  <rect x="120" y="510" width="660" height="36" rx="18" fill="#1E3A5F"/>
  <text x="450" y="534" text-anchor="middle" font-size="13" fill="#FFFFFF">像数据库事务：封锁 → 重建 → 校验放行，修复期间零 stale 暴露</text>
</svg>