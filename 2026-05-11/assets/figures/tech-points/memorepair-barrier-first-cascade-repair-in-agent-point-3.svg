<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 580" font-family="'Helvetica Neue',Arial,sans-serif">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4B8BDA"/>
    </marker>
    <marker id="arO" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#E08A5F"/>
    </marker>
    <marker id="arD" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1E3A5F"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="450" y="38" text-anchor="middle" font-size="22" font-weight="700" fill="#1E3A5F">选哪些派生物 republish？ → 一次 min-cut 精确求解</text>
  <text x="450" y="62" text-anchor="middle" font-size="13" fill="#3D4F65">最大权闭包问题：选了节点必须选其所有前驱</text>

  <!-- LEFT: candidate DAG -->
  <g>
    <rect x="40" y="95" width="360" height="380" rx="12" fill="#EFF6FF" stroke="#4B8BDA" stroke-width="1.5"/>
    <text x="220" y="120" text-anchor="middle" font-size="15" font-weight="700" fill="#1E3A5F">候选派生物 (带前驱依赖)</text>

    <!-- A -->
    <circle cx="110" cy="180" r="32" fill="#C8E5C2" stroke="#4A8C3F" stroke-width="2"/>
    <text x="110" y="178" text-anchor="middle" font-size="12" font-weight="700" fill="#1E3A5F">A</text>
    <text x="110" y="194" text-anchor="middle" font-size="10" fill="#3D4F65">w=8 c=2</text>

    <!-- B -->
    <circle cx="220" cy="180" r="32" fill="#C8E5C2" stroke="#4A8C3F" stroke-width="2"/>
    <text x="220" y="178" text-anchor="middle" font-size="12" font-weight="700" fill="#1E3A5F">B</text>
    <text x="220" y="194" text-anchor="middle" font-size="10" fill="#3D4F65">w=6 c=3</text>

    <!-- C: dropped -->
    <circle cx="330" cy="180" r="32" fill="#EADBD0" stroke="#A07060" stroke-width="2" stroke-dasharray="4 3"/>
    <text x="330" y="178" text-anchor="middle" font-size="12" font-weight="700" fill="#7A5340">C</text>
    <text x="330" y="194" text-anchor="middle" font-size="10" fill="#7A5340">w=2 c=9</text>

    <!-- D -->
    <circle cx="160" cy="300" r="32" fill="#C8E5C2" stroke="#4A8C3F" stroke-width="2"/>
    <text x="160" y="298" text-anchor="middle" font-size="12" font-weight="700" fill="#1E3A5F">D</text>
    <text x="160" y="314" text-anchor="middle" font-size="10" fill="#3D4F65">w=10 c=3</text>

    <!-- E: dropped -->
    <circle cx="310" cy="300" r="32" fill="#EADBD0" stroke="#A07060" stroke-width="2" stroke-dasharray="4 3"/>
    <text x="310" y="298" text-anchor="middle" font-size="12" font-weight="700" fill="#7A5340">E</text>
    <text x="310" y="314" text-anchor="middle" font-size="10" fill="#7A5340">需 C</text>

    <!-- F -->
    <circle cx="220" cy="410" r="32" fill="#C8E5C2" stroke="#4A8C3F" stroke-width="2"/>
    <text x="220" y="408" text-anchor="middle" font-size="12" font-weight="700" fill="#1E3A5F">F</text>
    <text x="220" y="424" text-anchor="middle" font-size="10" fill="#3D4F65">w=7 c=2</text>

    <!-- edges -->
    <line x1="125" y1="208" x2="148" y2="270" stroke="#4B8BDA" stroke-width="1.8" marker-end="url(#ar)"/>
    <line x1="208" y1="208" x2="172" y2="270" stroke="#4B8BDA" stroke-width="1.8" marker-end="url(#ar)"/>
    <line x1="320" y1="210" x2="312" y2="268" stroke="#A07060" stroke-width="1.8" stroke-dasharray="4 3" marker-end="url(#arO)"/>
    <line x1="190" y1="328" x2="212" y2="378" stroke="#4B8BDA" stroke-width="1.8" marker-end="url(#ar)"/>

    <!-- legend -->
    <rect x="60" y="448" width="14" height="14" fill="#C8E5C2" stroke="#4A8C3F"/>
    <text x="80" y="460" font-size="11" fill="#1E3A5F">选中 (闭包内)</text>
    <rect x="200" y="448" width="14" height="14" fill="#EADBD0" stroke="#A07060" stroke-dasharray="4 3"/>
    <text x="220" y="460" font-size="11" fill="#1E3A5F">放弃 (成本高 / 前驱不可用)</text>
  </g>

  <!-- middle arrow -->
  <g>
    <path d="M 410 280 L 490 280" stroke="#4B8BDA" stroke-width="3" marker-end="url(#ar)"/>
    <text x="450" y="265" text-anchor="middle" font-size="12" font-weight="700" fill="#1E3A5F">p_i = w_i − λ·c_i</text>
    <text x="450" y="300" text-anchor="middle" font-size="11" fill="#3D4F65">化为最大权闭包</text>
  </g>

  <!-- RIGHT: s-t min cut -->
  <g>
    <rect x="500" y="95" width="370" height="380" rx="12" fill="#FFF4E8" stroke="#E08A5F" stroke-width="1.5"/>
    <text x="685" y="120" text-anchor="middle" font-size="15" font-weight="700" fill="#1E3A5F">单次 s-t Min-Cut 精确求解</text>

    <!-- source s -->
    <circle cx="540" cy="285" r="26" fill="#4B8BDA" stroke="#1E3A5F" stroke-width="2"/>
    <text x="540" y="290" text-anchor="middle" font-size="14" font-weight="700" fill="#FFFFFF">s</text>

    <!-- middle nodes -->
    <circle cx="685" cy="200" r="22" fill="#C8E5C2" stroke="#4A8C3F" stroke-width="1.8"/>
    <text x="685" y="205" text-anchor="middle" font-size="11" fill="#1E3A5F">p&gt;0</text>

    <circle cx="685" cy="285" r="22" fill="#C8E5C2" stroke="#4A8C3F" stroke-width="1.8"/>
    <text x="685" y="290" text-anchor="middle" font-size="11" fill="#1E3A5F">p&gt;0</text>

    <circle cx="685" cy="370" r="22" fill="#EADBD0" stroke="#A07060" stroke-width="1.8"/>
    <text x="685" y="375" text-anchor="middle" font-size="11" fill="#7A5340">p&lt;0</text>

    <!-- sink t -->
    <circle cx="830" cy="285" r="26" fill="#E08A5F" stroke="#7A3F20" stroke-width="2"/>
    <text x="830" y="290" text-anchor="middle" font-size="14" font-weight="700" fill="#FFFFFF">t</text>

    <!-- edges from s -->
    <line x1="562" y1="272" x2="665" y2="208" stroke="#4B8BDA" stroke-width="1.6" marker-end="url(#ar)"/>
    <line x1="566" y1="285" x2="663" y2="285" stroke="#4B8BDA" stroke-width="1.6" marker-end="url(#ar)"/>
    <text x="585" y="245" font-size="10" fill="#3D4F65">cap = p_i</text>

    <!-- edge from negative to t -->
    <line x1="705" y1="362" x2="808" y2="298" stroke="#E08A5F" stroke-width="1.6" marker-end="url(#arO)"/>
    <text x="720" y="395" font-size="10" fill="#7A5340">cap = |p_i|</text>

    <!-- predecessor edges (infinite) -->
    <line x1="685" y1="222" x2="685" y2="261" stroke="#1E3A5F" stroke-width="1.8" stroke-dasharray="3 3" marker-end="url(#arD)"/>
    <line x1="685" y1="307" x2="685" y2="346" stroke="#1E3A5F" stroke-width="1.8" stroke-dasharray="3 3" marker-end="url(#arD)"/>
    <text x="610" y="335" font-size="10" fill="#1E3A5F">前驱边: ∞</text>

    <!-- cut line -->
    <path d="M 770 135 Q 760 285 770 440" stroke="#C0392B" stroke-width="2.5" stroke-dasharray="6 4" fill="none"/>
    <text x="785" y="145" font-size="12" font-weight="700" fill="#C0392B">min-cut</text>

    <!-- result box -->
    <rect x="530" y="410" width="310" height="50" rx="8" fill="#FFFFFF" stroke="#E08A5F" stroke-width="1.2"/>
    <text x="685" y="430" text-anchor="middle" font-size="12" font-weight="700" fill="#1E3A5F">ToolBench (λ=0.3): 选 45% 候选</text>
    <text x="685" y="450" text-anchor="middle" font-size="11" fill="#3D4F65">恢复 92% 发布量, 成本仅 0.57 (优于 greedy)</text>
  </g>

  <!-- bottom note -->
  <text x="450" y="510" text-anchor="middle" font-size="12" fill="#3D4F65">闭包约束 (选 D 必选 A,B) 由 ∞ 容量边强制 — 一次网络流即得最优子集</text>
  <text x="450" y="530" text-anchor="middle" font-size="11" fill="#3D4F65" font-style="italic">Theorem 1: 价值-成本平衡的发布选择 = 最大权闭包 = s-t min-cut</text>
</svg>