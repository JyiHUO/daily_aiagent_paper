<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 580" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4B8BDA"/>
    </marker>
  </defs>

  <rect width="900" height="580" fill="#F7FAFC"/>

  <text x="450" y="38" text-anchor="middle" font-size="22" font-weight="700" fill="#1E3A5F">Spell 的关键技巧：只 eval 最后一行</text>
  <text x="450" y="62" text-anchor="middle" font-size="13" fill="#3D4F65">让模型自己写编排程序，又不会重放上一轮的副作用</text>

  <!-- Turn 1 -->
  <g>
    <rect x="40" y="95" width="380" height="220" rx="10" fill="#EFF6FF" stroke="#4B8BDA" stroke-width="1.5"/>
    <text x="60" y="122" font-size="15" font-weight="700" fill="#1E3A5F">Turn 1 程序</text>

    <rect x="60" y="138" width="340" height="40" rx="5" fill="#FFFFFF" stroke="#B8CCE0"/>
    <text x="72" y="163" font-size="13" fill="#3D4F65">(do  ...本地计算...</text>

    <rect x="60" y="188" width="340" height="56" rx="5" fill="#FEF3C7" stroke="#D97706" stroke-width="2"/>
    <text x="72" y="210" font-size="13" font-weight="700" fill="#1E3A5F">'(read-file &amp; self-call)</text>
    <text x="72" y="230" font-size="11" fill="#92400E">↑ 尾表达式（被 eval，触发副作用）</text>

    <text x="60" y="270" font-size="11" fill="#3D4F65">外层 wrapper 只 eval 这一行</text>
    <text x="60" y="288" font-size="11" fill="#3D4F65">→ 调用工具，进入下一轮</text>
  </g>

  <!-- arrow -->
  <text x="450" y="195" text-anchor="middle" font-size="12" fill="#1E3A5F">追加</text>
  <line x1="425" y1="210" x2="475" y2="210" stroke="#4B8BDA" stroke-width="2.5" marker-end="url(#ar)"/>

  <!-- Turn 2 -->
  <g>
    <rect x="480" y="95" width="380" height="295" rx="10" fill="#EFF6FF" stroke="#4B8BDA" stroke-width="1.5"/>
    <text x="500" y="122" font-size="15" font-weight="700" fill="#1E3A5F">Turn 2 程序</text>

    <rect x="500" y="138" width="340" height="40" rx="5" fill="#FFFFFF" stroke="#B8CCE0"/>
    <text x="512" y="163" font-size="13" fill="#3D4F65">(do  ...本地计算...</text>

    <rect x="500" y="188" width="340" height="40" rx="5" fill="#E5E7EB" stroke="#9CA3AF" stroke-dasharray="4 3"/>
    <text x="512" y="213" font-size="13" fill="#6B7280">'(read-file &amp; self-call)  ← 旧</text>

    <rect x="500" y="238" width="340" height="56" rx="5" fill="#FEF3C7" stroke="#D97706" stroke-width="2"/>
    <text x="512" y="260" font-size="13" font-weight="700" fill="#1E3A5F">'(write-file &amp; self-call)</text>
    <text x="512" y="280" font-size="11" fill="#92400E">↑ 新尾表达式（这次才被 eval）</text>

    <text x="500" y="320" font-size="11" fill="#3D4F65">旧的那行不再是最后一行</text>
    <text x="500" y="338" font-size="11" fill="#3D4F65">→ 自动降级为惰性字面数据</text>
    <text x="500" y="356" font-size="11" fill="#3D4F65">→ 工具不会被重复调用 ✓</text>
    <text x="500" y="374" font-size="11" fill="#3D4F65">→ 仍可作为历史被模型读取 ✓</text>
  </g>

  <!-- bottom insight -->
  <g>
    <rect x="80" y="420" width="740" height="140" rx="10" fill="#1E3A5F"/>
    <text x="450" y="455" text-anchor="middle" font-size="15" font-weight="700" fill="#FFFFFF">核心洞察：用 quote 把过去封冻成数据</text>
    <text x="450" y="485" text-anchor="middle" font-size="13" fill="#CBD5E0">上一轮的副作用代码 = 引号内的字符串 = 不会被执行</text>
    <text x="450" y="510" text-anchor="middle" font-size="13" fill="#CBD5E0">本轮新代码追加在末尾 = 唯一被 eval 的尾表达式</text>
    <text x="450" y="538" text-anchor="middle" font-size="12" fill="#93C5FD">上下文即代码，但只有最新一行真正运行</text>
  </g>
</svg>