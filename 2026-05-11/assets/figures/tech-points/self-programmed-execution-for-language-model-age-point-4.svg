<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4B8BDA"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="450" y="40" text-anchor="middle" font-size="22" font-weight="700" fill="#1E3A5F">把编排交给模型后，它最爱用的是「上下文瘦身」</text>
  <text x="450" y="65" text-anchor="middle" font-size="13" fill="#3D4F65">实测：自编排 Agent 的 token 用量 ≈ Codex CLI 的 1/4</text>

  <!-- LEFT: Traditional harness -->
  <rect x="50" y="100" width="360" height="220" rx="10" fill="#FBEFE9" stroke="#C97064" stroke-width="1.5"/>
  <text x="230" y="127" text-anchor="middle" font-size="15" font-weight="700" fill="#1E3A5F">传统 harness：上下文越塞越胖</text>

  <rect x="75" y="148" width="310" height="34" rx="4" fill="#F5D9CF"/>
  <text x="85" y="170" font-size="12" fill="#3D4F65">turn1: ls → 3000 行输出全留下</text>

  <rect x="75" y="190" width="310" height="34" rx="4" fill="#F2C9BC"/>
  <text x="85" y="212" font-size="12" fill="#3D4F65">turn2: grep → 又一大段塞入上下文</text>

  <rect x="75" y="232" width="310" height="34" rx="4" fill="#EFB9A9"/>
  <text x="85" y="254" font-size="12" fill="#3D4F65">turn3: cat file → 上下文继续膨胀…</text>

  <rect x="75" y="274" width="310" height="34" rx="4" fill="#EBA796"/>
  <text x="85" y="296" font-size="12" fill="#7A3F38" font-weight="600">turn4: 窗口爆炸，token 飙升 4×</text>

  <!-- RIGHT: Self-programmed with !peek -->
  <rect x="490" y="100" width="360" height="220" rx="10" fill="#EFF6FF" stroke="#4B8BDA" stroke-width="1.5"/>
  <text x="670" y="127" text-anchor="middle" font-size="15" font-weight="700" fill="#1E3A5F">自编排：用 !peek 看一眼就丢</text>

  <rect x="515" y="148" width="310" height="56" rx="4" fill="#DCE9F8"/>
  <text x="525" y="170" font-size="12" fill="#1E3A5F" font-weight="600">!peek( ls; grep TODO; cat README )</text>
  <text x="525" y="190" font-size="11" fill="#3D4F65">→ 结果只在本轮可见，不进后续上下文</text>

  <rect x="515" y="214" width="310" height="56" rx="4" fill="#DCE9F8"/>
  <text x="525" y="236" font-size="12" fill="#1E3A5F" font-weight="600">批量并行：一次写多个工具调用</text>
  <text x="525" y="256" font-size="11" fill="#3D4F65">→ 减少轮次，按上一步结果自动分支</text>

  <text x="670" y="300" text-anchor="middle" font-size="14" font-weight="700" fill="#2E6BB8">token 用量 ↓ ≈ 4×</text>

  <!-- Arrow showing key contrast -->
  <line x1="412" y1="210" x2="486" y2="210" stroke="#4B8BDA" stroke-width="2.5" marker-end="url(#ar)"/>
  <text x="449" y="202" text-anchor="middle" font-size="11" fill="#2E6BB8" font-weight="600">交给模型</text>

  <!-- Bottom finding -->
  <rect x="50" y="360" width="800" height="100" rx="10" fill="#F4F1EA" stroke="#B8A88A" stroke-width="1.2"/>
  <text x="450" y="388" text-anchor="middle" font-size="15" font-weight="700" fill="#1E3A5F">模型真正学会的，只是 harness 工程师最头疼的那件事</text>

  <rect x="80" y="405" width="240" height="40" rx="6" fill="#DDEBF8"/>
  <text x="200" y="430" text-anchor="middle" font-size="13" fill="#1E3A5F">✓ 上下文裁剪 (!peek)</text>

  <rect x="335" y="405" width="240" height="40" rx="6" fill="#DDEBF8"/>
  <text x="455" y="430" text-anchor="middle" font-size="13" fill="#1E3A5F">✓ 多调用串联 / 批处理</text>

  <rect x="590" y="405" width="240" height="40" rx="6" fill="#F5D9CF"/>
  <text x="710" y="430" text-anchor="middle" font-size="13" fill="#7A3F38">✗ 子 Agent 委派（几乎不用）</text>

  <!-- Footer -->
  <text x="450" y="495" text-anchor="middle" font-size="13" fill="#3D4F65">编排权下放后，模型自发解决了「上下文窗口管理」——</text>
  <text x="450" y="515" text-anchor="middle" font-size="13" fill="#3D4F65">这正是当前 Agent 框架最大的人工调优痛点</text>
  <text x="450" y="545" text-anchor="middle" font-size="12" font-style="italic" fill="#7A8595">而更高阶的多 Agent 自委派？目前模型还不会主动用，需要专门训练</text>
</svg>