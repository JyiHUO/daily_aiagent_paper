<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 560" font-family="-apple-system, 'Segoe UI', sans-serif">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4B8BDA"/>
    </marker>
  </defs>

  <rect width="880" height="560" fill="#FAF7F2"/>

  <text x="440" y="40" text-anchor="middle" font-size="22" font-weight="700" fill="#1E3A5F">
    模型自己接管"上下文管理"，省下 ~4× tokens
  </text>
  <text x="440" y="65" text-anchor="middle" font-size="13" fill="#3D4F65">
    把编排权交给 LM 后，它最爱用的两招
  </text>

  <!-- LEFT: traditional harness -->
  <g>
    <rect x="40" y="100" width="340" height="180" rx="10" fill="#F3E9DC" stroke="#C9A87A" stroke-width="1.5"/>
    <text x="210" y="125" text-anchor="middle" font-size="15" font-weight="700" fill="#8B5A2B">传统 Harness（如 Codex CLI）</text>

    <rect x="65" y="145" width="290" height="28" rx="4" fill="#FFFFFF" stroke="#C9A87A"/>
    <text x="75" y="164" font-size="12" fill="#3D4F65">turn 1: ls /repo  → 长输出全部留下</text>

    <rect x="65" y="180" width="290" height="28" rx="4" fill="#FFFFFF" stroke="#C9A87A"/>
    <text x="75" y="199" font-size="12" fill="#3D4F65">turn 2: grep TODO → 又一段长输出</text>

    <rect x="65" y="215" width="290" height="28" rx="4" fill="#FFFFFF" stroke="#C9A87A"/>
    <text x="75" y="234" font-size="12" fill="#3D4F65">turn 3: cat a.py → 上下文越堆越胖</text>

    <text x="210" y="265" text-anchor="middle" font-size="13" font-weight="700" fill="#B5651D">每轮一调用 · 全部保留</text>
  </g>

  <!-- RIGHT: self-programmed -->
  <g>
    <rect x="500" y="100" width="340" height="180" rx="10" fill="#EFF6FF" stroke="#4B8BDA" stroke-width="1.5"/>
    <text x="670" y="125" text-anchor="middle" font-size="15" font-weight="700" fill="#1E3A5F">自编排（Spell）</text>

    <rect x="525" y="145" width="290" height="42" rx="4" fill="#FFFFFF" stroke="#4B8BDA"/>
    <text x="535" y="163" font-size="12" fill="#1E3A5F" font-weight="700">!peek( ls; grep TODO )</text>
    <text x="535" y="180" font-size="11" fill="#3D4F65">→ 看一眼，结果不进入后续上下文</text>

    <rect x="525" y="195" width="290" height="42" rx="4" fill="#FFFFFF" stroke="#4B8BDA"/>
    <text x="535" y="213" font-size="12" fill="#1E3A5F" font-weight="700">batch: read(a.py, b.py, c.py)</text>
    <text x="535" y="230" font-size="11" fill="#3D4F65">→ 一回合串联多次调用</text>

    <text x="670" y="265" text-anchor="middle" font-size="13" font-weight="700" fill="#1E3A5F">精控保留 · 减少轮次</text>
  </g>

  <!-- arrow comparison -->
  <line x1="385" y1="190" x2="495" y2="190" stroke="#4B8BDA" stroke-width="2.5" marker-end="url(#ar)"/>
  <text x="440" y="183" text-anchor="middle" font-size="11" fill="#1E3A5F">交给模型</text>

  <!-- Bottom: token bars -->
  <g>
    <text x="440" y="335" text-anchor="middle" font-size="14" font-weight="700" fill="#1E3A5F">同任务总 Token 消耗</text>

    <text x="80" y="378" font-size="12" fill="#3D4F65">Codex CLI</text>
    <rect x="160" y="362" width="500" height="22" fill="#C9A87A"/>
    <text x="670" y="378" font-size="12" fill="#1E3A5F" font-weight="700">4×</text>

    <text x="80" y="418" font-size="12" fill="#3D4F65">GPT-5 + Spell</text>
    <rect x="160" y="402" width="125" height="22" fill="#4B8BDA"/>
    <text x="295" y="418" font-size="12" fill="#1E3A5F" font-weight="700">1×</text>
  </g>

  <!-- Bottom note: multi-agent -->
  <g>
    <rect x="120" y="460" width="640" height="70" rx="8" fill="#FFF4E6" stroke="#D9A066" stroke-width="1.2" stroke-dasharray="5 4"/>
    <text x="440" y="485" text-anchor="middle" font-size="13" font-weight="700" fill="#8B5A2B">⚠ 模型不会主动派"子 Agent"，显式提示也基本无效</text>
    <text x="440" y="510" text-anchor="middle" font-size="12" fill="#3D4F65">真正的红利在上下文管理，不在任务委派 —— 多 Agent 需专门训练</text>
  </g>
</svg>