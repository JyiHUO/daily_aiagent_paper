<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 580" font-family="'Helvetica Neue',Arial,sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4B8BDA"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#D9534F"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="450" y="40" text-anchor="middle" font-size="22" font-weight="700" fill="#1E3A5F">Agent-BOM @ OpenClaw：把 Agent 执行变成可审计图</text>
  <text x="450" y="64" text-anchor="middle" font-size="13" fill="#3D4F65">审计插件实测：事后重建攻击链 → 命中 OWASP Agentic 风险</text>

  <!-- Stage 1: Runtime -->
  <g>
    <rect x="40" y="110" width="220" height="170" rx="12" fill="#EFF6FF" stroke="#4B8BDA" stroke-width="2"/>
    <text x="150" y="138" text-anchor="middle" font-size="15" font-weight="700" fill="#1E3A5F">① Agent 运行时</text>
    <text x="150" y="160" text-anchor="middle" font-size="11" fill="#3D4F65">OpenClaw V2026.2.6</text>

    <circle cx="85" cy="205" r="18" fill="#FFE8D6" stroke="#E89B5A" stroke-width="1.5"/>
    <text x="85" y="209" text-anchor="middle" font-size="11" fill="#1E3A5F">A1</text>
    <circle cx="150" cy="230" r="18" fill="#FFE8D6" stroke="#E89B5A" stroke-width="1.5"/>
    <text x="150" y="234" text-anchor="middle" font-size="11" fill="#1E3A5F">A2</text>
    <circle cx="215" cy="205" r="18" fill="#FFE8D6" stroke="#E89B5A" stroke-width="1.5"/>
    <text x="215" y="209" text-anchor="middle" font-size="11" fill="#1E3A5F">A3</text>

    <line x1="103" y1="205" x2="132" y2="222" stroke="#9AA9BC" stroke-width="1.3"/>
    <line x1="168" y1="222" x2="197" y2="205" stroke="#9AA9BC" stroke-width="1.3"/>
    <line x1="103" y1="200" x2="197" y2="200" stroke="#9AA9BC" stroke-width="1.3" stroke-dasharray="3,3"/>

    <text x="150" y="268" text-anchor="middle" font-size="11" fill="#3D4F65">工具调用 / 记忆 / 跨 Agent 消息</text>
  </g>

  <!-- Plugin arrow -->
  <line x1="263" y1="195" x2="337" y2="195" stroke="#4B8BDA" stroke-width="2.5" marker-end="url(#arr)"/>
  <text x="300" y="186" text-anchor="middle" font-size="11" fill="#1E3A5F" font-weight="600">采集</text>

  <!-- Stage 2: Graph -->
  <g>
    <rect x="340" y="110" width="240" height="170" rx="12" fill="#FFF6E8" stroke="#E89B5A" stroke-width="2"/>
    <text x="460" y="138" text-anchor="middle" font-size="15" font-weight="700" fill="#1E3A5F">② Agent-BOM 图</text>
    <text x="460" y="156" text-anchor="middle" font-size="11" fill="#3D4F65">归一化属性图（trace-id, ts）</text>

    <!-- mini graph -->
    <circle cx="385" cy="220" r="11" fill="#D9534F"/>
    <text x="385" y="245" text-anchor="middle" font-size="10" fill="#D9534F" font-weight="600">毒记忆</text>
    <circle cx="445" cy="225" r="10" fill="#4B8BDA"/>
    <circle cx="510" cy="210" r="10" fill="#4B8BDA"/>
    <circle cx="555" cy="245" r="10" fill="#4B8BDA"/>
    <circle cx="475" cy="260" r="10" fill="#4B8BDA"/>

    <line x1="396" y1="220" x2="432" y2="224" stroke="#4B8BDA" stroke-width="1.6" marker-end="url(#arr)"/>
    <line x1="455" y1="222" x2="498" y2="212" stroke="#4B8BDA" stroke-width="1.6" marker-end="url(#arr)"/>
    <line x1="517" y1="219" x2="546" y2="237" stroke="#4B8BDA" stroke-width="1.6" marker-end="url(#arr)"/>
    <line x1="450" y1="234" x2="467" y2="251" stroke="#4B8BDA" stroke-width="1.6" marker-end="url(#arr)"/>
  </g>

  <!-- Stage 3: Audit -->
  <line x1="583" y1="195" x2="657" y2="195" stroke="#4B8BDA" stroke-width="2.5" marker-end="url(#arr)"/>
  <text x="620" y="186" text-anchor="middle" font-size="11" fill="#1E3A5F" font-weight="600">查询</text>

  <g>
    <rect x="660" y="110" width="210" height="170" rx="12" fill="#FDECEC" stroke="#D9534F" stroke-width="2"/>
    <text x="765" y="138" text-anchor="middle" font-size="15" font-weight="700" fill="#1E3A5F">③ 风险裁定</text>
    <text x="765" y="156" text-anchor="middle" font-size="11" fill="#3D4F65">OWASP Agentic Top 10</text>

    <rect x="678" y="172" width="174" height="26" rx="5" fill="#fff" stroke="#D9534F"/>
    <text x="765" y="190" text-anchor="middle" font-size="11" fill="#1E3A5F">ASI04 记忆投毒+工具误用</text>
    <rect x="678" y="204" width="174" height="26" rx="5" fill="#fff" stroke="#D9534F"/>
    <text x="765" y="222" text-anchor="middle" font-size="11" fill="#1E3A5F">ASI06 供应链劫持</text>
    <rect x="678" y="236" width="174" height="26" rx="5" fill="#fff" stroke="#D9534F"/>
    <text x="765" y="254" text-anchor="middle" font-size="11" fill="#1E3A5F">ASI08 级联失败 ✓</text>
  </g>

  <!-- Bottom: trace-back demo -->
  <rect x="40" y="320" width="830" height="225" rx="12" fill="#F5F8FC" stroke="#B8C9DD" stroke-width="1.5"/>
  <text x="450" y="348" text-anchor="middle" font-size="14" font-weight="700" fill="#1E3A5F">实测：多 Agent 生态劫持 — 沿图反向回溯攻击链</text>

  <!-- Chain nodes -->
  <g transform="translate(60,425)">
    <rect x="0" y="0" width="130" height="60" rx="8" fill="#FDECEC" stroke="#D9534F" stroke-width="1.8"/>
    <text x="65" y="24" text-anchor="middle" font-size="12" font-weight="700" fill="#1E3A5F">注入点</text>
    <text x="65" y="44" text-anchor="middle" font-size="10.5" fill="#3D4F65">Agent A 目标被毒</text>
  </g>

  <g transform="translate(230,425)">
    <rect x="0" y="0" width="130" height="60" rx="8" fill="#FFF6E8" stroke="#E89B5A" stroke-width="1.8"/>
    <text x="65" y="24" text-anchor="middle" font-size="12" font-weight="700" fill="#1E3A5F">goal drift</text>
    <text x="65" y="44" text-anchor="middle" font-size="10.5" fill="#3D4F65">delegates-to B</text>
  </g>

  <g transform="translate(400,425)">
    <rect x="0" y="0" width="130" height="60" rx="8" fill="#FFF6E8" stroke="#E89B5A" stroke-width="1.8"/>
    <text x="65" y="24" text-anchor="middle" font-size="12" font-weight="700" fill="#1E3A5F">语义传播</text>
    <text x="65" y="44" text-anchor="middle" font-size="10.5" fill="#3D4F65">sends-to C</text>
  </g>

  <g transform="translate(570,425)">
    <rect x="0" y="0" width="130" height="60" rx="8" fill="#EFF6FF" stroke="#4B8BDA" stroke-width="1.8"/>
    <text x="65" y="24" text-anchor="middle" font-size="12" font-weight="700" fill="#1E3A5F">实际影响</text>
    <text x="65" y="44" text-anchor="middle" font-size="10.5" fill="#3D4F65">越权操作发生</text>
  </g>

  <g transform="translate(740,425)">
    <rect x="0" y="0" width="110" height="60" rx="8" fill="#FDECEC" stroke="#D9534F" stroke-width="1.8"/>
    <text x="55" y="24" text-anchor="middle" font-size="12" font-weight="700" fill="#1E3A5F">ASI08</text>
    <text x="55" y="44" text-anchor="middle" font-size="10.5" fill="#3D4F65">Cascading</text>
  </g>

  <!-- Forward arrows -->
  <line x1="190" y1="455" x2="228" y2="455" stroke="#4B8BDA" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="360" y1="455" x2="398" y2="455" stroke="#4B8BDA" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="530" y1="455" x2="568" y2="455" stroke="#4B8BDA" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="700" y1="455" x2="738" y2="455" stroke="#4B8BDA" stroke-width="2" marker-end="url(#arr)"/>

  <!-- Reverse trace -->
  <path d="M 795 415 Q 450 370 125 415" fill="none" stroke="#D9534F" stroke-width="2" stroke-dasharray="6,4" marker-end="url(#arrR)"/>
  <text x="450" y="378" text-anchor="middle" font-size="11" fill="#D9534F" font-weight="700">反向回溯：trace-id + timestamp</text>

  <text x="450" y="525" text-anchor="middle" font-size="12" fill="#1E3A5F" font-weight="600">从碎片日志 → 可观测、可追溯、可裁定的统一证据图</text>
</svg>