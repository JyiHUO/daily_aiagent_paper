<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 620" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#4B8BDA"/>
    </marker>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#4B8BDA"/>
      <stop offset="100%" stop-color="#7AB0E8"/>
    </linearGradient>
  </defs>

  <!-- Title -->
  <text x="450" y="38" text-anchor="middle" font-size="22" font-weight="bold" fill="#1E3A5F">MCP-BiFlow：把通用 SAST 远远甩在身后</text>
  <text x="450" y="62" text-anchor="middle" font-size="13" fill="#3D4F65">32 个 CVE 基准上的检出对比 · 真实 MCP 仓库实测</text>

  <!-- Left: bar chart on 32 CVE -->
  <g>
    <rect x="40" y="90" width="450" height="320" rx="10" fill="#EFF6FF" stroke="#B8D4EF"/>
    <text x="265" y="115" text-anchor="middle" font-size="15" font-weight="bold" fill="#1E3A5F">32 个 CVE 上的召回</text>

    <g font-size="12" fill="#3D4F65">
      <text x="125" y="156" text-anchor="end">CodeQL</text>
      <rect x="135" y="144" width="10" height="16" fill="#C9D6E2"/>
      <text x="153" y="157" fill="#1E3A5F">1</text>

      <text x="125" y="196" text-anchor="end">Semgrep</text>
      <rect x="135" y="184" width="80" height="16" fill="#C9D6E2"/>
      <text x="223" y="197" fill="#1E3A5F">8</text>

      <text x="125" y="236" text-anchor="end">Snyk Code</text>
      <rect x="135" y="224" width="100" height="16" fill="#C9D6E2"/>
      <text x="243" y="237" fill="#1E3A5F">10</text>

      <text x="125" y="276" text-anchor="end">MCPScan</text>
      <rect x="135" y="264" width="110" height="16" fill="#C9D6E2"/>
      <text x="253" y="277" fill="#1E3A5F">11</text>

      <text x="125" y="320" text-anchor="end" font-weight="bold" fill="#1E3A5F">MCP-BiFlow</text>
      <rect x="135" y="306" width="300" height="22" fill="url(#bar)"/>
      <text x="443" y="322" font-weight="bold" fill="#1E3A5F">30</text>
    </g>

    <rect x="60" y="350" width="410" height="46" rx="8" fill="#FFFFFF" stroke="#4B8BDA"/>
    <text x="265" y="370" text-anchor="middle" font-size="14" font-weight="bold" fill="#1E3A5F">93.8% vs 次优 34.4%</text>
    <text x="265" y="388" text-anchor="middle" font-size="11" fill="#3D4F65">通用分析器看不懂 MCP 的工具注册分发模式</text>
  </g>

  <!-- Arrow connecting to real-world -->
  <line x1="495" y1="250" x2="525" y2="250" stroke="#4B8BDA" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- Right: real world findings -->
  <g>
    <rect x="530" y="90" width="330" height="320" rx="10" fill="#FFF4E6" stroke="#F0C896"/>
    <text x="695" y="115" text-anchor="middle" font-size="15" font-weight="bold" fill="#1E3A5F">15,452 个真实仓库扫描</text>

    <rect x="555" y="140" width="280" height="40" rx="6" fill="#FFE3C2" stroke="#E8A861"/>
    <text x="695" y="165" text-anchor="middle" font-size="13" fill="#1E3A5F">549 候选簇 / 424 服务器</text>

    <line x1="695" y1="182" x2="695" y2="204" stroke="#4B8BDA" stroke-width="2" marker-end="url(#arrow)"/>

    <rect x="585" y="208" width="220" height="40" rx="6" fill="#F4B97A" stroke="#D88A3E"/>
    <text x="695" y="233" text-anchor="middle" font-size="13" font-weight="bold" fill="#1E3A5F">人工披露级确认</text>

    <line x1="695" y1="250" x2="695" y2="272" stroke="#4B8BDA" stroke-width="2" marker-end="url(#arrow)"/>

    <rect x="600" y="276" width="190" height="48" rx="6" fill="#D9534F" stroke="#A33A37"/>
    <text x="695" y="297" text-anchor="middle" font-size="14" font-weight="bold" fill="#FFFFFF">87 服务器</text>
    <text x="695" y="316" text-anchor="middle" font-size="14" font-weight="bold" fill="#FFFFFF">118 条漏洞路径</text>

    <text x="695" y="352" text-anchor="middle" font-size="12" fill="#1E3A5F" font-weight="bold">111 RCE · 5 SQL · 2 SSRF</text>
    <text x="695" y="372" text-anchor="middle" font-size="11" fill="#3D4F65">主要 sink：execAsync(60) / execSync(28)</text>
    <text x="695" y="390" text-anchor="middle" font-size="11" fill="#3D4F65">exec(9) / eval(5)</text>
  </g>

  <!-- Bottom case study -->
  <g>
    <rect x="40" y="440" width="820" height="150" rx="10" fill="#F5F0E8" stroke="#C9B89A"/>
    <text x="60" y="468" font-size="14" font-weight="bold" fill="#1E3A5F">真实案例 · bhouston/mcp-server-text-editor</text>

    <rect x="60" y="490" width="170" height="60" rx="6" fill="#FFFFFF" stroke="#4B8BDA"/>
    <text x="145" y="515" text-anchor="middle" font-size="12" fill="#1E3A5F" font-weight="bold">用户输入 path</text>
    <text x="145" y="535" text-anchor="middle" font-size="11" fill="#3D4F65">仅检查 isAbsolute</text>

    <line x1="232" y1="520" x2="282" y2="520" stroke="#4B8BDA" stroke-width="2" marker-end="url(#arrow)"/>

    <rect x="285" y="490" width="200" height="60" rx="6" fill="#FFFFFF" stroke="#4B8BDA"/>
    <text x="385" y="515" text-anchor="middle" font-size="12" fill="#1E3A5F" font-weight="bold">字符串拼接进命令</text>
    <text x="385" y="535" text-anchor="middle" font-size="11" fill="#3D4F65">shell 元字符未过滤</text>

    <line x1="487" y1="520" x2="537" y2="520" stroke="#4B8BDA" stroke-width="2" marker-end="url(#arrow)"/>

    <rect x="540" y="490" width="170" height="60" rx="6" fill="#FDECEA" stroke="#D9534F"/>
    <text x="625" y="515" text-anchor="middle" font-size="12" font-weight="bold" fill="#A33A37">execSync(...)</text>
    <text x="625" y="535" text-anchor="middle" font-size="11" fill="#A33A37">任意命令执行</text>

    <text x="725" y="515" font-size="13" fill="#1E3A5F" font-weight="bold">"只读编辑器"</text>
    <text x="725" y="535" font-size="13" fill="#D9534F" font-weight="bold">→ 变成 RCE</text>
  </g>
</svg>