<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 560" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4B8BDA"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="440" y="36" text-anchor="middle" font-size="20" font-weight="bold" fill="#1E3A5F">MCP 入口点恢复：把糊在一起的 handler 拆回每个工具</text>
  <text x="440" y="58" text-anchor="middle" font-size="13" fill="#3D4F65">没有 Flask 路由装饰器，需要自己把 ⟨tool, handler, branch⟩ 绑回去</text>

  <!-- LEFT: Naive view -->
  <g>
    <rect x="40" y="85" width="340" height="180" rx="10" fill="#FBEFEF" stroke="#C0504D" stroke-width="1.5"/>
    <text x="210" y="112" text-anchor="middle" font-size="15" font-weight="bold" fill="#8C2A26">✗ 通用分析器看到的</text>

    <rect x="70" y="130" width="280" height="115" rx="8" fill="#FFFFFF" stroke="#C0504D"/>
    <text x="210" y="158" text-anchor="middle" font-size="13" font-weight="bold" fill="#1E3A5F">setRequestHandler(...)</text>
    <text x="210" y="182" text-anchor="middle" font-size="12" fill="#3D4F65">所有工具共用一个入口</text>
    <text x="210" y="220" text-anchor="middle" font-size="12" fill="#C0504D">→ 污点跨工具乱串，误报爆炸</text>
  </g>

  <!-- RIGHT: BiFlow view -->
  <g>
    <rect x="500" y="85" width="340" height="180" rx="10" fill="#EFF6FF" stroke="#4B8BDA" stroke-width="1.5"/>
    <text x="670" y="112" text-anchor="middle" font-size="15" font-weight="bold" fill="#1E3A5F">✓ MCP-BiFlow 恢复后</text>

    <rect x="520" y="130" width="140" height="55" rx="6" fill="#FFFFFF" stroke="#4B8BDA"/>
    <text x="590" y="152" text-anchor="middle" font-size="12" font-weight="bold" fill="#1E3A5F">fetch-html</text>
    <text x="590" y="172" text-anchor="middle" font-size="11" fill="#3D4F65">→ Fetcher.html()</text>

    <rect x="680" y="130" width="140" height="55" rx="6" fill="#FFFFFF" stroke="#4B8BDA"/>
    <text x="750" y="152" text-anchor="middle" font-size="12" font-weight="bold" fill="#1E3A5F">fetch-json</text>
    <text x="750" y="172" text-anchor="middle" font-size="11" fill="#3D4F65">→ Fetcher.json()</text>

    <rect x="520" y="195" width="140" height="55" rx="6" fill="#FFFFFF" stroke="#4B8BDA"/>
    <text x="590" y="217" text-anchor="middle" font-size="12" font-weight="bold" fill="#1E3A5F">fetch-md</text>
    <text x="590" y="237" text-anchor="middle" font-size="11" fill="#3D4F65">→ Fetcher.md()</text>

    <rect x="680" y="195" width="140" height="55" rx="6" fill="#FFFFFF" stroke="#4B8BDA"/>
    <text x="750" y="217" text-anchor="middle" font-size="12" font-weight="bold" fill="#1E3A5F">fetch-txt</text>
    <text x="750" y="237" text-anchor="middle" font-size="11" fill="#3D4F65">→ Fetcher.txt()</text>
  </g>

  <!-- Arrow between -->
  <line x1="385" y1="175" x2="495" y2="175" stroke="#4B8BDA" stroke-width="2.5" marker-end="url(#ar)"/>
  <text x="440" y="166" text-anchor="middle" font-size="11" font-weight="bold" fill="#1E3A5F">三步恢复</text>

  <!-- Step 1 -->
  <g>
    <rect x="40" y="320" width="250" height="190" rx="10" fill="#EFF6FF" stroke="#4B8BDA" stroke-width="1.5"/>
    <circle cx="70" cy="350" r="16" fill="#4B8BDA"/>
    <text x="70" y="355" text-anchor="middle" font-size="15" font-weight="bold" fill="#FFFFFF">1</text>
    <text x="95" y="355" font-size="14" font-weight="bold" fill="#1E3A5F">Registration</text>
    <text x="60" y="385" font-size="12" fill="#3D4F65">识别工具是怎么注册的</text>
    <text x="60" y="415" font-size="11" fill="#1E3A5F">• @FastMCP 装饰器</text>
    <text x="60" y="435" font-size="11" fill="#1E3A5F">• registerTool(...)</text>
    <text x="60" y="455" font-size="11" fill="#1E3A5F">• tool 对象字面量</text>
    <text x="60" y="490" font-size="11" font-weight="bold" fill="#8C5A1E">共 10 种模式</text>
  </g>

  <!-- Step 2 -->
  <g>
    <rect x="315" y="320" width="250" height="190" rx="10" fill="#EFF6FF" stroke="#4B8BDA" stroke-width="1.5"/>
    <circle cx="345" cy="350" r="16" fill="#4B8BDA"/>
    <text x="345" y="355" text-anchor="middle" font-size="15" font-weight="bold" fill="#FFFFFF">2</text>
    <text x="370" y="355" font-size="14" font-weight="bold" fill="#1E3A5F">Dispatcher</text>
    <text x="335" y="385" font-size="12" fill="#3D4F65">还原 name 怎么走到 handler</text>
    <text x="335" y="415" font-size="11" fill="#1E3A5F">• if / switch 分支</text>
    <text x="335" y="435" font-size="11" fill="#1E3A5F">• 注册表 map 查表</text>
    <text x="335" y="455" font-size="11" fill="#1E3A5F">• getattr 反射调用</text>
    <text x="335" y="490" font-size="11" font-weight="bold" fill="#8C5A1E">共 16 种模式</text>
  </g>

  <!-- Step 3 -->
  <g>
    <rect x="590" y="320" width="250" height="190" rx="10" fill="#EFF6FF" stroke="#4B8BDA" stroke-width="1.5"/>
    <circle cx="620" cy="350" r="16" fill="#4B8BDA"/>
    <text x="620" y="355" text-anchor="middle" font-size="15" font-weight="bold" fill="#FFFFFF">3</text>
    <text x="645" y="355" font-size="14" font-weight="bold" fill="#1E3A5F">Specialization</text>
    <text x="610" y="385" font-size="12" fill="#3D4F65">绑定三元组，隔离工具</text>
    <text x="610" y="418" font-size="12" font-style="italic" fill="#1E3A5F">⟨tool, handler, branch⟩</text>
    <text x="610" y="450" font-size="11" fill="#3D4F65">每个工具一条专属入口</text>
    <text x="610" y="472" font-size="11" fill="#3D4F65">污点不再跨工具串扰</text>
  </g>

  <!-- connecting arrows between steps -->
  <line x1="290" y1="415" x2="313" y2="415" stroke="#4B8BDA" stroke-width="2" marker-end="url(#ar)"/>
  <line x1="565" y1="415" x2="588" y2="415" stroke="#4B8BDA" stroke-width="2" marker-end="url(#ar)"/>
</svg>