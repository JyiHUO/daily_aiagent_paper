<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4B8BDA"/>
    </marker>
    <marker id="arrO" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#E8A04A"/>
    </marker>
  </defs>

  <rect width="900" height="600" fill="#FAF7F2"/>

  <text x="450" y="42" text-anchor="middle" font-size="24" font-weight="bold" fill="#1E3A5F">三维下单 → Coding Agent 量产网站</text>
  <text x="450" y="68" text-anchor="middle" font-size="14" fill="#3D4F65">144 能力 × 1160 品类 × 961 风格 = 海量可交互训练站</text>

  <!-- Three seed dimensions -->
  <g>
    <rect x="50" y="115" width="220" height="80" rx="10" fill="#EFF6FF" stroke="#4B8BDA" stroke-width="2"/>
    <text x="160" y="140" text-anchor="middle" font-size="13" fill="#3D4F65">能力 (144)</text>
    <text x="160" y="165" text-anchor="middle" font-size="15" font-weight="bold" fill="#1E3A5F">表单填写</text>
    <text x="160" y="184" text-anchor="middle" font-size="12" fill="#3D4F65">下拉 / 日期 / 地图…</text>

    <rect x="50" y="215" width="220" height="80" rx="10" fill="#FFF4E6" stroke="#E8A04A" stroke-width="2"/>
    <text x="160" y="240" text-anchor="middle" font-size="13" fill="#3D4F65">品类 (1160)</text>
    <text x="160" y="265" text-anchor="middle" font-size="15" font-weight="bold" fill="#1E3A5F">越野摩托社区</text>
    <text x="160" y="284" text-anchor="middle" font-size="12" fill="#3D4F65">行业 / 主题</text>

    <rect x="50" y="315" width="220" height="80" rx="10" fill="#F3EEFB" stroke="#8C6FBC" stroke-width="2"/>
    <text x="160" y="340" text-anchor="middle" font-size="13" fill="#3D4F65">风格 (961)</text>
    <text x="160" y="365" text-anchor="middle" font-size="15" font-weight="bold" fill="#1E3A5F">Skeuomorphic</text>
    <text x="160" y="384" text-anchor="middle" font-size="12" fill="#3D4F65">视觉外观</text>
  </g>

  <!-- Arrows to coding agent -->
  <line x1="270" y1="155" x2="378" y2="232" stroke="#4B8BDA" stroke-width="2.5" marker-end="url(#arr)"/>
  <line x1="270" y1="255" x2="378" y2="262" stroke="#4B8BDA" stroke-width="2.5" marker-end="url(#arr)"/>
  <line x1="270" y1="355" x2="378" y2="295" stroke="#4B8BDA" stroke-width="2.5" marker-end="url(#arr)"/>

  <!-- Coding Agent -->
  <rect x="380" y="205" width="200" height="135" rx="12" fill="#1E3A5F" stroke="#1E3A5F"/>
  <text x="480" y="234" text-anchor="middle" font-size="17" font-weight="bold" fill="#FAF7F2">Claude Code</text>
  <text x="480" y="254" text-anchor="middle" font-size="13" fill="#CFE0F5">(Opus 4.5)</text>
  <text x="480" y="282" text-anchor="middle" font-size="12" fill="#FAF7F2">Z-Image 出图 · Playwright 自检</text>
  <text x="480" y="303" text-anchor="middle" font-size="12" fill="#FAF7F2">迭代直到功能与样式通过</text>

  <!-- Loop arrow: clear closed loop -->
  <path d="M 580 320 C 625 335 625 365 580 365 L 500 365" stroke="#E8A04A" stroke-width="2.5" fill="none" marker-end="url(#arrO)"/>
  <text x="612" y="348" font-size="11" fill="#B8731A">自我迭代</text>

  <!-- Output arrow -->
  <line x1="585" y1="265" x2="655" y2="265" stroke="#4B8BDA" stroke-width="3" marker-end="url(#arr)"/>

  <!-- Generated website mock -->
  <rect x="660" y="170" width="200" height="200" rx="10" fill="#FFFFFF" stroke="#4B8BDA" stroke-width="2"/>
  <rect x="660" y="170" width="200" height="26" rx="10" fill="#4B8BDA"/>
  <circle cx="673" cy="183" r="4" fill="#FAF7F2"/>
  <circle cx="687" cy="183" r="4" fill="#FAF7F2"/>
  <circle cx="701" cy="183" r="4" fill="#FAF7F2"/>
  <text x="760" y="220" text-anchor="middle" font-size="13" font-weight="bold" fill="#1E3A5F">My Profile</text>
  <rect x="678" y="232" width="164" height="18" rx="3" fill="#EFF6FF" stroke="#9DB8D6"/>
  <text x="684" y="245" font-size="10" fill="#3D4F65">rider #: 42</text>
  <rect x="678" y="258" width="164" height="18" rx="3" fill="#EFF6FF" stroke="#9DB8D6"/>
  <text x="684" y="271" font-size="10" fill="#3D4F65">team: Desert Racing</text>
  <rect x="678" y="288" width="60" height="22" rx="4" fill="#E8A04A"/>
  <text x="708" y="303" text-anchor="middle" font-size="11" font-weight="bold" fill="#FAF7F2">Save</text>
  <text x="760" y="338" text-anchor="middle" font-size="10" fill="#3D4F65">纯静态 HTML/JS</text>
  <text x="760" y="354" text-anchor="middle" font-size="10" fill="#3D4F65">localStorage 存状态</text>

  <!-- Output arrow to result -->
  <line x1="720" y1="372" x2="560" y2="448" stroke="#4B8BDA" stroke-width="2" marker-end="url(#arr)"/>

  <!-- Bottom result -->
  <rect x="180" y="450" width="540" height="110" rx="12" fill="#EFF6FF" stroke="#4B8BDA" stroke-width="2"/>
  <text x="450" y="482" text-anchor="middle" font-size="16" font-weight="bold" fill="#1E3A5F">输出：可交互训练环境</text>
  <g font-size="13" fill="#3D4F65">
    <text x="280" y="515" text-anchor="middle">2560 个网站</text>
    <text x="450" y="515" text-anchor="middle">44227 个任务</text>
    <text x="620" y="515" text-anchor="middle">每站 ≥10 任务</text>
    <text x="450" y="542" text-anchor="middle" fill="#1E3A5F">每个任务配 5 条 LLM judge 评分标准</text>
  </g>
</svg>