<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 540" font-family="'Helvetica Neue',Arial,sans-serif">
  <defs>
    <marker id="af" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4B8BDA"/>
    </marker>
    <marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#E8924A"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="440" y="36" text-anchor="middle" font-size="20" font-weight="700" fill="#1E3A5F">双向跨过程污点分析：两端对穿，路径才算数</text>
  <text x="440" y="58" text-anchor="middle" font-size="13" fill="#3D4F65">前向 R_f(S) ∩ 后向 R_b(K)  →  真实可达路径</text>

  <!-- Forward label -->
  <text x="120" y="92" text-anchor="middle" font-size="12" font-weight="700" fill="#4B8BDA">▶ Forward R_f(S) 从源向前推</text>

  <!-- Source -->
  <rect x="40" y="105" width="160" height="70" rx="10" fill="#EFF6FF" stroke="#4B8BDA" stroke-width="2"/>
  <text x="120" y="133" text-anchor="middle" font-size="14" font-weight="700" fill="#1E3A5F">Source</text>
  <text x="120" y="155" text-anchor="middle" font-size="12" fill="#3D4F65">request.params</text>

  <!-- Sink -->
  <rect x="680" y="105" width="160" height="70" rx="10" fill="#FFF1E6" stroke="#E8924A" stroke-width="2"/>
  <text x="760" y="133" text-anchor="middle" font-size="14" font-weight="700" fill="#1E3A5F">Sink</text>
  <text x="760" y="155" text-anchor="middle" font-size="12" fill="#3D4F65">fetch(url, headers)</text>

  <!-- Middle helpers -->
  <rect x="240" y="110" width="120" height="60" rx="8" fill="#F4F7FB" stroke="#9DB4CC" stroke-width="1.5"/>
  <text x="300" y="145" text-anchor="middle" font-size="12" fill="#1E3A5F">validatedArgs</text>

  <rect x="380" y="110" width="120" height="60" rx="8" fill="#F4F7FB" stroke="#9DB4CC" stroke-width="1.5"/>
  <text x="440" y="145" text-anchor="middle" font-size="12" fill="#1E3A5F">Fetcher.html</text>

  <rect x="520" y="110" width="120" height="60" rx="8" fill="#F4F7FB" stroke="#9DB4CC" stroke-width="1.5"/>
  <text x="580" y="145" text-anchor="middle" font-size="12" fill="#1E3A5F">_fetch()</text>

  <!-- Forward arrows (top edge) -->
  <path d="M200 128 L240 128" stroke="#4B8BDA" stroke-width="2.5" fill="none" marker-end="url(#af)"/>
  <path d="M360 128 L380 128" stroke="#4B8BDA" stroke-width="2.5" fill="none" marker-end="url(#af)"/>
  <path d="M500 128 L520 128" stroke="#4B8BDA" stroke-width="2.5" fill="none" marker-end="url(#af)"/>
  <path d="M640 128 L680 128" stroke="#4B8BDA" stroke-width="2.5" fill="none" marker-end="url(#af)"/>

  <!-- Backward arrows (bottom edge) -->
  <path d="M680 152 L640 152" stroke="#E8924A" stroke-width="2.5" fill="none" marker-end="url(#ab)"/>
  <path d="M520 152 L500 152" stroke="#E8924A" stroke-width="2.5" fill="none" marker-end="url(#ab)"/>
  <path d="M380 152 L360 152" stroke="#E8924A" stroke-width="2.5" fill="none" marker-end="url(#ab)"/>
  <path d="M240 152 L200 152" stroke="#E8924A" stroke-width="2.5" fill="none" marker-end="url(#ab)"/>

  <!-- Backward label -->
  <text x="760" y="195" text-anchor="middle" font-size="12" font-weight="700" fill="#E8924A">◀ Backward R_b(K) 从汇回溯</text>

  <!-- Intersection band -->
  <rect x="240" y="225" width="400" height="60" rx="8" fill="#E6F0FB" stroke="#4B8BDA" stroke-width="2" stroke-dasharray="5 3"/>
  <text x="440" y="250" text-anchor="middle" font-size="13" font-weight="700" fill="#1E3A5F">交集 I = R_f(S) ∩ R_b(K)</text>
  <text x="440" y="270" text-anchor="middle" font-size="12" fill="#3D4F65">双向都连得通才作为候选路径</text>

  <!-- Connect intersection to refinement -->
  <path d="M440 285 L440 328" stroke="#4B8BDA" stroke-width="2.5" fill="none" marker-end="url(#af)"/>

  <!-- Path Refinement -->
  <rect x="60" y="335" width="760" height="170" rx="12" fill="#F8F4EE" stroke="#B89171" stroke-width="2"/>
  <text x="440" y="362" text-anchor="middle" font-size="15" font-weight="700" fill="#1E3A5F">Path Refinement：用 guard 剪掉已防御的路径</text>

  <!-- Effective guards (kill) -->
  <rect x="85" y="380" width="340" height="105" rx="8" fill="#EAF5EC" stroke="#5BA672" stroke-width="1.8"/>
  <text x="255" y="403" text-anchor="middle" font-size="13" font-weight="700" fill="#2F6B45">✓ 有效 guard → 剪除</text>
  <text x="255" y="427" text-anchor="middle" font-size="12" fill="#3D4F65">allowlist ／ 参数化查询</text>
  <text x="255" y="448" text-anchor="middle" font-size="12" fill="#3D4F65">路径规范化 + 根目录检查</text>

  <!-- Weak guards (keep / LLM) -->
  <rect x="455" y="380" width="340" height="105" rx="8" fill="#FBE9E7" stroke="#B33A3A" stroke-width="1.8"/>
  <text x="625" y="403" text-anchor="middle" font-size="13" font-weight="700" fill="#B33A3A">✗ 模糊 guard → 保留为漏洞</text>
  <text x="625" y="427" text-anchor="middle" font-size="12" fill="#3D4F65">private-IP 检查 ≠ 真隔离，交 LLM 仲裁</text>
  <text x="625" y="465" text-anchor="middle" font-size="12" font-style="italic" fill="#B33A3A">→ 报告 fetch-mcp SSRF</text>
</svg>