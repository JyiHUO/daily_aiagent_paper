<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 760" font-family="'Helvetica Neue', 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F7FAFC"/>
      <stop offset="1" stop-color="#EAF1FA"/>
    </linearGradient>
    <linearGradient id="cacheG" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#E8F1FF"/>
      <stop offset="1" stop-color="#CFE0F7"/>
    </linearGradient>
    <linearGradient id="synthG" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFF2E5"/>
      <stop offset="1" stop-color="#FFD9B8"/>
    </linearGradient>
    <linearGradient id="rlG" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#E6F4EC"/>
      <stop offset="1" stop-color="#BFE2CD"/>
    </linearGradient>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4B8BDA"/>
    </marker>
    <marker id="arrO" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#E0883A"/>
    </marker>
    <marker id="arrLoop" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#7A6BD9"/>
    </marker>
  </defs>

  <rect width="1280" height="760" fill="url(#bg)"/>

  <!-- Title -->
  <text x="640" y="50" text-anchor="middle" font-size="26" font-weight="700" fill="#1E3A5F">Weblica：把整个网页世界量产成可复现的 RL 训练场</text>
  <text x="640" y="78" text-anchor="middle" font-size="14" fill="#3D4F65">两路造环境 · 本地高吞吐回放 · 8B 模型在多项 Web 导航 benchmark 超越同尺寸开源基线</text>

  <!-- LEFT: Source A -->
  <g>
    <rect x="60" y="120" width="380" height="230" rx="14" fill="url(#cacheG)" stroke="#4B8BDA" stroke-width="1.5"/>
    <text x="80" y="150" font-size="16" font-weight="700" fill="#1E3A5F">① Weblica-Cache · 真实网站冻结快照</text>

    <g transform="translate(80,170)">
      <rect x="0" y="0" width="120" height="62" rx="6" fill="#FFFFFF" stroke="#4B8BDA"/>
      <text x="60" y="22" text-anchor="middle" font-size="11" fill="#1E3A5F" font-weight="600">Playwright 录制</text>
      <text x="60" y="40" text-anchor="middle" font-size="10" fill="#3D4F65">HTTP req / resp</text>
      <text x="60" y="54" text-anchor="middle" font-size="10" fill="#3D4F65">原始浏览轨迹</text>

      <path d="M125,31 L165,31" stroke="#4B8BDA" stroke-width="1.6" marker-end="url(#arr)"/>

      <rect x="170" y="0" width="160" height="62" rx="6" fill="#FFFFFF" stroke="#4B8BDA"/>
      <text x="250" y="20" text-anchor="middle" font-size="11" font-weight="600" fill="#1E3A5F">URL 归一化</text>
      <text x="250" y="36" text-anchor="middle" font-size="10" fill="#C0392B">剥离 ?t=…&amp;sess=…</text>
      <text x="250" y="50" text-anchor="middle" font-size="10" fill="#27632A">保留 ?q=cats</text>
    </g>

    <g transform="translate(80,250)">
      <rect x="0" y="0" width="320" height="80" rx="8" fill="#FFFFFF" stroke="#4B8BDA"/>
      <text x="160" y="24" text-anchor="middle" font-size="12" font-weight="700" fill="#1E3A5F">断网回放 · 完全确定性</text>
      <text x="160" y="44" text-anchor="middle" font-size="10.5" fill="#3D4F65">只保留断网下仍可完成任务的会话</text>
      <text x="160" y="64" text-anchor="middle" font-size="11" fill="#1E3A5F" font-weight="700">→ 15.6K 真实站点环境</text>
    </g>
  </g>

  <!-- LEFT: Source B -->
  <g>
    <rect x="60" y="370" width="380" height="240" rx="14" fill="url(#synthG)" stroke="#E0883A" stroke-width="1.5"/>
    <text x="80" y="400" font-size="16" font-weight="700" fill="#1E3A5F">② Weblica-Synth · Claude Code 量产网站</text>

    <g transform="translate(80,420)">
      <rect x="0" y="0" width="100" height="36" rx="6" fill="#FFFFFF" stroke="#E0883A"/>
      <text x="50" y="16" text-anchor="middle" font-size="10" font-weight="600" fill="#1E3A5F">144 能力组</text>
      <text x="50" y="29" text-anchor="middle" font-size="9.5" fill="#3D4F65">表单/下拉/地图…</text>

      <rect x="110" y="0" width="100" height="36" rx="6" fill="#FFFFFF" stroke="#E0883A"/>
      <text x="160" y="16" text-anchor="middle" font-size="10" font-weight="600" fill="#1E3A5F">1160 行业</text>
      <text x="160" y="29" text-anchor="middle" font-size="9.5" fill="#3D4F65">电商/社区/旅行…</text>

      <rect x="220" y="0" width="100" height="36" rx="6" fill="#FFFFFF" stroke="#E0883A"/>
      <text x="270" y="16" text-anchor="middle" font-size="10" font-weight="600" fill="#1E3A5F">961 视觉风格</text>
      <text x="270" y="29" text-anchor="middle" font-size="9.5" fill="#3D4F65">扁平/拟物/暗色…</text>

      <text x="160" y="58" text-anchor="middle" font-size="11" fill="#1E3A5F" font-weight="700">三维叉乘 → 种子提示</text>
    </g>

    <g transform="translate(80,495)">
      <rect x="0" y="0" width="320" height="100" rx="8" fill="#FFFFFF" stroke="#E0883A"/>
      <text x="160" y="24" text-anchor="middle" font-size="12" font-weight="700" fill="#1E3A5F">Claude Code (Opus 4.5) 自检迭代</text>
      <text x="160" y="44" text-anchor="middle" font-size="10.5" fill="#3D4F65">静态 HTML/JS/CSS · localStorage 存状态</text>
      <text x="160" y="62" text-anchor="middle" font-size="10.5" fill="#3D4F65">Z-Image 出图 · Playwright 截图打分</text>
      <text x="160" y="84" text-anchor="middle" font-size="11" fill="#1E3A5F" font-weight="700">→ 2560 站点 · 44K 任务</text>
    </g>
  </g>

  <!-- CENTER: local farm -->
  <g>
    <rect x="490" y="200" width="290" height="380" rx="16" fill="#FFFFFF" stroke="#1E3A5F" stroke-width="1.8"/>
    <text x="635" y="232" text-anchor="middle" font-size="16" font-weight="700" fill="#1E3A5F">本地高吞吐环境农场</text>
    <text x="635" y="252" text-anchor="middle" font-size="11" fill="#3D4F65">数千环境 · 全部本地 serve</text>

    <g font-size="9" fill="#1E3A5F">
      <g transform="translate(510,275)">
        <rect width="78" height="56" rx="4" fill="#EFF6FF" stroke="#4B8BDA"/>
        <rect width="78" height="10" fill="#4B8BDA"/>
        <text x="39" y="32" text-anchor="middle">cached.com</text>
        <text x="39" y="46" text-anchor="middle" fill="#3D4F65">真实站</text>
      </g>
      <g transform="translate(596,275)">
        <rect width="78" height="56" rx="4" fill="#FFF2E5" stroke="#E0883A"/>
        <rect width="78" height="10" fill="#E0883A"/>
        <text x="39" y="32" text-anchor="middle">synth-001</text>
        <text x="39" y="46" text-anchor="middle" fill="#3D4F65">合成站</text>
      </g>
      <g transform="translate(682,275)">
        <rect width="78" height="56" rx="4" fill="#EFF6FF" stroke="#4B8BDA"/>
        <rect width="78" height="10" fill="#4B8BDA"/>
        <text x="39" y="32" text-anchor="middle">cached.shop</text>
        <text x="39" y="46" text-anchor="middle" fill="#3D4F65">真实站</text>
      </g>
      <g transform="translate(510,338)">
        <rect width="78" height="56" rx="4" fill="#FFF2E5" stroke="#E0883A"/>
        <rect width="78" height="10" fill="#E0883A"/>
        <text x="39" y="32" text-anchor="middle">synth-731</text>
        <text x="39" y="46" text-anchor="middle" fill="#3D4F65">合成站</text>
      </g>
      <g transform="translate(596,338)">
        <rect width="78" height="56" rx="4" fill="#EFF6FF" stroke="#4B8BDA"/>
        <rect width="78" height="10" fill="#4B8BDA"/>
        <text x="39" y="32" text-anchor="middle">cached.org</text>
        <text x="39" y="46" text-anchor="middle" fill="#3D4F65">真实站</text>
      </g>
      <g transform="translate(682,338)">
        <rect width="78" height="56" rx="4" fill="#FFF2E5" stroke="#E0883A"/>
        <rect width="78" height="10" fill="#E0883A"/>
        <text x="39" y="32" text-anchor="middle">synth-2k</text>
        <text x="39" y="46" text-anchor="middle" fill="#3D4F65">合成站</text>
      </g>
    </g>

    <g transform="translate(510,420)">
      <rect width="250" height="60" rx="8" fill="#FEF6E0" stroke="#D9A441"/>
      <text x="125" y="24" text-anchor="middle" font-size="11" font-weight="700" fill="#1E3A5F">关掉动画 · 跳过网络往返</text>
      <text x="125" y="44" text-anchor="middle" font-size="11" fill="#1E3A5F">每步截图 <tspan fill="#C0392B" font-weight="700">1.5s → 50–150ms</tspan></text>
    </g>

    <g transform="translate(510,495)">
      <rect width="250" height="68" rx="8" fill="#EAF1FA" stroke="#4B8BDA"/>
      <text x="125" y="22" text-anchor="middle" font-size="11" font-weight="700" fill="#1E3A5F">观测：截图 + URL</text>
      <text x="125" y="40" text-anchor="middle" font-size="10.5" fill="#3D4F65">动作：像素坐标点击 / 输入</text>
      <text x="125" y="56" text-anchor="middle" font-size="10.5" fill="#3D4F65">底座：Qwen3-VL-Instruct</text>
    </g>
  </g>

  <!-- RIGHT: RL training &amp; result -->
  <g>
    <rect x="830" y="200" width="390" height="380" rx="16" fill="url(#rlG)" stroke="#2F8A5A" stroke-width="1.6"/>
    <text x="1025" y="232" text-anchor="middle" font-size="16" font-weight="700" fill="#1E3A5F">大规模 RL 训练 → Weblica-8B</text>

    <g transform="translate(852,255)">
      <text x="0" y="14" font-size="11" font-weight="700" fill="#1E3A5F">并行 rollout · 数千环境</text>
      <g stroke="#2F8A5A" stroke-width="1.4" fill="none">
        <path d="M0,28 L200,30"/>
        <path d="M0,46 L200,52"/>
        <path d="M0,64 L200,68"/>
        <path d="M0,82 L200,86"/>
      </g>
      <g fill="#2F8A5A">
        <circle cx="0" cy="28" r="3"/><circle cx="0" cy="46" r="3"/>
        <circle cx="0" cy="64" r="3"/><circle cx="0" cy="82" r="3"/>
        <circle cx="200" cy="30" r="3"/><circle cx="200" cy="52" r="3"/>
        <circle cx="200" cy="68" r="3"/><circle cx="200" cy="86" r="3"/>
      </g>
      <text x="220" y="60" font-size="10" fill="#3D4F65">奖励 → 策略</text>
    </g>

    <g transform="translate(852,370)">
      <rect width="346" height="190" rx="10" fill="#FFFFFF" stroke="#2F8A5A"/>
      <text x="173" y="22" text-anchor="middle" font-size="12" font-weight="700" fill="#1E3A5F">Online-Mind2Web · pass@1 (30 步)</text>

      <rect x="100" y="60" width="160" height="22" fill="#B8C9D9"/>
      <text x="95" y="76" text-anchor="end" font-size="10" fill="#1E3A5F">Qwen3-VL-8B</text>
      <text x="268" y="76" font-size="11" font-weight="700" fill="#1E3A5F">28.6%</text>

      <rect x="100" y="98" width="219" height="22" fill="#2F8A5A"/>
      <text x="95" y="114" text-anchor="end" font-size="10" font-weight="700" fill="#1E3A5F">Weblica-8B</text>
      <text x="327" y="114" font-size="11" font-weight="700" fill="#27632A">39.2%</text>

      <text x="173" y="148" text-anchor="middle" font-size="10.5" fill="#3D4F65">更少推理步数 · test-time k=1→8 持续上涨</text>
      <text x="173" y="166" text-anchor="middle" font-size="10.5" fill="#3D4F65">与 API 模型可比 · 全程开源权重</text>
    </g>
  </g>

  <!-- ARROWS -->
  <path d="M440,260 L490,300" stroke="#4B8BDA" stroke-width="2" fill="none" marker-end="url(#arr)"/>
  <path d="M440,490 L490,440" stroke="#E0883A" stroke-width="2" fill="none" marker-end="url(#arrO)"/>

  <path d="M780,390 L830,390" stroke="#4B8BDA" stroke-width="2.5" fill="none" marker-end="url(#arr)"/>
  <text x="805" y="382" text-anchor="middle" font-size="10" fill="#1E3A5F" font-weight="600">高吞吐</text>

  <!-- feedback loop -->
  <path d="M1025,580 L1025,650 L250,650 L250,610" stroke="#7A6BD9" stroke-width="2" fill="none" stroke-dasharray="6 4" marker-end="url(#arrLoop)"/>
  <text x="640" y="673" text-anchor="middle" font-size="11" fill="#5A4FB7" font-weight="600">策略变强 → 更深探索 → 录制 / 合成出更多有效环境（经验复用闭环）</text>

  <text x="640" y="730" text-anchor="middle" font-size="12" fill="#1E3A5F" font-style="italic">把“网页太杂太不稳”这件事，变成“环境可以像数据一样被流水线生产”。</text>
</svg>