<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 800" font-family="-apple-system,Segoe UI,PingFang SC,sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F7FAFD"/>
      <stop offset="1" stop-color="#EAF1F8"/>
    </linearGradient>
    <linearGradient id="oldHarness" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFF1E6"/>
      <stop offset="1" stop-color="#FCE0CC"/>
    </linearGradient>
    <linearGradient id="newHarness" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#E6F0FB"/>
      <stop offset="1" stop-color="#CFE3F7"/>
    </linearGradient>
    <linearGradient id="model" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FDFCEC"/>
      <stop offset="1" stop-color="#F7E9B8"/>
    </linearGradient>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4B8BDA"/>
    </marker>
    <marker id="arrOrange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#D97A3D"/>
    </marker>
  </defs>

  <rect width="1280" height="800" fill="url(#bg)"/>

  <!-- Title -->
  <text x="640" y="52" text-anchor="middle" font-size="28" font-weight="700" fill="#1E3A5F">补全即编排：让 LM 自己写 Agent 主循环</text>
  <text x="640" y="80" text-anchor="middle" font-size="15" fill="#3D4F65">Self-Programmed Execution · Spell · 模型补全本身就是 orchestrator</text>

  <!-- LEFT: Traditional Agent -->
  <g>
    <text x="265" y="125" text-anchor="middle" font-size="16" font-weight="700" fill="#8A4A1F">传统 Agent：固定 harness 编排</text>

    <rect x="80" y="145" width="370" height="540" rx="14" fill="url(#oldHarness)" stroke="#D97A3D" stroke-width="1.5"/>
    <text x="100" y="170" font-size="13" font-weight="700" fill="#8A4A1F">Harness（人工调优的 while 循环）</text>

    <!-- harness loop box -->
    <rect x="105" y="190" width="320" height="160" rx="10" fill="#FFFFFF" stroke="#E0A87C" stroke-dasharray="5 4"/>
    <text x="120" y="215" font-size="13" fill="#3D4F65" font-family="monospace">while not done:</text>
    <text x="140" y="240" font-size="13" fill="#3D4F65" font-family="monospace">ctx  = trim(history)</text>
    <text x="140" y="262" font-size="13" fill="#3D4F65" font-family="monospace">resp = LM(ctx)</text>
    <text x="140" y="284" font-size="13" fill="#3D4F65" font-family="monospace">tool = parse(resp)</text>
    <text x="140" y="306" font-size="13" fill="#3D4F65" font-family="monospace">obs  = run(tool)</text>
    <text x="140" y="328" font-size="13" fill="#3D4F65" font-family="monospace">history.append(obs)</text>

    <!-- LM bubble inside -->
    <rect x="150" y="400" width="230" height="90" rx="45" fill="url(#model)" stroke="#C9A03B"/>
    <text x="265" y="430" text-anchor="middle" font-size="14" font-weight="700" fill="#5A4410">LM</text>
    <text x="265" y="452" text-anchor="middle" font-size="11" fill="#5A4410">只回答"下一步动作"</text>
    <text x="265" y="470" text-anchor="middle" font-size="11" fill="#5A4410">控制权不在模型手里</text>

    <!-- caged loop arrows: harness -> LM -> harness -->
    <path d="M 265 350 L 265 395" stroke="#D97A3D" stroke-width="1.8" fill="none" marker-end="url(#arrOrange)"/>
    <path d="M 395 445 C 430 445 430 270 395 270" fill="none" stroke="#D97A3D" stroke-width="1.8" marker-end="url(#arrOrange)"/>

    <text x="265" y="555" text-anchor="middle" font-size="12" fill="#8A4A1F" font-style="italic">编排策略 = harness 代码</text>
    <text x="265" y="578" text-anchor="middle" font-size="12" fill="#8A4A1F" font-style="italic">上下文 / 重试 / 工具串联全靠人写</text>
    <text x="265" y="630" text-anchor="middle" font-size="13" fill="#8A4A1F">ReAct · Codex CLI · Claude Code</text>
  </g>

  <!-- Center arrow -->
  <g>
    <path d="M 470 415 L 545 415" stroke="#4B8BDA" stroke-width="3" marker-end="url(#arr)" fill="none"/>
    <text x="507" y="400" text-anchor="middle" font-size="13" font-weight="700" fill="#1E3A5F">SPE</text>
    <text x="507" y="438" text-anchor="middle" font-size="11" fill="#3D4F65">权力反转</text>
  </g>

  <!-- RIGHT: SPE -->
  <g>
    <text x="900" y="125" text-anchor="middle" font-size="16" font-weight="700" fill="#1E5A9C">SPE：补全即程序，harness 退化为 eval</text>

    <rect x="565" y="145" width="650" height="540" rx="14" fill="url(#newHarness)" stroke="#4B8BDA" stroke-width="1.5"/>

    <!-- Tiny harness -->
    <rect x="600" y="170" width="200" height="56" rx="8" fill="#FFFFFF" stroke="#9BBEE3"/>
    <text x="700" y="192" text-anchor="middle" font-size="13" font-weight="700" fill="#1E3A5F">Harness（极简）</text>
    <text x="700" y="212" text-anchor="middle" font-size="12" fill="#3D4F65">eval(completion) — 仅此而已</text>

    <!-- Spell program -->
    <rect x="600" y="252" width="560" height="210" rx="10" fill="#FFFFFF" stroke="#4B8BDA"/>
    <text x="615" y="276" font-size="13" font-weight="700" fill="#1E3A5F">Spell 程序：模型补全本身</text>

    <text x="625" y="304" font-size="13" fill="#1E3A5F" font-family="monospace">(quine completion</text>
    <text x="650" y="324" font-size="13" fill="#3D4F65" font-family="monospace">; 读自身 / 编辑 / 追加新代码</text>
    <text x="650" y="344" font-size="13" fill="#1E3A5F" font-family="monospace">(eval (do</text>
    <text x="675" y="365" font-size="13" fill="#D97A3D" font-family="monospace">'(read-file ...)        ; 工具调用</text>
    <text x="675" y="385" font-size="13" fill="#D97A3D" font-family="monospace">'(!peek grep ...)       ; 结果不入下轮</text>
    <text x="675" y="405" font-size="13" fill="#1E5A9C" font-family="monospace">'(self-call new-prefix) ; 起下一轮</text>
    <text x="650" y="425" font-size="13" fill="#3D4F65" font-family="monospace">)))</text>
    <text x="615" y="450" font-size="11" fill="#3D4F65" font-style="italic">尾表达式带引号 → 重放不会重复副作用</text>

    <!-- Self loop arrow: from spell back to harness eval -->
    <path d="M 1160 360 C 1230 360 1230 198 820 198" fill="none" stroke="#4B8BDA" stroke-width="2" marker-end="url(#arr)"/>
    <text x="1175" y="290" font-size="12" fill="#1E5A9C">self-call</text>
    <text x="1175" y="306" font-size="12" fill="#1E5A9C">回到 eval</text>

    <!-- Three benefits -->
    <g transform="translate(600,500)">
      <rect x="0" y="0" width="180" height="76" rx="8" fill="#EFF6FF" stroke="#7BA9D6"/>
      <text x="90" y="22" text-anchor="middle" font-size="13" font-weight="700" fill="#1E3A5F">上下文自管理</text>
      <text x="90" y="44" text-anchor="middle" font-size="11" fill="#3D4F65">!peek 丢弃临时结果</text>
      <text x="90" y="62" text-anchor="middle" font-size="11" fill="#1E5A9C">token 减少约 4×</text>
    </g>
    <g transform="translate(792,500)">
      <rect x="0" y="0" width="180" height="76" rx="8" fill="#EFF6FF" stroke="#7BA9D6"/>
      <text x="90" y="22" text-anchor="middle" font-size="13" font-weight="700" fill="#1E3A5F">工具批处理</text>
      <text x="90" y="44" text-anchor="middle" font-size="11" fill="#3D4F65">一次写好多步串联</text>
      <text x="90" y="62" text-anchor="middle" font-size="11" fill="#1E5A9C">按结果分支</text>
    </g>
    <g transform="translate(984,500)">
      <rect x="0" y="0" width="180" height="76" rx="8" fill="#EFF6FF" stroke="#7BA9D6"/>
      <text x="90" y="22" text-anchor="middle" font-size="13" font-weight="700" fill="#1E3A5F">零训练上手</text>
      <text x="90" y="44" text-anchor="middle" font-size="11" fill="#3D4F65">前沿模型仅靠 prompt</text>
      <text x="90" y="62" text-anchor="middle" font-size="11" fill="#1E5A9C">学会 Spell 这门 Lisp</text>
    </g>

    <!-- Bottom result -->
    <rect x="600" y="600" width="580" height="68" rx="8" fill="#FFFFFF" stroke="#4B8BDA" stroke-dasharray="4 3"/>
    <text x="890" y="624" text-anchor="middle" font-size="13" font-weight="700" fill="#1E3A5F">SWE-bench Lite 171 vs Codex 172（token ÷ 4）</text>
    <text x="890" y="648" text-anchor="middle" font-size="12" fill="#3D4F65">Terminal-Bench 40/80 接近 Codex 43/80，成本约一半</text>
  </g>

  <!-- Bottom caption -->
  <text x="640" y="725" text-anchor="middle" font-size="14" font-weight="700" fill="#1E3A5F">把 agent loop 从框架代码搬进模型补全：编排策略由 LM 自己生成</text>
  <text x="640" y="748" text-anchor="middle" font-size="12" fill="#3D4F65">Spell 用 quine + 引号尾表达式解决"上下文即代码、重放却不重放副作用"</text>
  <text x="640" y="770" text-anchor="middle" font-size="11" fill="#6E7A8A" font-style="italic">提问：若专门训练 SPE，模型会涌现出怎样的自编排策略？</text>
</svg>