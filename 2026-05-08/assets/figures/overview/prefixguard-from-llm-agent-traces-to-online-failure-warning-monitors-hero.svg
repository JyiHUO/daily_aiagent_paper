<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 780" font-family="'PingFang SC','Microsoft YaHei',sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F7FAFF"/>
      <stop offset="1" stop-color="#EEF2F9"/>
    </linearGradient>
    <linearGradient id="gOffline" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFF4E6"/>
      <stop offset="1" stop-color="#FFE4CC"/>
    </linearGradient>
    <linearGradient id="gOnline" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#E8F1FC"/>
      <stop offset="1" stop-color="#D6E6F8"/>
    </linearGradient>
    <linearGradient id="gRisk" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7EC896"/>
      <stop offset="0.55" stop-color="#F2C94C"/>
      <stop offset="1" stop-color="#E56B6F"/>
    </linearGradient>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4B8BDA"/>
    </marker>
    <marker id="arrO" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#E89A4C"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#E56B6F"/>
    </marker>
  </defs>

  <rect width="1200" height="780" fill="url(#bg)"/>

  <!-- Title -->
  <text x="600" y="48" text-anchor="middle" font-size="26" font-weight="700" fill="#1E3A5F">PrefixGuard：把 Agent 轨迹合成为在线失败预警监控器</text>
  <text x="600" y="74" text-anchor="middle" font-size="14" fill="#3D4F65">离线归纳出结构化解析器 + 学习事件字母表与前缀风险分，替代昂贵的 LLM-as-judge</text>

  <!-- ============ OFFLINE PANEL ============ -->
  <rect x="40" y="105" width="410" height="500" rx="16" fill="url(#gOffline)" stroke="#E89A4C" stroke-width="1.5"/>
  <text x="60" y="135" font-size="16" font-weight="700" fill="#8A4B10">离线：StepView 归纳（只跑一次 LLM）</text>

  <!-- Raw traces -->
  <rect x="65" y="155" width="360" height="95" rx="10" fill="#FFFFFF" stroke="#E89A4C"/>
  <text x="80" y="178" font-size="13" font-weight="700" fill="#8A4B10">异构原始 trace 样例</text>
  <text x="80" y="199" font-size="11" fill="#3D4F65">WebArena (DOM) · τ²-Bench (工具 JSON)</text>
  <text x="80" y="218" font-size="11" fill="#3D4F65">SkillsBench (多步技能) · TerminalBench (shell)</text>
  <text x="80" y="240" font-size="11" fill="#8A4B10" font-style="italic">字段 schema 异构，难以直接监控</text>

  <path d="M245,250 L245,272" stroke="#E89A4C" stroke-width="2" marker-end="url(#arrO)"/>

  <!-- LLM induction -->
  <rect x="120" y="275" width="250" height="46" rx="23" fill="#FFD7A8" stroke="#E89A4C"/>
  <text x="245" y="296" text-anchor="middle" font-size="13" font-weight="700" fill="#8A4B10">LLM 一次性归纳</text>
  <text x="245" y="313" text-anchor="middle" font-size="11" fill="#8A4B10">生成字段抽取适配器后 freeze</text>

  <path d="M245,321 L245,342" stroke="#E89A4C" stroke-width="2" marker-end="url(#arrO)"/>

  <!-- StepView schema -->
  <rect x="65" y="345" width="360" height="128" rx="10" fill="#FFFFFF" stroke="#E89A4C"/>
  <text x="245" y="368" text-anchor="middle" font-size="13" font-weight="700" fill="#8A4B10">StepView 7 字段确定性 schema</text>
  <g font-size="11" fill="#1E3A5F">
    <rect x="80" y="380" width="155" height="24" rx="4" fill="#FFF4E6" stroke="#E89A4C" stroke-opacity=".5"/>
    <text x="158" y="397" text-anchor="middle">metadata</text>
    <rect x="245" y="380" width="165" height="24" rx="4" fill="#FFF4E6" stroke="#E89A4C" stroke-opacity=".5"/>
    <text x="328" y="397" text-anchor="middle">observation</text>
    <rect x="80" y="410" width="100" height="24" rx="4" fill="#FFF4E6" stroke="#E89A4C" stroke-opacity=".5"/>
    <text x="130" y="427" text-anchor="middle">action</text>
    <rect x="190" y="410" width="100" height="24" rx="4" fill="#FFF4E6" stroke="#E89A4C" stroke-opacity=".5"/>
    <text x="240" y="427" text-anchor="middle">tool</text>
    <rect x="300" y="410" width="110" height="24" rx="4" fill="#FFF4E6" stroke="#E89A4C" stroke-opacity=".5"/>
    <text x="355" y="427" text-anchor="middle">args</text>
    <rect x="80" y="440" width="155" height="24" rx="4" fill="#FFF4E6" stroke="#E89A4C" stroke-opacity=".5"/>
    <text x="158" y="457" text-anchor="middle">result</text>
    <rect x="245" y="440" width="165" height="24" rx="4" fill="#FFF4E6" stroke="#E89A4C" stroke-opacity=".5"/>
    <text x="328" y="457" text-anchor="middle">status</text>
  </g>

  <!-- Training label -->
  <rect x="65" y="488" width="360" height="105" rx="10" fill="#FFFFFF" stroke="#E89A4C"/>
  <text x="80" y="510" font-size="13" font-weight="700" fill="#8A4B10">监督信号：终局结果 → 前缀标签</text>
  <text x="80" y="528" font-size="11" fill="#3D4F65">失败轨迹中距终局 ≤ H 步的前缀 = 正例</text>

  <line x1="85" y1="558" x2="405" y2="558" stroke="#3D4F65" stroke-width="1"/>
  <circle cx="110" cy="558" r="5.5" fill="#7EC896"/>
  <circle cx="150" cy="558" r="5.5" fill="#7EC896"/>
  <circle cx="190" cy="558" r="5.5" fill="#7EC896"/>
  <circle cx="230" cy="558" r="5.5" fill="#F2C94C"/>
  <circle cx="270" cy="558" r="5.5" fill="#F2C94C"/>
  <circle cx="310" cy="558" r="5.5" fill="#E56B6F"/>
  <circle cx="350" cy="558" r="5.5" fill="#E56B6F"/>
  <text x="385" y="562" font-size="11" fill="#E56B6F" font-weight="700">fail</text>
  <text x="110" y="578" font-size="10" fill="#3D4F65" text-anchor="middle">步 1</text>
  <text x="350" y="578" font-size="10" fill="#3D4F65" text-anchor="middle">步 T</text>
  <text x="245" y="588" text-anchor="middle" font-size="10.5" fill="#8A4B10">窗口 H 内标为正 · BCE 覆盖所有前缀</text>

  <!-- Arrow across panels -->
  <path d="M450,340 L518,340" stroke="#4B8BDA" stroke-width="2.5" fill="none" marker-end="url(#arr)"/>
  <text x="484" y="332" text-anchor="middle" font-size="11" fill="#1E3A5F" font-weight="600">结构化流</text>

  <!-- ============ ONLINE PANEL ============ -->
  <rect x="520" y="105" width="640" height="500" rx="16" fill="url(#gOnline)" stroke="#4B8BDA" stroke-width="1.5"/>
  <text x="540" y="135" font-size="16" font-weight="700" fill="#1E3A5F">在线：前缀风险监控器（轻量 · 无 LLM）</text>

  <!-- Step stream -->
  <text x="540" y="165" font-size="12" fill="#3D4F65">StepView 字段序列 s₁ s₂ … sₜ</text>
  <g>
    <rect x="540" y="174" width="40" height="28" rx="5" fill="#FFFFFF" stroke="#4B8BDA"/>
    <text x="560" y="193" text-anchor="middle" font-size="11" fill="#1E3A5F">s₁</text>
    <rect x="585" y="174" width="40" height="28" rx="5" fill="#FFFFFF" stroke="#4B8BDA"/>
    <text x="605" y="193" text-anchor="middle" font-size="11" fill="#1E3A5F">s₂</text>
    <rect x="630" y="174" width="40" height="28" rx="5" fill="#FFFFFF" stroke="#4B8BDA"/>
    <text x="650" y="193" text-anchor="middle" font-size="11" fill="#1E3A5F">s₃</text>
    <rect x="675" y="174" width="40" height="28" rx="5" fill="#FFFFFF" stroke="#4B8BDA"/>
    <text x="695" y="193" text-anchor="middle" font-size="11" fill="#1E3A5F">s₄</text>
    <text x="730" y="193" font-size="13" fill="#4B8BDA">…</text>
    <rect x="750" y="174" width="40" height="28" rx="5" fill="#FFFFFF" stroke="#4B8BDA"/>
    <text x="770" y="193" text-anchor="middle" font-size="11" fill="#1E3A5F">sₜ</text>
  </g>

  <!-- TFIDF -->
  <path d="M665,204 L665,226" stroke="#4B8BDA" stroke-width="1.8" marker-end="url(#arr)"/>
  <rect x="540" y="228" width="250" height="32" rx="16" fill="#FFFFFF" stroke="#4B8BDA"/>
  <text x="665" y="249" text-anchor="middle" font-size="12" fill="#1E3A5F" font-weight="600">TF-IDF · unigram+bigram · 4096 维</text>

  <!-- Gumbel -->
  <path d="M665,260 L665,282" stroke="#4B8BDA" stroke-width="1.8" marker-end="url(#arr)"/>
  <rect x="540" y="284" width="250" height="50" rx="10" fill="#C9DDF4" stroke="#4B8BDA"/>
  <text x="665" y="304" text-anchor="middle" font-size="12" font-weight="700" fill="#1E3A5F">Gumbel-softmax → K 个 latent 符号</text>
  <text x="665" y="322" text-anchor="middle" font-size="10.5" fill="#3D4F65" font-style="italic">端到端学到的可微"事件字母表" αₜ</text>

  <!-- symbol stream -->
  <g>
    <circle cx="555" cy="360" r="11" fill="#4B8BDA"/>
    <text x="555" y="364" text-anchor="middle" font-size="10" fill="white" font-weight="700">α₁</text>
    <circle cx="590" cy="360" r="11" fill="#6FA3DF"/>
    <text x="590" y="364" text-anchor="middle" font-size="10" fill="white" font-weight="700">α₂</text>
    <circle cx="625" cy="360" r="11" fill="#4B8BDA"/>
    <text x="625" y="364" text-anchor="middle" font-size="10" fill="white" font-weight="700">α₃</text>
    <circle cx="660" cy="360" r="11" fill="#9BBFE3"/>
    <text x="660" y="364" text-anchor="middle" font-size="10" fill="white" font-weight="700">α₄</text>
    <circle cx="695" cy="360" r="11" fill="#E89A4C"/>
    <text x="695" y="364" text-anchor="middle" font-size="10" fill="white" font-weight="700">α₅</text>
    <circle cx="730" cy="360" r="11" fill="#E56B6F"/>
    <text x="730" y="364" text-anchor="middle" font-size="10" fill="white" font-weight="700">α₆</text>
    <text x="760" y="364" font-size="12" fill="#3D4F65">… αₜ</text>
  </g>

  <!-- Sequence backend -->
  <path d="M665,372 L665,392" stroke="#4B8BDA" stroke-width="1.8" marker-end="url(#arr)"/>
  <rect x="540" y="394" width="250" height="52" rx="10" fill="#FFFFFF" stroke="#4B8BDA"/>
  <text x="665" y="414" text-anchor="middle" font-size="12" font-weight="700" fill="#1E3A5F">序列后端（GRU / Transformer / soft-FSM）</text>
  <text x="665" y="434" text-anchor="middle" font-size="11" fill="#3D4F65">hₜ → 前缀风险 sₜ = σ(w·hₜ+b)</text>

  <!-- Risk gauge -->
  <g transform="translate(820,165)">
    <text x="155" y="0" text-anchor="middle" font-size="12" font-weight="700" fill="#1E3A5F">当前前缀风险分 sₜ</text>
    <rect x="20" y="14" width="270" height="22" rx="11" fill="url(#gRisk)"/>
    <line x1="235" y1="10" x2="235" y2="40" stroke="#1E3A5F" stroke-width="2.5"/>
    <circle cx="235" cy="7" r="5" fill="#1E3A5F"/>
    <text x="20" y="54" font-size="10.5" fill="#7EC896">安全</text>
    <text x="290" y="54" text-anchor="end" font-size="10.5" fill="#E56B6F" font-weight="700">高危 · 触发告警</text>

    <rect x="0" y="70" width="310" height="110" rx="10" fill="#FFFFFF" stroke="#4B8BDA"/>
    <text x="15" y="91" font-size="12" font-weight="700" fill="#1E3A5F">AUPRC · 四大基准</text>
    <g font-size="11" fill="#3D4F65">
      <text x="15" y="112">WebArena</text><text x="295" y="112" text-anchor="end" font-weight="700" fill="#1E3A5F">0.900</text>
      <text x="15" y="131">τ²-Bench</text><text x="295" y="131" text-anchor="end" font-weight="700" fill="#1E3A5F">0.710</text>
      <text x="15" y="150">SkillsBench</text><text x="295" y="150" text-anchor="end" font-weight="700" fill="#1E3A5F">0.533</text>
      <text x="15" y="169">TerminalBench</text><text x="295" y="169" text-anchor="end" font-weight="700" fill="#1E3A5F">0.557</text>
    </g>

    <rect x="0" y="190" width="310" height="60" rx="10" fill="#EAF5EE" stroke="#7EC896"/>
    <text x="15" y="210" font-size="11.5" font-weight="700" fill="#2E7D4A">相对原始文本基线 +0.137 AUPRC</text>
    <text x="15" y="228" font-size="10.5" fill="#3D4F65">同协议下 LLM-as-judge 显著更弱</text>
    <text x="15" y="244" font-size="10.5" fill="#3D4F65">监控器轻量 · 无需每步调用大模型</text>
  </g>

  <!-- Running agent box -->
  <rect x="540" y="508" width="260" height="78" rx="10" fill="#FFFFFF" stroke="#4B8BDA"/>
  <text x="670" y="532" text-anchor="middle" font-size="13" font-weight="700" fill="#1E3A5F">运行中的 LLM Agent</text>
  <text x="670" y="552" text-anchor="middle" font-size="11" fill="#3D4F65">长链路工具调用 · 终局 verifier 太晚</text>
  <text x="670" y="572" text-anchor="middle" font-size="11" fill="#3D4F65">监控器逐步读字段 · 在线打分</text>

  <!-- Agent -> new step (feed forward) -->
  <path d="M540,530 C510,530 500,350 538,190" stroke="#4B8BDA" stroke-width="1.6" fill="none" stroke-dasharray="4 3" marker-end="url(#arr)"/>
  <text x="470" y="360" font-size="10.5" fill="#1E3A5F">新一步</text>

  <!-- Alarm back to agent (closed loop) -->
  <path d="M800,420 C880,440 880,520 802,548" stroke="#E56B6F" stroke-width="2.2" fill="none" marker-end="url(#arrR)"/>
  <text x="820" y="488" font-size="11" fill="#8A2E2E" font-weight="600">告警 → 回滚/safe-mode</text>

  <!-- ============ DIAGNOSTICS BAR ============ -->
  <rect x="40" y="620" width="1120" height="105" rx="14" fill="#FFFFFF" stroke="#1E3A5F" stroke-opacity=".25"/>
  <text x="60" y="645" font-size="14" font-weight="700" fill="#1E3A5F">部署级诊断：排名 ≠ 可用</text>

  <rect x="60" y="658" width="345" height="56" rx="8" fill="#F3F8FE" stroke="#4B8BDA" stroke-opacity=".5"/>
  <text x="75" y="677" font-size="11" font-weight="700" fill="#1E3A5F">AUPRC 可观测性上界</text>
  <text x="75" y="694" font-size="10" fill="#3D4F65">A(π,r) 区分"模型不够强"与</text>
  <text x="75" y="708" font-size="10" fill="#3D4F65">"前缀里根本没证据"</text>

  <rect x="425" y="658" width="345" height="56" rx="8" fill="#F3F8FE" stroke="#4B8BDA" stroke-opacity=".5"/>
  <text x="440" y="677" font-size="11" font-weight="700" fill="#1E3A5F">低误报早期告警</text>
  <text x="440" y="694" font-size="10" fill="#3D4F65">FAR≤10% 下 WebArena 只能事后 triage；</text>
  <text x="440" y="708" font-size="10" fill="#3D4F65">TerminalBench 可提前报警</text>

  <rect x="790" y="658" width="355" height="56" rx="8" fill="#F3F8FE" stroke="#4B8BDA" stroke-opacity=".5"/>
  <text x="805" y="677" font-size="11" font-weight="700" fill="#1E3A5F">DFA 事后抽取 · 可审计</text>
  <text x="805" y="694" font-size="10" fill="#3D4F65">WebArena 29 / τ² 20 状态紧凑</text>
  <text x="805" y="708" font-size="10" fill="#3D4F65">Skills 151 / Terminal 187 扩张</text>

  <!-- footer -->
  <text x="600" y="755" text-anchor="middle" font-size="10.5" fill="#3D4F65" font-style="italic">一次 LLM 归纳 → 终身轻量监控 · 把"终局才知道"的失败，变成前缀里就能拦截的风险</text>
</svg>