<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" font-family="'Helvetica Neue',Arial,sans-serif">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4B8BDA"/>
    </marker>
    <linearGradient id="riskg" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#7FB3E8"/>
      <stop offset="0.6" stop-color="#F2B56B"/>
      <stop offset="1" stop-color="#D9534F"/>
    </linearGradient>
  </defs>

  <rect width="900" height="560" fill="#FAF7F2"/>

  <text x="450" y="40" text-anchor="middle" font-size="22" font-weight="700" fill="#1E3A5F">
    PrefixGuard: 把 trace 学成"事件字母表"，再给前缀打风险分
  </text>
  <text x="450" y="62" text-anchor="middle" font-size="13" fill="#3D4F65">
    不等终局 verifier，也不每步跑 LLM-judge
  </text>

  <!-- Module 1: raw trace -->
  <g>
    <rect x="40" y="110" width="200" height="330" rx="10" fill="#EFF6FF" stroke="#4B8BDA" stroke-width="1.5"/>
    <text x="140" y="135" text-anchor="middle" font-size="14" font-weight="700" fill="#1E3A5F">原始 StepView</text>
    <text x="140" y="153" text-anchor="middle" font-size="11" fill="#3D4F65">(WebArena 轨迹)</text>

    <rect x="58" y="170" width="164" height="34" rx="4" fill="#FFFFFF" stroke="#B8CFE5"/>
    <text x="140" y="191" text-anchor="middle" font-size="11" fill="#3D4F65">step1: click "Search"</text>

    <rect x="58" y="212" width="164" height="34" rx="4" fill="#FFFFFF" stroke="#B8CFE5"/>
    <text x="140" y="233" text-anchor="middle" font-size="11" fill="#3D4F65">step2: type query…</text>

    <rect x="58" y="254" width="164" height="34" rx="4" fill="#FFFFFF" stroke="#B8CFE5"/>
    <text x="140" y="275" text-anchor="middle" font-size="11" fill="#3D4F65">step3: tool_error 404</text>

    <rect x="58" y="296" width="164" height="34" rx="4" fill="#FFFFFF" stroke="#B8CFE5"/>
    <text x="140" y="317" text-anchor="middle" font-size="11" fill="#3D4F65">step4: retry tool_error</text>

    <rect x="58" y="338" width="164" height="34" rx="4" fill="#FFFFFF" stroke="#B8CFE5"/>
    <text x="140" y="359" text-anchor="middle" font-size="11" fill="#3D4F65">step5: scroll…</text>

    <rect x="58" y="380" width="164" height="34" rx="4" fill="#FFFFFF" stroke="#B8CFE5"/>
    <text x="140" y="401" text-anchor="middle" font-size="11" fill="#3D4F65">step6: click wrong link</text>

    <text x="140" y="430" text-anchor="middle" font-size="10" fill="#7A8AA0">TF-IDF uni+bigram, 4096d</text>
  </g>

  <!-- arrow 1 -->
  <line x1="242" y1="275" x2="292" y2="275" stroke="#4B8BDA" stroke-width="2" marker-end="url(#ar)"/>
  <text x="267" y="265" text-anchor="middle" font-size="10" fill="#4B8BDA">投影</text>

  <!-- Module 2: Gumbel symbols -->
  <g>
    <rect x="295" y="110" width="250" height="330" rx="10" fill="#FFF4E6" stroke="#E89B4A" stroke-width="1.5"/>
    <text x="420" y="135" text-anchor="middle" font-size="14" font-weight="700" fill="#1E3A5F">Gumbel-Softmax</text>
    <text x="420" y="153" text-anchor="middle" font-size="11" fill="#3D4F65">学到的 K 类 latent 事件符号</text>

    <!-- discrete symbols legend -->
    <g font-size="11" fill="#1E3A5F">
      <circle cx="320" cy="182" r="7" fill="#7FB3E8"/><text x="333" y="186">α_A 正常浏览</text>
      <circle cx="320" cy="208" r="7" fill="#9DD6A8"/><text x="333" y="212">α_B 搜索查询</text>
      <circle cx="435" cy="182" r="7" fill="#E89B4A"/><text x="448" y="186">α_C 工具异常</text>
      <circle cx="435" cy="208" r="7" fill="#D9534F"/><text x="448" y="212">α_D 跑偏目标</text>
    </g>

    <!-- soft distributions per step -->
    <text x="420" y="248" text-anchor="middle" font-size="11" fill="#3D4F65">前缀 α₁..α₆ (soft 分布)</text>

    <g font-size="10" fill="#3D4F65">
      <text x="325" y="275" text-anchor="end">t1</text>
      <rect x="335" y="265" width="60" height="12" fill="#7FB3E8"/>
      <rect x="395" y="265" width="25" height="12" fill="#9DD6A8"/>
      <rect x="420" y="265" width="8" height="12" fill="#E89B4A"/>

      <text x="325" y="297" text-anchor="end">t2</text>
      <rect x="335" y="287" width="20" height="12" fill="#7FB3E8"/>
      <rect x="355" y="287" width="70" height="12" fill="#9DD6A8"/>

      <text x="325" y="319" text-anchor="end">t3</text>
      <rect x="335" y="309" width="10" height="12" fill="#7FB3E8"/>
      <rect x="345" y="309" width="80" height="12" fill="#E89B4A"/>

      <text x="325" y="341" text-anchor="end">t4</text>
      <rect x="335" y="331" width="5" height="12" fill="#7FB3E8"/>
      <rect x="340" y="331" width="90" height="12" fill="#E89B4A"/>

      <text x="325" y="363" text-anchor="end">t5</text>
      <rect x="335" y="353" width="30" height="12" fill="#7FB3E8"/>
      <rect x="365" y="353" width="40" height="12" fill="#E89B4A"/>
      <rect x="405" y="353" width="20" height="12" fill="#D9534F"/>

      <text x="325" y="385" text-anchor="end">t6</text>
      <rect x="335" y="375" width="10" height="12" fill="#7FB3E8"/>
      <rect x="345" y="375" width="30" height="12" fill="#E89B4A"/>
      <rect x="375" y="375" width="55" height="12" fill="#D9534F"/>
    </g>

    <text x="420" y="420" text-anchor="middle" font-size="10" fill="#A0662A">离散出口 → 可抽 DFA</text>
  </g>

  <!-- arrow 2 -->
  <line x1="547" y1="275" x2="607" y2="275" stroke="#4B8BDA" stroke-width="2" marker-end="url(#ar)"/>
  <text x="577" y="265" text-anchor="middle" font-size="10" fill="#4B8BDA">序列建模</text>

  <!-- Module 3: sequence backend + risk -->
  <g>
    <rect x="610" y="110" width="250" height="330" rx="10" fill="#F4ECFB" stroke="#8B5FB8" stroke-width="1.5"/>
    <text x="735" y="135" text-anchor="middle" font-size="14" font-weight="700" fill="#1E3A5F">前缀风险监控</text>
    <text x="735" y="153" text-anchor="middle" font-size="11" fill="#3D4F65">GRU / Transformer / soft-FSM</text>

    <!-- risk curve -->
    <rect x="630" y="175" width="210" height="150" fill="#FFFFFF" stroke="#C9B8DD"/>
    <line x1="640" y1="315" x2="830" y2="315" stroke="#B8CFE5"/>
    <line x1="640" y1="185" x2="640" y2="315" stroke="#B8CFE5"/>
    <text x="636" y="320" text-anchor="end" font-size="9" fill="#7A8AA0">0</text>
    <text x="636" y="190" text-anchor="end" font-size="9" fill="#7A8AA0">1</text>

    <!-- threshold line -->
    <line x1="640" y1="232" x2="815" y2="232" stroke="#D9534F" stroke-dasharray="4 3" stroke-width="1.2"/>
    <text x="818" y="229" font-size="9" fill="#D9534F">10% FPR</text>

    <!-- curve points s1..s6 -->
    <polyline points="660,300 690,292 720,270 750,250 780,220 810,200"
              fill="none" stroke="url(#riskg)" stroke-width="3"/>
    <g fill="#1E3A5F">
      <circle cx="660" cy="300" r="3"/>
      <circle cx="690" cy="292" r="3"/>
      <circle cx="720" cy="270" r="3"/>
      <circle cx="750" cy="250" r="3"/>
      <circle cx="780" cy="220" r="3"/>
      <circle cx="810" cy="200" r="4" fill="#D9534F"/>
    </g>
    <text x="800" y="193" text-anchor="end" font-size="10" font-weight="700" fill="#D9534F">s₆=0.87 🚨</text>
    <text x="660" y="335" text-anchor="middle" font-size="9" fill="#7A8AA0">t1</text>
    <text x="810" y="335" text-anchor="middle" font-size="9" fill="#7A8AA0">t6</text>

    <!-- bottom note -->
    <rect x="625" y="348" width="220" height="78" rx="6" fill="#FFFFFF" stroke="#C9B8DD"/>
    <text x="735" y="367" text-anchor="middle" font-size="11" font-weight="700" fill="#1E3A5F">在线触发预警</text>
    <text x="735" y="385" text-anchor="middle" font-size="10" fill="#3D4F65">sₜ = σ(w·hₜ + b)，BCE 覆盖全前缀</text>
    <text x="735" y="402" text-anchor="middle" font-size="10" fill="#3D4F65">symbol-balance 正则防塌缩</text>
    <text x="735" y="419" text-anchor="middle" font-size="10" fill="#3D4F65">阈值过线 → 立即报警</text>
  </g>

  <!-- bottom tagline -->
  <rect x="150" y="470" width="600" height="60" rx="8" fill="#1E3A5F"/>
  <text x="450" y="495" text-anchor="middle" font-size="13" font-weight="700" fill="#FAF7F2">
    一步错棋 → 立刻报警，而不是等到终局 verifier 判死刑
  </text>
  <text x="450" y="515" text-anchor="middle" font-size="11" fill="#B8CFE5">
    神经拟合 + 符号出口：既便宜又可审计
  </text>
</svg>