<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 560" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4B8BDA"/>
    </marker>
    <marker id="arrO" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#E07B39"/>
    </marker>
    <marker id="arrP" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#8E6FC2"/>
    </marker>
  </defs>

  <rect width="880" height="560" fill="#FAF7F2"/>

  <text x="440" y="36" text-anchor="middle" font-size="21" font-weight="bold" fill="#1E3A5F">
    TACT: 在 &lt;/think&gt; 那一刻把隐藏状态推回"正常区"
  </text>
  <text x="440" y="58" text-anchor="middle" font-size="13" fill="#3D4F65">
    前 10 层 forward hook · 双轴 (OT, OA) · 三种策略
  </text>

  <!-- LLM block -->
  <rect x="40" y="95" width="230" height="160" rx="12" fill="#EFF6FF" stroke="#4B8BDA" stroke-width="2"/>
  <text x="155" y="120" text-anchor="middle" font-size="15" font-weight="bold" fill="#1E3A5F">Coding Agent LLM</text>
  <text x="155" y="140" text-anchor="middle" font-size="11" fill="#3D4F65">残差流 h (hidden state)</text>

  <g>
    <rect x="65" y="155" width="180" height="9" fill="#DCE7F5"/>
    <rect x="65" y="169" width="180" height="9" fill="#DCE7F5"/>
    <rect x="65" y="183" width="180" height="9" fill="#FFD9B0" stroke="#E07B39"/>
    <rect x="65" y="197" width="180" height="9" fill="#FFD9B0" stroke="#E07B39"/>
    <rect x="65" y="211" width="180" height="9" fill="#DCE7F5"/>
    <text x="250" y="197" font-size="10" fill="#E07B39">hook</text>
  </g>
  <text x="155" y="242" text-anchor="middle" font-size="11" fill="#3D4F65">钩子只挂在 top-10 AUC 层</text>

  <!-- trigger -->
  <rect x="310" y="140" width="170" height="70" rx="10" fill="#FFF4E0" stroke="#E07B39" stroke-width="2"/>
  <text x="395" y="168" text-anchor="middle" font-size="14" font-weight="bold" fill="#1E3A5F">触发时机</text>
  <text x="395" y="190" text-anchor="middle" font-size="12" fill="#3D4F65">&lt;/think&gt; token 前向</text>

  <line x1="270" y1="175" x2="308" y2="175" stroke="#4B8BDA" stroke-width="2" marker-end="url(#arr)"/>

  <!-- 2D projection space -->
  <g transform="translate(510,95)">
    <rect x="0" y="0" width="330" height="160" rx="10" fill="#FFFFFF" stroke="#4B8BDA" stroke-width="1.5"/>
    <text x="165" y="22" text-anchor="middle" font-size="13" font-weight="bold" fill="#1E3A5F">双轴激活空间</text>

    <line x1="40" y1="130" x2="290" y2="130" stroke="#3D4F65" stroke-width="1"/>
    <line x1="165" y1="35" x2="165" y2="140" stroke="#3D4F65" stroke-width="1"/>
    <text x="282" y="144" font-size="10" fill="#3D4F65">v̂_OT</text>
    <text x="171" y="42" font-size="10" fill="#3D4F65">v̂_OA</text>

    <rect x="125" y="70" width="80" height="60" fill="#D9F0D9" opacity="0.7"/>
    <text x="165" y="105" text-anchor="middle" font-size="10" fill="#2F6B3A">正常区 (-τ,+τ)</text>

    <circle cx="255" cy="65" r="6" fill="#D14B4B"/>
    <text x="248" y="58" text-anchor="end" font-size="10" fill="#D14B4B">drift</text>
    <line x1="250" y1="70" x2="210" y2="92" stroke="#4B8BDA" stroke-width="2" marker-end="url(#arr)"/>
  </g>

  <line x1="480" y1="175" x2="508" y2="175" stroke="#4B8BDA" stroke-width="2" marker-end="url(#arr)"/>

  <!-- three strategies -->
  <g font-size="12" fill="#3D4F65">
    <!-- CAP -->
    <rect x="40" y="300" width="255" height="200" rx="10" fill="#EAF3FF" stroke="#4B8BDA" stroke-width="2"/>
    <text x="167" y="328" text-anchor="middle" font-size="15" font-weight="bold" fill="#1E3A5F">TACT-CAP</text>
    <text x="167" y="350" text-anchor="middle">越界才夹回带内</text>
    <line x1="70" y1="410" x2="280" y2="410" stroke="#3D4F65"/>
    <rect x="132" y="395" width="70" height="30" fill="#D9F0D9" opacity="0.7"/>
    <circle cx="265" cy="410" r="5" fill="#D14B4B"/>
    <line x1="260" y1="410" x2="205" y2="410" stroke="#4B8BDA" stroke-width="2" marker-end="url(#arr)"/>
    <text x="167" y="470" text-anchor="middle" font-style="italic">保守：只管越界</text>

    <!-- ADD -->
    <rect x="310" y="300" width="260" height="200" rx="10" fill="#FFF1E6" stroke="#E07B39" stroke-width="2"/>
    <text x="440" y="328" text-anchor="middle" font-size="15" font-weight="bold" fill="#1E3A5F">TACT-ADD</text>
    <text x="440" y="350" text-anchor="middle">每步都加固定反向偏移</text>
    <line x1="340" y1="410" x2="550" y2="410" stroke="#3D4F65"/>
    <rect x="405" y="395" width="70" height="30" fill="#D9F0D9" opacity="0.7"/>
    <g stroke="#E07B39" stroke-width="2" fill="none">
      <line x1="360" y1="385" x2="378" y2="397" marker-end="url(#arrO)"/>
      <line x1="440" y1="440" x2="440" y2="428" marker-end="url(#arrO)"/>
      <line x1="520" y1="385" x2="502" y2="397" marker-end="url(#arrO)"/>
    </g>
    <text x="440" y="470" text-anchor="middle" font-style="italic">粗暴：每步都拉一把</text>

    <!-- GATE -->
    <rect x="585" y="300" width="255" height="200" rx="10" fill="#F0E9F7" stroke="#8E6FC2" stroke-width="2"/>
    <text x="712" y="328" text-anchor="middle" font-size="15" font-weight="bold" fill="#1E3A5F">TACT-GATE</text>
    <text x="712" y="350" text-anchor="middle">越界才触发，按 λ 缩放</text>
    <line x1="615" y1="410" x2="825" y2="410" stroke="#3D4F65"/>
    <rect x="677" y="395" width="70" height="30" fill="#D9F0D9" opacity="0.7"/>
    <circle cx="810" cy="410" r="5" fill="#D14B4B"/>
    <line x1="805" y1="410" x2="750" y2="410" stroke="#8E6FC2" stroke-width="2" marker-end="url(#arrP)"/>
    <text x="712" y="470" text-anchor="middle" font-style="italic">折中：选择性 + 可调力度</text>
  </g>

  <text x="440" y="535" text-anchor="middle" font-size="12" fill="#3D4F65">
    无需重训 · 无需改 prompt · 只在推理时推一把隐藏状态
  </text>
</svg>