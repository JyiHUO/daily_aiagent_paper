<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4B8BDA"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#C97B4A"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="450" y="36" text-anchor="middle" font-size="22" font-weight="bold" fill="#1E3A5F">结构化修复循环：先共享缺陷，再逐场景</text>
  <text x="450" y="60" text-anchor="middle" font-size="13" fill="#3D4F65">SMT 发现冲突 → 分诊修复 → 类型化 edit 作用于中间表示</text>

  <!-- Left: SMT conflicts -->
  <rect x="40" y="110" width="190" height="170" rx="10" fill="#FFF3E6" stroke="#C97B4A" stroke-width="2"/>
  <text x="135" y="138" text-anchor="middle" font-size="15" font-weight="bold" fill="#1E3A5F">SMT 冲突集合</text>
  <rect x="60" y="155" width="150" height="28" rx="5" fill="#FFE0C2" stroke="#C97B4A"/>
  <text x="135" y="174" text-anchor="middle" font-size="12" fill="#3D4F65">scenario #1 冲突</text>
  <rect x="60" y="190" width="150" height="28" rx="5" fill="#FFE0C2" stroke="#C97B4A"/>
  <text x="135" y="209" text-anchor="middle" font-size="12" fill="#3D4F65">scenario #2 冲突</text>
  <rect x="60" y="225" width="150" height="28" rx="5" fill="#FFE0C2" stroke="#C97B4A"/>
  <text x="135" y="244" text-anchor="middle" font-size="12" fill="#3D4F65">scenario #3 冲突</text>

  <!-- Judge / triage -->
  <polygon points="290,195 360,160 430,195 360,230" fill="#EFF6FF" stroke="#4B8BDA" stroke-width="2"/>
  <text x="360" y="192" text-anchor="middle" font-size="13" font-weight="bold" fill="#1E3A5F">LLM Judge</text>
  <text x="360" y="210" text-anchor="middle" font-size="11" fill="#3D4F65">共享缺陷？</text>

  <path d="M230 195 L290 195" stroke="#C97B4A" stroke-width="2" fill="none" marker-end="url(#arrR)"/>

  <!-- Path A: shared world model fix -->
  <rect x="500" y="100" width="340" height="120" rx="10" fill="#E8F1FB" stroke="#4B8BDA" stroke-width="2"/>
  <text x="670" y="128" text-anchor="middle" font-size="15" font-weight="bold" fill="#1E3A5F">① 先改 World Model（一次性）</text>
  <text x="670" y="152" text-anchor="middle" font-size="12" fill="#3D4F65">batched resolution：共享前置条件缺失</text>
  <rect x="525" y="165" width="290" height="40" rx="6" fill="#FFFFFF" stroke="#4B8BDA" stroke-dasharray="3,3"/>
  <text x="670" y="190" text-anchor="middle" font-size="12" fill="#1E3A5F">+ precondition: legacy-portal-checked</text>

  <!-- Path B: per-scenario fix -->
  <rect x="500" y="250" width="340" height="100" rx="10" fill="#FFF7E6" stroke="#D4A34A" stroke-width="2"/>
  <text x="670" y="278" text-anchor="middle" font-size="15" font-weight="bold" fill="#1E3A5F">② 再逐场景修 Check</text>
  <text x="670" y="300" text-anchor="middle" font-size="12" fill="#3D4F65">只处理剩余的独立冲突，每场景单独 edit</text>

  <!-- arrows from judge -->
  <path d="M400 178 L500 140" stroke="#4B8BDA" stroke-width="2.5" fill="none" marker-end="url(#arr)"/>
  <text x="440" y="150" font-size="12" font-weight="bold" fill="#4B8BDA">是</text>
  <path d="M400 212 L500 278" stroke="#4B8BDA" stroke-width="2.5" fill="none" marker-end="url(#arr)"/>
  <text x="440" y="258" font-size="12" font-weight="bold" fill="#4B8BDA">否</text>

  <!-- typed edit language box -->
  <rect x="200" y="410" width="500" height="80" rx="12" fill="#EDE7F6" stroke="#6B5CA5" stroke-width="2"/>
  <text x="450" y="438" text-anchor="middle" font-size="15" font-weight="bold" fill="#1E3A5F">类型化 Edit 语言</text>
  <text x="450" y="460" text-anchor="middle" font-size="12" fill="#3D4F65">确定性作用于中间表示，禁止自由文本改写</text>
  <text x="450" y="478" text-anchor="middle" font-size="12" fill="#3D4F65">防止 LLM 在修复时引入新错误</text>

  <!-- arrows from both paths to edit language -->
  <path d="M600 220 L560 410" stroke="#4B8BDA" stroke-width="2" fill="none" marker-end="url(#arr)"/>
  <path d="M600 350 L540 410" stroke="#4B8BDA" stroke-width="2" fill="none" marker-end="url(#arr)"/>

  <!-- feedback loop to SMT -->
  <path d="M200 450 L90 450 L90 285" stroke="#4B8BDA" stroke-width="2" stroke-dasharray="6,4" fill="none" marker-end="url(#arr)"/>
  <text x="100" y="380" font-size="11" fill="#4B8BDA">重新编译 SMT</text>
  <text x="100" y="395" font-size="11" fill="#4B8BDA">直到无冲突</text>

  <!-- bottom caption -->
  <text x="450" y="525" text-anchor="middle" font-size="12" fill="#3D4F65" font-style="italic">分诊式修复：共享缺陷只改一次，剩下才逐个处理，全部通过受控 edit</text>
</svg>