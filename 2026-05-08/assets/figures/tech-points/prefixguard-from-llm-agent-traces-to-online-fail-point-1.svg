<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4B8BDA"/>
    </marker>
  </defs>

  <rect width="900" height="560" fill="#FAF7F2"/>

  <text x="450" y="40" text-anchor="middle" font-size="22" font-weight="bold" fill="#1E3A5F">StepView：让 LLM 写一次解析器，永久冻结</text>
  <text x="450" y="64" text-anchor="middle" font-size="13" fill="#3D4F65">异构 trace → 七字段结构化 step</text>

  <!-- Left: heterogeneous traces -->
  <g>
    <rect x="40" y="110" width="230" height="80" rx="8" fill="#FFF1E6" stroke="#E0A87A" stroke-width="1.5"/>
    <text x="55" y="132" font-size="12" fill="#1E3A5F" font-weight="bold">Browser trace</text>
    <text x="55" y="152" font-size="11" fill="#3D4F65" font-family="monospace">click("div.btn-primary")</text>
    <text x="55" y="170" font-size="11" fill="#3D4F65" font-family="monospace">→ page loaded</text>

    <rect x="40" y="210" width="230" height="80" rx="8" fill="#EFF6FF" stroke="#4B8BDA" stroke-width="1.5"/>
    <text x="55" y="232" font-size="12" fill="#1E3A5F" font-weight="bold">Dialogue / tool JSON</text>
    <text x="55" y="252" font-size="11" fill="#3D4F65" font-family="monospace">{"tool":"search",</text>
    <text x="55" y="270" font-size="11" fill="#3D4F65" font-family="monospace"> "args":{"q":"..."}}</text>

    <rect x="40" y="310" width="230" height="80" rx="8" fill="#F3EDE4" stroke="#B8A082" stroke-width="1.5"/>
    <text x="55" y="332" font-size="12" fill="#1E3A5F" font-weight="bold">Shell output</text>
    <text x="55" y="352" font-size="11" fill="#3D4F65" font-family="monospace">$ ls /data</text>
    <text x="55" y="370" font-size="11" fill="#3D4F65" font-family="monospace">err: no such file</text>
  </g>

  <!-- Middle: LLM induct once -->
  <g>
    <rect x="330" y="200" width="210" height="140" rx="12" fill="#1E3A5F"/>
    <text x="435" y="232" text-anchor="middle" font-size="15" font-weight="bold" fill="#FFF1E6">LLM（一次性）</text>
    <text x="435" y="262" text-anchor="middle" font-size="12" fill="#E6EEF8">看几个样例，合成</text>
    <text x="435" y="282" text-anchor="middle" font-size="12" fill="#E6EEF8">确定性适配器</text>
    <text x="435" y="312" text-anchor="middle" font-size="11" fill="#E0A87A" font-style="italic">冻结，部署不再调用</text>
  </g>

  <!-- Arrows from traces to LLM -->
  <path d="M 270 150 Q 300 180 330 230" fill="none" stroke="#4B8BDA" stroke-width="1.8" marker-end="url(#arr)"/>
  <path d="M 270 250 L 330 265" fill="none" stroke="#4B8BDA" stroke-width="1.8" marker-end="url(#arr)"/>
  <path d="M 270 350 Q 300 320 330 300" fill="none" stroke="#4B8BDA" stroke-width="1.8" marker-end="url(#arr)"/>

  <!-- Right: unified 7 fields -->
  <g>
    <rect x="610" y="130" width="250" height="300" rx="10" fill="#EFF6FF" stroke="#4B8BDA" stroke-width="2"/>
    <text x="735" y="158" text-anchor="middle" font-size="14" font-weight="bold" fill="#1E3A5F">统一 Step（7 字段）</text>

    <g font-size="12" fill="#1E3A5F" font-family="monospace">
      <rect x="625" y="175" width="220" height="28" rx="4" fill="#FFFFFF" stroke="#C9DCF0"/>
      <text x="635" y="193">metadata</text>
      <rect x="625" y="209" width="220" height="28" rx="4" fill="#FFFFFF" stroke="#C9DCF0"/>
      <text x="635" y="227">observation</text>
      <rect x="625" y="243" width="220" height="28" rx="4" fill="#FFFFFF" stroke="#C9DCF0"/>
      <text x="635" y="261">action</text>
      <rect x="625" y="277" width="220" height="28" rx="4" fill="#FFF1E6" stroke="#E0A87A"/>
      <text x="635" y="295">tool</text>
      <rect x="625" y="311" width="220" height="28" rx="4" fill="#FFF1E6" stroke="#E0A87A"/>
      <text x="635" y="329">args</text>
      <rect x="625" y="345" width="220" height="28" rx="4" fill="#FFFFFF" stroke="#C9DCF0"/>
      <text x="635" y="363">result</text>
      <rect x="625" y="379" width="220" height="28" rx="4" fill="#FFFFFF" stroke="#C9DCF0"/>
      <text x="635" y="397">status</text>
    </g>
  </g>

  <!-- Arrow from LLM to unified -->
  <path d="M 540 270 L 610 270" fill="none" stroke="#4B8BDA" stroke-width="2.5" marker-end="url(#arr)"/>
  <text x="575" y="260" text-anchor="middle" font-size="11" fill="#1E3A5F" font-weight="bold">apply</text>

  <!-- Bottom note -->
  <rect x="120" y="470" width="660" height="60" rx="8" fill="#FFF1E6" stroke="#E0A87A" stroke-width="1.5"/>
  <text x="450" y="494" text-anchor="middle" font-size="13" fill="#1E3A5F" font-weight="bold">部署时：监控器只读结构化字段 — 快、稳、零 LLM 调用</text>
  <text x="450" y="514" text-anchor="middle" font-size="12" fill="#3D4F65">无需人工为每个 benchmark 写 parser</text>
</svg>