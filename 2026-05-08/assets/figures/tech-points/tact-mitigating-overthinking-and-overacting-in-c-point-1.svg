<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4B8BDA"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="450" y="38" text-anchor="middle" font-size="22" font-weight="bold" fill="#1E3A5F">每一步有没有带来新信息？</text>
  <text x="450" y="62" text-anchor="middle" font-size="13" fill="#3D4F65">把 Agent 漂移定义为：当前步相对已知状态 K_t 的失配</text>

  <!-- Known state box -->
  <rect x="40" y="100" width="230" height="360" rx="12" fill="#EFF6FF" stroke="#4B8BDA" stroke-width="2"/>
  <text x="155" y="128" text-anchor="middle" font-size="15" font-weight="bold" fill="#1E3A5F">滚动已知状态 K_t</text>
  <text x="155" y="148" text-anchor="middle" font-size="11" fill="#3D4F65">(前 1..t-1 步累积)</text>

  <rect x="60" y="170" width="190" height="34" rx="5" fill="#FFFFFF" stroke="#9BB8D9"/>
  <text x="155" y="191" text-anchor="middle" font-size="12" fill="#1E3A5F">✓ models.py 已读</text>

  <rect x="60" y="214" width="190" height="34" rx="5" fill="#FFFFFF" stroke="#9BB8D9"/>
  <text x="155" y="235" text-anchor="middle" font-size="12" fill="#1E3A5F">✓ QuerySet 定义已知</text>

  <rect x="60" y="258" width="190" height="34" rx="5" fill="#FFFFFF" stroke="#9BB8D9"/>
  <text x="155" y="279" text-anchor="middle" font-size="12" fill="#1E3A5F">✓ bug 假设 H1 推理过</text>

  <!-- Pipeline -->
  <text x="155" y="335" text-anchor="middle" font-size="12" font-weight="bold" fill="#1E3A5F">三阶段 pipeline</text>
  <rect x="60" y="348" width="190" height="28" rx="5" fill="#FDF2E4" stroke="#E0A96D"/>
  <text x="155" y="367" text-anchor="middle" font-size="11" fill="#3D4F65">① State Maintainer 总结</text>
  <rect x="60" y="384" width="190" height="28" rx="5" fill="#FDF2E4" stroke="#E0A96D"/>
  <text x="155" y="403" text-anchor="middle" font-size="11" fill="#3D4F65">② Verifier 审查幻觉/遗漏</text>
  <rect x="60" y="420" width="190" height="28" rx="5" fill="#FDF2E4" stroke="#E0A96D"/>
  <text x="155" y="439" text-anchor="middle" font-size="11" fill="#3D4F65">③ Annotator 贴标签</text>

  <!-- Arrow to judge -->
  <line x1="270" y1="280" x2="338" y2="280" stroke="#4B8BDA" stroke-width="2" marker-end="url(#arr)"/>
  <text x="304" y="272" text-anchor="middle" font-size="11" fill="#3D4F65">对照</text>

  <!-- Step t -->
  <rect x="340" y="240" width="200" height="80" rx="10" fill="#FFF6E5" stroke="#E0A96D" stroke-width="2"/>
  <text x="440" y="266" text-anchor="middle" font-size="14" font-weight="bold" fill="#1E3A5F">第 t 步动作</text>
  <text x="440" y="289" text-anchor="middle" font-size="12" fill="#3D4F65">grep "QuerySet"</text>
  <text x="440" y="308" text-anchor="middle" font-size="11" fill="#3D4F65">(读到的都是已知)</text>

  <!-- Three outcomes arrows -->
  <line x1="540" y1="265" x2="603" y2="165" stroke="#4B8BDA" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="542" y1="280" x2="603" y2="280" stroke="#4B8BDA" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="540" y1="295" x2="603" y2="395" stroke="#4B8BDA" stroke-width="2" marker-end="url(#arr)"/>

  <!-- Overthinking -->
  <rect x="605" y="110" width="255" height="80" rx="10" fill="#FCE8E8" stroke="#D76B6B" stroke-width="2"/>
  <text x="732" y="136" text-anchor="middle" font-size="14" font-weight="bold" fill="#B23A3A">Overthinking</text>
  <text x="732" y="158" text-anchor="middle" font-size="11" fill="#3D4F65">反复推理已知事实 · ΔK = ∅</text>

  <!-- Overacting -->
  <rect x="605" y="240" width="255" height="80" rx="10" fill="#FCE8E8" stroke="#D76B6B" stroke-width="2"/>
  <text x="732" y="266" text-anchor="middle" font-size="14" font-weight="bold" fill="#B23A3A">Overacting</text>
  <text x="732" y="288" text-anchor="middle" font-size="11" fill="#3D4F65">调工具却只得到已知 · ΔK = ∅</text>

  <!-- Calibrated -->
  <rect x="605" y="370" width="255" height="80" rx="10" fill="#E4F3E4" stroke="#5FA85F" stroke-width="2"/>
  <text x="732" y="396" text-anchor="middle" font-size="14" font-weight="bold" fill="#2E6B2E">Calibrated</text>
  <text x="732" y="418" text-anchor="middle" font-size="11" fill="#3D4F65">带回新证据，扩展 K_t · ΔK ≠ ∅</text>

  <!-- Footer -->
  <text x="450" y="505" text-anchor="middle" font-size="12" fill="#1E3A5F">核心思想：把"失败"从最终任务结果，下沉到每一步的信息增益判定</text>
  <text x="450" y="525" text-anchor="middle" font-size="11" fill="#3D4F65">→ 才能在残差流里提前检测漂移，而不是等行为失败再补救</text>
</svg>