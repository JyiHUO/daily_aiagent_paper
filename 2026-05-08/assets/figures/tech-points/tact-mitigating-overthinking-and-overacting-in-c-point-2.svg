<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" font-family="Arial, sans-serif">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4B8BDA"/>
    </marker>
    <marker id="arOT" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#C2410C"/>
    </marker>
    <marker id="arOA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#7C3AED"/>
    </marker>
  </defs>

  <rect width="900" height="600" fill="#FAF7F2"/>

  <text x="450" y="38" text-anchor="middle" font-size="22" font-weight="bold" fill="#1E3A5F">
    两条漂移轴 → 正交化，得到独立可控的方向
  </text>
  <text x="450" y="62" text-anchor="middle" font-size="13" fill="#3D4F65">
    在 &lt;/think&gt; 处抽 hidden state，分离 Overthinking / Overacting
  </text>

  <!-- LEFT: 原始激活空间 -->
  <g>
    <rect x="40" y="90" width="380" height="470" rx="10" fill="#EFF6FF" stroke="#4B8BDA" stroke-width="1.5"/>
    <text x="230" y="118" text-anchor="middle" font-size="16" font-weight="bold" fill="#1E3A5F">① 激活空间里：两条方向不正交</text>

    <!-- cluster CAL -->
    <ellipse cx="230" cy="370" rx="55" ry="42" fill="#DCEAF7" stroke="#4B8BDA" stroke-dasharray="4 3"/>
    <text x="230" y="368" text-anchor="middle" font-size="13" font-weight="bold" fill="#1E3A5F">CAL (µ)</text>

    <!-- dots CAL -->
    <circle cx="215" cy="355" r="3" fill="#4B8BDA"/>
    <circle cx="240" cy="365" r="3" fill="#4B8BDA"/>
    <circle cx="225" cy="380" r="3" fill="#4B8BDA"/>
    <circle cx="245" cy="385" r="3" fill="#4B8BDA"/>
    <circle cx="220" cy="378" r="3" fill="#4B8BDA"/>

    <!-- OT axis -->
    <line x1="230" y1="370" x2="370" y2="220" stroke="#C2410C" stroke-width="2.5" marker-end="url(#arOT)"/>
    <text x="375" y="215" font-size="13" font-weight="bold" fill="#C2410C">v_OT</text>
    <circle cx="320" cy="265" r="4" fill="#C2410C"/>
    <circle cx="340" cy="245" r="4" fill="#C2410C"/>
    <circle cx="300" cy="285" r="4" fill="#C2410C"/>

    <!-- OA axis (not orthogonal) -->
    <line x1="230" y1="370" x2="390" y2="300" stroke="#7C3AED" stroke-width="2.5" marker-end="url(#arOA)"/>
    <text x="395" y="298" font-size="13" font-weight="bold" fill="#7C3AED">v_OA</text>
    <circle cx="320" cy="330" r="4" fill="#7C3AED"/>
    <circle cx="340" cy="322" r="4" fill="#7C3AED"/>
    <circle cx="300" cy="338" r="4" fill="#7C3AED"/>

    <!-- angle indicator -->
    <path d="M 285 340 A 50 50 0 0 0 290 318" fill="none" stroke="#B45309" stroke-width="1.5"/>
    <text x="300" y="355" font-size="11" fill="#B45309" font-style="italic">夹角 → 互相串扰</text>

    <text x="230" y="525" text-anchor="middle" font-size="12" fill="#3D4F65">问题：想测 OT，却也被 OA 方向影响</text>
  </g>

  <!-- Arrow middle -->
  <g>
    <line x1="430" y1="325" x2="482" y2="325" stroke="#4B8BDA" stroke-width="3" marker-end="url(#ar)"/>
    <text x="456" y="312" text-anchor="middle" font-size="12" font-weight="bold" fill="#1E3A5F">Gram–Schmidt</text>
    <text x="456" y="348" text-anchor="middle" font-size="11" fill="#3D4F65">正交化</text>
  </g>

  <!-- RIGHT: 正交后 -->
  <g>
    <rect x="490" y="90" width="380" height="470" rx="10" fill="#FFF4E6" stroke="#C2410C" stroke-width="1.5"/>
    <text x="680" y="118" text-anchor="middle" font-size="16" font-weight="bold" fill="#1E3A5F">② 正交化：两根独立坐标轴</text>

    <ellipse cx="680" cy="360" rx="55" ry="42" fill="#FCE7D2" stroke="#C2410C" stroke-dasharray="4 3"/>
    <text x="680" y="362" text-anchor="middle" font-size="13" font-weight="bold" fill="#1E3A5F">CAL (µ)</text>

    <circle cx="665" cy="345" r="3" fill="#C2410C"/>
    <circle cx="690" cy="355" r="3" fill="#C2410C"/>
    <circle cx="675" cy="370" r="3" fill="#C2410C"/>
    <circle cx="695" cy="375" r="3" fill="#C2410C"/>

    <!-- OT axis (kept) -->
    <line x1="680" y1="360" x2="820" y2="220" stroke="#C2410C" stroke-width="2.5" marker-end="url(#arOT)"/>
    <text x="825" y="215" font-size="13" font-weight="bold" fill="#C2410C">v̂_OT</text>

    <!-- OA perpendicular -->
    <line x1="680" y1="360" x2="780" y2="460" stroke="#7C3AED" stroke-width="2.5" marker-end="url(#arOA)"/>
    <text x="788" y="475" font-size="13" font-weight="bold" fill="#7C3AED">v̂_OA⊥</text>

    <!-- right angle marker -->
    <path d="M 697 377 L 705 385 L 713 377" fill="none" stroke="#1E3A5F" stroke-width="1.5"/>
    <text x="720" y="395" font-size="11" fill="#1E3A5F" font-style="italic">90°</text>

    <!-- example step -->
    <g>
      <circle cx="780" cy="260" r="7" fill="#DC2626" stroke="#1E3A5F" stroke-width="1.5"/>
      <text x="795" y="255" font-size="11" fill="#1E3A5F">第 t 步: OT +2.3σ / OA⊥ +0.1σ</text>
      <text x="795" y="272" font-size="11" fill="#3D4F65">→ 只沿 OT 轴修正，不扰动 OA</text>
    </g>

    <text x="680" y="525" text-anchor="middle" font-size="12" fill="#3D4F65">两轴独立：OT 与 OA 可分别判定与纠偏</text>
  </g>
</svg>