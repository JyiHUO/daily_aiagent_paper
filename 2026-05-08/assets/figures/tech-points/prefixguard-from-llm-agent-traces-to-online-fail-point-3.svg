<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4B8BDA"/>
    </marker>
    <linearGradient id="gobs" x1="0" x2="1">
      <stop offset="0" stop-color="#BFDBFE"/>
      <stop offset="1" stop-color="#93C5FD"/>
    </linearGradient>
    <linearGradient id="ghid" x1="0" x2="1">
      <stop offset="0" stop-color="#E5E7EB"/>
      <stop offset="1" stop-color="#CBD5E1"/>
    </linearGradient>
  </defs>

  <text x="450" y="38" text-anchor="middle" font-size="22" font-weight="700" fill="#1E3A5F">AUPRC 可观测性上界</text>
  <text x="450" y="62" text-anchor="middle" font-size="13" fill="#3D4F65">失败前缀里，只有一部分留下了可见证据</text>

  <!-- Left: failure prefix decomposition -->
  <rect x="50" y="95" width="300" height="180" rx="10" fill="#EFF6FF" stroke="#4B8BDA" stroke-width="1.5"/>
  <text x="200" y="118" text-anchor="middle" font-size="14" font-weight="700" fill="#1E3A5F">失败前缀 (p=1)</text>

  <rect x="70" y="135" width="192" height="50" fill="url(#gobs)" stroke="#2563EB"/>
  <text x="166" y="157" text-anchor="middle" font-size="13" font-weight="700" fill="#1E3A5F">Observable (π)</text>
  <text x="166" y="174" text-anchor="middle" font-size="11" fill="#3D4F65">有蛛丝马迹</text>

  <rect x="262" y="135" width="68" height="50" fill="url(#ghid)" stroke="#94A3B8"/>
  <text x="296" y="160" text-anchor="middle" font-size="12" font-weight="700" fill="#1E3A5F">Hidden</text>
  <text x="296" y="175" text-anchor="middle" font-size="10" fill="#3D4F65">1−π</text>

  <text x="200" y="215" text-anchor="middle" font-size="12" fill="#3D4F65">P(x|p=1) = π·P_obs + (1−π)·P_neg</text>
  <text x="200" y="252" text-anchor="middle" font-size="11" fill="#3D4F65">TF-IDF MPE 探针估计 π̂</text>

  <!-- Arrow -->
  <path d="M355,180 L445,180" stroke="#4B8BDA" stroke-width="2.5" fill="none" marker-end="url(#ar)"/>
  <text x="400" y="172" text-anchor="middle" font-size="11" fill="#1E3A5F">推导</text>

  <!-- Right: ceiling formula -->
  <rect x="450" y="95" width="410" height="180" rx="10" fill="#FEF3E7" stroke="#F59E0B" stroke-width="1.5"/>
  <text x="655" y="118" text-anchor="middle" font-size="14" font-weight="700" fill="#1E3A5F">AUPRC 上界 A(π, r)</text>
  <text x="655" y="150" text-anchor="middle" font-size="13" fill="#1E3A5F">AUPRC(f) ≤ A(π, r)</text>
  <text x="655" y="185" text-anchor="middle" font-size="11" fill="#3D4F65">= π + r(1−π)²/(1−πr) + rπ(1−π)(1−r)/(1−πr)²·ln(1/πr)</text>
  <text x="655" y="245" text-anchor="middle" font-size="12" font-weight="600" fill="#B45309">再强的监控器也到不了 1.0</text>

  <!-- Diagnosis box -->
  <rect x="50" y="305" width="810" height="255" rx="10" fill="#F8FAFC" stroke="#4B8BDA" stroke-width="1.5"/>
  <text x="455" y="332" text-anchor="middle" font-size="15" font-weight="700" fill="#1E3A5F">诊断：AUPRC 差距 = 监控器弱？还是证据根本不在？</text>

  <!-- WebArena -->
  <rect x="90" y="360" width="340" height="175" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.5"/>
  <text x="260" y="385" text-anchor="middle" font-size="14" font-weight="700" fill="#1E3A5F">WebArena  (r = 0.36, 高 prevalence)</text>

  <rect x="120" y="420" width="280" height="18" fill="#E5E7EB"/>
  <rect x="120" y="420" width="252" height="18" fill="#2563EB"/>
  <text x="410" y="434" font-size="11" fill="#1E3A5F">0.900</text>
  <text x="115" y="414" font-size="10" fill="#3D4F65">AUPRC</text>

  <rect x="120" y="460" width="280" height="18" fill="#E5E7EB"/>
  <rect x="120" y="460" width="218" height="18" fill="#F59E0B"/>
  <text x="410" y="474" font-size="11" fill="#1E3A5F">π ≈ 0.78</text>
  <text x="115" y="454" font-size="10" fill="#3D4F65">所需 π</text>

  <text x="260" y="510" text-anchor="middle" font-size="11" fill="#B45309">证据充足，高分来自高 r</text>

  <!-- τ²-Bench -->
  <rect x="480" y="360" width="340" height="175" rx="8" fill="#FEF3E7" stroke="#F59E0B" stroke-width="1.5"/>
  <text x="650" y="385" text-anchor="middle" font-size="14" font-weight="700" fill="#1E3A5F">τ²-Bench  (r 较低, 低 prevalence)</text>

  <rect x="510" y="420" width="280" height="18" fill="#E5E7EB"/>
  <rect x="510" y="420" width="199" height="18" fill="#2563EB"/>
  <text x="800" y="434" font-size="11" fill="#1E3A5F">0.710</text>

  <rect x="510" y="460" width="280" height="18" fill="#E5E7EB"/>
  <rect x="510" y="460" width="174" height="18" fill="#F59E0B"/>
  <text x="800" y="474" font-size="11" fill="#1E3A5F">π ≈ 0.62</text>

  <text x="650" y="510" text-anchor="middle" font-size="11" fill="#B45309">分数低但更接近上界，瓶颈是 r</text>

  <text x="450" y="585" text-anchor="middle" font-size="11" fill="#3D4F65" font-style="italic">别只看 AUPRC 数字——先看它离可观测上界还有多远</text>
</svg>