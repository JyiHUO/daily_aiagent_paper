<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" font-family="Helvetica,Arial,sans-serif">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#E74C3C"/>
    </marker>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#2E8B57"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="450" y="36" text-anchor="middle" font-size="22" font-weight="bold" fill="#1E3A5F">排名高 ≠ 能当警报用</text>
  <text x="450" y="60" text-anchor="middle" font-size="13" fill="#3D4F65">在 FAR ≤ 10% 下看首警时机，而不是只看 AUPRC</text>

  <!-- ========== LEFT: WebArena (bad early alert) ========== -->
  <g>
    <rect x="50" y="95" width="370" height="210" rx="10" fill="#FDECEA" stroke="#E74C3C" stroke-width="2"/>
    <text x="235" y="120" text-anchor="middle" font-size="16" font-weight="bold" fill="#1E3A5F">WebArena · 终局 triage</text>
    <text x="235" y="140" text-anchor="middle" font-size="12" fill="#3D4F65">AUPRC 0.900，但早期 recall 仅 0.007</text>

    <!-- trajectory bar -->
    <rect x="80" y="185" width="310" height="26" rx="4" fill="#EFF6FF" stroke="#4B8BDA"/>
    <text x="85" y="178" font-size="11" fill="#3D4F65">start</text>
    <text x="390" y="178" text-anchor="end" font-size="11" fill="#E74C3C">fail</text>

    <!-- alert near end -->
    <line x1="370" y1="165" x2="370" y2="183" stroke="#E74C3C" stroke-width="3" marker-end="url(#ar)"/>
    <text x="370" y="240" text-anchor="middle" font-size="12" font-weight="bold" fill="#E74C3C">⚠ 首警（来不及干预）</text>

    <text x="235" y="280" text-anchor="middle" font-size="12" fill="#3D4F65">警报几乎挤在快失败那一步才响</text>
  </g>

  <!-- ========== RIGHT: TerminalBench (good early alert) ========== -->
  <g>
    <rect x="480" y="95" width="370" height="210" rx="10" fill="#E8F5EC" stroke="#2E8B57" stroke-width="2"/>
    <text x="665" y="120" text-anchor="middle" font-size="16" font-weight="bold" fill="#1E3A5F">TerminalBench · 可干预监控</text>
    <text x="665" y="140" text-anchor="middle" font-size="12" fill="#3D4F65">AUPRC 较低，却能在窗口前就预警</text>

    <!-- trajectory bar -->
    <rect x="510" y="185" width="310" height="26" rx="4" fill="#EFF6FF" stroke="#4B8BDA"/>
    <text x="515" y="178" font-size="11" fill="#3D4F65">start</text>
    <text x="820" y="178" text-anchor="end" font-size="11" fill="#E74C3C">fail</text>

    <!-- safe-mode zone -->
    <rect x="650" y="185" width="170" height="26" fill="#2E8B57" opacity="0.18"/>

    <!-- pre-window early alert -->
    <line x1="650" y1="165" x2="650" y2="183" stroke="#2E8B57" stroke-width="3" marker-end="url(#ag)"/>
    <text x="650" y="240" text-anchor="middle" font-size="12" font-weight="bold" fill="#2E8B57">⚡ 早期首警 · lead ≈ 21.5%</text>

    <text x="665" y="280" text-anchor="middle" font-size="12" fill="#3D4F65">还能回滚工具 / 切 safe-mode</text>
  </g>

  <!-- vs divider -->
  <circle cx="450" cy="200" r="22" fill="#1E3A5F"/>
  <text x="450" y="206" text-anchor="middle" font-size="14" font-weight="bold" fill="#FFFFFF">VS</text>

  <!-- ========== Metric comparison ========== -->
  <g>
    <rect x="50" y="330" width="800" height="180" rx="10" fill="#EFF6FF" stroke="#4B8BDA" stroke-width="1.5"/>
    <text x="450" y="358" text-anchor="middle" font-size="15" font-weight="bold" fill="#1E3A5F">FAR ≤ 10% 下的 first-alert 诊断</text>

    <!-- headers -->
    <text x="300" y="390" text-anchor="middle" font-size="12" font-weight="bold" fill="#3D4F65">AUPRC</text>
    <text x="480" y="390" text-anchor="middle" font-size="12" font-weight="bold" fill="#3D4F65">any-alert recall</text>
    <text x="640" y="390" text-anchor="middle" font-size="12" font-weight="bold" fill="#3D4F65">pre-window early</text>
    <text x="790" y="390" text-anchor="middle" font-size="12" font-weight="bold" fill="#3D4F65">lead time</text>

    <!-- WebArena row -->
    <text x="150" y="425" font-size="13" font-weight="bold" fill="#E74C3C">WebArena</text>
    <text x="300" y="425" text-anchor="middle" font-size="13" fill="#1E3A5F">0.900</text>
    <text x="480" y="425" text-anchor="middle" font-size="13" fill="#3D4F65">—</text>
    <text x="640" y="425" text-anchor="middle" font-size="13" fill="#E74C3C">0.007</text>
    <text x="790" y="425" text-anchor="middle" font-size="13" fill="#E74C3C">≈ 0</text>

    <line x1="70" y1="438" x2="830" y2="438" stroke="#B8CCE0" stroke-dasharray="3,3"/>

    <!-- TerminalBench row -->
    <text x="150" y="470" font-size="13" font-weight="bold" fill="#2E8B57">TerminalBench</text>
    <text x="300" y="470" text-anchor="middle" font-size="13" fill="#3D4F65">低</text>
    <text x="480" y="470" text-anchor="middle" font-size="13" fill="#2E8B57">0.965</text>
    <text x="640" y="470" text-anchor="middle" font-size="13" fill="#2E8B57">0.178</text>
    <text x="790" y="470" text-anchor="middle" font-size="13" fill="#2E8B57">0.215</text>

    <text x="450" y="498" text-anchor="middle" font-size="12" fill="#1E3A5F" font-style="italic">做 Agent 护栏：看 operating-point，不只看排序指标</text>
  </g>
</svg>