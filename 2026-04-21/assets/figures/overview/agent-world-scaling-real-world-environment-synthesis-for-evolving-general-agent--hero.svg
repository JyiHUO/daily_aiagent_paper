<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 780" font-family="'Segoe UI',system-ui,Arial,sans-serif">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a0e27"/>
      <stop offset="50%" stop-color="#0f1538"/>
      <stop offset="100%" stop-color="#0a0e27"/>
    </linearGradient>
    <linearGradient id="blueGlow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a3a6e"/>
      <stop offset="100%" stop-color="#0d1f3c"/>
    </linearGradient>
    <linearGradient id="greenGlow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a5c3a"/>
      <stop offset="100%" stop-color="#0d2e1e"/>
    </linearGradient>
    <linearGradient id="purpleGlow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3a1a6e"/>
      <stop offset="100%" stop-color="#1c0d3c"/>
    </linearGradient>
    <linearGradient id="orangeGlow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6e3a1a"/>
      <stop offset="100%" stop-color="#3c1c0d"/>
    </linearGradient>
    <linearGradient id="cyanGlow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0e4d5e"/>
      <stop offset="100%" stop-color="#072a33"/>
    </linearGradient>
    <linearGradient id="redGlow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6e1a2a"/>
      <stop offset="100%" stop-color="#3c0d15"/>
    </linearGradient>
    <linearGradient id="arrowGrad1" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#4a90d9"/>
      <stop offset="100%" stop-color="#64d98a"/>
    </linearGradient>
    <linearGradient id="arrowGrad2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#64d98a"/>
      <stop offset="100%" stop-color="#a78bfa"/>
    </linearGradient>
    <linearGradient id="arrowGrad3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#f59e42"/>
    </linearGradient>
    <linearGradient id="loopGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f59e42"/>
      <stop offset="50%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#4a90d9"/>
    </linearGradient>
    <linearGradient id="centerGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1e3a5f" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#0a1628" stop-opacity="0.4"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softGlow">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <marker id="arrowBlue" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 Z" fill="#4a90d9"/>
    </marker>
    <marker id="arrowGreen" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 Z" fill="#64d98a"/>
    </marker>
    <marker id="arrowPurple" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 Z" fill="#a78bfa"/>
    </marker>
    <marker id="arrowOrange" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 Z" fill="#f59e42"/>
    </marker>
    <marker id="arrowRed" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 Z" fill="#ef4444"/>
    </marker>
    <marker id="arrowCyan" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 Z" fill="#22d3ee"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1100" height="780" fill="url(#bgGrad)"/>

  <!-- Subtle grid -->
  <g opacity="0.04" stroke="#4a90d9" stroke-width="0.5">
    <line x1="0" y1="0" x2="1100" y2="780"/>
    <line x1="1100" y1="0" x2="0" y2="780"/>
    <circle cx="550" cy="420" r="300" fill="none"/>
    <circle cx="550" cy="420" r="200" fill="none"/>
  </g>

  <!-- Title -->
  <text x="550" y="42" text-anchor="middle" fill="#e2e8f0" font-size="26" font-weight="700" letter-spacing="1">Agent-World</text>
  <text x="550" y="68" text-anchor="middle" fill="#94a3b8" font-size="13" letter-spacing="0.5">Scaling Real-World Environment Synthesis for Evolving General Agent Intelligence</text>

  <!-- ========== OUTER RING: 6 NODES IN CLOCKWISE LOOP ========== -->

  <!-- NODE 1: Real-World Topics (top-left) -->
  <g transform="translate(135, 190)">
    <rect x="-105" y="-52" width="210" height="104" rx="16" fill="url(#blueGlow)" stroke="#4a90d9" stroke-width="1.8" opacity="0.92"/>
    <text x="0" y="-22" text-anchor="middle" fill="#93c5fd" font-size="11" font-weight="600" letter-spacing="1">🌐 REAL-WORLD TOPICS</text>
    <text x="0" y="-2" text-anchor="middle" fill="#cbd5e1" font-size="10">MCP Servers · Open-Source</text>
    <text x="0" y="14" text-anchor="middle" fill="#cbd5e1" font-size="10">Tools · Industrial PRDs</text>
    <text x="0" y="34" text-anchor="middle" fill="#64748b" font-size="9" font-style="italic">Thousands of themes</text>
  </g>

  <!-- NODE 2: Database Mining (top-right) -->
  <g transform="translate(420, 150)">
    <rect x="-115" y="-50" width="230" height="100" rx="16" fill="url(#cyanGlow)" stroke="#22d3ee" stroke-width="1.8" opacity="0.92"/>
    <text x="0" y="-22" text-anchor="middle" fill="#67e8f9" font-size="11" font-weight="600" letter-spacing="1">🔍 DEEP RESEARCH AGENT</text>
    <text x="0" y="-2" text-anchor="middle" fill="#cbd5e1" font-size="10">Internet mining → Real DBs</text>
    <text x="0" y="14" text-anchor="middle" fill="#cbd5e1" font-size="10">Multi-round DB complexification</text>
    <text x="0" y="34" text-anchor="middle" fill="#64748b" font-size="9" font-style="italic">No hallucinated data</text>
  </g>

  <!-- NODE 3: Tool & Env Construction (right) -->
  <g transform="translate(770, 190)">
    <rect x="-125" y="-52" width="250" height="104" rx="16" fill="url(#greenGlow)" stroke="#64d98a" stroke-width="1.8" opacity="0.92"/>
    <text x="0" y="-26" text-anchor="middle" fill="#86efac" font-size="11" font-weight="600" letter-spacing="1">🛠️ ENVIRONMENT BUILDING</text>
    <text x="0" y="-6" text-anchor="middle" fill="#cbd5e1" font-size="10">Coding Agent → Python tools</text>
    <text x="0" y="10" text-anchor="middle" fill="#cbd5e1" font-size="10">Unit-test cross-validation</text>
    <line x1="-90" y1="24" x2="90" y2="24" stroke="#334155" stroke-width="0.5"/>
    <text x="0" y="40" text-anchor="middle" fill="#4ade80" font-size="10" font-weight="600">1,978 Envs · 19,822 Tools</text>
  </g>

  <!-- NODE 4: Verifiable Task Synthesis (bottom-right) -->
  <g transform="translate(870, 410)">
    <rect x="-130" y="-60" width="200" height="120" rx="16" fill="url(#purpleGlow)" stroke="#a78bfa" stroke-width="1.8" opacity="0.92"/>
    <text x="-30" y="-34" text-anchor="middle" fill="#c4b5fd" font-size="11" font-weight="600" letter-spacing="1">📋 TASK SYNTHESIS</text>
    <text x="-30" y="-12" text-anchor="middle" fill="#cbd5e1" font-size="10">Graph-based: tool DAG</text>
    <text x="-30" y="4" text-anchor="middle" fill="#cbd5e1" font-size="10">+ random walk → tasks</text>
    <line x1="-110" y1="18" x2="50" y2="18" stroke="#334155" stroke-width="0.5"/>
    <text x="-30" y="34" text-anchor="middle" fill="#cbd5e1" font-size="10">Programmatic: Python</text>
    <text x="-30" y="50" text-anchor="middle" fill="#cbd5e1" font-size="10">scripts + verify scripts</text>
  </g>

  <!-- NODE 5: Arena Evaluation (bottom) -->
  <g transform="translate(550, 580)">
    <rect x="-130" y="-52" width="260" height="104" rx="20" fill="url(#orangeGlow)" stroke="#f59e42" stroke-width="2" opacity="0.95"/>
    <text x="0" y="-26" text-anchor="middle" fill="#fbbf24" font-size="12" font-weight="700" letter-spacing="1">🏟️ SELF-EVOLVING ARENA</text>
    <text x="0" y="-4" text-anchor="middle" fill="#cbd5e1" font-size="10">Sandbox execution + rubric scoring</text>
    <text x="0" y="14" text-anchor="middle" fill="#cbd5e1" font-size="10">GRPO RL · 80K-token trajectories</text>
    <text x="0" y="34" text-anchor="middle" fill="#fbbf24" font-size="10" font-weight="600">Agent-Tool-DB closed-loop rollout</text>
  </g>

  <!-- NODE 6: Diagnosis & Targeted Training (bottom-left) -->
  <g transform="translate(175, 470)">
    <rect x="-125" y="-58" width="250" height="116" rx="16" fill="url(#redGlow)" stroke="#ef4444" stroke-width="1.8" opacity="0.92"/>
    <text x="0" y="-32" text-anchor="middle" fill="#fca5a5" font-size="11" font-weight="600" letter-spacing="1">🔬 DIAGNOSIS + TARGETING</text>
    <text x="0" y="-10" text-anchor="middle" fill="#cbd5e1" font-size="10">Diagnostic Agent analyzes</text>
    <text x="0" y="6" text-anchor="middle" fill="#cbd5e1" font-size="10">failure trajectories</text>
    <line x1="-100" y1="20" x2="100" y2="20" stroke="#334155" stroke-width="0.5"/>
    <text x="0" y="36" text-anchor="middle" fill="#cbd5e1" font-size="10">→ Weak envs identified</text>
    <text x="0" y="52" text-anchor="middle" fill="#fca5a5" font-size="10" font-weight="600">→ Targeted task generation</text>
  </g>

  <!-- ========== ARROWS connecting nodes clockwise ========== -->

  <!-- Arrow 1→2: Topics → Mining -->
  <path d="M240,175 Q320,140 305,150" fill="none" stroke="#4a90d9" stroke-width="2.2" marker-end="url(#arrowCyan)" opacity="0.85"/>

  <!-- Arrow 2→3: Mining → Env Building -->
  <path d="M535,150 Q590,155 645,178" fill="none" stroke="#22d3ee" stroke-width="2.2" marker-end="url(#arrowGreen)" opacity="0.85"/>

  <!-- Arrow 3→4: Env Building → Task Synthesis -->
  <path d="M830,294 Q850,330 845,350" fill="none" stroke="#64d98a" stroke-width="2.2" marker-end="url(#arrowPurple)" opacity="0.85"/>

  <!-- Arrow 4→5: Task Synthesis → Arena -->
  <path d="M790,470 Q720,530 680,545" fill="none" stroke="#a78bfa" stroke-width="2.2" marker-end="url(#arrowOrange)" opacity="0.85"/>

  <!-- Arrow 5→6: Arena → Diagnosis -->
  <path d="M420,570 Q340,540 300,510" fill="none" stroke="#f59e42" stroke-width="2.2" marker-end="url(#arrowRed)" opacity="0.85"/>

  <!-- Arrow 6→1: Diagnosis → back to Topics/Env (the evolution loop) -->
  <path d="M130,412 Q90,340 100,280 Q110,240 130,225" fill="none" stroke="#ef4444" stroke-width="2.5" stroke-dasharray="8,4" marker-end="url(#arrowBlue)" opacity="0.8" filter="url(#glow)"/>

  <!-- ========== CENTER: Co-Evolution indicator ========== -->
  <g transform="translate(500, 370)">
    <ellipse cx="0" cy="0" rx="110" ry="55" fill="url(#centerGrad)" stroke="#475569" stroke-width="1" opacity="0.7"/>
    <text x="0" y="-14" text-anchor="middle" fill="#fbbf24" font-size="13" font-weight="700" filter="url(#softGlow)">CO-EVOLUTION</text>
    <text x="0" y="8" text-anchor="middle" fill="#94a3b8" font-size="10">Env complexity ↑</text>
    <text x="0" y="24" text-anchor="middle" fill="#94a3b8" font-size="10">Agent capability ↑</text>
    <!-- circular arrows around center -->
    <path d="M-80,-35 A90,50 0 0,1 80,-35" fill="none" stroke="#fbbf2466" stroke-width="1.5" stroke-dasharray="4,3"/>
    <path d="M80,35 A90,50 0 0,1 -80,35" fill="none" stroke="#fbbf2466" stroke-width="1.5" stroke-dasharray="4,3"/>
  </g>

  <!-- ========== FLOW LABELS on arrows ========== -->
  <text x="280" y="148" text-anchor="middle" fill="#67e8f9" font-size="9" opacity="0.8">mine</text>
  <text x="598" y="158" text-anchor="middle" fill="#4ade80" font-size="9" opacity="0.8">build</text>
  <text x="862" y="328" text-anchor="middle" fill="#a78bfa" font-size="9" opacity="0.8">synthesize</text>
  <text x="740" y="548" text-anchor="middle" fill="#f59e42" font-size="9" opacity="0.8">evaluate</text>
  <text x="352" y="548" text-anchor="middle" fill="#ef4444" font-size="9" opacity="0.8">diagnose</text>
  <text x="80" y="320" text-anchor="middle" fill="#93c5fd" font-size="9" opacity="0.8" transform="rotate(-90,80,320)">evolve ↻</text>

  <!-- ========== RESULT BADGE ========== -->
  <g transform="translate(550, 700)">
    <rect x="-220" y="-22" width="440" height="44" rx="22" fill="none" stroke="#475569" stroke-width="1" opacity="0.6"/>
    <text x="0" y="6" text-anchor="middle" fill="#e2e8f0" font-size="12">
      <tspan fill="#4ade80" font-weight="700">8B/14B models</tspan>
      <tspan fill="#94a3b8"> outperform proprietary models across </tspan>
      <tspan fill="#fbbf24" font-weight="700">23 benchmarks</tspan>
    </text>
  </g>

  <!-- Subtle decorative dots -->
  <circle cx="60" cy="100" r="2" fill="#4a90d9" opacity="0.2"/>
  <circle cx="1040" cy="120" r="2" fill="#64d98a" opacity="0.2"/>
  <circle cx="1050" cy="650" r="2" fill="#a78bfa" opacity="0.2"/>
  <circle cx="50" cy="660" r="2" fill="#ef4444" opacity="0.2"/>
  <circle cx="550" cy="100" r="1.5" fill="#fbbf24" opacity="0.15"/>

  <!-- Step numbers -->
  <g font-size="9" font-weight="700" fill="#0a0e27">
    <circle cx="135" cy="130" r="11" fill="#4a90d9" opacity="0.9"/>
    <text x="135" y="134" text-anchor="middle" fill="#0a0e27" font-size="10">1</text>

    <circle cx="420" cy="92" r="11" fill="#22d3ee" opacity="0.9"/>
    <text x="420" y="96" text-anchor="middle" fill="#0a0e27" font-size="10">2</text>

    <circle cx="770" cy="130" r="11" fill="#64d98a" opacity="0.9"/>
    <text x="770" y="134" text-anchor="middle" fill="#0a0e27" font-size="10">3</text>

    <circle cx="870" cy="342" r="11" fill="#a78bfa" opacity="0.9"/>
    <text x="870" y="346" text-anchor="middle" fill="#0a0e27" font-size="10">4</text>

    <circle cx="550" cy="520" r="11" fill="#f59e42" opacity="0.9"/>
    <text x="550" y="524" text-anchor="middle" fill="#0a0e27" font-size="10">5</text>

    <circle cx="175" cy="404" r="11" fill="#ef4444" opacity="0.9"/>
    <text x="175" y="408" text-anchor="middle" fill="#0a0e27" font-size="10">6</text>
  </g>
</svg>