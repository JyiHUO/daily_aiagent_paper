<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1200" y2="750" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0f1729"/>
      <stop offset="100%" stop-color="#1a2744"/>
    </linearGradient>
    <linearGradient id="redGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ff6b6b"/>
      <stop offset="100%" stop-color="#ee5a24"/>
    </linearGradient>
    <linearGradient id="greenGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2ed573"/>
      <stop offset="100%" stop-color="#26de81"/>
    </linearGradient>
    <linearGradient id="blueGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4facfe"/>
      <stop offset="100%" stop-color="#00f2fe"/>
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
    <linearGradient id="orangeGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f7971e"/>
      <stop offset="100%" stop-color="#ffd200"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softShadow">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#000" flood-opacity="0.3"/>
    </filter>
    <marker id="arrowRed" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#ff6b6b"/>
    </marker>
    <marker id="arrowGreen" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#2ed573"/>
    </marker>
    <marker id="arrowBlue" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#4facfe"/>
    </marker>
    <marker id="arrowWhite" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#ffffff" opacity="0.6"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1200" height="750" fill="url(#bgGrad)"/>
  
  <!-- Subtle grid pattern -->
  <g opacity="0.04" stroke="#fff" stroke-width="0.5">
    <line x1="0" y1="150" x2="1200" y2="150"/><line x1="0" y1="300" x2="1200" y2="300"/>
    <line x1="0" y1="450" x2="1200" y2="450"/><line x1="0" y1="600" x2="1200" y2="600"/>
    <line x1="200" y1="0" x2="200" y2="750"/><line x1="400" y1="0" x2="400" y2="750"/>
    <line x1="600" y1="0" x2="600" y2="750"/><line x1="800" y1="0" x2="800" y2="750"/>
    <line x1="1000" y1="0" x2="1000" y2="750"/>
  </g>

  <!-- Title -->
  <text x="600" y="42" text-anchor="middle" fill="#ffffff" font-size="22" font-weight="700" letter-spacing="0.5">On the Reliability of Computer Use Agents</text>
  <text x="600" y="66" text-anchor="middle" fill="#8899bb" font-size="13">Why does the same task succeed sometimes and fail other times — and how to fix it?</text>

  <!-- ===== LEFT SIDE: UNRELIABLE EXECUTION ===== -->
  <!-- Section label -->
  <text x="220" y="105" text-anchor="middle" fill="#ff6b6b" font-size="15" font-weight="700" opacity="0.9">UNRELIABLE</text>
  <line x1="140" y1="112" x2="300" y2="112" stroke="#ff6b6b" stroke-width="1" opacity="0.4"/>

  <!-- Task origin -->
  <rect x="170" y="130" width="100" height="40" rx="8" fill="#1e3054" stroke="#4facfe" stroke-width="1.5"/>
  <text x="220" y="152" text-anchor="middle" fill="#4facfe" font-size="11" font-weight="600">TASK</text>
  <text x="220" y="164" text-anchor="middle" fill="#6688aa" font-size="8">"Adjust table format"</text>

  <!-- Divergent execution paths (fan out) -->
  <!-- Path lines from task to outcomes -->
  <path d="M 220 170 C 220 195, 90 210, 80 240" stroke="#ff6b6b" stroke-width="1.5" fill="none" opacity="0.6"/>
  <path d="M 220 170 C 220 195, 155 210, 148 240" stroke="#ff6b6b" stroke-width="1.5" fill="none" opacity="0.6"/>
  <path d="M 220 170 C 220 195, 220 210, 220 240" stroke="#2ed573" stroke-width="1.5" fill="none" opacity="0.6"/>
  <path d="M 220 170 C 220 195, 285 210, 290 240" stroke="#ff6b6b" stroke-width="1.5" fill="none" opacity="0.6"/>
  <path d="M 220 170 C 220 195, 355 210, 360 240" stroke="#2ed573" stroke-width="1.5" fill="none" opacity="0.6"/>

  <!-- Execution attempt circles -->
  <circle cx="80" cy="252" r="14" fill="none" stroke="#ff6b6b" stroke-width="2"/>
  <text x="80" y="256" text-anchor="middle" fill="#ff6b6b" font-size="14">✗</text>
  <text x="80" y="276" text-anchor="middle" fill="#667799" font-size="8">Run 1</text>

  <circle cx="148" cy="252" r="14" fill="none" stroke="#ff6b6b" stroke-width="2"/>
  <text x="148" y="256" text-anchor="middle" fill="#ff6b6b" font-size="14">✗</text>
  <text x="148" y="276" text-anchor="middle" fill="#667799" font-size="8">Run 2</text>

  <circle cx="220" cy="252" r="14" fill="none" stroke="#2ed573" stroke-width="2"/>
  <text x="220" y="256" text-anchor="middle" fill="#2ed573" font-size="14">✓</text>
  <text x="220" y="276" text-anchor="middle" fill="#667799" font-size="8">Run 3</text>

  <circle cx="290" cy="252" r="14" fill="none" stroke="#ff6b6b" stroke-width="2"/>
  <text x="290" y="256" text-anchor="middle" fill="#ff6b6b" font-size="14">✗</text>
  <text x="290" y="276" text-anchor="middle" fill="#667799" font-size="8">Run 4</text>

  <circle cx="360" cy="252" r="14" fill="none" stroke="#2ed573" stroke-width="2"/>
  <text x="360" y="256" text-anchor="middle" fill="#2ed573" font-size="14">✓</text>
  <text x="360" y="276" text-anchor="middle" fill="#667799" font-size="8">Run 5</text>

  <!-- Reliability gap highlight -->
  <rect x="52" y="292" width="336" height="52" rx="10" fill="#ff6b6b" fill-opacity="0.08" stroke="#ff6b6b" stroke-width="1" stroke-dasharray="4 3"/>
  <text x="220" y="311" text-anchor="middle" fill="#ff9999" font-size="12" font-weight="600">Pass@10 ≈ 78%  but  Pass¹⁰ ≈ 36%</text>
  <text x="220" y="330" text-anchor="middle" fill="#887799" font-size="10">"Can do it once" ≠ "Can do it every time"</text>

  <!-- ===== CENTER: THREE SOURCES OF UNRELIABILITY ===== -->
  <!-- Central diamond/hub -->
  <text x="600" y="105" text-anchor="middle" fill="#ffd200" font-size="15" font-weight="700" opacity="0.9">THREE SOURCES OF UNRELIABILITY</text>
  <line x1="470" y1="112" x2="730" y2="112" stroke="#ffd200" stroke-width="1" opacity="0.3"/>

  <!-- Source 1: Decoding Randomness -->
  <g filter="softShadow">
    <rect x="460" y="130" width="125" height="78" rx="12" fill="#1e2d4a" stroke="#f7971e" stroke-width="1.5"/>
  </g>
  <circle cx="485" cy="152" r="10" fill="#f7971e" opacity="0.2"/>
  <text x="485" y="156" text-anchor="middle" fill="#f7971e" font-size="13">🎲</text>
  <text x="522" y="155" text-anchor="middle" fill="#f7971e" font-size="11" font-weight="700" dx="12">Randomness</text>
  <text x="522" y="172" text-anchor="middle" fill="#8899aa" font-size="9">Decoding noise</text>
  <text x="522" y="184" text-anchor="middle" fill="#8899aa" font-size="9">Environment drift</text>
  <text x="522" y="198" text-anchor="middle" fill="#665544" font-size="8" font-style="italic">temp=0 ≠ reliable</text>

  <!-- Source 2: Instruction Ambiguity -->
  <g filter="softShadow">
    <rect x="537" y="228" width="125" height="78" rx="12" fill="#1e2d4a" stroke="#a855f7" stroke-width="1.5"/>
  </g>
  <circle cx="562" cy="250" r="10" fill="#a855f7" opacity="0.2"/>
  <text x="562" y="254" text-anchor="middle" fill="#a855f7" font-size="13">❓</text>
  <text x="600" y="253" text-anchor="middle" fill="#a855f7" font-size="11" font-weight="700" dx="12">Ambiguity</text>
  <text x="600" y="270" text-anchor="middle" fill="#8899aa" font-size="9">Vague instructions</text>
  <text x="600" y="282" text-anchor="middle" fill="#8899aa" font-size="9">Underspecified goals</text>
  <text x="600" y="296" text-anchor="middle" fill="#cc88ff" font-size="8" font-weight="600" font-style="italic">★ Largest factor</text>

  <!-- Source 3: Planning Variance -->
  <g filter="softShadow">
    <rect x="615" y="130" width="125" height="78" rx="12" fill="#1e2d4a" stroke="#4facfe" stroke-width="1.5"/>
  </g>
  <circle cx="640" cy="152" r="10" fill="#4facfe" opacity="0.2"/>
  <text x="640" y="156" text-anchor="middle" fill="#4facfe" font-size="13">🔀</text>
  <text x="677" y="155" text-anchor="middle" fill="#4facfe" font-size="11" font-weight="700" dx="12">Plan Variance</text>
  <text x="677" y="172" text-anchor="middle" fill="#8899aa" font-size="9">Different strategies</text>
  <text x="677" y="184" text-anchor="middle" fill="#8899aa" font-size="9">each execution</text>
  <text x="677" y="198" text-anchor="middle" fill="#665544" font-size="8" font-style="italic">Some plans are fragile</text>

  <!-- Connecting lines between sources -->
  <line x1="585" y1="196" x2="570" y2="228" stroke="#556677" stroke-width="0.8" stroke-dasharray="3 3" opacity="0.5"/>
  <line x1="648" y1="208" x2="632" y2="228" stroke="#556677" stroke-width="0.8" stroke-dasharray="3 3" opacity="0.5"/>

  <!-- Surprise finding callout -->
  <g filter="softShadow">
    <rect x="460" y="320" width="280" height="38" rx="8" fill="#f7971e" fill-opacity="0.1" stroke="#f7971e" stroke-width="1" stroke-dasharray="5 3"/>
  </g>
  <text x="600" y="337" text-anchor="middle" fill="#f7971e" font-size="10" font-weight="600">⚠ Changing wallpaper alone drops Claude's reliability</text>
  <text x="600" y="351" text-anchor="middle" fill="#998866" font-size="9">20 tasks flip from reliable → unreliable (p&lt;0.05)</text>

  <!-- Arrow from left to center -->
  <path d="M 388 308 C 420 335, 440 335, 460 300" stroke="#ff6b6b" stroke-width="1.2" fill="none" opacity="0.4" marker-end="url(#arrowRed)" stroke-dasharray="4 3"/>

  <!-- ===== RIGHT SIDE: SOLUTIONS & CONVERGENCE ===== -->
  <text x="980" y="105" text-anchor="middle" fill="#2ed573" font-size="15" font-weight="700" opacity="0.9">RELIABLE</text>
  <line x1="900" y1="112" x2="1060" y2="112" stroke="#2ed573" stroke-width="1" opacity="0.4"/>

  <!-- Solution 1: Pre-execution Clarification -->
  <g filter="softShadow">
    <rect x="850" y="130" width="260" height="86" rx="14" fill="#162640" stroke="#a855f7" stroke-width="2"/>
  </g>
  <text x="870" y="153" fill="#a855f7" font-size="18">📝</text>
  <text x="896" y="153" fill="#a855f7" font-size="12" font-weight="700">Pre-Execution Clarification</text>
  <text x="870" y="172" fill="#8899bb" font-size="9.5">Rewrite vague instructions with explicit success criteria</text>
  <text x="870" y="190" fill="#667799" font-size="9" font-style="italic">"Adjust table" → "Set A1:D10 border: black solid, Arial 12pt"</text>
  <rect x="870" y="198" width="100" height="12" rx="3" fill="#a855f7" fill-opacity="0.15"/>
  <text x="920" y="208" text-anchor="middle" fill="#cc99ff" font-size="8" font-weight="600">+48 tasks reliable (GPT-5)</text>

  <!-- Solution 2: Retry with Feedback -->
  <g filter="softShadow">
    <rect x="850" y="230" width="260" height="86" rx="14" fill="#162640" stroke="#2ed573" stroke-width="2"/>
  </g>
  <text x="870" y="253" fill="#2ed573" font-size="18">🔄</text>
  <text x="896" y="253" fill="#2ed573" font-size="12" font-weight="700">Retry with User Feedback</text>
  <text x="870" y="272" fill="#8899bb" font-size="9.5">LLM user simulator provides targeted corrections</text>
  <text x="870" y="289" fill="#667799" font-size="9" font-style="italic">"Border should be solid, not dashed" → Agent corrects</text>
  <rect x="870" y="296" width="130" height="12" rx="3" fill="#2ed573" fill-opacity="0.15"/>
  <text x="935" y="306" text-anchor="middle" fill="#66eea0" font-size="8" font-weight="600">Kimi: Pass³ 35.7% → 63.4%</text>

  <!-- Solution 3: Iterative Plan Refinement -->
  <g filter="softShadow">
    <rect x="850" y="330" width="260" height="78" rx="14" fill="#162640" stroke="#4facfe" stroke-width="2"/>
  </g>
  <text x="870" y="353" fill="#4facfe" font-size="18">🔧</text>
  <text x="896" y="353" fill="#4facfe" font-size="12" font-weight="700">Iterative Plan Refinement</text>
  <text x="870" y="372" fill="#8899bb" font-size="9.5">Distill successful rollouts into structured plans</text>
  <text x="870" y="389" fill="#667799" font-size="9" font-style="italic">Rollouts → extract winning strategy → reuse</text>
  <rect x="870" y="396" width="80" height="12" rx="3" fill="#4facfe" fill-opacity="0.15"/>

  <!-- Convergent paths on right -->
  <g transform="translate(980, 440)">
    <rect x="-60" y="0" width="120" height="40" rx="8" fill="#1e3054" stroke="#2ed573" stroke-width="1.5"/>
    <text x="0" y="16" text-anchor="middle" fill="#2ed573" font-size="11" font-weight="600">TASK</text>
    <text x="0" y="30" text-anchor="middle" fill="#6688aa" font-size="8">Clarified instruction</text>
    
    <path d="M 0 40 C 0 55, -30 60, -30 72" stroke="#2ed573" stroke-width="1.5" fill="none" opacity="0.7"/>
    <path d="M 0 40 C 0 55, 0 60, 0 72" stroke="#2ed573" stroke-width="1.5" fill="none" opacity="0.7"/>
    <path d="M 0 40 C 0 55, 30 60, 30 72" stroke="#2ed573" stroke-width="1.5" fill="none" opacity="0.7"/>
    
    <circle cx="-30" cy="85" r="12" fill="none" stroke="#2ed573" stroke-width="2"/>
    <text x="-30" y="89" text-anchor="middle" fill="#2ed573" font-size="12">✓</text>
    <circle cx="0" cy="85" r="12" fill="none" stroke="#2ed573" stroke-width="2"/>
    <text x="0" y="89" text-anchor="middle" fill="#2ed573" font-size="12">✓</text>
    <circle cx="30" cy="85" r="12" fill="none" stroke="#2ed573" stroke-width="2"/>
    <text x="30" y="89" text-anchor="middle" fill="#2ed573" font-size="12">✓</text>
    <text x="0" y="112" text-anchor="middle" fill="#667799" font-size="8">Consistent success</text>
  </g>

  <!-- Big curved arrow from center solutions zone to right convergent zone -->
  <path d="M 740 270 C 790 290, 820 390, 850 350" stroke="#ffffff" stroke-width="1.5" fill="none" opacity="0.15" marker-end="url(#arrowWhite)"/>

  <!-- ===== BOTTOM: KEY INSIGHT BANNER ===== -->
  <rect x="60" y="580" width="1080" height="100" rx="16" fill="#0d1a2e" stroke="#334466" stroke-width="1"/>
  
  <!-- Left insight -->
  <g transform="translate(180, 610)">
    <rect x="-90" y="-10" width="180" height="60" rx="10" fill="#ff6b6b" fill-opacity="0.06" stroke="#ff6b6b" stroke-width="1" stroke-opacity="0.3"/>
    <text x="0" y="10" text-anchor="middle" fill="#ff9999" font-size="11" font-weight="700">Without Clarification</text>
    <text x="0" y="28" text-anchor="middle" fill="#ff6b6b" font-size="18" font-weight="800">5× retry</text>
    <text x="0" y="42" text-anchor="middle" fill="#887766" font-size="9">Still unreliable</text>
  </g>

  <!-- VS -->
  <text x="380" y="635" text-anchor="middle" fill="#556677" font-size="14" font-weight="700">vs</text>

  <!-- Right insight -->
  <g transform="translate(540, 610)">
    <rect x="-90" y="-10" width="180" height="60" rx="10" fill="#2ed573" fill-opacity="0.06" stroke="#2ed573" stroke-width="1" stroke-opacity="0.3"/>
    <text x="0" y="10" text-anchor="middle" fill="#66eea0" font-size="11" font-weight="700">With Clarification</text>
    <text x="0" y="28" text-anchor="middle" fill="#2ed573" font-size="18" font-weight="800">1× run</text>
    <text x="0" y="42" text-anchor="middle" fill="#778877" font-size="9">Matches or exceeds 5× retry</text>
  </g>

  <!-- Arrow between them -->
  <path d="M 300 632 L 350 632" stroke="#ffd200" stroke-width="2" fill="none" marker-end="url(#arrowWhite)" opacity="0.5"/>
  
  <!-- Key number callout -->
  <g transform="translate(820, 610)">
    <rect x="-10" y="-10" width="260" height="60" rx="10" fill="#ffd200" fill-opacity="0.05" stroke="#ffd200" stroke-width="1" stroke-opacity="0.3"/>
    <text x="120" y="10" text-anchor="middle" fill="#ffd200" font-size="11" font-weight="700">McNemar Test (GPT-5 + Clarify)</text>
    <text x="120" y="30" text-anchor="middle" fill="#ffd200" font-size="16" font-weight="800">b − c = 68 tasks improved</text>
    <text x="120" y="44" text-anchor="middle" fill="#998866" font-size="9">p &lt; 0.05, largest effect across all interventions</text>
  </g>

  <!-- ===== STATISTICAL METHOD BADGE ===== -->
  <rect x="60" y="695" width="220" height="30" rx="6" fill="#1a2744" stroke="#334466" stroke-width="0.8"/>
  <text x="70" y="714" fill="#556688" font-size="9">Method: McNemar + Wilcoxon signed-rank tests</text>

  <!-- Benchmark badge -->
  <rect x="300" y="695" width="160" height="30" rx="6" fill="#1a2744" stroke="#334466" stroke-width="0.8"/>
  <text x="310" y="714" fill="#556688" font-size="9">Benchmark: OSWorld (369 tasks)</text>

  <!-- Models badge -->
  <rect x="480" y="695" width="300" height="30" rx="6" fill="#1a2744" stroke="#334466" stroke-width="0.8"/>
  <text x="490" y="714" fill="#556688" font-size="9">Models: GPT-5 · Claude Sonnet 4 · Kimi 2.5 · UI-TARS · Qwen</text>

  <!-- Category badge -->
  <rect x="1050" y="695" width="90" height="30" rx="6" fill="#4facfe" fill-opacity="0.1" stroke="#4facfe" stroke-width="0.8"/>
  <text x="1095" y="714" text-anchor="middle" fill="#4facfe" font-size="9" font-weight="600">cs.AI</text>

  <!-- ===== FLOW ARROWS connecting left → center → right ===== -->
  <!-- Decorative flow from left unreliable to center causes -->
  <path d="M 388 165 Q 430 165, 460 165" stroke="#ff6b6b" stroke-width="1.5" fill="none" opacity="0.25" marker-end="url(#arrowRed)"/>
  
  <!-- Flow from center causes to right solutions -->
  <path d="M 740 175 Q 790 175, 850 175" stroke="#a855f7" stroke-width="1.5" fill="none" opacity="0.25"/>
  <path d="M 662 270 Q 750 270, 850 270" stroke="#2ed573" stroke-width="1.5" fill="none" opacity="0.25"/>
  <path d="M 740 175 Q 790 310, 850 365" stroke="#4facfe" stroke-width="1.5" fill="none" opacity="0.25"/>

  <!-- Small directional hints -->
  <text x="430" y="155" fill="#ff6b6b" font-size="9" opacity="0.5">caused by</text>
  <text x="770" y="168" fill="#a855f7" font-size="9" opacity="0.5">fixed by</text>
  <text x="770" y="265" fill="#2ed573" font-size="9" opacity="0.5">fixed by</text>
  <text x="770" y="350" fill="#4facfe" font-size="9" opacity="0.5">fixed by</text>

  <!-- Color-coded connecting dots (matching source to solution) -->
  <circle cx="843" cy="175" r="4" fill="#f7971e" opacity="0.5"/>
  <circle cx="843" cy="270" r="4" fill="#a855f7" opacity="0.5"/>
  <circle cx="843" cy="365" r="4" fill="#4facfe" opacity="0.5"/>
</svg>