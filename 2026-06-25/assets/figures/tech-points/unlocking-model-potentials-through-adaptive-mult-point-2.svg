<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4B8BDA"/>
    </marker>
    <marker id="ar2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#E89B4C"/>
    </marker>
  </defs>

  <text x="400" y="40" text-anchor="middle" font-size="20" font-weight="bold" fill="#1E3A5F">只传事件卡片，不共享上下文</text>

  <!-- Patch Editor -->
  <rect x="50" y="170" width="190" height="130" rx="10" fill="#EFF6FF" stroke="#4B8BDA" stroke-width="2"/>
  <text x="145" y="205" text-anchor="middle" font-size="16" font-weight="bold" fill="#1E3A5F">Patch Editor</text>
  <text x="145" y="232" text-anchor="middle" font-size="12" fill="#3D4F65">改代码</text>
  <text x="145" y="262" text-anchor="middle" font-size="11" fill="#9AA8B8">看不到测试代码</text>
  <text x="145" y="282" text-anchor="middle" font-size="11" fill="#9AA8B8">只看验证反馈</text>

  <!-- Validator -->
  <rect x="560" y="170" width="190" height="130" rx="10" fill="#FFF4E6" stroke="#E89B4C" stroke-width="2"/>
  <text x="655" y="205" text-anchor="middle" font-size="16" font-weight="bold" fill="#1E3A5F">Validator</text>
  <text x="655" y="232" text-anchor="middle" font-size="12" fill="#3D4F65">跑测试</text>
  <text x="655" y="262" text-anchor="middle" font-size="11" fill="#9AA8B8">看不到内部推理</text>
  <text x="655" y="282" text-anchor="middle" font-size="11" fill="#9AA8B8">只回 pass/fail 摘要</text>

  <!-- Event bus label -->
  <text x="400" y="160" text-anchor="middle" font-size="12" fill="#6B7A8F" font-style="italic">message bus · 结构化事件</text>

  <!-- Event cards in the middle -->
  <g transform="translate(340,170)">
    <rect x="0" y="0" width="120" height="38" rx="5" fill="#FFFFFF" stroke="#4B8BDA" stroke-width="1.5"/>
    <text x="60" y="24" text-anchor="middle" font-size="13" fill="#1E3A5F">CandidatePatch</text>

    <rect x="0" y="48" width="120" height="38" rx="5" fill="#FFFFFF" stroke="#E89B4C" stroke-width="1.5"/>
    <text x="60" y="72" text-anchor="middle" font-size="13" fill="#1E3A5F">TestResult</text>

    <rect x="0" y="96" width="120" height="38" rx="5" fill="#FFFFFF" stroke="#5BAE7F" stroke-width="1.5"/>
    <text x="60" y="120" text-anchor="middle" font-size="13" fill="#1E3A5F">PatchAccepted</text>
  </g>

  <!-- Arrows: Editor -> bus (top), bus -> Validator -->
  <path d="M 240 195 L 335 189" stroke="#4B8BDA" stroke-width="2" fill="none" marker-end="url(#ar)"/>
  <path d="M 460 189 L 555 195" stroke="#4B8BDA" stroke-width="2" fill="none" marker-end="url(#ar)"/>

  <!-- Arrows: Validator -> bus (middle TestResult), bus -> Editor -->
  <path d="M 555 240 L 460 237" stroke="#E89B4C" stroke-width="2" fill="none" marker-end="url(#ar2)"/>
  <path d="M 340 237 L 245 240" stroke="#E89B4C" stroke-width="2" fill="none" marker-end="url(#ar2)"/>

  <!-- bottom comparison -->
  <line x1="80" y1="360" x2="720" y2="360" stroke="#D0D7E0" stroke-width="1" stroke-dasharray="3,3"/>

  <text x="400" y="400" text-anchor="middle" font-size="14" fill="#3D4F65">
    <tspan font-weight="bold" fill="#1E3A5F">小张事件卡片</tspan>
    <tspan>　取代　</tspan>
    <tspan font-weight="bold" fill="#B85450">整段思考贴贴</tspan>
  </text>
  <text x="400" y="428" text-anchor="middle" font-size="12" fill="#6B7A8F">跨 agent 上下文被压缩，避免互相迎合 &amp; 窗口爆炸</text>
  <text x="400" y="455" text-anchor="middle" font-size="11" fill="#9AA8B8">例：TestResult = "10/11 通过，TEST 8 因 protocol=None 报 AttributeError"</text>
</svg>