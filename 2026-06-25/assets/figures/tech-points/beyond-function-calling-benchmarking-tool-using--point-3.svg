<svg xmlns="http://www.w3.org/2000/svg" width="720" height="480" viewBox="0 0 720 480">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4B8BDA"/>
    </marker>
  </defs>

  <text x="360" y="40" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC','Hiragino Sans GB',sans-serif" font-size="20" font-weight="bold" fill="#1E3A5F">工具失败后：调得多 ≠ 救得回</text>

  <!-- Left: failure trigger -->
  <circle cx="100" cy="240" r="50" fill="#FEF3E2" stroke="#E89B4C" stroke-width="2"/>
  <text x="100" y="236" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC','Hiragino Sans GB',sans-serif" font-size="14" fill="#1E3A5F">首次</text>
  <text x="100" y="256" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC','Hiragino Sans GB',sans-serif" font-size="14" fill="#1E3A5F">工具失败</text>

  <line x1="142" y1="205" x2="248" y2="140" stroke="#4B8BDA" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="152" y1="240" x2="248" y2="240" stroke="#4B8BDA" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="142" y1="275" x2="248" y2="340" stroke="#4B8BDA" stroke-width="2" marker-end="url(#arr)"/>

  <!-- Three reactions -->
  <rect x="250" y="105" width="200" height="70" rx="8" fill="#FEECEC" stroke="#D9534F" stroke-width="2"/>
  <text x="350" y="135" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC','Hiragino Sans GB',sans-serif" font-size="15" font-weight="bold" fill="#1E3A5F">无脑重试</text>
  <text x="350" y="158" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC','Hiragino Sans GB',sans-serif" font-size="12" fill="#3D4F65">44% – 76% 轨迹</text>

  <rect x="250" y="205" width="200" height="70" rx="8" fill="#EFF6FF" stroke="#4B8BDA" stroke-width="2"/>
  <text x="350" y="235" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC','Hiragino Sans GB',sans-serif" font-size="15" font-weight="bold" fill="#1E3A5F">切换工具</text>
  <text x="350" y="258" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC','Hiragino Sans GB',sans-serif" font-size="12" fill="#3D4F65">少数</text>

  <rect x="250" y="305" width="200" height="70" rx="8" fill="#F0F0F4" stroke="#888" stroke-width="2"/>
  <text x="350" y="335" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC','Hiragino Sans GB',sans-serif" font-size="15" font-weight="bold" fill="#1E3A5F">直接放弃</text>
  <text x="350" y="358" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC','Hiragino Sans GB',sans-serif" font-size="12" fill="#3D4F65">&lt; 12% 轨迹</text>

  <!-- Outcome -->
  <line x1="450" y1="240" x2="540" y2="240" stroke="#4B8BDA" stroke-width="2" marker-end="url(#arr)"/>

  <rect x="545" y="180" width="150" height="120" rx="10" fill="#FFF7E6" stroke="#E89B4C" stroke-width="2"/>
  <text x="620" y="215" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC','Hiragino Sans GB',sans-serif" font-size="14" font-weight="bold" fill="#1E3A5F">调用扩张比</text>
  <text x="620" y="250" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC','Hiragino Sans GB',sans-serif" font-size="22" font-weight="bold" fill="#D9534F">r = 0.33</text>
  <text x="620" y="278" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC','Hiragino Sans GB',sans-serif" font-size="12" fill="#3D4F65">与准确率弱相关</text>

  <text x="360" y="445" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC','Hiragino Sans GB',sans-serif" font-size="13" font-style="italic" fill="#3D4F65">瓶颈在诊断能力，不在调用次数</text>
</svg>