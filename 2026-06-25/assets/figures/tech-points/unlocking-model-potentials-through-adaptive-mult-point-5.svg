<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4B8BDA"/>
    </marker>
    <marker id="arO" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#E07B5F"/>
    </marker>
  </defs>

  <text x="400" y="40" text-anchor="middle" font-family="Helvetica,Arial" font-size="20" font-weight="600" fill="#1E3A5F">Same Model, Better Scaffold</text>
  <text x="400" y="64" text-anchor="middle" font-family="Helvetica,Arial" font-size="13" fill="#3D4F65">Unlocking latent potential through structure</text>

  <!-- Left: same model -->
  <circle cx="130" cy="270" r="58" fill="#FFF4E6" stroke="#E8A857" stroke-width="2"/>
  <text x="130" y="266" text-anchor="middle" font-family="Helvetica,Arial" font-size="14" font-weight="600" fill="#1E3A5F">Same</text>
  <text x="130" y="284" text-anchor="middle" font-family="Helvetica,Arial" font-size="14" font-weight="600" fill="#1E3A5F">LLM</text>

  <!-- Two paths -->
  <line x1="188" y1="245" x2="325" y2="175" stroke="#4B8BDA" stroke-width="2" marker-end="url(#ar)"/>
  <line x1="188" y1="295" x2="325" y2="365" stroke="#4B8BDA" stroke-width="2" marker-end="url(#ar)"/>

  <!-- Old scaffold -->
  <rect x="330" y="135" width="200" height="80" rx="10" fill="#EFF6FF" stroke="#4B8BDA" stroke-width="2"/>
  <text x="430" y="165" text-anchor="middle" font-family="Helvetica,Arial" font-size="14" fill="#3D4F65">SWE-agent</text>
  <text x="430" y="197" text-anchor="middle" font-family="Helvetica,Arial" font-size="22" font-weight="700" fill="#1E3A5F">43.7%</text>

  <!-- New scaffold -->
  <rect x="330" y="325" width="200" height="80" rx="10" fill="#E6F4EA" stroke="#4FA577" stroke-width="2"/>
  <text x="430" y="355" text-anchor="middle" font-family="Helvetica,Arial" font-size="14" fill="#3D4F65">icat-agent</text>
  <text x="430" y="387" text-anchor="middle" font-family="Helvetica,Arial" font-size="22" font-weight="700" fill="#1E3A5F">62.2%</text>

  <!-- Gap arrow -->
  <line x1="610" y1="195" x2="610" y2="335" stroke="#E07B5F" stroke-width="3" marker-end="url(#arO)"/>
  <line x1="530" y1="175" x2="610" y2="195" stroke="#E07B5F" stroke-width="2" stroke-dasharray="4,3"/>
  <line x1="530" y1="365" x2="610" y2="335" stroke="#E07B5F" stroke-width="2" stroke-dasharray="4,3"/>

  <text x="680" y="260" text-anchor="middle" font-family="Helvetica,Arial" font-size="14" fill="#3D4F65">unlocked</text>
  <text x="680" y="285" text-anchor="middle" font-family="Helvetica,Arial" font-size="22" font-weight="700" fill="#E07B5F">+18.5%</text>

  <!-- Bottom note -->
  <text x="400" y="465" text-anchor="middle" font-family="Helvetica,Arial" font-size="12" fill="#3D4F65">Claude Sonnet 4.5 on SWE-bench Pro</text>
</svg>