<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 420">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4B8BDA"/>
    </marker>
  </defs>

  <text x="300" y="38" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="20" font-weight="bold" fill="#1E3A5F">短期记忆 = Agent 的便签本</text>

  <!-- Agent -->
  <circle cx="90" cy="220" r="62" fill="#EFF6FF" stroke="#1E3A5F" stroke-width="2"/>
  <text x="90" y="215" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="15" font-weight="bold" fill="#1E3A5F">Agent</text>
  <text x="90" y="235" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#3D4F65">长期参数</text>

  <!-- Notepad -->
  <rect x="225" y="135" width="190" height="170" rx="6" fill="#FFF4D6" stroke="#C9A227" stroke-width="2"/>
  <line x1="240" y1="185" x2="400" y2="185" stroke="#C9A227" stroke-width="0.8" stroke-dasharray="3 3"/>
  <line x1="240" y1="210" x2="400" y2="210" stroke="#C9A227" stroke-width="0.8" stroke-dasharray="3 3"/>
  <line x1="240" y1="235" x2="400" y2="235" stroke="#C9A227" stroke-width="0.8" stroke-dasharray="3 3"/>
  <line x1="240" y1="260" x2="400" y2="260" stroke="#C9A227" stroke-width="0.8" stroke-dasharray="3 3"/>
  <text x="320" y="160" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13" font-weight="bold" fill="#1E3A5F">短期记忆窗口</text>
  <text x="248" y="180" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#3D4F65">· 已砍 2 根木头</text>
  <text x="248" y="205" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#3D4F65">· 还差 3 根</text>
  <text x="248" y="230" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#3D4F65">· 工具在背包，前往森林</text>
  <text x="320" y="285" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#7A6210">最近 N 步 obs–think–act</text>

  <!-- World -->
  <rect x="445" y="160" width="125" height="120" rx="8" fill="#FDECEA" stroke="#B5532C" stroke-width="2"/>
  <text x="507" y="215" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="14" font-weight="bold" fill="#1E3A5F">长程游戏</text>
  <text x="507" y="235" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#3D4F65">子目标繁多</text>

  <!-- Arrows: Agent <-> Notepad -->
  <path d="M152,200 L222,180" stroke="#4B8BDA" stroke-width="2" fill="none" marker-end="url(#ar)"/>
  <path d="M222,260 L152,240" stroke="#4B8BDA" stroke-width="2" fill="none" marker-end="url(#ar)"/>
  <text x="185" y="172" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" font-weight="bold" fill="#1E3A5F">写</text>
  <text x="185" y="278" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" font-weight="bold" fill="#1E3A5F">读</text>

  <!-- Arrows: Notepad <-> World -->
  <path d="M418,210 L443,200" stroke="#4B8BDA" stroke-width="2" fill="none" marker-end="url(#ar)"/>
  <path d="M443,240 L418,250" stroke="#4B8BDA" stroke-width="2" fill="none" marker-end="url(#ar)"/>

  <!-- Bottom message -->
  <text x="300" y="360" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13" font-weight="bold" fill="#1E3A5F">参数 = 长期知识  +  滑窗 = 工作记忆</text>
  <text x="300" y="385" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#3D4F65">窗口越大，长程任务表现越稳</text>
</svg>