<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 440" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4B8BDA"/>
    </marker>
    <marker id="arR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#D97757"/>
    </marker>
  </defs>

  <text x="300" y="32" text-anchor="middle" font-size="18" font-weight="600" fill="#1E3A5F">分模块合成 + 跑通验证</text>

  <!-- Base game -->
  <rect x="40" y="95" width="130" height="80" rx="10" fill="#EFF6FF" stroke="#4B8BDA" stroke-width="1.5"/>
  <text x="105" y="130" text-anchor="middle" font-size="14" fill="#1E3A5F" font-weight="600">Base Game</text>
  <text x="105" y="150" text-anchor="middle" font-size="11" fill="#3D4F65">手写骨架</text>

  <!-- Three generators -->
  <rect x="230" y="70" width="150" height="36" rx="8" fill="#FFF4E6" stroke="#D97757" stroke-width="1.5"/>
  <text x="305" y="93" text-anchor="middle" font-size="12" fill="#1E3A5F">实体生成器</text>

  <rect x="230" y="122" width="150" height="36" rx="8" fill="#FFF4E6" stroke="#D97757" stroke-width="1.5"/>
  <text x="305" y="145" text-anchor="middle" font-size="12" fill="#1E3A5F">规则生成器</text>

  <rect x="230" y="174" width="150" height="36" rx="8" fill="#FFF4E6" stroke="#D97757" stroke-width="1.5"/>
  <text x="305" y="197" text-anchor="middle" font-size="12" fill="#1E3A5F">任务生成器</text>

  <line x1="170" y1="125" x2="228" y2="90" stroke="#4B8BDA" stroke-width="1.5" marker-end="url(#ar)"/>
  <line x1="170" y1="135" x2="228" y2="140" stroke="#4B8BDA" stroke-width="1.5" marker-end="url(#ar)"/>
  <line x1="170" y1="145" x2="228" y2="190" stroke="#4B8BDA" stroke-width="1.5" marker-end="url(#ar)"/>

  <!-- Random agent test -->
  <rect x="440" y="100" width="130" height="80" rx="10" fill="#EFF6FF" stroke="#4B8BDA" stroke-width="1.5"/>
  <text x="505" y="135" text-anchor="middle" font-size="14" fill="#1E3A5F" font-weight="600">随机 Agent</text>
  <text x="505" y="155" text-anchor="middle" font-size="11" fill="#3D4F65">端到端试玩</text>

  <line x1="380" y1="140" x2="438" y2="140" stroke="#4B8BDA" stroke-width="1.8" marker-end="url(#ar)"/>
  <text x="409" y="132" text-anchor="middle" font-size="10" fill="#3D4F65">生成游戏</text>

  <!-- Error feedback loop -->
  <path d="M 505 180 Q 505 270 305 270 Q 215 270 215 220" fill="none" stroke="#D97757" stroke-width="1.8" stroke-dasharray="5,4" marker-end="url(#arR)"/>
  <text x="400" y="262" text-anchor="middle" font-size="11" fill="#D97757" font-weight="600">报错 → LLM 自修复</text>

  <!-- Output -->
  <rect x="180" y="350" width="240" height="58" rx="10" fill="#E8F0E5" stroke="#5A8F4A" stroke-width="1.5"/>
  <text x="300" y="375" text-anchor="middle" font-size="13" fill="#1E3A5F" font-weight="600">可玩长程文本游戏</text>
  <text x="300" y="394" text-anchor="middle" font-size="11" fill="#3D4F65">未污染 · 风格多样 · 可量产</text>

  <line x1="305" y1="210" x2="305" y2="348" stroke="#4B8BDA" stroke-width="1.5" marker-end="url(#ar)"/>
</svg>