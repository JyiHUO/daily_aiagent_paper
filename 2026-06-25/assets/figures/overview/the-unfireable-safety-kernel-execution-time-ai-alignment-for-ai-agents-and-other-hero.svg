<svg width="900" height="600" viewBox="0 0 900 600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="agentBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FDF2F2"/>
      <stop offset="100%" stop-color="#FBE4E4"/>
    </linearGradient>
    <linearGradient id="kernelBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#EFF6FF"/>
      <stop offset="100%" stop-color="#DBEAFE"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4B8BDA"/>
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#C0392B"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="450" y="42" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif" font-size="22" font-weight="700" fill="#1E3A5F">不可关闭的安全内核</text>
  <text x="450" y="66" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif" font-size="13" fill="#3D4F65">执行时对齐 · Execution-Time Alignment</text>

  <!-- LEFT: Agent zone (escapable) -->
  <rect x="60" y="110" width="290" height="380" rx="14" fill="url(#agentBg)" stroke="#E8A5A5" stroke-width="1.5"/>
  <text x="205" y="138" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif" font-size="14" font-weight="600" fill="#8B2A2A">Agent 进程内（escapable）</text>

  <!-- Agent brain -->
  <circle cx="205" cy="230" r="48" fill="#FFFFFF" stroke="#C0392B" stroke-width="2"/>
  <text x="205" y="226" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif" font-size="14" font-weight="600" fill="#1E3A5F">AI Agent</text>
  <text x="205" y="244" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif" font-size="11" fill="#3D4F65">可自我修改</text>

  <!-- Old in-process guards (crossed) -->
  <g opacity="0.9">
    <rect x="95" y="320" width="100" height="36" rx="6" fill="#FFFFFF" stroke="#C0392B" stroke-width="1.2" stroke-dasharray="4,3"/>
    <text x="145" y="343" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif" font-size="11" fill="#8B2A2A">系统提示</text>

    <rect x="215" y="320" width="100" height="36" rx="6" fill="#FFFFFF" stroke="#C0392B" stroke-width="1.2" stroke-dasharray="4,3"/>
    <text x="265" y="343" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif" font-size="11" fill="#8B2A2A">输出过滤</text>

    <rect x="155" y="372" width="100" height="36" rx="6" fill="#FFFFFF" stroke="#C0392B" stroke-width="1.2" stroke-dasharray="4,3"/>
    <text x="205" y="395" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif" font-size="11" fill="#8B2A2A">Guardrails</text>

    <line x1="105" y1="318" x2="305" y2="410" stroke="#C0392B" stroke-width="2.5" opacity="0.55"/>
    <line x1="305" y1="318" x2="105" y2="410" stroke="#C0392B" stroke-width="2.5" opacity="0.55"/>
  </g>

  <text x="205" y="450" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif" font-size="11" fill="#8B2A2A">同地址空间 → Agent 可绕过 / 改写</text>

  <!-- Action attempt arrow -->
  <line x1="350" y1="230" x2="405" y2="230" stroke="#C0392B" stroke-width="2" marker-end="url(#arrowRed)"/>
  <text x="377" y="222" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif" font-size="10" fill="#8B2A2A">动作请求</text>

  <!-- CENTER: Kernel (shield) -->
  <g transform="translate(450,250)">
    <path d="M 0 -110 L 78 -82 L 78 30 Q 78 90 0 130 Q -78 90 -78 30 L -78 -82 Z"
          fill="url(#kernelBg)" stroke="#2C5282" stroke-width="2.5"/>
    <text x="0" y="-70" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif" font-size="13" font-weight="700" fill="#1E3A5F">Rust 安全内核</text>
    <text x="0" y="-52" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif" font-size="10" fill="#3D4F65">独立进程 · 不可触达</text>

    <text x="0" y="-22" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif" font-size="11" fill="#1E3A5F">P1 进程隔离</text>
    <text x="0" y="-2" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif" font-size="11" fill="#1E3A5F">P2 唯一路径</text>
    <text x="0" y="18" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif" font-size="11" fill="#1E3A5F">P3 失败即拒</text>
    <text x="0" y="38" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif" font-size="11" fill="#1E3A5F">P4 外部签名</text>

    <rect x="-55" y="62" width="110" height="22" rx="11" fill="#2C5282"/>
    <text x="0" y="78" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif" font-size="10" font-weight="600" fill="#FFFFFF">Z3 + Kani 验证</text>
  </g>

  <!-- RIGHT: Decision + Evidence -->
  <g>
    <rect x="600" y="150" width="230" height="80" rx="10" fill="#FEF3F2" stroke="#C0392B" stroke-width="1.8"/>
    <text x="715" y="178" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif" font-size="14" font-weight="700" fill="#8B2A2A">REFUSE 拒绝</text>
    <text x="715" y="200" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif" font-size="11" fill="#3D4F65">704/704 核心攻击</text>
    <text x="715" y="218" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif" font-size="11" fill="#3D4F65">6240/6240 授权检查</text>

    <rect x="600" y="290" width="230" height="80" rx="10" fill="#EFF6FF" stroke="#2C5282" stroke-width="1.8"/>
    <text x="715" y="318" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif" font-size="14" font-weight="700" fill="#1E3A5F">ALLOW 放行</text>
    <text x="715" y="340" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif" font-size="11" fill="#3D4F65">Ed25519 签名</text>
    <text x="715" y="358" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif" font-size="11" fill="#3D4F65">外部可验证日志</text>
  </g>

  <!-- arrows from kernel to outcomes -->
  <path d="M 528 210 Q 570 190 600 188" fill="none" stroke="#4B8BDA" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M 528 290 Q 570 320 600 328" fill="none" stroke="#4B8BDA" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Bottom layer: three alignment layers -->
  <rect x="60" y="520" width="780" height="60" rx="10" fill="#F5F7FA" stroke="#CBD5E0" stroke-width="1"/>
  <text x="180" y="545" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif" font-size="12" fill="#3D4F65">训练时对齐</text>
  <text x="180" y="563" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif" font-size="10" fill="#6B7B8E">RLHF / CAI</text>

  <text x="450" y="545" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif" font-size="12" fill="#3D4F65">推理时对齐</text>
  <text x="450" y="563" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif" font-size="10" fill="#6B7B8E">prompts / filters</text>

  <text x="720" y="545" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif" font-size="12" font-weight="700" fill="#1E3A5F">执行时对齐 ★</text>
  <text x="720" y="563" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif" font-size="10" fill="#2C5282">本文新增层</text>

  <line x1="290" y1="550" x2="335" y2="550" stroke="#CBD5E0" stroke-width="1"/>
  <line x1="560" y1="550" x2="605" y2="550" stroke="#CBD5E0" stroke-width="1"/>
</svg>