<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" font-family="'Helvetica Neue',Arial,'PingFang SC','Microsoft YaHei',sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4B8BDA"/>
    </marker>
    <marker id="arrOrange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#E08856"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="450" y="44" text-anchor="middle" font-size="22" font-weight="700" fill="#1E3A5F">AgentOdyssey：测试时持续学习的长程文本世界</text>
  <text x="450" y="68" text-anchor="middle" font-size="13" fill="#3D4F65">程序化生成开放世界 · 边玩边学 · 五维能力同台诊断</text>

  <!-- LEFT: Procedural game generator -->
  <g>
    <rect x="40" y="125" width="200" height="170" rx="14" fill="#EFF6FF" stroke="#4B8BDA" stroke-width="1.5"/>
    <text x="140" y="153" text-anchor="middle" font-size="14" font-weight="700" fill="#1E3A5F">程序化游戏生成器</text>
    <text x="140" y="172" text-anchor="middle" font-size="11" fill="#3D4F65">LLM 程序合成 + 运行时验证</text>
    <g font-size="11" fill="#1E3A5F">
      <rect x="60" y="187" width="160" height="22" rx="5" fill="#FFFFFF" stroke="#9DBEE6"/>
      <text x="140" y="202" text-anchor="middle">实体 · 区域 · NPC</text>
      <rect x="60" y="217" width="160" height="22" rx="5" fill="#FFFFFF" stroke="#9DBEE6"/>
      <text x="140" y="232" text-anchor="middle">动作 / step 隐藏规则</text>
      <rect x="60" y="247" width="160" height="22" rx="5" fill="#FFFFFF" stroke="#9DBEE6"/>
      <text x="140" y="262" text-anchor="middle">主线 + 副线长程任务</text>
    </g>
  </g>

  <!-- CENTER: continual learning loop -->
  <g>
    <circle cx="450" cy="350" r="135" fill="#F7FAFE" stroke="#4B8BDA" stroke-width="2"/>
    <circle cx="450" cy="350" r="68" fill="#FFFFFF" stroke="#4B8BDA" stroke-width="1.5" stroke-dasharray="4 3"/>
    <text x="450" y="345" text-anchor="middle" font-size="15" font-weight="700" fill="#1E3A5F">Agent</text>
    <text x="450" y="365" text-anchor="middle" font-size="11" fill="#3D4F65">边推理边学习</text>

    <!-- loop arrows (clockwise) on r=135 ring -->
    <path d="M 450 215 A 135 135 0 0 1 585 350" fill="none" stroke="#4B8BDA" stroke-width="2.2" marker-end="url(#arr)"/>
    <path d="M 585 350 A 135 135 0 0 1 450 485" fill="none" stroke="#4B8BDA" stroke-width="2.2" marker-end="url(#arr)"/>
    <path d="M 450 485 A 135 135 0 0 1 315 350" fill="none" stroke="#4B8BDA" stroke-width="2.2" marker-end="url(#arr)"/>
    <path d="M 315 350 A 135 135 0 0 1 450 215" fill="none" stroke="#4B8BDA" stroke-width="2.2" marker-end="url(#arr)"/>

    <!-- five capabilities around ring -->
    <g font-size="11.5" font-weight="600" fill="#1E3A5F">
      <circle cx="450" cy="215" r="28" fill="#FFE9D6" stroke="#E08856"/>
      <text x="450" y="213" text-anchor="middle">探索</text>
      <text x="450" y="228" text-anchor="middle" font-size="9" fill="#7A5236">Explore</text>

      <circle cx="578" cy="295" r="28" fill="#FFE9D6" stroke="#E08856"/>
      <text x="578" y="293" text-anchor="middle">世界知识</text>
      <text x="578" y="308" text-anchor="middle" font-size="9" fill="#7A5236">Knowledge</text>

      <circle cx="548" cy="448" r="28" fill="#FFE9D6" stroke="#E08856"/>
      <text x="548" y="446" text-anchor="middle">情景记忆</text>
      <text x="548" y="461" text-anchor="middle" font-size="9" fill="#7A5236">Memory</text>

      <circle cx="352" cy="448" r="28" fill="#FFE9D6" stroke="#E08856"/>
      <text x="352" y="446" text-anchor="middle">技能学习</text>
      <text x="352" y="461" text-anchor="middle" font-size="9" fill="#7A5236">Skills</text>

      <circle cx="322" cy="295" r="28" fill="#FFE9D6" stroke="#E08856"/>
      <text x="322" y="293" text-anchor="middle">长程规划</text>
      <text x="322" y="308" text-anchor="middle" font-size="9" fill="#7A5236">Planning</text>
    </g>
  </g>

  <!-- arrow from generator into world -->
  <path d="M 240 220 Q 280 220 300 250" fill="none" stroke="#4B8BDA" stroke-width="2" marker-end="url(#arr)"/>
  <text x="248" y="210" font-size="10.5" fill="#3D4F65">投放新世界</text>

  <!-- RIGHT: diagnostic evaluation -->
  <g>
    <rect x="660" y="125" width="200" height="170" rx="14" fill="#FFF4EA" stroke="#E08856" stroke-width="1.5"/>
    <text x="760" y="153" text-anchor="middle" font-size="14" font-weight="700" fill="#1E3A5F">多维诊断评测</text>
    <text x="760" y="172" text-anchor="middle" font-size="11" fill="#7A5236">玩前 / 玩后 探针</text>
    <g font-size="11" fill="#1E3A5F">
      <rect x="680" y="187" width="160" height="22" rx="5" fill="#FFFFFF" stroke="#E08856"/>
      <text x="760" y="202" text-anchor="middle">游戏进度 + 主副线</text>
      <rect x="680" y="217" width="160" height="22" rx="5" fill="#FFFFFF" stroke="#E08856"/>
      <text x="760" y="232" text-anchor="middle">知识 / 记忆 QA</text>
      <rect x="680" y="247" width="160" height="22" rx="5" fill="#FFFFFF" stroke="#E08856"/>
      <text x="760" y="262" text-anchor="middle">动作熵 · Token 成本</text>
    </g>
  </g>

  <!-- arrow agent -> eval -->
  <path d="M 600 250 Q 640 230 660 220" fill="none" stroke="#E08856" stroke-width="2" marker-end="url(#arrOrange)"/>
  <text x="610" y="240" font-size="10.5" fill="#7A5236">轨迹诊断</text>

  <!-- Bottom finding -->
  <g>
    <rect x="120" y="525" width="660" height="55" rx="10" fill="#EFF6FF" stroke="#4B8BDA" stroke-width="1.2"/>
    <text x="450" y="548" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1E3A5F">关键发现：短期记忆是测试时持续学习的稳健增益模块</text>
    <text x="450" y="568" text-anchor="middle" font-size="11" fill="#3D4F65">参数更新（长期）+ 滑窗上下文（短期）组合最优；行动塌缩 = 性能停滞的可量化信号</text>
  </g>
</svg>