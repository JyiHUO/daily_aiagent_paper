<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 620" font-family="-apple-system, 'Segoe UI', sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4B8BDA"/>
    </marker>
    <marker id="arrOrange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#E08A3C"/>
    </marker>
    <marker id="arrPurple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#7B5BC4"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="450" y="40" text-anchor="middle" font-size="22" font-weight="700" fill="#1E3A5F">icat-agent：按 issue 质量自适应的多智能体脚手架</text>
  <text x="450" y="64" text-anchor="middle" font-size="13" fill="#3D4F65">事件消息总线 · 替代共享上下文 · 解锁同一模型的潜力</text>

  <!-- Input: Issue -->
  <g>
    <rect x="40" y="180" width="150" height="100" rx="10" fill="#FFF6E8" stroke="#E08A3C" stroke-width="1.5"/>
    <text x="115" y="210" text-anchor="middle" font-size="14" font-weight="700" fill="#1E3A5F">GitHub Issue</text>
    <text x="115" y="236" text-anchor="middle" font-size="11" fill="#3D4F65">描述模糊 / 完整</text>
    <text x="115" y="258" text-anchor="middle" font-size="11" fill="#3D4F65">35–41% 未提出错文件</text>
  </g>

  <!-- Quality Checker Diamond -->
  <g>
    <polygon points="320,230 410,180 500,230 410,280" fill="#EFF6FF" stroke="#1E3A5F" stroke-width="2"/>
    <text x="410" y="226" text-anchor="middle" font-size="13" font-weight="700" fill="#1E3A5F">Quality</text>
    <text x="410" y="244" text-anchor="middle" font-size="13" font-weight="700" fill="#1E3A5F">Checker</text>
    <text x="410" y="262" text-anchor="middle" font-size="10" fill="#3D4F65">四项 rubric</text>
  </g>

  <!-- Arrow Issue -> Checker -->
  <line x1="190" y1="230" x2="318" y2="230" stroke="#4B8BDA" stroke-width="2" marker-end="url(#arr)"/>

  <!-- Branch HIGH (top) -->
  <path d="M 410 180 Q 410 130 535 130" stroke="#4B8BDA" stroke-width="2" fill="none" marker-end="url(#arr)"/>
  <text x="430" y="122" font-size="11" font-weight="700" fill="#2E7D5E">高质量 · 跳过探索</text>

  <!-- Branch LOW (bottom) -->
  <path d="M 410 280 Q 410 340 535 340" stroke="#4B8BDA" stroke-width="2" fill="none" marker-end="url(#arr)"/>
  <text x="430" y="332" font-size="11" font-weight="700" fill="#C25450">低质量 · 先勘察</text>

  <!-- Explorer -->
  <g>
    <rect x="540" y="305" width="135" height="70" rx="8" fill="#F4ECFF" stroke="#7B5BC4" stroke-width="1.5"/>
    <text x="607" y="330" text-anchor="middle" font-size="13" font-weight="700" fill="#1E3A5F">Explorer</text>
    <text x="607" y="350" text-anchor="middle" font-size="10" fill="#3D4F65">AST 定位</text>
    <text x="607" y="365" text-anchor="middle" font-size="10" fill="#3D4F65">tree-sitter</text>
  </g>

  <!-- Message Bus -->
  <g>
    <rect x="540" y="160" width="290" height="80" rx="10" fill="#1E3A5F"/>
    <text x="685" y="188" text-anchor="middle" font-size="13" font-weight="700" fill="#FFFFFF">事件消息总线 Message Bus</text>
    <text x="685" y="210" text-anchor="middle" font-size="10" fill="#B8D4F0">CandidatePatch · TestResult · PatchAccepted</text>
    <text x="685" y="226" text-anchor="middle" font-size="10" fill="#B8D4F0">只传事件，不共享上下文</text>
  </g>

  <!-- High-quality path enters bus -->
  <line x1="535" y1="130" x2="600" y2="130" stroke="#4B8BDA" stroke-width="2"/>
  <line x1="600" y1="130" x2="600" y2="158" stroke="#4B8BDA" stroke-width="2" marker-end="url(#arr)"/>

  <!-- Explorer feeds bus -->
  <path d="M 607 305 L 607 242" stroke="#7B5BC4" stroke-width="2" fill="none" marker-end="url(#arrPurple)"/>

  <!-- Patch Editor -->
  <g>
    <rect x="540" y="430" width="135" height="80" rx="8" fill="#EAF4EC" stroke="#2E7D5E" stroke-width="1.5"/>
    <text x="607" y="458" text-anchor="middle" font-size="13" font-weight="700" fill="#1E3A5F">Patch Editor</text>
    <text x="607" y="478" text-anchor="middle" font-size="10" fill="#3D4F65">写补丁</text>
    <text x="607" y="494" text-anchor="middle" font-size="10" fill="#3D4F65">看不到测试代码</text>
  </g>

  <!-- Validator -->
  <g>
    <rect x="695" y="430" width="135" height="80" rx="8" fill="#FBEAEA" stroke="#C25450" stroke-width="1.5"/>
    <text x="762" y="458" text-anchor="middle" font-size="13" font-weight="700" fill="#1E3A5F">Validator</text>
    <text x="762" y="478" text-anchor="middle" font-size="10" fill="#3D4F65">先写复现测试</text>
    <text x="762" y="494" text-anchor="middle" font-size="10" fill="#3D4F65">强制 fail-to-pass</text>
  </g>

  <!-- Patch Editor <-> Bus -->
  <path d="M 595 430 L 595 242" stroke="#4B8BDA" stroke-width="2" fill="none" marker-end="url(#arr)"/>
  <path d="M 620 240 L 620 430" stroke="#E08A3C" stroke-width="2" fill="none" marker-end="url(#arrOrange)"/>

  <!-- Validator <-> Bus -->
  <path d="M 750 430 L 750 242" stroke="#4B8BDA" stroke-width="2" fill="none" marker-end="url(#arr)"/>
  <path d="M 775 240 L 775 430" stroke="#E08A3C" stroke-width="2" fill="none" marker-end="url(#arrOrange)"/>

  <!-- Legend for arrows -->
  <g>
    <line x1="60" y1="430" x2="90" y2="430" stroke="#4B8BDA" stroke-width="2" marker-end="url(#arr)"/>
    <text x="95" y="434" font-size="10" fill="#3D4F65">提交事件 (patch / test)</text>
    <line x1="60" y1="452" x2="90" y2="452" stroke="#E08A3C" stroke-width="2" marker-end="url(#arrOrange)"/>
    <text x="95" y="456" font-size="10" fill="#3D4F65">回传 pass/fail 摘要</text>
  </g>

  <!-- Isolation note -->
  <line x1="685" y1="430" x2="685" y2="510" stroke="#C0C0C0" stroke-width="1" stroke-dasharray="3,3"/>
  <text x="685" y="528" text-anchor="middle" font-size="10" font-style="italic" fill="#7A7A7A">互不可见 · 防止测试与 patch 互相迎合</text>

  <!-- Result strip -->
  <g>
    <rect x="60" y="548" width="780" height="58" rx="8" fill="#EFF6FF" stroke="#4B8BDA" stroke-width="1.5"/>
    <text x="100" y="573" font-size="13" font-weight="700" fill="#1E3A5F">同模型，更强能力</text>
    <text x="100" y="593" font-size="11" fill="#3D4F65">SWE-bench Verified +3.6~8.4% · Pro +6.3~18.5%</text>
    <line x1="520" y1="560" x2="520" y2="596" stroke="#B8D4F0"/>
    <text x="540" y="573" font-size="13" font-weight="700" fill="#1E3A5F">更省</text>
    <text x="540" y="593" font-size="11" fill="#3D4F65">较 Claude Code 每条 issue 节省 $1.18</text>
  </g>

  <!-- Left side annotation -->
  <g>
    <text x="115" y="315" text-anchor="middle" font-size="10" fill="#7A7A7A">共享上下文 → 退化 / 中毒</text>
    <text x="115" y="335" text-anchor="middle" font-size="10" font-weight="700" fill="#C25450">icat 用事件流取而代之</text>
  </g>
</svg>