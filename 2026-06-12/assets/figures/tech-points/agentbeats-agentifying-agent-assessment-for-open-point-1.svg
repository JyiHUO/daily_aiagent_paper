<svg xmlns="http://www.w3.org/2000/svg" width="720" height="480" viewBox="0 0 720 480">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4B8BDA"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#D97757"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="360" y="38" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC','Hiragino Sans GB',sans-serif" font-size="20" font-weight="700" fill="#1E3A5F">基准也是 Agent</text>
  <text x="360" y="62" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC','Hiragino Sans GB',sans-serif" font-size="13" fill="#3D4F65">N × M 集成  →  N + M</text>

  <!-- LEFT: Traditional -->
  <text x="180" y="100" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC','Hiragino Sans GB',sans-serif" font-size="13" font-weight="600" fill="#8C5A3C">传统：两套接口</text>

  <!-- agents column -->
  <rect x="70" y="125" width="70" height="32" rx="4" fill="#FFF4EC" stroke="#D97757" stroke-width="1.3"/>
  <text x="105" y="146" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC','Hiragino Sans GB',sans-serif" font-size="12" fill="#1E3A5F">Agent A</text>
  <rect x="70" y="170" width="70" height="32" rx="4" fill="#FFF4EC" stroke="#D97757" stroke-width="1.3"/>
  <text x="105" y="191" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC','Hiragino Sans GB',sans-serif" font-size="12" fill="#1E3A5F">Agent B</text>
  <rect x="70" y="215" width="70" height="32" rx="4" fill="#FFF4EC" stroke="#D97757" stroke-width="1.3"/>
  <text x="105" y="236" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC','Hiragino Sans GB',sans-serif" font-size="12" fill="#1E3A5F">Agent C</text>

  <!-- bench column -->
  <rect x="220" y="125" width="70" height="32" rx="4" fill="#EFF6FF" stroke="#4B8BDA" stroke-width="1.3"/>
  <text x="255" y="146" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC','Hiragino Sans GB',sans-serif" font-size="12" fill="#1E3A5F">Bench 1</text>
  <rect x="220" y="170" width="70" height="32" rx="4" fill="#EFF6FF" stroke="#4B8BDA" stroke-width="1.3"/>
  <text x="255" y="191" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC','Hiragino Sans GB',sans-serif" font-size="12" fill="#1E3A5F">Bench 2</text>
  <rect x="220" y="215" width="70" height="32" rx="4" fill="#EFF6FF" stroke="#4B8BDA" stroke-width="1.3"/>
  <text x="255" y="236" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC','Hiragino Sans GB',sans-serif" font-size="12" fill="#1E3A5F">Bench 3</text>

  <!-- N x M tangled lines -->
  <g stroke="#B8B0A8" stroke-width="0.9" fill="none" opacity="0.85">
    <line x1="140" y1="141" x2="220" y2="141"/>
    <line x1="140" y1="141" x2="220" y2="186"/>
    <line x1="140" y1="141" x2="220" y2="231"/>
    <line x1="140" y1="186" x2="220" y2="141"/>
    <line x1="140" y1="186" x2="220" y2="186"/>
    <line x1="140" y1="186" x2="220" y2="231"/>
    <line x1="140" y1="231" x2="220" y2="141"/>
    <line x1="140" y1="231" x2="220" y2="186"/>
    <line x1="140" y1="231" x2="220" y2="231"/>
  </g>

  <text x="180" y="285" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC','Hiragino Sans GB',sans-serif" font-size="12" fill="#3D4F65">每对都要写胶水代码</text>
  <text x="180" y="312" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC','Hiragino Sans GB',sans-serif" font-size="16" font-weight="700" fill="#D97757">N × M</text>
  <text x="180" y="420" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC','Hiragino Sans GB',sans-serif" font-size="11" fill="#8C5A3C">两类接口纠缠</text>

  <!-- Divider -->
  <line x1="370" y1="95" x2="370" y2="430" stroke="#D9D9D9" stroke-width="1" stroke-dasharray="4 4"/>

  <!-- RIGHT: AAA -->
  <text x="540" y="100" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC','Hiragino Sans GB',sans-serif" font-size="13" font-weight="600" fill="#1E3A5F">AAA：统一语言</text>

  <!-- Subject agents -->
  <rect x="410" y="135" width="80" height="32" rx="4" fill="#FFF4EC" stroke="#D97757" stroke-width="1.3"/>
  <text x="450" y="156" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC','Hiragino Sans GB',sans-serif" font-size="12" fill="#1E3A5F">Subject</text>
  <rect x="410" y="195" width="80" height="32" rx="4" fill="#FFF4EC" stroke="#D97757" stroke-width="1.3"/>
  <text x="450" y="216" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC','Hiragino Sans GB',sans-serif" font-size="12" fill="#1E3A5F">Subject</text>
  <rect x="410" y="255" width="80" height="32" rx="4" fill="#FFF4EC" stroke="#D97757" stroke-width="1.3"/>
  <text x="450" y="276" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC','Hiragino Sans GB',sans-serif" font-size="12" fill="#1E3A5F">Subject</text>

  <!-- Protocol bus -->
  <rect x="525" y="135" width="50" height="152" rx="6" fill="#E8F0FA" stroke="#4B8BDA" stroke-width="1.5"/>
  <text x="550" y="200" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC','Hiragino Sans GB',sans-serif" font-size="12" font-weight="700" fill="#1E3A5F">A2A</text>
  <text x="550" y="220" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC','Hiragino Sans GB',sans-serif" font-size="12" font-weight="700" fill="#1E3A5F">+ MCP</text>

  <!-- Judge agents -->
  <rect x="610" y="135" width="80" height="32" rx="4" fill="#EFF6FF" stroke="#4B8BDA" stroke-width="1.3"/>
  <text x="650" y="156" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC','Hiragino Sans GB',sans-serif" font-size="12" fill="#1E3A5F">Judge</text>
  <rect x="610" y="195" width="80" height="32" rx="4" fill="#EFF6FF" stroke="#4B8BDA" stroke-width="1.3"/>
  <text x="650" y="216" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC','Hiragino Sans GB',sans-serif" font-size="12" fill="#1E3A5F">Judge</text>
  <rect x="610" y="255" width="80" height="32" rx="4" fill="#EFF6FF" stroke="#4B8BDA" stroke-width="1.3"/>
  <text x="650" y="276" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC','Hiragino Sans GB',sans-serif" font-size="12" fill="#1E3A5F">Judge</text>

  <!-- arrows to bus -->
  <line x1="490" y1="151" x2="524" y2="160" stroke="#D97757" stroke-width="1.4" marker-end="url(#arrR)"/>
  <line x1="490" y1="211" x2="524" y2="211" stroke="#D97757" stroke-width="1.4" marker-end="url(#arrR)"/>
  <line x1="490" y1="271" x2="524" y2="262" stroke="#D97757" stroke-width="1.4" marker-end="url(#arrR)"/>

  <line x1="576" y1="160" x2="609" y2="151" stroke="#4B8BDA" stroke-width="1.4" marker-end="url(#arr)"/>
  <line x1="576" y1="211" x2="609" y2="211" stroke="#4B8BDA" stroke-width="1.4" marker-end="url(#arr)"/>
  <line x1="576" y1="262" x2="609" y2="271" stroke="#4B8BDA" stroke-width="1.4" marker-end="url(#arr)"/>

  <text x="540" y="320" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC','Hiragino Sans GB',sans-serif" font-size="12" fill="#3D4F65">基准变成 agent</text>
  <text x="540" y="347" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC','Hiragino Sans GB',sans-serif" font-size="16" font-weight="700" fill="#1E3A5F">N + M</text>
  <text x="540" y="420" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC','Hiragino Sans GB',sans-serif" font-size="11" fill="#1E3A5F">同一 agent 协议</text>
</svg>