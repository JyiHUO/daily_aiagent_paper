<svg xmlns="http://www.w3.org/2000/svg" width="720" height="480" viewBox="0 0 720 480">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4B8BDA"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#D97757"/>
    </marker>
  </defs>

  <text x="360" y="40" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC','Hiragino Sans GB',sans-serif" font-size="20" font-weight="600" fill="#1E3A5F">闭环合谋注入与失败诊断</text>

  <!-- Step 1: Coordinated Injection -->
  <rect x="40" y="100" width="180" height="140" rx="10" fill="#EFF6FF" stroke="#4B8BDA" stroke-width="1.5"/>
  <text x="130" y="128" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC','Hiragino Sans GB',sans-serif" font-size="14" font-weight="600" fill="#1E3A5F">协同注入</text>
  <circle cx="95" cy="170" r="14" fill="#D97757" opacity="0.85"/>
  <circle cx="130" cy="170" r="14" fill="#D97757" opacity="0.85"/>
  <circle cx="165" cy="170" r="14" fill="#D97757" opacity="0.85"/>
  <line x1="95" y1="170" x2="130" y2="170" stroke="#1E3A5F" stroke-width="1"/>
  <line x1="130" y1="170" x2="165" y2="170" stroke="#1E3A5F" stroke-width="1"/>
  <text x="130" y="215" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC','Hiragino Sans GB',sans-serif" font-size="11" fill="#3D4F65">多Agent统一口径</text>

  <!-- Step 2: MAS execution with sentinel -->
  <rect x="270" y="100" width="180" height="140" rx="10" fill="#FFF5EE" stroke="#D97757" stroke-width="1.5"/>
  <text x="360" y="128" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC','Hiragino Sans GB',sans-serif" font-size="14" font-weight="600" fill="#1E3A5F">善意Agent告警</text>
  <path d="M360 150 L388 162 L388 188 Q388 206 360 215 Q332 206 332 188 L332 162 Z" fill="#FFFFFF" stroke="#D97757" stroke-width="2"/>
  <text x="360" y="194" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC','Hiragino Sans GB',sans-serif" font-size="20" font-weight="700" fill="#D97757">!</text>
  <text x="360" y="232" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC','Hiragino Sans GB',sans-serif" font-size="11" fill="#3D4F65">谁拦截了攻击</text>

  <!-- Step 3: Diagnose &amp; refine -->
  <rect x="500" y="100" width="180" height="140" rx="10" fill="#EFF6FF" stroke="#4B8BDA" stroke-width="1.5"/>
  <text x="590" y="128" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC','Hiragino Sans GB',sans-serif" font-size="14" font-weight="600" fill="#1E3A5F">诊断与改写</text>
  <circle cx="575" cy="175" r="18" fill="none" stroke="#1E3A5F" stroke-width="2"/>
  <line x1="589" y1="189" x2="605" y2="205" stroke="#1E3A5F" stroke-width="3" stroke-linecap="round"/>
  <text x="590" y="232" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC','Hiragino Sans GB',sans-serif" font-size="11" fill="#3D4F65">压制告警信号</text>

  <!-- Forward arrows -->
  <line x1="220" y1="170" x2="268" y2="170" stroke="#4B8BDA" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="450" y1="170" x2="498" y2="170" stroke="#4B8BDA" stroke-width="2" marker-end="url(#arr)"/>

  <!-- Loop back arrow -->
  <path d="M 590 240 Q 590 320 360 320 Q 130 320 130 240" fill="none" stroke="#D97757" stroke-width="2" stroke-dasharray="6,4" marker-end="url(#arrR)"/>
  <text x="360" y="345" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC','Hiragino Sans GB',sans-serif" font-size="12" fill="#D97757" font-weight="600">迭代直到成功 / 预算 Imax 耗尽</text>

  <!-- Bottom outcome -->
  <text x="360" y="410" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC','Hiragino Sans GB',sans-serif" font-size="13" font-weight="600" fill="#1E3A5F">失败 → 定位拦截者 → 调整同伙说辞</text>
  <text x="360" y="438" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC','Hiragino Sans GB',sans-serif" font-size="11" fill="#3D4F65">不是盲目重试，而是针对性掩盖</text>
</svg>