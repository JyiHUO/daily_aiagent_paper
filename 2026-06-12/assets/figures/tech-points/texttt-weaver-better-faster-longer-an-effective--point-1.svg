<svg xmlns="http://www.w3.org/2000/svg" width="720" height="480" viewBox="0 0 720 480">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4B8BDA"/>
    </marker>
  </defs>

  <text x="360" y="40" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC','Hiragino Sans GB',sans-serif" font-size="20" font-weight="600" fill="#1E3A5F">多源记忆 融合预测</text>

  <!-- LEFT: four sources -->
  <g>
    <rect x="40" y="100" width="180" height="60" rx="8" fill="#EFF6FF" stroke="#4B8BDA" stroke-width="1.5"/>
    <text x="130" y="125" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC','Hiragino Sans GB',sans-serif" font-size="14" fill="#1E3A5F" font-weight="600">外部 + 腕部</text>
    <text x="130" y="146" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC','Hiragino Sans GB',sans-serif" font-size="12" fill="#3D4F65">多视角图像</text>

    <rect x="40" y="190" width="180" height="60" rx="8" fill="#FFF4E6" stroke="#E89A4A" stroke-width="1.5"/>
    <text x="130" y="215" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC','Hiragino Sans GB',sans-serif" font-size="14" fill="#1E3A5F" font-weight="600">稀疏长记忆</text>
    <text x="130" y="234" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC','Hiragino Sans GB',sans-serif" font-size="12" fill="#3D4F65">每 k 步一帧</text>

    <rect x="40" y="280" width="180" height="60" rx="8" fill="#FFF4E6" stroke="#E89A4A" stroke-width="1.5"/>
    <text x="130" y="305" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC','Hiragino Sans GB',sans-serif" font-size="14" fill="#1E3A5F" font-weight="600">短时历史</text>
    <text x="130" y="324" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC','Hiragino Sans GB',sans-serif" font-size="12" fill="#3D4F65">最近两帧</text>

    <rect x="40" y="370" width="180" height="60" rx="8" fill="#EFF6FF" stroke="#4B8BDA" stroke-width="1.5"/>
    <text x="130" y="395" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC','Hiragino Sans GB',sans-serif" font-size="14" fill="#1E3A5F" font-weight="600">动作 chunk</text>
    <text x="130" y="414" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC','Hiragino Sans GB',sans-serif" font-size="12" fill="#3D4F65">+ 本体感知</text>
  </g>

  <!-- CENTER: dynamics -->
  <g>
    <rect x="290" y="200" width="160" height="130" rx="14" fill="#1E3A5F"/>
    <text x="370" y="240" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC','Hiragino Sans GB',sans-serif" font-size="16" fill="#FFFFFF" font-weight="700">潜动力学 f_φ</text>
    <text x="370" y="270" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC','Hiragino Sans GB',sans-serif" font-size="13" fill="#A9C7E8">空间 + 因果时间</text>
    <text x="370" y="295" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC','Hiragino Sans GB',sans-serif" font-size="13" fill="#A9C7E8">注意力 Transformer</text>
  </g>

  <!-- arrows in -->
  <line x1="220" y1="130" x2="288" y2="220" stroke="#4B8BDA" stroke-width="1.8" marker-end="url(#arr)"/>
  <line x1="220" y1="220" x2="288" y2="248" stroke="#4B8BDA" stroke-width="1.8" marker-end="url(#arr)"/>
  <line x1="220" y1="310" x2="288" y2="278" stroke="#4B8BDA" stroke-width="1.8" marker-end="url(#arr)"/>
  <line x1="220" y1="400" x2="288" y2="308" stroke="#4B8BDA" stroke-width="1.8" marker-end="url(#arr)"/>

  <!-- RIGHT: outputs -->
  <g>
    <rect x="520" y="130" width="160" height="60" rx="8" fill="#EFF6FF" stroke="#4B8BDA" stroke-width="1.5"/>
    <text x="600" y="155" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC','Hiragino Sans GB',sans-serif" font-size="14" fill="#1E3A5F" font-weight="600">未来 h 帧</text>
    <text x="600" y="175" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC','Hiragino Sans GB',sans-serif" font-size="12" fill="#3D4F65">多视角图像</text>

    <rect x="520" y="220" width="160" height="60" rx="8" fill="#EFF6FF" stroke="#4B8BDA" stroke-width="1.5"/>
    <text x="600" y="245" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC','Hiragino Sans GB',sans-serif" font-size="14" fill="#1E3A5F" font-weight="600">本体状态</text>
    <text x="600" y="265" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC','Hiragino Sans GB',sans-serif" font-size="12" fill="#3D4F65">关节 + 夹爪</text>

    <rect x="520" y="310" width="160" height="60" rx="8" fill="#EFF6FF" stroke="#4B8BDA" stroke-width="1.5"/>
    <text x="600" y="335" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC','Hiragino Sans GB',sans-serif" font-size="14" fill="#1E3A5F" font-weight="600">奖励信号</text>
    <text x="600" y="355" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC','Hiragino Sans GB',sans-serif" font-size="12" fill="#3D4F65">reward</text>
  </g>

  <line x1="452" y1="225" x2="518" y2="165" stroke="#4B8BDA" stroke-width="1.8" marker-end="url(#arr)"/>
  <line x1="452" y1="265" x2="518" y2="250" stroke="#4B8BDA" stroke-width="1.8" marker-end="url(#arr)"/>
  <line x1="452" y1="305" x2="518" y2="340" stroke="#4B8BDA" stroke-width="1.8" marker-end="url(#arr)"/>

  <text x="360" y="455" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC','Hiragino Sans GB',sans-serif" font-size="12" fill="#3D4F65" font-style="italic">长程一致 · 高保真 · 高效推理</text>
</svg>