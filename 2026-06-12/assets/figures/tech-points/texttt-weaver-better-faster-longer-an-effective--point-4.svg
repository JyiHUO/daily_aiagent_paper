<svg xmlns="http://www.w3.org/2000/svg" width="720" height="480" viewBox="0 0 720 480">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4B8BDA"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="360" y="44" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC','Hiragino Sans GB',sans-serif" font-size="22" font-weight="700" fill="#1E3A5F">一个世界模型，三种用途</text>

  <!-- Central WEAVER hub -->
  <circle cx="200" cy="260" r="82" fill="#EFF6FF" stroke="#1E3A5F" stroke-width="2"/>
  <text x="200" y="252" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC','Hiragino Sans GB',sans-serif" font-size="24" font-weight="700" fill="#1E3A5F">WEAVER</text>
  <text x="200" y="278" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC','Hiragino Sans GB',sans-serif" font-size="13" fill="#3D4F65">想象世界</text>

  <!-- Arrows to three uses -->
  <line x1="266" y1="220" x2="436" y2="148" stroke="#4B8BDA" stroke-width="2.2" marker-end="url(#arr)"/>
  <line x1="284" y1="260" x2="436" y2="260" stroke="#4B8BDA" stroke-width="2.2" marker-end="url(#arr)"/>
  <line x1="266" y1="300" x2="436" y2="372" stroke="#4B8BDA" stroke-width="2.2" marker-end="url(#arr)"/>

  <!-- Use 1: Evaluation -->
  <rect x="440" y="108" width="230" height="80" rx="10" fill="#FEF3E7" stroke="#C97A3F" stroke-width="1.8"/>
  <text x="555" y="140" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC','Hiragino Sans GB',sans-serif" font-size="17" font-weight="700" fill="#1E3A5F">策略评估</text>
  <text x="555" y="165" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC','Hiragino Sans GB',sans-serif" font-size="13" fill="#3D4F65">与真机相关性 ρ = 0.87</text>

  <!-- Use 2: Improvement -->
  <rect x="440" y="220" width="230" height="80" rx="10" fill="#EFF6FF" stroke="#4B8BDA" stroke-width="1.8"/>
  <text x="555" y="252" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC','Hiragino Sans GB',sans-serif" font-size="17" font-weight="700" fill="#1E3A5F">策略改进</text>
  <text x="555" y="277" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC','Hiragino Sans GB',sans-serif" font-size="13" fill="#3D4F65">合成数据蒸馏，成功率 +38%</text>

  <!-- Use 3: Planning -->
  <rect x="440" y="332" width="230" height="80" rx="10" fill="#EAF4EC" stroke="#5B8C6E" stroke-width="1.8"/>
  <text x="555" y="364" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC','Hiragino Sans GB',sans-serif" font-size="17" font-weight="700" fill="#1E3A5F">测试时规划</text>
  <text x="555" y="389" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC','Hiragino Sans GB',sans-serif" font-size="13" fill="#3D4F65">best-of-4，提速约 20×</text>

  <!-- Bottom note -->
  <text x="200" y="400" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC','Hiragino Sans GB',sans-serif" font-size="12" fill="#3D4F65">仿真 + 评估 + 规划，合为一体</text>
</svg>