<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 460" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4B8BDA"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="400" y="40" text-anchor="middle" font-size="20" font-weight="bold" fill="#1E3A5F">Four Checkpoints, Frozen Model</text>
  <text x="400" y="62" text-anchor="middle" font-size="13" fill="#3D4F65">adapt the interface, not the weights</text>

  <!-- Agent (left) -->
  <circle cx="70" cy="250" r="36" fill="#FFF4E6" stroke="#D9914B" stroke-width="2"/>
  <text x="70" y="248" text-anchor="middle" font-size="13" font-weight="bold" fill="#1E3A5F">Agent</text>
  <text x="70" y="265" text-anchor="middle" font-size="10" fill="#3D4F65">(frozen)</text>

  <!-- Environment (right) -->
  <rect x="690" y="214" width="72" height="72" rx="6" fill="#FFF4E6" stroke="#D9914B" stroke-width="2"/>
  <text x="726" y="248" text-anchor="middle" font-size="13" font-weight="bold" fill="#1E3A5F">Env</text>
  <text x="726" y="265" text-anchor="middle" font-size="10" fill="#3D4F65">(frozen)</text>

  <!-- Main flow line -->
  <line x1="106" y1="250" x2="690" y2="250" stroke="#C8D3E0" stroke-width="2" stroke-dasharray="4,4"/>

  <!-- Gate 1: Contract -->
  <g>
    <rect x="150" y="215" width="110" height="70" rx="8" fill="#EFF6FF" stroke="#4B8BDA" stroke-width="2"/>
    <text x="205" y="205" text-anchor="middle" font-size="10" fill="#6B7A8F">before interaction</text>
    <text x="205" y="240" text-anchor="middle" font-size="13" font-weight="bold" fill="#1E3A5F">Contract</text>
    <text x="205" y="258" text-anchor="middle" font-size="10" fill="#3D4F65">explain rules</text>
    <text x="205" y="275" text-anchor="middle" font-size="10" fill="#3D4F65">&amp; tools</text>
  </g>

  <!-- Gate 2: Skill -->
  <g>
    <rect x="285" y="215" width="110" height="70" rx="8" fill="#EFF6FF" stroke="#4B8BDA" stroke-width="2"/>
    <text x="340" y="205" text-anchor="middle" font-size="10" fill="#6B7A8F">task conditioning</text>
    <text x="340" y="240" text-anchor="middle" font-size="13" font-weight="bold" fill="#1E3A5F">Skill</text>
    <text x="340" y="258" text-anchor="middle" font-size="10" fill="#3D4F65">recall playbook</text>
  </g>

  <!-- Gate 3: Action -->
  <g>
    <rect x="420" y="215" width="110" height="70" rx="8" fill="#FEF3F2" stroke="#D96B6B" stroke-width="2"/>
    <text x="475" y="205" text-anchor="middle" font-size="10" fill="#6B7A8F">pre-execute</text>
    <text x="475" y="240" text-anchor="middle" font-size="13" font-weight="bold" fill="#1E3A5F">Action</text>
    <text x="475" y="258" text-anchor="middle" font-size="10" fill="#3D4F65">check format</text>
  </g>

  <!-- Gate 4: Trajectory -->
  <g>
    <rect x="555" y="215" width="120" height="70" rx="8" fill="#FEF3F2" stroke="#D96B6B" stroke-width="2"/>
    <text x="615" y="205" text-anchor="middle" font-size="10" fill="#6B7A8F">post-execute</text>
    <text x="615" y="240" text-anchor="middle" font-size="13" font-weight="bold" fill="#1E3A5F">Trajectory</text>
    <text x="615" y="258" text-anchor="middle" font-size="10" fill="#3D4F65">break loops</text>
  </g>

  <!-- Arrows along the pipeline -->
  <line x1="106" y1="250" x2="148" y2="250" stroke="#4B8BDA" stroke-width="2" marker-end="url(#ar)"/>
  <line x1="260" y1="250" x2="283" y2="250" stroke="#4B8BDA" stroke-width="2" marker-end="url(#ar)"/>
  <line x1="395" y1="250" x2="418" y2="250" stroke="#4B8BDA" stroke-width="2" marker-end="url(#ar)"/>
  <line x1="530" y1="250" x2="553" y2="250" stroke="#4B8BDA" stroke-width="2" marker-end="url(#ar)"/>
  <line x1="675" y1="250" x2="688" y2="250" stroke="#4B8BDA" stroke-width="2" marker-end="url(#ar)"/>

  <!-- Bottom caption -->
  <text x="400" y="335" text-anchor="middle" font-size="12" fill="#3D4F65">each layer targets one failure mode at the model–environment interface</text>

  <!-- Legend -->
  <g transform="translate(230,375)">
    <rect x="0" y="0" width="14" height="10" fill="#EFF6FF" stroke="#4B8BDA"/>
    <text x="20" y="9" font-size="11" fill="#3D4F65">guidance layers (inject knowledge)</text>
  </g>
  <g transform="translate(230,395)">
    <rect x="0" y="0" width="14" height="10" fill="#FEF3F2" stroke="#D96B6B"/>
    <text x="20" y="9" font-size="11" fill="#3D4F65">guardrail layers (intercept &amp; correct)</text>
  </g>

  <text x="400" y="438" text-anchor="middle" font-size="11" font-style="italic" fill="#1E3A5F">Model weights untouched — only the harness around them changes.</text>
</svg>