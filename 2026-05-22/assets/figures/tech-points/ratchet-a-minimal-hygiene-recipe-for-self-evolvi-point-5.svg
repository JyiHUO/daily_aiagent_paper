<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 420" font-family="-apple-system,Segoe UI,Helvetica,sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4B8BDA"/>
    </marker>
  </defs>

  <text x="300" y="34" text-anchor="middle" font-size="18" font-weight="600" fill="#1E3A5F">同一治理循环，换一只手</text>
  <text x="300" y="54" text-anchor="middle" font-size="12" fill="#3D4F65">Ratchet on SWE-bench Verified · hard-150</text>

  <!-- Left: original recipe -->
  <g>
    <circle cx="130" cy="190" r="78" fill="#EFF6FF" stroke="#4B8BDA" stroke-width="1.8"/>
    <text x="130" y="170" text-anchor="middle" font-size="13" font-weight="600" fill="#1E3A5F">Ratchet 循环</text>
    <text x="130" y="190" text-anchor="middle" font-size="11" fill="#3D4F65">Router · Critic</text>
    <text x="130" y="206" text-anchor="middle" font-size="11" fill="#3D4F65">Synthesizer · Curator</text>
    <text x="130" y="288" text-anchor="middle" font-size="10" fill="#7A8AA0">生命周期治理（保持不变）</text>
  </g>

  <!-- swap arrow -->
  <g>
    <path d="M212,190 L312,190" stroke="#4B8BDA" stroke-width="2" fill="none" marker-end="url(#a)"/>
    <text x="262" y="180" text-anchor="middle" font-size="10" fill="#3D4F65">仅换 Solver</text>
  </g>

  <!-- Right: Claude Code agent + CLAUDE.md -->
  <g>
    <rect x="320" y="130" width="200" height="120" rx="10" fill="#FFF4E6" stroke="#D98E3A" stroke-width="1.8"/>
    <text x="420" y="158" text-anchor="middle" font-size="13" font-weight="600" fill="#1E3A5F">Claude Code agent</text>
    <text x="420" y="178" text-anchor="middle" font-size="11" fill="#3D4F65">浏览文件 · 跑测试 · 多步迭代</text>
    <rect x="350" y="200" width="140" height="36" rx="4" fill="#FFFFFF" stroke="#D98E3A" stroke-width="1.2"/>
    <text x="420" y="223" text-anchor="middle" font-size="11" fill="#1E3A5F">CLAUDE.md preamble</text>
  </g>

  <!-- skill injection arrow back (clean curve) -->
  <path d="M340,250 C300,290 200,285 165,255" stroke="#4B8BDA" stroke-width="1.6" stroke-dasharray="4 3" fill="none" marker-end="url(#a)"/>
  <text x="252" y="293" text-anchor="middle" font-size="10" fill="#3D4F65">技能注入：失败 pattern → 避坑条目</text>

  <!-- Lift result -->
  <g transform="translate(0,330)">
    <rect x="80" y="0" width="440" height="62" rx="8" fill="#EFF6FF" stroke="#B8D2EE"/>
    <text x="130" y="30" font-size="13" fill="#1E3A5F" font-weight="600">baseline 0.65</text>
    <path d="M225,26 L300,26" stroke="#4B8BDA" stroke-width="2" marker-end="url(#a)"/>
    <text x="385" y="30" font-size="13" fill="#1E3A5F" font-weight="600">peak 0.87 (+0.22)</text>
    <text x="300" y="50" text-anchor="middle" font-size="10" fill="#7A8AA0">不稳定任务 → 稳定通过（20 轮）</text>
  </g>
</svg>