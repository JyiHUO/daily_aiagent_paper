<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 420">
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4B8BDA"/>
    </marker>
  </defs>

  <text x="300" y="36" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="18" font-weight="bold" fill="#1E3A5F">同样的 few-shot 示例，两种命运</text>
  <text x="300" y="58" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#3D4F65">+1 伪装样例 / 领域</text>

  <!-- Shared example box -->
  <rect x="230" y="78" width="140" height="44" rx="8" fill="#FFF4E0" stroke="#E0A95B" stroke-width="1.5"/>
  <text x="300" y="105" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13" font-weight="bold" fill="#1E3A5F">伪装示例 (domain-camouflaged)</text>

  <!-- Arrows down -->
  <line x1="270" y1="122" x2="180" y2="185" stroke="#4B8BDA" stroke-width="2" marker-end="url(#ah)"/>
  <line x1="330" y1="122" x2="420" y2="185" stroke="#4B8BDA" stroke-width="2" marker-end="url(#ah)"/>

  <!-- Gemini side -->
  <rect x="50" y="190" width="240" height="180" rx="10" fill="#EFF6FF" stroke="#4B8BDA" stroke-width="1.5"/>
  <text x="170" y="215" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="14" font-weight="bold" fill="#1E3A5F">Gemini · 强模型</text>

  <!-- bright lightbulb -->
  <circle cx="170" cy="270" r="26" fill="#FFE08A" stroke="#E0A95B" stroke-width="2"/>
  <rect x="161" y="294" width="18" height="7" fill="#3D4F65"/>
  <line x1="170" y1="234" x2="170" y2="224" stroke="#E0A95B" stroke-width="2"/>
  <line x1="198" y1="270" x2="208" y2="270" stroke="#E0A95B" stroke-width="2"/>
  <line x1="142" y1="270" x2="132" y2="270" stroke="#E0A95B" stroke-width="2"/>
  <line x1="190" y1="250" x2="198" y2="242" stroke="#E0A95B" stroke-width="2"/>
  <line x1="150" y1="250" x2="142" y2="242" stroke="#E0A95B" stroke-width="2"/>

  <text x="170" y="335" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#3D4F65">抽象出规律，跨域迁移</text>
  <text x="170" y="358" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="14" font-weight="bold" fill="#1E3A5F">IDR 54.8% → 90.4%</text>

  <!-- Llama side -->
  <rect x="310" y="190" width="240" height="180" rx="10" fill="#F4EEF0" stroke="#B07A8A" stroke-width="1.5"/>
  <text x="430" y="215" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="14" font-weight="bold" fill="#1E3A5F">Llama · 弱模型</text>

  <circle cx="430" cy="270" r="26" fill="#E8E0E2" stroke="#B07A8A" stroke-width="2" stroke-dasharray="3,3"/>
  <rect x="421" y="294" width="18" height="7" fill="#3D4F65"/>
  <text x="430" y="277" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="22" font-weight="bold" fill="#B07A8A">?</text>

  <text x="430" y="335" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#3D4F65">只记表层句式，换域即漏</text>
  <text x="430" y="358" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="14" font-weight="bold" fill="#1E3A5F">IDR 11.1% → 19.4%</text>

  <text x="300" y="402" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#3D4F65" font-style="italic">便宜补丁救不了小模型 — 需架构级防御</text>
</svg>