<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4B8BDA"/>
    </marker>
  </defs>

  <text x="300" y="34" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="18" font-weight="600" fill="#1E3A5F">技能退役 · 贡献分门槛</text>
  <text x="300" y="56" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#3D4F65">证据要足够厚，才允许下架</text>

  <!-- Skill on trial: balance -->
  <g>
    <polygon points="300,250 282,288 318,288" fill="#1E3A5F"/>
    <line x1="170" y1="195" x2="430" y2="230" stroke="#1E3A5F" stroke-width="3"/>

    <!-- success pan -->
    <circle cx="170" cy="195" r="44" fill="#EFF6FF" stroke="#4B8BDA" stroke-width="2"/>
    <text x="170" y="192" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13" fill="#1E3A5F">成功 30</text>
    <text x="170" y="210" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#3D4F65">ĉ = −0.20</text>

    <!-- failure pan -->
    <circle cx="430" cy="230" r="52" fill="#FBE9E5" stroke="#D9774F" stroke-width="2"/>
    <text x="430" y="227" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13" fill="#1E3A5F">失败 50</text>
    <text x="430" y="245" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#3D4F65">n = 100</text>
  </g>

  <!-- Threshold gate -->
  <g>
    <rect x="60" y="320" width="200" height="56" rx="8" fill="#EFF6FF" stroke="#4B8BDA" stroke-width="1.5"/>
    <text x="160" y="343" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13" fill="#3D4F65">试用 n ≥ 100</text>
    <text x="160" y="363" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13" fill="#3D4F65">贡献分 ĉ ≤ −0.10</text>
  </g>

  <!-- Outcome: archived -->
  <g>
    <rect x="340" y="320" width="200" height="56" rx="8" fill="#F5F0E6" stroke="#B89668" stroke-width="1.5" stroke-dasharray="5,3"/>
    <text x="440" y="343" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="14" font-weight="600" fill="#1E3A5F">归档 · 不删除</text>
    <text x="440" y="363" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#3D4F65">退出检索 · 证据留存</text>
  </g>

  <!-- arrow gate -> archive -->
  <line x1="260" y1="348" x2="336" y2="348" stroke="#4B8BDA" stroke-width="2" marker-end="url(#arr)"/>

  <!-- arrow from balance down to gate -->
  <path d="M300,292 Q260,310 220,318" fill="none" stroke="#4B8BDA" stroke-width="1.8" marker-end="url(#arr)" stroke-dasharray="4,3"/>
</svg>