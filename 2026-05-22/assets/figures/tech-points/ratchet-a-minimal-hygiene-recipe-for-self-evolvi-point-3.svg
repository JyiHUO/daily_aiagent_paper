<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4B8BDA"/>
    </marker>
  </defs>

  <!-- 标题 -->
  <text x="300" y="32" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#1E3A5F">Failure-Cluster-Driven Synthesis</text>
  <text x="300" y="52" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#3D4F65">evidence-grounded skills, not self-reflection</text>

  <!-- 三个失败 capsule -->
  <g>
    <circle cx="80" cy="120" r="34" fill="#FDECEC" stroke="#D97A7A" stroke-width="1.5"/>
    <text x="80" y="118" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1E3A5F">fail #1</text>
    <text x="80" y="133" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#3D4F65">empty list</text>

    <circle cx="80" cy="220" r="34" fill="#FDECEC" stroke="#D97A7A" stroke-width="1.5"/>
    <text x="80" y="218" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1E3A5F">fail #2</text>
    <text x="80" y="233" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#3D4F65">empty list</text>

    <circle cx="80" cy="320" r="34" fill="#FDECEC" stroke="#D97A7A" stroke-width="1.5"/>
    <text x="80" y="318" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1E3A5F">fail #3</text>
    <text x="80" y="333" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#3D4F65">empty list</text>
  </g>

  <!-- 聚类 -->
  <g>
    <ellipse cx="290" cy="220" rx="82" ry="100" fill="#EFF6FF" stroke="#4B8BDA" stroke-width="1.8" stroke-dasharray="5 3"/>
    <text x="290" y="170" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#1E3A5F">same pattern</text>
    <text x="290" y="220" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#3D4F65">≥ 3 failures share</text>
    <text x="290" y="238" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#3D4F65">a canonical cluster</text>
    <text x="290" y="278" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#4B8BDA" font-style="italic">synthesis threshold</text>
  </g>

  <line x1="113" y1="130" x2="212" y2="180" stroke="#4B8BDA" stroke-width="1.5" marker-end="url(#ar)"/>
  <line x1="114" y1="220" x2="208" y2="220" stroke="#4B8BDA" stroke-width="1.5" marker-end="url(#ar)"/>
  <line x1="113" y1="310" x2="212" y2="260" stroke="#4B8BDA" stroke-width="1.5" marker-end="url(#ar)"/>

  <!-- 合成的技能 -->
  <g>
    <rect x="425" y="170" width="150" height="100" rx="8" fill="#FFF7E8" stroke="#E0A85C" stroke-width="1.8"/>
    <text x="500" y="195" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#1E3A5F">new skill</text>
    <text x="500" y="222" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#3D4F65">pitfall: handle</text>
    <text x="500" y="238" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#3D4F65">empty input first</text>
    <text x="500" y="258" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#4B8BDA" font-style="italic">grounded in real errors</text>
  </g>

  <line x1="372" y1="220" x2="423" y2="220" stroke="#4B8BDA" stroke-width="2" marker-end="url(#ar)"/>
</svg>