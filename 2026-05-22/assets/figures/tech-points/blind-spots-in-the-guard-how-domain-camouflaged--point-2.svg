<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 420" font-family="-apple-system, Segoe UI, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4B8BDA"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="300" y="34" text-anchor="middle" font-size="17" font-weight="700" fill="#1E3A5F">检测器：自信地错</text>
  <text x="300" y="56" text-anchor="middle" font-size="12" fill="#3D4F65">盲区是 categorical，不是 statistical</text>

  <!-- Camouflaged payload (left) -->
  <g>
    <rect x="40" y="115" width="160" height="80" rx="10" fill="#FEF3E7" stroke="#E0A96D" stroke-width="1.5"/>
    <text x="120" y="145" text-anchor="middle" font-size="13" font-weight="600" fill="#1E3A5F">伪装注入</text>
    <text x="120" y="172" text-anchor="middle" font-size="11" fill="#3D4F65">领域词汇 + 权威语气</text>
  </g>

  <!-- Detector as a confident guard with closed eyes -->
  <g>
    <circle cx="300" cy="200" r="58" fill="#EFF6FF" stroke="#4B8BDA" stroke-width="2"/>
    <line x1="278" y1="190" x2="292" y2="190" stroke="#1E3A5F" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="308" y1="190" x2="322" y2="190" stroke="#1E3A5F" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M283 215 Q300 226 317 215" fill="none" stroke="#1E3A5F" stroke-width="2.2" stroke-linecap="round"/>
    <text x="300" y="278" text-anchor="middle" font-size="12" font-weight="600" fill="#1E3A5F">检测器（闭眼自信）</text>
  </g>

  <!-- Verdict bubble (right) -->
  <g>
    <rect x="420" y="140" width="150" height="90" rx="10" fill="#E8F1E8" stroke="#6FA86F" stroke-width="1.5"/>
    <text x="495" y="170" text-anchor="middle" font-size="14" font-weight="700" fill="#2F6B3E">CLEAN ✓</text>
    <text x="495" y="194" text-anchor="middle" font-size="11" fill="#3D4F65">HIGH confidence</text>
    <text x="495" y="214" text-anchor="middle" font-size="11" fill="#3D4F65">96.7% 漏检</text>
  </g>

  <!-- Arrows -->
  <line x1="200" y1="155" x2="244" y2="185" stroke="#4B8BDA" stroke-width="2" marker-end="url(#a)"/>
  <line x1="358" y1="190" x2="418" y2="180" stroke="#4B8BDA" stroke-width="2" marker-end="url(#a)"/>

  <!-- Bottom contrast bar -->
  <g transform="translate(80,320)">
    <text x="0" y="0" font-size="12" font-weight="600" fill="#1E3A5F">静态注入  IDR 93.8%</text>
    <rect x="0" y="10" width="360" height="14" rx="3" fill="#4B8BDA"/>

    <text x="0" y="46" font-size="12" font-weight="600" fill="#1E3A5F">伪装注入  IDR 9.7%（Llama Guard 3 = 0）</text>
    <rect x="0" y="56" width="37" height="14" rx="3" fill="#D97757"/>
  </g>
</svg>