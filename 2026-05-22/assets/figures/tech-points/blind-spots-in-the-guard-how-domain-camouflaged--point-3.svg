<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" font-family="-apple-system,Segoe UI,sans-serif">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4B8BDA"/>
    </marker>
    <marker id="arR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#C26B5A"/>
    </marker>
  </defs>

  <text x="400" y="36" text-anchor="middle" font-size="19" font-weight="600" fill="#1E3A5F">辩论放大盲区：弱模型越辩越歪</text>

  <!-- Left: Weak model -->
  <g>
    <text x="200" y="78" text-anchor="middle" font-size="14" font-weight="600" fill="#3D4F65">弱模型 Llama 3.1 8B</text>

    <circle cx="110" cy="170" r="34" fill="#FBE4DE" stroke="#C26B5A" stroke-width="2"/>
    <text x="110" y="167" text-anchor="middle" font-size="13" fill="#1E3A5F">A</text>
    <text x="110" y="183" text-anchor="middle" font-size="10" fill="#C26B5A">伪装文档</text>

    <circle cx="270" cy="135" r="28" fill="#EFF6FF" stroke="#4B8BDA" stroke-width="2"/>
    <text x="270" y="140" text-anchor="middle" font-size="13" fill="#1E3A5F">B</text>
    <circle cx="270" cy="205" r="28" fill="#EFF6FF" stroke="#4B8BDA" stroke-width="2"/>
    <text x="270" y="210" text-anchor="middle" font-size="13" fill="#1E3A5F">C</text>

    <line x1="143" y1="158" x2="243" y2="138" stroke="#C26B5A" stroke-width="2" marker-end="url(#arR)"/>
    <line x1="143" y1="183" x2="243" y2="202" stroke="#C26B5A" stroke-width="2" marker-end="url(#arR)"/>

    <rect x="70" y="260" width="270" height="62" rx="8" fill="#FBE4DE" stroke="#C26B5A" stroke-width="2"/>
    <text x="205" y="284" text-anchor="middle" font-size="13" fill="#1E3A5F">多数投票 → 恶意指令</text>
    <text x="205" y="310" text-anchor="middle" font-size="17" font-weight="700" fill="#C26B5A">DAF ≈ 9.9×</text>

    <text x="205" y="358" text-anchor="middle" font-size="11" fill="#3D4F65" font-style="italic">看不破伪装，反被"专业"说服</text>
  </g>

  <line x1="400" y1="70" x2="400" y2="395" stroke="#D0D7DE" stroke-width="1" stroke-dasharray="4 4"/>

  <!-- Right: Strong model -->
  <g>
    <text x="600" y="78" text-anchor="middle" font-size="14" font-weight="600" fill="#3D4F65">强模型 Gemini 2.0 Flash</text>

    <circle cx="510" cy="170" r="34" fill="#FBE4DE" stroke="#C26B5A" stroke-width="2"/>
    <text x="510" y="167" text-anchor="middle" font-size="13" fill="#1E3A5F">A</text>
    <text x="510" y="183" text-anchor="middle" font-size="10" fill="#C26B5A">伪装文档</text>

    <circle cx="670" cy="135" r="28" fill="#EFF6FF" stroke="#4B8BDA" stroke-width="2"/>
    <text x="670" y="140" text-anchor="middle" font-size="13" fill="#1E3A5F">B</text>
    <circle cx="670" cy="205" r="28" fill="#EFF6FF" stroke="#4B8BDA" stroke-width="2"/>
    <text x="670" y="210" text-anchor="middle" font-size="13" fill="#1E3A5F">C</text>

    <line x1="642" y1="138" x2="544" y2="158" stroke="#4B8BDA" stroke-width="2" marker-end="url(#ar)"/>
    <line x1="642" y1="202" x2="544" y2="183" stroke="#4B8BDA" stroke-width="2" marker-end="url(#ar)"/>

    <rect x="465" y="260" width="270" height="62" rx="8" fill="#EFF6FF" stroke="#4B8BDA" stroke-width="2"/>
    <text x="600" y="284" text-anchor="middle" font-size="13" fill="#1E3A5F">多数投票 → 正确答案</text>
    <text x="600" y="310" text-anchor="middle" font-size="17" font-weight="700" fill="#2A6BB8">DAF ≈ 0.6×</text>

    <text x="600" y="358" text-anchor="middle" font-size="11" fill="#3D4F65" font-style="italic">交叉质疑，集体抵抗</text>
  </g>

  <rect x="120" y="410" width="560" height="60" rx="8" fill="#FFF7E6" stroke="#D9A441" stroke-width="1.5"/>
  <text x="400" y="434" text-anchor="middle" font-size="13" fill="#1E3A5F" font-weight="600">辩论 ≠ 自动安全增强</text>
  <text x="400" y="455" text-anchor="middle" font-size="11" fill="#3D4F65">能力不足时，从众压力把单点污染放大成共识</text>
</svg>