<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" font-family="'Helvetica Neue',Arial,sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4B8BDA"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#D9534F"/>
    </marker>
  </defs>

  <rect width="1000" height="620" fill="#FAFBFD"/>

  <!-- Title -->
  <text x="500" y="44" text-anchor="middle" font-size="22" font-weight="700" fill="#1E3A5F">BenchJack：给 Agent Benchmark 跑一次自动渗透测试</text>
  <text x="500" y="68" text-anchor="middle" font-size="13" fill="#3D4F65">10 个主流榜单 · 219 个漏洞 · 接近满分却一题未解</text>

  <!-- LEFT: Benchmark as castle under attack -->
  <g transform="translate(70,130)">
    <text x="160" y="-10" text-anchor="middle" font-size="13" font-weight="600" fill="#1E3A5F">Agent Benchmark</text>

    <path d="M160,20 L260,55 L260,180 Q260,260 160,300 Q60,260 60,180 L60,55 Z"
          fill="#EFF6FF" stroke="#4B8BDA" stroke-width="2"/>

    <path d="M110,90 L135,140 L120,180 L150,230" fill="none" stroke="#D9534F" stroke-width="2" stroke-dasharray="4,3"/>
    <path d="M210,80 L185,130 L205,170 L180,220" fill="none" stroke="#D9534F" stroke-width="2" stroke-dasharray="4,3"/>

    <text x="160" y="155" text-anchor="middle" font-size="34" font-weight="700" fill="#D9534F">≈100%</text>
    <text x="160" y="178" text-anchor="middle" font-size="12" fill="#3D4F65">满分但 0 任务真正解决</text>

    <text x="160" y="335" text-anchor="middle" font-size="11" fill="#3D4F65">SWE-bench · WebArena · OSWorld · MLE-Bench …</text>
  </g>

  <!-- CENTER: BenchJack engine -->
  <g transform="translate(400,150)">
    <rect x="0" y="0" width="200" height="280" rx="14" fill="#FFF6E8" stroke="#E89B3C" stroke-width="2"/>
    <text x="100" y="28" text-anchor="middle" font-size="15" font-weight="700" fill="#1E3A5F">BenchJack</text>
    <text x="100" y="46" text-anchor="middle" font-size="10" fill="#7A5A2E">自动红队 orchestrator</text>

    <line x1="20" y1="58" x2="180" y2="58" stroke="#E89B3C" stroke-width="1" stroke-dasharray="3,2"/>

    <g transform="translate(15,72)">
      <circle cx="10" cy="10" r="9" fill="#E89B3C"/>
      <text x="10" y="14" text-anchor="middle" font-size="10" font-weight="700" fill="#fff">1</text>
      <text x="28" y="9" font-size="11" font-weight="600" fill="#1E3A5F">侦察</text>
      <text x="28" y="22" font-size="10" fill="#3D4F65">入口 / 评分 / 信任边界</text>
    </g>

    <g transform="translate(15,128)">
      <circle cx="10" cy="10" r="9" fill="#E89B3C"/>
      <text x="10" y="14" text-anchor="middle" font-size="10" font-weight="700" fill="#fff">2</text>
      <text x="28" y="9" font-size="11" font-weight="600" fill="#1E3A5F">对照清单扫描</text>
      <text x="28" y="22" font-size="10" fill="#3D4F65">8 类漏洞 · flaw ledger</text>
    </g>

    <g transform="translate(15,184)">
      <circle cx="10" cy="10" r="9" fill="#E89B3C"/>
      <text x="10" y="14" text-anchor="middle" font-size="10" font-weight="700" fill="#fff">3</text>
      <text x="28" y="9" font-size="11" font-weight="600" fill="#1E3A5F">合成 exploit</text>
      <text x="28" y="22" font-size="10" fill="#3D4F65">走官方入口 · run.sh</text>
    </g>

    <g transform="translate(15,236)">
      <rect x="0" y="0" width="170" height="32" rx="6" fill="#EFF6FF" stroke="#4B8BDA"/>
      <text x="85" y="14" text-anchor="middle" font-size="10" font-weight="600" fill="#1E3A5F">Agent-Eval Checklist</text>
      <text x="85" y="26" text-anchor="middle" font-size="9" fill="#3D4F65">30 个二元问题 / 7 类</text>
    </g>
  </g>

  <!-- RIGHT: GAN loop / hardened benchmark -->
  <g transform="translate(770,130)">
    <text x="80" y="-10" text-anchor="middle" font-size="13" font-weight="600" fill="#1E3A5F">迭代加固</text>

    <circle cx="80" cy="160" r="95" fill="none" stroke="#4B8BDA" stroke-width="1.5" stroke-dasharray="5,4"/>

    <!-- attacker node -->
    <rect x="20" y="70" width="120" height="46" rx="8" fill="#FFF0EE" stroke="#D9534F" stroke-width="1.5"/>
    <text x="80" y="90" text-anchor="middle" font-size="11" font-weight="700" fill="#1E3A5F">攻击者</text>
    <text x="80" y="106" text-anchor="middle" font-size="10" fill="#3D4F65">BenchJack 找新洞</text>

    <!-- defender node -->
    <rect x="20" y="204" width="120" height="46" rx="8" fill="#E8F4EA" stroke="#4FA363" stroke-width="1.5"/>
    <text x="80" y="224" text-anchor="middle" font-size="11" font-weight="700" fill="#1E3A5F">防御者</text>
    <text x="80" y="240" text-anchor="middle" font-size="10" fill="#3D4F65">Coding agent 打补丁</text>

    <!-- loop arrows -->
    <path d="M140,116 Q175,160 140,200" fill="none" stroke="#4B8BDA" stroke-width="2" marker-end="url(#arr)"/>
    <path d="M20,204 Q-15,160 20,120" fill="none" stroke="#4B8BDA" stroke-width="2" marker-end="url(#arr)"/>

    <!-- result -->
    <rect x="0" y="290" width="160" height="46" rx="8" fill="#EFF6FF" stroke="#4B8BDA" stroke-width="1.5"/>
    <text x="80" y="309" text-anchor="middle" font-size="11" font-weight="700" fill="#1E3A5F">3 轮内 hack 率 → 0</text>
    <text x="80" y="325" text-anchor="middle" font-size="10" fill="#3D4F65">WebArena · OSWorld 完全修补</text>
  </g>

  <!-- Arrows: Benchmark -> BenchJack -->
  <path d="M330,280 L398,280" stroke="#D9534F" stroke-width="2.5" fill="none" marker-end="url(#arrR)"/>
  <text x="364" y="270" text-anchor="middle" font-size="10" fill="#D9534F" font-weight="600">审计</text>

  <!-- Arrows: BenchJack -> loop -->
  <path d="M602,290 L768,270" stroke="#4B8BDA" stroke-width="2.5" fill="none" marker-end="url(#arr)"/>
  <text x="685" y="272" text-anchor="middle" font-size="10" fill="#4B8BDA" font-weight="600">驱动闭环</text>

  <!-- Bottom: 8 vulnerability classes strip -->
  <g transform="translate(70,500)">
    <text x="0" y="0" font-size="12" font-weight="700" fill="#1E3A5F">8 类漏洞模式 · 清单化为 OWASP-style 设计指南</text>

    <g font-size="10" fill="#3D4F65">
      <rect x="0" y="14" width="108" height="26" rx="4" fill="#EFF6FF" stroke="#4B8BDA"/>
      <text x="54" y="31" text-anchor="middle">V1 隔离失败</text>

      <rect x="115" y="14" width="108" height="26" rx="4" fill="#EFF6FF" stroke="#4B8BDA"/>
      <text x="169" y="31" text-anchor="middle">V2 答案随测试发</text>

      <rect x="230" y="14" width="108" height="26" rx="4" fill="#EFF6FF" stroke="#4B8BDA"/>
      <text x="284" y="31" text-anchor="middle">V3 评估器 RCE</text>

      <rect x="345" y="14" width="108" height="26" rx="4" fill="#EFF6FF" stroke="#4B8BDA"/>
      <text x="399" y="31" text-anchor="middle">V4 Judge 注入</text>

      <rect x="460" y="14" width="108" height="26" rx="4" fill="#EFF6FF" stroke="#4B8BDA"/>
      <text x="514" y="31" text-anchor="middle">V5 弱字符串匹配</text>

      <rect x="575" y="14" width="108" height="26" rx="4" fill="#EFF6FF" stroke="#4B8BDA"/>
      <text x="629" y="31" text-anchor="middle">V6 评分逻辑漏洞</text>

      <rect x="690" y="14" width="108" height="26" rx="4" fill="#EFF6FF" stroke="#4B8BDA"/>
      <text x="744" y="31" text-anchor="middle">V7 信任不可信输出</text>

      <rect x="805" y="14" width="108" height="26" rx="4" fill="#EFF6FF" stroke="#4B8BDA"/>
      <text x="859" y="31" text-anchor="middle">V8 过度权限</text>
    </g>

    <text x="0" y="64" font-size="11" fill="#3D4F65">评测流水线尚未内化对抗思维 — 主动审计能堵上 benchmark 的安全缺口。</text>
  </g>
</svg>