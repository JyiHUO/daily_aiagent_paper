<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" font-family="'Helvetica Neue',Arial,'PingFang SC','Microsoft YaHei',sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4B8BDA"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#C84A3F"/>
    </marker>
  </defs>

  <rect width="900" height="600" fill="#FAF8F4"/>

  <!-- Title -->
  <text x="450" y="44" text-anchor="middle" font-size="22" font-weight="700" fill="#1E3A5F">无需攻击：Skill 自己违反自己写的规则</text>
  <text x="450" y="68" text-anchor="middle" font-size="13" fill="#3D4F65">Sefz · 把自然语言 guardrail 翻译成可达性目标，用语义 fuzz 找规范违规</text>

  <!-- LEFT: Skill specification (the contract) -->
  <g>
    <rect x="50" y="110" width="220" height="170" rx="10" fill="#EFF6FF" stroke="#4B8BDA" stroke-width="1.5"/>
    <text x="160" y="134" text-anchor="middle" font-size="14" font-weight="700" fill="#1E3A5F">Skill 规范 (自然语言)</text>
    <text x="68" y="162" font-size="12" fill="#3D4F65">“删除前需用户确认”</text>
    <text x="68" y="184" font-size="12" fill="#3D4F65">“publish 必须带 --confirm”</text>
    <text x="68" y="206" font-size="12" fill="#3D4F65">“凭据不得外泄”</text>
    <line x1="68" y1="222" x2="252" y2="222" stroke="#B8C5D6" stroke-dasharray="3,3"/>
    <text x="160" y="246" text-anchor="middle" font-size="11" fill="#7B5E3F" font-style="italic">用户安装时所信任的契约</text>
    <text x="160" y="264" text-anchor="middle" font-size="11" fill="#7B5E3F" font-style="italic">却常被静默绕过</text>
  </g>

  <!-- CENTER: Sefz core engine -->
  <g>
    <circle cx="450" cy="320" r="128" fill="#FFF6E8" stroke="#E8A33D" stroke-width="2"/>
    <text x="450" y="218" text-anchor="middle" font-size="20" font-weight="800" fill="#1E3A5F">Sefz</text>
    <text x="450" y="236" text-anchor="middle" font-size="11" fill="#7B5E3F">语义 fuzz 引擎</text>

    <rect x="362" y="258" width="176" height="32" rx="6" fill="#FFFFFF" stroke="#E8A33D"/>
    <text x="450" y="279" text-anchor="middle" font-size="12" font-weight="600" fill="#1E3A5F">① guardrail → 可达性目标</text>

    <rect x="362" y="296" width="176" height="32" rx="6" fill="#FFFFFF" stroke="#E8A33D"/>
    <text x="450" y="317" text-anchor="middle" font-size="12" font-weight="600" fill="#1E3A5F">② LLM 语义变异 (16 算子)</text>

    <rect x="362" y="334" width="176" height="32" rx="6" fill="#FFFFFF" stroke="#E8A33D"/>
    <text x="450" y="355" text-anchor="middle" font-size="12" font-weight="600" fill="#1E3A5F">③ Bandit · 目标接近度反馈</text>

    <text x="450" y="395" text-anchor="middle" font-size="11" fill="#3D4F65">输入 → trace 图 → 是否绕过 gate?</text>
  </g>

  <!-- arrow spec -> sefz -->
  <path d="M 270 210 Q 315 230 340 270" fill="none" stroke="#4B8BDA" stroke-width="2" marker-end="url(#arr)"/>
  <text x="278" y="252" font-size="11" fill="#4B8BDA">提取约束骨架</text>

  <!-- RIGHT: violation traces / outcome -->
  <g>
    <rect x="630" y="110" width="220" height="170" rx="10" fill="#FBEFEC" stroke="#C84A3F" stroke-width="1.5"/>
    <text x="740" y="134" text-anchor="middle" font-size="14" font-weight="700" fill="#1E3A5F">规范违规 (良性输入触发)</text>

    <text x="648" y="162" font-size="12" fill="#3D4F65">user → exec(--force) → delete</text>
    <text x="648" y="180" font-size="11" fill="#C84A3F">✗ 路径未经过 ask 节点</text>

    <text x="648" y="206" font-size="12" fill="#3D4F65">CLI 失败 → curl PUT 回退</text>
    <text x="648" y="224" font-size="11" fill="#C84A3F">✗ --confirm flag 被跳过</text>

    <text x="648" y="250" font-size="12" fill="#3D4F65">凭据 → 外部 host</text>
    <text x="648" y="268" font-size="11" fill="#C84A3F">✗ 数据外泄链可达</text>
  </g>

  <!-- arrow sefz -> violations -->
  <path d="M 560 270 Q 600 235 630 210" fill="none" stroke="#C84A3F" stroke-width="2" marker-end="url(#arrR)"/>
  <text x="572" y="232" font-size="11" fill="#C84A3F">图查询判定</text>

  <!-- BOTTOM: results bar -->
  <g>
    <rect x="120" y="500" width="660" height="68" rx="10" fill="#EFF6FF" stroke="#4B8BDA" stroke-width="1.2"/>

    <text x="200" y="528" text-anchor="middle" font-size="22" font-weight="800" fill="#C84A3F">29.9%</text>
    <text x="200" y="550" text-anchor="middle" font-size="11" fill="#3D4F65">402 真实 skill 中</text>
    <text x="200" y="563" text-anchor="middle" font-size="11" fill="#3D4F65">120 个被发现违规</text>

    <line x1="320" y1="514" x2="320" y2="556" stroke="#B8C5D6"/>

    <text x="450" y="528" text-anchor="middle" font-size="22" font-weight="800" fill="#C84A3F">26</text>
    <text x="450" y="550" text-anchor="middle" font-size="11" fill="#3D4F65">部署中已可利用的</text>
    <text x="450" y="563" text-anchor="middle" font-size="11" fill="#3D4F65">零日 guardrail 违规</text>

    <line x1="580" y1="514" x2="580" y2="556" stroke="#B8C5D6"/>

    <text x="700" y="528" text-anchor="middle" font-size="22" font-weight="800" fill="#1E3A5F">~11 分钟</text>
    <text x="700" y="550" text-anchor="middle" font-size="11" fill="#3D4F65">单 skill 平均收敛时间</text>
    <text x="700" y="563" text-anchor="middle" font-size="11" fill="#3D4F65">无需任何攻击者输入</text>
  </g>

  <!-- feedback loop arrow from results back to sefz -->
  <path d="M 450 500 L 450 452" fill="none" stroke="#4B8BDA" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arr)"/>
</svg>