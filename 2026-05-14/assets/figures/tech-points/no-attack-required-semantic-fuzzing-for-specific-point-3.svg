<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 440">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4B8BDA"/>
    </marker>
    <marker id="aro" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#E89B4C"/>
    </marker>
  </defs>

  <text x="320" y="32" text-anchor="middle" font-family="Helvetica,Arial" font-size="18" font-weight="700" fill="#1E3A5F">Goal-Directed Semantic Mutation</text>
  <text x="320" y="52" text-anchor="middle" font-family="Helvetica,Arial" font-size="12" fill="#3D4F65">a bandit picks which way to bend the rule</text>

  <!-- Bandit hub -->
  <circle cx="320" cy="225" r="58" fill="#FFF3E0" stroke="#E89B4C" stroke-width="2"/>
  <text x="320" y="218" text-anchor="middle" font-family="Helvetica,Arial" font-size="13" font-weight="700" fill="#1E3A5F">Thompson Bandit</text>
  <text x="320" y="236" text-anchor="middle" font-family="Helvetica,Arial" font-size="11" fill="#3D4F65">Beta posterior / arm</text>

  <!-- Four arms -->
  <g font-family="Helvetica,Arial" font-size="11" fill="#1E3A5F">
    <rect x="40" y="95" width="180" height="56" rx="8" fill="#EFF6FF" stroke="#4B8BDA" stroke-width="1.5"/>
    <text x="130" y="117" text-anchor="middle" font-weight="700">Confirmation Weakening</text>
    <text x="130" y="135" text-anchor="middle" fill="#3D4F65">"my wife already agreed"</text>

    <rect x="420" y="95" width="180" height="56" rx="8" fill="#EFF6FF" stroke="#4B8BDA" stroke-width="1.5"/>
    <text x="510" y="117" text-anchor="middle" font-weight="700">Precondition Skipping</text>
    <text x="510" y="135" text-anchor="middle" fill="#3D4F65">urgency / authority</text>

    <rect x="40" y="299" width="180" height="56" rx="8" fill="#EFF6FF" stroke="#4B8BDA" stroke-width="1.5"/>
    <text x="130" y="321" text-anchor="middle" font-weight="700">Action Reframing</text>
    <text x="130" y="339" text-anchor="middle" fill="#3D4F65">rewrite the verb</text>

    <rect x="420" y="299" width="180" height="56" rx="8" fill="#EFF6FF" stroke="#4B8BDA" stroke-width="1.5"/>
    <text x="510" y="321" text-anchor="middle" font-weight="700">Resource Redirection</text>
    <text x="510" y="339" text-anchor="middle" fill="#3D4F65">boundary targets</text>
  </g>

  <!-- Selection arrows: bandit -> arms -->
  <line x1="278" y1="195" x2="220" y2="151" stroke="#4B8BDA" stroke-width="2" marker-end="url(#ar)"/>
  <line x1="362" y1="195" x2="420" y2="151" stroke="#4B8BDA" stroke-width="1.6" marker-end="url(#ar)" stroke-dasharray="3,3" opacity="0.6"/>
  <line x1="278" y1="255" x2="220" y2="299" stroke="#4B8BDA" stroke-width="1.6" marker-end="url(#ar)" stroke-dasharray="3,3" opacity="0.6"/>
  <line x1="362" y1="255" x2="420" y2="299" stroke="#4B8BDA" stroke-width="1.6" marker-end="url(#ar)" stroke-dasharray="3,3" opacity="0.6"/>

  <!-- Reward feedback: arm -> bandit -->
  <path d="M 215 145 C 250 175 270 185 268 200" fill="none" stroke="#E89B4C" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#aro)"/>
  <text x="218" y="183" font-family="Helvetica,Arial" font-size="10" fill="#8A6A3A" font-style="italic">reward</text>

  <text x="320" y="402" text-anchor="middle" font-family="Helvetica,Arial" font-size="11" fill="#3D4F65">reward = goal-proximity (0, 1/3, 2/3, 1) + signature novelty</text>
  <text x="320" y="421" text-anchor="middle" font-family="Helvetica,Arial" font-size="10" fill="#8A6A3A" font-style="italic">near-violation traces still earn partial credit</text>
</svg>