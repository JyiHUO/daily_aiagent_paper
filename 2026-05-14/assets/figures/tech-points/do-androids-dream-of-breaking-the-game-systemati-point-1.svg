<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 420" font-family="Helvetica, Arial, sans-serif">
  <rect width="600" height="420" fill="#FAF7F2"/>

  <!-- Title -->
  <text x="300" y="38" text-anchor="middle" font-size="17" font-weight="700" fill="#1E3A5F">Agent-Eval Checklist</text>
  <text x="300" y="58" text-anchor="middle" font-size="12" fill="#3D4F65">an OWASP-style list for benchmarks</text>

  <!-- Clipboard -->
  <rect x="180" y="90" width="240" height="290" rx="10" fill="#EFF6FF" stroke="#4B8BDA" stroke-width="2"/>
  <rect x="255" y="78" width="90" height="22" rx="5" fill="#4B8BDA"/>
  <text x="300" y="94" text-anchor="middle" font-size="11" fill="#FFFFFF" font-weight="600">8 vulnerabilities</text>

  <!-- Checklist items -->
  <g font-size="12" fill="#1E3A5F">
    <rect x="200" y="118" width="12" height="12" fill="none" stroke="#4B8BDA" stroke-width="1.5"/>
    <path d="M202 124 l3 3 l6 -7" fill="none" stroke="#E07856" stroke-width="2"/>
    <text x="222" y="129">V1  Isolation failure</text>

    <rect x="200" y="143" width="12" height="12" fill="none" stroke="#4B8BDA" stroke-width="1.5"/>
    <path d="M202 149 l3 3 l6 -7" fill="none" stroke="#E07856" stroke-width="2"/>
    <text x="222" y="154">V2  Answers shipped with tests</text>

    <rect x="200" y="168" width="12" height="12" fill="none" stroke="#4B8BDA" stroke-width="1.5"/>
    <text x="222" y="179">V3  Evaluator RCE</text>

    <rect x="200" y="193" width="12" height="12" fill="none" stroke="#4B8BDA" stroke-width="1.5"/>
    <text x="222" y="204">V4  Judge prompt injection</text>

    <rect x="200" y="218" width="12" height="12" fill="none" stroke="#4B8BDA" stroke-width="1.5"/>
    <text x="222" y="229">V5  Weak string match</text>

    <rect x="200" y="243" width="12" height="12" fill="none" stroke="#4B8BDA" stroke-width="1.5"/>
    <text x="222" y="254">V6  Scoring logic flaw</text>

    <rect x="200" y="268" width="12" height="12" fill="none" stroke="#4B8BDA" stroke-width="1.5"/>
    <path d="M202 274 l3 3 l6 -7" fill="none" stroke="#E07856" stroke-width="2"/>
    <text x="222" y="279">V7  Trusts agent outputs</text>

    <rect x="200" y="293" width="12" height="12" fill="none" stroke="#4B8BDA" stroke-width="1.5"/>
    <text x="222" y="304">V8  Excessive privilege</text>
  </g>

  <!-- Divider for smoke test -->
  <line x1="200" y1="325" x2="400" y2="325" stroke="#4B8BDA" stroke-dasharray="3,3"/>
  <text x="300" y="345" text-anchor="middle" font-size="11" fill="#3D4F65" font-style="italic">+ adversarial smoke test</text>
  <text x="300" y="365" text-anchor="middle" font-size="11" fill="#3D4F65">30 yes/no questions, 7 categories</text>

  <!-- Left: benchmark designer -->
  <circle cx="80" cy="200" r="28" fill="#FFE9DC" stroke="#E07856" stroke-width="2"/>
  <text x="80" y="207" text-anchor="middle" font-size="22">📋</text>
  <text x="80" y="248" text-anchor="middle" font-size="11" fill="#1E3A5F" font-weight="600">designer</text>
  <text x="80" y="264" text-anchor="middle" font-size="10" fill="#3D4F65">checks before release</text>

  <!-- Right: blocked hacker -->
  <circle cx="520" cy="200" r="28" fill="#EFF6FF" stroke="#4B8BDA" stroke-width="2"/>
  <text x="520" y="207" text-anchor="middle" font-size="22">🤖</text>
  <text x="520" y="248" text-anchor="middle" font-size="11" fill="#1E3A5F" font-weight="600">reward hacker</text>
  <text x="520" y="264" text-anchor="middle" font-size="10" fill="#3D4F65">blocked</text>

  <!-- Arrows -->
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4B8BDA"/>
    </marker>
    <marker id="arRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#E07856"/>
    </marker>
  </defs>

  <line x1="111" y1="200" x2="178" y2="200" stroke="#4B8BDA" stroke-width="2" marker-end="url(#ar)"/>

  <!-- Shield blocking hacker -->
  <path d="M448 200 L470 186 L470 214 Z" fill="#E07856" opacity="0.3" stroke="#E07856" stroke-width="1.5"/>
  <line x1="489" y1="200" x2="475" y2="200" stroke="#E07856" stroke-width="2" stroke-dasharray="4,3" marker-end="url(#arRed)"/>
</svg>