<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif">
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4B8BDA"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="400" y="40" text-anchor="middle" font-size="20" font-weight="600" fill="#1E3A5F">从"补丁过测试"到"可回放的证据包"</text>
  <text x="400" y="62" text-anchor="middle" font-size="13" fill="#3D4F65">Trace-based Auditable Evaluation</text>

  <!-- LEFT: traditional view -->
  <g>
    <rect x="60" y="120" width="200" height="200" rx="10" fill="#FAF3E8" stroke="#C9A86A" stroke-width="1.5"/>
    <text x="160" y="148" text-anchor="middle" font-size="13" fill="#1E3A5F" font-weight="600">传统评测：只看终点</text>

    <rect x="115" y="180" width="90" height="70" rx="4" fill="#fff" stroke="#C9A86A"/>
    <line x1="125" y1="200" x2="195" y2="200" stroke="#C9A86A" stroke-width="1.2"/>
    <line x1="125" y1="215" x2="180" y2="215" stroke="#C9A86A" stroke-width="1.2"/>
    <line x1="125" y1="230" x2="190" y2="230" stroke="#C9A86A" stroke-width="1.2"/>
    <text x="160" y="285" text-anchor="middle" font-size="12" fill="#3D4F65">patch 过测试 ?</text>
    <text x="160" y="305" text-anchor="middle" font-size="11" fill="#7A6A45">→ 是/否</text>
  </g>

  <!-- arrow between -->
  <line x1="275" y1="220" x2="338" y2="220" stroke="#4B8BDA" stroke-width="2" marker-end="url(#ah)"/>

  <!-- RIGHT: episode package -->
  <g>
    <rect x="350" y="100" width="400" height="340" rx="12" fill="#EFF6FF" stroke="#4B8BDA" stroke-width="1.8"/>
    <text x="550" y="124" text-anchor="middle" font-size="13" font-weight="600" fill="#1E3A5F">Episode Package · 留痕证据</text>
    <text x="550" y="142" text-anchor="middle" font-size="11" fill="#3D4F65">8 类 JSONL trace + patch + verification report</text>

    <!-- 8 trace tags -->
    <g font-size="11" fill="#1E3A5F">
      <rect x="370" y="158" width="110" height="26" rx="13" fill="#fff" stroke="#4B8BDA"/>
      <text x="425" y="175" text-anchor="middle">action</text>

      <rect x="490" y="158" width="110" height="26" rx="13" fill="#fff" stroke="#4B8BDA"/>
      <text x="545" y="175" text-anchor="middle">tool</text>

      <rect x="610" y="158" width="120" height="26" rx="13" fill="#fff" stroke="#4B8BDA"/>
      <text x="670" y="175" text-anchor="middle">context</text>

      <rect x="370" y="192" width="110" height="26" rx="13" fill="#fff" stroke="#4B8BDA"/>
      <text x="425" y="209" text-anchor="middle">verification</text>

      <rect x="490" y="192" width="110" height="26" rx="13" fill="#fff" stroke="#4B8BDA"/>
      <text x="545" y="209" text-anchor="middle">attribution</text>

      <rect x="610" y="192" width="120" height="26" rx="13" fill="#fff" stroke="#4B8BDA"/>
      <text x="670" y="209" text-anchor="middle">intervention</text>

      <rect x="430" y="226" width="110" height="26" rx="13" fill="#fff" stroke="#4B8BDA"/>
      <text x="485" y="243" text-anchor="middle">entropy</text>

      <rect x="550" y="226" width="120" height="26" rx="13" fill="#fff" stroke="#4B8BDA"/>
      <text x="610" y="243" text-anchor="middle">outcome</text>
    </g>

    <!-- divider arrow -->
    <line x1="550" y1="262" x2="550" y2="290" stroke="#4B8BDA" stroke-width="1.6" marker-end="url(#ah)"/>

    <!-- 5-label classifier -->
    <text x="550" y="312" text-anchor="middle" font-size="12" font-weight="600" fill="#1E3A5F">五标签归类</text>

    <g font-size="10.5">
      <rect x="370" y="322" width="160" height="26" rx="4" fill="#DCEFDC" stroke="#5BA66B"/>
      <text x="450" y="339" text-anchor="middle" fill="#1E3A5F">autonomous-verified ✓</text>

      <rect x="540" y="322" width="160" height="26" rx="4" fill="#E8F0DC" stroke="#8FAE5B"/>
      <text x="620" y="339" text-anchor="middle" fill="#1E3A5F">assisted-verified ✓</text>

      <rect x="370" y="356" width="160" height="26" rx="4" fill="#FFF3D6" stroke="#D9A93A"/>
      <text x="450" y="373" text-anchor="middle" fill="#1E3A5F">unverified-success ?</text>

      <rect x="540" y="356" width="160" height="26" rx="4" fill="#FBE0DA" stroke="#C97262"/>
      <text x="620" y="373" text-anchor="middle" fill="#1E3A5F">failed</text>

      <rect x="455" y="390" width="190" height="26" rx="4" fill="#F0DCE8" stroke="#A05E8C"/>
      <text x="550" y="407" text-anchor="middle" fill="#1E3A5F">unsafe-invalid ✗</text>
    </g>
  </g>

  <!-- bottom caption -->
  <text x="400" y="475" text-anchor="middle" font-size="12" fill="#3D4F65">同一个补丁，不同证据 → 不同结论：对的也可能是"未验证"</text>
</svg>