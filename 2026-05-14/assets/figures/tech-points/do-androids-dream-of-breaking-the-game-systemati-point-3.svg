<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 420" font-family="-apple-system, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4B8BDA"/>
    </marker>
  </defs>

  <text x="300" y="38" text-anchor="middle" font-size="18" font-weight="700" fill="#1E3A5F">Benchmark 攻防迭代</text>
  <text x="300" y="60" text-anchor="middle" font-size="12" fill="#3D4F65">GAN 式：找洞 ↔ 补洞</text>

  <!-- Attacker: BenchJack -->
  <g>
    <circle cx="150" cy="210" r="70" fill="#FFF1EC" stroke="#D97757" stroke-width="2"/>
    <circle cx="140" cy="200" r="22" fill="none" stroke="#D97757" stroke-width="3"/>
    <line x1="156" y1="216" x2="175" y2="235" stroke="#D97757" stroke-width="4" stroke-linecap="round"/>
    <text x="150" y="298" text-anchor="middle" font-size="13" font-weight="600" fill="#1E3A5F">BenchJack · 找新 exploit</text>
  </g>

  <!-- Defender -->
  <g>
    <circle cx="450" cy="210" r="70" fill="#EFF6FF" stroke="#4B8BDA" stroke-width="2"/>
    <path d="M450 178 L478 190 L478 212 Q478 234 450 246 Q422 234 422 212 L422 190 Z" fill="none" stroke="#4B8BDA" stroke-width="3"/>
    <line x1="436" y1="208" x2="464" y2="208" stroke="#4B8BDA" stroke-width="2"/>
    <line x1="450" y1="194" x2="450" y2="222" stroke="#4B8BDA" stroke-width="2"/>
    <text x="450" y="298" text-anchor="middle" font-size="13" font-weight="600" fill="#1E3A5F">Defender Agent · 写补丁</text>
  </g>

  <!-- Loop arrows -->
  <path d="M218 188 Q300 148 382 188" fill="none" stroke="#4B8BDA" stroke-width="2" marker-end="url(#ah)"/>
  <text x="300" y="158" text-anchor="middle" font-size="11" fill="#3D4F65">exploit</text>

  <path d="M382 232 Q300 272 218 232" fill="none" stroke="#4B8BDA" stroke-width="2" marker-end="url(#ah)"/>
  <text x="300" y="268" text-anchor="middle" font-size="11" fill="#3D4F65">patched benchmark</text>

  <!-- Termination -->
  <line x1="300" y1="320" x2="300" y2="356" stroke="#4B8BDA" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#ah)"/>
  <g>
    <rect x="170" y="360" width="260" height="46" rx="8" fill="#EFF6FF" stroke="#1E3A5F" stroke-width="1.5"/>
    <text x="300" y="380" text-anchor="middle" font-size="12" font-weight="600" fill="#1E3A5F">收敛：再也造不出 exploit</text>
    <text x="300" y="397" text-anchor="middle" font-size="11" fill="#3D4F65">否则需重新设计 benchmark</text>
  </g>
</svg>