<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" font-family="-apple-system, sans-serif">
  <rect width="800" height="520" fill="#FAF7F2"/>
  
  <!-- Title -->
  <text x="400" y="42" text-anchor="middle" font-size="18" font-weight="600" fill="#1E3A5F">Harness = Agent 的「操作系统层」</text>
  <text x="400" y="64" text-anchor="middle" font-size="12" fill="#3D4F65">模型只负责思考，运行时支撑由 harness 承担</text>

  <!-- Model bubble (top) -->
  <ellipse cx="400" cy="135" rx="95" ry="38" fill="#FEF3E8" stroke="#D49A6A" stroke-width="1.8"/>
  <text x="400" y="132" text-anchor="middle" font-size="14" font-weight="600" fill="#1E3A5F">Foundation Model</text>
  <text x="400" y="150" text-anchor="middle" font-size="11" fill="#3D4F65">思考 · 写代码</text>

  <!-- Down arrow into harness -->
  <line x1="400" y1="175" x2="400" y2="202" stroke="#4B8BDA" stroke-width="2"/>
  <polygon points="400,210 395,200 405,200" fill="#4B8BDA"/>

  <!-- Harness platform (the OS layer) -->
  <rect x="100" y="212" width="600" height="180" rx="10" fill="#EFF6FF" stroke="#4B8BDA" stroke-width="2"/>
  <text x="120" y="234" font-size="13" font-weight="600" fill="#1E3A5F">Harness · 11 项运行时职责</text>

  <!-- 11 responsibilities as small chips -->
  <g font-size="11" fill="#1E3A5F">
    <rect x="118" y="248" width="108" height="28" rx="4" fill="#FFFFFF" stroke="#4B8BDA" stroke-width="1"/>
    <text x="172" y="266" text-anchor="middle">任务接口</text>

    <rect x="234" y="248" width="108" height="28" rx="4" fill="#FFFFFF" stroke="#4B8BDA" stroke-width="1"/>
    <text x="288" y="266" text-anchor="middle">上下文管理</text>

    <rect x="350" y="248" width="108" height="28" rx="4" fill="#FFFFFF" stroke="#4B8BDA" stroke-width="1"/>
    <text x="404" y="266" text-anchor="middle">工具注册表</text>

    <rect x="466" y="248" width="108" height="28" rx="4" fill="#FFFFFF" stroke="#4B8BDA" stroke-width="1"/>
    <text x="520" y="266" text-anchor="middle">项目记忆</text>

    <rect x="582" y="248" width="100" height="28" rx="4" fill="#FFFFFF" stroke="#4B8BDA" stroke-width="1"/>
    <text x="632" y="266" text-anchor="middle">任务状态</text>

    <rect x="118" y="284" width="108" height="28" rx="4" fill="#FFFFFF" stroke="#4B8BDA" stroke-width="1"/>
    <text x="172" y="302" text-anchor="middle">可观测性</text>

    <rect x="234" y="284" width="108" height="28" rx="4" fill="#FFFFFF" stroke="#4B8BDA" stroke-width="1"/>
    <text x="288" y="302" text-anchor="middle">失败归因</text>

    <rect x="350" y="284" width="108" height="28" rx="4" fill="#FFFFFF" stroke="#4B8BDA" stroke-width="1"/>
    <text x="404" y="302" text-anchor="middle">验证协议</text>

    <rect x="466" y="284" width="108" height="28" rx="4" fill="#FFFFFF" stroke="#4B8BDA" stroke-width="1"/>
    <text x="520" y="302" text-anchor="middle">权限边界</text>

    <rect x="582" y="284" width="100" height="28" rx="4" fill="#FFFFFF" stroke="#4B8BDA" stroke-width="1"/>
    <text x="632" y="302" text-anchor="middle">熵审计</text>

    <rect x="346" y="320" width="116" height="28" rx="4" fill="#FFFFFF" stroke="#4B8BDA" stroke-width="1"/>
    <text x="404" y="338" text-anchor="middle">干预记录</text>
  </g>

  <text x="400" y="375" text-anchor="middle" font-size="11" fill="#3D4F65" font-style="italic">每项 = 一个运行时契约，缺失即对应一类典型故障</text>

  <!-- Down arrow to repo -->
  <line x1="400" y1="395" x2="400" y2="436" stroke="#4B8BDA" stroke-width="2"/>
  <polygon points="400,442 395,432 405,432" fill="#4B8BDA"/>

  <!-- Repository -->
  <rect x="305" y="444" width="190" height="50" rx="6" fill="#FEF3E8" stroke="#D49A6A" stroke-width="1.8"/>
  <text x="400" y="465" text-anchor="middle" font-size="13" font-weight="600" fill="#1E3A5F">Repository</text>
  <text x="400" y="482" text-anchor="middle" font-size="11" fill="#3D4F65">真实仓库 · 端到端任务</text>
</svg>