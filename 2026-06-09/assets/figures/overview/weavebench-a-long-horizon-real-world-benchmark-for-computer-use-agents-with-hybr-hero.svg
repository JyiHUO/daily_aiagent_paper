<svg xmlns="http://www.w3.org/2000/svg" width="900" height="600" viewBox="0 0 900 600">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4B8BDA"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#D97757"/>
    </marker>
    <marker id="arrD" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1E3A5F"/>
    </marker>
  </defs>

  <style>
    .t { font-family: 'PingFang SC','Microsoft YaHei','Noto Sans CJK SC','Hiragino Sans GB',sans-serif; }
  </style>

  <!-- Title -->
  <text x="450" y="46" class="t" text-anchor="middle" font-size="24" font-weight="700" fill="#1E3A5F">WeaveBench</text>
  <text x="450" y="72" class="t" text-anchor="middle" font-size="14" fill="#3D4F65">GUI 与 CLI 必须协作的长程评测</text>

  <!-- Left: GUI -->
  <g>
    <circle cx="170" cy="270" r="80" fill="#EFF6FF" stroke="#4B8BDA" stroke-width="2"/>
    <rect x="125" y="240" width="90" height="60" rx="4" fill="#FFFFFF" stroke="#4B8BDA" stroke-width="1.5"/>
    <circle cx="170" cy="270" r="10" fill="#4B8BDA"/>
    <text x="170" y="186" class="t" text-anchor="middle" font-size="16" font-weight="700" fill="#1E3A5F">GUI</text>
    <text x="170" y="378" class="t" text-anchor="middle" font-size="12" fill="#3D4F65">观察画面 · 发现 bug</text>
  </g>

  <!-- Right: CLI -->
  <g>
    <circle cx="730" cy="270" r="80" fill="#FDF1EC" stroke="#D97757" stroke-width="2"/>
    <rect x="685" y="240" width="90" height="60" rx="4" fill="#1E3A5F"/>
    <text x="694" y="262" font-size="11" fill="#7FD8A8" font-family="monospace">$ fix</text>
    <text x="694" y="278" font-size="11" fill="#A8C5E8" font-family="monospace">.tscn</text>
    <text x="694" y="294" font-size="11" fill="#7FD8A8" font-family="monospace">_</text>
    <text x="730" y="186" class="t" text-anchor="middle" font-size="16" font-weight="700" fill="#1E3A5F">CLI / Code</text>
    <text x="730" y="378" class="t" text-anchor="middle" font-size="12" fill="#3D4F65">修改源码 · 回放验证</text>
  </g>

  <!-- Center weave -->
  <g>
    <path d="M 252 250 Q 450 170 648 250" fill="none" stroke="#4B8BDA" stroke-width="3" marker-end="url(#arr)"/>
    <path d="M 648 290 Q 450 370 252 290" fill="none" stroke="#D97757" stroke-width="3" marker-end="url(#arrR)"/>
    <text x="450" y="205" class="t" text-anchor="middle" font-size="12" fill="#4B8BDA">看见现象</text>
    <text x="450" y="355" class="t" text-anchor="middle" font-size="12" fill="#D97757">改完回看</text>

    <circle cx="450" cy="270" r="34" fill="#FFFFFF" stroke="#1E3A5F" stroke-width="2"/>
    <text x="450" y="267" class="t" text-anchor="middle" font-size="11" font-weight="700" fill="#1E3A5F">通道</text>
    <text x="450" y="282" class="t" text-anchor="middle" font-size="11" font-weight="700" fill="#1E3A5F">不可替代</text>
  </g>

  <!-- Center to judge arrow -->
  <path d="M 450 304 L 450 446" fill="none" stroke="#1E3A5F" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arrD)"/>
  <text x="460" y="380" class="t" font-size="11" fill="#1E3A5F">单条轨迹</text>

  <!-- Bottom: Judge -->
  <g>
    <rect x="120" y="450" width="660" height="115" rx="10" fill="#F5F0E8" stroke="#1E3A5F" stroke-width="1.5"/>
    <text x="450" y="478" class="t" text-anchor="middle" font-size="14" font-weight="700" fill="#1E3A5F">轨迹审计 Judge：带工具回到现场重新取证</text>

    <g font-size="11" class="t">
      <rect x="150" y="495" width="100" height="32" rx="6" fill="#FFFFFF" stroke="#4B8BDA"/>
      <text x="200" y="515" text-anchor="middle" fill="#3D4F65">截图取证</text>

      <rect x="265" y="495" width="100" height="32" rx="6" fill="#FFFFFF" stroke="#4B8BDA"/>
      <text x="315" y="515" text-anchor="middle" fill="#3D4F65">日志比对</text>

      <rect x="380" y="495" width="140" height="32" rx="6" fill="#FFFFFF" stroke="#D97757"/>
      <text x="450" y="515" text-anchor="middle" fill="#D97757" font-weight="700">伪造证据 → 清零</text>

      <rect x="535" y="495" width="100" height="32" rx="6" fill="#FFFFFF" stroke="#D97757"/>
      <text x="585" y="515" text-anchor="middle" fill="#D97757">硬编码指标</text>

      <rect x="650" y="495" width="115" height="32" rx="6" fill="#FFFFFF" stroke="#D97757"/>
      <text x="707" y="515" text-anchor="middle" fill="#D97757">CLI 绕过 GUI</text>
    </g>

    <text x="450" y="552" class="t" text-anchor="middle" font-size="12" fill="#1E3A5F">前沿模型最高 PassRate 仅 41.2% · 仅看结果会高估约 20%</text>
  </g>
</svg>