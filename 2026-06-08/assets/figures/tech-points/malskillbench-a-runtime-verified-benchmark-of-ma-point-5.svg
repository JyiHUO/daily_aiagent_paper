<svg xmlns="http://www.w3.org/2000/svg" width="720" height="480" viewBox="0 0 720 480">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4B8BDA"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#C97B6A"/>
    </marker>
  </defs>

  <text x="360" y="42" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC','Hiragino Sans GB',sans-serif" font-size="20" font-weight="700" fill="#1E3A5F">各看一半 · 漏掉协同</text>

  <!-- Left scanner: code -->
  <g>
    <rect x="60" y="100" width="180" height="120" rx="10" fill="#EFF6FF" stroke="#4B8BDA" stroke-width="1.5"/>
    <text x="150" y="134" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC','Hiragino Sans GB',sans-serif" font-size="15" font-weight="600" fill="#1E3A5F">供应链扫描</text>
    <text x="150" y="162" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC','Hiragino Sans GB',sans-serif" font-size="12" fill="#3D4F65">只看代码 (script.py)</text>
    <text x="150" y="195" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC','Hiragino Sans GB',sans-serif" font-size="12" font-weight="600" fill="#4B8BDA">判定: 良性</text>
  </g>

  <!-- Right scanner: prompt -->
  <g>
    <rect x="480" y="100" width="180" height="120" rx="10" fill="#EFF6FF" stroke="#4B8BDA" stroke-width="1.5"/>
    <text x="570" y="134" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC','Hiragino Sans GB',sans-serif" font-size="15" font-weight="600" fill="#1E3A5F">注入防御</text>
    <text x="570" y="162" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC','Hiragino Sans GB',sans-serif" font-size="12" fill="#3D4F65">只看文本 (SKILL.md)</text>
    <text x="570" y="195" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC','Hiragino Sans GB',sans-serif" font-size="12" font-weight="600" fill="#4B8BDA">判定: 良性</text>
  </g>

  <!-- Center: malicious skill -->
  <g>
    <rect x="270" y="270" width="180" height="140" rx="10" fill="#FBEFEA" stroke="#C97B6A" stroke-width="2"/>
    <text x="360" y="304" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC','Hiragino Sans GB',sans-serif" font-size="15" font-weight="700" fill="#1E3A5F">恶意 Skill</text>
    <line x1="295" y1="320" x2="425" y2="320" stroke="#C97B6A" stroke-width="0.8" opacity="0.5"/>
    <text x="360" y="346" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC','Hiragino Sans GB',sans-serif" font-size="12" fill="#3D4F65">下载 + 执行（单看皆良性）</text>
    <text x="360" y="386" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC','Hiragino Sans GB',sans-serif" font-size="14" font-weight="700" fill="#C97B6A">合起来 = RCE</text>
  </g>

  <!-- Arrows: scanners look at half -->
  <path d="M 200 220 L 305 270" stroke="#4B8BDA" stroke-width="1.8" fill="none" marker-end="url(#arr)" stroke-dasharray="5,4"/>
  <path d="M 520 220 L 415 270" stroke="#4B8BDA" stroke-width="1.8" fill="none" marker-end="url(#arr)" stroke-dasharray="5,4"/>

  <!-- Escape arrow -->
  <path d="M 450 330 Q 600 320 640 250" stroke="#C97B6A" stroke-width="2" fill="none" marker-end="url(#arrR)"/>
  <text x="615" y="360" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC','Hiragino Sans GB',sans-serif" font-size="12" font-weight="600" fill="#C97B6A">逃逸</text>

  <text x="360" y="455" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC','Hiragino Sans GB',sans-serif" font-size="12" fill="#3D4F65">需联合代码与指令进行推理</text>
</svg>