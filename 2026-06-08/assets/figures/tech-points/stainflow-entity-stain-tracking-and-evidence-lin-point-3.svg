<svg xmlns="http://www.w3.org/2000/svg" width="720" height="480" viewBox="0 0 720 480">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4B8BDA"/>
    </marker>
    <linearGradient id="stain" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#DCEAF7"/>
      <stop offset="100%" stop-color="#4B8BDA"/>
    </linearGradient>
  </defs>

  <text x="360" y="42" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC','Hiragino Sans GB',sans-serif" font-size="20" font-weight="600" fill="#1E3A5F">连续染色 + 离散关键节点</text>
  <text x="360" y="68" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC','Hiragino Sans GB',sans-serif" font-size="13" fill="#3D4F65">r̂ = 0.4·p + 0.6·k</text>

  <!-- Left: continuous stain (gradient bar) -->
  <g>
    <text x="180" y="118" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC','Hiragino Sans GB',sans-serif" font-size="15" font-weight="600" fill="#1E3A5F">连续染色 p（平滑进度）</text>
    <rect x="60" y="130" width="240" height="60" rx="6" fill="url(#stain)" stroke="#4B8BDA" stroke-width="1.5"/>
    <text x="180" y="222" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC','Hiragino Sans GB',sans-serif" font-size="12" fill="#3D4F65">稳定，但易虚高</text>
  </g>

  <!-- Right: discrete key nodes (dots) -->
  <g>
    <text x="540" y="118" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC','Hiragino Sans GB',sans-serif" font-size="15" font-weight="600" fill="#1E3A5F">关键节点 k（0/1 判定）</text>
    <rect x="420" y="130" width="240" height="60" rx="6" fill="#FFF4E6" stroke="#E89B4C" stroke-width="1.5"/>
    <circle cx="455" cy="160" r="6" fill="#E89B4C"/>
    <circle cx="495" cy="160" r="6" fill="#FCE0B8"/>
    <circle cx="535" cy="160" r="6" fill="#E89B4C"/>
    <circle cx="575" cy="160" r="6" fill="#FCE0B8"/>
    <circle cx="615" cy="160" r="6" fill="#E89B4C"/>
    <text x="540" y="222" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC','Hiragino Sans GB',sans-serif" font-size="12" fill="#3D4F65">区分度高，但噪声多</text>
  </g>

  <!-- Arrows merging -->
  <path d="M 220 240 Q 260 290 290 318" fill="none" stroke="#4B8BDA" stroke-width="2" marker-end="url(#arr)"/>
  <path d="M 500 240 Q 460 290 430 318" fill="none" stroke="#4B8BDA" stroke-width="2" marker-end="url(#arr)"/>

  <!-- Combined reward -->
  <rect x="240" y="320" width="240" height="70" rx="35" fill="#EFF6FF" stroke="#1E3A5F" stroke-width="2"/>
  <text x="360" y="350" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC','Hiragino Sans GB',sans-serif" font-size="16" font-weight="600" fill="#1E3A5F">组合步奖励 r̂</text>
  <text x="360" y="372" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC','Hiragino Sans GB',sans-serif" font-size="12" fill="#3D4F65">稳定 + 有区分度</text>

  <!-- Outcome contrast -->
  <text x="360" y="438" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC','Hiragino Sans GB',sans-serif" font-size="13" fill="#1E3A5F">成功 0.81  vs  失败 0.39    差距 0.42（远超 baseline）</text>
</svg>