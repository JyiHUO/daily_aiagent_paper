<svg xmlns="http://www.w3.org/2000/svg" width="720" height="480" viewBox="0 0 720 480">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4B8BDA"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="360" y="36" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC','Hiragino Sans GB',sans-serif" font-size="20" font-weight="700" fill="#1E3A5F">实体染色追踪</text>
  <text x="360" y="58" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC','Hiragino Sans GB',sans-serif" font-size="12" fill="#3D4F65">Entity Stain Tracking</text>

  <!-- Entities as ink drops on the left -->
  <g font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC','Hiragino Sans GB',sans-serif">
    <text x="60" y="105" text-anchor="middle" font-size="12" fill="#3D4F65">关键实体</text>
    <circle cx="50" cy="150" r="12" fill="#4B8BDA" opacity="0.85"/>
    <text x="70" y="154" font-size="12" fill="#1E3A5F">Play Store</text>
    <circle cx="50" cy="190" r="12" fill="#E8814A" opacity="0.85"/>
    <text x="70" y="194" font-size="12" fill="#1E3A5F">YouTube</text>
    <circle cx="50" cy="230" r="12" fill="#7BA89C" opacity="0.85"/>
    <text x="70" y="234" font-size="12" fill="#1E3A5F">Install</text>
  </g>

  <!-- Arrow to timeline area -->
  <path d="M 160 215 L 215 290" stroke="#4B8BDA" stroke-width="2" fill="none" marker-end="url(#arr)"/>

  <!-- Concentration axis label -->
  <text x="218" y="160" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC','Hiragino Sans GB',sans-serif" font-size="11" fill="#3D4F65">染色浓度 s</text>

  <!-- Timeline axis -->
  <line x1="230" y1="370" x2="680" y2="370" stroke="#1E3A5F" stroke-width="1.5"/>
  <text x="690" y="374" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC','Hiragino Sans GB',sans-serif" font-size="11" fill="#3D4F65">step</text>

  <!-- Step ticks -->
  <g font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC','Hiragino Sans GB',sans-serif" font-size="11" fill="#3D4F65" text-anchor="middle">
    <line x1="260" y1="365" x2="260" y2="375" stroke="#1E3A5F"/>
    <text x="260" y="390">0</text>
    <line x1="350" y1="365" x2="350" y2="375" stroke="#1E3A5F"/>
    <text x="350" y="390">2</text>
    <line x1="500" y1="365" x2="500" y2="375" stroke="#1E3A5F"/>
    <text x="500" y="390">5</text>
    <line x1="590" y1="365" x2="590" y2="375" stroke="#1E3A5F"/>
    <text x="590" y="390">6</text>
  </g>

  <!-- Stain concentration as growing/shrinking ink blobs -->
  <!-- Play Store (blue) -->
  <circle cx="260" cy="345" r="5" fill="#4B8BDA" opacity="0.35"/>
  <circle cx="350" cy="320" r="20" fill="#4B8BDA" opacity="0.75"/>
  <circle cx="500" cy="335" r="13" fill="#4B8BDA" opacity="0.45"/>
  <circle cx="590" cy="345" r="9" fill="#4B8BDA" opacity="0.35"/>

  <!-- YouTube (orange) -->
  <circle cx="350" cy="285" r="6" fill="#E8814A" opacity="0.3"/>
  <circle cx="500" cy="270" r="19" fill="#E8814A" opacity="0.8"/>
  <circle cx="590" cy="290" r="13" fill="#E8814A" opacity="0.55"/>

  <!-- Install (green) -->
  <circle cx="500" cy="225" r="6" fill="#7BA89C" opacity="0.35"/>
  <circle cx="590" cy="205" r="20" fill="#7BA89C" opacity="0.85"/>

  <!-- Trigger flags on key steps -->
  <g font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC','Hiragino Sans GB',sans-serif" font-size="11" fill="#1E3A5F" font-weight="600" text-anchor="middle">
    <line x1="350" y1="300" x2="350" y2="125" stroke="#E8814A" stroke-width="1" stroke-dasharray="3,2"/>
    <rect x="312" y="108" width="76" height="20" rx="4" fill="#FFD27A" stroke="#E8814A"/>
    <text x="350" y="122">浓度跃升</text>

    <line x1="500" y1="250" x2="500" y2="165" stroke="#E8814A" stroke-width="1" stroke-dasharray="3,2"/>
    <rect x="462" y="148" width="76" height="20" rx="4" fill="#FFD27A" stroke="#E8814A"/>
    <text x="500" y="162">证据出现</text>

    <line x1="590" y1="184" x2="590" y2="125" stroke="#E8814A" stroke-width="1" stroke-dasharray="3,2"/>
    <rect x="552" y="108" width="76" height="20" rx="4" fill="#FFD27A" stroke="#E8814A"/>
    <text x="590" y="122">状态变化</text>
  </g>

  <!-- Bottom caption -->
  <text x="360" y="440" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC','Hiragino Sans GB',sans-serif" font-size="12" fill="#3D4F65">染色浓度突变 → 关键节点自然浮现</text>
</svg>