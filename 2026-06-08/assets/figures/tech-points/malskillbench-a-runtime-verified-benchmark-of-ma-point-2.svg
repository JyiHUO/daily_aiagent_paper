<svg xmlns="http://www.w3.org/2000/svg" width="720" height="480" viewBox="0 0 720 480">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4B8BDA"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#D97757"/>
    </marker>
  </defs>

  <text x="360" y="42" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC','Hiragino Sans GB',sans-serif" font-size="20" font-weight="bold" fill="#1E3A5F">生成—验证—反馈闭环</text>
  <text x="360" y="65" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC','Hiragino Sans GB',sans-serif" font-size="13" fill="#3D4F65">用行为证据替代声称恶意</text>

  <!-- Generator -->
  <rect x="60" y="180" width="170" height="110" rx="10" fill="#EFF6FF" stroke="#4B8BDA" stroke-width="2"/>
  <text x="145" y="220" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC','Hiragino Sans GB',sans-serif" font-size="16" font-weight="bold" fill="#1E3A5F">生成器</text>
  <text x="145" y="255" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC','Hiragino Sans GB',sans-serif" font-size="12" fill="#3D4F65">合成候选 skill + IOC</text>

  <!-- Sandbox (verifier) -->
  <rect x="285" y="155" width="190" height="160" rx="10" fill="#FFF4EC" stroke="#D97757" stroke-width="2"/>
  <text x="380" y="185" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC','Hiragino Sans GB',sans-serif" font-size="16" font-weight="bold" fill="#1E3A5F">沙箱验证</text>
  <text x="380" y="222" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC','Hiragino Sans GB',sans-serif" font-size="11" fill="#3D4F65" font-style="italic">connect() / execve() / file write</text>
  <text x="380" y="252" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC','Hiragino Sans GB',sans-serif" font-size="12" fill="#3D4F65">行为是否被真实触发</text>
  <text x="380" y="288" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC','Hiragino Sans GB',sans-serif" font-size="12" fill="#D97757" font-weight="bold">真触发？</text>

  <!-- Benchmark output -->
  <rect x="530" y="180" width="140" height="110" rx="10" fill="#E8F3EC" stroke="#4F9D6E" stroke-width="2"/>
  <text x="600" y="220" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC','Hiragino Sans GB',sans-serif" font-size="16" font-weight="bold" fill="#1E3A5F">入库</text>
  <text x="600" y="255" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC','Hiragino Sans GB',sans-serif" font-size="12" fill="#3D4F65">行为证据已确认</text>

  <!-- Forward arrows -->
  <line x1="230" y1="235" x2="282" y2="235" stroke="#4B8BDA" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="475" y1="235" x2="527" y2="235" stroke="#4B8BDA" stroke-width="2" marker-end="url(#arr)"/>

  <!-- Feedback loop (failure -> regenerate, max 3) -->
  <path d="M 380 315 Q 380 395 145 395 L 145 292" fill="none" stroke="#D97757" stroke-width="2" stroke-dasharray="6,4" marker-end="url(#arrR)"/>
  <text x="262" y="418" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC','Hiragino Sans GB',sans-serif" font-size="12" fill="#D97757">失败反馈 · 最多重写 3 次</text>

  <!-- bottom note -->
  <text x="360" y="460" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC','Hiragino Sans GB',sans-serif" font-size="11" fill="#3D4F65">声称恶意 ≠ 真实恶意</text>
</svg>