<svg xmlns="http://www.w3.org/2000/svg" width="720" height="480" viewBox="0 0 720 480">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4B8BDA"/>
    </marker>
  </defs>

  <text x="360" y="42" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC','Hiragino Sans GB',sans-serif" font-size="20" font-weight="600" fill="#1E3A5F">三维攻击分类法</text>
  <text x="360" y="66" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC','Hiragino Sans GB',sans-serif" font-size="13" fill="#3D4F65">3 axes → 108 cells</text>

  <!-- Left: skewed dataset -->
  <g transform="translate(70,140)">
    <text x="90" y="0" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC','Hiragino Sans GB',sans-serif" font-size="13" fill="#3D4F65">野外样本（单一模式）</text>
    <rect x="20" y="20" width="140" height="140" fill="#FEF3E8" stroke="#E0A064" stroke-width="1.5" rx="4"/>
    <rect x="20" y="20" width="140" height="120" fill="#E0A064" opacity="0.55"/>
    <text x="90" y="90" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC','Hiragino Sans GB',sans-serif" font-size="22" font-weight="600" fill="#1E3A5F">86%</text>
    <text x="90" y="112" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC','Hiragino Sans GB',sans-serif" font-size="11" fill="#1E3A5F">依赖伪装</text>
  </g>

  <!-- Arrow -->
  <line x1="245" y1="230" x2="395" y2="230" stroke="#4B8BDA" stroke-width="2.2" marker-end="url(#arr)"/>
  <text x="320" y="222" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC','Hiragino Sans GB',sans-serif" font-size="11" fill="#3D4F65">系统枚举</text>

  <!-- Right: grid representing 108 cells -->
  <g transform="translate(420,130)">
    <text x="105" y="10" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC','Hiragino Sans GB',sans-serif" font-size="13" fill="#3D4F65">三维覆盖矩阵 (108 cells)</text>

    <!-- 6x5 grid -->
    <g transform="translate(35,30)">
      <g fill="#EFF6FF" stroke="#4B8BDA" stroke-width="1">
        <rect x="0" y="0" width="22" height="22"/><rect x="24" y="0" width="22" height="22"/><rect x="48" y="0" width="22" height="22"/><rect x="72" y="0" width="22" height="22"/><rect x="96" y="0" width="22" height="22"/><rect x="120" y="0" width="22" height="22"/>
        <rect x="0" y="24" width="22" height="22"/><rect x="24" y="24" width="22" height="22"/><rect x="48" y="24" width="22" height="22"/><rect x="72" y="24" width="22" height="22"/><rect x="96" y="24" width="22" height="22"/><rect x="120" y="24" width="22" height="22"/>
        <rect x="0" y="48" width="22" height="22"/><rect x="24" y="48" width="22" height="22"/><rect x="48" y="48" width="22" height="22"/><rect x="72" y="48" width="22" height="22"/><rect x="120" y="48" width="22" height="22"/>
        <rect x="0" y="72" width="22" height="22"/><rect x="24" y="72" width="22" height="22"/><rect x="48" y="72" width="22" height="22"/><rect x="72" y="72" width="22" height="22"/><rect x="96" y="72" width="22" height="22"/><rect x="120" y="72" width="22" height="22"/>
        <rect x="0" y="96" width="22" height="22"/><rect x="24" y="96" width="22" height="22"/><rect x="48" y="96" width="22" height="22"/><rect x="72" y="96" width="22" height="22"/><rect x="96" y="96" width="22" height="22"/><rect x="120" y="96" width="22" height="22"/>
      </g>
      <!-- highlight one rare cell -->
      <rect x="96" y="48" width="22" height="22" fill="#E0A064" stroke="#1E3A5F" stroke-width="1.4"/>
    </g>

    <!-- Axis labels -->
    <text x="100" y="170" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC','Hiragino Sans GB',sans-serif" font-size="11" fill="#1E3A5F">行为 B1–B15</text>
    <text x="28" y="92" text-anchor="end" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC','Hiragino Sans GB',sans-serif" font-size="11" fill="#1E3A5F">向量 CI/PI</text>
    <text x="180" y="92" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC','Hiragino Sans GB',sans-serif" font-size="11" fill="#1E3A5F">策略 隐写等</text>
  </g>

  <!-- legend / example -->
  <g transform="translate(70,360)">
    <rect x="0" y="0" width="580" height="78" fill="#F7FAFC" stroke="#CBD5E0" stroke-width="1" rx="4"/>
    <rect x="14" y="14" width="14" height="14" fill="#E0A064" stroke="#1E3A5F" stroke-width="1.2"/>
    <text x="36" y="26" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC','Hiragino Sans GB',sans-serif" font-size="12" font-weight="600" fill="#1E3A5F">罕见组合示例</text>
    <text x="14" y="50" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC','Hiragino Sans GB',sans-serif" font-size="11" fill="#3D4F65">cell = (PI, B14 Goal Hijacking, Steganographic)</text>
    <text x="14" y="68" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC','Hiragino Sans GB',sans-serif" font-size="11" fill="#3D4F65">SKILL.md 用 HTML 注释藏指令：野外几乎不见，但 benchmark 必须覆盖</text>
  </g>
</svg>