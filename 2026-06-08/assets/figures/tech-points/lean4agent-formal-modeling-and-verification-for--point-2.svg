<svg xmlns="http://www.w3.org/2000/svg" width="720" height="480" viewBox="0 0 720 480">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4B8BDA"/>
    </marker>
    <marker id="arg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#5BA672"/>
    </marker>
  </defs>

  <style>
    .t { font-family: 'PingFang SC','Microsoft YaHei','Noto Sans CJK SC','Hiragino Sans GB',sans-serif; }
  </style>

  <!-- Title -->
  <text x="360" y="40" text-anchor="middle" class="t" font-size="20" font-weight="700" fill="#1E3A5F">谓词系统 + 语义图</text>
  <text x="360" y="64" text-anchor="middle" class="t" font-size="13" fill="#3D4F65">从模糊指令到可判定契约</text>

  <!-- Left: NL instruction cloud -->
  <ellipse cx="120" cy="240" rx="88" ry="55" fill="#FFF4E6" stroke="#E8A857" stroke-width="1.8"/>
  <text x="120" y="234" text-anchor="middle" class="t" font-size="14" fill="#1E3A5F" font-weight="600">自然语言模糊指令</text>
  <text x="120" y="258" text-anchor="middle" class="t" font-size="11" fill="#3D4F65">NL step instructions</text>

  <!-- Middle: node-level predicates -->
  <rect x="280" y="120" width="180" height="130" rx="10" fill="#EFF6FF" stroke="#4B8BDA" stroke-width="1.8"/>
  <text x="370" y="150" text-anchor="middle" class="t" font-size="14" fill="#1E3A5F" font-weight="600">节点谓词 (前/后置)</text>
  <text x="370" y="186" text-anchor="middle" class="t" font-size="11" fill="#3D4F65" font-style="italic">matchesJsonSchema</text>
  <text x="370" y="210" text-anchor="middle" class="t" font-size="11" fill="#3D4F65" font-style="italic">字段非空 / 类型匹配</text>
  <text x="370" y="234" text-anchor="middle" class="t" font-size="11" fill="#3D4F65" font-style="italic">custom + NL 解释</text>

  <!-- Middle: graph-level predicates (highlighted as the key innovation) -->
  <rect x="280" y="280" width="180" height="130" rx="10" fill="#E8F0E8" stroke="#5BA672" stroke-width="2.2"/>
  <text x="370" y="310" text-anchor="middle" class="t" font-size="14" fill="#1E3A5F" font-weight="600">图级谓词 ★ 跨步约束</text>
  <text x="370" y="346" text-anchor="middle" class="t" font-size="11" fill="#3D4F65" font-style="italic">信息流 / 上下文管理</text>
  <text x="370" y="370" text-anchor="middle" class="t" font-size="11" fill="#3D4F65" font-style="italic">evaluateChoicesIndependent</text>
  <text x="370" y="394" text-anchor="middle" class="t" font-size="11" fill="#3D4F65">21 失败中 13 个靠它抓出</text>

  <!-- Right: workflow graph (DAG with predicates flowing) -->
  <g transform="translate(560,200)">
    <circle cx="0" cy="0" r="14" fill="#EFF6FF" stroke="#4B8BDA" stroke-width="1.6"/>
    <circle cx="60" cy="-32" r="14" fill="#EFF6FF" stroke="#4B8BDA" stroke-width="1.6"/>
    <circle cx="60" cy="32" r="14" fill="#EFF6FF" stroke="#4B8BDA" stroke-width="1.6"/>
    <circle cx="120" cy="0" r="14" fill="#EFF6FF" stroke="#4B8BDA" stroke-width="1.6"/>
    <line x1="13" y1="-5" x2="47" y2="-27" stroke="#4B8BDA" stroke-width="1.5"/>
    <line x1="13" y1="5" x2="47" y2="27" stroke="#4B8BDA" stroke-width="1.5"/>
    <line x1="73" y1="-27" x2="107" y2="-5" stroke="#4B8BDA" stroke-width="1.5"/>
    <line x1="73" y1="27" x2="107" y2="5" stroke="#4B8BDA" stroke-width="1.5"/>
    <text x="60" y="-60" text-anchor="middle" class="t" font-size="13" fill="#1E3A5F" font-weight="600">语义图：契约在节点间传递</text>
  </g>

  <!-- Arrows: NL -> predicates -->
  <path d="M 200 215 L 278 175" stroke="#4B8BDA" stroke-width="2" fill="none" marker-end="url(#ar)"/>
  <path d="M 200 268 L 278 335" stroke="#4B8BDA" stroke-width="2" fill="none" marker-end="url(#ar)"/>
  <text x="232" y="200" class="t" font-size="10" fill="#3D4F65">LLM 自动标注</text>

  <!-- Arrows: predicates -> graph -->
  <path d="M 460 185 L 540 195" stroke="#4B8BDA" stroke-width="2" fill="none" marker-end="url(#ar)"/>
  <path d="M 460 345 L 540 215" stroke="#5BA672" stroke-width="2.2" fill="none" marker-end="url(#arg)"/>

  <!-- Bottom note -->
  <text x="360" y="455" text-anchor="middle" class="t" font-size="12" fill="#3D4F65" font-weight="600">跨步约束才能抓住真 bug</text>
</svg>