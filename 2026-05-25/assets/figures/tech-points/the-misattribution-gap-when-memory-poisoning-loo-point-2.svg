<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 460" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4B8BDA"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="360" y="34" text-anchor="middle" font-size="18" font-weight="bold" fill="#1E3A5F">Trust Laundering: 一份"政策"如何洗白</text>

  <!-- Attacker doc -->
  <g>
    <rect x="40" y="80" width="160" height="100" rx="6" fill="#FFF4E6" stroke="#D89A4A" stroke-width="1.5"/>
    <text x="120" y="108" text-anchor="middle" font-size="13" font-weight="bold" fill="#1E3A5F">伪装政策文档</text>
    <text x="120" y="132" text-anchor="middle" font-size="11" fill="#3D4F65">无指令语言 / 合规口吻</text>
    <text x="120" y="152" text-anchor="middle" font-size="11" fill="#3D4F65">语义贴近 Agent 查询</text>
    <text x="120" y="170" text-anchor="middle" font-size="10" fill="#9A6B2A">WRITE</text>
  </g>

  <!-- Filter -->
  <g>
    <rect x="260" y="80" width="160" height="100" rx="6" fill="#EFF6FF" stroke="#4B8BDA" stroke-width="1.5"/>
    <text x="340" y="108" text-anchor="middle" font-size="13" font-weight="bold" fill="#1E3A5F">安全分类器</text>
    <text x="340" y="138" text-anchor="middle" font-size="20" fill="#2E7D5B">✓ safe</text>
    <text x="340" y="160" text-anchor="middle" font-size="11" fill="#3D4F65">510 / 510 通过</text>
  </g>

  <!-- Vector store -->
  <g>
    <ellipse cx="600" cy="140" rx="70" ry="20" fill="#EFF6FF" stroke="#4B8BDA" stroke-width="1.5"/>
    <ellipse cx="600" cy="110" rx="70" ry="20" fill="#EFF6FF" stroke="#4B8BDA" stroke-width="1.5"/>
    <path d="M530,110 V160 a70,20 0 0,0 140,0 V110" fill="none" stroke="#4B8BDA" stroke-width="1.5"/>
    <text x="600" y="138" text-anchor="middle" font-size="12" font-weight="bold" fill="#1E3A5F">共享向量库</text>
    <text x="600" y="155" text-anchor="middle" font-size="10" fill="#3D4F65">STORE · 无溯源</text>
  </g>

  <!-- Arrows top row -->
  <line x1="200" y1="130" x2="256" y2="130" stroke="#4B8BDA" stroke-width="2" marker-end="url(#a)"/>
  <line x1="420" y1="130" x2="528" y2="125" stroke="#4B8BDA" stroke-width="2" marker-end="url(#a)"/>

  <!-- Retrieval arrow -->
  <path d="M600,180 Q600,255 422,310" fill="none" stroke="#4B8BDA" stroke-width="2" stroke-dasharray="5,4" marker-end="url(#a)"/>
  <text x="612" y="232" font-size="11" fill="#3D4F65">RETRIEVE</text>
  <text x="612" y="248" font-size="10" fill="#3D4F65">top-k 召回</text>

  <!-- Agent -->
  <g>
    <rect x="220" y="290" width="200" height="110" rx="6" fill="#FEF2F2" stroke="#C2536B" stroke-width="1.5"/>
    <text x="320" y="316" text-anchor="middle" font-size="13" font-weight="bold" fill="#1E3A5F">Agent 思维链 · COMPLY</text>
    <text x="320" y="342" text-anchor="middle" font-size="11" fill="#3D4F65">"依据权威政策…"</text>
    <text x="320" y="362" text-anchor="middle" font-size="11" fill="#3D4F65">引用 → 照做</text>
    <text x="320" y="386" text-anchor="middle" font-size="10.5" fill="#C2536B" font-style="italic">违规却看似合规</text>
  </g>

  <!-- Misattribution -->
  <g>
    <rect x="450" y="310" width="230" height="80" rx="6" fill="#EFF6FF" stroke="#4B8BDA" stroke-width="1.5" stroke-dasharray="4,3"/>
    <text x="565" y="336" text-anchor="middle" font-size="12" font-weight="bold" fill="#1E3A5F">归因工具 → 100% 怪模型</text>
    <text x="565" y="358" text-anchor="middle" font-size="11" fill="#3D4F65">重训也清不掉投毒条目</text>
    <text x="565" y="378" text-anchor="middle" font-size="11" fill="#C2536B">攻击无限期持续</text>
  </g>

  <line x1="420" y1="360" x2="448" y2="350" stroke="#4B8BDA" stroke-width="2" marker-end="url(#a)"/>

  <!-- Bottom caption -->
  <text x="360" y="438" text-anchor="middle" font-size="11" fill="#3D4F65">WRITE → STORE → RETRIEVE → COMPLY：信任在四步间被悄悄洗白</text>
</svg>