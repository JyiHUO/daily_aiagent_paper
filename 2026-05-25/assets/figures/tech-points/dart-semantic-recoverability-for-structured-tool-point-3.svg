<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 420" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4B8BDA"/>
    </marker>
    <marker id="arrRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#C0504D"/>
    </marker>
  </defs>

  <text x="300" y="34" text-anchor="middle" font-size="17" font-weight="bold" fill="#1E3A5F">下游已吃掉的输出，源头不能回滚</text>

  <!-- Failed upstream -->
  <circle cx="130" cy="200" r="52" fill="#EFF6FF" stroke="#4B8BDA" stroke-width="2"/>
  <text x="130" y="196" text-anchor="middle" font-size="13" fill="#1E3A5F" font-weight="bold">失败实例</text>
  <text x="130" y="214" text-anchor="middle" font-size="11" fill="#3D4F65">upstream</text>

  <!-- Downstream committed consumer -->
  <rect x="410" y="155" width="150" height="90" rx="8" fill="#FFF4E6" stroke="#D98C3F" stroke-width="2"/>
  <text x="485" y="190" text-anchor="middle" font-size="13" fill="#1E3A5F" font-weight="bold">已提交消费者</text>
  <text x="485" y="220" text-anchor="middle" font-size="11" fill="#3D4F65">committed downstream</text>

  <!-- Output flow consumed -->
  <path d="M184 195 L408 195" stroke="#4B8BDA" stroke-width="2" fill="none" marker-end="url(#arr)"/>
  <text x="296" y="186" text-anchor="middle" font-size="11" fill="#3D4F65">输出已被消费</text>

  <!-- Rollback attempt blocked: simple curved arrow back to upstream -->
  <path d="M130 252 Q 130 310 200 320" stroke="#C0504D" stroke-width="2" stroke-dasharray="6 4" fill="none" marker-end="url(#arrRed)"/>
  <text x="80" y="290" text-anchor="middle" font-size="11" fill="#C0504D">尝试回滚</text>

  <!-- Veto stamp -->
  <g transform="translate(220,300)">
    <rect x="0" y="0" width="160" height="60" rx="6" fill="#FBE9E7" stroke="#C0504D" stroke-width="2.5"/>
    <text x="80" y="28" text-anchor="middle" font-size="14" font-weight="bold" fill="#C0504D">一票否决</text>
    <text x="80" y="48" text-anchor="middle" font-size="11" fill="#3D4F65">NoCommittedConflict</text>
  </g>

  <!-- Cross mark on rollback -->
  <g stroke="#C0504D" stroke-width="3">
    <line x1="195" y1="310" x2="215" y2="330"/>
    <line x1="215" y1="310" x2="195" y2="330"/>
  </g>

  <!-- Fallback to whole rerun -->
  <path d="M380 330 L 470 330" stroke="#4B8BDA" stroke-width="2" fill="none" marker-end="url(#arr)"/>
  <text x="525" y="326" text-anchor="middle" font-size="12" fill="#1E3A5F" font-weight="bold">整任务重跑</text>
  <text x="525" y="342" text-anchor="middle" font-size="10" fill="#3D4F65">whole-task</text>

  <text x="300" y="400" text-anchor="middle" font-size="11" fill="#3D4F65" font-style="italic">维护"谁消费了谁"的关系图：有提交消费者 → 拒绝本地回滚</text>
</svg>