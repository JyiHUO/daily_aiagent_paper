<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4B8BDA"/>
    </marker>
    <marker id="arrRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#C97A6B"/>
    </marker>
  </defs>

  <text x="400" y="40" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="600" fill="#1E3A5F">代码与证明 · 联合增量合成</text>
  <text x="400" y="62" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#3D4F65">每走一步，Rocq 立即裁决</text>

  <!-- Left: code column -->
  <g>
    <rect x="60" y="110" width="220" height="60" rx="6" fill="#EFF6FF" stroke="#4B8BDA"/>
    <text x="170" y="138" text-anchor="middle" font-family="monospace" font-size="13" fill="#1E3A5F">code chunk 1 + proof</text>
    <text x="170" y="156" text-anchor="middle" font-family="monospace" font-size="11" fill="#3D4F65">(Admitted 占位)</text>

    <rect x="60" y="220" width="220" height="60" rx="6" fill="#EFF6FF" stroke="#4B8BDA"/>
    <text x="170" y="248" text-anchor="middle" font-family="monospace" font-size="13" fill="#1E3A5F">code chunk 2 + lemma</text>
    <text x="170" y="266" text-anchor="middle" font-family="monospace" font-size="11" fill="#3D4F65">同步更新引理</text>

    <rect x="60" y="330" width="220" height="60" rx="6" fill="#EFF6FF" stroke="#4B8BDA"/>
    <text x="170" y="358" text-anchor="middle" font-family="monospace" font-size="13" fill="#1E3A5F">code chunk 3 + lemma</text>
    <text x="170" y="376" text-anchor="middle" font-family="monospace" font-size="11" fill="#3D4F65">逐步收紧证明</text>
  </g>

  <!-- arrows from code to oracle -->
  <line x1="280" y1="140" x2="455" y2="235" stroke="#4B8BDA" stroke-width="1.8" marker-end="url(#arr)"/>
  <line x1="280" y1="250" x2="470" y2="250" stroke="#4B8BDA" stroke-width="1.8" marker-end="url(#arr)"/>
  <line x1="280" y1="360" x2="455" y2="265" stroke="#4B8BDA" stroke-width="1.8" marker-end="url(#arr)"/>

  <!-- Oracle: Rocq -->
  <g>
    <polygon points="565,250 475,205 475,295" fill="#FDF4E8" stroke="#C9954B" stroke-width="2"/>
    <text x="505" y="246" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#1E3A5F">Rocq</text>
    <text x="505" y="264" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#3D4F65">type-check</text>
  </g>

  <!-- Right: two outcomes -->
  <g>
    <rect x="610" y="150" width="160" height="70" rx="6" fill="#EAF4EC" stroke="#5BA37A"/>
    <text x="690" y="180" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#1E3A5F">✓ still sound</text>
    <text x="690" y="202" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#3D4F65">继续下一步</text>

    <rect x="610" y="280" width="160" height="70" rx="6" fill="#FBECE8" stroke="#C97A6B"/>
    <text x="690" y="310" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#1E3A5F">✗ contradicts</text>
    <text x="690" y="332" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#3D4F65">尽早回退</text>
  </g>

  <line x1="560" y1="230" x2="610" y2="185" stroke="#4B8BDA" stroke-width="1.8" marker-end="url(#arr)"/>
  <line x1="560" y1="270" x2="610" y2="315" stroke="#C97A6B" stroke-width="1.8" marker-end="url(#arrRed)"/>

  <!-- backtrack loop -->
  <path d="M 610 340 Q 400 450 180 390" fill="none" stroke="#C97A6B" stroke-width="1.5" stroke-dasharray="5,4" marker-end="url(#arrRed)"/>
  <text x="400" y="448" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#C97A6B" font-style="italic">prune wrong path early</text>
</svg>