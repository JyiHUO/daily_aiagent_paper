<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4B8BDA"/>
    </marker>
    <marker id="arRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#C97A6B"/>
    </marker>
  </defs>

  <text x="400" y="38" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="19" font-weight="600" fill="#1E3A5F">Four Gates to a Safe Rollback</text>
  <text x="400" y="60" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#3D4F65">any gate fails → full rerun</text>

  <g font-family="Helvetica, Arial, sans-serif">
    <rect x="40" y="120" width="140" height="110" rx="8" fill="#EFF6FF" stroke="#4B8BDA" stroke-width="1.5"/>
    <text x="110" y="150" text-anchor="middle" font-size="22" fill="#1E3A5F" font-weight="600">1</text>
    <text x="110" y="182" text-anchor="middle" font-size="12" fill="#1E3A5F" font-weight="600">Which one failed?</text>
    <text x="110" y="210" text-anchor="middle" font-size="10" fill="#3D4F65">locate instance</text>

    <rect x="220" y="120" width="140" height="110" rx="8" fill="#EFF6FF" stroke="#4B8BDA" stroke-width="1.5"/>
    <text x="290" y="150" text-anchor="middle" font-size="22" fill="#1E3A5F" font-weight="600">2</text>
    <text x="290" y="182" text-anchor="middle" font-size="12" fill="#1E3A5F" font-weight="600">Boundary closed?</text>
    <text x="290" y="210" text-anchor="middle" font-size="10" fill="#3D4F65">certify boundary</text>

    <rect x="400" y="120" width="140" height="110" rx="8" fill="#EFF6FF" stroke="#4B8BDA" stroke-width="1.5"/>
    <text x="470" y="150" text-anchor="middle" font-size="22" fill="#1E3A5F" font-weight="600">3</text>
    <text x="470" y="182" text-anchor="middle" font-size="12" fill="#1E3A5F" font-weight="600">Whose checkpoint?</text>
    <text x="470" y="210" text-anchor="middle" font-size="10" fill="#3D4F65">align by instance</text>

    <rect x="580" y="120" width="140" height="110" rx="8" fill="#EFF6FF" stroke="#4B8BDA" stroke-width="1.5"/>
    <text x="650" y="150" text-anchor="middle" font-size="22" fill="#1E3A5F" font-weight="600">4</text>
    <text x="650" y="182" text-anchor="middle" font-size="12" fill="#1E3A5F" font-weight="600">Downstream safe?</text>
    <text x="650" y="210" text-anchor="middle" font-size="10" fill="#3D4F65">admissible anchor</text>
  </g>

  <line x1="180" y1="175" x2="218" y2="175" stroke="#4B8BDA" stroke-width="2" marker-end="url(#ar)"/>
  <line x1="360" y1="175" x2="398" y2="175" stroke="#4B8BDA" stroke-width="2" marker-end="url(#ar)"/>
  <line x1="540" y1="175" x2="578" y2="175" stroke="#4B8BDA" stroke-width="2" marker-end="url(#ar)"/>

  <line x1="650" y1="230" x2="650" y2="368" stroke="#4B8BDA" stroke-width="2" marker-end="url(#ar)"/>
  <rect x="540" y="370" width="220" height="60" rx="8" fill="#DCEBFB" stroke="#4B8BDA" stroke-width="1.5"/>
  <text x="650" y="397" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#1E3A5F">Restore checkpoint</text>
  <text x="650" y="415" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#3D4F65">cheap and safe</text>

  <path d="M 110 230 L 110 320 L 290 320 L 290 368" fill="none" stroke="#C97A6B" stroke-width="1.8" stroke-dasharray="5,4" marker-end="url(#arRed)"/>
  <path d="M 290 230 L 290 320" fill="none" stroke="#C97A6B" stroke-width="1.8" stroke-dasharray="5,4"/>
  <path d="M 470 230 L 470 320 L 290 320" fill="none" stroke="#C97A6B" stroke-width="1.8" stroke-dasharray="5,4"/>

  <rect x="180" y="370" width="220" height="60" rx="8" fill="#FBEEEA" stroke="#C97A6B" stroke-width="1.5"/>
  <text x="290" y="397" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#7A3B2E">Whole-task rerun</text>
  <text x="290" y="415" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#3D4F65">conservative fallback</text>

  <text x="300" y="314" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#C97A6B" font-style="italic">any "no" → fallback</text>
</svg>