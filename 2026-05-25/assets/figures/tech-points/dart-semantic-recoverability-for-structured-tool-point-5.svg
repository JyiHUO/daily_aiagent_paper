<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 460" font-family="-apple-system,Segoe UI,Helvetica,sans-serif">
  <rect width="720" height="460" fill="#FAF7F2"/>

  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4B8BDA"/>
    </marker>
  </defs>

  <text x="360" y="40" text-anchor="middle" font-size="19" font-weight="700" fill="#1E3A5F">Reviewed Boundary as Audited Contract</text>
  <text x="360" y="62" text-anchor="middle" font-size="12" fill="#3D4F65">人工审查的边界契约，不是模型自动合成</text>

  <!-- Left: scattered tools -->
  <g>
    <text x="145" y="98" text-anchor="middle" font-size="12" fill="#8A6A4A" font-style="italic">分散在每个工具里 ✗</text>
    <rect x="60" y="120" width="70" height="38" rx="6" fill="#F5E6D3" stroke="#C8A57E" stroke-width="1.2"/>
    <text x="95" y="143" text-anchor="middle" font-size="11" fill="#7A5A3A">tool A</text>
    <rect x="160" y="150" width="70" height="38" rx="6" fill="#F5E6D3" stroke="#C8A57E" stroke-width="1.2"/>
    <text x="195" y="173" text-anchor="middle" font-size="11" fill="#7A5A3A">tool B</text>
    <rect x="80" y="195" width="70" height="38" rx="6" fill="#F5E6D3" stroke="#C8A57E" stroke-width="1.2"/>
    <text x="115" y="218" text-anchor="middle" font-size="11" fill="#7A5A3A">tool C</text>
    <rect x="170" y="240" width="70" height="38" rx="6" fill="#F5E6D3" stroke="#C8A57E" stroke-width="1.2"/>
    <text x="205" y="263" text-anchor="middle" font-size="11" fill="#7A5A3A">tool D</text>
    <line x1="55" y1="295" x2="250" y2="295" stroke="#C8A57E" stroke-width="0.8" stroke-dasharray="3,3"/>
    <text x="152" y="312" text-anchor="middle" font-size="10.5" fill="#8A6A4A">隐式 · 不可审计</text>
  </g>

  <!-- Arrow: consolidate -->
  <line x1="265" y1="205" x2="345" y2="205" stroke="#4B8BDA" stroke-width="2" marker-end="url(#arr)"/>
  <text x="305" y="195" text-anchor="middle" font-size="11" fill="#4B8BDA">集中</text>

  <!-- Right: audited boundary contract -->
  <g>
    <text x="520" y="98" text-anchor="middle" font-size="12" fill="#1E3A5F" font-style="italic">集中为可审计契约 ✓</text>

    <rect x="370" y="120" width="300" height="200" rx="10" fill="#EFF6FF" stroke="#4B8BDA" stroke-width="2"/>

    <circle cx="640" cy="150" r="18" fill="#FAF7F2" stroke="#C25450" stroke-width="1.8"/>
    <text x="640" y="154" text-anchor="middle" font-size="9" fill="#C25450" font-weight="700">REVIEW</text>

    <text x="510" y="150" text-anchor="middle" font-size="13" font-weight="700" fill="#1E3A5F">Boundary Contract</text>

    <g font-size="12" fill="#1E3A5F">
      <circle cx="395" cy="184" r="3" fill="#4B8BDA"/>
      <text x="407" y="188">P-com · commit predicate</text>

      <circle cx="395" cy="214" r="3" fill="#4B8BDA"/>
      <text x="407" y="218">P-exit · exit predicate</text>

      <circle cx="395" cy="244" r="3" fill="#4B8BDA"/>
      <text x="407" y="248">X-in / X-out · interface keys</text>

      <circle cx="395" cy="274" r="3" fill="#4B8BDA"/>
      <text x="407" y="278">π-eff · effect policy</text>
    </g>

    <line x1="385" y1="298" x2="655" y2="298" stroke="#4B8BDA" stroke-width="0.6" stroke-dasharray="2,3"/>
    <text x="520" y="313" text-anchor="middle" font-size="10.5" fill="#3D4F65">runtime 据此判定 admissibility</text>
  </g>

  <!-- Bottom notes -->
  <text x="360" y="378" text-anchor="middle" font-size="12" fill="#3D4F65">DART 是 recovery harness，不消除语义审查 — 把它变成可校准的契约</text>
  <text x="360" y="408" text-anchor="middle" font-size="11" fill="#8A6A4A">out of scope: 自动合成边界 · silent failure · 任意不可逆副作用</text>
</svg>