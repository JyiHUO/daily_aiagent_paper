<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 420" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4B8BDA"/>
    </marker>
    <marker id="arRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#C8553D"/>
    </marker>
  </defs>

  <text x="300" y="34" text-anchor="middle" font-size="19" font-weight="700" fill="#1E3A5F">能回滚，不代表应该回滚</text>

  <!-- Checkpoint anchor -->
  <circle cx="100" cy="200" r="38" fill="#EFF6FF" stroke="#4B8BDA" stroke-width="2"/>
  <path d="M85 188 L85 218 M85 188 L110 198 L85 208" fill="none" stroke="#1E3A5F" stroke-width="2"/>
  <text x="100" y="262" text-anchor="middle" font-size="13" fill="#1E3A5F" font-weight="600">Checkpoint</text>
  <text x="100" y="279" text-anchor="middle" font-size="11" fill="#3D4F65">runtime 可恢复</text>

  <!-- Rollback arrow up -->
  <path d="M138 180 Q200 120 245 170" fill="none" stroke="#4B8BDA" stroke-width="2" marker-end="url(#ar)"/>
  <text x="190" y="130" text-anchor="middle" font-size="11" fill="#3D4F65">机械回滚</text>

  <!-- Failed task -->
  <rect x="245" y="170" width="110" height="60" rx="8" fill="#FFF4E6" stroke="#E0A458" stroke-width="2"/>
  <text x="300" y="195" text-anchor="middle" font-size="12" fill="#1E3A5F" font-weight="600">失败的上游任务</text>
  <text x="300" y="215" text-anchor="middle" font-size="11" fill="#3D4F65">需要重做</text>

  <!-- Downstream commitment -->
  <g transform="translate(425,170)">
    <rect x="0" y="0" width="135" height="60" rx="8" fill="#FBE8E5" stroke="#C8553D" stroke-width="2"/>
    <text x="67" y="25" text-anchor="middle" font-size="12" fill="#1E3A5F" font-weight="600">已提交下游</text>
    <text x="67" y="44" text-anchor="middle" font-size="11" fill="#3D4F65">邀请已发出 (locked)</text>
  </g>

  <!-- Commit arrow -->
  <path d="M355 200 L425 200" fill="none" stroke="#3D4F65" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#ar)"/>
  <text x="390" y="192" text-anchor="middle" font-size="10" fill="#3D4F65">commit</text>

  <!-- Conflict arrow from downstream back to failed -->
  <path d="M425 218 Q380 270 320 232" fill="none" stroke="#C8553D" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#arRed)"/>
  <text x="378" y="268" text-anchor="middle" font-size="11" fill="#C8553D" font-weight="600">悬空冲突：阻止回滚</text>

  <!-- Verdict -->
  <rect x="120" y="320" width="360" height="68" rx="10" fill="#EFF6FF" stroke="#1E3A5F" stroke-width="2"/>
  <text x="300" y="346" text-anchor="middle" font-size="13" font-weight="700" fill="#1E3A5F">语义可恢复 = 控制器合法 ∧ 下游未提交</text>
  <text x="300" y="370" text-anchor="middle" font-size="11" fill="#3D4F65">DART 在 resume 前先做 admissibility 判定</text>
</svg>