<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 420">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4B8BDA"/>
    </marker>
  </defs>

  <text x="300" y="38" text-anchor="middle" font-family="Helvetica,Arial" font-size="18" font-weight="600" fill="#1E3A5F">Retrieval–Coverage Dilemma</text>
  <text x="300" y="60" text-anchor="middle" font-family="Helvetica,Arial" font-size="12" fill="#3D4F65">隐蔽性 ↑   则   攻击效力 ↓</text>

  <!-- Left: stealth high, retrieval low -->
  <g>
    <circle cx="160" cy="220" r="80" fill="#EFF6FF" stroke="#4B8BDA" stroke-width="2"/>
    <text x="160" y="200" text-anchor="middle" font-family="Helvetica,Arial" font-size="13" font-weight="600" fill="#1E3A5F">更隐蔽</text>
    <text x="160" y="222" text-anchor="middle" font-family="Helvetica,Arial" font-size="11" fill="#3D4F65">逃过分类器</text>
    <text x="160" y="244" text-anchor="middle" font-family="Helvetica,Arial" font-size="11" fill="#B85C3C">但检索不到</text>
  </g>

  <!-- Right: retrieval high, stealth low -->
  <g>
    <circle cx="440" cy="220" r="80" fill="#FDF2EC" stroke="#D98859" stroke-width="2"/>
    <text x="440" y="200" text-anchor="middle" font-family="Helvetica,Arial" font-size="13" font-weight="600" fill="#1E3A5F">更有效</text>
    <text x="440" y="222" text-anchor="middle" font-family="Helvetica,Arial" font-size="11" fill="#3D4F65">被Agent采用</text>
    <text x="440" y="244" text-anchor="middle" font-family="Helvetica,Arial" font-size="11" fill="#B85C3C">但易被发现</text>
  </g>

  <!-- Trade-off arrows -->
  <line x1="245" y1="212" x2="355" y2="212" stroke="#4B8BDA" stroke-width="2.5" marker-end="url(#ar)"/>
  <line x1="355" y1="232" x2="245" y2="232" stroke="#4B8BDA" stroke-width="2.5" marker-end="url(#ar)"/>

  <text x="300" y="270" text-anchor="middle" font-family="Helvetica,Arial" font-size="11" fill="#3D4F65">相关性 r = 0.858</text>

  <!-- Bottom takeaway -->
  <rect x="130" y="320" width="340" height="60" rx="8" fill="#EFF6FF" stroke="#4B8BDA" stroke-width="1.5"/>
  <text x="300" y="345" text-anchor="middle" font-family="Helvetica,Arial" font-size="13" font-weight="600" fill="#1E3A5F">攻击者无法两者兼得</text>
  <text x="300" y="366" text-anchor="middle" font-family="Helvetica,Arial" font-size="11" fill="#3D4F65">结构性约束 → 防御者可利用的缝隙</text>
</svg>