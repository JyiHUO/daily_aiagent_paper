<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" font-family="-apple-system,Segoe UI,sans-serif">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4B8BDA"/>
    </marker>
    <marker id="arR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#C0504D"/>
    </marker>
  </defs>

  <text x="400" y="38" text-anchor="middle" font-size="20" font-weight="700" fill="#1E3A5F">同样的违规日志，两种成因</text>
  <text x="400" y="60" text-anchor="middle" font-size="13" fill="#3D4F65">Two-Pipeline Indistinguishability</text>

  <!-- Left: poisoned memory -->
  <rect x="60" y="100" width="220" height="130" rx="10" fill="#EFF6FF" stroke="#4B8BDA" stroke-width="1.5"/>
  <text x="170" y="128" text-anchor="middle" font-size="14" font-weight="700" fill="#1E3A5F">投毒的共享记忆</text>
  <text x="170" y="150" text-anchor="middle" font-size="11" fill="#3D4F65">伪装成 SOX 政策的文档</text>
  <path d="M170 170 C156 188, 156 206, 170 206 C184 206, 184 188, 170 170 Z" fill="#C0504D" opacity="0.85"/>
  <text x="170" y="202" text-anchor="middle" font-size="11" fill="#fff" font-weight="700">毒</text>

  <!-- Right: misaligned model -->
  <rect x="520" y="100" width="220" height="130" rx="10" fill="#FBF1E8" stroke="#D8915B" stroke-width="1.5"/>
  <text x="630" y="128" text-anchor="middle" font-size="14" font-weight="700" fill="#1E3A5F">真正失准的模型</text>
  <text x="630" y="150" text-anchor="middle" font-size="11" fill="#3D4F65">权重内部出错</text>
  <circle cx="630" cy="190" r="20" fill="none" stroke="#D8915B" stroke-width="2"/>
  <path d="M618 190 L642 190 M630 178 L630 202" stroke="#C0504D" stroke-width="2"/>

  <!-- Arrows down to identical log -->
  <line x1="190" y1="230" x2="340" y2="298" stroke="#4B8BDA" stroke-width="2" marker-end="url(#ar)"/>
  <line x1="610" y1="230" x2="460" y2="298" stroke="#4B8BDA" stroke-width="2" marker-end="url(#ar)"/>

  <!-- Identical log -->
  <rect x="290" y="305" width="220" height="80" rx="10" fill="#F5F7FA" stroke="#1E3A5F" stroke-width="1.8"/>
  <text x="400" y="332" text-anchor="middle" font-size="13" font-weight="700" fill="#1E3A5F">数学上不可区分的会话日志</text>
  <line x1="310" y1="350" x2="490" y2="350" stroke="#3D4F65" stroke-width="0.8"/>
  <line x1="310" y1="364" x2="470" y2="364" stroke="#3D4F65" stroke-width="0.8"/>
  <line x1="310" y1="376" x2="480" y2="376" stroke="#3D4F65" stroke-width="0.8"/>

  <!-- Misattribution arrow: log -> model blamed -->
  <path d="M510 360 Q560 360 590 425" fill="none" stroke="#C0504D" stroke-width="2.2" stroke-dasharray="6,4" marker-end="url(#arR)"/>
  <text x="555" y="395" text-anchor="middle" font-size="12" fill="#C0504D" font-weight="600">归因 100% 指向</text>

  <!-- model blamed box -->
  <rect x="525" y="430" width="170" height="40" rx="8" fill="#FBF1E8" stroke="#C0504D" stroke-width="1.5"/>
  <text x="610" y="455" text-anchor="middle" font-size="12" font-weight="700" fill="#1E3A5F">"是模型的锅" → 重训</text>

  <!-- left: poison persists, loop back -->
  <path d="M290 360 Q200 400 175 235" fill="none" stroke="#3D4F65" stroke-width="1.4" stroke-dasharray="4,3" marker-end="url(#ar)"/>
  <text x="170" y="455" text-anchor="middle" font-size="12" fill="#3D4F65" font-weight="600">真凶仍潜伏，下季度复发</text>
</svg>