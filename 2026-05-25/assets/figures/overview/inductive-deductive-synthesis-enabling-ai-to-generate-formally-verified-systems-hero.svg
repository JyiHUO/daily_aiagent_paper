<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" font-family="-apple-system,Helvetica,Arial,sans-serif">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4B8BDA"/>
    </marker>
    <marker id="ar2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#E8833A"/>
    </marker>
    <marker id="arg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#8A93A0"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="450" y="44" text-anchor="middle" font-size="22" font-weight="700" fill="#1E3A5F">代码与证明，同步生长</text>
  <text x="450" y="68" text-anchor="middle" font-size="13" fill="#3D4F65">Inductive Deductive Synthesis · 7/7 已验证分布式系统 · 200× 提速</text>

  <!-- Left: traditional path (faded) -->
  <g opacity="0.7">
    <text x="130" y="115" text-anchor="middle" font-size="12" fill="#8A93A0">传统流程</text>
    <rect x="60" y="130" width="140" height="40" rx="6" fill="#F1F2F4" stroke="#C5CCD4"/>
    <text x="130" y="155" text-anchor="middle" font-size="12" fill="#5A6573">先写完整实现</text>
    <path d="M130,172 L130,198" stroke="#8A93A0" stroke-width="1.5" marker-end="url(#arg)"/>
    <rect x="60" y="200" width="140" height="40" rx="6" fill="#F1F2F4" stroke="#C5CCD4"/>
    <text x="130" y="225" text-anchor="middle" font-size="12" fill="#5A6573">再补整套证明</text>
    <text x="130" y="272" text-anchor="middle" font-size="11" fill="#B14848">SOTA Agent 仅 2/7</text>
    <text x="130" y="290" text-anchor="middle" font-size="11" fill="#8A93A0">专家：数月～数年</text>
  </g>

  <!-- arrow from traditional to IDS -->
  <path d="M205,255 Q255,300 290,318" fill="none" stroke="#4B8BDA" stroke-width="1.5" marker-end="url(#ar)"/>

  <!-- Center: IDS loop -->
  <g>
    <circle cx="450" cy="340" r="160" fill="#EFF6FF" stroke="#4B8BDA" stroke-width="2"/>
    <text x="450" y="200" text-anchor="middle" font-size="14" font-weight="700" fill="#1E3A5F">IDS 联合增量合成</text>
    <text x="450" y="220" text-anchor="middle" font-size="10" fill="#3D4F65">每写一点 · 立刻互证</text>

    <!-- Implementation node -->
    <circle cx="375" cy="305" r="50" fill="#FFFFFF" stroke="#4B8BDA" stroke-width="2"/>
    <text x="375" y="302" text-anchor="middle" font-size="13" font-weight="700" fill="#1E3A5F">实现</text>
    <text x="375" y="320" text-anchor="middle" font-size="10" fill="#3D4F65">Gallina</text>

    <!-- Proof node -->
    <circle cx="525" cy="305" r="50" fill="#FFFFFF" stroke="#E8833A" stroke-width="2"/>
    <text x="525" y="302" text-anchor="middle" font-size="13" font-weight="700" fill="#1E3A5F">证明</text>
    <text x="525" y="320" text-anchor="middle" font-size="10" fill="#3D4F65">Lemmas</text>

    <!-- Bidirectional sync between impl and proof -->
    <path d="M422,288 Q450,268 478,288" fill="none" stroke="#4B8BDA" stroke-width="2" marker-end="url(#ar)"/>
    <path d="M478,322 Q450,342 422,322" fill="none" stroke="#E8833A" stroke-width="2" marker-end="url(#ar2)"/>

    <!-- Rocq checker -->
    <rect x="380" y="375" width="140" height="36" rx="6" fill="#1E3A5F"/>
    <text x="450" y="398" text-anchor="middle" font-size="12" font-weight="600" fill="#FFFFFF">Rocq 即时类型检查</text>
    <path d="M380,348 L418,374" stroke="#4B8BDA" stroke-width="1.5" marker-end="url(#ar)"/>
    <path d="M520,348 L482,374" stroke="#E8833A" stroke-width="1.5" marker-end="url(#ar2)"/>

    <!-- Two agents -->
    <rect x="290" y="425" width="120" height="34" rx="17" fill="#FFFFFF" stroke="#4B8BDA" stroke-width="1.5"/>
    <text x="350" y="446" text-anchor="middle" font-size="11" fill="#1E3A5F">DSA 演绎工程师</text>

    <rect x="490" y="425" width="120" height="34" rx="17" fill="#FFFFFF" stroke="#E8833A" stroke-width="1.5"/>
    <text x="550" y="446" text-anchor="middle" font-size="11" fill="#1E3A5F">ISA 归纳架构师</text>

    <!-- Stuck arrow between agents -->
    <text x="450" y="436" text-anchor="middle" font-size="9" fill="#8A93A0">卡住时换策略</text>
    <path d="M412,448 L488,448" stroke="#8A93A0" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arg)"/>

    <!-- Audit -->
    <rect x="380" y="478" width="140" height="28" rx="14" fill="#FBE9D7" stroke="#E8833A" stroke-width="1.2"/>
    <text x="450" y="497" text-anchor="middle" font-size="11" fill="#7A4418">Audit 防作弊审计</text>
  </g>

  <!-- Right: outputs -->
  <g>
    <text x="780" y="115" text-anchor="middle" font-size="12" fill="#3D4F65">IDS 成果</text>

    <rect x="700" y="135" width="160" height="58" rx="8" fill="#EFF6FF" stroke="#4B8BDA"/>
    <text x="780" y="158" text-anchor="middle" font-size="13" font-weight="700" fill="#1E3A5F">7 / 7 规约</text>
    <text x="780" y="178" text-anchor="middle" font-size="11" fill="#3D4F65">分布式 KV 一致性</text>

    <rect x="700" y="210" width="160" height="58" rx="8" fill="#EFF6FF" stroke="#4B8BDA"/>
    <text x="780" y="233" text-anchor="middle" font-size="13" font-weight="700" fill="#1E3A5F">200× 提速</text>
    <text x="780" y="253" text-anchor="middle" font-size="11" fill="#3D4F65">6.8 小时 / $106 每规约</text>

    <rect x="700" y="285" width="160" height="58" rx="8" fill="#FBE9D7" stroke="#E8833A"/>
    <text x="780" y="308" text-anchor="middle" font-size="13" font-weight="700" fill="#1E3A5F">3× 运行更快</text>
    <text x="780" y="328" text-anchor="middle" font-size="11" fill="#3D4F65">性能反馈进同一闭环</text>
  </g>

  <!-- Performance feedback loop back into IDS -->
  <path d="M700,314 Q650,330 612,335" fill="none" stroke="#E8833A" stroke-width="1.8" stroke-dasharray="5,3" marker-end="url(#ar2)"/>
  <text x="660" y="358" text-anchor="middle" font-size="10" fill="#7A4418">性能数字回喂</text>

  <!-- Bottom caption -->
  <text x="450" y="565" text-anchor="middle" font-size="11" fill="#3D4F65">实现与证明每步同步生长 · Rocq 充当过程级评测器 · 双 Agent 探索与回退</text>
</svg>