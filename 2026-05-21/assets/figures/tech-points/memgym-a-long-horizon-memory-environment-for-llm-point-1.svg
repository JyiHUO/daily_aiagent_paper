<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 480">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4B8BDA"/>
    </marker>
  </defs>

  <text x="300" y="32" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="18" font-weight="600" fill="#1E3A5F">统一记忆插槽</text>
  <text x="300" y="52" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#3D4F65">同一插口适配五种环境</text>

  <!-- Central memory slot -->
  <rect x="230" y="200" width="140" height="80" rx="10" fill="#FEF3E2" stroke="#E89B4A" stroke-width="2"/>
  <text x="300" y="230" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13" font-weight="600" fill="#1E3A5F">Memory Module</text>
  <text x="300" y="252" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#3D4F65">FilteredContext</text>
  <text x="300" y="268" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#3D4F65">condensation-event</text>

  <!-- Plug pins on the slot -->
  <rect x="258" y="280" width="8" height="14" fill="#E89B4A"/>
  <rect x="296" y="280" width="8" height="14" fill="#E89B4A"/>
  <rect x="334" y="280" width="8" height="14" fill="#E89B4A"/>

  <!-- Five environments around -->
  <g font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#1E3A5F" text-anchor="middle">
    <rect x="40" y="110" width="110" height="44" rx="8" fill="#EFF6FF" stroke="#4B8BDA" stroke-width="1.5"/>
    <text x="95" y="137">τ²-bench 对话</text>

    <rect x="450" y="110" width="110" height="44" rx="8" fill="#EFF6FF" stroke="#4B8BDA" stroke-width="1.5"/>
    <text x="505" y="137">SWE-Gym 编码</text>

    <rect x="40" y="220" width="110" height="44" rx="8" fill="#EFF6FF" stroke="#4B8BDA" stroke-width="1.5"/>
    <text x="95" y="247">WebArena 网页</text>

    <rect x="450" y="220" width="110" height="44" rx="8" fill="#EFF6FF" stroke="#4B8BDA" stroke-width="1.5"/>
    <text x="505" y="247">MemGym-DR 深研</text>

    <rect x="245" y="90" width="110" height="44" rx="8" fill="#EFF6FF" stroke="#4B8BDA" stroke-width="1.5"/>
    <text x="300" y="117">CodeQA 问答</text>
  </g>

  <!-- Arrows from envs into slot -->
  <g stroke="#4B8BDA" stroke-width="1.8" fill="none" marker-end="url(#ar)">
    <path d="M150,132 L228,205"/>
    <path d="M450,132 L372,205"/>
    <path d="M150,242 L228,242"/>
    <path d="M450,242 L372,242"/>
    <path d="M300,134 L300,198"/>
  </g>

  <!-- Pluggable strategies below -->
  <text x="300" y="335" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#3D4F65">可热插拔策略</text>

  <g font-family="Helvetica,Arial,sans-serif" font-size="10.5" fill="#1E3A5F" text-anchor="middle">
    <rect x="180" y="385" width="80" height="30" rx="6" fill="#FEF3E2" stroke="#E89B4A" stroke-width="1.3"/>
    <text x="220" y="404">Summary</text>

    <rect x="270" y="385" width="80" height="30" rx="6" fill="#FEF3E2" stroke="#E89B4A" stroke-width="1.3"/>
    <text x="310" y="404">Notes</text>

    <rect x="360" y="385" width="80" height="30" rx="6" fill="#FEF3E2" stroke="#E89B4A" stroke-width="1.3"/>
    <text x="400" y="404">RAG</text>
  </g>

  <!-- connecting plug lines -->
  <g stroke="#E89B4A" stroke-width="1.5" fill="none" stroke-dasharray="3,3">
    <path d="M262,294 L222,385"/>
    <path d="M300,294 L310,385"/>
    <path d="M338,294 L398,385"/>
  </g>

  <text x="300" y="450" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#3D4F65" font-style="italic">推理模型不变 · 只换记忆零件 · 公平对比</text>
</svg>