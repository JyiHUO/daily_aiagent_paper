<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 420">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4B8BDA"/>
    </marker>
  </defs>

  <text x="300" y="36" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="18" font-weight="600" fill="#1E3A5F">记忆有用吗？取决于"找回来贵不贵"</text>

  <!-- Left scene: code / filesystem -->
  <g>
    <rect x="50" y="90" width="220" height="240" rx="10" fill="#EFF6FF" stroke="#4B8BDA" stroke-width="1.5"/>
    <text x="160" y="118" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13" font-weight="600" fill="#1E3A5F">代码场景 (SWE-Gym)</text>

    <g transform="translate(110,150)">
      <rect x="0" y="14" width="100" height="60" rx="4" fill="#FFFFFF" stroke="#3D4F65" stroke-width="1.4"/>
      <path d="M0,14 L0,4 L34,4 L42,14 Z" fill="#FFFFFF" stroke="#3D4F65" stroke-width="1.4"/>
      <line x1="14" y1="34" x2="86" y2="34" stroke="#3D4F65" stroke-width="1"/>
      <line x1="14" y1="48" x2="86" y2="48" stroke="#3D4F65" stroke-width="1"/>
      <line x1="14" y1="62" x2="70" y2="62" stroke="#3D4F65" stroke-width="1"/>
    </g>
    <text x="160" y="252" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#3D4F65">状态可重新读取</text>
    <text x="160" y="295" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="14" font-weight="600" fill="#3D4F65">记忆收益 ≈ 0  (Δ ≈ 0)</text>
  </g>

  <!-- Right scene: web / hidden state -->
  <g>
    <rect x="330" y="90" width="220" height="240" rx="10" fill="#FFF4E6" stroke="#E89B4A" stroke-width="1.5"/>
    <text x="440" y="118" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13" font-weight="600" fill="#1E3A5F">网页/对话 (WebArena, τ²)</text>

    <g transform="translate(390,148)">
      <rect x="0" y="20" width="100" height="60" rx="4" fill="#FFFFFF" stroke="#3D4F65" stroke-width="1.4"/>
      <path d="M22,20 L22,10 a28,18 0 0 1 56,0 L78,20" fill="none" stroke="#3D4F65" stroke-width="1.4"/>
      <circle cx="50" cy="48" r="7" fill="none" stroke="#E89B4A" stroke-width="1.6"/>
      <line x1="50" y1="55" x2="50" y2="68" stroke="#E89B4A" stroke-width="1.6"/>
    </g>
    <text x="440" y="252" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#3D4F65">隐藏状态 · 不记就丢</text>
    <text x="440" y="295" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="14" font-weight="600" fill="#C26A1A">记忆收益 +4.3 ~ +8.7</text>
  </g>

  <!-- Bottom takeaway -->
  <g>
    <line x1="160" y1="345" x2="270" y2="382" stroke="#4B8BDA" stroke-width="1.6" marker-end="url(#ar)"/>
    <line x1="440" y1="345" x2="330" y2="382" stroke="#4B8BDA" stroke-width="1.6" marker-end="url(#ar)"/>
    <rect x="180" y="384" width="240" height="30" rx="15" fill="#1E3A5F"/>
    <text x="300" y="404" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13" font-weight="600" fill="#FFFFFF">丢掉再找回来 · 贵不贵？</text>
  </g>
</svg>