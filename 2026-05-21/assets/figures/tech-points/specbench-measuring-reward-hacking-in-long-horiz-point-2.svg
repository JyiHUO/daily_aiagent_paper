<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400">
  <rect width="600" height="400" fill="#FAF7F2"/>

  <text x="300" y="36" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="18" font-weight="600" fill="#1E3A5F">Scale of System-Level Tasks</text>

  <!-- Baseline -->
  <line x1="70" y1="300" x2="530" y2="300" stroke="#B5C2D0" stroke-width="1"/>

  <!-- Short -->
  <rect x="100" y="280" width="80" height="20" fill="#DCE9F7" stroke="#4B8BDA" stroke-width="1.5"/>
  <text x="140" y="322" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#1E3A5F" font-weight="600">~1.5K LOC</text>
  <text x="140" y="342" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#3D4F65">JSON parser (short)</text>

  <!-- Medium -->
  <rect x="260" y="220" width="80" height="80" fill="#C5DAF0" stroke="#4B8BDA" stroke-width="1.5"/>
  <text x="300" y="322" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#1E3A5F" font-weight="600">~20K LOC</text>
  <text x="300" y="342" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#3D4F65">compiler (medium)</text>

  <!-- Long -->
  <rect x="420" y="100" width="80" height="200" fill="#A8C8E8" stroke="#1E3A5F" stroke-width="1.5"/>
  <text x="460" y="322" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#1E3A5F" font-weight="600">~110K LOC</text>
  <text x="460" y="342" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#3D4F65">OS kernel (long)</text>

  <!-- Footer -->
  <text x="300" y="380" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#B5651D" font-style="italic">30 tasks · built from scratch · C / Python / Go</text>
</svg>