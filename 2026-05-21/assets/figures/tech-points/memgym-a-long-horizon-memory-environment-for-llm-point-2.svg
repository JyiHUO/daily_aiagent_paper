<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4B8BDA"/>
    </marker>
  </defs>

  <text x="300" y="36" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="18" font-weight="bold" fill="#1E3A5F">Memory Gain = Δ (Same Task, Same Reasoner)</text>

  <!-- Left: same task -->
  <circle cx="70" cy="205" r="42" fill="#FEF3E2" stroke="#D97706" stroke-width="2"/>
  <text x="70" y="200" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#1E3A5F">Same</text>
  <text x="70" y="217" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#1E3A5F">Task</text>

  <!-- Two parallel runs -->
  <line x1="115" y1="183" x2="205" y2="135" stroke="#4B8BDA" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="115" y1="227" x2="205" y2="275" stroke="#4B8BDA" stroke-width="2" marker-end="url(#arr)"/>

  <!-- Top: no memory -->
  <rect x="215" y="100" width="180" height="70" rx="8" fill="#EFF6FF" stroke="#4B8BDA" stroke-width="2"/>
  <text x="305" y="128" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#1E3A5F">No Memory: 50.0</text>
  <text x="305" y="150" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#3D4F65">τ²-bench, Haiku 4.5</text>

  <!-- Bottom: with memory -->
  <rect x="215" y="240" width="180" height="70" rx="8" fill="#EFF6FF" stroke="#4B8BDA" stroke-width="2"/>
  <text x="305" y="268" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#1E3A5F">+ Memory: 58.7</text>
  <text x="305" y="290" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#3D4F65">rolling Summary</text>

  <!-- Subtraction to gain -->
  <line x1="400" y1="135" x2="485" y2="188" stroke="#4B8BDA" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="400" y1="275" x2="485" y2="222" stroke="#4B8BDA" stroke-width="2" marker-end="url(#arr)"/>

  <text x="438" y="210" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="22" font-weight="bold" fill="#D97706">Δ</text>

  <!-- Right: gain -->
  <rect x="492" y="173" width="96" height="60" rx="8" fill="#FEF3E2" stroke="#D97706" stroke-width="2"/>
  <text x="540" y="195" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#1E3A5F">Memory Gain</text>
  <text x="540" y="216" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="bold" fill="#D97706">+8.7 pp</text>

  <text x="300" y="370" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#3D4F65" font-style="italic">Isolating memory's contribution under a fixed reasoner</text>
</svg>