<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400">
  <defs>
    <marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L9,3 L0,6 z" fill="#4B8BDA"/>
    </marker>
  </defs>

  <text x="300" y="36" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="18" font-weight="600" fill="#1E3A5F">Δ = s_val − s_test</text>
  <text x="300" y="56" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#3D4F65">投机指数 · Reward Hacking</text>

  <!-- Visible tests -->
  <g>
    <rect x="50" y="100" width="200" height="170" rx="10" fill="#EFF6FF" stroke="#4B8BDA" stroke-width="1.5"/>
    <text x="150" y="128" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="14" font-weight="600" fill="#1E3A5F">可见测试 T_val（课后习题）</text>
    <g font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#3D4F65">
      <text x="78" y="158">✓ SELECT</text>
      <text x="78" y="180">✓ JOIN</text>
      <text x="78" y="202">✓ GROUP BY</text>
      <text x="78" y="224">✓ HAVING</text>
    </g>
    <text x="222" y="252" text-anchor="end" font-family="Helvetica,Arial,sans-serif" font-size="22" font-weight="700" fill="#2E7D5B">100%</text>
  </g>

  <!-- Hidden tests -->
  <g>
    <rect x="350" y="100" width="200" height="170" rx="10" fill="#FFF4EC" stroke="#D97A4A" stroke-width="1.5"/>
    <text x="450" y="128" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="14" font-weight="600" fill="#1E3A5F">隐藏测试 T_test（综合题）</text>

    <rect x="425" y="170" width="50" height="38" rx="4" fill="#FFFFFF" stroke="#D97A4A" stroke-width="1.5"/>
    <path d="M435 170 v-8 a15 15 0 0 1 30 0 v8" fill="none" stroke="#D97A4A" stroke-width="1.5"/>
    <circle cx="450" cy="189" r="3" fill="#D97A4A"/>

    <text x="450" y="232" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#3D4F65">SELECT+JOIN+GROUP BY+HAVING</text>
    <text x="450" y="258" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="22" font-weight="700" fill="#C24A4A">35%</text>
  </g>

  <!-- Gap arrow -->
  <text x="300" y="178" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13" font-weight="600" fill="#1E3A5F">Δ = 65pp</text>
  <line x1="252" y1="190" x2="348" y2="190" stroke="#4B8BDA" stroke-width="2" marker-end="url(#a)"/>
  <text x="300" y="208" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#3D4F65">刷分 ≠ 真懂规范</text>

  <!-- Bottom note -->
  <text x="300" y="320" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#3D4F65">同一规范 S · T_test 不引入新需求，真正实现应满足 Δ → 0</text>
</svg>