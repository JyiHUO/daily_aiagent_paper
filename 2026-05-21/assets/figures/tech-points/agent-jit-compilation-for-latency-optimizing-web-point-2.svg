<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 420">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4B8BDA"/>
    </marker>
    <marker id="arRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#C77B6A"/>
    </marker>
  </defs>

  <text x="300" y="38" text-anchor="middle" font-family="Helvetica,Arial" font-size="18" font-weight="600" fill="#1E3A5F">Tool as Contract</text>
  <text x="300" y="58" text-anchor="middle" font-family="Helvetica,Arial" font-size="12" fill="#3D4F65">pre / post state invariants</text>

  <!-- Tool A: navigate -->
  <rect x="60" y="110" width="170" height="100" rx="10" fill="#EFF6FF" stroke="#4B8BDA" stroke-width="1.8"/>
  <text x="145" y="138" text-anchor="middle" font-family="Helvetica,Arial" font-size="14" font-weight="600" fill="#1E3A5F">navigate</text>
  <text x="145" y="166" text-anchor="middle" font-family="Helvetica,Arial" font-size="11" fill="#3D4F65">pre: any</text>
  <text x="145" y="184" text-anchor="middle" font-family="Helvetica,Arial" font-size="11" fill="#3D4F65">post: detail page</text>

  <!-- Tool B: list-items -->
  <rect x="370" y="110" width="170" height="100" rx="10" fill="#EFF6FF" stroke="#4B8BDA" stroke-width="1.8"/>
  <text x="455" y="138" text-anchor="middle" font-family="Helvetica,Arial" font-size="14" font-weight="600" fill="#1E3A5F">list-items</text>
  <text x="455" y="166" text-anchor="middle" font-family="Helvetica,Arial" font-size="11" fill="#3D4F65">pre: detail page</text>
  <text x="455" y="184" text-anchor="middle" font-family="Helvetica,Arial" font-size="11" fill="#3D4F65">post: items shown</text>

  <!-- Valid match arrow -->
  <line x1="230" y1="160" x2="368" y2="160" stroke="#4B8BDA" stroke-width="2" marker-end="url(#ar)"/>
  <text x="300" y="150" text-anchor="middle" font-family="Helvetica,Arial" font-size="11" fill="#1E3A5F">post ⊆ pre  ✓</text>

  <!-- Invalid skip: from navigate-skip down to rejected, then attempt list-items -->
  <path d="M 145 210 C 145 270 200 300 220 320" fill="none" stroke="#C77B6A" stroke-width="2" stroke-dasharray="5,4"/>
  <path d="M 380 320 C 410 300 455 270 455 212" fill="none" stroke="#C77B6A" stroke-width="2" stroke-dasharray="5,4" marker-end="url(#arRed)"/>

  <text x="170" y="262" font-family="Helvetica,Arial" font-size="11" fill="#9A4A38">skip navigate</text>
  <text x="380" y="262" font-family="Helvetica,Arial" font-size="11" fill="#9A4A38">call without pre</text>

  <!-- Rejected stamp -->
  <rect x="220" y="320" width="160" height="56" rx="8" fill="#FBECE6" stroke="#C77B6A" stroke-width="1.8"/>
  <text x="300" y="343" text-anchor="middle" font-family="Helvetica,Arial" font-size="13" font-weight="600" fill="#9A4A38">precondition violated</text>
  <text x="300" y="362" text-anchor="middle" font-family="Helvetica,Arial" font-size="11" fill="#9A4A38">plan rejected at compile</text>
</svg>